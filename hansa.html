{id:"s1-ox01",unit:"s1",type:"ox",question:"제1차 세계 대전은 사라예보 사건을 계기로 일어났다.",choices:["O","X"],answer:0,explain:"맞다. 오스트리아·헝가리 제국 황태자 부부가 암살된 사건이다.",era:"세계대전의 소용돌이"},
{id:"s1-ox02",unit:"s1",type:"ox",question:"일본은 루거우차오 사건을 빌미로 아시아·태평양 전쟁을 일으켰다.",choices:["O","X"],answer:1,explain:"루거우차오 사건 → 중일 전쟁(1937). 아시아·태평양 전쟁(1941)의 계기는 진주만 기습이다.",era:"세계대전의 소용돌이"},
{id:"s1-ox03",unit:"s1",type:"ox",question:"대공황 이후 이탈리아·독일·일본에서는 전체주의가 확산되었다.",choices:["O","X"],answer:0,explain:"맞다. 경제 기반이 빈약해 뉴딜이나 블록 경제 같은 대응이 어려웠고, 침략 전쟁으로 위기를 넘으려 했다.",era:"세계대전의 소용돌이"},
{id:"s2-ox04",unit:"s2",type:"ox",question:"조선 총독은 일왕에게 직속되어 일본 의회나 내각의 통제를 거의 받지 않았다.",choices:["O","X"],answer:0,explain:"맞다. 입법·사법·행정권에 군사권까지 한 손에 쥐고 있었다.",era:"칼을 찬 교사의 시대"},
{id:"s2-ox05",unit:"s2",type:"ox",question:"중추원은 한국인의 의견을 대변하는 의결 기구였다.",choices:["O","X"],answer:1,explain:"총독의 자문 기구에 불과했고 친일파로 구성되어 3·1 운동 전까지 한 번도 소집되지 않았다.",era:"칼을 찬 교사의 시대"},
{id:"s2-ox06",unit:"s2",type:"ox",question:"헌병 경찰은 정식 재판 없이 즉결 심판권을 행사할 수 있었다.",choices:["O","X"],answer:0,explain:"맞다. 구류·벌금은 물론 태형까지 재판 없이 집행했다.",era:"칼을 찬 교사의 시대"},
{id:"s2-ox07",unit:"s2",type:"ox",question:"조선 태형령은 한국인과 일본인 모두에게 적용되었다.",choices:["O","X"],answer:1,explain:"제13조에 본령은 조선인에 한하여 적용한다고 못 박혀 있다.",era:"칼을 찬 교사의 시대"},
{id:"s2-ox08",unit:"s2",type:"ox",question:"토지 조사 사업은 기간 안에 신고해야 소유권을 인정받는 방식이었다.",choices:["O","X"],answer:0,explain:"맞다. 절차가 복잡해 신고를 놓친 땅과 국공유지를 총독부가 차지했다.",era:"칼을 찬 교사의 시대"},
{id:"s2-ox09",unit:"s2",type:"ox",question:"1910년대 회사령은 회사 설립을 신고제로 운영했다.",choices:["O","X"],answer:1,explain:"허가제다. 신고제로 바뀐 건 1920년 회사령 폐지 때이고, 그것도 일본 기업의 진출을 돕기 위해서였다.",era:"칼을 찬 교사의 시대"},
{id:"s2-ox10",unit:"s2",type:"ox",question:"토지 조사 사업으로 총독부가 차지한 땅은 동양 척식 주식회사나 일본인에게 넘어갔다.",choices:["O","X"],answer:0,explain:"맞다. 그것도 헐값에 넘겼다.",era:"칼을 찬 교사의 시대"},
{id:"s3-ox11",unit:"s3",type:"ox",question:"문화 정치 시기에 문관 총독이 여러 명 임명되었다.",choices:["O","X"],answer:1,explain:"관제만 고쳤을 뿐 문관 총독은 단 한 명도 임명되지 않았다. 문화 정치가 기만적이라는 대표 근거다.",era:"가면을 쓴 통치"},
{id:"s3-ox12",unit:"s3",type:"ox",question:"보통 경찰제로 바뀌면서 경찰 인원과 관서 수가 줄어들었다.",choices:["O","X"],answer:1,explain:"오히려 대폭 늘어났다. 이름만 바꾸고 감시는 더 촘촘해졌다.",era:"가면을 쓴 통치"},
{id:"s3-ox13",unit:"s3",type:"ox",question:"치안 유지법은 사유 재산 제도를 부인하는 결사를 처벌 대상으로 삼았다.",choices:["O","X"],answer:0,explain:"맞다. 그래서 사회주의자 탄압에 특히 많이 쓰였다.",era:"가면을 쓴 통치"},
{id:"s3-ox14",unit:"s3",type:"ox",question:"도 평의회와 부·면 협의회는 의결권을 가진 자치 기구였다.",choices:["O","X"],answer:1,explain:"의결권이 없는 자문 기구였다. 지방 행정 참여는 선전에 불과했다.",era:"가면을 쓴 통치"},
{id:"s3-ox15",unit:"s3",type:"ox",question:"산미 증식 계획으로 쌀 생산량은 늘었지만 한국의 식량 사정은 오히려 나빠졌다.",choices:["O","X"],answer:0,explain:"맞다. 생산은 목표에 못 미쳤는데 반출은 예정대로 진행됐기 때문이다.",era:"가면을 쓴 통치"},
{id:"s3-ox16",unit:"s3",type:"ox",question:"산미 증식 계획의 증산 비용은 총독부가 부담했다.",choices:["O","X"],answer:1,explain:"비료 대금·수리 조합비가 농민에게 전가되어 자작농이 소작농·화전민·토막민으로 몰락했다.",era:"가면을 쓴 통치"},
{id:"s3-ox17",unit:"s3",type:"ox",question:"1923년 일본 상품에 대한 관세가 대부분 폐지되면서 한국인 기업이 타격을 입었다.",choices:["O","X"],answer:0,explain:"맞다. 회사령 폐지로 한국인 기업이 늘긴 했지만 대부분 영세해서 값싼 일본 제품을 당해내지 못했다.",era:"가면을 쓴 통치"},
{id:"s4-ox18",unit:"s4",type:"ox",question:"내선일체는 일본인과 한국인이 같은 조상에서 나왔다는 주장이다.",choices:["O","X"],answer:1,explain:"그건 일선동조론이다. 내선일체는 내지(일본)와 한국이 한몸이라는 뜻이다.",era:"이름을 빼앗긴 시대"},
{id:"s4-ox19",unit:"s4",type:"ox",question:"황국 신민 서사는 매일 아침 궁성 요배와 함께 강요되었다.",choices:["O","X"],answer:0,explain:"맞다. 신사 참배까지 세트로 강요했고, 거부하면 처벌하고 학교도 폐쇄했다.",era:"이름을 빼앗긴 시대"},
{id:"s4-ox20",unit:"s4",type:"ox",question:"일제는 소학교의 명칭을 국민학교로 바꾸었다.",choices:["O","X"],answer:0,explain:"맞다. 황국 신민의 학교라는 뜻이다.",era:"이름을 빼앗긴 시대"},
{id:"s4-ox21",unit:"s4",type:"ox",question:"남면북양 정책은 남부에서 양을 기르고 북부에서 면화를 재배하게 한 것이다.",choices:["O","X"],answer:1,explain:"반대다. 남부에서 면화, 북부에서 양. 이름 순서 그대로다.",era:"이름을 빼앗긴 시대"},
{id:"s4-ox22",unit:"s4",type:"ox",question:"식민지 공업화로 세워진 중화학 공업 공장은 주로 북부 지방에 몰렸다.",choices:["O","X"],answer:0,explain:"맞다. 석탄·철 등 지하자원이 풍부해서다. 그 결과 지역 간 산업 불균형이 심해졌다.",era:"이름을 빼앗긴 시대"},
{id:"s4-ox23",unit:"s4",type:"ox",question:"국가 총동원법은 중일 전쟁을 일으킨 뒤 공포되었다.",choices:["O","X"],answer:0,explain:"맞다. 1937년 중일 전쟁 → 1938년 국가 총동원법. 이 법이 징용·징병·공출의 근거가 된다.",era:"이름을 빼앗긴 시대"},
{id:"s4-ox24",unit:"s4",type:"ox",question:"조선어 학회 사건은 치안 유지법 위반을 적용해 이루어졌다.",choices:["O","X"],answer:0,explain:"맞다. 1942년, 우리말 연구를 독립운동으로 몰아 회원들을 구속했다.",era:"이름을 빼앗긴 시대"},
{id:"s5-ox25",unit:"s5",type:"ox",question:"독립 의군부는 민주 공화제 국가 건설을 목표로 하였다.",choices:["O","X"],answer:1,explain:"독립 의군부는 복벽주의(고종 복위). 대한 광복회가 민주 공화제다. 교과서가 가장 자주 묻는 대비다.",era:"국경을 넘은 사람들"},
{id:"s5-ox26",unit:"s5",type:"ox",question:"대한 광복회는 박상진 등이 주도하였다.",choices:["O","X"],answer:0,explain:"맞다. 친일파를 처단하고 만주에 무관 학교를 세우려 했다.",era:"국경을 넘은 사람들"},
{id:"s5-ox27",unit:"s5",type:"ox",question:"경학사와 신흥 강습소는 북간도에 세워졌다.",choices:["O","X"],answer:1,explain:"서간도 삼원보다. 북간도는 간민회·명동 학교·중광단이다.",era:"국경을 넘은 사람들"},
{id:"s5-ox28",unit:"s5",type:"ox",question:"중광단은 이후 북로 군정서로 발전하였다.",choices:["O","X"],answer:0,explain:"맞다. 서일 등 대종교 간부들이 만들었고, 청산리에서 김좌진이 이끄는 그 부대가 된다.",era:"국경을 넘은 사람들"},
{id:"s5-ox29",unit:"s5",type:"ox",question:"권업회와 신한촌은 연해주에서 조직되고 건설되었다.",choices:["O","X"],answer:0,explain:"맞다. 이후 이상설·이동휘를 정·부통령으로 한 대한 광복군 정부가 세워진다.",era:"국경을 넘은 사람들"},
{id:"s5-ox30",unit:"s5",type:"ox",question:"대동단결 선언은 국민 주권론의 입장에서 발표되었다.",choices:["O","X"],answer:0,explain:"맞다. 1917년, 임시 정부 수립의 이론적 바탕이 되었다.",era:"국경을 넘은 사람들"},
{id:"s6-ox31",unit:"s6",type:"ox",question:"3·1 운동은 순종의 국장일에 즈음하여 계획되었다.",choices:["O","X"],answer:1,explain:"고종의 국장일이다. 순종의 장례일에 일어난 건 6·10 만세 운동(1926).",era:"만세의 봄"},
{id:"s6-ox32",unit:"s6",type:"ox",question:"민족 대표는 탑골 공원에서 독립 선언식을 거행하였다.",choices:["O","X"],answer:1,explain:"시위가 과격해질 것을 우려해 태화관에서 했다. 탑골 공원에서는 학생과 시민이 선언서를 낭독했다.",era:"만세의 봄"},
{id:"s6-ox33",unit:"s6",type:"ox",question:"2·8 독립 선언은 도쿄에서 유학생들이 발표하였다.",choices:["O","X"],answer:0,explain:"맞다. 조선 청년 독립단 이름으로 발표했고 3·1 운동의 직접적 계기가 되었다.",era:"만세의 봄"},
{id:"s6-ox34",unit:"s6",type:"ox",question:"3·1 운동은 처음부터 끝까지 평화적인 만세 시위로만 전개되었다.",choices:["O","X"],answer:1,explain:"헌병 경찰의 무자비한 진압에 무력 투쟁으로 발전했다. 일부 농민은 경찰 관서와 헌병대를 습격했다.",era:"만세의 봄"},
{id:"s6-ox35",unit:"s6",type:"ox",question:"3·1 운동은 중국의 5·4 운동에 영향을 주었다.",choices:["O","X"],answer:0,explain:"맞다. 대표적인 반제국주의 민족 운동으로 세계사적 의의를 갖는다.",era:"만세의 봄"},
{id:"s6-ox36",unit:"s6",type:"ox",question:"제암리 학살은 경기도 화성에서 일어났다.",choices:["O","X"],answer:0,explain:"맞다. 주민을 교회에 모아 놓고 문을 잠근 채 총을 쏘고 불을 질렀다.",era:"만세의 봄"},
{id:"s7-ox37",unit:"s7",type:"ox",question:"대한민국 임시 정부는 삼권 분립에 기초한 민주 공화제를 채택하였다.",choices:["O","X"],answer:0,explain:"맞다. 임시 의정원(입법)·국무원(행정)·법원(사법). 우리 역사상 최초다.",era:"황제의 나라에서 국민의 나라로"},
{id:"s7-ox38",unit:"s7",type:"ox",question:"임시 정부 통합 과정에서 무장 투쟁에 유리한 간도에 정부를 두기로 하였다.",choices:["O","X"],answer:1,explain:"상하이로 정했다. 조계 지역이 많아 외교 활동에 유리했기 때문이다.",era:"황제의 나라에서 국민의 나라로"},
{id:"s7-ox39",unit:"s7",type:"ox",question:"연통제는 국내에 설치된 비밀 행정 조직이었다.",choices:["O","X"],answer:0,explain:"맞다. 군자금 조달과 문서·명령 전달을 맡았다. 통신 기관은 교통국이다.",era:"황제의 나라에서 국민의 나라로"},
{id:"s7-ox40",unit:"s7",type:"ox",question:"구미 위원부는 상하이에 설치되었다.",choices:["O","X"],answer:1,explain:"미국에 설치했다. 이승만을 중심으로 외교 활동을 벌였다.",era:"황제의 나라에서 국민의 나라로"},
{id:"s7-ox41",unit:"s7",type:"ox",question:"국민 대표 회의는 개조파와 창조파의 대립으로 결렬되었다.",choices:["O","X"],answer:0,explain:"맞다. 이후 많은 독립운동가가 이탈해 임시 정부가 침체에 빠진다.",era:"황제의 나라에서 국민의 나라로"},
{id:"s7-ox42",unit:"s7",type:"ox",question:"이승만이 탄핵된 뒤 제2대 대통령이 된 인물은 박은식이다.",choices:["O","X"],answer:0,explain:"맞다. 이어서 헌법을 고쳐 국무령 중심의 집단 지도 체제로 바꾸었다.",era:"황제의 나라에서 국민의 나라로"},
{id:"s8-ox43",unit:"s8",type:"ox",question:"봉오동 전투는 김좌진이 지휘하였다.",choices:["O","X"],answer:1,explain:"봉오동은 홍범도(+안무·최진동), 청산리가 김좌진(+홍범도)이다. 봉-홍, 청-김.",era:"봉오동에서 대전자령까지"},
{id:"s8-ox44",unit:"s8",type:"ox",question:"훈춘 사건은 일제가 만주 출병의 구실을 만들려고 꾸민 자작극이다.",choices:["O","X"],answer:0,explain:"맞다. 중국 마적을 매수해 훈춘의 일본 영사관을 공격하게 했다.",era:"봉오동에서 대전자령까지"},
{id:"s8-ox45",unit:"s8",type:"ox",question:"자유시 참변은 일본군의 공격으로 독립군이 희생된 사건이다.",choices:["O","X"],answer:1,explain:"러시아 적군이 무장 해제하는 과정에서 벌어졌다. 일본군의 보복 학살은 간도 참변이다.",era:"봉오동에서 대전자령까지"},
{id:"s8-ox46",unit:"s8",type:"ox",question:"3부는 민정 조직과 군정 조직을 갖춘 사실상의 자치 정부였다.",choices:["O","X"],answer:0,explain:"맞다. 세금까지 거두어 운영했다. 참의부(남만주)·정의부(지린)·신민부(북만주).",era:"봉오동에서 대전자령까지"},
{id:"s8-ox47",unit:"s8",type:"ox",question:"미쓰야 협정은 일제가 만주 군벌과 맺은 독립군 탄압 협정이다.",choices:["O","X"],answer:0,explain:"맞다. 중국 관헌이 독립운동가를 잡아 일제에 넘기고 포상금을 받았다.",era:"봉오동에서 대전자령까지"},
{id:"s8-ox48",unit:"s8",type:"ox",question:"3부 통합 운동의 결과 완전한 통합이 이루어졌다.",choices:["O","X"],answer:1,explain:"국민부(남만주)와 혁신 의회(북만주)로 갈렸다. 각각 조선 혁명군, 한국 독립군으로 이어진다.",era:"봉오동에서 대전자령까지"},
{id:"s8-ox49",unit:"s8",type:"ox",question:"영릉가 전투와 흥경성 전투는 지청천이 이끈 한국 독립군의 전투이다.",choices:["O","X"],answer:1,explain:"그건 양세봉의 조선 혁명군이다. 지청천의 한국 독립군은 쌍성보·동경성·대전자령.",era:"봉오동에서 대전자령까지"},
{id:"s8-ox50",unit:"s8",type:"ox",question:"동북 항일 연군 소속 한인 유격대원들은 조국 광복회를 조직하였다.",choices:["O","X"],answer:0,explain:"맞다. 중국 공산당의 동북 인민 혁명군 → 동북 항일 연군 순으로 발전했다.",era:"봉오동에서 대전자령까지"},
{id:"s1-od1",unit:"s1",type:"order",question:"일어난 순서대로 놓으세요",choices:["1914|제1차 세계 대전 발발","1917|러시아 혁명","1919|파리 강화 회의","1921|워싱턴 회의"],answer:null,explain:"사라예보 사건으로 시작된 대전이 끝나고, 그 뒤처리를 위해 파리에 모였다.",era:"세계대전의 소용돌이"},
{id:"s1-od2",unit:"s1",type:"order",question:"일어난 순서대로 놓으세요",choices:["1929|대공황","1931|만주 사변","1937|중일 전쟁","1939|제2차 세계 대전","1941|아시아·태평양 전쟁"],answer:null,explain:"대공황 → 전체주의 → 침략 전쟁으로 이어지는 흐름이다.",era:"세계대전의 소용돌이"},
{id:"s2-od1",unit:"s2",type:"order",question:"일어난 순서대로 놓으세요",choices:["1910. 8.|국권 피탈","1910. 12.|회사령 공포","1912. 3.|조선 태형령","1912. 8.|토지 조사령","1918|토지 조사 사업 종결"],answer:null,explain:"강점 직후부터 무단 통치의 법령이 줄줄이 만들어졌다.",era:"칼을 찬 교사의 시대"},
{id:"s2-od2",unit:"s2",type:"order",question:"일어난 순서대로 놓으세요",choices:["1910|헌병 경찰제 실시","1912|조선 태형령 시행","1918|토지 조사 사업 종결","1919|3·1 운동"],answer:null,explain:"무단 통치가 3·1 운동을 불러왔다.",era:"칼을 찬 교사의 시대"},
{id:"s3-od1",unit:"s3",type:"order",question:"일어난 순서대로 놓으세요",choices:["1919|3·1 운동","1919. 9.|사이토 부임, 문화 정치 표방","1920|산미 증식 계획 시작","1923|일본 상품 관세 철폐","1925|치안 유지법 제정"],answer:null,explain:"3·1 운동 → 문화 정치 전환 → 경제 수탈 확대 → 사상 탄압 강화.",era:"가면을 쓴 통치"},
{id:"s4-od1",unit:"s4",type:"order",question:"일어난 순서대로 놓으세요",choices:["1931|만주 사변","1937|중일 전쟁·황국 신민 서사","1938|국가 총동원법","1939|창씨개명","1941|아시아·태평양 전쟁"],answer:null,explain:"침략 전쟁이 커질수록 동원과 말살도 심해졌다.",era:"이름을 빼앗긴 시대"},
{id:"s4-od2",unit:"s4",type:"order",question:"일어난 순서대로 놓으세요",choices:["1938|국가 총동원법","1939|창씨개명","1940|조선일보·동아일보 폐간","1942|조선어 학회 사건","1944|여자 정신 근로령"],answer:null,explain:"전시 동원 체제의 법령과 탄압 순서다.",era:"이름을 빼앗긴 시대"},
{id:"s5-od1",unit:"s5",type:"order",question:"일어난 순서대로 놓으세요",choices:["1910|대한인 국민회 결성","1912|독립 의군부 조직","1914|대한 광복군 정부 수립","1915|대한 광복회 조직","1917|대동단결 선언"],answer:null,explain:"국내 비밀 결사와 국외 기지가 나란히 자라났다.",era:"국경을 넘은 사람들"},
{id:"s6-od1",unit:"s6",type:"order",question:"일어난 순서대로 놓으세요",choices:["1919. 1.|고종 서거","1919. 2. 8.|2·8 독립 선언","1919. 3. 1.|독립 선언과 만세 시위","1919. 4.|제암리 학살","1919. 9.|대한민국 임시 정부 통합"],answer:null,explain:"3·1 운동은 한 해 안에 벌어진 일이라 월까지 따져야 한다.",era:"만세의 봄"},
{id:"s7-od1",unit:"s7",type:"order",question:"일어난 순서대로 놓으세요",choices:["1919. 3.|3·1 운동","1919. 4.|상하이 임시 정부 수립","1919. 9.|임시 정부 통합","1923|국민 대표 회의","1925|이승만 탄핵, 박은식 취임"],answer:null,explain:"수립에서 통합, 그리고 위기와 개편으로 이어진다.",era:"황제의 나라에서 국민의 나라로"},
{id:"s8-od1",unit:"s8",type:"order",question:"일어난 순서대로 놓으세요",choices:["1920. 6.|봉오동 전투","1920. 10.|청산리 대첩","1920~21|간도 참변","1921|자유시 참변","1924~25|3부 성립"],answer:null,explain:"승리 뒤에 곧바로 두 번의 참변이 따라왔다.",era:"봉오동에서 대전자령까지"},
{id:"s8-od2",unit:"s8",type:"order",question:"일어난 순서대로 놓으세요",choices:["1925|미쓰야 협정","1929|3부 통합 운동","1932|영릉가 전투","1933|대전자령 전투","1934|양세봉 전사"],answer:null,explain:"탄압 → 재편 → 한중 연합 작전으로 이어진다.",era:"봉오동에서 대전자령까지"},
/* ── 사료 제시형 · 교과서에 실린 원문 ── */
{id:"s2-src1",unit:"s2",type:"source",question:"제1조 다음 각호에 해당하는 자는 구류 또는 벌금에 처한다.\n19. 함부로 대중을 모아 관공서에 청원 또는 진정을 한 자\n32. 경찰 관서에서 특별히 지시 또는 명령한 사항을 위반한 자\n— 『조선 총독부 관보』, 1912",choices:["경찰범 처벌 규칙","치안 유지법","국가 총동원법","조선 태형령"],answer:0,explain:"무단 통치기의 경찰범 처벌 규칙. 일상까지 경찰이 통제했다.",era:"칼을 찬 교사의 시대"},
{id:"s2-src2",unit:"s2",type:"source",question:"제1조 3개월 이하의 징역 또는 구류에 처해야 하는 자는 상황에 따라 태형에 처할 수 있다.\n제13조 본령은 조선인에 한하여 적용한다.\n— 『조선 총독부 관보』 호외, 1912",choices:["조선 태형령","경찰범 처벌 규칙","회사령","토지 조사령"],answer:0,explain:"제13조가 핵심. 한국인에게만 적용한 노골적 차별 법령이다.",era:"칼을 찬 교사의 시대"},
{id:"s2-src3",unit:"s2",type:"source",question:"제4조 토지의 소유자는 조선 총독이 정하는 기간 내에 그 주소, 성명·명칭 및 소유지의 소재, 지목, 자번호, 사표, 등급, 지적, 결수를 임시 토지 조사 국장에게 신고하여야 한다.\n— 『조선 총독부 관보』, 1912",choices:["토지 조사령","회사령","방곡령","조선 태형령"],answer:0,explain:"기한 안에 신고해야 소유권을 인정받는 기한부 신고제. 놓친 땅은 총독부가 차지했다.",era:"칼을 찬 교사의 시대"},
{id:"s2-src4",unit:"s2",type:"source",question:"제1조 회사의 설립은 조선 총독의 허가를 받아야 한다.\n제5조 …조선 총독은 사업의 정지·금지, 지점의 폐쇄 또는 회사의 해산을 명령할 수 있다.\n— 『조선 총독부 관보』, 1910",choices:["회사령","토지 조사령","산미 증식 계획","국가 총동원법"],answer:0,explain:"허가제로 한국인 기업의 성장을 막았다. 1920년에 폐지되며 신고제로 바뀐다.",era:"칼을 찬 교사의 시대"},
{id:"s3-src1",unit:"s3",type:"source",question:"• 친일 인물을 물색하고, 각기 계급 및 사정에 따라 여러 친일적 단체를 만들게 한 후 편의와 원조를 제공하여 충분히 활동하게 한다.\n• 조선인 부호들과 민중을 대립하게 하고, 이들에게 일본 자본을 공급해 친일화한다.\n— 조선 총독부, 『사이토 마코토 문서』",choices:["문화 정치의 민족 분열 의도","무단 통치의 강화 방침","민족 말살 통치의 지침","전시 동원 체제의 계획"],answer:0,explain:"이른바 문화 정치의 속셈이 그대로 드러난 문서다.",era:"가면을 쓴 통치"},
{id:"s3-src2",unit:"s3",type:"source",question:"제1조 국체를 변혁하거나 사유 재산 제도를 부인할 목적으로 결사를 조직하거나 또는 그 사정을 알고 이에 가입한 자는 10년 이하의 징역 또는 금고에 처한다.\n— 『조선 총독부 관보』, 1925",choices:["치안 유지법","경찰범 처벌 규칙","조선 태형령","국가 총동원법"],answer:0,explain:"사유 재산 제도를 부인할 목적이라는 문구 때문에 사회주의자 탄압에 특히 쓰였다.",era:"가면을 쓴 통치"},
{id:"s3-src3",unit:"s3",type:"source",question:"(관제 개정의 취지는) 시세에 맞추어 시정의 편리함을 도모하는 데 있다. …… 문화적 제도의 혁신에 의하여 조선인을 이끌어서 …… 정치상·사회상의 대우에서 일본인과 동일하게 취급하려는 궁극적 목적을 달성하고자 한다.\n— 『조선 총독부 관보』, 1919. 9.",choices:["문화 정치를 표방한 시정 방침","무단 통치의 시작을 알린 훈시","황국 신민화 정책의 선언","병참 기지화 정책의 지침"],answer:0,explain:"3·1 운동 뒤 새 총독 사이토 마코토가 발표했다. 문관 총독은 끝내 한 명도 나오지 않았다.",era:"가면을 쓴 통치"},
{id:"s4-src1",unit:"s4",type:"source",question:"제1조 국가 총동원이란 전시에 국방 목적의 달성을 위해 국가의 전력을 가장 유효하게 발휘하도록 인적·물적 자원을 통제 운용하는 것을 가리킨다.\n제4조 제국 신민을 징용하여 총동원 업무에 종사하게 할 수 있다.\n— 『조선 총독부 관보』, 1938",choices:["국가 총동원법","치안 유지법","회사령","조선 태형령"],answer:0,explain:"중일 전쟁을 일으킨 뒤 공포했다. 강제 징용·징병·공출의 법적 근거가 된다.",era:"이름을 빼앗긴 시대"},
{id:"s4-src2",unit:"s4",type:"source",question:"1. 우리는 대일본 제국의 신민입니다.\n2. 우리는 마음을 합하여 천황 폐하에게 충의를 다합니다.\n3. 우리는 인고 단련하여 훌륭하고 강한 국민이 되겠습니다.\n— 조선 총독부, 『시정 30년사』",choices:["황국 신민 서사","국민학교 규정","황국 신민화 교육령","국민정신 총동원 요강"],answer:0,explain:"아동용 황국 신민 서사. 매일 외우게 하고 궁성 요배를 시켰다.",era:"이름을 빼앗긴 시대"},
{id:"s4-src3",unit:"s4",type:"source",question:"이번 사변에서 우리 조선은 상당량의 군수 물자를 공출하여 …… 일본으로부터의 해상 수송이 차단당하는 경우가 있더라도, 조선의 힘만으로 보충할 수 있도록 조선 산업 분야를 다각화하며 특히 군수 공업의 육성에 역점을 두어야 한다.\n— 『동아일보』, 1938",choices:["병참 기지화 정책","산미 증식 계획","남면북양 정책","토지 조사 사업"],answer:0,explain:"한반도를 전쟁 물자 공급 기지로 삼겠다는 조선 총독의 훈시다.",era:"이름을 빼앗긴 시대"},
{id:"s5-src1",unit:"s5",type:"source",question:"1. 일반 부호로부터 의연금을 받는 한편, 일본인이 불법 징수한 세금을 압수하여 무장을 준비한다.\n2. 남북 만주에 사관 학교를 설치하고 인재를 양성하여 사관으로 채용한다.\n7. 무력이 완비되는 대로 일본인 섬멸전을 단행하여 최후의 목적을 이룬다.",choices:["대한 광복회 강령","독립 의군부 강령","신민회 4대 강령","대한민국 건국 강령"],answer:0,explain:"박상진이 주축이 된 대한 광복회. 독립 전쟁으로 국권을 되찾자는 공화주의 노선이다.",era:"국경을 넘은 사람들"},
{id:"s5-src2",unit:"s5",type:"source",question:"융희 황제가 삼보(영토, 인민, 주권)를 포기한 경술년 8월 29일은 우리 동지가 삼보를 계승한 날이니 …… 저 황제권 소멸의 때가 즉 민권 발생의 때이고, 구한국의 마지막 날은 즉 신한국 최초의 날이니.",choices:["대동단결 선언","2·8 독립 선언","3·1 독립 선언서","대한민국 임시 헌장"],answer:0,explain:"1917년 신규식·박은식·신채호·조소앙 등이 발표한 국민 주권론. 임시 정부 수립의 밑돌이 된다.",era:"국경을 넘은 사람들"},
{id:"s5-src3",unit:"s5",type:"source",question:"8월 초에 여러 형제분이 일시에 협력하여 만주로 갈 준비를 하였다. 비밀리에 땅과 집을 파는데, 여러 집을 일시에 파니 이 얼마나 어려웠겠는가.\n— 이은숙, 『서간도 시종기』",choices:["이회영 일가의 서간도 망명","안창호의 미주 망명","김구의 상하이 망명","이상설의 연해주 망명"],answer:0,explain:"대부호였던 이회영 일가가 전 재산을 처분해 삼원보에 독립운동 기지를 세웠다.",era:"국경을 넘은 사람들"},
{id:"s6-src1",unit:"s6",type:"source",question:"3. 본 단체는 만국 평화 회의의 민족 자결주의를 우리 민족에게도 적용할 것을 청구한다.\n4. 앞의 요구가 실현되지 않을 경우, 우리 민족은 일본에 대하여 영원히 혈전을 벌일 것을 선언한다.",choices:["2·8 독립 선언","3·1 독립 선언서","대동단결 선언","대한민국 건국 강령"],answer:0,explain:"도쿄 유학생들이 조선 청년 독립단 이름으로 발표했다. 3·1 운동의 직접적 계기다.",era:"만세의 봄"},
{id:"s6-src2",unit:"s6",type:"source",question:"우리는 오늘 우리 조선이 독립국임과 조선인이 자주민임을 선언하노라. 우리는 이를 세계 모든 나라에 알려 인류가 모두 평등하다는 큰 뜻을 분명히 하고, 우리 후손이 민족 스스로 살아갈 정당한 권리를 영원히 누리게 할 것이다.",choices:["3·1 독립 선언서","2·8 독립 선언","대동단결 선언","헌의 6조"],answer:0,explain:"1919년 3월 1일. 민족 대표는 태화관에서, 학생과 시민은 탑골 공원에서 낭독했다.",era:"만세의 봄"},
{id:"s6-src3",unit:"s6",type:"source",question:"피고 한이순 등은 천안 사립 광명학교 학생으로 독립 만세 운동을 공모하고 3월 20일 학생 약 80명을 인솔하여 양대리 시장에 이르러 국기를 흔들고 조선 독립 만세를 불렀다.\n— 공주 지방 법원, 1919",choices:["3·1 운동에 참여한 학생의 판결문","6·10 만세 운동 참가자 신문 조서","광주 학생 항일 운동 재판 기록","물산 장려 운동 관련 문서"],answer:0,explain:"농촌 시위는 주로 장날에 열렸다. 최연소 수감자 한이순은 당시 13세였다.",era:"만세의 봄"},
{id:"s7-src1",unit:"s7",type:"source",question:"유구한 역사와 전통에 빛나는 우리 대한 국민은 3·1 운동으로 건립된 대한민국 임시 정부의 법통과 불의에 항거한 4·19 민주 이념을 계승하고 …….",choices:["대한민국 헌법 전문","대한민국 임시 헌장","대한민국 건국 강령","제헌 헌법 제1조"],answer:0,explain:"지금 헌법이 임시 정부의 법통을 잇는다고 못 박고 있다.",era:"황제의 나라에서 국민의 나라로"},
{id:"s7-src2",unit:"s7",type:"source",question:"3·1 운동에서 나타난 민족적 열망을 바탕으로 출범한 임시 정부는 민족의 대표 기관이다. 그러니 문제가 있다면 조직과 체제를 개선하여 독립운동 단체의 중심 역할을 하도록 만들어야 한다.",choices:["개조파의 주장","창조파의 주장","위임 통치 청원의 논리","한인 애국단의 강령"],answer:0,explain:"임시 정부를 고쳐 쓰자는 개조파. 새로 만들자는 창조파와 맞서다 회의가 결렬됐다.",era:"황제의 나라에서 국민의 나라로"},
{id:"s7-src3",unit:"s7",type:"source",question:"본 국민 대표 회의에서 실제 독립운동에 적합하도록 새로운 조직을 만들어야 한다. 국내외 여러 독립운동 기관 중에서 상하이의 임시 정부를 개조하여 그 계통을 이어갈 이유는 없다.",choices:["창조파의 주장","개조파의 주장","신채호의 조선혁명선언","대동단결 선언"],answer:0,explain:"임시 정부를 새로 만들자는 창조파. 대립 끝에 국민 대표 회의는 성과 없이 끝났다.",era:"황제의 나라에서 국민의 나라로"},
{id:"s8-src1",unit:"s8",type:"source",question:"2. 중국 관헌은 각 현에 명령하여 만주에 거주하는 한국인이 무기를 휴대하고 조선에 침입하는 것을 엄금한다. 범한 자는 이를 체포하여 일본 경찰에 인도한다.\n3. 조선인 단체를 해산하고 소유한 총기를 수색하여 이를 몰수하고 무장을 해제한다.",choices:["미쓰야 협정","가쓰라·태프트 밀약","한일 의정서","기유각서"],answer:0,explain:"1925년 조선 총독부 경무 국장 미쓰야가 만주 군벌과 맺었다. 3부 통합 운동의 배경이 된다.",era:"봉오동에서 대전자령까지"},
{id:"s8-src2",unit:"s8",type:"source",question:"6월 7일 …… 북간도에 주둔한 아군 700여 명이 …… 왕칭현 봉오동을 향하여 행군할 때 …… 군을 지휘하는 홍범도, 최진동 두 장군은 적을 공격하여 급히 사격으로 적에게 120여 명의 사상자를 내게 하였고.\n— 『독립신문』, 1920",choices:["봉오동 전투","청산리 대첩","영릉가 전투","대전자령 전투"],answer:0,explain:"홍범도의 대한 독립군, 안무의 국민회군, 최진동의 군무 도독부군이 연합했다.",era:"봉오동에서 대전자령까지"},
{id:"s8-src3",unit:"s8",type:"source",question:"교전은 아침부터 저녁까지 계속되었다. 굶주림! 그러나 이를 의식할 시간도 먹을 시간도 없었다. 마을 아낙네들이 치마폭에 밥을 싸 가지고 빗발치는 총알 사이로 산에 올라와 한 덩이 두 덩이 동지들 입에 넣어 주었다.\n— 이범석, 『우둥불』",choices:["청산리 대첩과 간도 동포의 지원","봉오동 전투의 매복 작전","자유시 참변의 혼란","영릉가 전투의 한중 연합"],answer:0,explain:"청산리 대첩은 간도 한인 사회의 뒷받침이 있었기에 가능했다.",era:"봉오동에서 대전자령까지"},
{id:"s8-src4",unit:"s8",type:"source",question:"조선 혁명군 총사령 양세봉, 참모장 김학규 등은 일부 병력을 이끌고 중국 의용군 왕동헌·양석복 등이 이끄는 부대와 합세하였다. …… 당일 오후 3시경 신빈현 서쪽의 영릉가성을 점령하였다.\n— 『광복』 제1권",choices:["영릉가 전투","대전자령 전투","쌍성보 전투","봉오동 전투"],answer:0,explain:"양세봉의 조선 혁명군이 남만주에서 벌인 한중 연합 작전이다.",era:"봉오동에서 대전자령까지"},
{id:"s8-src5",unit:"s8",type:"source",question:"대전자령의 양쪽은 우뚝 서 있어 그 절벽은 기어 올라갈 수 없는 험악한 골짜기였다. …… 지청천 장군은 우리 군 500명만 선발대로 하고 중국군 2,000명과 혼성하여 …… 일본군의 후방이 이 고개의 중간을 넘었을 때 일시에 공격하기로 하였다.\n— 지헌모, 『청천 장군의 혁명 투쟁사』",choices:["대전자령 전투","영릉가 전투","흥경성 전투","청산리 대첩"],answer:0,explain:"지청천의 한국 독립군이 북만주에서 거둔 승리. 뒤에 한국광복군 창설을 주도한다.",era:"봉오동에서 대전자령까지"},

{id:"s2-kw1",unit:"s2",type:"keyword",question:"토지 조사 사업의 방식과 결과를 세 낱말로 답하세요.",choices:["기한부 신고제|신고제|기한부신고|신고","동양 척식 주식회사|동양척식|동척","소작농|기한부 소작|소작"],answer:null,explain:"기한부 신고제로 걷은 땅이 동양 척식 주식회사와 일본인에게 넘어가고, 기한부 계약 소작농이 늘었다.",era:"칼을 찬 교사의 시대"},
{id:"s2-kw2",unit:"s2",type:"keyword",question:"1910년대 무단 통치의 대표적인 제도·법령 셋을 쓰세요.",choices:["헌병 경찰|헌병경찰제|헌병","조선 태형령|태형령|태형","회사령"],answer:null,explain:"헌병 경찰제(즉결 심판권) · 조선 태형령(조선인에 한하여) · 회사령(허가제).",era:"칼을 찬 교사의 시대"},
{id:"s3-kw1",unit:"s3",type:"keyword",question:"문화 정치가 기만적이었음을 보여 주는 근거 셋을 쓰세요.",choices:["문관 총독|문관","보통 경찰|보통경찰제","치안 유지법|치안유지"],answer:null,explain:"문관 총독은 한 명도 없었고, 보통 경찰제로 바꾸며 경찰은 오히려 늘었으며, 치안 유지법으로 탄압했다.",era:"가면을 쓴 통치"},
{id:"s3-kw2",unit:"s3",type:"keyword",question:"산미 증식 계획이 농민에게 끼친 영향을 세 낱말로 답하세요.",choices:["식량 사정|식량|식량난","수리 조합비|수리조합|수세","소작농|화전민|토막민"],answer:null,explain:"반출로 식량 사정이 나빠지고, 수리 조합비가 전가되어 자작농이 소작농·화전민·토막민이 되었다.",era:"가면을 쓴 통치"},
{id:"s4-kw1",unit:"s4",type:"keyword",question:"민족 말살 통치의 정책 셋을 쓰세요.",choices:["내선일체|일선동조론","황국 신민 서사|황국신민서사|황국 신민","창씨개명|창씨"],answer:null,explain:"내선일체·일선동조론을 내세워 황국 신민 서사를 외우게 하고 창씨개명을 강요했다.",era:"이름을 빼앗긴 시대"},
{id:"s4-kw2",unit:"s4",type:"keyword",question:"전시 동원 체제의 인적·물적 수탈을 보여 주는 낱말 셋을 쓰세요.",choices:["국가 총동원법|총동원법","국민 징용령|징용령|징용","공출"],answer:null,explain:"국가 총동원법을 근거로 국민 징용령을 내리고 쌀과 금속을 공출했다.",era:"이름을 빼앗긴 시대"},
{id:"s5-kw1",unit:"s5",type:"keyword",question:"1910년대 국내 비밀 결사 둘과 그중 하나가 내세운 이념을 쓰세요.",choices:["독립 의군부|독립의군부","대한 광복회|대한광복회","복벽주의|공화주의|민주 공화제"],answer:null,explain:"독립 의군부(임병찬)는 복벽주의, 대한 광복회(박상진)는 공화주의를 내세웠다.",era:"국경을 넘은 사람들"},

/* ── 저장 ── */
function today(){var d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);}
function blank(){return{monsters:{},unit:{},correct:0,total:0,streak:0,last:0,best:{ox:0},played:0};}
var S;
function load(){
  try{var r=localStorage.getItem(KEY);S=r?Object.assign(blank(),JSON.parse(r)):blank();}catch(e){S=blank();}
  if(S.last&&S.last<today()-1)S.streak=0;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function markDay(){var t=today();if(S.last!==t){S.streak=(S.last===t-1)?S.streak+1:1;S.last=t;save();}}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}

/* ── 몬스터 ── */
function monCount(){return Object.keys(S.monsters).length;}
function monHit(id,ok){
  var m=S.monsters[id];
  if(ok){ if(m){ m.hp++; if(m.hp>=MON_KILL) delete S.monsters[id]; } }
  else { if(m) m.hp=0; else S.monsters[id]={hp:0,at:Date.now()}; }
}
/* id 로 생김새를 정한다 — 같은 문제는 늘 같은 몬스터 */
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
var MON_HUE=[268,196,338,32,152,218];

            "M50 9c22 0 40 15 40 36 0 27-18 47-40 47S10 72 10 45C10 24 28 9 50 9z"][shape];
  var g="g"+h.toString(36),f='hsl('+hue+',42%,62%)',dk='hsl('+hue+',44%,38%)';
  var sp="";
  if(spikes===1)sp='<path d="M30 14l6-11 7 11M57 13l7-11 6 11" fill="'+dk+'"/>';
  if(spikes===2)sp='<circle cx="24" cy="20" r="6" fill="'+dk+'"/><circle cx="76" cy="20" r="6" fill="'+dk+'"/>';
  var ey="",xs=eyes===1?[50]:eyes===2?[36,64]:[32,50,68];

  });
  var mouth=sad?'<path d="M38 72q12 -8 24 0" stroke="#14101A" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
                :'<path d="M38 68q12 10 24 0" stroke="#14101A" stroke-width="3.5" fill="none" stroke-linecap="round"/>';

}

/* 창 제목에는 경로만 띄운다. 화면마다 넣던 한글 제목은 여기서 흘려보낸다 —
   render 를 거치지 않고 다시 그리는 곳이 있어서 한 군데서 막는 편이 확실하다 */
var titleEl={set textContent(v){},get textContent(){return titleReal.textContent;}};
var stack=[];
function go(name,arg,replace){
  stopAll();
  if(replace){ stack[stack.length-1]={n:name,a:arg}; }
  else { stack.push({n:name,a:arg}); try{history.pushState({i:stack.length},"");}catch(e){} }
  render();
}
function back(){
  if(stack.length<=1)return;
  stopAll(); stack.pop(); render();
}
window.addEventListener("popstate",function(){ if(window.__hansa!=="mon")return; if(stack.length>1){stopAll();stack.pop();render();}
  else{try{history.pushState({i:1},"");}catch(e){}} });
var VIEWS={};
/* 창 제목은 경로로 — 세 앱이 같은 규칙을 쓴다 */
var PATH={home:"/HOME",units:"/UNITS",play:"/PLAY",result:"/RESULT",monsters:"/MONSTERS",
          map:"/MAP",dex:"/DEX",daily:"/DAILY",sclear:"/MAP/CLEAR",sfail:"/MAP/RETREAT"};
function render(){
  var s=stack[stack.length-1];
  backEl.classList.toggle("hidden",stack.length<=1);
  extraEl.innerHTML="";
  view.scrollTop=0; window.scrollTo(0,0);
  (VIEWS[s.n])(s.a);
  titleReal.textContent=(s.n==="play"&&s.a&&s.a.mode==="story") ? "/MAP/BOSS" : (PATH[s.n]||"/");
}

/* ── 문제 뽑기: 몬스터 우선, 같은 사실은 한 판에 한 번만 ── */
function stem(id){var p=id.split("-");return p[0]+"-"+p[1];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
/* 「○○은(는) 몇 년의 일일까?」 는 내지 않는다. 정확한 연도가 아니라 전개를 보는 앱이다.
   기록에 남은 옛 몬스터가 깨지지 않게 QMAP 에서 지우지는 않고 출제만 막는다 */
function usable(q){ return !/-yr$/.test(q.id); }
function pool(type,unit){
  return QUESTIONS.filter(function(q){
    return q.type===type && usable(q) && (!unit||q.unit===unit);
  });
}
function buildRound(type,unit,n){
  var p=pool(type,unit),mine=[],rest=[],seen={},out=[];
  p.forEach(function(q){ (S.monsters[q.id]?mine:rest).push(q); });
  /* 몬스터는 우선 복습 대상이라 같은 사실이 겹쳐도 넣는다 */
  var quota=(typeof monsterQuota==="function")?monsterQuota(n):n;
  shuffle(mine).forEach(function(q){ if(out.length<Math.min(n,quota)){ out.push(q); seen[stem(q.id)]=1; } });
  /* 나머지는 한 판에 같은 사실이 두 번 나오지 않게 거른다 */
  var restS=shuffle(rest);
  restS.forEach(function(q){ var k=stem(q.id); if(out.length<n&&!seen[k]){ seen[k]=1; out.push(q); } });
  /* 그래도 모자라면 남은 것으로 채운다 */
  for(var j=0;j<restS.length&&out.length<n;j++) if(out.indexOf(restS[j])<0) out.push(restS[j]);
  return out;
}

/* ═══════════ 플레이 ═══════════ */
var G=null,tickTimer=null,advTimer=null;
function stopAll(){
  if(tickTimer){clearInterval(tickTimer);tickTimer=null;}
  if(advTimer){clearTimeout(advTimer);advTimer=null;}
  speakStop();
}
var MODE_TITLE={ox:"스피드 O·X",mc:"4지선다",order:"연표 세우기",hunt:"몬스터 사냥",listen:"듣기 모드"};

function vPlay(a){
  if(!G||G.key!==JSON.stringify(a)){
    var q;
    if(a.mode==="ox")        q=buildRound("ox",null,60);
    else if(a.mode==="mc")   q=buildRound("mc",a.unit||null,GOAL);
    else if(a.mode==="order")q=buildRound("order",null,5);
    else if(a.mode==="listen")q=shuffle(QUESTIONS.filter(function(x){return x.type!=="order"&&usable(x);})).slice(0,40);
    else { /* hunt */
      var ids=Object.keys(S.monsters);
      q=shuffle(ids.map(function(i){return QMAP[i];}).filter(function(x){return x&&usable(x);}));
    }
    G={key:JSON.stringify(a),mode:a.mode,unit:a.unit,queue:q,i:0,score:0,combo:0,maxCombo:0,
       ok:0,log:[],left:OX_TIME,done:false,answered:false};
  }
  titleEl.textContent=MODE_TITLE[G.mode]+(G.unit?" · "+UMAP[G.unit].name:"");
  if(!G.queue.length){
    view.innerHTML='<div class="empty">'+monsterSVG("none",80,"weak")+
      '<p>지금 풀 수 있는 문제가 없어요.<br>다른 모드를 골라 보세요.</p></div>';
    return;
  }
  if(G.mode==="listen")return vListen();
  if(G.mode==="ox"&&!tickTimer)startClock();
  paintQ();
}

function startClock(){
  G.left=OX_TIME;
  tickTimer=setInterval(function(){
    G.left--;
    var t=document.getElementById("clock");
    if(t){t.textContent=G.left+"초";t.classList.toggle("warn",G.left<=10);}
    if(G.left<=0){clearInterval(tickTimer);tickTimer=null;finish();}
  },1000);
}

function hud(){
  if(G.mode==="ox")
    return '<div class="hud"><span class="timer'+(G.left<=10?' warn':'')+'" id="clock">'+G.left+'초</span>'+
      (G.combo>=2?'<span class="combo">'+ICON.fire+' '+G.combo+'연속</span>':'')+
      '<span style="flex:1"></span><span class="score">'+G.score+'</span></div>';
  var pct=Math.round(G.i/G.queue.length*100);
  return '<div class="hud"><span class="timer">'+(G.i+1)+' / '+G.queue.length+'</span>'+
    '<span class="track"><i style="width:'+pct+'%"></i></span>'+
    (G.combo>=2?'<span class="combo">'+ICON.fire+' '+G.combo+'</span>':'')+'</div>';
}
function qmeta(q){
  var u=UMAP[q.unit];
  return '<div class="qmeta"><span class="era">'+esc(q.era)+'</span><span>'+(u?u.no:"")+'</span>'+
    (S.monsters[q.id]?'<span class="mob">'+monsterSVG(q.id,19)+' 몬스터</span>':'')+'</div>';
}

function paintQ(){
  var q=G.queue[G.i];
  G.answered=false;
  if(q.type==="order")return paintOrder(q);
  var isOX=q.type==="ox";
  view.innerHTML=hud()+
    '<div class="qcard">'+qmeta(q)+
      '<div class="qtext'+(isOX&&q.question.length<40?' big':'')+'">'+esc(q.question)+'</div></div>'+
    (isOX
      ? '<div class="ox2" id="ansBox"><button class="oxb o" data-i="0">O</button><button class="oxb x" data-i="1">X</button></div>'
      : '<div class="answers" id="ansBox">'+q.choices.map(function(c,i){
          return '<button class="ans" data-i="'+i+'"><span class="kx">'+"ABCD".charAt(i)+'</span><span>'+esc(c)+'</span></button>';
        }).join("")+'</div>')+
    '<div id="fbBox"></div><div class="grow"></div>';
  Array.prototype.forEach.call(view.querySelectorAll("#ansBox button"),function(b){
    b.onclick=function(){choose(+b.dataset.i,b);};
  });
}

function choose(idx,btn){
  if(G.answered)return; G.answered=true;
  var q=G.queue[G.i],ok=idx===q.answer;
  var box=document.getElementById("ansBox");
  Array.prototype.forEach.call(box.children,function(b,i){
    b.disabled=true;
    if(i===q.answer)b.classList.add("ok");
    else if(b===btn)b.classList.add("no");
    else b.classList.add("dim");
  });
  grade(q,ok);
  if(G.mode==="ox"){
    /* 속도 모드는 해설을 붙잡지 않는다. 복습은 결과 화면에서 */
    advTimer=setTimeout(next,ok?520:900);
  }else{
    document.getElementById("fbBox").innerHTML=
      '<div class="fb '+(ok?"ok":"no")+'"><span class="em">'+(ok?"○":"×")+'</span><span>'+esc(q.explain)+'</span></div>'+
      '<div class="sticky"><button class="btn" id="nx">'+(G.i+1>=G.queue.length?"결과 보기":"다음")+'</button></div>';
    var nx=document.getElementById("nx"); nx.onclick=next; nx.focus({preventScroll:true});
  }
}

function grade(q,ok){
  markDay();
  G.log.push({id:q.id,ok:ok});
  if(ok){
    G.ok++; G.combo++; if(G.combo>G.maxCombo)G.maxCombo=G.combo;
    if(G.mode==="ox"){
      var gain=Math.round((40+G.left*2)*(1+Math.min(G.combo,10)*0.15));
      G.score+=gain; pop("+"+gain);
    }
    buzz(18); flash("rgba(53,214,160,.28)");
  }else{
    G.combo=0; buzz([25,45,25]); flash("rgba(255,78,99,.3)");
  }
  monHit(q.id,ok);
  S.total++; if(ok)S.correct++;
  var st=S.unit[q.unit]||[0,0]; st[0]++; if(ok)st[1]++; S.unit[q.unit]=st;
  save();
}
function next(){
  advTimer=null;
  if(G.mode==="ox"){ G.i=(G.i+1)%G.queue.length; if(G.left>0){paintQ();return;} finish(); return; }
  G.i++;
  if(G.i>=G.queue.length)return finish();
  paintQ();
}
function finish(){ stopAll(); G.done=true; go("result",null,true); }

function pop(t){
  var e=document.createElement("div");e.className="pop";e.textContent=t;
  document.body.appendChild(e);setTimeout(function(){e.remove();},820);
}
function flash(c){
  var f=document.getElementById("Mflash");
  f.style.background="radial-gradient(60% 40% at 50% 45%,"+c+",transparent 72%)";
  f.classList.remove("go");void f.offsetWidth;f.classList.add("go");
}

/* ═══════════ 연표 세우기 ═══════════ */
function paintOrder(q){
  var correct=q.choices.slice();
  var cur=shuffle(correct);
  while(cur.join("|")===correct.join("|"))cur=shuffle(correct);   /* 처음부터 정답이면 다시 섞는다 */
  view.innerHTML=hud()+
    '<div class="qcard">'+qmeta(q)+'<div class="qtext">'+esc(q.question)+'</div>'+
      '<p class="note">이른 것이 위로 오게. 손잡이를 끌거나 오른쪽 화살표로 옮기세요. 연도는 채점할 때 공개돼요.</p></div>'+
    '<div class="tl" id="tl"></div><div id="fbBox"></div><div class="grow"></div>'+
    '<div class="sticky"><button class="btn" id="chk">맞춰 보기</button></div>';
  var tl=document.getElementById("tl");
  function draw(){
    tl.innerHTML=cur.map(function(c,i){
      var p=c.split("|");
      return '<div class="tlc" data-i="'+i+'"><span class="grip" data-g="'+i+'">'+ICON.grip+'</span>'+
        '<span class="ord">'+(i+1)+'</span><span class="nm">'+esc(p[1]||c)+'</span>'+
        '<span class="mv"><button data-up="'+i+'" aria-label="위로"'+(i===0?" disabled":"")+'>'+ICON.up+'</button>'+
        '<button data-dn="'+i+'" aria-label="아래로"'+(i===cur.length-1?" disabled":"")+'>'+ICON.down+'</button></span></div>';
    }).join("");
    Array.prototype.forEach.call(tl.querySelectorAll("[data-up]"),function(b){
      b.onclick=function(){var i=+b.dataset.up;swap(i,i-1);};});
    Array.prototype.forEach.call(tl.querySelectorAll("[data-dn]"),function(b){
      b.onclick=function(){var i=+b.dataset.dn;swap(i,i+1);};});
    Array.prototype.forEach.call(tl.querySelectorAll(".grip"),function(g){
      g.addEventListener("pointerdown",startDrag);});
  }
  function swap(a,b){
    if(b<0||b>=cur.length)return;
    var t=cur[a];cur[a]=cur[b];cur[b]=t;buzz(10);draw();
  }
  /* 포인터 기반 드래그 — HTML5 drag&drop 은 터치에서 동작하지 않는다 */
  var drag=null;
  function startDrag(ev){
    if(G.answered)return;
    ev.preventDefault();
    var cards=Array.prototype.slice.call(tl.children);
    var idx=+ev.currentTarget.dataset.g,el=cards[idx];
    var hs=cards.map(function(c){return c.offsetHeight;});
    var gap=8,tops=[],acc=0;
    hs.forEach(function(h){tops.push(acc);acc+=h+gap;});
    drag={idx:idx,at:idx,el:el,cards:cards,hs:hs,tops:tops,gap:gap,y0:ev.clientY};
    el.classList.add("drag");
    el.setPointerCapture(ev.pointerId);
    el.addEventListener("pointermove",moveDrag);
    el.addEventListener("pointerup",endDrag);
    el.addEventListener("pointercancel",endDrag);
  }
  function moveDrag(ev){
    if(!drag)return;
    var dy=ev.clientY-drag.y0;
    drag.el.style.transform="translateY("+dy+"px)";
    var center=drag.tops[drag.idx]+drag.hs[drag.idx]/2+dy;
    var at=0;
    for(var i=0;i<drag.tops.length;i++)
      if(center>drag.tops[i]+drag.hs[i]/2) at=Math.min(i+1,drag.tops.length-1);
    if(at!==drag.at){drag.at=at;buzz(8);layout();}
  }
  function layout(){
    var seq=[];
    for(var i=0;i<drag.cards.length;i++) if(i!==drag.idx) seq.push(i);
    seq.splice(drag.at,0,drag.idx);
    var acc=0,pos={};
    seq.forEach(function(i){pos[i]=acc;acc+=drag.hs[i]+drag.gap;});
    drag.cards.forEach(function(c,i){
      if(i===drag.idx)return;
      c.style.transform="translateY("+(pos[i]-drag.tops[i])+"px)";
    });
  }
  function endDrag(){
    if(!drag)return;
    var from=drag.idx,to=drag.at;
    drag.cards.forEach(function(c){c.style.transform="";c.classList.remove("drag");});
    drag=null;
    if(from!==to){var it=cur.splice(from,1)[0];cur.splice(to,0,it);buzz(14);}
    draw();
  }
  draw();
  document.getElementById("chk").onclick=function(){
    if(G.answered)return; G.answered=true;
    var ok=cur.join("|")===correct.join("|");
    grade(q,ok);
    tl.innerHTML=correct.map(function(c,i){
      var p=c.split("|"),right=cur[i]===c;
      return '<div class="tlc '+(right?"ok":"no")+'"><span class="yr">'+esc(p[0])+'</span>'+
        '<span class="nm">'+esc(p[1]||"")+'</span></div>';
    }).join("");
    document.getElementById("fbBox").innerHTML=
      '<div class="fb '+(ok?"ok":"no")+'"><span class="em">'+(ok?"○":"×")+'</span><span>'+
      (ok?"순서 완벽해요! ":"")+esc(q.explain)+'</span></div>';
    var s=view.querySelector(".sticky");
    s.innerHTML='<button class="btn" id="nx">'+(G.i+1>=G.queue.length?"결과 보기":"다음")+'</button>';
    document.getElementById("nx").onclick=next;
  };
}

/* ═══════════ 듣기 모드 ═══════════
   iOS 는 사용자 제스처 없이 다음 문장을 이어 읽지 못하고 화면이 꺼지면 멈춘다.
   그래서 시작 버튼을 한 번 누르면 그 세션 동안 onend 로 체인을 이어 간다.       */
var SP=window.speechSynthesis,voiceKO=null,speaking=false;
function pickVoice(){
  if(!SP)return;
  var vs=SP.getVoices()||[];
  voiceKO=vs.filter(function(v){return /^ko/i.test(v.lang);})[0]||null;
}
if(SP){pickVoice();SP.onvoiceschanged=pickVoice;}
function speakStop(){ speaking=false; try{ if(SP)SP.cancel(); }catch(e){} }
function say(text,rate,done){
  if(!SP){done&&done();return;}
  var u=new SpeechSynthesisUtterance(text);
  u.lang="ko-KR"; u.rate=rate||1; u.pitch=1;
  if(voiceKO)u.voice=voiceKO;
  u.onend=function(){ if(speaking)done&&done(); };
  u.onerror=function(){ if(speaking)done&&done(); };
  try{SP.speak(u);}catch(e){done&&done();}
}
function vListen(){
  if(!SP){
    view.innerHTML='<div class="empty">'+monsterSVG("nospeech",80,"weak")+
      '<p>이 브라우저는 음성 읽기를 지원하지 않아요.<br>다른 모드를 이용해 주세요.</p></div>'+
      '<div class="sticky"><button class="btn ghost" id="hm">홈으로</button></div>';
    document.getElementById("hm").onclick=back; return;
  }
  var q=G.queue[G.i];
  view.innerHTML=
    '<div class="hud"><span class="timer">'+(G.i+1)+' / '+G.queue.length+'</span>'+
      '<span class="track"><i style="width:'+Math.round(G.i/G.queue.length*100)+'%"></i></span></div>'+
    '<div class="listen"><div class="wave'+(speaking?" on":"")+'" id="wave">'+
      '<i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>'+
      '<p class="note" id="phase" style="text-align:center">'+
      (speaking?"읽는 중":"시작을 누르면 문제와 정답을 이어서 읽어 줘요")+'</p></div>'+
    '<div class="qcard">'+qmeta(q)+'<div class="qtext">'+esc(q.question)+'</div>'+
      '<div id="revealBox"></div></div>'+
    (voiceKO?'':'<p class="note" style="margin-top:12px">이 기기에 한국어 음성이 없어 발음이 어색할 수 있어요.</p>')+
    '<p class="note" style="margin-top:12px">화면이 꺼지면 읽기가 멈춰요. 화면 자동 잠금을 잠시 꺼 두면 편해요.</p>'+
    '<div class="grow"></div>'+
    '<div class="sticky"><div class="btnrow">'+
      '<button class="btn ghost" id="skip">건너뛰기</button>'+
      '<button class="btn" id="tog">'+(speaking?"멈춤":"시작")+'</button></div></div>';
  document.getElementById("tog").onclick=function(){
    if(speaking){ speakStop(); vListen(); } else { speaking=true; runListen(); }
  };
  document.getElementById("skip").onclick=function(){
    speakStop(); G.i=(G.i+1)%G.queue.length; vListen();
  };
}
function runListen(){
  var q=G.queue[G.i];
  vListen();
  var ansTx=q.type==="ox"?("정답은, "+(q.answer===0?"오":"엑스")):("정답은, "+q.choices[q.answer]);
  say(q.question,1,function(){
    if(!speaking)return;
    var ph=document.getElementById("phase"),rb=document.getElementById("revealBox");
    if(ph)ph.textContent="정답 공개";
    if(rb)rb.innerHTML='<div class="fb ok" style="margin-top:12px"><span class="em">○</span><span><b>'+
      esc(q.type==="ox"?(q.answer===0?"O":"X"):q.choices[q.answer])+'</b><br>'+esc(q.explain)+'</span></div>';
    setTimeout(function(){
      if(!speaking)return;
      say(ansTx+". "+q.explain,1,function(){
        if(!speaking)return;
        markDay();
        setTimeout(function(){
          if(!speaking)return;
          G.i=(G.i+1)%G.queue.length;
          runListen();
        },700);
      });
    },1600);
  });
}

/* ═══════════ 결과 ═══════════ */
function vResult(){
  titleEl.textContent="결과";
  var n=G.log.length,ok=G.ok,rate=n?Math.round(ok/n*100):0;
  var killed=G.log.filter(function(l){return l.ok&&!S.monsters[l.id];}).length;
  var born=G.log.filter(function(l){return !l.ok;}).length;
  var isOX=G.mode==="ox";
  if(isOX&&G.score>(S.best.ox||0)){S.best.ox=G.score;save();}
  var head=isOX
    ? '<div class="big">'+G.score+'</div><div class="sub">점 · 최고 '+(S.best.ox||0)+'점</div>'
    : '<div class="big">'+rate+'<span style="font-size:34px">%</span></div><div class="sub">'+n+'문제 중 '+ok+'개 정답</div>';
  var wrong=G.log.filter(function(l){return !l.ok;});
  view.innerHTML=
    '<div class="result">'+head+'</div>'+
    '<div class="rgrid">'+stat(ok+" / "+n,"정답")+stat(G.maxCombo,"최고 콤보")+
      stat(monCount(),"남은 몬스터")+'</div>'+
    (born?'<div class="sect">새로 생긴 몬스터 '+born+'마리</div>'+
      '<div class="rlist">'+wrong.map(function(l){
        var q=QMAP[l.id];
        return '<div class="rrow"><span class="dot no"></span><span>'+esc(q.question.slice(0,70))+
          (q.question.length>70?"…":"")+'<small>'+esc(q.explain)+'</small></span></div>';
      }).join("")+'</div>':
      '<div class="sect">완벽</div><p class="note">틀린 문제가 없어요. 새 몬스터도 없습니다.</p>')+
    '<div class="sticky"><div class="btnrow">'+
      '<button class="btn ghost" id="home">홈으로</button>'+
      '<button class="btn" id="again">한 판 더</button></div></div>';
  document.getElementById("home").onclick=function(){stack=[{n:"home"}];render();};
  document.getElementById("again").onclick=function(){

/* ── 2단계 상태 (기존 저장 구조에 필드만 더한다) ── */
function s2init(){
  if(!S.cleared)S.cleared={};        /* 격파한 시대 */
  if(!S.dex)S.dex={};                /* 모은 인물 카드 */
  if(S.pt==null)S.pt=0;              /* 카드 뽑기용 학습 포인트 */
  if(!S.items)S.items={fifty:1,time:1,revive:1};
  if(!S.mission||S.mission.day!==today())S.mission={day:today(),p:{},done:{}};
  if(!S.stamp)S.stamp=[];            /* 출석 도장 */
  if(S.dday==null)S.dday="";
  var t=today();
  if(S.stamp.indexOf(t)<0&&S.last===t)S.stamp.push(t);
  if(S.stamp.length>60)S.stamp=S.stamp.slice(-60);
}
function ddayLeft(){
  if(!S.dday)return null;
  var d=new Date(S.dday+"T00:00:00");
  if(isNaN(d))return null;
  return Math.round(Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)-today());
}
/* 시험이 가까울수록 몬스터 비중을 올린다. D-day 를 안 넣으면 기존 그대로 전부 우선 */
function monsterQuota(n){
  var L=ddayLeft();
  if(L==null)return n;
  var r=L<=6?1:L<=13?0.8:L<=29?0.6:0.4;
  return Math.max(1,Math.ceil(n*r));
}

/* ── 오늘의 미션: 날짜로 3개 고정 ── */
function todayMissions(){
  var t=today(),out=[],used={};
  for(var i=0;i<3;i++){
    var k=(hash("m"+t+i)+i*7)%MISSIONS.length,gu=0;
    while(used[k]&&gu++<MISSIONS.length)k=(k+1)%MISSIONS.length;
    used[k]=1;out.push(MISSIONS[k]);
  }
  return out;
}
function missionBump(k,v){
  var m=S.mission.p;m[k]=(m[k]||0)+(v||1);
  todayMissions().forEach(function(ms){
    if(!S.mission.done[ms.id]&&(m[ms.k]||0)>=ms.goal){
      S.mission.done[ms.id]=1; grantItem(); toast("미션 완료 · "+ms.n);
    }
  });
}
function missionMax(k,v){ var m=S.mission.p; if((m[k]||0)<v){m[k]=v;missionBump(k,0);} }

/* ── 아이템 · 카드 보상 (정답으로만 얻는다) ── */
function grantItem(which){
  var keys=Object.keys(ITEMS),k=which||keys[Math.floor(Math.random()*keys.length)];
  S.items[k]=(S.items[k]||0)+1; save();
  toast(ITEMS[k].ic+" "+ITEMS[k].n+" 획득");
  return k;
}
function drawCard(){
  var own=S.dex,pool=FIGURES.filter(function(f){return !own[f.id];});
  if(!pool.length)return null;
  var bag=[];
  pool.forEach(function(f){ for(var i=0;i<GRADE[f.g].p;i++)bag.push(f); });
  var f=bag[Math.floor(Math.random()*bag.length)];
  S.dex[f.id]=Date.now(); save();
  return f;
}
function addPoint(){
  S.pt++;
  if(S.pt%10!==0)return;
  var f=drawCard(); if(!f)return;
  if(G&&G.mode==="ox"){                       /* 타이머가 도는 중엔 결과 화면에서 보여 준다 */
    (G.pending=G.pending||[]).push(f);

  } else cardModal(f);
}

/* ── 키워드 입력형 (서술형 대비) ── */
function norm(s){return String(s).toLowerCase().replace(/[\s·.,'"‘’“”()·\-–—]/g,"");}
function kwMatch(input,spec){
  var v=norm(input); if(!v)return false;
  return spec.split("|").some(function(alt){
    var a=norm(alt); return a.length>0&&(v===a||v.indexOf(a)>=0||a.indexOf(v)>=0&&v.length>=Math.min(3,a.length));
  });
}
function paintKeyword(q){
  view.innerHTML=hud()+
    '<div class="qcard">'+qmeta(q)+'<div class="qtext">'+esc(q.question)+'</div>'+
      '<p class="note">띄어쓰기는 신경 쓰지 않아도 돼요. 순서도 상관없어요.</p></div>'+
    '<div class="kws" id="kws">'+q.choices.map(function(_,i){
      return '<label class="kw"><span class="kn">'+(i+1)+'</span>'+
        '<input type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" '+
        'placeholder="키워드 '+(i+1)+'" data-k="'+i+'"></label>';
    }).join("")+'</div><div id="fbBox"></div><div class="grow"></div>'+
    '<div class="sticky"><button class="btn" id="kchk">제출</button></div>';
  var ins=Array.prototype.slice.call(view.querySelectorAll("#kws input"));
  ins.forEach(function(inp,i){
    inp.addEventListener("keydown",function(e){
      if(e.key==="Enter"){ e.preventDefault(); if(i<ins.length-1)ins[i+1].focus(); else document.getElementById("kchk").click(); }
    });
  });
  document.getElementById("kchk").onclick=function(){
    if(G.answered)return;
    var vals=ins.map(function(x){return x.value;});
    var used={},hit=q.choices.map(function(spec,si){
      for(var i=0;i<vals.length;i++){ if(used[i])continue; if(kwMatch(vals[i],spec)){used[i]=1;return true;} }
      return false;
    });
    var ok=hit.every(Boolean);
    G.answered=true;
    ins.forEach(function(x){x.disabled=true;});
    view.querySelectorAll(".kw").forEach&&Array.prototype.forEach.call(view.querySelectorAll(".kw"),function(l,i){
      l.classList.add(hit[i]?"ok":"no");
    });
    grade(q,ok);
    document.getElementById("fbBox").innerHTML=
      '<div class="fb '+(ok?"ok":"no")+'"><span class="em">'+(ok?"○":"×")+'</span><span>'+
      '<b>정답 키워드</b> · '+q.choices.map(function(s){return esc(s.split("|")[0]);}).join(" / ")+
      '<br>'+esc(q.explain)+'</span></div>';
    var s=view.querySelector(".sticky");
    s.innerHTML='<button class="btn" id="nx">'+(G.mode==="story"?"계속":(G.i+1>=G.queue.length?"결과 보기":"다음"))+'</button>';
    document.getElementById("nx").onclick=next;
  };
  ins[0].focus({preventScroll:true});
}

function itemBar(){
  var q=G.queue[G.i];
  if(document.getElementById("itemBar"))return;
  var can={fifty:(q.type==="mc"||q.type==="source")&&q.choices.length===4,
           time:G.mode==="ox", revive:true};
  var html=Object.keys(ITEMS).filter(function(k){return can[k]&&(S.items[k]||0)>0;}).map(function(k){
    return '<button class="ibtn" data-k="'+k+'"><span>'+ITEMS[k].ic+'</span>'+ITEMS[k].n+
      '<b>'+S.items[k]+'</b></button>';
  }).join("");
  if(!html)return;
  var bar=document.createElement("div");bar.className="itembar";bar.id="itemBar";bar.innerHTML=html;
  var box=document.getElementById("ansBox")||view.querySelector(".qcard");
  box.parentNode.insertBefore(bar,box);
  Array.prototype.forEach.call(bar.querySelectorAll(".ibtn"),function(b){
    b.onclick=function(){useItem(b.dataset.k);};
  });
}
function useItem(k){
  if(!(S.items[k]>0)||G.answered&&k!=="revive")return;
  var q=G.queue[G.i];
  if(k==="fifty"){
    var wrong=[];q.choices.forEach(function(_,i){if(i!==q.answer)wrong.push(i);});
    shuffle(wrong).slice(0,2).forEach(function(i){
      var b=document.querySelector('#ansBox [data-i="'+i+'"]');
      if(b){b.disabled=true;b.classList.add("dim");}
    });
  } else if(k==="time"){
    G.left+=10; var t=document.getElementById("clock");
    if(t){t.textContent=G.left+"초";t.classList.toggle("warn",G.left<=10);}
    pop("+10초");
  } else if(k==="revive"){
    G.revive=true; toast("✦ 부활 준비 — 다음에 틀려도 없던 일이 돼요");
  }
  S.items[k]--; save();
  var bar=document.getElementById("itemBar"); if(bar)bar.remove(); itemBar();
}

function s3init(){

  Object.keys(S.monsters).forEach(function(id){ if(/-yr$/.test(id))delete S.monsters[id]; });
  if(!S.best)S.best={};
  if(S.best.ox==null)S.best.ox=0;
  if(S.best.cho==null)S.best.cho=0;      /* 초성 사냥 최고 점수 */

}

/* ── 한글 초성 ── */
var CHO=["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
/* n 글자까지는 원래 글자를 보여 주고 나머지는 초성만 남긴다 */
function choMask(term,n){
  var out="",shown=0;
  for(var i=0;i<term.length;i++){
    var c=term.charAt(i),k=c.charCodeAt(0)-0xAC00;
    if(k>=0&&k<11172){
      if(shown<n){out+='<b class="got">'+c+'</b>';shown++;}
      else out+=CHO[Math.floor(k/588)];
    }else out+=c;
  }
  return out;
}
function hangulLen(s){
  var n=0;for(var i=0;i<s.length;i++){var k=s.charCodeAt(i)-0xAC00;if(k>=0&&k<11172)n++;}
  return n;
}
/* 띄어쓰기·가운뎃점·따옴표를 무시하고 견준다 */
function sameWord(a,b){
  var f=function(s){return (s||"").replace(/[\s·・‧'"’“”()（）「」『』,.\-–—~]/g,"").toLowerCase();};
  return f(a)===f(b) && f(a).length>0;
}

/* ── 초성 사냥 문제 풀 ── */
var CHO_POOL=null;
function choPool(unit){
  if(!CHO_POOL){
    CHO_POOL=[];
    QUESTIONS.forEach(function(q){
      if(q.type!=="mc"||!/-(ev|bl)$/.test(q.id))return;
      var t=q.choices[q.answer];
      /* 초성이 나오려면 한글이 있어야 하고, 너무 길면 못 맞힌다 */
      if(!t||!/[가-힣]/.test(t)||hangulLen(t)<2||t.length>16)return;
      var hint=/-bl$/.test(q.id)
        ? q.question.replace(/^\[[^\]]*\]\s*/,"").replace(/[　\s]*_+[　\s]*/," ○○○ ")
        : q.question;
      CHO_POOL.push({id:q.id,unit:q.unit,era:q.era,term:t,hint:hint});
    });
  }
  return unit?CHO_POOL.filter(function(x){return x.unit===unit;}):CHO_POOL;
}

var CHO_N=10;
function vCho(a){
  a=a||{};
  if(!G||G.key!==JSON.stringify(a)){
    var p=choPool(a.unit);
    /* 몬스터(전에 틀린 문제)를 먼저 낸다 — 다른 모드와 같은 규칙 */
    var mine=p.filter(function(x){return S.monsters[x.id];});
    var rest=p.filter(function(x){return !S.monsters[x.id];});
    G={key:JSON.stringify(a),mode:"cho",unit:a.unit,
       queue:shuffle(mine).concat(shuffle(rest)).slice(0,CHO_N),
       i:0,score:0,combo:0,maxCombo:0,ok:0,log:[],left:0,done:false,answered:false,hint:0};
  }
  if(!G.queue.length){
    view.innerHTML='<div class="empty">'+monsterSVG("none",80,"weak")+
      '<p>이 단원에는 낼 낱말이 없어요.<br>다른 단원을 골라 보세요.</p></div>';
    return;
  }
  paintCho();
}

function paintCho(){
  var x=G.queue[G.i],u=UMAP[x.unit];
  G.answered=false; G.hint=0;
  var pct=Math.round(G.i/G.queue.length*100);

    '<div class="hud"><span class="timer">'+(G.i+1)+' / '+G.queue.length+'</span>'+
      '<span class="track"><i style="width:'+pct+'%"></i></span>'+
      (G.combo>=2?'<span class="combo">'+ICON.fire+' '+G.combo+'</span>':'')+
      '<span class="score">'+G.score+'</span></div>'+
    '<div class="qcard">'+
      /* 시대 이름이 답을 그대로 품는 경우가 있다(「봉오동에서…」→ 봉오동 전투). 쪽수만 보여 준다 */
      '<div class="qmeta"><span>'+(u?u.no+" · "+u.book:"")+'</span>'+
      (S.monsters[x.id]?'<span class="mob">'+monsterSVG(x.id,19)+' 몬스터</span>':'')+'</div>'+
      '<div class="chotext" id="choT">'+choMask(x.term,0)+'</div>'+
      '<p class="chohint">'+esc(x.hint)+'</p></div>'+
    '<label class="choin" id="choBox"><span>ANS</span>'+
      '<input type="text" id="choIn" inputmode="text" autocomplete="off" autocapitalize="off" '+
      'spellcheck="false" placeholder="초성에 맞는 낱말"></label>'+
    '<div id="fbBox"></div><div class="grow"></div>'+
    '<div class="sticky"><div class="btnrow">'+
      '<button class="btn ghost" id="choHint">한 글자 열기</button>'+
      '<button class="btn" id="choOk">제출</button></div></div>';
  var inp=document.getElementById("choIn");
  inp.addEventListener("keydown",function(e){
    if(e.key==="Enter"){e.preventDefault();choSubmit();}
  });
  document.getElementById("choOk").onclick=choSubmit;
  document.getElementById("choHint").onclick=function(){
    if(G.answered)return;
    var max=hangulLen(x.term)-1;                 /* 마지막 한 글자는 남겨 둔다 */
    if(G.hint>=max){toast("더 열 글자가 없어요");return;}
    G.hint++; buzz(10);
    document.getElementById("choT").innerHTML=choMask(x.term,G.hint);
  };
  inp.focus({preventScroll:true});
}

function choSubmit(){
  if(G.answered)return;
  var x=G.queue[G.i],inp=document.getElementById("choIn");
  var ok=sameWord(inp.value,x.term);
  G.answered=true; inp.disabled=true;
  document.getElementById("choBox").classList.add(ok?"ok":"no");
  document.getElementById("choT").innerHTML=choMask(x.term,999);
  grade(QMAP[x.id],ok);
  if(ok){
    /* 힌트를 열수록 점수가 깎인다 */
    var gain=Math.max(20,100+(G.combo-1)*20-G.hint*30);
    G.score+=gain; pop("+"+gain);
  }
  document.getElementById("fbBox").innerHTML=
    '<div class="fb '+(ok?"ok":"no")+'" style="margin-top:14px"><span class="em">'+(ok?"○":"×")+'</span>'+
    '<span><b>'+esc(x.term)+'</b>'+(ok?'':' — 이 낱말이었어요')+'</span></div>';
  var s=view.querySelector(".sticky");
  s.innerHTML='<button class="btn" id="nx">'+(G.i+1>=G.queue.length?"결과 보기":"다음")+'</button>';
  document.getElementById("nx").onclick=function(){
    G.i++;
    if(G.i>=G.queue.length){ missionBump("cho"); finish(); return; }
    paintCho();
  };
  document.getElementById("nx").focus({preventScroll:true});
}

/* ═══════════ 짝 맞추기 ═══════════ */
/* 인물 ↔ 한 줄 활동. 연도를 짝짓던 자리를 인물로 바꿨다 — 날짜가 아니라 누가 뭘 했나가 남는다 */
var PAIR_POOL=null;
function pairPool(unit){
  if(!PAIR_POOL)PAIR_POOL=FIGURES.map(function(f){
    return {id:f.id,unit:f.u,t:f.n,y:f.d};
  });
  return unit?PAIR_POOL.filter(function(x){return x.unit===unit;}):PAIR_POOL;
}

var PAIR_N=5,P=null,pairTimer=null;
function vPair(a){
  a=a||{};
  if(!P||P.key!==JSON.stringify(a)){
    var src=shuffle(pairPool(a.unit)).slice(0,PAIR_N);
    var cards=[];
    src.forEach(function(x,i){
      cards.push({p:i,k:"n",v:x.t}); cards.push({p:i,k:"y",v:x.y});
    });
    P={key:JSON.stringify(a),src:src,cards:shuffle(cards),open:[],hit:{},
       moves:0,t0:Date.now(),secs:0,over:false,lock:false};
  }
  if(P.src.length<2){
    view.innerHTML='<div class="empty"><p>짝을 지을 사건이 모자라요.<br>다른 단원을 골라 보세요.</p></div>';
    return;
  }
  if(pairTimer)clearInterval(pairTimer);
  pairTimer=setInterval(function(){
    if(!P||P.over){clearInterval(pairTimer);pairTimer=null;return;}
    P.secs=Math.round((Date.now()-P.t0)/1000);
    var t=document.getElementById("pT"); if(t)t.textContent=P.secs+"초";
  },1000);
  paintPair();
}

function paintPair(){
  var done=Object.keys(P.hit).length;
  view.innerHTML=
    '<div class="pbar"><span class="t" id="pT">'+P.secs+'초</span>'+
      '<span class="track"><i style="width:'+Math.round(done/P.src.length*100)+'%"></i></span>'+
      '<span class="m">'+done+' / '+P.src.length+' 짝 · '+P.moves+'번</span></div>'+
    (P.over
      /* 끝나면 짝을 연도순으로 세워 보여 준다 — 이게 이 판의 배움이다 */
      ? '<div class="qcard"><div class="qtext" style="font-size:17px">이번 판의 인물</div>'+
        '<div class="prow">'+P.src.map(function(x){
          return '<div class="pr"><span class="py">'+esc(x.t)+'</span><span class="pn">'+esc(x.y)+'</span></div>';
        }).join("")+'</div></div>'
      : '<div class="qcard"><div class="qtext" style="font-size:17px">인물과 한 일을 짝지어요</div>'+
        '<p class="note">두 장을 뒤집어 인물과 그가 한 일이 맞으면 그대로 남아요.</p></div>')+
    '<div class="pgrid" id="pg">'+P.cards.map(function(c,i){
      var up=P.hit[c.p]||P.open.indexOf(i)>=0;
      return '<button class="pcard'+(P.hit[c.p]?" hit":(up?" up":""))+'" data-i="'+i+'"'+
        (up?' disabled':'')+'>'+
        (up?'<span class="fr'+(c.k==="y"?" d":"")+'">'+esc(c.v)+'</span>'
           :'<span class="bk">?</span>')+'</button>';
    }).join("")+'</div><div class="grow"></div>'+
    (P.over
      ? '<div class="sticky"><div class="btnrow">'+
        '<button class="btn ghost" id="pHome">홈으로</button>'+
        '<button class="btn" id="pAgain">한 판 더</button></div></div>'
      : '');
  Array.prototype.forEach.call(view.querySelectorAll(".pcard"),function(b){
    b.onclick=function(){pairFlip(+b.dataset.i);};
  });
  if(P.over){
    document.getElementById("pHome").onclick=function(){P=null;stack=[{n:"home"}];render();};
    document.getElementById("pAgain").onclick=function(){var k=P.key;P=null;go("pair",JSON.parse(k),true);};
  }
}

function pairFlip(i){
  if(P.over||P.lock)return;
  var c=P.cards[i];
  if(P.hit[c.p]||P.open.indexOf(i)>=0)return;
  P.open.push(i);
  if(P.open.length<2){paintPair();return;}
  P.moves++;
  var a=P.cards[P.open[0]],b=P.cards[P.open[1]];
  if(a.p===b.p&&a.k!==b.k){
    P.hit[a.p]=1; P.open=[]; buzz(18); flash("rgba(72,211,172,.26)");
    if(Object.keys(P.hit).length>=P.src.length)return pairDone();
    paintPair();
  }else{
    P.lock=true; buzz([20,40]); paintPair();
    setTimeout(function(){ if(!P)return; P.open=[]; P.lock=false; paintPair(); },780);
  }
}

function pairDone(){
  P.over=true;
  P.secs=Math.round((Date.now()-P.t0)/1000);
  if(pairTimer){clearInterval(pairTimer);pairTimer=null;}
  markDay(); s2init(); s3init();
  missionBump("pair");
  /* 최단 시간을 기록으로 남긴다. 같으면 뒤집은 횟수가 적은 쪽 */
  var b=S.best.pair,mine={t:P.secs,m:P.moves};
  var better=!b||mine.t<b.t||(mine.t===b.t&&mine.m<b.m);
  if(better)S.best.pair=mine;
  save();
  paintPair();
  var st=view.querySelector(".sticky");
  var head=document.createElement("div");
  head.className="result svend";
  head.innerHTML='<div class="big">'+P.secs+'<span style="font-size:20px">초</span></div>'+
    '<div class="sub">'+P.moves+'번 만에 '+P.src.length+'짝 · '+
      (better?'<b style="color:var(--jade)">새 기록!</b>':'최고 '+(b?b.t+"초":"–"))+'</div>';
  view.insertBefore(head,view.firstChild);
  if(better)toast("★ 새 기록 "+P.secs+"초");
}

    return '<div class="hud">'+hearts(G.lives)+
      '<span class="track"><i style="width:'+Math.min(100,G.i/40*100)+'%"></i></span>'+
      (G.combo>=2?'<span class="combo">'+ICON.fire+' '+G.combo+'</span>':'')+
      '<span class="score">'+G.log.length+'</span></div>';
  }
  return _hud3();
};

var _grade3=grade;
grade=function(q,ok){
  var before=(G&&G.revive);
  _grade3(q,ok);
  /* 부활 아이템을 썼으면 목숨은 깎지 않는다 — _grade3 가 이미 정답으로 바꿔 놨다 */
  if(G&&G.mode==="sv"&&!ok&&!before&&!G.revived)G.lives--;
  if(G)G.revived=false;
};

var _next3=next;
next=function(){
  if(G&&G.mode==="sv"){
    advTimer=null;
    if(G.lives<=0)return finish();
    G.i++;
    if(G.i>=G.queue.length)G.queue=G.queue.concat(shuffle(svPool()));
    paintQ();
    return;
  }
  _next3();
};

var _finish3=finish;
finish=function(){
  if(G&&G.mode==="sv"){
    s3init();
    var lasted=G.log.length;                 /* 마지막(치명타) 문항까지 세야 맞다 */
    if(lasted>(S.best.sv||0))S.best.sv=lasted;
    if(lasted>=10)missionBump("sv");
    save();
  }
  if(G&&G.mode==="cho"){
    s3init();
    if(G.score>(S.best.cho||0)){S.best.cho=G.score;}
    save();
  }
  _finish3();
};

var _vPlay3=vPlay;
vPlay=function(a){
  if(a&&a.mode==="sv"){
    if(!G||G.key!==JSON.stringify(a)){
      G={key:JSON.stringify(a),mode:"sv",unit:null,queue:shuffle(svPool()),i:0,score:0,
         combo:0,maxCombo:0,ok:0,log:[],left:0,done:false,answered:false,lives:SV_LIVES};
    }
    return paintQ();
  }
  _vPlay3(a);
};

var _vResult3=vResult;
vResult=function(){
  _vResult3();
  s3init();
  var extra="";
  if(G.mode==="cho")
    extra='<div class="sub" style="margin-top:6px">최고 '+(S.best.cho||0)+'점</div>';
  if(G.mode==="sv")
    extra='<div class="sub" style="margin-top:6px">'+G.log.length+'문제까지 버텼어요 · 최고 '+(S.best.sv||0)+'문제</div>';
  if(extra){
    var r=view.querySelector(".result");
    if(r)r.insertAdjacentHTML("beforeend",extra);
  }
  /* 「한 판 더」가 새 모드에서도 제 화면으로 가게 한다 */
  var ag=document.getElementById("again");
  if(ag&&(G.mode==="cho"||G.mode==="sv")){
    var m=G.mode,u=G.unit;
    ag.onclick=function(){ G=null; if(m==="cho")go("cho",{unit:u},true); else go("play",{mode:"sv"},true); };
  }
};

/* ═══════════ 명예의 전당 ═══════════ */
function vHall(){
  s3init();
  var p=S.best.pair;
  var rows=[
    ["스피드 O·X","최고 점수",S.best.ox?S.best.ox+"점":null],
    ["초성 사냥","최고 점수",S.best.cho?S.best.cho+"점":null],
    ["인물 짝 맞추기","최단 기록",p?p.t+"초 / "+p.m+"번":null],
    ["서바이벌","최다 문제",S.best.sv?S.best.sv+"문제":null],
    ["스토리","격파한 시대",ERA_ORDER.filter(function(e){return S.cleared[e];}).length+" / 8"],

  ];
  view.innerHTML=
    '<p class="note" style="margin-bottom:14px">모드마다 제일 잘한 판을 남겨 둬요. 깨 보세요.</p>'+
    '<div class="hof">'+rows.map(function(r){
      return '<div class="hrow"><span class="hn">'+r[0]+'<br>'+
        '<small style="color:var(--tx3);font-size:12px">'+r[1]+'</small></span>'+
        '<span class="hv'+(r[2]?"":" none")+'">'+(r[2]||"아직 없음")+'</span></div>';
    }).join("")+'</div>'+
    '<div class="sect">누적</div>'+
    '<div class="rgrid">'+stat(S.correct,"맞힌 문제")+stat(acc()+"%","정답률")+
      stat(S.streak+"일","연속 학습")+'</div>';
}

MISSIONS.push(
  {id:"m_cho",n:"초성 사냥 한 판 끝내기",goal:1,k:"cho"},

);

VIEWS.cho=vCho; VIEWS.pair=vPair; VIEWS.hall=vHall;
VIEWS.result=vResult; VIEWS.play=vPlay;
PATH.cho="/CHO"; PATH.pair="/PAIR"; PATH.hall="/HALL";

ICON.cho='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18.5" cy="16.5" r="3.5"/><path d="M21 19l1.5 1.5"/></svg>';
ICON.pair='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="8" height="16" rx="1.5"/><rect x="13" y="4" width="8" height="16" rx="1.5"/><path d="M6 9h2M16 9h2M6 13h2M16 13h2"/></svg>';

var _vHome3=vHome;
vHome=function(){
  _vHome3();
  s3init();
  var p=S.best.pair;
  var extra=document.createElement("div");
  extra.innerHTML=
    '<div class="sect">한 판 더</div><div class="modes">'+
      '<button class="mode m8" data-go="cho"><span class="ic">'+ICON.cho+'</span>'+
      '<span><b>초성 사냥</b><small>ㅁㅆㅇ ㅎㅈ → 미쓰야 협정. 초성만 보고 낱말 맞히기.</small></span>'+
      '<span class="cnt">'+(S.best.cho?S.best.cho+"점":choPool().length+"낱말")+'</span></button>'+
      '<button class="mode m9" data-go="pair"><span class="ic">'+ICON.pair+'</span>'+
      '<span><b>인물 짝 맞추기</b><small>카드를 뒤집어 인물과 한 일을 짝지어요. 도감에 나오는 그 사람들.</small></span>'+
      '<span class="cnt">'+(p?p.t+"초":PAIR_N+"짝")+'</span></button>'+
      '<button class="mode m10" data-go="sv"><span class="ic">'+ICON.sv+'</span>'+
      '<span><b>서바이벌</b><small>목숨 셋. 세 번 틀리면 끝. 어디까지 버티나.</small></span>'+
      '<span class="cnt">'+(S.best.sv?"최고 "+S.best.sv:"목숨 3")+'</span></button>'+
    '</div>'+
    '<button class="monbar" id="toHall" style="margin-top:14px;margin-bottom:0">'+
      '<span class="n" style="color:var(--amber)">'+ICON.cup+'</span>'+
      '<span class="tx"><b>명예의 전당</b><small>모드마다 제일 잘한 판</small></span>'+
      '<span class="chev">'+ICON.chev+'</span></button>';
  /* 「범위」 설명 바로 앞에 끼워 넣는다 */
  var sects=view.querySelectorAll(".sect");
  var anchor=sects[sects.length-1];
  view.insertBefore(extra,anchor);
  Array.prototype.forEach.call(extra.querySelectorAll("[data-go]"),function(b){
    b.onclick=function(){
      var k=b.dataset.go;
      if(k==="sv")go("play",{mode:"sv"});
      else go(k,{});
    };
  });
  document.getElementById("toHall").onclick=function(){go("hall");};
};
VIEWS.home=vHome;

s3init(); save();
/* 부팅이 이미 홈을 그렸으면 새 모드가 붙도록 한 번 더 그린다 (2단계와 같다) */
if(stack.length===1&&stack[0].n==="home")render();


/* 셸이 부를 수 있게 홈으로 가는 길을 하나 내어 둔다 */
window.__hansaHome=window.__hansaHome||{};
window.__hansaHome.mon=function(){ stopAll(); G=null; stack=[{n:"home"}]; render(); };

})();

<script>
/* ══════════════════════════════════════════════════════════════
   셸 — 앱 갈아 끼우기
   두 앱은 정적 id 만 다르고 화면 안에서 만드는 id 는 겹칠 수 있다.
   그래서 쉬는 앱의 뿌리를 DOM 에서 떼어 둔다 — getElementById 가 못 찾는다.
   요소 참조는 살아 있으므로 다시 붙이면 그대로 이어진다.
   ══════════════════════════════════════════════════════════════ */
(function(){
  var HOLD={}, SLOT={};
  var APPS=[
    {k:"learn",el:document.getElementById("Lapp"),n:"첫 수업",
     ic:'<svg width="22" height="22" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="2" y="2" width="12" height="12" fill="#2B1F33"/><rect x="3" y="3" width="10" height="10" fill="#FBF3E2"/><rect x="7" y="3" width="2" height="10" fill="#2B1F33"/><rect x="4" y="5" width="3" height="1" fill="#2B1F33"/><rect x="9" y="5" width="3" height="1" fill="#2B1F33"/><rect x="4" y="7" width="3" height="1" fill="#2B1F33"/><rect x="9" y="7" width="3" height="1" fill="#2B1F33"/></svg>',
     key:"hansa-learn-v1"},
    {k:"mon",el:document.getElementById("Mapp"),n:"오답 몬스터",
     ic:'<svg width="22" height="22" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="3" y="2" width="10" height="11" fill="#2B1F33"/><rect x="4" y="3" width="8" height="9" fill="#B79EEC"/><rect x="5" y="6" width="2" height="3" fill="#2B1F33"/><rect x="9" y="6" width="2" height="3" fill="#2B1F33"/><rect x="3" y="13" width="2" height="1" fill="#2B1F33"/><rect x="7" y="13" width="2" height="1" fill="#2B1F33"/><rect x="11" y="13" width="2" height="1" fill="#2B1F33"/></svg>',
     key:"hansa-monster-v1"}
  ];
  APPS.forEach(function(a){
    SLOT[a.k]=document.createComment("app:"+a.k);
    a.el.parentNode.insertBefore(SLOT[a.k],a.el);
  });

  function badge(a){
    try{
      var S=JSON.parse(localStorage.getItem(a.key)||"{}");
      if(a.k==="learn"){
        var w=Object.keys(S.wrong||{}).length;
        var due=0,t=Math.floor(Date.now()/864e5);
        Object.keys(S.due||{}).forEach(function(id){ if(S.done&&S.done[id]&&S.due[id].at<=t)due++; });
        return w+due;
      }
      return Object.keys(S.monsters||{}).length;
    }catch(e){ return 0; }
  }

  var bar=document.getElementById("tsk");
  function paint(){
    bar.innerHTML=APPS.map(function(a){
      var n=badge(a);
      return '<button class="tb" data-k="'+a.k+'" aria-current="'+(window.__hansa===a.k)+'">'+
        '<span class="ic">'+a.ic+'</span>'+a.n+
        (n?'<span class="bdg">'+(n>99?"99":n)+'</span>':'')+'</button>';
    }).join("");
    Array.prototype.forEach.call(bar.querySelectorAll(".tb"),function(b){
      b.onclick=function(){ switchTo(b.dataset.k); };
    });
  }

  function switchTo(k){
    if(window.__hansa===k){
      /* 켜져 있는 앱을 다시 누르면 그 앱의 홈으로 */
      try{ window.__hansaHome&&window.__hansaHome[k]&&window.__hansaHome[k](); }catch(e){}
      window.scrollTo(0,0); paint(); return;
    }
    window.__hansa=k;
    APPS.forEach(function(a){
      if(a.k===k){
        if(!a.el.parentNode)SLOT[a.k].parentNode.insertBefore(a.el,SLOT[a.k].nextSibling);
      }else if(a.el.parentNode){
        HOLD[a.k]=a.el; a.el.parentNode.removeChild(a.el);
      }
    });
    try{ localStorage.setItem("hansa-app",k); }catch(e){}
    paint(); window.scrollTo(0,0);
  }
  window.__hansaSwitch=switchTo;
  /* 앱 안에 심어 둔 [data-hansa-go] 단추 — 어느 화면에서 눌러도 통한다 */
  document.addEventListener("click",function(e){
    var t=e.target,b=t&&t.closest&&t.closest("[data-hansa-go]");
    if(b){ e.preventDefault(); switchTo(b.getAttribute("data-hansa-go")); }
  });
  /* 앱 안에서 배지 숫자가 바뀌면 표시줄도 따라간다 */
  window.__hansaPaint=paint;
  setInterval(paint,4000);

  var DOW=["SUN","MON","TUE","WED","THU","FRI","SAT"];
  function tick(){
    var d=new Date(),h=d.getHours(),ap=h<12?"AM":"PM",hh=h%12||12;
    document.getElementById("clk").textContent=DOW[d.getDay()]+" "+
      String(hh).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+ap+" "+d.getFullYear();
  }
  tick(); setInterval(tick,20000);

  var last="learn";
  try{ last=localStorage.getItem("hansa-app")||"learn"; }catch(e){}
  window.__hansa=null;
  switchTo(last==="mon"?"mon":"learn");
})();
</script>
