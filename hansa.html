<style>
/* ══════════════════════════════════════════════════════════════
   HANSA OS — 세 앱이 한 데스크톱 위에서 돌아간다.
   위쪽 작업 표시줄로 앱을 갈아 끼우고, 쉬는 앱은 DOM 에서 떼어 둔다.
   ══════════════════════════════════════════════════════════════ */
:root{
  --desk:#6E5A7D; --desk-d:#4A3B57; --desk-l:#8A7399;
  --cream:#FBF3E2; --panel:#F2E5C9; --panel-d:#E3D2AE;
  --ink:#2B1F33; --yel:#F5C63C; --yel-d:#C89A18; --red:#D2453B;
  --f-px:"Press Start 2P","Courier New",monospace;
  --f-h:"Do Hyeon","Gothic A1",sans-serif;
  --f-b:"Gothic A1","Apple SD Gothic Neo",system-ui,sans-serif;
  --bd:3px; --sh:4px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  border-radius:0!important;image-rendering:pixelated}
html,body{height:100%}
body{
  background:var(--desk);
  background-image:
    repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 2px,transparent 2px 4px),
    linear-gradient(160deg,var(--desk-l) 0%,var(--desk) 45%,var(--desk-d) 100%);
  background-attachment:fixed;
  color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.7;
  word-break:keep-all;overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;font-family:var(--f-b)}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── 작업 표시줄 ── */
.osbar{position:sticky;top:0;z-index:70;background:var(--ink);color:var(--cream);
  display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:var(--bd) solid #150E1B;
  font-family:var(--f-px);font-size:9px;letter-spacing:.04em}
.osbar .logo{display:inline-flex;gap:2px;flex-shrink:0;margin-right:2px}
.osbar .logo i{width:4px;height:12px;display:block;transform:skewX(-18deg)}
.osbar .clk{flex-shrink:0;color:var(--yel);margin-left:auto}
@media(max-width:520px){.osbar .clk{display:none}}
.tsk{display:flex;gap:6px;min-width:0;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.tsk::-webkit-scrollbar{display:none}
.tb{position:relative;display:inline-flex;align-items:center;gap:7px;min-height:34px;
  padding:5px 10px 5px 6px;background:var(--panel);color:var(--ink);border:2px solid #150E1B;
  box-shadow:inset -2px -2px 0 var(--panel-d),inset 2px 2px 0 #fff;
  font-family:var(--f-h);font-size:14px;white-space:nowrap}
.tb:active{box-shadow:inset 2px 2px 0 var(--panel-d);transform:translate(1px,1px)}
.tb[aria-current="true"]{background:var(--yel);
  box-shadow:inset -2px -2px 0 var(--yel-d),inset 2px 2px 0 #FFF0B8}
.tb .ic{width:22px;height:22px;flex-shrink:0;display:grid;place-items:center}
@media(max-width:400px){.tb{font-size:12.5px;padding:5px 8px 5px 5px;gap:5px}}
.tb .bdg{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;background:var(--red);
  border:2px solid #150E1B;color:#fff;font-family:var(--f-px);font-size:7px;
  display:grid;place-items:center;padding:0 2px;line-height:1}
.pane[hidden]{display:none}
</style>

 </div>

<style>
/* ── 「한국사 첫 수업」 ── */

/* ══════════════════════════════════════════════════════════════
   HANSA OS — 1985년식 픽셀 데스크톱. 단일 세계관이라 테마 전환 없이
   모든 색을 직접 칠한다.
   ══════════════════════════════════════════════════════════════ */
.a-learn{
  --desk:#6E5A7D; --desk-d:#4A3B57; --desk-l:#8A7399;
  --cream:#FBF3E2; --panel:#F2E5C9; --panel-d:#E3D2AE;
  --ink:#2B1F33; --ink-2:#5A4A66; --ink-3:#6E5C7A;
  --yel:#F5C63C; --yel-d:#C89A18;
  --org:#E0812C; --org-d:#B25F14;
  --red:#D2453B; --red-l:#F6DAD6;
  --teal:#2F8C7E; --teal-l:#D6EDE7;
  --blue:#3D6BB5; --blue-l:#DCE5F5;
  --f-px:"Press Start 2P","Courier New",monospace;
  --f-h:"Do Hyeon","Gothic A1",sans-serif;
  --f-b:"Gothic A1","Apple SD Gothic Neo",system-ui,sans-serif;
  --bd:3px; --sh:4px;
  /* 인라인 SVG(나무·장면·도장)가 쓰던 옛 이름을 새 팔레트로 잇는다 */
  --jade:#2F8C7E; --jade-d:#1D5C52; --blue-d:#2A4D85; --red-d:#B0342C; --ochre:#E0812C; --line2:#8B7A96;
  --bg2:#F2E5C9; --tx:#2B1F33; --tx2:#5A4A66; --f-d:"Do Hyeon","Gothic A1",sans-serif;
}
.a-learn *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  border-radius:0!important;image-rendering:pixelated}

.a-learn{
  background:var(--desk);
  background-image:
    repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 2px,transparent 2px 4px),
    linear-gradient(160deg,var(--desk-l) 0%,var(--desk) 45%,var(--desk-d) 100%);
  background-attachment:fixed;
  color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.7;
  word-break:keep-all;overscroll-behavior-y:none;
}
.a-learn button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;font-family:var(--f-b)}
.a-learn :focus-visible{outline:3px solid var(--yel);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.a-learn *,.a-learn *::before,.a-learn *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── 데스크톱 상단 바 ── */
.a-learn .osbar{position:sticky;top:0;z-index:60;background:var(--ink);color:var(--cream);
  display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:var(--bd) solid #150E1B;
  font-family:var(--f-px);font-size:9px;letter-spacing:.04em}
.a-learn .osbar .logo{display:inline-flex;gap:2px;flex-shrink:0}
.a-learn .osbar .logo i{width:4px;height:12px;display:block;transform:skewX(-18deg)}
.a-learn .osbar .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-learn .osbar .clk{flex-shrink:0;color:var(--yel)}
@media(max-width:400px){.a-learn .osbar{font-size:8px;gap:7px}}

/* ── 셸: 데스크톱 위의 창 + 독 ── */
.a-learn #Lapp{max-width:1000px;margin:0 auto;padding:12px;display:grid;gap:12px;
  grid-template-columns:1fr;min-height:100dvh;align-content:start}
@supports not (height:100dvh){.a-learn #Lapp{min-height:100vh}}
@media(min-width:820px){.a-learn #Lapp{grid-template-columns:1fr 108px;padding:16px}}

.a-learn .win{background:var(--cream);border:var(--bd) solid var(--ink);
  box-shadow:var(--sh) var(--sh) 0 rgba(21,14,27,.55);display:flex;flex-direction:column;min-width:0}

/* 창 제목 표시줄 */
.a-learn .bar{background:var(--ink);color:var(--cream);display:flex;align-items:center;gap:8px;
  padding:6px 7px;border-bottom:var(--bd) solid var(--ink);flex-shrink:0}
.a-learn .bar .ttl{flex:1;min-width:0;font-family:var(--f-px);font-size:9.5px;letter-spacing:.03em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:5px 7px;background:repeating-linear-gradient(90deg,#3B2C47 0 3px,transparent 3px 6px)}
.a-learn .ib{width:30px;height:30px;flex-shrink:0;background:var(--panel);border:2px solid var(--ink);
  position:relative;
  box-shadow:inset -2px -2px 0 var(--panel-d),inset 2px 2px 0 #fff;
  display:grid;place-items:center;color:var(--ink);font-family:var(--f-px);font-size:9px}
.a-learn .ib::after{content:"";position:absolute;inset:-8px}   /* 눈에 보이는 크기는 30px, 손가락 영역은 46px */
.a-learn .ib:active{box-shadow:inset 2px 2px 0 var(--panel-d);transform:translate(1px,1px)}

.a-learn .view{flex:1;display:flex;flex-direction:column;padding:14px;min-width:0}
@media(min-width:560px){.a-learn .view{padding:18px}}

/* ── 독 (넓은 화면: 오른쪽 · 좁은 화면: 아래 작업 표시줄) ── */
.a-learn .dock{display:flex;gap:8px;order:2}
/* 넓은 화면에서 독은 세로. align-self 를 안 주면 격자 칸 높이만큼 늘어나 아이콘이 흩어진다 */
@media(min-width:820px){.a-learn .dock{flex-direction:column;order:0;position:sticky;top:56px;align-self:start}
  .a-learn .dk{flex:0 0 auto}}
@media(max-width:819px){
  .a-learn .dock{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--ink);
    border-top:var(--bd) solid #150E1B;padding:6px;justify-content:center;
    padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
  .a-learn #Lapp{padding-bottom:84px}
}
.a-learn .dk{flex:1;max-width:96px;background:transparent;display:flex;flex-direction:column;
  align-items:center;gap:4px;padding:4px 2px;min-height:44px}
.a-learn .dk .ico{width:46px;height:46px;border:2px solid var(--ink);background:var(--panel);
  box-shadow:inset -3px -3px 0 rgba(43,31,51,.22),inset 3px 3px 0 rgba(255,255,255,.75);
  display:grid;place-items:center;position:relative}
.a-learn .dk .lb{font-family:var(--f-px);font-size:7px;letter-spacing:.02em;color:var(--cream);
  text-align:center;line-height:1.5}
@media(min-width:820px){.a-learn .dk .lb{color:var(--cream)}}
.a-learn .dk[aria-current="true"] .ico{background:var(--yel);box-shadow:inset -3px -3px 0 var(--yel-d),inset 3px 3px 0 #FFF0B8}
.a-learn .dk[aria-current="true"] .lb{color:var(--yel)}
.a-learn .dk:active .ico{transform:translate(1px,1px)}
.a-learn .dk .badge{position:absolute;top:-7px;right:-7px;min-width:19px;height:19px;background:var(--red);
  border:2px solid var(--ink);color:#fff;font-family:var(--f-px);font-size:7px;
  display:grid;place-items:center;padding:0 2px}

/* ── 공통 픽셀 부품 ── */
.a-learn .card,.a-learn .hero,.a-learn .paper,.a-learn .wcard,.a-learn .rv,.a-learn .sum,.a-learn .peek,.a-learn .wsum,.a-learn .exbar,.a-learn .wbar,.a-learn .mbar,.a-learn .lsn,.a-learn .tlr{
  background:var(--cream);border:var(--bd) solid var(--ink);box-shadow:var(--sh) var(--sh) 0 rgba(43,31,51,.28)}
.a-learn .card{padding:16px 15px;margin-bottom:0;animation:in .18s steps(3)}
@keyframes in{from{opacity:0;transform:translate(0,6px)}to{opacity:1;transform:none}}
.a-learn .card + .card{margin-top:12px}

/* 버튼 — 눌리는 느낌이 핵심 */
.a-learn .cta,.a-learn .chip,.a-learn .tw,.a-learn .qopt,.a-learn .o5,.a-learn .ans,.a-learn .ob{
  border:var(--bd) solid var(--ink);background:var(--panel);color:var(--ink);
  box-shadow:inset -3px -3px 0 rgba(43,31,51,.2),inset 3px 3px 0 rgba(255,255,255,.85),
             var(--sh) var(--sh) 0 rgba(43,31,51,.28);
  transition:none;font-weight:700}
.a-learn .cta:active,.a-learn .chip:active,.a-learn .tw:active,.a-learn .qopt:active:not(:disabled),.a-learn .o5:active,.a-learn .ob:active{
  transform:translate(var(--sh),var(--sh));
  box-shadow:inset 3px 3px 0 rgba(43,31,51,.2)}
.a-learn .cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;
  background:var(--yel);font-family:var(--f-h);font-size:17px;padding:12px 14px;
  box-shadow:inset -3px -3px 0 var(--yel-d),inset 3px 3px 0 #FFF0B8,var(--sh) var(--sh) 0 rgba(43,31,51,.34)}
.a-learn .cta:active{box-shadow:inset 3px 3px 0 var(--yel-d)}
.a-learn .cta.ghost{background:var(--panel);
  box-shadow:inset -3px -3px 0 var(--panel-d),inset 3px 3px 0 #fff,var(--sh) var(--sh) 0 rgba(43,31,51,.28)}
.a-learn .cta.ghost:active{box-shadow:inset 3px 3px 0 var(--panel-d)}
.a-learn .cta[disabled],.a-learn .chip[disabled]{opacity:.45;box-shadow:none;transform:none}
.a-learn .row{display:flex;gap:10px}.a-learn .row>*{flex:1}
.a-learn .row.back>#prev{flex:0 0 96px;font-size:14.5px;padding:12px 0}
.a-learn .cta.wide{width:100%}
.a-learn .sticky{margin-top:auto;padding:16px 0 4px;background:transparent}

/* 제목 · 본문 */
.a-learn .hero{padding:16px 15px}
.a-learn .hero h1{font-family:var(--f-h);font-size:21px;line-height:1.5;margin-bottom:7px}
.a-learn .hero p{font-size:14.5px;line-height:1.75;color:var(--ink-2)}
.a-learn .h{font-family:var(--f-h);font-size:22px;line-height:1.5;margin-bottom:11px}
.a-learn .h.sm{font-size:18.5px}
.a-learn .bd{font-size:16px;line-height:1.85;color:var(--ink-2)}
.a-learn .bd b,.a-learn .bd strong,.a-learn mark{background:var(--yel);color:var(--ink);font-weight:700;padding:1px 4px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
.a-learn .note{font-size:13.5px;line-height:1.7;color:var(--ink-2)}
.a-learn .note b{background:var(--yel);padding:1px 4px}
.a-learn .eyebrow{font-family:var(--f-px);font-size:8px;letter-spacing:.06em;color:var(--ink-3);margin-bottom:9px;line-height:1.7}
.a-learn .part{font-family:var(--f-px);font-size:8.5px;letter-spacing:.05em;color:var(--cream);
  margin:18px 0 9px;background:var(--ink);padding:7px 9px;display:flex;align-items:center;gap:8px;
  border:var(--bd) solid var(--ink);line-height:1.6}
.a-learn .part::after{content:"";flex:1;height:5px;
  background:repeating-linear-gradient(90deg,var(--yel) 0 3px,transparent 3px 6px)}
.a-learn .yr{font-family:var(--f-px);font-size:11px;color:var(--ink);background:var(--yel);
  border:2px solid var(--ink);padding:5px 8px;display:inline-block;margin-bottom:10px}

/* 왜 / 그래서 */
.a-learn .wsblock{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.a-learn .ws{display:flex;gap:10px;align-items:flex-start;background:var(--panel);
  border:2px solid var(--ink);padding:11px 12px}
.a-learn .ws .lb{font-family:var(--f-h);font-size:14px;flex-shrink:0;width:46px;line-height:1.6}
.a-learn .ws.why{background:var(--blue-l)} .a-learn .ws.why .lb{color:var(--blue-d)}
.a-learn .ws.so{background:var(--teal-l)} .a-learn .ws.so .lb{color:var(--jade-d)}
.a-learn .ws p{font-size:14.5px;line-height:1.75;color:var(--ink-2);flex:1;min-width:0}

/* 인과 사슬 */
.a-learn .scene{display:grid;place-items:center;padding:4px 0 14px;color:var(--org)}
.a-learn .chain{display:flex;flex-direction:column;margin-top:4px}
.a-learn .cl{display:flex;gap:12px;align-items:flex-start;position:relative;padding:6px 0;
  opacity:0;animation:fadeup .3s steps(4) forwards}
.a-learn .cl .dot{width:13px;height:13px;background:var(--org);border:2px solid var(--ink);flex-shrink:0;margin-top:7px}
.a-learn .cl::before{content:"";position:absolute;left:5px;top:24px;bottom:-6px;width:3px;
  background:repeating-linear-gradient(180deg,var(--ink-3) 0 3px,transparent 3px 6px)}
.a-learn .cl:last-child::before{display:none}
.a-learn .cl p{font-size:15px;line-height:1.7}
.a-learn .cl:last-child p{font-weight:800;background:var(--yel);padding:2px 5px}
@keyframes fadeup{from{opacity:0;transform:translate(-6px,0)}to{opacity:1;transform:none}}

/* 암기 장치 */
.a-learn .hintcard{background:var(--yel);border-color:var(--ink)}
.a-learn .hintcard .k{font-family:var(--f-h);font-size:25px;line-height:1.4;color:var(--ink);
  text-shadow:2px 2px 0 rgba(255,255,255,.55)}
.a-learn .hintcard .bd{margin-top:11px;color:var(--ink)}
.a-learn .hintcard em{font-style:normal;font-weight:800;background:var(--cream);
  border:2px solid var(--ink);padding:0 4px}

/* 스스로 떠올리기 */
.a-learn .recall{text-align:center;padding:4px 0}
.a-learn .recall .q{font-family:var(--f-h);font-size:20px;line-height:1.55}
.a-learn .recall .tip{font-size:13.5px;color:var(--ink-3);margin-top:13px}
.a-learn .recall .ans{font-family:var(--f-h);font-size:26px;color:var(--ink);margin:10px 0 2px;
  background:var(--yel);border:var(--bd) solid var(--ink);padding:8px 10px;display:inline-block;
  box-shadow:var(--sh) var(--sh) 0 rgba(43,31,51,.28)}
.a-learn .blur{filter:none;background:var(--ink)!important;color:transparent!important;
  text-shadow:none;user-select:none;
  background-image:repeating-linear-gradient(45deg,#3B2C47 0 4px,var(--ink) 4px 8px)!important}

/* 2지선다 · 4지선다 · 5지선다 */
.a-learn .two{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.a-learn .tw,.a-learn .qopt,.a-learn .o5,.a-learn .ans{min-height:52px;padding:12px 14px;font-size:15.5px;line-height:1.55;
  text-align:left;width:100%;display:flex;gap:10px;align-items:flex-start;font-weight:400}
.a-learn .opts5,.a-learn .two{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.a-learn #opts{display:flex;flex-direction:column;gap:10px}
.a-learn .qopt,.a-learn .o5{margin-bottom:0}
.a-learn .tw.ok,.a-learn .qopt.ok,.a-learn .o5.pick{background:var(--teal-l);border-color:var(--teal);
  box-shadow:inset -3px -3px 0 rgba(47,140,126,.3),inset 3px 3px 0 #fff,var(--sh) var(--sh) 0 rgba(43,31,51,.28)}
.a-learn .tw.no,.a-learn .qopt.no{background:var(--red-l);border-color:var(--red);
  box-shadow:inset -3px -3px 0 rgba(210,69,59,.3),inset 3px 3px 0 #fff,var(--sh) var(--sh) 0 rgba(43,31,51,.28)}
.a-learn .qopt.dim,.a-learn .o5.dim,.a-learn .ans.dim{opacity:.42;box-shadow:none}
.a-learn .qopt:disabled,.a-learn .tw:disabled,.a-learn .o5:disabled{cursor:default;transform:none}
.a-learn .kx,.a-learn .num{font-family:var(--f-px);font-size:10px;color:var(--ink-3);flex-shrink:0;padding-top:3px}
.a-learn .qopt.ok .kx,.a-learn .o5.pick .num{color:var(--jade-d)}
.a-learn .qopt.no .kx{color:var(--red-d)}

/* 정답/오답 배너 */
.a-learn .fb{border:var(--bd) solid var(--ink);padding:12px 13px;font-size:14.5px;line-height:1.75;
  margin-top:12px;display:flex;gap:10px;align-items:flex-start;
  box-shadow:var(--sh) var(--sh) 0 rgba(43,31,51,.28)}
.a-learn .fb.ok{background:var(--teal-l)} .a-learn .fb.no{background:var(--red-l)}
.a-learn .fb .m,.a-learn .fb .em{font-family:var(--f-h);font-size:17px;flex-shrink:0;line-height:1.5}
.a-learn .fb.ok .m{color:var(--jade-d)} .a-learn .fb.no .m{color:var(--red-d)}
.a-learn .fb b{background:var(--yel);padding:1px 4px}

/* 비교표 */
.a-learn .cmp{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:13px;
  border:var(--bd) solid var(--ink);box-shadow:var(--sh) var(--sh) 0 rgba(43,31,51,.28)}
.a-learn .cmp>div{background:var(--cream);padding:12px 11px;min-width:0;overflow-wrap:anywhere}
.a-learn .cmp>div+div{border-left:var(--bd) solid var(--ink)}
.a-learn .cmp h4{font-family:var(--f-h);font-size:15px;margin-bottom:8px;line-height:1.45;
  border-bottom:2px solid var(--ink);padding-bottom:5px}
.a-learn .cmp .a h4{color:var(--blue-d)} .a-learn .cmp .b h4{color:var(--red-d)}
.a-learn .cmp li{list-style:none;font-size:13px;line-height:1.6;color:var(--ink-2);padding-left:11px;
  position:relative;margin-bottom:5px}
.a-learn .cmp li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;background:var(--ink-3)}
.a-learn .cmp li b{background:var(--yel);color:var(--ink);padding:0 3px}

/* 진행 막대 */
.a-learn .track{height:14px;background:var(--panel);border:2px solid var(--ink);flex:1;padding:2px}
.a-learn .track i{display:block;height:100%;background:var(--org);
  background-image:repeating-linear-gradient(90deg,var(--org) 0 4px,var(--org-d) 4px 8px);
  transition:width .2s steps(6)}
.a-learn .step{font-family:var(--f-px);font-size:9px;color:var(--ink-2);flex-shrink:0}

/* 홈: 나무 · 진도 */
.a-learn .plant{display:grid;place-items:center;padding:12px 0;margin-bottom:12px;
  background:#DCEBD8;border:var(--bd) solid var(--ink);
  box-shadow:inset 3px 3px 0 rgba(43,31,51,.14)}
.a-learn .prog{display:flex;align-items:center;gap:12px;margin-top:14px}
.a-learn .ring{width:54px;height:54px;position:relative;flex-shrink:0;border:2px solid var(--ink);
  background:var(--panel);display:grid;place-items:center}
.a-learn .ring svg{display:none}
.a-learn .ring span{font-family:var(--f-px);font-size:10px;color:var(--ink)}
.a-learn .prog .pt{flex:1;min-width:0}
.a-learn .prog .pt b{display:block;font-family:var(--f-h);font-size:16px}
.a-learn .prog .pt small{display:block;font-size:12.5px;color:var(--ink-2)}
.a-learn .bestbox{width:54px;height:54px;flex-shrink:0;border:2px solid var(--ink);background:var(--yel);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.a-learn .bestbox b{font-family:var(--f-px);font-size:13px;color:var(--ink);line-height:1}
.a-learn .bestbox small{font-family:var(--f-px);font-size:6px;color:var(--ink)}

/* 수업 목록 */
.a-learn .lsn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;min-height:70px;
  padding:10px 11px;margin-bottom:10px}
.a-learn .lsn:active{transform:translate(var(--sh),var(--sh));box-shadow:none}
.a-learn .lsn.done{background:var(--teal-l);border-color:var(--teal)}
.a-learn .lsn .sc{width:46px;height:46px;flex-shrink:0;border:2px solid var(--ink);background:var(--yel);
  display:grid;place-items:center;color:var(--ink);
  box-shadow:inset -2px -2px 0 var(--yel-d),inset 2px 2px 0 #FFF0B8}
.a-learn .lsn.done .sc{background:var(--teal);color:var(--cream);
  box-shadow:inset -2px -2px 0 rgba(0,0,0,.25),inset 2px 2px 0 rgba(255,255,255,.35)}
.a-learn .lsn .tx{flex:1;min-width:0}
.a-learn .lsn .tx b{display:block;font-family:var(--f-h);font-size:15.5px;line-height:1.45}
.a-learn .lsn .tx small{display:block;font-family:var(--f-px);font-size:7.5px;color:var(--ink-2);
  margin-top:3px;line-height:1.7}
.a-learn .lsn .rt{flex-shrink:0;color:var(--ink-3);display:flex;align-items:center}
.a-learn .lsn .chk{width:26px;height:26px;background:var(--teal);border:2px solid var(--ink);
  display:grid;place-items:center;color:var(--cream)}

/* 배너들 */
.a-learn .wbar,.a-learn .exbar,.a-learn .mbar{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  min-height:70px;padding:11px 12px;margin-bottom:12px}
.a-learn .wbar:active,.a-learn .exbar:active,.a-learn .mbar:active{transform:translate(var(--sh),var(--sh));box-shadow:none}
.a-learn .mbar{background:var(--teal-l);border-color:var(--teal)}
.a-learn .mbar .n{font-family:var(--f-px);font-size:16px;color:var(--jade-d);min-width:34px;text-align:center}
.a-learn .wbar{background:var(--red-l);border-color:var(--red)}
.a-learn .wbar .n{font-family:var(--f-px);font-size:16px;color:var(--red-d);min-width:34px;text-align:center}
.a-learn .exbar{background:var(--blue-l);border-color:var(--blue)}
.a-learn .exbar .ic{width:44px;height:44px;flex-shrink:0;border:2px solid var(--ink);background:var(--cream);
  display:grid;place-items:center;color:var(--blue)}
.a-learn .wbar .tx,.a-learn .exbar .tx,.a-learn .mbar .tx{flex:1;min-width:0}
.a-learn .wbar .tx b,.a-learn .exbar .tx b,.a-learn .mbar .tx b{display:block;font-family:var(--f-h);font-size:15.5px;line-height:1.45}
.a-learn .wbar .tx small,.a-learn .exbar .tx small,.a-learn .mbar .tx small{display:block;font-size:12px;color:var(--ink-2);line-height:1.6}
.a-learn .wbar .ch,.a-learn .exbar .ch,.a-learn .mbar .ch{flex-shrink:0;color:var(--ink-3)}

/* 30초 복습 카드 */
.a-learn .peek{padding:12px 13px;margin-bottom:12px;background:var(--panel)}
.a-learn .peek .pt{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.a-learn .peek .lb{flex:1;min-width:0;font-family:var(--f-px);font-size:7.5px;color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.7}
.a-learn .peek .re{width:44px;height:44px;border:2px solid var(--ink);background:var(--cream);
  flex-shrink:0;font-size:16px;color:var(--ink);display:grid;place-items:center;
  box-shadow:inset -2px -2px 0 var(--panel-d),inset 2px 2px 0 #fff}
.a-learn .peek .re:active{transform:translate(1px,1px);box-shadow:inset 2px 2px 0 var(--panel-d)}
.a-learn .peek .pb .k{display:block;font-family:var(--f-h);font-size:18px;color:var(--ink);
  line-height:1.45;margin-bottom:6px;background:var(--yel);padding:3px 6px;
  border:2px solid var(--ink)}
.a-learn .peek .pb span{font-size:14px;line-height:1.75;color:var(--ink-2)}
.a-learn .peek em{font-style:normal;font-weight:800}

/* 마무리 · 결과 */
.a-learn .done-hero{text-align:center;padding:18px 0 8px}
.a-learn .done-hero .big,.a-learn .big{font-family:var(--f-px);font-size:26px;line-height:1.3;color:var(--ink);
  text-shadow:3px 3px 0 var(--yel)}
.a-learn .done-hero .sub{font-size:14.5px;color:var(--ink-2);margin-top:12px}
.a-learn .done-hero .sub b{background:var(--yel);padding:1px 4px}
.a-learn .stamp{display:grid;place-items:center;padding:4px 0 8px}
.a-learn .stamp.show{animation:st .4s steps(4)}
@keyframes st{0%{opacity:0;transform:scale(1.7) rotate(-14deg)}100%{opacity:1;transform:none}}
.a-learn .sumlist{display:flex;flex-direction:column;gap:10px}
.a-learn .sum{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;font-size:14.5px;line-height:1.7}
.a-learn .sum .n{font-family:var(--f-px);font-size:9px;color:var(--org);flex-shrink:0;padding-top:5px}
.a-learn .sum b{font-family:var(--f-h)}
.a-learn .rv{padding:13px 14px;margin-bottom:10px}
.a-learn .rv .t{font-family:var(--f-px);font-size:7.5px;color:var(--ink-3);line-height:1.7}
.a-learn .rv .k{font-family:var(--f-h);font-size:19px;color:var(--ink);margin:6px 0 8px;line-height:1.45;
  background:var(--yel);border:2px solid var(--ink);padding:4px 7px;display:inline-block}
.a-learn .rv .b{font-size:14px;line-height:1.75;color:var(--ink-2)}
.a-learn .rv em{font-style:normal;font-weight:800}
/* 통치 ↔ 저항 대조표 */
.a-learn .face{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px;align-items:start}
.a-learn .fcol{padding:9px 9px 10px;border:var(--bd) solid var(--ink);
  box-shadow:var(--sh) var(--sh) 0 rgba(43,31,51,.26)}
.a-learn .fcol.rule{background:var(--red-l)}
.a-learn .fcol.resist{background:var(--teal-l)}
.a-learn .fcol h4{font-family:var(--f-px);font-size:8px;line-height:1.7;margin-bottom:8px;color:var(--ink)}
.a-learn .fcol h4 i{font-style:normal;color:var(--ink-2)}
.a-learn .fc{display:block;width:100%;text-align:left;min-height:34px;padding:7px 8px;margin-bottom:5px;
  font-family:var(--f-b);font-size:13px;line-height:1.5;color:var(--ink);
  background:var(--cream);border:2px solid var(--ink)}
.a-learn .fc.new{background:var(--panel);color:var(--ink-2);border-style:dashed}
.a-learn .fc:active{transform:translate(1px,1px)}
.a-learn .fworld{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:9px;padding:8px 9px;
  background:var(--blue-l);border:var(--bd) solid var(--ink);
  box-shadow:var(--sh) var(--sh) 0 rgba(43,31,51,.26)}
.a-learn .fworld>b{font-family:var(--f-px);font-size:8px;line-height:1.7;margin-right:2px}
.a-learn .fworld .fc{display:inline-block;width:auto;margin-bottom:0}
/* 노란 카드 위에서는 흐린 회색이 안 읽힌다 */
.a-learn .hintcard .eyebrow{color:var(--ink-2)}
/* 서술형 연습 */
.a-learn .wbox{margin-bottom:12px}
.a-learn .wbox textarea{width:100%;padding:12px 13px;background:var(--cream);color:var(--ink);
  border:var(--bd) solid var(--ink);box-shadow:inset 2px 2px 0 var(--panel-d);
  font-family:var(--f-b);font-size:15.5px;line-height:1.85;resize:vertical;min-height:150px}
.a-learn .wbox textarea::placeholder{color:var(--ink-3)}
.a-learn .wkeys{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.a-learn .wkey{display:inline-flex;align-items:center;gap:5px;min-height:46px;padding:8px 12px;
  font-family:var(--f-h);font-size:14px;color:var(--ink-2);
  background:var(--panel);border:2px solid var(--ink-3)}
.a-learn .wkey.on{color:var(--ink);background:var(--teal-l);border-color:var(--teal)}
.a-learn .wkey:active{transform:translate(1px,1px)}
.a-learn .wscore{margin-top:13px;padding:10px 12px;font-family:var(--f-px);font-size:13px;line-height:1.7;
  border:2px solid var(--ink)}
.a-learn .wscore.ok{background:var(--teal-l)}
.a-learn .wscore.no{background:var(--red-l)}
.a-learn .wscore small{display:block;font-family:var(--f-b);font-size:13px;color:var(--ink-2);
  margin-top:5px;line-height:1.7}
.a-learn .rv .wk{padding:1px 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.a-learn .rv .wk.on{background:var(--teal-l)}
.a-learn .rv .wk.off{background:var(--red-l);box-shadow:inset 0 -2px 0 var(--red)}
.a-learn .peek .pb.cover>span:not(.cv){filter:blur(5px);user-select:none}
.a-learn .peek .pb{position:relative}
.a-learn .peek .pb .cv{display:none}
.a-learn .peek .pb.cover .cv{display:block;font-family:var(--f-px);font-size:7.5px;color:var(--ink-3);
  margin-top:7px;filter:none}
/* 암기 장치: 가리고 떠올리기 */
.a-learn .mmbar{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap}
.a-learn .mmbar .pill{font-family:var(--f-px);font-size:8px;line-height:1.7;padding:6px 7px;
  background:var(--panel);border:2px solid var(--ink)}
.a-learn .mmbar .pill.no{background:var(--red-l)}
.a-learn .mmbar .pill.ok{background:var(--teal-l)}
.a-learn .rv.mm{border-left:7px solid var(--panel-d)}
.a-learn .rv.mm.m0{border-left-color:var(--red)}
.a-learn .rv.mm.m1{border-left-color:var(--teal)}
.a-learn .rv .mst{margin-left:7px;padding:2px 5px;border:2px solid var(--ink);font-size:7px}
.a-learn .rv .mst.no{background:var(--red-l)}
.a-learn .rv .mst.ok{background:var(--teal-l)}
.a-learn .peekbtn{display:block;width:100%;text-align:left;min-height:52px;padding:11px 12px;
  font-family:var(--f-b);font-size:14px;line-height:1.7;color:var(--ink-2);
  background:repeating-linear-gradient(45deg,var(--panel) 0 7px,var(--panel-d) 7px 14px);
  border:2px dashed var(--ink-3)}
.a-learn .peekbtn:active{transform:translate(1px,1px)}
.a-learn .peekbtn span{display:block;font-family:var(--f-px);font-size:7.5px;color:var(--ink-2);margin-top:5px}
.a-learn .grade{display:flex;gap:8px;margin-top:11px}
.a-learn .grade button{flex:1;min-height:46px;font-family:var(--f-h);font-size:14px;color:var(--ink);
  background:var(--panel);border:2px solid var(--ink)}
.a-learn .grade button:active{transform:translate(1px,1px)}
.a-learn .grade .g0.on{background:var(--red-l);box-shadow:inset 0 0 0 2px var(--red)}
.a-learn .grade .g1.on{background:var(--teal-l);box-shadow:inset 0 0 0 2px var(--teal)}

/* 연표 — 시험 전날 한 장으로 훑는 화면 */
.a-learn .tabs{display:flex;margin-bottom:14px;border:var(--bd) solid var(--ink);
  box-shadow:var(--sh) var(--sh) 0 rgba(43,31,51,.28)}
.a-learn .tb{flex:1;min-height:44px;white-space:nowrap;font-family:var(--f-h);font-size:15px;color:var(--ink-2);
  background:var(--panel);border:0;border-right:2px solid var(--ink);cursor:pointer;padding:0 6px}
.a-learn .tb:last-child{border-right:0}
.a-learn .tb[aria-selected="true"]{background:var(--yel);color:var(--ink)}
.a-learn .tlbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}
/* 단원 칩이 여덟 줄로 흘러내리면 정작 연표가 화면 밖으로 밀린다 — 한 줄로 옆으로 민다 */
.a-learn .chips.strip{flex-wrap:nowrap;overflow-x:auto;padding:0 4px 7px 0;scrollbar-width:thin}
.a-learn .chips.strip .chip{flex:0 0 auto;white-space:nowrap}
.a-learn .tlbar .cnt{font-family:var(--f-px);font-size:8px;color:var(--ink-2);line-height:1.7}
.a-learn .tly{display:flex;align-items:center;gap:9px;margin:16px 0 9px}
.a-learn .tly b{font-family:var(--f-px);font-size:12px;color:var(--ink);background:var(--yel);
  border:2px solid var(--ink);padding:6px 8px;line-height:1;min-width:66px;text-align:center}
.a-learn .tly.hid b{background:var(--panel);color:var(--ink-3);letter-spacing:.12em;cursor:pointer}
.a-learn .tly i{flex:1;height:4px;background:repeating-linear-gradient(90deg,var(--ink) 0 3px,transparent 3px 7px)}
.a-learn .tlr{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  min-height:44px;padding:11px 12px;margin-bottom:8px;cursor:pointer;font:inherit}
.a-learn .tlr:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(43,31,51,.28)}
.a-learn .tlr .d{width:12px;height:12px;flex-shrink:0;margin-top:5px;background:var(--teal);border:2px solid var(--ink)}
.a-learn .tlr .x{flex:1;min-width:0}
.a-learn .tlr .x b{display:block;font-family:var(--f-h);font-size:16.5px;line-height:1.5;color:var(--ink)}
.a-learn .tlr .x small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.6}
/* 연표: 시기 · 갈래 */
.a-learn .tlmap{display:flex;align-items:stretch;gap:6px;margin-bottom:13px}
.a-learn .tlmap .e{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px;
  padding:8px 7px;background:var(--panel);border:var(--bd) solid var(--ink);text-align:center}
.a-learn .tlmap .e b{font-family:var(--f-px);font-size:8.5px;line-height:1.6}
.a-learn .tlmap .e small{font-family:var(--f-h);font-size:12px;color:var(--ink-2);line-height:1.45}
.a-learn .tlmap .e0{background:var(--red-l)}.a-learn .tlmap .e1{background:var(--yel)}.a-learn .tlmap .e2{background:var(--blue-l)}
.a-learn .tlmap .ar{align-self:center;font-family:var(--f-px);font-size:9px;color:var(--ink-3)}
.a-learn .tle{display:flex;align-items:flex-start;gap:10px;margin:26px 0 12px;padding:10px 11px;
  background:var(--ink);color:var(--cream);border:var(--bd) solid var(--ink);box-shadow:var(--sh) var(--sh) 0 rgba(43,31,51,.3)}
.a-learn .tle>b{font-family:var(--f-px);font-size:10px;line-height:1.7;flex:0 0 auto;color:var(--yel)}
.a-learn .tle span{flex:1;min-width:0}
.a-learn .tle .t{display:block;font-family:var(--f-h);font-size:15.5px;line-height:1.5}
.a-learn .tle small{display:block;font-size:12px;line-height:1.6;color:#CFC2D8;margin-top:2px}

/* ── 긴 목록은 화면에 들어올 때만 배치한다 ──────────────────────
   치트키 26장·연표 105줄처럼 한 화면을 넘는 목록은, 안 보이는 부분까지
   배치하느라 화면 전환이 느려진다. content-visibility 로 화면 밖은
   건너뛰게 하고, contain-intrinsic-size 로 자리만 잡아 둔다.
   (한 번 그려진 뒤에는 실제 높이를 기억해서 스크롤이 튀지 않는다) */

.a-mon .mode.m1 .ic{background:var(--crim-g);color:var(--crim)}
.a-mon .mode.m2 .ic{background:var(--amber-g);color:var(--amber)}
.a-mon .mode.m3 .ic{background:var(--jade-g);color:var(--jade)}
.a-mon .mode.m4 .ic{background:var(--mon-g);color:var(--mon)}
.a-mon .mode[disabled]{opacity:.45}

.a-mon .sect{font-size:11.5px;font-family:var(--f-m);letter-spacing:.12em;text-transform:uppercase;
  color:var(--tx3);margin:22px 0 10px;display:flex;align-items:center;gap:9px}
.a-mon .sect::after{content:"";flex:1;height:1px;background:var(--line)}

/* ── 단원 선택 ── */
.a-mon .units{display:flex;flex-direction:column;gap:8px}
.a-mon .unit{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:64px;
  background:var(--surf);border:var(--bd) solid var(--line);border-radius:var(--r-s);padding:12px 14px;
}
.a-mon .unit:active{background:var(--surf2)}
.a-mon .unit .no{font-family:var(--f-d);font-size:15px;color:var(--amber);width:26px;flex-shrink:0}
.a-mon .unit b{display:block;font-size:15px;font-weight:700}
.a-mon .unit small{display:block;font-size:11.5px;color:var(--tx3);font-family:var(--f-m)}
.a-mon .unit .rate{margin-left:auto;text-align:right;flex-shrink:0}
.a-mon .unit .rate i{display:block;font-family:var(--f-m);font-size:13px;font-style:normal;color:var(--tx2)}
.a-mon .unit .rate u{display:block;width:52px;height:4px;border-radius:4px;background:var(--surf3);
  margin-top:4px;text-decoration:none;overflow:hidden}
.a-mon .unit .rate u b{display:block;height:100%;background:var(--jade);border-radius:4px}

/* ── 플레이 ── */
.a-mon .hud{display:flex;align-items:center;gap:10px;padding:2px 0 14px}
.a-mon .timer{font-family:var(--f-m);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;
  padding:5px 11px;border-radius:99px;background:var(--surf);border:var(--bd) solid var(--line)}
.a-mon .timer.warn{color:var(--crim);border-color:var(--crim);animation:tick .6s steps(2) infinite}
@keyframes tick{50%{opacity:.5}}
.a-mon .track{flex:1;height:6px;border-radius:6px;background:var(--surf);overflow:hidden}
.a-mon .track i{display:block;height:100%;background:var(--amber);border-radius:6px;transition:width .3s linear}
.a-mon .score{font-family:var(--f-d);font-size:19px;color:var(--amber);font-variant-numeric:tabular-nums}
.a-mon .combo{font-family:var(--f-d);font-size:13px;color:var(--amber);padding:3px 9px;border-radius:99px;
  background:var(--amber-g);white-space:nowrap}

.a-mon .qcard{
  background:var(--surf);border:var(--bd) solid var(--line);border-radius:var(--r);padding:18px 17px;
  display:flex;flex-direction:column;gap:12px;
}
.a-mon .qmeta{display:flex;align-items:center;gap:8px;font-size:11px;font-family:var(--f-m);color:var(--tx3);
  letter-spacing:.05em;flex-wrap:wrap}
.a-mon .qmeta .era{color:var(--amber);letter-spacing:0;font-family:var(--f-b);font-weight:700;font-size:12px}
.a-mon .qmeta .mob{color:var(--mon);font-family:var(--f-b);font-weight:700;font-size:12px;letter-spacing:0;
  display:inline-flex;align-items:center;gap:4px}
.a-mon .qtext{font-size:18.5px;line-height:1.62;font-weight:500;text-wrap:balance;word-break:keep-all}
.a-mon .qtext.big{font-family:var(--f-d);font-size:25px;font-weight:400;line-height:1.42}

/* 답 버튼 — 엄지 영역 */
.a-mon .answers{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.a-mon .ans{
  display:flex;align-items:center;gap:11px;text-align:left;min-height:58px;padding:12px 15px;
  background:var(--surf);border:var(--bd) solid var(--line);border-radius:var(--r-s);
  font-size:16px;line-height:1.45;font-weight:500;transition:transform .09s,background .13s,border-color .13s;
  word-break:keep-all;
}
.a-mon .ans:active:not(:disabled){transform:scale(.985)}
.a-mon .ans .kx{font-family:var(--f-m);font-size:12px;color:var(--tx3);flex-shrink:0;width:14px}
.a-mon .ans.ok{border-color:var(--jade);background:var(--jade-g);color:#9BF0D0}
.a-mon .ans.ok .kx{color:var(--jade)}
.a-mon .ans.no{border-color:var(--crim);background:var(--crim-g);color:#FFB0BB}
.a-mon .ans.no .kx{color:var(--crim)}
.a-mon .ans.dim{opacity:.4}
.a-mon .ans:disabled{cursor:default}
.a-mon .ox2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.a-mon .oxb{
  min-height:104px;border-radius:var(--r);border:var(--bd) solid var(--line);background:var(--surf);
  font-family:var(--f-d);font-size:44px;transition:transform .09s,background .13s,border-color .13s;
}
.a-mon .oxb:active:not(:disabled){transform:scale(.97)}
.a-mon .oxb.o{color:var(--jade)} .a-mon .oxb.x{color:var(--crim)}
.a-mon .oxb.ok{border-color:var(--jade);background:var(--jade-g)}
.a-mon .oxb.no{border-color:var(--crim);background:var(--crim-g)}
.a-mon .oxb.dim{opacity:.35}

/* 해설 */
.a-mon .fb{border-radius:var(--r-s);padding:13px 15px;font-size:14.5px;line-height:1.65;margin-top:14px;
  display:flex;gap:10px;align-items:flex-start;word-break:keep-all}
.a-mon .fb.ok{background:var(--jade-g);color:#A7F0D6}
.a-mon .fb.no{background:var(--crim-g);color:#FFBAC3}
.a-mon .fb .em{font-family:var(--f-d);font-size:17px;line-height:1.35;flex-shrink:0}

.a-mon .btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;
  border-radius:var(--r-s);background:var(--amber);color:#2A1A02;font-weight:900;font-size:16.5px;
  transition:transform .09s,filter .13s;
}
.a-mon .btn:active{transform:scale(.985);filter:brightness(1.08)}
.a-mon .btn.ghost{background:var(--surf);color:var(--tx);border:var(--bd) solid var(--line);font-weight:700}
.a-mon .btn.mon{background:var(--mon);color:#160F22}
.a-mon .btn[disabled]{opacity:.4}
.a-mon .btnrow{display:flex;gap:9px;margin-top:12px}
.a-mon .btnrow>*{flex:1}
.a-mon .sticky{position:sticky;bottom:0;padding-bottom:calc(10px + var(--safeb));
  background:linear-gradient(rgba(22,18,27,0),var(--bg) 26%);padding-top:14px;margin-top:auto}

/* ── 연표 세우기 ── */
.a-mon .tl{display:flex;flex-direction:column;gap:8px;margin-top:14px;position:relative;touch-action:pan-y}
.a-mon .tlc{
  display:flex;align-items:center;gap:11px;background:var(--surf);border:var(--bd) solid var(--line);
  border-radius:var(--r-s);padding:11px 12px;min-height:62px;will-change:transform;
  transition:transform .18s cubic-bezier(.2,0,.2,1),border-color .15s,background .15s,box-shadow .15s;
}
.a-mon .tlc.drag{border-color:var(--amber);background:var(--surf2);z-index:5;
  box-shadow:0 12px 30px -8px rgba(0,0,0,.75);transition:border-color .15s,background .15s}
.a-mon .tlc.ok{border-color:var(--jade);background:var(--jade-g)}
.a-mon .tlc.no{border-color:var(--crim);background:var(--crim-g)}
.a-mon .tlc .grip{color:var(--tx3);flex-shrink:0;cursor:grab;touch-action:none;padding:6px 2px;margin:-6px 0}
.a-mon .tlc .yr{font-family:var(--f-m);font-weight:600;font-size:12.5px;color:var(--amber);
  flex-shrink:0;width:62px;line-height:1.35}
.a-mon .tlc .ord{font-family:var(--f-d);font-size:15px;color:var(--amber);flex-shrink:0;width:22px;
  text-align:center;font-variant-numeric:tabular-nums}
.a-mon .tlc .nm{font-size:14.5px;font-weight:700;line-height:1.4;flex:1;min-width:0;word-break:keep-all}
.a-mon .tlc .mv{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.a-mon .tlc .mv button{width:34px;height:26px;border-radius:7px;background:var(--surf2);
  display:grid;place-items:center;color:var(--tx2)}
.a-mon .tlc .mv button:active{background:var(--surf3)}
.a-mon .tlc .mv button[disabled]{opacity:.28}

/* ── 결과 ── */
.a-mon .result{text-align:center;padding:22px 0 8px}
.a-mon .result .big{font-family:var(--f-d);font-size:64px;line-height:1;color:var(--amber);
  font-variant-numeric:tabular-nums}
.a-mon .result .sub{font-size:14.5px;color:var(--tx2);margin-top:8px}
.a-mon .rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.a-mon .rgrid .stat .v{font-size:20px;color:var(--tx)}
.a-mon .rlist{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.a-mon .rrow{display:flex;gap:10px;align-items:flex-start;background:var(--surf);border:var(--bd) solid var(--line);
  border-radius:var(--r-s);padding:11px 13px;font-size:13.5px;line-height:1.55;word-break:keep-all}
.a-mon .rrow .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:6px}
.a-mon .rrow .dot.ok{background:var(--jade)} .a-mon .rrow .dot.no{background:var(--crim)}
.a-mon .rrow small{display:block;color:var(--tx3);font-size:12.5px;margin-top:2px}

/* ── 몬스터 목록 ── */
.a-mon .mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
.a-mon .mcard{background:var(--surf);border:var(--bd) solid var(--line);border-radius:var(--r-s);padding:12px 11px;
  display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.a-mon .mcard .kind{font-family:var(--f-m);font-size:9.5px;letter-spacing:.08em;color:var(--tx3);
  border:var(--bd) solid var(--line);border-radius:99px;padding:2px 7px}
.a-mon .mcard .nm{font-size:12px;color:var(--tx2);line-height:1.45;word-break:keep-all;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.a-mon .hp{display:flex;gap:3px}
.a-mon .hp i{width:15px;height:5px;border-radius:3px;background:var(--surf3)}
.a-mon .hp i.on{background:var(--jade)}

/* ── 듣기 ── */
.a-mon .listen{display:flex;flex-direction:column;align-items:center;gap:16px;padding:14px 0}
.a-mon .wave{display:flex;align-items:flex-end;gap:4px;height:44px}
.a-mon .wave i{width:5px;border-radius:3px;background:var(--mon);height:20%}
.a-mon .wave.on i{animation:w .9s ease-in-out infinite}
.a-mon .wave i:nth-child(2){animation-delay:.1s} .a-mon .wave i:nth-child(3){animation-delay:.2s}
.a-mon .wave i:nth-child(4){animation-delay:.3s} .a-mon .wave i:nth-child(5){animation-delay:.15s}
.a-mon .wave i:nth-child(6){animation-delay:.25s} .a-mon .wave i:nth-child(7){animation-delay:.05s}
@keyframes w{0%,100%{height:20%}50%{height:100%}}

/* ── 떠오르는 점수 ── */
.a-mon .pop{position:fixed;left:50%;top:34%;transform:translateX(-50%);z-index:60;pointer-events:none;
  font-family:var(--f-d);font-size:38px;color:var(--amber);text-shadow:0 4px 20px rgba(0,0,0,.6);
  animation:pop .8s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.6)}
  22%{opacity:1;transform:translateX(-50%) scale(1.14)}
  62%{opacity:1;transform:translateX(-50%) scale(1) translateY(-6px)}
  100%{opacity:0;transform:translateX(-50%) scale(1) translateY(-42px)}}
.a-mon .flash{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0}
.a-mon .flash.go{animation:fl .42s ease-out}
@keyframes fl{0%{opacity:.5}100%{opacity:0}}

.a-mon .empty{text-align:center;padding:44px 18px;color:var(--tx3)}
.a-mon .empty p{font-size:14.5px;line-height:1.7;max-width:30ch;margin:12px auto 0;word-break:keep-all}
.a-mon .note{font-size:12.5px;color:var(--tx3);line-height:1.6;word-break:keep-all}
.a-mon .hidden{display:none!important}

/* ── 긴 목록은 화면에 들어올 때만 배치한다 ──────────────────────
   치트키 26장·연표 105줄처럼 한 화면을 넘는 목록은, 안 보이는 부분까지
   배치하느라 화면 전환이 느려진다. content-visibility 로 화면 밖은
   건너뛰게 하고, contain-intrinsic-size 로 자리만 잡아 둔다.
   (한 번 그려진 뒤에는 실제 높이를 기억해서 스크롤이 튀지 않는다) */
.a-mon .dcard{content-visibility:auto;contain-intrinsic-size:auto 118px}
.a-mon .mcard{content-visibility:auto;contain-intrinsic-size:auto 132px}
.a-mon .rrow{content-visibility:auto;contain-intrinsic-size:auto 70px}


/* ══════ 2단계 ══════ */
.a-mon .mode.m5 .ic{background:rgba(255,180,67,.14);color:var(--amber)}
.a-mon .mode.m6 .ic{background:rgba(91,155,232,.16);color:#7FB4F0}
.a-mon .mode.m7 .ic{background:rgba(53,214,160,.15);color:var(--jade)}

/* 지도 */
.a-mon .eras{display:flex;flex-direction:column;gap:8px}
.a-mon .eracard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:74px;position:relative;
  background:var(--surf);border:var(--bd) solid var(--line);border-radius:var(--r);padding:11px 14px}
.a-mon .eracard:active:not([disabled]){background:var(--surf2)}
.a-mon .eracard.done{border-color:rgba(53,214,160,.45);background:linear-gradient(100deg,var(--jade-g),transparent 62%),var(--surf)}
.a-mon .eracard.lock{opacity:.5}
.a-mon .eracard .bs{width:52px;height:52px;flex-shrink:0;display:grid;place-items:center}
.a-mon .eracard .qm{font-family:var(--f-d);font-size:26px;color:var(--tx3)}
.a-mon .eracard .tx{flex:1;min-width:0}
.a-mon .eracard .tx b{display:block;font-family:var(--f-d);font-size:16px;font-weight:400;letter-spacing:-.01em}
.a-mon .eracard .tx small{display:block;font-size:11.5px;color:var(--tx3);line-height:1.5;word-break:keep-all}
.a-mon .eracard .st{flex-shrink:0;color:var(--tx3);font-size:14px}
.a-mon .eracard .st .ok{font-family:var(--f-d);font-size:12px;color:var(--jade);
  border:1px solid rgba(53,214,160,.4);border-radius:99px;padding:3px 9px}

/* 보스 바 */
.a-mon .boss{display:flex;align-items:center;gap:12px;background:var(--surf);border:var(--bd) solid var(--line);
  border-radius:var(--r);padding:10px 13px;margin-bottom:10px}
.a-mon .bsv{flex-shrink:0;line-height:0}
.a-mon .bsv.hit{animation:hit .26s ease-out}
.a-mon .bsv.hero{display:grid;place-items:center}
@keyframes hit{0%{transform:translateX(0)}25%{transform:translateX(-7px) scale(1.05)}
  60%{transform:translateX(6px)}100%{transform:translateX(0)}}
.a-mon .btx{flex:1;min-width:0}
.a-mon .btx b{display:block;font-family:var(--f-d);font-size:15.5px;font-weight:400}
.a-mon .btx small{display:block;font-family:var(--f-m);font-size:11px;color:var(--tx3);margin-top:3px}
.a-mon .bhp{height:9px;border-radius:9px;background:var(--bg2);overflow:hidden;margin-top:5px;
  border:var(--bd) solid var(--line)}
.a-mon .bhp i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--crim),#FF8A6B);
  transition:width .45s cubic-bezier(.2,.8,.3,1)}
.a-mon .ult{position:fixed;inset:0;z-index:70;pointer-events:none;display:grid;place-items:center;
  animation:ultf 1s ease-out forwards}
.a-mon .ult span{font-family:var(--f-d);font-size:56px;color:var(--amber);
  text-shadow:0 0 34px rgba(255,180,67,.75),0 6px 24px rgba(0,0,0,.8)}
.a-mon .ult em{position:absolute;bottom:36%;font-family:var(--f-m);font-style:normal;font-size:14px;
  letter-spacing:.24em;color:var(--tx2)}
@keyframes ultf{0%{opacity:0;transform:scale(.7)}18%{opacity:1;transform:scale(1.1)}
  70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.04)}}

/* 도감 */
.a-mon .dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.a-mon .dcard{background:var(--surf);border:var(--bd) solid var(--line);border-radius:var(--r-s);padding:10px 6px;
  display:flex;flex-direction:column;align-items:center;gap:5px;min-height:118px}
.a-mon .dcard:active:not([disabled]){background:var(--surf2)}
.a-mon .dcard.locked{opacity:.42}
.a-mon .dcard .pf{width:72px;height:72px;border-radius:50%;border:var(--bd) solid var(--line);overflow:hidden;
  display:grid;place-items:center;background:var(--bg2)}
.a-mon .dcard .qm{font-family:var(--f-d);font-size:26px;color:var(--tx3)}
.a-mon .dcard .nm{font-size:11.5px;font-weight:700;line-height:1.3;word-break:keep-all;text-align:center}
.a-mon .dcard .gg{font-family:var(--f-m);font-size:9.5px;letter-spacing:.08em}

/* 카드 획득 연출 */
.a-mon .modal{position:fixed;inset:0;z-index:80;background:rgba(10,8,14,.82);display:grid;place-items:center;
  padding:24px;animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.a-mon .mbox{background:var(--surf);border:var(--bd) solid var(--line);border-radius:20px;padding:24px 22px;
  max-width:320px;width:100%;text-align:center;animation:rise .34s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.94)}to{opacity:1;transform:none}}
.a-mon .mbox .gr{font-family:var(--f-d);font-size:15px;letter-spacing:.16em}
.a-mon .mbox .pf{width:150px;height:150px;margin:12px auto;border-radius:50%;border:3px solid;overflow:hidden;
  display:grid;place-items:center;background:var(--bg2)}
.a-mon .mbox .nm{font-family:var(--f-d);font-size:25px;letter-spacing:-.01em}
.a-mon .mbox .ds{font-size:13.5px;color:var(--tx2);line-height:1.6;margin:8px 0 18px;word-break:keep-all}

.a-mon .toast{position:fixed;left:50%;bottom:calc(22px + var(--safeb));transform:translateX(-50%);z-index:75;
  background:var(--surf2);border:var(--bd) solid var(--line);border-radius:99px;padding:10px 18px;
  font-size:13.5px;font-weight:700;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.8);animation:tst 2.1s ease-out forwards}
@keyframes tst{0%{opacity:0;transform:translateX(-50%) translateY(14px)}
  12%{opacity:1;transform:translateX(-50%) translateY(0)}
  82%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-8px)}}

/* 사료 */
.a-mon .srcbox{background:var(--bg2);border-left:3px solid var(--amber);border-radius:0 var(--r-s) var(--r-s) 0;
  padding:14px 15px;font-size:14.5px;line-height:1.78;color:var(--tx2);word-break:keep-all;
  max-height:38vh;overflow-y:auto}

/* 키워드 입력 */
.a-mon .kws{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.a-mon .kw{display:flex;align-items:center;gap:10px;background:var(--surf);border:var(--bd) solid var(--line);
  border-radius:var(--r-s);padding:4px 12px 4px 10px;min-height:58px}
.a-mon .kw.ok{border-color:var(--jade);background:var(--jade-g)}
.a-mon .kw.no{border-color:var(--crim);background:var(--crim-g)}
.a-mon .kw .kn{font-family:var(--f-d);font-size:15px;color:var(--tx3);width:20px;text-align:center;flex-shrink:0}
.a-mon .kw input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--tx);
  font-family:var(--f-b);font-size:16px;font-weight:600;padding:12px 0}

  --yel:#F5C63C; --yel-d:#C89A18;
  --f-px:"Press Start 2P","Courier New",monospace;
  --f-h:"Do Hyeon","Gothic A1",sans-serif;
  --bd:3px; --sh:4px;

  /* 앞서 쓰던 토큰 이름을 새 팔레트로 잇는다 — 규칙을 전부 고치지 않아도 되게 */
  --bg:#6E5A7D; --bg-2:#E3D2AE; --surf:#FBF3E2; --surf-2:#F2E5C9;
  --line:#2B1F33; --line-2:#8B7A96;
  --tx:#2B1F33; --tx-2:#5A4A66; --tx-3:#7A6885;
  --brand:#3D6BB5; --brand-soft:#DCE5F5; --brand-tx:#24457A;
  --red:#D2453B; --red-soft:#F6DAD6; --red-tx:#96271F;
  --grn:#2F8C7E; --grn-soft:#D6EDE7; --grn-tx:#1D5C52;
  --gold:#B25F14; --gold-soft:#FAE4C2;
  --shadow:var(--sh) var(--sh) 0 rgba(43,31,51,.28);
  --shadow-lg:var(--sh) var(--sh) 0 rgba(43,31,51,.36);
  --r:0; --r-sm:0;
  --f-d:"Do Hyeon","Gothic A1",sans-serif;
  --f-b:"Gothic A1","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-m:"Press Start 2P","Gothic A1",ui-monospace,monospace;
}

.a-sprint *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  border-radius:0!important;image-rendering:pixelated}

.a-sprint{
  background:var(--desk);
  background-image:
    repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 2px,transparent 2px 4px),
    linear-gradient(160deg,var(--desk-l) 0%,var(--desk) 45%,var(--desk-d) 100%);
  background-attachment:fixed;
  color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.7;
  word-break:keep-all;min-height:100vh;
}
.a-sprint button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;font-family:var(--f-b)}
.a-sprint :focus-visible{outline:3px solid var(--yel);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.a-sprint *,.a-sprint *::before,.a-sprint *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── 데스크톱 상단 바 ── */
.a-sprint .osbar{position:sticky;top:0;z-index:60;background:var(--ink);color:var(--cream);
  display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:var(--bd) solid #150E1B;
  font-family:var(--f-px);font-size:9px;letter-spacing:.04em}
.a-sprint .osbar .logo{display:inline-flex;gap:2px;flex-shrink:0}
.a-sprint .osbar .logo i{width:4px;height:12px;display:block;transform:skewX(-18deg)}
.a-sprint .osbar .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-sprint .osbar .clk{flex-shrink:0;color:var(--yel)}
@media(max-width:400px){.a-sprint .osbar{font-size:8px;gap:7px}}

/* ── 셸: 데스크톱 위의 창 + 독 ── */
.a-sprint .wrap{max-width:1060px;margin:0 auto;padding:12px 12px 88px;display:grid;
  grid-template-columns:1fr;gap:12px;min-height:calc(100dvh - 44px)}
@supports not (height:100dvh){.a-sprint .wrap{min-height:calc(100vh - 44px)}}
@media(min-width:1000px){
  .a-sprint .wrap{grid-template-columns:1fr 300px;align-items:start;padding:16px;gap:16px}
  .a-sprint .rail{position:sticky;top:60px}
}
.a-sprint .col{width:100%;min-width:0;display:flex;flex-direction:column}
.a-sprint .col .win{flex:1}
.a-sprint .rail{display:none}
@media(min-width:1000px){.a-sprint .rail{display:flex;flex-direction:column;gap:12px}}

/* 창 */
.a-sprint .win{background:var(--cream);border:var(--bd) solid var(--ink);
  box-shadow:var(--sh) var(--sh) 0 rgba(21,14,27,.55);display:flex;flex-direction:column;min-width:0}
.a-sprint .bar{background:var(--ink);color:var(--cream);display:flex;align-items:center;gap:8px;
  padding:6px 7px;border-bottom:var(--bd) solid var(--ink);flex-shrink:0}
.a-sprint .bar .ttl{flex:1;min-width:0;font-family:var(--f-px);font-size:9.5px;letter-spacing:.03em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:5px 7px;background:repeating-linear-gradient(90deg,#3B2C47 0 3px,transparent 3px 6px)}
.a-sprint .body{flex:1;display:flex;flex-direction:column;gap:12px;padding:13px;min-width:0}
@media(min-width:560px){.a-sprint .body{padding:16px}}

/* ── 상태 칩 (D-day · 연속) ── */
.a-sprint .chip{
  display:inline-flex;align-items:center;gap:5px;padding:5px 9px;
  background:var(--panel);border:2px solid var(--ink);
  box-shadow:inset -2px -2px 0 var(--panel-d),inset 2px 2px 0 #fff;
  font-size:12.5px;font-weight:700;white-space:nowrap;line-height:1.5;
}
.a-sprint .chip .n{font-family:var(--f-px);font-size:9px;letter-spacing:0}
.a-sprint .chip.dday{background:#C63A30;color:#fff;cursor:pointer;
  box-shadow:inset -2px -2px 0 #8E241C,inset 2px 2px 0 #E07C72}
.a-sprint .chip.dday:active{transform:translate(1px,1px);box-shadow:inset 2px 2px 0 #96271F}
.a-sprint .chip.strk{background:var(--yel);color:var(--ink);
  box-shadow:inset -2px -2px 0 var(--yel-d),inset 2px 2px 0 #FFF0B8}
/* ── 오늘 진도 줄 ── */
.a-sprint .today-bar{
  background:var(--panel);border:var(--bd) solid var(--ink);box-shadow:var(--shadow);
  padding:12px 13px;display:flex;align-items:center;gap:13px;flex-wrap:wrap;
}
.a-sprint .ring{width:46px;height:46px;flex-shrink:0;position:relative}
.a-sprint .ring svg{transform:rotate(-90deg)}
.a-sprint .ring span{position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--f-px);font-size:8px}
.a-sprint .today-bar .lbl{font-family:var(--f-px);font-size:7.5px;letter-spacing:.05em;color:var(--ink-2);line-height:1.8}
.a-sprint .today-bar .val{font-family:var(--f-h);font-size:16px;line-height:1.45}
.a-sprint .rank{margin-left:auto;text-align:right}
.a-sprint .rank .r{font-family:var(--f-h);font-size:16px;color:var(--ink);
  background:var(--yel);border:2px solid var(--ink);padding:2px 7px;display:inline-block;line-height:1.5}
.a-sprint .xpbar{height:8px;background:var(--cream);border:2px solid var(--ink);margin-top:6px;width:104px;
  margin-left:auto;overflow:hidden}
.a-sprint .xpbar i{display:block;height:100%;background:var(--teal,#2F8C7E);
  background-image:repeating-linear-gradient(90deg,#2F8C7E 0 3px,#256F64 3px 6px);transition:width .4s steps(6)}

/* ── 카드 ── */
.a-sprint .stage{display:flex;flex-direction:column;gap:12px;min-height:380px}
.a-sprint .card{background:var(--cream);border:var(--bd) solid var(--ink);box-shadow:var(--shadow);
  animation:in .18s steps(3)}
@keyframes in{from{opacity:0;transform:translate(0,6px)}to{opacity:1;transform:none}}
.a-sprint .card-h{padding:8px 12px;border-bottom:var(--bd) solid var(--ink);
  display:flex;align-items:center;gap:8px;background:var(--panel);flex-wrap:wrap}
/* 단원 색 딱지 — 흰 글씨는 8px 에서 대비가 모자라 옅은 바탕 + 먹색 글씨로 간다 */
.a-sprint .tag{font-family:var(--f-px);font-size:7.5px;letter-spacing:.04em;padding:5px 7px;line-height:1.6;
  background:#DCE5F5;color:var(--ink);border:2px solid var(--ink)}
.a-sprint .tag.ca{background:#F6DAD6}
.a-sprint .tag.cb{background:#DCE5F5}
.a-sprint .tag.cc{background:#D6EDE7}
.a-sprint .tag.cd{background:var(--cream)}
.a-sprint .tag.ce{background:#FAE4C2}
.a-sprint .tag.cf{background:#E8DDF3}
.a-sprint .card-h .kind{margin-left:auto;font-family:var(--f-px);font-size:7.5px;color:var(--ink-2);line-height:1.7}
.a-sprint .card-b{padding:17px 15px}

/* 연도 — 이 앱의 주인공 */
.a-sprint .yr.ya{font-size:clamp(18px,6vw,24px)}
.a-sprint .yr{font-family:var(--f-px);font-size:clamp(30px,10vw,44px);line-height:1.15;
  color:var(--ink);background:var(--yel);border:var(--bd) solid var(--ink);
  padding:9px 11px;display:inline-block;
  box-shadow:inset -4px -4px 0 var(--yel-d),inset 4px 4px 0 #FFF0B8}
.a-sprint .yr sup{font-size:.42em;vertical-align:super;margin-left:4px;color:var(--ink-2)}
.a-sprint .q{font-family:var(--f-h);font-size:23px;line-height:1.5}
.a-sprint .q.sm{font-size:19px}
.a-sprint .d{color:var(--ink-2);font-size:15.5px;line-height:1.78;margin-top:11px}
.a-sprint .d b{color:var(--ink);font-weight:700;background:var(--yel);padding:1px 4px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
.a-sprint mark{background:var(--yel);color:var(--ink);padding:1px 4px;font-weight:700}

/* 카드 안 연표 */
.a-sprint .rail-line{display:flex;flex-direction:column;margin-top:6px}
.a-sprint .rl{display:grid;grid-template-columns:60px 1fr;gap:11px;align-items:start;position:relative;padding:9px 0}
.a-sprint .rl::before{content:"";position:absolute;left:67px;top:0;bottom:0;width:3px;
  background:repeating-linear-gradient(180deg,var(--ink) 0 3px,transparent 3px 7px)}
.a-sprint .rl:first-child::before{top:18px}
.a-sprint .rl:last-child::before{bottom:calc(100% - 18px)}
.a-sprint .rl .y{font-family:var(--f-px);font-size:10px;text-align:right;color:var(--ink);padding-top:3px}
.a-sprint .rl .y.ya{font-family:inherit;font-size:11px;font-weight:700;line-height:1.3;word-break:keep-all;padding-top:1px}
.a-sprint .rl .dot{position:absolute;left:63px;top:14px;width:11px;height:11px;background:var(--red);
  border:2px solid var(--ink)}
.a-sprint .rl .t{font-family:var(--f-h);font-size:16px;padding-left:13px;line-height:1.5}
.a-sprint .rl .s{font-size:13.5px;color:var(--ink-2);padding-left:13px;line-height:1.65}
/* 헷갈리는 짝 */
.a-sprint .pline{margin:13px 0 4px;padding:13px 14px;background:var(--surf-2);
  border:var(--bd) solid var(--line);box-shadow:inset 2px 2px 0 var(--bg-2);
  font-size:16px;line-height:1.75}
.a-sprint .pline b{background:var(--yel);color:var(--ink);padding:1px 4px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
/* 연표: 전체 순서 보기 */
.a-sprint .tlsw{display:flex;gap:8px;margin:4px 0 2px}
.a-sprint .tlsw .btn{flex:1;font-size:14.5px;min-height:44px;padding:10px 8px}
.a-sprint .era{display:flex;align-items:flex-start;gap:10px;margin:22px 0 8px;padding:9px 11px;
  background:var(--ink);color:var(--cream);border:var(--bd) solid var(--ink)}
.a-sprint .era b{font-family:var(--f-px);font-size:9.5px;line-height:1.7;color:var(--yel);flex:0 0 auto}
.a-sprint .era span{font-family:var(--f-h);font-size:14px;line-height:1.55}
.a-sprint .rl.k-rule .dot{background:var(--red)}
.a-sprint .rl.k-resist .dot{background:var(--grn)}
.a-sprint .rl.k-world .dot{background:var(--brand)}
.a-sprint .rl.k-other .dot{background:var(--line-2)}
.a-sprint .rl.k-life .dot{background:var(--gold)}
.a-sprint .rl.k-life .tg{background:var(--gold-soft)}
.a-sprint .rl .tg{display:inline-block;margin-left:7px;vertical-align:2px;font-family:var(--f-px);
  font-size:7px;font-style:normal;padding:3px 4px;border:2px solid var(--ink);background:var(--panel)}
.a-sprint .rl.k-rule .tg{background:var(--red-soft)}
.a-sprint .rl .tg.tg.pr{background:var(--yel)}
.a-sprint .rl.k-resist .tg{background:var(--grn-soft)}
.a-sprint .rl.k-world .tg{background:var(--brand-soft)}

/* ── 선택지 · 버튼 ── */
.a-sprint .opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.a-sprint .opt,.a-sprint .ox,.a-sprint .btn,.a-sprint .gbtn,.a-sprint .uchip{
  border:var(--bd) solid var(--ink);background:var(--panel);color:var(--ink);
  box-shadow:inset -3px -3px 0 rgba(43,31,51,.2),inset 3px 3px 0 rgba(255,255,255,.85),
             var(--sh) var(--sh) 0 rgba(43,31,51,.28);
  transition:none;font-weight:700}
.a-sprint .opt:active:not(:disabled),.a-sprint .ox:active,.a-sprint .btn:active,.a-sprint .gbtn:active,.a-sprint .uchip:active{
  transform:translate(var(--sh),var(--sh));box-shadow:inset 3px 3px 0 rgba(43,31,51,.2)}
.a-sprint .opt{text-align:left;padding:12px 13px;font-size:15px;line-height:1.55;
  display:flex;gap:10px;align-items:flex-start}
.a-sprint .opt .k{font-family:var(--f-px);font-size:9px;color:var(--ink-2);padding-top:3px;flex-shrink:0}
.a-sprint .opt.ok{background:#257366;color:#fff;box-shadow:inset -3px -3px 0 #14443C,inset 3px 3px 0 #5FA99C,var(--shadow)}
.a-sprint .opt.ok .k{color:#D6EDE7}
.a-sprint .opt.no{background:#B0342C;color:#fff;box-shadow:inset -3px -3px 0 #7D2119,inset 3px 3px 0 #DC776D,var(--shadow)}
.a-sprint .opt.no .k{color:#F6DAD6}
.a-sprint .opt.dim{opacity:.45}
.a-sprint .opt:disabled{cursor:default}

.a-sprint .ox-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.a-sprint .ox{padding:18px 0;font-family:var(--f-px);font-size:26px;line-height:1}
.a-sprint .ox.ok{background:#2F8C7E;color:#fff;box-shadow:inset -3px -3px 0 #1D5C52,inset 3px 3px 0 #6FBCAF,var(--shadow)}
.a-sprint .ox.no{background:var(--red);color:#fff;box-shadow:inset -3px -3px 0 #96271F,inset 3px 3px 0 #E9857D,var(--shadow)}

.a-sprint .btn{padding:13px 16px;min-height:50px;background:var(--yel);font-family:var(--f-h);font-size:17px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:inset -3px -3px 0 var(--yel-d),inset 3px 3px 0 #FFF0B8,var(--sh) var(--sh) 0 rgba(43,31,51,.34)}
.a-sprint .btn:active{box-shadow:inset 3px 3px 0 var(--yel-d)}
.a-sprint .btn.ghost{background:var(--panel);
  box-shadow:inset -3px -3px 0 var(--panel-d),inset 3px 3px 0 #fff,var(--shadow)}
.a-sprint .btn.ghost:active{box-shadow:inset 3px 3px 0 var(--panel-d)}
.a-sprint .btn.wide{width:100%}
.a-sprint .btn-row{display:flex;gap:10px}
.a-sprint .btn-row>*{flex:1}

/* 스스로 채점 */
.a-sprint .grade{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}
.a-sprint .gbtn{padding:11px 5px;display:flex;flex-direction:column;gap:3px;align-items:center;min-height:56px;
  justify-content:center}
.a-sprint .gbtn strong{font-family:var(--f-h);font-size:16px;font-weight:400}
.a-sprint .gbtn small{font-family:var(--f-px);font-size:7px;color:var(--ink-2);line-height:1.7}
.a-sprint .gbtn.g1{background:var(--red-soft)} .a-sprint .gbtn.g2{background:var(--gold-soft)} .a-sprint .gbtn.g3{background:var(--grn-soft)}

/* 정오 알림 */
.a-sprint .fb{padding:12px 13px;font-size:14.5px;line-height:1.7;display:flex;gap:10px;align-items:flex-start;
  border:var(--bd) solid var(--ink)}
.a-sprint .fb.ok{background:var(--grn-soft);color:var(--ink)}
.a-sprint .fb.no{background:var(--red-soft);color:var(--ink)}
.a-sprint .fb .ic{font-family:var(--f-px);font-size:13px;line-height:1.4;flex-shrink:0;
  width:26px;height:26px;display:grid;place-items:center;border:2px solid var(--ink);color:#fff}
.a-sprint .fb.ok .ic{background:#257366} .a-sprint .fb.no .ic{background:#B0342C}
.a-sprint .fb b{font-weight:800}

/* 콤보 */
.a-sprint .combo{position:fixed;left:50%;top:20%;transform:translateX(-50%);z-index:90;pointer-events:none;
  font-family:var(--f-px);font-size:22px;color:var(--ink);background:var(--yel);
  border:var(--bd) solid var(--ink);padding:12px 16px;line-height:1.4;text-align:center;
  box-shadow:var(--sh) var(--sh) 0 rgba(43,31,51,.4);animation:pop .8s steps(4) forwards}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.7)}25%{opacity:1;transform:translateX(-50%) scale(1.1)}
  70%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-22px)}}

/* ── 치트키 ── */
.a-sprint .cmp{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--ink);
  border:var(--bd) solid var(--ink);margin-top:14px}
.a-sprint .cmp>div{background:var(--cream);padding:12px 11px}
.a-sprint .cmp h4{font-family:var(--f-h);font-size:16px;margin-bottom:8px;
  border-bottom:2px solid var(--ink);padding-bottom:5px}
.a-sprint .cmp li{font-size:13.5px;line-height:1.65;color:var(--ink-2);list-style:none;padding-left:13px;
  position:relative;margin-bottom:4px}
.a-sprint .cmp li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;background:var(--ink-3)}
.a-sprint .cmp .a h4{color:#24457A} .a-sprint .cmp .b h4{color:#96271F}
.a-sprint .mn{background:var(--cream);border:var(--bd) solid var(--ink);padding:14px 15px;box-shadow:var(--shadow)}
.a-sprint .mn .key{font-family:var(--f-h);font-size:24px;letter-spacing:.02em;color:var(--ink);
  line-height:1.4;background:var(--yel);border:2px solid var(--ink);padding:4px 8px;display:inline-block}
.a-sprint .mn .ttl{font-family:var(--f-px);font-size:7.5px;letter-spacing:.04em;color:var(--ink-2);
  margin-bottom:7px;line-height:1.8}
.a-sprint .mn .exp{font-size:14.5px;color:var(--ink-2);margin-top:10px;line-height:1.75}
.a-sprint .mn .exp em{font-style:normal;color:var(--ink);font-weight:700;background:var(--yel);padding:1px 3px}

/* ── 단원 숙련도 ── */
.a-sprint .panel{background:var(--cream);border:var(--bd) solid var(--ink);padding:13px 14px;box-shadow:var(--shadow)}
.a-sprint .panel h3{font-family:var(--f-h);font-size:16px;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.a-sprint .ubar{margin-bottom:11px}
.a-sprint .ubar:last-child{margin-bottom:0}
.a-sprint .ubar .r1{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:8px}
.a-sprint .ubar .r1 span:last-child{font-family:var(--f-px);font-size:8px;color:var(--ink-2);flex-shrink:0;padding-top:3px}
.a-sprint .ubar .tr{height:10px;background:var(--panel);border:2px solid var(--ink);overflow:hidden}
.a-sprint .ubar .tr i{display:block;height:100%;transition:width .4s steps(6);
  background:repeating-linear-gradient(90deg,var(--ink) 0 3px,#4A3B57 3px 6px)}
.a-sprint .ubar .wk{font-family:var(--f-px);font-size:7px;background:var(--red);color:#fff;
  border:2px solid var(--ink);padding:3px 4px;line-height:1.6;vertical-align:2px}

/* 범위 고르기 */
.a-sprint .upick{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.a-sprint .ugrp{font-family:var(--f-px);font-size:8px;letter-spacing:.04em;color:var(--cream);
  background:var(--ink);padding:6px 8px;margin-top:14px;line-height:1.7;
  display:flex;align-items:center;gap:8px;border:2px solid var(--ink)}
.a-sprint .ugrp::after{content:"";flex:1;height:5px;
  background:repeating-linear-gradient(90deg,var(--yel) 0 3px,transparent 3px 6px)}
.a-sprint .ugrp:first-child{margin-top:2px}
.a-sprint .uchip{padding:8px 11px;font-size:13.5px;min-height:44px;text-align:left}
.a-sprint .uchip small{display:block;font-family:var(--f-px);font-size:7px;font-weight:400;
  color:var(--ink-2);letter-spacing:0;line-height:1.7;margin-top:2px}
.a-sprint .uchip[aria-pressed="true"]{background:var(--yel);

{id:"L3",u:"s2",part:"나라를 빼앗기다",title:"총독부가 들어서다",sc:"building",
 hook:"1910년, 나라의 주권이 넘어갔어. 그럼 누가 어떻게 다스렸을까? 먼저 '누가 최고 권력자였는지'부터 확실히 해 두자.",
 cards:[
 {t:"fact",y:1910,n:"조선 총독부 설치",b:"식민 통치의 최고 기구야. 총독은 일본 육해군 대장 중에서 임명됐고, 입법·사법·행정권에 군사권까지 전부 쥐었어.",
  why:"한국을 효율적으로 지배하려면 권력을 한곳에 몰아야 했거든.",
  so:"총독은 일왕에게 직속돼서 일본 의회나 내각의 통제조차 거의 받지 않았어. 사실상 왕이나 다름없었지."},
 {t:"check",q:"조선 총독은 누구에게 직속되어 있었을까?",a:"일왕",hint:"일본 의회도 내각도 아니야. 그래서 견제가 안 됐어"},
 {t:"fact",y:1910,n:"중추원",b:"총독의 자문 기구였어. 친일파로 채워져 있어서 한국인의 뜻을 대변할 수 없었지.",
  why:"'한국인의 의견도 듣는다'는 모양새를 갖추려고 만든 거야.",
  so:"3·1 운동이 일어나기 전까지 단 한 번도 소집되지 않았어. 얼마나 형식적이었는지 알 수 있지."},
 {t:"hint",k:"중추원 = 한 번도 안 모임",b:"시험에 '중추원은 한국인을 대변하는 의결 기구였다' 같은 문장이 나오면 무조건 <em>×</em>야. ①자문 기구일 뿐이고 ②친일파로 구성됐고 ③3·1 운동 전까지 <em>한 번도 소집되지 않았어</em>."},
 {t:"pick",q:"중추원의 성격으로 맞는 것은?",c:["총독의 자문 기구","한국인의 의결 기구"],a:0,e:"자문 기구야. 의결권이 없었고 실제로 열리지도 않았어."},
 {t:"chain",title:"권력 구조 한눈에",items:["일왕","조선 총독 (육해군 대장 출신)","입법 · 사법 · 행정 · 군사권 독점","중추원은 자문만 (친일파, 미소집)"]},
 {t:"check",pr:2,q:"조선 총독은 일왕에 직속되어 일본 의회나 내각의 통제를 거의 받지 않았다 — ○일까 ×일까?",a:"○ — 육·해군 대장 가운데 임명됐고 입법·사법·행정권과 군사권까지 쥐었어.",hint:"총독 위엔 일왕뿐"}
 ],
 quiz:[
 {q:"조선 총독에 임명될 수 있었던 사람은?",c:["일본 육해군 대장","일본 의회 의원","조선 귀족","일본 내각 총리"],a:0,e:"군인이 통치했다는 점이 무단 통치의 성격을 보여 줘."},
 {q:"조선 총독부의 자문 기구는?",c:["중추원","임시 의정원","도 평의회","군국기무처"],a:0,e:"친일파로 구성된 형식적 기구였어."},
 {q:"중추원에 대한 설명으로 옳은 것은?",c:["3·1 운동 전까지 한 번도 소집되지 않았다","한국인의 의견을 법으로 만들었다","총독을 견제할 수 있었다","의결권을 가지고 있었다"],a:0,e:"이름만 있고 실제로는 열리지도 않았어."},
 {q:"조선 총독이 가지지 않았던 것은?",c:["일본 의회의 통제를 받을 의무","입법권","사법권","군사권"],a:0,e:"일왕에게 직속되어 의회·내각의 통제를 거의 받지 않았어."}
 ]},

{id:"L4",u:"s2",part:"나라를 빼앗기다",title:"칼을 찬 교사",sc:"sword",

 cards:[

 {t:"fact",y:1912,n:"조선 태형령",b:"몽둥이로 때리는 형벌을 법으로 정했어. 제13조에 이렇게 적혀 있어 — <b>본령은 조선인에 한하여 적용한다.</b>",

 {t:"fact",y:1912,n:"경찰범 처벌 규칙",b:"대중을 모아 관공서에 청원한 자, 경찰의 지시를 어긴 자 등을 구류나 벌금에 처했어.",

  why:"한국인을 깊이 배우게 하면 저항할 힘이 생기니까, 단순 기술만 익히게 하려 했어.",

 {t:"chain",title:"무단 통치를 한 줄로",items:["국권 피탈(1910)","헌병 경찰제 · 즉결 심판권","조선 태형령(1912) · 경찰범 처벌 규칙","우민화 교육 · 칼 찬 교사","공포 통치 → 3·1 운동으로 폭발"]},

 {t:"pick",q:"조선 태형령이 적용된 대상은?",c:["한국인에게만","한국인과 일본인 모두"],a:0,e:"제13조에 '본령은 조선인에 한하여 적용한다'고 못 박혀 있어."}

{id:"L5",u:"s2",part:"나라를 빼앗기다",title:"땅과 회사를 틀어쥐다",sc:"field",
 hook:"통치는 결국 돈이야. 일제가 가장 먼저 손댄 게 땅이었어. 그것도 '근대적 소유권을 확립한다'는 그럴듯한 명분을 달고.",
 cards:[
 {t:"fact",y:1910,n:"토지 조사 사업",b:"강점 직후부터 1918년까지 이어졌어. 토지 소유자는 정해진 기간 안에 신고해야 소유권을 인정받았지. 이걸 <b>기한부 신고제</b>라고 해. 근거 법령인 <b>토지 조사령</b>은 1912년에 나왔어.",
  why:"겉으로는 '지세를 공정하게 매기고 근대적 소유권을 세운다'고 했지만, 진짜 목적은 식민 통치 재정을 확보하고 일본인이 땅을 쉽게 사게 하려는 거였어.",
  so:"절차가 복잡하고 기간이 짧아서 신고를 놓친 땅이 많았어."},
 {t:"check",q:"토지 조사 사업의 신고 방식을 뭐라고 할까?",a:"기한부 신고제",hint:"기한 안에 신고해야 한다는 뜻이야"},
 {t:"fact",y:1918,n:"토지 조사 사업의 결과",b:"총독부는 지세 수입이 크게 늘었고, 신고 안 된 땅과 국공유지를 차지했어. 그 땅은 동양 척식 주식회사나 일본인에게 헐값으로 넘어갔지.",
  why:"국가가 걷은 땅을 일본인 이주민에게 싸게 넘겨야 정착이 빨라지니까.",
  so:"농민이 '일정한 지대만 내면 계속 농사지을 수 있던' 관행이 부정되고, 기한부 계약 소작농이 늘어났어. 언제든 쫓겨날 수 있게 된 거지."},
 {t:"fact",y:1910,n:"회사령",b:"회사를 세우려면 조선 총독의 <b>허가</b>를 받아야 했어. 총독의 명령만으로 회사를 해산시킬 수도 있었지. 어업과 광업에도 허가제를 적용했어.",
  why:"한국인 자본이 커지면 독립운동의 밑천이 되니까 미리 막은 거야.",
  so:"한국인 기업의 성장이 눌렸어. 이 회사령은 1920년에 폐지되면서 신고제로 바뀌는데, 그것도 한국인을 위해서가 아니라 일본 기업을 들여오기 위해서였어."},
 {t:"hint",k:"1910년대 = 허가제 / 1920년대 = 신고제",b:"회사령은 1910년대엔 <em>허가</em>제(막으려고), 1920년에 폐지되며 <em>신고</em>제(들여오려고). '신고제라서 한국인을 도왔다'는 문장은 <em>×</em>야."},
 {t:"fact",y:1914,n:"기간 시설 건설",b:"철도·도로·항만·통신망을 새로 깔았어.",
  why:"근대화를 위해서가 아니야. 일본 상품을 팔기 쉽게, 한국의 식량과 자원을 실어 내기 쉽게 하려는 거였어.",
  so:"수탈의 통로가 완성됐어."},

 {t:"check",q:"중광단은 뒷날 어떤 부대가 될까?",a:"북로 군정서",hint:"청산리 대첩의 주력 부대야"},
 {t:"fact",y:1911,n:"연해주 — 신한촌",b:"블라디보스토크 교외에 <b>신한촌</b>을 세우고 <b>권업회</b>가 활동했어. 뒤에 <b>이상설·이동휘</b>를 정·부통령으로 하는 <b>대한 광복군 정부</b>가 세워졌지(1914).",
  why:"러시아와 가까워 무기를 구하기 쉬웠어.",
  so:"'정부'라는 이름을 쓴 조직이 이때 이미 나왔다는 게 중요해."},
 {t:"fact",y:1910,n:"미주",b:"장인환·전명운의 의거를 계기로 애국심이 높아지자 <b>안창호</b> 주도로 한인 단체들이 통합해 <b>대한인 국민회</b>를 만들었어. 하와이에서는 <b>박용만</b>이 <b>대조선 국민군단</b>을 꾸려 군사 훈련을 했지.",
  why:"멀리 떨어져 있어 상대적으로 안전했고, 자금을 모으기 좋았어.",
  so:"미주는 주로 외교와 자금, 만주·연해주는 주로 무장 투쟁을 맡는 구도가 만들어져."},
 {t:"fact",y:1912,n:"상하이",b:"<b>신규식</b> 등이 <b>동제사</b>를 만들었고, 이들 중 일부가 <b>신한청년당</b>을 결성했어.",
  why:"열강의 조계 지역이 많아 외교 활동에 유리했어.",
  so:"신한청년당이 김규식을 파리 강화 회의에 보내고, 이 흐름이 대한민국 임시 정부 수립으로 이어져."},
 {t:"fact",y:1917,n:"대동단결 선언",b:"신규식·박은식·신채호·조소앙 등이 상하이에서 발표했어. '순종이 주권을 포기한 날이 곧 국민이 주권을 이어받은 날'이라는 <b>국민 주권론</b>을 폈지.",
  why:"나라를 다시 세우려면 '누가 주인인가'부터 정해야 했어.",
  so:"임시 정부를 세울 이론적 바탕이 됐어. 황제의 나라에서 국민의 나라로 넘어가는 결정적 문장이야."},
 {t:"hint",k:"서 · 북 · 연 · 미 · 상",b:"<em>서</em>간도 경학사·신흥 ‖ <em>북</em>간도 간민회·명동 학교·중광단 ‖ <em>연</em>해주 권업회·신한촌 ‖ <em>미</em>주 국민회·국민군단 ‖ <em>상</em>하이 동제사·신한청년당. 지도 왼쪽 위에서 시계 방향으로 돌면 이 순서야."},
 {t:"pick",q:"경학사와 신흥 강습소가 세워진 곳은?",c:["서간도 삼원보","북간도"],a:0,e:"서간도야. 북간도는 간민회·명동 학교·중광단이지."},
 {t:"chain",pr:5,title:"1910년대 국외 독립운동 기지 (프린트 표)",items:["<b>북간도</b> — 명동촌 · 간민회 · 명동 학교 · 중광단(→ 북로 군정서)","<b>서간도</b> — 신민회(이회영 · 이상룡)가 삼원보에, 경학사 → 부민단, 신흥 강습소 → <b>신흥 무관 학교</b>, 서로 군정서","<b>연해주</b> — 신한촌 · 권업회 · 한민 학교 · <b>대한 광복군 정부</b>(이상설 · 이동휘)","<b>상하이</b> — 동제사(신규식) · 신한청년당","<b>미주</b> — 대한인 국민회(안창호) · 대조선 국민군단(박용만, 하와이)"]},
 {t:"check",pr:5,q:"1910년대 무장 독립 전쟁 준비는 만주, 연해주 일대에서만 이루어졌다 — ○일까 ×일까?",a:"× — 미주 하와이에서도 박용만이 대조선 국민군단을 만들었어.",hint:"바다 건너 하와이"}
 ],

 {q:"연해주에서 이상설·이동휘를 정·부통령으로 세운 조직은?",c:["대한 광복군 정부","대한인 국민회","동제사","경학사"],a:0,e:"신한촌·권업회에 이어 세워졌어."},

{id:"L12",u:"s6",part:"1919년 봄",title:"불씨가 모이다",sc:"spark",
 hook:"3·1 운동은 어느 날 갑자기 터진 게 아니야. 국제 정세, 유학생, 그리고 한 사람의 죽음. 세 가지가 겹쳤어.",
 cards:[
 {t:"fact",y:1918,n:"국제적 배경",b:"러시아 혁명 뒤 <b>레닌</b>이 약소민족의 해방 운동을 돕겠다고 선언했고, 미국 대통령 <b>윌슨</b>은 <b>민족 자결주의</b>를 내놨어.",
  why:"제1차 세계 대전이 끝나며 세계 질서를 다시 짜던 참이었어.",
  so:"'지금이 기회다. 우리 뜻을 세계에 알리면 도와줄지 모른다'는 판단이 섰어."},
 {t:"fact",y:1919,n:"김규식의 파리 파견",b:"상하이의 <b>신한청년당</b>이 한국의 독립을 청원하려 <b>김규식</b>을 파리 강화 회의에 대표로 보냈어.",
  why:"민족 자결주의가 논의되는 자리에 직접 가야 했으니까.",
  so:"'우리가 독립을 원한다는 증거'가 필요해졌어. 국내에서 큰 시위가 일어나야 대표의 말에 힘이 실리거든."},
 {t:"fact",y:1919,n:"2·8 독립 선언",b:"일본에 유학 중이던 학생들이 <b>조선 청년 독립단</b> 이름으로 도쿄에서 독립 선언서를 발표했어. '요구가 실현되지 않으면 영원히 혈전을 벌이겠다'고 했지.",
  why:"파리 회의에 맞춰 목소리를 내야 했어.",
  so:"적의 심장부에서 터진 선언이라 국내에 큰 충격을 줬어. 3·1 운동의 직접적 계기야."},
 {t:"check",q:"도쿄에서 유학생들이 발표한 선언은?",a:"2·8 독립 선언",hint:"3·1 운동보다 3주쯤 앞서 있었어"},
 {t:"fact",y:1919,n:"고종의 서거",b:"1월에 고종이 세상을 떠났어. 일제가 독살했다는 소문이 퍼지며 분노가 크게 번졌지.",
  why:"이미 강제 퇴위당한 황제였기에 사람들의 감정이 복잡했어.",
  so:"천도교·기독교·불교 지도자와 학생들이 <b>고종의 국장일</b>에 즈음해 만세 시위를 계획했어. 사람이 많이 모이는 날이었거든."},
 {t:"chain",title:"불씨가 모인 순서",items:["레닌 · 윌슨의 민족 자결주의","신한청년당, 김규식을 파리로","2·8 독립 선언 (도쿄)","고종 서거 · 국장일","3·1 운동"]},
 {t:"hint",k:"레 · 윌 · 김 · 2·8 · 고종",b:"국제(<em>레</em>닌·<em>윌</em>슨) → 국외(<em>김</em>규식 파리, <em>2·8</em> 도쿄) → 국내(<em>고종</em> 서거). 바깥에서 안으로 좁혀 들어와."},
 {t:"pick",q:"3·1 운동이 계획된 날은?",c:["고종의 국장일 즈음","순종의 장례일"],a:0,e:"고종이야. 순종의 장례일에 일어난 건 6·10 만세 운동(1926)이지. 이걸 바꿔 내는 문제가 아주 많아."}
 ],

 {q:"민족 자결주의를 제창한 사람은?",c:["윌슨","레닌","김규식","손병희"],a:0,e:"레닌은 약소민족 해방 운동 지원을 선언했어."},
 {q:"김규식을 파리 강화 회의에 파견한 단체는?",c:["신한청년당","동제사","대한인 국민회","의열단"],a:0,e:"상하이에서 활동하던 단체야."},
 {q:"도쿄에서 발표된 독립 선언은?",c:["2·8 독립 선언","3·1 독립 선언서","대동단결 선언","기미 독립 선언"],a:0,e:"조선 청년 독립단 이름으로 발표했어."},
 {q:"3·1 운동을 계획할 때 기준으로 삼은 날은?",c:["고종의 국장일","순종의 장례일","일왕의 생일","광복절"],a:0,e:"사람이 많이 모이는 날이었어."}

{id:"L13",u:"s6",part:"1919년 봄",title:"만세",sc:"flag",
 hook:"1919년 3월 1일. 그날 실제로 무슨 일이 있었는지 시간 순서대로 따라가 보자. 장소 두 곳만 헷갈리지 않으면 돼.",
 cards:[
 {t:"fact",y:1919,n:"민족 대표의 독립 선언",b:"손병희·이승훈·한용운 등 민족 대표 33인은 원래 탑골 공원에서 선언식을 하려 했어. 그런데 시위가 과격해질까 걱정해 <b>태화관</b>이라는 음식점에 모여 선언식을 했지.",
  why:"충돌로 사람이 다칠 것을 우려했어.",
  so:"민족 대표는 태화관, 학생과 시민은 탑골 공원. 이 둘을 바꿔 내는 문제가 단골이야."},
 {t:"fact",y:1919,n:"탑골 공원의 만세",b:"탑골 공원에서는 학생과 시민이 독립 선언서를 낭독하고 '대한 독립 만세'를 외치며 거리로 쏟아져 나왔어.",
  why:"민족 대표가 오지 않자 학생들이 직접 나선 거야.",
  so:"평양·원산 등 주요 도시로 순식간에 번졌어."},
 {t:"check",q:"민족 대표 33인이 독립 선언식을 한 장소는?",a:"태화관",hint:"탑골 공원이 아니야. 학생과 시민이 그곳에 있었지"},
 {t:"fact",y:1919,n:"전국으로, 모든 계층으로",b:"도시에서 농촌으로 번졌는데, 농촌에서는 주로 <b>장날</b>을 이용했어. 학생·교사·상인·노동자는 물론 기생과 걸인까지 계층을 가리지 않고 참여했지.",
  why:"장날은 사람이 자연스럽게 모이는 날이라 발각될 위험이 적었어.",
  so:"'전 민족적'이라는 표현이 괜한 말이 아니야. 이게 3·1 운동의 가장 큰 특징이야."},
 {t:"fact",y:1919,n:"제암리 학살",b:"경기도 화성 제암리에서 일본군이 주민들을 교회에 모아 놓고 문을 잠근 채 총을 쏘고 불을 질렀어.",
  why:"시위를 공포로 꺾으려 한 보복이었어.",
  so:"이런 잔혹한 진압이 알려지면서 국제 여론이 크게 나빠졌어."},
 {t:"fact",y:1919,n:"무력 투쟁으로",b:"헌병 경찰의 무자비한 진압에 시위가 격해지면서, 일부 농민은 경찰 관서와 헌병대 같은 식민 통치 기관을 습격했어.",
  why:"평화적으로 외쳐도 총으로 답이 돌아왔으니까.",
  so:"'3·1 운동은 처음부터 끝까지 평화적이었다'는 문장은 <b>×</b>야. 뒤로 갈수록 무력 투쟁 양상으로 발전했어."},
 {t:"chain",title:"그날의 흐름",items:["민족 대표 — 태화관","학생·시민 — 탑골 공원","주요 도시로 확산","농촌은 장날에","제암리 학살 → 무력 투쟁으로 발전"]},
 {t:"pick",q:"3·1 운동의 전개에 대한 설명으로 옳은 것은?",c:["뒤로 갈수록 무력 투쟁 양상으로 발전했다","끝까지 평화적 만세 시위로만 진행됐다"],a:0,e:"무자비한 진압에 맞서 통치 기관을 습격하기도 했어."},
 {t:"chain",pr:6,title:"3·1 운동의 세 단계 (프린트)",items:["<b>1단계</b> — 태화관(민족 대표) · 탑골 공원(학생 · 시민)에서 독립 선언 → 서울 · 평양 · 원산 등 도시에서 만세 시위","<b>2단계</b> — 전국 도시로, 교사 · 상인 · 노동자 가담 → 상인은 가게 문을 닫고(철시) 노동자는 파업","<b>3단계</b> — 농촌으로(장날 장터 중심) → 탄압에 맞서 <b>무력 투쟁</b>으로, 만주 · 연해주 · 미주 · 일본 등 국외로도"]},
 {t:"check",pr:6,q:"3·1 운동은 민족 대표들이 탑골 공원에서 독립 선언서를 낭독하며 시작되었다 — ○일까 ×일까?",a:"× — 민족 대표는 태화관에서, 탑골 공원에서는 학생과 시민이 독립 선언서를 읽었어.",hint:"대표는 식당, 학생은 공원"}
 ],
 quiz:[
 {q:"민족 대표 33인이 독립 선언식을 한 곳은?",c:["태화관","탑골 공원","덕수궁","독립문"],a:0,e:"시위 과격화를 우려해 장소를 옮겼어."},
 {q:"농촌에서 만세 시위가 주로 열린 때는?",c:["장날","일요일","국장일","추석"],a:0,e:"사람이 자연스럽게 모이는 날이었어."},
 {q:"일본군이 주민을 교회에 모아 놓고 학살한 사건이 일어난 곳은?",c:["경기도 화성 제암리","평안도 정주","함경도 원산","전남 암태도"],a:0,e:"제암리 학살이야."},
 {q:"3·1 운동 참여 계층에 대한 설명으로 옳은 것은?",c:["직업과 계층을 가리지 않고 참여했다","학생만 참여했다","양반만 참여했다","농민은 참여하지 않았다"],a:0,e:"기생과 걸인까지 참여한 전 민족적 운동이었어."}
 ]},

{id:"L14",u:"s6",part:"1919년 봄",title:"그날이 바꾼 것",sc:"chain",
 hook:"3·1 운동은 곧바로 독립으로 이어지지 않았어. 그런데도 우리 근현대사에서 가장 중요한 사건으로 꼽혀. 왜일까?",
 cards:[
 {t:"story",h:"결과부터 보자",b:"3·1 운동이 남긴 건 세 가지야. ① 대한민국 임시 정부가 세워졌고 ② 일제가 문화 정치로 바꿨고 ③ 중국 5·4 운동 같은 다른 약소민족 운동에 영향을 줬어. 이 세 개가 시험에 나오는 전부라고 봐도 돼."},
 {t:"fact",y:1919,n:"임시 정부 수립의 계기",b:"운동을 겪으며 독립운동가들은 깨달았어. '전국이 동시에 일어났는데 이를 이끌 지도부가 없구나.'",
  why:"흩어진 힘을 하나로 묶을 구심점이 필요했어.",
  so:"이 인식에서 <b>대한민국 임시 정부</b>가 세워져. 3·1 운동의 가장 큰 결과야."},
 {t:"fact",y:1919,n:"통치 방식의 전환",b:"일제는 총칼로는 한국인의 독립 의지를 꺾을 수 없다는 걸 알게 됐어.",
  why:"전 민족이 일어났고 국제 여론도 나빠졌으니까.",
  so:"무단 통치를 접고 이른바 <b>문화 정치</b>로 바꿨어. 물론 속은 민족 분열 통치였지."},
 {t:"fact",y:1919,n:"민족 운동 주체의 확대",b:"학생·농민·노동자·여성이 모두 참여했어. 이화 학당 학생 <b>유관순</b>은 천안 아우내 장터에서 시위를 이끌다 붙잡혀 옥중에서 순국했지.",
  why:"모두가 당사자였으니까.",
  so:"이후 학생 운동, 농민·노동 운동, 여성 운동이 활발해지는 밑바탕이 됐어."},
 {t:"fact",y:1919,n:"세계사적 의의",b:"대표적인 반제국주의 민족 운동으로 꼽혀. 중국의 <b>5·4 운동</b> 등 다른 약소민족의 운동에 영향을 줬어.",
  why:"'무력한 한국'이라는 이미지를 '독립을 위해 저항하는 한국'으로 바꿔 놓았거든.",
  so:"우리 안에서만 의미 있는 사건이 아니라는 뜻이야."},
 {t:"chain",title:"3·1 운동이 낳은 것",items:["3·1 운동(1919)","① 대한민국 임시 정부 수립","② 일제, 문화 정치로 전환","③ 중국 5·4 운동 등에 영향","민족 운동 주체 확대 → 1920년대 대중 운동"]},
 {t:"hint",k:"임 · 문 · 5·4",b:"결과 셋만 외우면 돼. <em>임</em>시 정부 · <em>문</em>화 정치 · <em>5·4</em> 운동. 서술형에도 이 세 개를 쓰면 점수가 나와."},
 {t:"pick",q:"3·1 운동의 결과로 볼 수 없는 것은?",c:["6·10 만세 운동이 일어났다","대한민국 임시 정부가 수립됐다"],a:0,e:"6·10 만세 운동은 1926년, 순종의 장례일에 일어난 별개 사건이야."},

{id:"L15",u:"s7",part:"나라를 다시 세우다",title:"세 정부가 하나로",sc:"building2",
 hook:"3·1 운동 뒤 임시 정부가 세 곳에 생겼어. 하나로 합쳐야 힘이 되는데, 어디에 둘지가 문제였지. 그 선택의 이유가 시험 포인트야.",
 cards:[
 {t:"fact",y:1919,n:"세 곳의 임시 정부",b:"연해주에 <b>대한 국민 의회</b>, 상하이에 <b>대한민국 임시 정부</b>, 국내에서는 <b>한성 정부</b> 수립이 선포됐어.",
  why:"각지의 독립운동 세력이 저마다 정부를 세운 거야.",
  so:"곧바로 하나로 합치는 통합 운동이 시작됐어."},
 {t:"fact",y:1919,n:"왜 상하이였을까",b:"통합 과정에서 '한인이 많고 무장 투쟁에 유리한 간도나 연해주에 두자'는 주장이 나왔어. 하지만 결국 <b>상하이</b>로 정했지.",
  why:"상하이에는 서구 열강의 조계 지역이 많아 <b>외교 활동</b>에 유리했거든.",
  so:"초기 임시 정부가 외교에 힘을 쏟은 이유가 여기 있어. 그리고 이게 뒷날 갈등의 씨앗이 되기도 해."},
 {t:"check",q:"임시 정부를 상하이에 둔 이유는?",a:"외교 활동에 유리해서",hint:"조계 지역이 많았거든"},
 {t:"fact",y:1919,n:"통합의 방식",b:"<b>한성 정부의 법통</b>을 계승하고, 대한 국민 의회를 통합하는 형태로 정리됐어.",
  why:"국내에서 선포된 정부를 정통으로 삼아야 명분이 섰어.",
  so:"이렇게 해서 하나의 대한민국 임시 정부가 완성돼."},
 {t:"fact",y:1919,n:"민주 공화제 채택",b:"우리 역사상 <b>최초의 민주 공화제 정부</b>야. 삼권 분립에 따라 입법은 <b>임시 의정원</b>, 행정은 <b>국무원</b>, 사법은 <b>법원</b>을 두었지.",
  why:"대동단결 선언에서 다져 온 국민 주권론이 실제 제도가 된 거야.",
  so:"황제의 나라 대한 제국에서 국민의 나라 대한민국으로 넘어간 결정적 지점이야. 지금 헌법도 '3·1 운동으로 건립된 대한민국 임시 정부의 법통'을 잇는다고 적고 있어."},
 {t:"fact",y:1919,n:"초대 각료",b:"대한민국 임시 헌법을 공포하고 임시 대통령에 <b>이승만</b>, 국무총리에 <b>이동휘</b>를 뽑았어.",
  why:"이승만은 외교 노선, 이동휘는 무장 투쟁 노선을 대표했어.",
  so:"노선이 다른 두 사람이 함께 있었다는 게 뒷날 갈등으로 이어져."},
 {t:"chain",title:"통합의 과정",items:["대한 국민 의회 (연해주)","대한민국 임시 정부 (상하이)","한성 정부 (국내)","한성 정부의 법통 계승 + 대한 국민 의회 통합","상하이에 자리 — 외교에 유리해서","최초의 민주 공화제 · 삼권 분립"]},
 {t:"hint",k:"국(연해주) · 상(상하이) · 한(국내)",b:"세 정부의 앞 글자. 그리고 <em>한</em>성의 법통을 잇고 <em>상</em>하이에 앉았다고 기억해."},
 {t:"pick",q:"임시 정부가 계승한 법통은?",c:["한성 정부","대한 국민 의회"],a:0,e:"한성 정부의 법통을 계승하고 대한 국민 의회를 통합했어."}
 ],

 {q:"임시 정부의 입법 기관은?",c:["임시 의정원","국무원","법원","구미 위원부"],a:0,e:"행정은 국무원, 사법은 법원이야."},

{id:"L16",u:"s7",part:"나라를 다시 세우다",title:"돈과 소식을 나르다",sc:"route",
 hook:"나라 밖에 정부를 세웠는데, 국내 사람들과 어떻게 연락하고 어떻게 돈을 모았을까? 이름이 비슷한 조직 둘만 구분하면 돼.",
 cards:[
 {t:"fact",y:1919,n:"연통제",b:"국내에 몰래 설치한 <b>비밀 행정 조직</b>이야. 군자금을 모으고 정부의 문서와 명령을 전달했어.",
  why:"국외 정부가 국내를 다스리려면 행정 통로가 있어야 했어.",
