<style>
/* ══════════════════════════════════════════════════════════════
   HANSA OS — 두 앱이 한 데스크톱 위에서 돌아간다.
   위쪽 작업 표시줄로 앱을 갈아 끼우고, 쉬는 앱은 DOM 에서 떼어 둔다.
   ══════════════════════════════════════════════════════════════ */
:root{
  --desk:#6E5A7D; --desk-d:#4A3B57; --desk-l:#8A7399;
  --cream:#FBF3E2; --panel:#F2E5C9; --panel-d:#E3D2AE;
  --ink:#2B1F33; --yel:#F5C63C; --yel-d:#C89A18; --red:#D2453B;
  --f-px:"Press Start 2P","Courier New",monospace;
  --f-h:"Do Hyeon","Gothic A1",sans-serif;
  --f-b:"Gothic A1","Apple SD Gothic Neo",system-ui,sans-serif;
  --bd:3px; --sh:4px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  border-radius:0!important;image-rendering:pixelated}
html,body{height:100%}
body{
  background:var(--desk);
  background-image:
    repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 2px,transparent 2px 4px),
    linear-gradient(160deg,var(--desk-l) 0%,var(--desk) 45%,var(--desk-d) 100%);
  background-attachment:fixed;
  color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.7;
  word-break:keep-all;overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;font-family:var(--f-b)}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── 작업 표시줄 ── */
.osbar{position:sticky;top:0;z-index:70;background:var(--ink);color:var(--cream);
  display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:var(--bd) solid #150E1B;
  font-family:var(--f-px);font-size:9px;letter-spacing:.04em}
.osbar .logo{display:inline-flex;gap:2px;flex-shrink:0;margin-right:2px}
.osbar .logo i{width:4px;height:12px;display:block;transform:skewX(-18deg)}
.osbar .clk{flex-shrink:0;color:var(--yel);margin-left:auto}
@media(max-width:520px){.osbar .clk{display:none}}
.tsk{display:flex;gap:6px;min-width:0}
.tb{position:relative;display:inline-flex;align-items:center;gap:7px;min-height:34px;
  padding:5px 10px 5px 6px;background:var(--panel);color:var(--ink);border:2px solid #150E1B;
  box-shadow:inset -2px -2px 0 var(--panel-d),inset 2px 2px 0 #fff;
  font-family:var(--f-h);font-size:14px;white-space:nowrap}
.tb:active{box-shadow:inset 2px 2px 0 var(--panel-d);transform:translate(1px,1px)}
.tb[aria-current="true"]{background:var(--yel);
  box-shadow:inset -2px -2px 0 var(--yel-d),inset 2px 2px 0 #FFF0B8}
.tb .ic{width:22px;height:22px;flex-shrink:0;display:grid;place-items:center}
@media(max-width:400px){.tb{font-size:12.5px;padding:5px 8px 5px 5px;gap:5px}}
.tb .bdg{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;background:var(--red);
  border:2px solid #150E1B;color:#fff;font-family:var(--f-px);font-size:7px;
  display:grid;place-items:center;padding:0 2px;line-height:1}
.pane[hidden]{display:none}
</style>
<div class="osbar">
  <span class="logo"><i style="background:#D2453B"></i><i style="background:#F5C63C"></i><i style="background:#2F8C7E"></i></span>
  <span class="tsk" id="tsk"></span>
  <span class="clk" id="clk">--- --:-- 1985</span>

    <main class="view" id="Lview"></main>
  </div>

</div>
</div>
<div class="a-mon pane" id="Mapp-wrap">
<div id="Mapp">
 <div class="win">
  <header class="bar">
    <button class="iconbtn hidden" id="Mback" aria-label="뒤로">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="ttl" id="Mtitle">오답 몬스터</div>
    <div id="Mextra"></div>
  </header>
  <main class="view" id="Mview"></main>
 </div>
</div>

<style>
/* ── 「한국사 첫 수업」 ── */

/* ══════════════════════════════════════════════════════════════
   HANSA OS — 1985년식 픽셀 데스크톱. 단일 세계관이라 테마 전환 없이
   모든 색을 직접 칠한다.
   ══════════════════════════════════════════════════════════════ */
.a-learn{
  --desk:#6E5A7D; --desk-d:#4A3B57; --desk-l:#8A7399;
  --cream:#FBF3E2; --panel:#F2E5C9; --panel-d:#E3D2AE;
  --ink:#2B1F33; --ink-2:#5A4A66; --ink-3:#8B7A96;
  --yel:#F5C63C; --yel-d:#C89A18;
  --org:#E0812C; --org-d:#B25F14;
  --red:#D2453B; --red-l:#F6DAD6;
  --teal:#2F8C7E; --teal-l:#D6EDE7;
  --blue:#3D6BB5; --blue-l:#DCE5F5;
  --f-px:"Press Start 2P","Courier New",monospace;
  --f-h:"Do Hyeon","Gothic A1",sans-serif;
  --f-b:"Gothic A1","Apple SD Gothic Neo",system-ui,sans-serif;
  --bd:3px; --sh:4px;
  /* 인라인 SVG(나무·장면·도장)가 쓰던 옛 이름을 새 팔레트로 잇는다 */
  --jade:#2F8C7E; --ochre:#E0812C; --line2:#8B7A96;
  --bg2:#F2E5C9; --tx:#2B1F33; --tx2:#5A4A66; --f-d:"Do Hyeon","Gothic A1",sans-serif;
}
.a-learn *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  border-radius:0!important;image-rendering:pixelated}

.a-learn{
  background:var(--desk);
  background-image:
    repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 2px,transparent 2px 4px),
    linear-gradient(160deg,var(--desk-l) 0%,var(--desk) 45%,var(--desk-d) 100%);
  background-attachment:fixed;
  color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.7;
  word-break:keep-all;overscroll-behavior-y:none;
}
.a-learn button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;font-family:var(--f-b)}
.a-learn :focus-visible{outline:3px solid var(--yel);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.a-learn *,.a-learn *::before,.a-learn *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── 데스크톱 상단 바 ── */
.a-learn .osbar{position:sticky;top:0;z-index:60;background:var(--ink);color:var(--cream);
  display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:var(--bd) solid #150E1B;
  font-family:var(--f-px);font-size:9px;letter-spacing:.04em}
.a-learn .osbar .logo{display:inline-flex;gap:2px;flex-shrink:0}
.a-learn .osbar .logo i{width:4px;height:12px;display:block;transform:skewX(-18deg)}
.a-learn .osbar .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-learn .osbar .clk{flex-shrink:0;color:var(--yel)}
@media(max-width:400px){.a-learn .osbar{font-size:8px;gap:7px}}

/* ── 셸: 데스크톱 위의 창 + 독 ── */
.a-learn #Lapp{max-width:1000px;margin:0 auto;padding:12px;display:grid;gap:12px;
  grid-template-columns:1fr;min-height:100dvh;align-content:start}
@supports not (height:100dvh){.a-learn #Lapp{min-height:100vh}}
@media(min-width:820px){.a-learn #Lapp{grid-template-columns:1fr 108px;padding:16px}}

.a-learn .win{background:var(--cream);border:var(--bd) solid var(--ink);
  box-shadow:var(--sh) var(--sh) 0 rgba(21,14,27,.55);display:flex;flex-direction:column;min-width:0}

/* 창 제목 표시줄 */
.a-learn .bar{background:var(--ink);color:var(--cream);display:flex;align-items:center;gap:8px;
  padding:6px 7px;border-bottom:var(--bd) solid var(--ink);flex-shrink:0}
.a-learn .bar .ttl{flex:1;min-width:0;font-family:var(--f-px);font-size:9.5px;letter-spacing:.03em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:5px 7px;background:repeating-linear-gradient(90deg,#3B2C47 0 3px,transparent 3px 6px)}
.a-learn .ib{width:30px;height:30px;flex-shrink:0;background:var(--panel);border:2px solid var(--ink);
  position:relative;
  box-shadow:inset -2px -2px 0 var(--panel-d),inset 2px 2px 0 #fff;
  display:grid;place-items:center;color:var(--ink);font-family:var(--f-px);font-size:9px}
.a-learn .ib::after{content:"";position:absolute;inset:-8px}   /* 눈에 보이는 크기는 30px, 손가락 영역은 46px */
.a-learn .ib:active{box-shadow:inset 2px 2px 0 var(--panel-d);transform:translate(1px,1px)}

.a-learn .view{flex:1;display:flex;flex-direction:column;padding:14px;min-width:0}
@media(min-width:560px){.a-learn .view{padding:18px}}

/* ── 독 (넓은 화면: 오른쪽 · 좁은 화면: 아래 작업 표시줄) ── */
.a-learn .dock{display:flex;gap:8px;order:2}
/* 넓은 화면에서 독은 세로. align-self 를 안 주면 격자 칸 높이만큼 늘어나 아이콘이 흩어진다 */
@media(min-width:820px){.a-learn .dock{flex-direction:column;order:0;position:sticky;top:56px;align-self:start}
  .a-learn .dk{flex:0 0 auto}}
@media(max-width:819px){
  .a-learn .dock{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--ink);
    border-top:var(--bd) solid #150E1B;padding:6px;justify-content:center;
    padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
  .a-learn #Lapp{padding-bottom:84px}
}
.a-learn .dk{flex:1;max-width:96px;background:transparent;display:flex;flex-direction:column;
  align-items:center;gap:4px;padding:4px 2px;min-height:44px}
.a-learn .dk .ico{width:46px;height:46px;border:2px solid var(--ink);background:var(--panel);
  box-shadow:inset -3px -3px 0 rgba(43,31,51,.22),inset 3px 3px 0 rgba(255,255,255,.75);
  display:grid;place-items:center;position:relative}
.a-learn .dk .lb{font-family:var(--f-px);font-size:7px;letter-spacing:.02em;color:var(--cream);
  text-align:center;line-height:1.5}
@media(min-width:820px){.a-learn .dk .lb{color:var(--cream)}}
.a-learn .dk[aria-current="true"] .ico{background:var(--yel);box-shadow:inset -3px -3px 0 var(--yel-d),inset 3px 3px 0 #FFF0B8}
.a-learn .dk[aria-current="true"] .lb{color:var(--yel)}
.a-learn .dk:active .ico{transform:translate(1px,1px)}
.a-learn .dk .badge{position:absolute;top:-7px;right:-7px;min-width:19px;height:19px;background:var(--red);
  border:2px solid var(--ink);color:#fff;font-family:var(--f-px);font-size:7px;
  display:grid;place-items:center;padding:0 2px}

/* ── 공통 픽셀 부품 ── */
.a-learn .card,.a-learn .hero,.a-learn .paper,.a-learn .wcard,.a-learn .rv,.a-learn .sum,.a-learn .peek,.a-learn .wsum,.a-learn .itm,.a-learn .msn,.a-learn .exbar,.a-learn .wbar,.a-learn .lsn,.a-learn .mn,.a-learn .tlr{
  background:var(--cream);border:var(--bd) solid var(--ink);box-shadow:var(--sh) var(--sh) 0 rgba(43,31,51,.28)}
.a-learn .card{padding:16px 15px;margin-bottom:0;animation:in .18s steps(3)}
@keyframes in{from{opacity:0;transform:translate(0,6px)}to{opacity:1;transform:none}}
.a-learn .card + .card{margin-top:12px}

/* 버튼 — 눌리는 느낌이 핵심 */
.a-learn .cta,.a-learn .chip,.a-learn .tw,.a-learn .qopt,.a-learn .o5,.a-learn .ans,.a-learn .gbtn,.a-learn .ob{
  border:var(--bd) solid var(--ink);background:var(--panel);color:var(--ink);
  box-shadow:inset -3px -3px 0 rgba(43,31,51,.2),inset 3px 3px 0 rgba(255,255,255,.85),
             var(--sh) var(--sh) 0 rgba(43,31,51,.28);
  transition:none;font-weight:700}
.a-learn .cta:active,.a-learn .chip:active,.a-learn .tw:active,.a-learn .qopt:active:not(:disabled),.a-learn .o5:active,.a-learn .ob:active{
  transform:translate(var(--sh),var(--sh));
  box-shadow:inset 3px 3px 0 rgba(43,31,51,.2)}
.a-learn .cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;
  background:var(--yel);font-family:var(--f-h);font-size:17px;padding:12px 14px;
  box-shadow:inset -3px -3px 0 var(--yel-d),inset 3px 3px 0 #FFF0B8,var(--sh) var(--sh) 0 rgba(43,31,51,.34)}
.a-learn .cta:active{box-shadow:inset 3px 3px 0 var(--yel-d)}
.a-learn .cta.ghost{background:var(--panel);
  box-shadow:inset -3px -3px 0 var(--panel-d),inset 3px 3px 0 #fff,var(--sh) var(--sh) 0 rgba(43,31,51,.28)}
.a-learn .cta.ghost:active{box-shadow:inset 3px 3px 0 var(--panel-d)}
.a-learn .cta[disabled],.a-learn .chip[disabled]{opacity:.45;box-shadow:none;transform:none}
.a-learn .row{display:flex;gap:10px}.a-learn .row>*{flex:1}
.a-learn .sticky{margin-top:auto;padding:16px 0 4px;background:transparent}

/* 제목 · 본문 */
.a-learn .hero{padding:16px 15px}
.a-learn .hero h1{font-family:var(--f-h);font-size:21px;line-height:1.5;margin-bottom:7px}
.a-learn .hero p{font-size:14.5px;line-height:1.75;color:var(--ink-2)}
.a-learn .h{font-family:var(--f-h);font-size:22px;line-height:1.5;margin-bottom:11px}
.a-learn .h.sm{font-size:18.5px}
.a-learn .bd{font-size:16px;line-height:1.85;color:var(--ink-2)}
.a-learn .bd b,.a-learn .bd strong,.a-learn mark{background:var(--yel);color:var(--ink);font-weight:700;padding:1px 4px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
.a-learn .note{font-size:13.5px;line-height:1.7;color:var(--ink-2)}
.a-learn .note b{background:var(--yel);padding:1px 4px}
.a-learn .eyebrow,.a-learn .part,.a-learn .step,.a-learn .tt,.a-learn .lb,.a-learn .t,.a-learn .pts,.a-learn .gg,.a-learn .tn,.a-learn .tv,.a-learn .pc,.a-learn .n,.a-learn .wn,.a-learn .big,.a-learn .v,.a-learn .num,.a-learn .kx,.a-learn .yr,.a-learn .k,.a-learn .sub{font-feature-settings:normal}
.a-learn .eyebrow{font-family:var(--f-px);font-size:8px;letter-spacing:.06em;color:var(--ink-3);margin-bottom:9px;line-height:1.7}
.a-learn .part{font-family:var(--f-px);font-size:8.5px;letter-spacing:.05em;color:var(--cream);
  margin:18px 0 9px;background:var(--ink);padding:7px 9px;display:flex;align-items:center;gap:8px;
  border:var(--bd) solid var(--ink);line-height:1.6}
.a-learn .part::after{content:"";flex:1;height:5px;
  background:repeating-linear-gradient(90deg,var(--yel) 0 3px,transparent 3px 6px)}
.a-learn .yr{font-family:var(--f-px);font-size:11px;color:var(--ink);background:var(--yel);
  border:2px solid var(--ink);padding:5px 8px;display:inline-block;margin-bottom:10px}

/* 왜 / 그래서 */
.a-learn .wsblock{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.a-learn .ws{display:flex;gap:10px;align-items:flex-start;background:var(--panel);
  border:2px solid var(--ink);padding:11px 12px}
.a-learn .ws .lb{font-family:var(--f-h);font-size:14px;flex-shrink:0;width:46px;line-height:1.6}
.a-learn .ws.why{background:var(--blue-l)} .a-learn .ws.why .lb{color:var(--blue)}
.a-learn .ws.so{background:var(--teal-l)} .a-learn .ws.so .lb{color:var(--teal)}
.a-learn .ws p{font-size:14.5px;line-height:1.75;color:var(--ink-2);flex:1;min-width:0}

/* 인과 사슬 */
.a-learn .scene{display:grid;place-items:center;padding:4px 0 14px;color:var(--org)}
.a-learn .chain{display:flex;flex-direction:column;margin-top:4px}
.a-learn .cl{display:flex;gap:12px;align-items:flex-start;position:relative;padding:6px 0;
  opacity:0;animation:fadeup .3s steps(4) forwards}
.a-learn .cl .dot{width:13px;height:13px;background:var(--org);border:2px solid var(--ink);flex-shrink:0;margin-top:7px}
.a-learn .cl::before{content:"";position:absolute;left:5px;top:24px;bottom:-6px;width:3px;
  background:repeating-linear-gradient(180deg,var(--ink-3) 0 3px,transparent 3px 6px)}
.a-learn .cl:last-child::before{display:none}
.a-learn .cl p{font-size:15px;line-height:1.7}
.a-learn .cl:last-child p{font-weight:800;background:var(--yel);padding:2px 5px}
@keyframes fadeup{from{opacity:0;transform:translate(-6px,0)}to{opacity:1;transform:none}}

/* 암기 장치 */
.a-learn .hintcard{background:var(--yel);border-color:var(--ink)}
.a-learn .hintcard .k{font-family:var(--f-h);font-size:25px;line-height:1.4;color:var(--ink);
  text-shadow:2px 2px 0 rgba(255,255,255,.55)}
.a-learn .hintcard .bd{margin-top:11px;color:var(--ink)}
.a-learn .hintcard em{font-style:normal;font-weight:800;background:var(--cream);
  border:2px solid var(--ink);padding:0 4px}

/* 스스로 떠올리기 */
.a-learn .recall{text-align:center;padding:4px 0}
.a-learn .recall .q{font-family:var(--f-h);font-size:20px;line-height:1.55}
.a-learn .recall .tip{font-size:13.5px;color:var(--ink-3);margin-top:13px}
.a-learn .recall .ans{font-family:var(--f-h);font-size:26px;color:var(--ink);margin:10px 0 2px;
  background:var(--yel);border:var(--bd) solid var(--ink);padding:8px 10px;display:inline-block;
  box-shadow:var(--sh) var(--sh) 0 rgba(43,31,51,.28)}
.a-learn .blur{filter:none;background:var(--ink)!important;color:transparent!important;
  text-shadow:none;user-select:none;
  background-image:repeating-linear-gradient(45deg,#3B2C47 0 4px,var(--ink) 4px 8px)!important}

/* 2지선다 · 4지선다 · 5지선다 */
.a-learn .two{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.a-learn .tw,.a-learn .qopt,.a-learn .o5,.a-learn .ans{min-height:52px;padding:12px 14px;font-size:15.5px;line-height:1.55;
  text-align:left;width:100%;display:flex;gap:10px;align-items:flex-start;font-weight:400}
.a-learn .opts5,.a-learn .two{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.a-learn #opts{display:flex;flex-direction:column;gap:10px}
.a-learn .qopt,.a-learn .o5{margin-bottom:0}
.a-learn .tw.ok,.a-learn .qopt.ok,.a-learn .o5.pick{background:var(--teal-l);border-color:var(--teal);
  box-shadow:inset -3px -3px 0 rgba(47,140,126,.3),inset 3px 3px 0 #fff,var(--sh) var(--sh) 0 rgba(43,31,51,.28)}
.a-learn .tw.no,.a-learn .qopt.no{background:var(--red-l);border-color:var(--red);
  box-shadow:inset -3px -3px 0 rgba(210,69,59,.3),inset 3px 3px 0 #fff,var(--sh) var(--sh) 0 rgba(43,31,51,.28)}
.a-learn .qopt.dim,.a-learn .o5.dim,.a-learn .ans.dim{opacity:.42;box-shadow:none}

@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.6)}
  22%{opacity:1;transform:translateX(-50%) scale(1.14)}
  62%{opacity:1;transform:translateX(-50%) scale(1) translateY(-6px)}
  100%{opacity:0;transform:translateX(-50%) scale(1) translateY(-42px)}}
.a-mon .flash{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0}
.a-mon .flash.go{animation:fl .42s ease-out}
@keyframes fl{0%{opacity:.5}100%{opacity:0}}

.a-mon .empty{text-align:center;padding:44px 18px;color:var(--tx3)}
.a-mon .empty p{font-size:14.5px;line-height:1.7;max-width:30ch;margin:12px auto 0;word-break:keep-all}
.a-mon .note{font-size:12.5px;color:var(--tx3);line-height:1.6;word-break:keep-all}
.a-mon .hidden{display:none!important}


/* ══════ 2단계 ══════ */
.a-mon .mode.m5 .ic{background:rgba(255,180,67,.14);color:var(--amber)}
.a-mon .mode.m6 .ic{background:rgba(91,155,232,.16);color:#7FB4F0}
.a-mon .mode.m7 .ic{background:rgba(53,214,160,.15);color:var(--jade)}

/* 지도 */
.a-mon .eras{display:flex;flex-direction:column;gap:8px}
.a-mon .eracard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:74px;position:relative;
  background:var(--surf);border:var(--bd) solid var(--line);border-radius:var(--r);padding:11px 14px}
.a-mon .eracard:active:not([disabled]){background:var(--surf2)}
.a-mon .eracard.done{border-color:rgba(53,214,160,.45);background:linear-gradient(100deg,var(--jade-g),transparent 62%),var(--surf)}
.a-mon .eracard.lock{opacity:.5}
.a-mon .eracard .bs{width:52px;height:52px;flex-shrink:0;display:grid;place-items:center}
.a-mon .eracard .qm{font-family:var(--f-d);font-size:26px;color:var(--tx3)}
.a-mon .eracard .tx{flex:1;min-width:0}
.a-mon .eracard .tx b{display:block;font-family:var(--f-d);font-size:16px;font-weight:400;letter-spacing:-.01em}
.a-mon .eracard .tx small{display:block;font-size:11.5px;color:var(--tx3);line-height:1.5;word-break:keep-all}
.a-mon .eracard .st{flex-shrink:0;color:var(--tx3);font-size:14px}
.a-mon .eracard .st .ok{font-family:var(--f-d);font-size:12px;color:var(--jade);
  border:1px solid rgba(53,214,160,.4);border-radius:99px;padding:3px 9px}

/* 보스 바 */
.a-mon .boss{display:flex;align-items:center;gap:12px;background:var(--surf);border:var(--bd) solid var(--line);
  border-radius:var(--r);padding:10px 13px;margin-bottom:10px}
.a-mon .bsv{flex-shrink:0;line-height:0}
.a-mon .bsv.hit{animation:hit .26s ease-out}
.a-mon .bsv.hero{display:grid;place-items:center}
@keyframes hit{0%{transform:translateX(0)}25%{transform:translateX(-7px) scale(1.05)}
  60%{transform:translateX(6px)}100%{transform:translateX(0)}}
.a-mon .btx{flex:1;min-width:0}
.a-mon .btx b{display:block;font-family:var(--f-d);font-size:15.5px;font-weight:400}
.a-mon .btx small{display:block;font-family:var(--f-m);font-size:11px;color:var(--tx3);margin-top:3px}
.a-mon .bhp{height:9px;border-radius:9px;background:var(--bg2);overflow:hidden;margin-top:5px;
  border:var(--bd) solid var(--line)}
.a-mon .bhp i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--crim),#FF8A6B);
  transition:width .45s cubic-bezier(.2,.8,.3,1)}
.a-mon .ult{position:fixed;inset:0;z-index:70;pointer-events:none;display:grid;place-items:center;
  animation:ultf 1s ease-out forwards}
.a-mon .ult span{font-family:var(--f-d);font-size:56px;color:var(--amber);
  text-shadow:0 0 34px rgba(255,180,67,.75),0 6px 24px rgba(0,0,0,.8)}
.a-mon .ult em{position:absolute;bottom:36%;font-family:var(--f-m);font-style:normal;font-size:14px;
  letter-spacing:.24em;color:var(--tx2)}
@keyframes ultf{0%{opacity:0;transform:scale(.7)}18%{opacity:1;transform:scale(1.1)}
  70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.04)}}

/* 도감 */
.a-mon .dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.a-mon .dcard{background:var(--surf);border:var(--bd) solid var(--line);border-radius:var(--r-s);padding:10px 6px;
  display:flex;flex-direction:column;align-items:center;gap:5px;min-height:118px}
.a-mon .dcard:active:not([disabled]){background:var(--surf2)}
.a-mon .dcard.locked{opacity:.42}
.a-mon .dcard .pf{width:72px;height:72px;border-radius:50%;border:var(--bd) solid var(--line);overflow:hidden;
  display:grid;place-items:center;background:var(--bg2)}
.a-mon .dcard .qm{font-family:var(--f-d);font-size:26px;color:var(--tx3)}
.a-mon .dcard .nm{font-size:11.5px;font-weight:700;line-height:1.3;word-break:keep-all;text-align:center}
.a-mon .dcard .gg{font-family:var(--f-m);font-size:9.5px;letter-spacing:.08em}

/* 카드 획득 연출 */
.a-mon .modal{position:fixed;inset:0;z-index:80;background:rgba(10,8,14,.82);display:grid;place-items:center;
  padding:24px;animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.a-mon .mbox{background:var(--surf);border:var(--bd) solid var(--line);border-radius:20px;padding:24px 22px;
  max-width:320px;width:100%;text-align:center;animation:rise .34s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.94)}to{opacity:1;transform:none}}
.a-mon .mbox .gr{font-family:var(--f-d);font-size:15px;letter-spacing:.16em}
.a-mon .mbox .pf{width:150px;height:150px;margin:12px auto;border-radius:50%;border:3px solid;overflow:hidden;
  display:grid;place-items:center;background:var(--bg2)}
.a-mon .mbox .nm{font-family:var(--f-d);font-size:25px;letter-spacing:-.01em}
.a-mon .mbox .ds{font-size:13.5px;color:var(--tx2);line-height:1.6;margin:8px 0 18px;word-break:keep-all}

.a-mon .toast{position:fixed;left:50%;bottom:calc(22px + var(--safeb));transform:translateX(-50%);z-index:75;
  background:var(--surf2);border:var(--bd) solid var(--line);border-radius:99px;padding:10px 18px;
  font-size:13.5px;font-weight:700;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.8);animation:tst 2.1s ease-out forwards}
@keyframes tst{0%{opacity:0;transform:translateX(-50%) translateY(14px)}
  12%{opacity:1;transform:translateX(-50%) translateY(0)}
  82%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-8px)}}

/* 사료 */
.a-mon .srcbox{background:var(--bg2);border-left:3px solid var(--amber);border-radius:0 var(--r-s) var(--r-s) 0;
  padding:14px 15px;font-size:14.5px;line-height:1.78;color:var(--tx2);word-break:keep-all;
  max-height:38vh;overflow-y:auto}

/* 키워드 입력 */
.a-mon .kws{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.a-mon .kw{display:flex;align-items:center;gap:10px;background:var(--surf);border:var(--bd) solid var(--line);
  border-radius:var(--r-s);padding:4px 12px 4px 10px;min-height:58px}
.a-mon .kw.ok{border-color:var(--jade);background:var(--jade-g)}
.a-mon .kw.no{border-color:var(--crim);background:var(--crim-g)}
.a-mon .kw .kn{font-family:var(--f-d);font-size:15px;color:var(--tx3);width:20px;text-align:center;flex-shrink:0}
.a-mon .kw input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--tx);
  font-family:var(--f-b);font-size:16px;font-weight:600;padding:12px 0}
.a-mon .kw input::placeholder{color:var(--tx3);font-weight:400}

/* 아이템 */
.a-mon .itembar{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.a-mon .ibtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 13px;border-radius:99px;
  background:var(--surf);border:var(--bd) solid var(--line);font-size:12.5px;font-weight:700}
.a-mon .ibtn:active{background:var(--surf2)}
.a-mon .ibtn span{font-size:15px;color:var(--amber)}
.a-mon .ibtn b{font-family:var(--f-m);font-size:11px;color:var(--tx3)}
.a-mon .items{display:flex;flex-direction:column;gap:8px}
.a-mon .itm{display:flex;align-items:center;gap:11px;background:var(--surf);border:var(--bd) solid var(--line);
  border-radius:var(--r-s);padding:12px 14px;min-height:60px}
.a-mon .itm .ic{font-size:20px;color:var(--amber);width:26px;text-align:center;flex-shrink:0}
.a-mon .itm b{font-size:14.5px}
.a-mon .itm small{color:var(--tx3);font-size:12px;flex:1;min-width:0;word-break:keep-all}
.a-mon .itm .ct{font-family:var(--f-d);font-size:19px;color:var(--amber);flex-shrink:0}

/* D-day · 출석 · 미션 */
.a-mon .ddaybox{display:flex;align-items:center;gap:14px;background:var(--surf);border:var(--bd) solid var(--line);
  border-radius:var(--r);padding:14px 16px}
.a-mon .ddaybox .dl{font-family:var(--f-d);font-size:34px;color:var(--crim);line-height:1;
  font-variant-numeric:tabular-nums}
.a-mon .dinp{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--tx3)}
.a-mon .dinp input{font-family:var(--f-m);font-size:14px;padding:11px 12px;border-radius:var(--r-s);
  border:var(--bd) solid var(--line);background:var(--bg2);color:var(--tx);width:100%;min-height:44px}
.a-mon .stamps{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.a-mon .stmp{aspect-ratio:1;border-radius:10px;background:var(--surf);border:var(--bd) solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.a-mon .stmp.on{background:var(--jade-g);border-color:rgba(53,214,160,.45)}
.a-mon .stmp b{font-family:var(--f-d);font-size:15px;color:var(--jade);line-height:1}
.a-mon .stmp small{font-family:var(--f-m);font-size:9px;color:var(--tx3)}
.a-mon .msns{display:flex;flex-direction:column;gap:8px}
.a-mon .msn{display:flex;align-items:center;gap:11px;background:var(--surf);border:var(--bd) solid var(--line);
  border-radius:var(--r-s);padding:12px 14px;min-height:60px}
.a-mon .msn.done{border-color:rgba(53,214,160,.45);background:var(--jade-g)}
.a-mon .msn .ck{width:24px;height:24px;border-radius:50%;border:var(--bd) solid var(--line);flex-shrink:0;
  display:grid;place-items:center;font-size:13px;color:var(--jade);font-weight:900}
.a-mon .msn.done .ck{border-color:var(--jade)}
.a-mon .msn .tx{flex:1;min-width:0}
.a-mon .msn .tx b{display:block;font-size:14px;font-weight:700}
.a-mon .pb{display:block;height:5px;border-radius:5px;background:var(--surf3);overflow:hidden;margin-top:6px}
.a-mon .pb i{display:block;height:100%;background:var(--jade);border-radius:5px;transition:width .4s}
.a-mon .msn .pc{font-family:var(--f-m);font-size:12px;color:var(--tx3);flex-shrink:0}

/* ══════════════════════════════════════════════════════════════
   HANSA OS 마감 — 픽셀 부품. 앞 규칙 위에 덮어쓴다.
   ══════════════════════════════════════════════════════════════ */
/* 하드 그림자를 지는 판때기들 */
.a-mon .stat,.a-mon .monbar,.a-mon .mode,.a-mon .unit,.a-mon .qcard,.a-mon .rrow,.a-mon .mcard,.a-mon .eracard,.a-mon .boss,.a-mon .dcard,.a-mon .itm,.a-mon .msn,.a-mon .ddaybox,.a-mon .stmp,.a-mon .mbox,.a-mon .kw,.a-mon .tlc,.a-mon .srcbox{
  box-shadow:var(--sh) var(--sh) 0 rgba(10,7,14,.5)}

/* 눌리는 버튼 — 안쪽 하이라이트/그림자로 입체를 낸다 */
.a-mon .btn,.a-mon .ans,.a-mon .oxb,.a-mon .ibtn,.a-mon .mode,.a-mon .unit,.a-mon .eracard,.a-mon .dcard,.a-mon .iconbtn,.a-mon .tlc .mv button{
  transition:none}
.a-mon .btn,.a-mon .ans,.a-mon .oxb,.a-mon .ibtn{
  box-shadow:inset -3px -3px 0 rgba(10,7,14,.45),inset 3px 3px 0 rgba(255,255,255,.12),
             var(--sh) var(--sh) 0 rgba(10,7,14,.5)}
.a-mon .btn:active:not([disabled]),.a-mon .ans:active:not(:disabled),.a-mon .oxb:active:not(:disabled),.a-mon .ibtn:active{
  transform:translate(var(--sh),var(--sh));box-shadow:inset 3px 3px 0 rgba(10,7,14,.45)}
.a-mon .mode:active,.a-mon .unit:active,.a-mon .eracard:active:not([disabled]),.a-mon .dcard:active:not([disabled]){
  transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(10,7,14,.5)}
.a-mon .btn{background:var(--yel);color:var(--ink);font-family:var(--f-d);font-weight:400;font-size:18px;
  border:var(--bd) solid var(--line);
  box-shadow:inset -3px -3px 0 var(--yel-d),inset 3px 3px 0 #FFF0B8,var(--sh) var(--sh) 0 rgba(10,7,14,.55)}
.a-mon .btn:active:not([disabled]){box-shadow:inset 3px 3px 0 var(--yel-d)}
.a-mon .btn.ghost{background:var(--surf2);color:var(--tx);border:var(--bd) solid var(--line);font-weight:400;
  box-shadow:inset -3px -3px 0 rgba(10,7,14,.45),inset 3px 3px 0 rgba(255,255,255,.12),
             var(--sh) var(--sh) 0 rgba(10,7,14,.5)}
.a-mon .btn.ghost:active:not([disabled]){box-shadow:inset 3px 3px 0 rgba(10,7,14,.45)}
.a-mon .btn.mon{background:var(--mon);color:#1B1226;
  box-shadow:inset -3px -3px 0 #6E5A9B,inset 3px 3px 0 #DCCDFA,var(--sh) var(--sh) 0 rgba(10,7,14,.55)}
.a-mon .btn.mon:active:not([disabled]){box-shadow:inset 3px 3px 0 #6E5A9B}
.a-mon .btn[disabled],.a-mon .mode[disabled]{opacity:.4;box-shadow:none;transform:none}
.a-mon .ans:active:not(:disabled),.a-mon .oxb:active:not(:disabled){transform:translate(var(--sh),var(--sh))}
.a-mon .ans.ok,.a-mon .oxb.ok,.a-mon .tlc.ok,.a-mon .kw.ok{border-color:var(--jade)}
.a-mon .ans.no,.a-mon .oxb.no,.a-mon .tlc.no,.a-mon .kw.no{border-color:var(--crim)}

/* 구역 제목 — 다른 두 앱과 같은 검은 띠 */
.a-mon .sect{font-family:var(--f-px);font-size:8px;letter-spacing:.04em;color:var(--cream);
  background:var(--bg2);border:2px solid var(--ink);padding:6px 8px;line-height:1.7;
  margin:20px 0 10px;text-transform:none}
.a-mon .sect::after{content:"";flex:1;height:5px;background:
  repeating-linear-gradient(90deg,var(--yel) 0 3px,transparent 3px 6px)}

/* Press Start 2P 는 같은 px 에서 훨씬 크게 보인다 — 크롬 글씨를 7~11px 로 줄인다 */
.a-mon .mode .cnt,.a-mon .qmeta,.a-mon .btx small,.a-mon .msn .pc,.a-mon .ibtn b{font-size:8px;line-height:1.8}
.a-mon .unit small{font-size:8.5px;line-height:1.8}
.a-mon .unit .rate i,.a-mon .ans .kx,.a-mon .tlc .yr{font-size:9px;line-height:1.6}
.a-mon .mcard .kind,.a-mon .dcard .gg,.a-mon .stmp small{font-size:7px;line-height:1.8}
.a-mon .timer{font-size:11px;padding:7px 10px;border:2px solid var(--ink);background:var(--bg2)}
.a-mon .ult em{font-size:9px;letter-spacing:.16em}
.a-mon .dinp input{font-family:var(--f-b);font-size:15px}
.a-mon .kw input{font-family:var(--f-b)}
.a-mon .mbox .gr{font-family:var(--f-px);font-size:9px;letter-spacing:.1em;line-height:1.8}

/* 막대·눈금은 픽셀로 */
.a-mon .track,.a-mon .bhp,.a-mon .pb,.a-mon .unit .rate u,.a-mon .hp i{border:2px solid var(--ink);background:var(--bg2);height:10px}
.a-mon .track i,.a-mon .bhp i,.a-mon .pb i{background-image:repeating-linear-gradient(90deg,transparent 0 3px,rgba(0,0,0,.28) 3px 6px)}
.a-mon .bhp i{background-color:var(--crim);background-image:repeating-linear-gradient(90deg,transparent 0 3px,rgba(0,0,0,.3) 3px 6px)}
.a-mon .hp i{width:16px;height:8px}
.a-mon .result .big{font-family:var(--f-px);font-size:40px;line-height:1.2;
  background:var(--yel);color:var(--ink);border:var(--bd) solid var(--line);padding:10px 14px;
  display:inline-block;box-shadow:inset -4px -4px 0 var(--yel-d),inset 4px 4px 0 #FFF0B8}
.a-mon .pop{font-family:var(--f-px);font-size:20px;color:var(--ink);background:var(--yel);
  border:var(--bd) solid var(--line);padding:11px 15px;text-shadow:none;line-height:1.4}
.a-mon .ult span{font-family:var(--f-px);font-size:26px;line-height:1.4;text-align:center;
  color:var(--ink);background:var(--yel);border:var(--bd) solid var(--line);padding:14px 18px;
  text-shadow:none}
.a-mon .combo{font-family:var(--f-px);font-size:9px;border:2px solid var(--ink);background:var(--yel);
  color:var(--ink);padding:5px 7px;line-height:1.7}
.a-mon .score{font-family:var(--f-px);font-size:13px}
.a-mon .toast{border:var(--bd) solid var(--line);background:var(--surf2);
  box-shadow:var(--sh) var(--sh) 0 rgba(10,7,14,.6)}
.a-mon .mbox{border:var(--bd) solid var(--line)}
.a-mon .srcbox{border:var(--bd) solid var(--line);border-left:8px solid var(--yel)}
.a-mon .stmp b{font-family:var(--f-d)}
/* 아이콘 타일에도 테두리를 둘러 판때기처럼 보이게 */
.a-mon .mode .ic,.a-mon .eracard .bs,.a-mon .itm .ic,.a-mon .dcard .pf,.a-mon .mbox .pf,.a-mon .msn .ck,.a-mon .mcard .kind{
  border:2px solid var(--line)}
.a-mon .mode .ic{width:48px;height:48px}
/* 연표 세우기의 ▲▼ 는 눈에 보이는 크기는 그대로 두고 손가락 영역만 넓힌다 */
.a-mon .tlc .mv button{width:36px;height:30px;background:var(--surf2);border:2px solid var(--line);
  position:relative;box-shadow:inset -2px -2px 0 rgba(10,7,14,.45),inset 2px 2px 0 rgba(255,255,255,.1)}
.a-mon .tlc .mv button::after{content:"";position:absolute;inset:-7px -4px}
.a-mon .tlc .mv button:active:not([disabled]){box-shadow:inset 2px 2px 0 rgba(10,7,14,.45);transform:translate(1px,1px)}
.a-mon .sticky{background:linear-gradient(rgba(43,31,51,0),var(--bg) 26%)}


/* ══════ 3단계: 초성 사냥 · 짝 맞추기 · 서바이벌 ══════ */
.a-mon .mode.m8 .ic{background:rgba(245,198,60,.16);color:var(--amber)}
.a-mon .mode.m9  .ic{background:rgba(183,158,236,.18);color:var(--mon)}
.a-mon .mode.m10 .ic{background:rgba(255,110,124,.16);color:var(--crim)}

/* ── 초성 사냥 ── */
.a-mon .chotext{font-family:var(--f-d);font-size:clamp(30px,10vw,44px);line-height:1.35;letter-spacing:.06em;
  color:var(--ink);background:var(--amber);border:var(--bd) solid var(--line);padding:12px 14px;
  text-align:center;word-break:break-all;
  box-shadow:inset -4px -4px 0 var(--amber-d),inset 4px 4px 0 #FFF0B8}
.a-mon .chotext .got{color:var(--jade)}
.a-mon .chohint{font-size:14.5px;line-height:1.7;color:var(--tx2);margin-top:12px}
.a-mon .choin{display:flex;align-items:center;gap:10px;background:var(--surf);border:var(--bd) solid var(--line);
  padding:4px 12px;min-height:60px;margin-top:14px;
  box-shadow:var(--sh) var(--sh) 0 rgba(10,7,14,.5)}

 cards:[

 {t:"fact",y:1923,n:"일본 상품 관세 철폐",b:"일본 상품에 대한 관세가 대부분 없어졌어.",

 hook:"헌병이 거리를 지키던 1910년대에도 사람들은 포기하지 않았어. 다만 드러내 놓고 할 수 없으니 비밀 결사로 움직였지. 두 단체만 확실히 구분하면 돼.",
 cards:[
 {t:"fact",y:1912,n:"독립 의군부",b:"의병장 출신 <b>임병찬</b> 등이 고종의 밀명을 받아 만들었어. 일제에 국권 반환 요구서를 보내려다 발각돼 실패했지.",
  why:"의병 운동의 흐름을 잇는 사람들이었어.",

 {t:"fact",y:1915,n:"대한 광복회",b:"<b>박상진</b> 등이 주축이 됐어. 군자금을 모으고 친일파를 처단했으며, 만주에 무관 학교를 세우려 했지.",
  why:"독립 전쟁으로 국권을 되찾아야 한다고 봤어.",
  so:"이들이 목표한 건 <b>공화주의</b>, 곧 민주 공화제 국가야. 왕이 아니라 국민이 주인인 나라를 세우자는 거지."},
 {t:"compare",title:"이 둘만 구분하면 끝",l:{n:"독립 의군부 (1912)",p:["임병찬 (의병장 출신)","고종의 <b>밀명</b>","<b>복벽</b>주의 — 왕조 부활","국권 반환 요구서 시도"]},
  r:{n:"대한 광복회 (1915)",p:["박상진","군자금 모금 · 친일파 처단","<b>공화</b>주의 — 민주 공화제","만주 무관 학교 추진"]}},

{id:"L11",u:"s5",part:"나라 밖에서 준비하다",title:"국경을 넘다",sc:"border",
 hook:"국내에서 활동이 막히자 지사들은 아예 국경을 넘었어. 어디에 무엇이 있었는지, 지도를 머릿속에 그려 두면 한 번에 정리돼.",
 cards:[
 {t:"story",h:"왜 국외였을까",b:"헌병 경찰의 감시망 안에서는 군사 훈련은커녕 모임조차 어려웠어. 그래서 지리적으로 가까운 만주와 연해주에 <b>독립운동 기지</b>를 세우고, 오래 버틸 거점으로 삼으려 한 거야."},
 {t:"fact",y:1911,n:"서간도 — 삼원보",b:"신민회의 <b>이회영·이상룡</b> 등이 자치 기관 <b>경학사</b>를 만들고, 독립군을 기르려 <b>신흥 강습소</b>를 세웠어. 이게 뒷날 <b>신흥 무관 학교</b>가 돼.",
  why:"이회영 일가는 대부호였는데 전 재산을 급히 처분해 만주로 떠났어.",
  so:"3·1 운동 이후 만주로 향한 청년들이 여기서 군사 훈련을 받았어."},
 {t:"fact",y:1913,n:"북간도",b:"<b>간민회</b> 같은 자치 단체가 동포 사회를 이끌었고, 서전서숙을 이은 <b>명동 학교</b>가 세워졌어. 대종교 간부 <b>서일</b> 등은 무장 단체 <b>중광단</b>을 만들었지.",
  why:"한인이 가장 많이 살던 지역이라 기반이 튼튼했어.",
  so:"중광단이 뒷날 <b>북로 군정서</b>가 돼. 청산리에서 김좌진이 이끄는 바로 그 부대야."},
 {t:"check",q:"중광단은 뒷날 어떤 부대가 될까?",a:"북로 군정서",hint:"청산리 대첩의 주력 부대야"},
 {t:"fact",y:1911,n:"연해주 — 신한촌",b:"블라디보스토크 교외에 <b>신한촌</b>을 세우고 <b>권업회</b>가 활동했어. 뒤에 <b>이상설·이동휘</b>를 정·부통령으로 하는 <b>대한 광복군 정부</b>가 세워졌지(1914).",
  why:"러시아와 가까워 무기를 구하기 쉬웠어.",
  so:"'정부'라는 이름을 쓴 조직이 이때 이미 나왔다는 게 중요해."},
 {t:"fact",y:1910,n:"미주",b:"장인환·전명운의 의거를 계기로 애국심이 높아지자 <b>안창호</b> 주도로 한인 단체들이 통합해 <b>대한인 국민회</b>를 만들었어. 하와이에서는 <b>박용만</b>이 <b>대조선 국민군단</b>을 꾸려 군사 훈련을 했지.",
  why:"멀리 떨어져 있어 상대적으로 안전했고, 자금을 모으기 좋았어.",
  so:"미주는 주로 외교와 자금, 만주·연해주는 주로 무장 투쟁을 맡는 구도가 만들어져."},
 {t:"fact",y:1912,n:"상하이",b:"<b>신규식</b> 등이 <b>동제사</b>를 만들었고, 이들 중 일부가 <b>신한청년당</b>을 결성했어.",
  why:"열강의 조계 지역이 많아 외교 활동에 유리했어.",
  so:"신한청년당이 김규식을 파리 강화 회의에 보내고, 이 흐름이 대한민국 임시 정부 수립으로 이어져."},
 {t:"fact",y:1917,n:"대동단결 선언",b:"신규식·박은식·신채호·조소앙 등이 상하이에서 발표했어. '순종이 주권을 포기한 날이 곧 국민이 주권을 이어받은 날'이라는 <b>국민 주권론</b>을 폈지.",
  why:"나라를 다시 세우려면 '누가 주인인가'부터 정해야 했어.",
  so:"임시 정부를 세울 이론적 바탕이 됐어. 황제의 나라에서 국민의 나라로 넘어가는 결정적 문장이야."},
 {t:"hint",k:"서 · 북 · 연 · 미 · 상",b:"<em>서</em>간도 경학사·신흥 ‖ <em>북</em>간도 간민회·명동 학교·중광단 ‖ <em>연</em>해주 권업회·신한촌 ‖ <em>미</em>주 국민회·국민군단 ‖ <em>상</em>하이 동제사·신한청년당. 지도 왼쪽 위에서 시계 방향으로 돌면 이 순서야."},
 {t:"pick",q:"경학사와 신흥 강습소가 세워진 곳은?",c:["서간도 삼원보","북간도"],a:0,e:"서간도야. 북간도는 간민회·명동 학교·중광단이지."}
 ],
 quiz:[
 {q:"신흥 무관 학교의 전신은?",c:["신흥 강습소","서전서숙","명동 학교","대성 학교"],a:0,e:"서간도 삼원보에서 시작됐어."},
 {q:"중광단을 만든 종교 세력은?",c:["대종교","천도교","기독교","불교"],a:0,e:"서일 등 대종교 간부들이 만들었고 북로 군정서가 됐어."},
 {q:"연해주에서 이상설·이동휘를 정·부통령으로 세운 조직은?",c:["대한 광복군 정부","대한인 국민회","동제사","경학사"],a:0,e:"신한촌·권업회에 이어 세워졌어."},
 {q:"국민 주권론을 편 1917년 선언은?",c:["대동단결 선언","2·8 독립 선언","3·1 독립 선언서","대한민국 건국 강령"],a:0,e:"임시 정부 수립의 이론적 바탕이 됐어."}

{id:"L12",u:"s6",part:"1919년 봄",title:"불씨가 모이다",sc:"spark",
 hook:"3·1 운동은 어느 날 갑자기 터진 게 아니야. 국제 정세, 유학생, 그리고 한 사람의 죽음. 세 가지가 겹쳤어.",
 cards:[
 {t:"fact",y:1918,n:"국제적 배경",b:"러시아 혁명 뒤 <b>레닌</b>이 약소민족의 해방 운동을 돕겠다고 선언했고, 미국 대통령 <b>윌슨</b>은 <b>민족 자결주의</b>를 내놨어.",
  why:"제1차 세계 대전이 끝나며 세계 질서를 다시 짜던 참이었어.",
  so:"'지금이 기회다. 우리 뜻을 세계에 알리면 도와줄지 모른다'는 판단이 섰어."},
 {t:"fact",y:1919,n:"김규식의 파리 파견",b:"상하이의 <b>신한청년당</b>이 한국의 독립을 청원하려 <b>김규식</b>을 파리 강화 회의에 대표로 보냈어.",
  why:"민족 자결주의가 논의되는 자리에 직접 가야 했으니까.",
  so:"'우리가 독립을 원한다는 증거'가 필요해졌어. 국내에서 큰 시위가 일어나야 대표의 말에 힘이 실리거든."},
 {t:"fact",y:1919,n:"2·8 독립 선언",b:"일본에 유학 중이던 학생들이 <b>조선 청년 독립단</b> 이름으로 도쿄에서 독립 선언서를 발표했어. '요구가 실현되지 않으면 영원히 혈전을 벌이겠다'고 했지.",
  why:"파리 회의에 맞춰 목소리를 내야 했어.",
  so:"적의 심장부에서 터진 선언이라 국내에 큰 충격을 줬어. 3·1 운동의 직접적 계기야."},
 {t:"check",q:"도쿄에서 유학생들이 발표한 선언은?",a:"2·8 독립 선언",hint:"3·1 운동보다 3주쯤 앞서 있었어"},
 {t:"fact",y:1919,n:"고종의 서거",b:"1월에 고종이 세상을 떠났어. 일제가 독살했다는 소문이 퍼지며 분노가 크게 번졌지.",
  why:"이미 강제 퇴위당한 황제였기에 사람들의 감정이 복잡했어.",
  so:"천도교·기독교·불교 지도자와 학생들이 <b>고종의 국장일</b>에 즈음해 만세 시위를 계획했어. 사람이 많이 모이는 날이었거든."},
 {t:"chain",title:"불씨가 모인 순서",items:["레닌 · 윌슨의 민족 자결주의","신한청년당, 김규식을 파리로","2·8 독립 선언 (도쿄)","고종 서거 · 국장일","3·1 운동"]},
 {t:"hint",k:"레 · 윌 · 김 · 2·8 · 고종",b:"국제(<em>레</em>닌·<em>윌</em>슨) → 국외(<em>김</em>규식 파리, <em>2·8</em> 도쿄) → 국내(<em>고종</em> 서거). 바깥에서 안으로 좁혀 들어와."},
 {t:"pick",q:"3·1 운동이 계획된 날은?",c:["고종의 국장일 즈음","순종의 장례일"],a:0,e:"고종이야. 순종의 장례일에 일어난 건 6·10 만세 운동(1926)이지. 이걸 바꿔 내는 문제가 아주 많아."}

 {q:"민족 자결주의를 제창한 사람은?",c:["윌슨","레닌","김규식","손병희"],a:0,e:"레닌은 약소민족 해방 운동 지원을 선언했어."},
 {q:"김규식을 파리 강화 회의에 파견한 단체는?",c:["신한청년당","동제사","대한인 국민회","의열단"],a:0,e:"상하이에서 활동하던 단체야."},
 {q:"도쿄에서 발표된 독립 선언은?",c:["2·8 독립 선언","3·1 독립 선언서","대동단결 선언","기미 독립 선언"],a:0,e:"조선 청년 독립단 이름으로 발표했어."},

{id:"L13",u:"s6",part:"1919년 봄",title:"만세",sc:"flag",
 hook:"1919년 3월 1일. 그날 실제로 무슨 일이 있었는지 시간 순서대로 따라가 보자. 장소 두 곳만 헷갈리지 않으면 돼.",
 cards:[
 {t:"fact",y:1919,n:"민족 대표의 독립 선언",b:"손병희·이승훈·한용운 등 민족 대표 33인은 원래 탑골 공원에서 선언식을 하려 했어. 그런데 시위가 과격해질까 걱정해 <b>태화관</b>이라는 음식점에 모여 선언식을 했지.",
  why:"충돌로 사람이 다칠 것을 우려했어.",
  so:"민족 대표는 태화관, 학생과 시민은 탑골 공원. 이 둘을 바꿔 내는 문제가 단골이야."},
 {t:"fact",y:1919,n:"탑골 공원의 만세",b:"탑골 공원에서는 학생과 시민이 독립 선언서를 낭독하고 '대한 독립 만세'를 외치며 거리로 쏟아져 나왔어.",
  why:"민족 대표가 오지 않자 학생들이 직접 나선 거야.",
  so:"평양·원산 등 주요 도시로 순식간에 번졌어."},
 {t:"check",q:"민족 대표 33인이 독립 선언식을 한 장소는?",a:"태화관",hint:"탑골 공원이 아니야. 학생과 시민이 그곳에 있었지"},
 {t:"fact",y:1919,n:"전국으로, 모든 계층으로",b:"도시에서 농촌으로 번졌는데, 농촌에서는 주로 <b>장날</b>을 이용했어. 학생·교사·상인·노동자는 물론 기생과 걸인까지 계층을 가리지 않고 참여했지.",
  why:"장날은 사람이 자연스럽게 모이는 날이라 발각될 위험이 적었어.",
  so:"'전 민족적'이라는 표현이 괜한 말이 아니야. 이게 3·1 운동의 가장 큰 특징이야."},
 {t:"fact",y:1919,n:"제암리 학살",b:"경기도 화성 제암리에서 일본군이 주민들을 교회에 모아 놓고 문을 잠근 채 총을 쏘고 불을 질렀어.",
  why:"시위를 공포로 꺾으려 한 보복이었어.",
  so:"이런 잔혹한 진압이 알려지면서 국제 여론이 크게 나빠졌어."},
 {t:"fact",y:1919,n:"무력 투쟁으로",b:"헌병 경찰의 무자비한 진압에 시위가 격해지면서, 일부 농민은 경찰 관서와 헌병대 같은 식민 통치 기관을 습격했어.",
  why:"평화적으로 외쳐도 총으로 답이 돌아왔으니까.",
  so:"'3·1 운동은 처음부터 끝까지 평화적이었다'는 문장은 <b>×</b>야. 뒤로 갈수록 무력 투쟁 양상으로 발전했어."},
 {t:"chain",title:"그날의 흐름",items:["민족 대표 — 태화관","학생·시민 — 탑골 공원","주요 도시로 확산","농촌은 장날에","제암리 학살 → 무력 투쟁으로 발전"]},
 {t:"pick",q:"3·1 운동의 전개에 대한 설명으로 옳은 것은?",c:["뒤로 갈수록 무력 투쟁 양상으로 발전했다","끝까지 평화적 만세 시위로만 진행됐다"],a:0,e:"무자비한 진압에 맞서 통치 기관을 습격하기도 했어."}
 ],
 quiz:[
 {q:"민족 대표 33인이 독립 선언식을 한 곳은?",c:["태화관","탑골 공원","덕수궁","독립문"],a:0,e:"시위 과격화를 우려해 장소를 옮겼어."},
 {q:"농촌에서 만세 시위가 주로 열린 때는?",c:["장날","일요일","국장일","추석"],a:0,e:"사람이 자연스럽게 모이는 날이었어."},
 {q:"일본군이 주민을 교회에 모아 놓고 학살한 사건이 일어난 곳은?",c:["경기도 화성 제암리","평안도 정주","함경도 원산","전남 암태도"],a:0,e:"제암리 학살이야."},
 {q:"3·1 운동 참여 계층에 대한 설명으로 옳은 것은?",c:["직업과 계층을 가리지 않고 참여했다","학생만 참여했다","양반만 참여했다","농민은 참여하지 않았다"],a:0,e:"기생과 걸인까지 참여한 전 민족적 운동이었어."}
 ]},

{id:"L14",u:"s6",part:"1919년 봄",title:"그날이 바꾼 것",sc:"chain",
 hook:"3·1 운동은 곧바로 독립으로 이어지지 않았어. 그런데도 우리 근현대사에서 가장 중요한 사건으로 꼽혀. 왜일까?",
 cards:[
 {t:"story",h:"결과부터 보자",b:"3·1 운동이 남긴 건 세 가지야. ① 대한민국 임시 정부가 세워졌고 ② 일제가 문화 정치로 바꿨고 ③ 중국 5·4 운동 같은 다른 약소민족 운동에 영향을 줬어. 이 세 개가 시험에 나오는 전부라고 봐도 돼."},
 {t:"fact",y:1919,n:"임시 정부 수립의 계기",b:"운동을 겪으며 독립운동가들은 깨달았어. '전국이 동시에 일어났는데 이를 이끌 지도부가 없구나.'",
  why:"흩어진 힘을 하나로 묶을 구심점이 필요했어.",
  so:"이 인식에서 <b>대한민국 임시 정부</b>가 세워져. 3·1 운동의 가장 큰 결과야."},
 {t:"fact",y:1919,n:"통치 방식의 전환",b:"일제는 총칼로는 한국인의 독립 의지를 꺾을 수 없다는 걸 알게 됐어.",
  why:"전 민족이 일어났고 국제 여론도 나빠졌으니까.",
  so:"무단 통치를 접고 이른바 <b>문화 정치</b>로 바꿨어. 물론 속은 민족 분열 통치였지."},
 {t:"fact",y:1919,n:"민족 운동 주체의 확대",b:"학생·농민·노동자·여성이 모두 참여했어. 이화 학당 학생 <b>유관순</b>은 천안 아우내 장터에서 시위를 이끌다 붙잡혀 옥중에서 순국했지.",
  why:"모두가 당사자였으니까.",
  so:"이후 학생 운동, 농민·노동 운동, 여성 운동이 활발해지는 밑바탕이 됐어."},
 {t:"fact",y:1919,n:"세계사적 의의",b:"대표적인 반제국주의 민족 운동으로 꼽혀. 중국의 <b>5·4 운동</b> 등 다른 약소민족의 운동에 영향을 줬어.",
  why:"'무력한 한국'이라는 이미지를 '독립을 위해 저항하는 한국'으로 바꿔 놓았거든.",
  so:"우리 안에서만 의미 있는 사건이 아니라는 뜻이야."},
 {t:"chain",title:"3·1 운동이 낳은 것",items:["3·1 운동(1919)","① 대한민국 임시 정부 수립","② 일제, 문화 정치로 전환","③ 중국 5·4 운동 등에 영향","민족 운동 주체 확대 → 1920년대 대중 운동"]},
 {t:"hint",k:"임 · 문 · 5·4",b:"결과 셋만 외우면 돼. <em>임</em>시 정부 · <em>문</em>화 정치 · <em>5·4</em> 운동. 서술형에도 이 세 개를 쓰면 점수가 나와."},
 {t:"pick",q:"3·1 운동의 결과로 볼 수 없는 것은?",c:["6·10 만세 운동이 일어났다","대한민국 임시 정부가 수립됐다"],a:0,e:"6·10 만세 운동은 1926년, 순종의 장례일에 일어난 별개 사건이야."}
 ],
 quiz:[
 {q:"3·1 운동의 가장 큰 결과는?",c:["대한민국 임시 정부 수립","광복","신간회 창립","봉오동 전투 승리"],a:0,e:"운동을 이끌 구심점의 필요성에서 나왔어."},
 {q:"3·1 운동이 영향을 준 중국의 운동은?",c:["5·4 운동","의화단 운동","양무운동","신해혁명"],a:0,e:"대표적인 반제국주의 민족 운동으로 평가받아."},
 {q:"3·1 운동 이후 일제의 통치 방식은?",c:["문화 정치로 전환","무단 통치 강화","민족 말살 통치 시작","병참 기지화"],a:0,e:"총칼로는 안 된다는 걸 깨달았어."},
 {q:"천안 아우내 장터에서 만세 시위를 주도한 인물은?",c:["유관순","한이순","정정화","김마리아"],a:0,e:"이화 학당 학생으로 옥중에서 순국했어."}
 ]},

{id:"L15",u:"s7",part:"나라를 다시 세우다",title:"세 정부가 하나로",sc:"building2",
 hook:"3·1 운동 뒤 임시 정부가 세 곳에 생겼어. 하나로 합쳐야 힘이 되는데, 어디에 둘지가 문제였지. 그 선택의 이유가 시험 포인트야.",
 cards:[
 {t:"fact",y:1919,n:"세 곳의 임시 정부",b:"연해주에 <b>대한 국민 의회</b>, 상하이에 <b>대한민국 임시 정부</b>, 국내에서는 <b>한성 정부</b> 수립이 선포됐어.",
  why:"각지의 독립운동 세력이 저마다 정부를 세운 거야.",
  so:"곧바로 하나로 합치는 통합 운동이 시작됐어."},
 {t:"fact",y:1919,n:"왜 상하이였을까",b:"통합 과정에서 '한인이 많고 무장 투쟁에 유리한 간도나 연해주에 두자'는 주장이 나왔어. 하지만 결국 <b>상하이</b>로 정했지.",
  why:"상하이에는 서구 열강의 조계 지역이 많아 <b>외교 활동</b>에 유리했거든.",
  so:"초기 임시 정부가 외교에 힘을 쏟은 이유가 여기 있어. 그리고 이게 뒷날 갈등의 씨앗이 되기도 해."},
 {t:"check",q:"임시 정부를 상하이에 둔 이유는?",a:"외교 활동에 유리해서",hint:"조계 지역이 많았거든"},
 {t:"fact",y:1919,n:"통합의 방식",b:"<b>한성 정부의 법통</b>을 계승하고, 대한 국민 의회를 통합하는 형태로 정리됐어.",
  why:"국내에서 선포된 정부를 정통으로 삼아야 명분이 섰어.",
  so:"이렇게 해서 하나의 대한민국 임시 정부가 완성돼."},
 {t:"fact",y:1919,n:"민주 공화제 채택",b:"우리 역사상 <b>최초의 민주 공화제 정부</b>야. 삼권 분립에 따라 입법은 <b>임시 의정원</b>, 행정은 <b>국무원</b>, 사법은 <b>법원</b>을 두었지.",
  why:"대동단결 선언에서 다져 온 국민 주권론이 실제 제도가 된 거야.",
  so:"황제의 나라 대한 제국에서 국민의 나라 대한민국으로 넘어간 결정적 지점이야. 지금 헌법도 '3·1 운동으로 건립된 대한민국 임시 정부의 법통'을 잇는다고 적고 있어."},
 {t:"fact",y:1919,n:"초대 각료",b:"대한민국 임시 헌법을 공포하고 임시 대통령에 <b>이승만</b>, 국무총리에 <b>이동휘</b>를 뽑았어.",
  why:"이승만은 외교 노선, 이동휘는 무장 투쟁 노선을 대표했어.",
  so:"노선이 다른 두 사람이 함께 있었다는 게 뒷날 갈등으로 이어져."},
 {t:"chain",title:"통합의 과정",items:["대한 국민 의회 (연해주)","대한민국 임시 정부 (상하이)","한성 정부 (국내)","한성 정부의 법통 계승 + 대한 국민 의회 통합","상하이에 자리 — 외교에 유리해서","최초의 민주 공화제 · 삼권 분립"]},
 {t:"hint",k:"국(연해주) · 상(상하이) · 한(국내)",b:"세 정부의 앞 글자. 그리고 <em>한</em>성의 법통을 잇고 <em>상</em>하이에 앉았다고 기억해."},
 {t:"pick",q:"임시 정부가 계승한 법통은?",c:["한성 정부","대한 국민 의회"],a:0,e:"한성 정부의 법통을 계승하고 대한 국민 의회를 통합했어."}
 ],
 quiz:[
 {q:"연해주에 세워진 임시 정부는?",c:["대한 국민 의회","한성 정부","대한 광복군 정부","임시 의정원"],a:0,e:"상하이는 대한민국 임시 정부, 국내는 한성 정부야."},
 {q:"임시 정부를 상하이에 둔 이유는?",c:["외교 활동에 유리해서","한인이 가장 많아서","무장 투쟁에 유리해서","일본과 가까워서"],a:0,e:"조계 지역이 많았어."},
 {q:"임시 정부의 입법 기관은?",c:["임시 의정원","국무원","법원","구미 위원부"],a:0,e:"행정은 국무원, 사법은 법원이야."},
 {q:"임시 정부 초대 임시 대통령과 국무총리는?",c:["이승만 · 이동휘","김구 · 이동녕","박은식 · 이승만","안창호 · 김규식"],a:0,e:"외교 노선과 무장 투쟁 노선을 각각 대표했어."}
 ]}
,
{id:"L16",u:"s7",part:"나라를 다시 세우다",title:"돈과 소식을 나르다",sc:"route",
 hook:"나라 밖에 정부를 세웠는데, 국내 사람들과 어떻게 연락하고 어떻게 돈을 모았을까? 이름이 비슷한 조직 둘만 구분하면 돼.",
 cards:[
 {t:"fact",y:1919,n:"연통제",b:"국내에 몰래 설치한 <b>비밀 행정 조직</b>이야. 군자금을 모으고 정부의 문서와 명령을 전달했어.",
  why:"국외 정부가 국내를 다스리려면 행정 통로가 있어야 했어.",
  so:"행정이 핵심이야. 세금 걷고 명령 내리는 역할."},
 {t:"fact",y:1919,n:"교통국",b:"<b>통신 기관</b>이야. 정보를 모으고 분석하고 독립운동 자금을 모집했어. 특히 <b>이륭 양행</b>에 사무소를 둔 안동 교통국의 활약이 컸지.",
  why:"소식을 나르는 전용 조직이 필요했어.",
  so:"이륭 양행은 아일랜드계 영국인 조지 루이스 쇼가 운영하던 회사야. 아일랜드도 영국의 식민지였기에 한국 사정을 이해하고 도왔지."},
 {t:"compare",title:"이름이 헷갈리는 둘",l:{n:"연통제",p:["국내 <b>비밀 행정</b> 조직","군자금 조달","정부 문서 · 명령 전달"]},
  r:{n:"교통국",p:["<b>통신</b> 기관","정보 수집과 분석","<b>이륭 양행</b> 안동 교통국"]}},
 {t:"check",q:"이륭 양행에 사무소를 둔 조직은?",a:"교통국",hint:"소식을 나르는 쪽이야"},
 {t:"fact",y:1919,n:"독립 공채",b:"광복 후에 갚겠다고 약속하고 발행한 증서야. 국내는 물론 미주 동포에게도 팔았어.",
  why:"정부를 운영하려면 돈이 있어야 했으니까.",
  so:"들키면 큰 고초를 겪기에 불태우거나 가족조차 모르게 숨긴 경우가 많았어. 광복 후 1983년에야 상환이 시작됐는데 신청은 많지 않았대."},
 {t:"fact",y:1919,n:"구미 위원부",b:"<b>미국</b>에 설치해 대통령 이승만을 중심으로 외교 활동을 폈어.",
  why:"열강의 지지를 얻는 게 초기 임시 정부의 주요 전략이었어.",
  so:"'구미'는 유럽과 미국을 뜻해. 상하이가 아니라 미국에 있었다는 걸 꼭 기억해."},
 {t:"fact",y:1919,n:"독립신문과 사료집",b:"『독립신문』을 펴내 동포들에게 소식을 알렸고, 임시 사료 편찬회를 두어 『한일 관계 사료집』을 냈어.",
  why:"독립 의식을 높이고, 국제 사회에 한국 독립의 정당성을 알리려 했어.",
  so:"선전과 기록도 독립운동의 한 축이었어."},
 {t:"chain",title:"임시 정부를 굴린 네 가지",items:["연통제 — 국내 행정","교통국 — 통신 (이륭 양행)","독립 공채 — 자금","구미 위원부 — 외교 (미국)"]},
 {t:"hint",k:"연 · 교 · 공 · 구",b:"<em>연</em>통제(행정) · <em>교</em>통국(통신) · 독립 <em>공</em>채(자금) · <em>구</em>미 위원부(외교). 네 글자로 임시 정부 활동이 다 들어가."},
 {t:"pick",q:"구미 위원부가 설치된 곳은?",c:["미국","상하이"],a:0,e:"미국이야. 이승만을 중심으로 외교 활동을 벌였어."}
 ],
 quiz:[
 {q:"국내에 설치된 임시 정부의 비밀 행정 조직은?",c:["연통제","교통국","구미 위원부","임시 의정원"],a:0,e:"군자금 조달과 문서·명령 전달을 맡았어."},
 {q:"이륭 양행에 근거를 둔 조직은?",c:["교통국","연통제","구미 위원부","군무부"],a:0,e:"통신 기관인 교통국의 안동 지부야."},
 {q:"구미 위원부가 설치된 나라는?",c:["미국","중국","러시아","프랑스"],a:0,e:"이승만 중심의 외교 기관이야."},
 {q:"임시 정부가 자금을 마련하려 발행한 것은?",c:["독립 공채","독립신문","한일 관계 사료집","임시 헌법"],a:0,e:"광복 후 상환을 약속한 증서야."}
 ]},

{id:"L17",u:"s7",part:"나라를 다시 세우다",title:"흔들리다",sc:"fog",
 hook:"기대를 모으고 출발했지만 몇 년 만에 임시 정부는 흔들렸어. 왜 그랬는지, 그리고 어떻게 수습했는지가 이 레슨이야.",
 cards:[
 {t:"story",h:"세 가지가 겹쳤어",b:"① 연통제와 교통국이 일제에 발각돼 자금줄이 끊겼고 ② 외교 활동이 뚜렷한 성과를 내지 못했고 ③ 이승만이 국제 연맹에 위임 통치를 요청했던 사실이 알려져 신채호 등이 크게 반발했어."},
 {t:"fact",y:1923,n:"국민 대표 회의",b:"각계 독립운동 지도자가 모여 새 방향을 찾으려 했어. 그런데 <b>개조파</b>와 <b>창조파</b>로 갈려 대립하다 결렬됐지.",
  why:"노선 차이가 이미 너무 깊었어. 외교냐 무장 투쟁이냐, 민족주의냐 사회주의냐.",
  so:"많은 독립운동가가 떠나면서 임시 정부는 침체에 빠져."},
 {t:"compare",title:"개조파 vs 창조파",l:{n:"개조파",p:["임시 정부는 <b>민족의 대표 기관</b>","3·1 운동의 열망으로 출범했으니 정통성 인정","조직과 체제를 <b>개선</b>하자","→ 고쳐 쓰자"]},
  r:{n:"창조파",p:["상하이 임정의 계통을 이을 <b>이유 없다</b>","실제 독립운동에 맞는 <b>새 조직</b> 필요","→ 새로 만들자","결과: 대립 끝에 <b>결렬</b>"]}},
 {t:"check",q:"임시 정부를 고쳐 쓰자고 한 쪽은?",a:"개조파",hint:"'개조'라는 말 자체가 고친다는 뜻이야"},
 {t:"fact",y:1925,n:"이승만 탄핵",b:"미주 지역 자금을 독점하고 대통령 직무를 다하지 않았다는 이유로 탄핵됐어. 위임 통치 청원 문제도 컸지. 후임 제2대 대통령은 <b>박은식</b>이야.",
  why:"지도부가 제 역할을 못 하니 정리가 필요했어.",
  so:"임시 정부가 스스로 지도자를 갈아치울 수 있는 조직이었다는 뜻이기도 해."},
 {t:"fact",y:1926,n:"국무령 중심 체제",b:"헌법을 고쳐 대통령제에서 <b>국무령 중심의 집단 지도 체제</b>로 바꿨어. <b>이동녕</b>과 <b>김구</b>를 중심으로 조직을 다시 세웠지.",
  why:"한 사람에게 힘이 몰리는 구조가 문제였으니까.",
  so:"이 체제 아래에서 김구가 뒷날 한인 애국단을 만들어 침체를 뚫어 내게 돼."},
 {t:"chain",title:"위기와 수습",items:["연통제·교통국 발각 · 외교 성과 부진","국민 대표 회의(1923) — 개조파 vs 창조파","결렬 → 침체","이승만 탄핵, 박은식 취임(1925)","국무령 중심 집단 지도 체제(1926)"]},
 {t:"hint",k:"국(23) · 탄(25) · 국무령(26)",b:"<em>국</em>민 대표 회의 1923 → 이승만 <em>탄</em>핵 1925 → <em>국무령</em> 체제 1926. 2년, 1년 간격이야."},
 {t:"pick",q:"국민 대표 회의의 결과는?",c:["개조파와 창조파의 대립으로 결렬","임시 정부가 해산됨"],a:0,e:"결렬 후 많은 이가 떠나 침체에 빠졌지만 정부는 유지됐어."}
 ],
 quiz:[
 {q:"1923년 임시 정부의 방향을 논의한 회의는?",c:["국민 대표 회의","관민 공동회","만민 공동회","임시 의정원 회의"],a:0,e:"개조파와 창조파의 대립으로 결렬됐어."},
 {q:"임시 정부를 고쳐 쓰자고 주장한 쪽은?",c:["개조파","창조파","외교론자","무장 투쟁론자"],a:0,e:"창조파는 새 조직을 만들자고 했어."},
 {q:"이승만 탄핵 후 제2대 대통령이 된 사람은?",c:["박은식","김구","이동녕","안창호"],a:0,e:"『한국통사』를 쓴 역사학자이기도 해."},
 {q:"1926년 임시 정부가 바꾼 체제는?",c:["국무령 중심 집단 지도 체제","대통령 중심제","내각 책임제","주석 중심제"],a:0,e:"한 사람에게 권력이 몰리는 걸 막으려 했어."}
 ]},

{id:"L18",u:"s8",part:"총을 들다",title:"봉오동에서 청산리로",sc:"mountain",
 hook:"3·1 운동 뒤 '평화적으로는 안 되겠다'는 생각이 퍼졌어. 만주의 독립군이 일본 정규군과 정면으로 붙어 이긴 두 번의 싸움, 이건 반드시 구분해야 해.",
 cards:[
 {t:"story",h:"왜 만주였을까",b:"독립군은 국경 너머 만주와 연해주에 기지를 두고 수시로 압록강·두만강을 건너와 일본 군경을 공격했어. 위협을 느낀 일본군이 추격대를 편성해 두만강을 건너오면서 정면 대결이 벌어져."},
 {t:"fact",y:1920,n:"봉오동 전투",b:"<b>홍범도</b>의 대한 독립군, <b>안무</b>의 국민회군, <b>최진동</b>의 군무 도독부군이 연합했어. 일본군을 봉오동 골짜기로 유인한 뒤 미리 매복해 있다가 기습해 크게 이겼지. 1920년 6월이야.",
  why:"지형을 아는 쪽이 유리하다는 걸 알았거든.",
  so:"패배한 일제는 대규모 병력을 동원할 구실을 찾게 돼."},
 {t:"fact",y:1920,n:"훈춘 사건",b:"일제가 중국 마적을 매수해 훈춘의 일본 영사관을 공격하게 한 <b>자작극</b>이야.",
  why:"'우리 국민이 공격당했으니 군대를 보낸다'는 명분을 스스로 만든 거지.",
  so:"이 구실로 약 2만 명의 병력을 만주에 투입했어."},
 {t:"check",q:"일제가 만주 출병 구실을 만들려 꾸민 자작극은?",a:"훈춘 사건",hint:"중국 마적을 매수했어"},
 {t:"fact",y:1920,n:"청산리 대첩",b:"<b>김좌진</b>의 북로 군정서와 <b>홍범도</b>의 대한 독립군 등이 연합했어. <b>백운평</b> 전투를 시작으로 완루구·어랑촌·고동하 등 10여 차례를 싸워 일본군을 크게 격파했지. 1920년 10월이야.",
  why:"백두산 방향으로 이동하며 유리한 지점을 골라 반격했어.",
  so:"독립 전쟁사 최대의 승리야. 간도 한인들이 총알이 빗발치는 산으로 밥을 날라 준 덕도 컸어."},
 {t:"compare",title:"절대 헷갈리면 안 되는 둘",l:{n:"봉오동 전투 (1920. 6.)",p:["<b>홍범도</b>의 대한 독립군","+ 안무 국민회군, 최진동 군무 도독부군","골짜기로 <b>유인</b>해 매복 기습","→ 일제가 훈춘 사건 조작"]},
  r:{n:"청산리 대첩 (1920. 10.)",p:["<b>김좌진</b>의 북로 군정서 + 홍범도","<b>백운평</b>·어랑촌·고동하 등 10여 차례","독립 전쟁사 최대의 승리","→ 보복으로 간도 참변"]}},
 {t:"hint",k:"봉-홍 / 청-김",b:"<em>봉</em>오동은 <em>홍</em>범도, <em>청</em>산리는 <em>김</em>좌진. 둘 다 ㅇ·ㅎ / ㅊ·ㄱ 로 짝지어 외워. 홍범도는 둘 다 참여했다는 것도 기억해 두면 좋아."},
 {t:"pick",q:"청산리 대첩의 첫 전투는?",c:["백운평 전투","봉오동 전투"],a:0,e:"백운평을 시작으로 어랑촌·고동하 등 10여 차례를 싸웠어."}
 ],
 quiz:[
 {q:"봉오동 전투를 이끈 인물은?",c:["홍범도","김좌진","지청천","양세봉"],a:0,e:"안무·최진동 부대와 연합했어."},
 {q:"일제가 만주 출병 구실로 조작한 사건은?",c:["훈춘 사건","제암리 사건","자유시 참변","간도 참변"],a:0,e:"중국 마적을 매수한 자작극이야."},
 {q:"청산리 대첩의 주력 부대는?",c:["북로 군정서","대한 독립군","조선 혁명군","한국 독립군"],a:0,e:"김좌진이 이끌었고 중광단에서 발전한 부대야."},
 {q:"청산리 대첩에 포함되지 않는 전투는?",c:["봉오동 전투","백운평 전투","어랑촌 전투","고동하 전투"],a:0,e:"봉오동은 그 넉 달 전 별개의 전투야."}
 ]},

{id:"L19",u:"s8",part:"총을 들다",title:"두 번의 참변, 그리고 3부",sc:"snow",
 hook:"승리 뒤에 곧바로 비극이 왔어. 이름이 비슷한 두 참변, 가해자가 서로 달라. 이것만 구분하면 이 레슨은 끝이야.",
 cards:[
 {t:"fact",y:1920,n:"간도 참변",b:"일제가 독립군의 근거지를 없앤다는 구실로 서너 달에 걸쳐 간도의 한인 마을을 불태우고 수많은 한인을 학살했어.",
  why:"청산리 대첩에 대한 <b>보복</b>이었어.",
  so:"가해자는 <b>일본군</b>이야. 독립군을 도운 민간인을 겨냥한 학살이었지."},
 {t:"fact",y:1921,n:"자유시 참변",b:"간도의 독립군 4천여 명이 밀산에 모였다가 레닌의 지원을 기대하며 러시아 <b>자유시</b>로 옮겨 갔어. 그런데 부대를 통합하는 과정에서 지휘권을 둘러싼 분쟁이 일어났고, 지휘권 양도를 거부한 독립군을 러시아 <b>적군</b>이 무장 해제하면서 많은 이가 희생됐지.",
  why:"여러 부대가 모였는데 누가 지휘하느냐를 정하지 못했어.",
  so:"가해자는 <b>러시아 적군</b>이야. 원인은 <b>지휘권 분쟁</b>이고. 간도 참변과 바꿔 내는 문제가 정말 많아."},
 {t:"compare",title:"가해자가 다르다",l:{n:"간도 참변 (1920)",p:["가해자: <b>일본군</b>","구실: 독립군 근거지 제거","청산리 대첩에 대한 보복","한인 마을 방화 · 민간인 학살"]},
  r:{n:"자유시 참변 (1921)",p:["가해자: 러시아 <b>적군</b>","배경: 밀산 집결 → 자유시 이동","원인: <b>지휘권</b> 분쟁","무장 해제 과정에서 희생"]}},
 {t:"check",q:"자유시 참변의 가해자는?",a:"러시아 적군",hint:"일본군이 아니야. 그게 함정이지"},
 {t:"fact",y:1924,n:"3부의 성립",b:"두 참변으로 큰 타격을 입은 독립군이 전열을 가다듬고 부대를 통합했어. 남만주에 <b>참의부</b>, 지린성 일대에 <b>정의부</b>, 북만주에 <b>신민부</b>가 세워졌지.",
  why:"흩어져서는 버틸 수 없었으니까.",
  so:"신민부는 자유시에서 돌아온 독립군이 중심이 됐어."},
 {t:"fact",y:1925,n:"3부의 성격",b:"민정 조직과 군정 조직을 함께 갖췄어. 관할 구역 한인들에게 세금을 걷어 운영한 사실상의 <b>공화주의 자치 정부</b>였지.",
  why:"동포 사회를 지키면서 군대도 길러야 했으니까.",

/* 수업을 마칠수록 자라는 나무. stage 0~20 */
function plant(st,size){
  var o='fill="none" stroke-linecap="round" stroke-linejoin="round"';
  var g,vb,vh;
  if(st===0){
    vb="0 74 120 42"; vh=42;
    g='<path d="M18 106h84" stroke="var(--line2)" stroke-width="2" '+o+'/>'+
      '<ellipse cx="60" cy="98" rx="10" ry="7.5" fill="var(--line2)"/>'+
      '<path d="M60 91c0-5 3-8 7-9" stroke="var(--jade)" stroke-width="2.6" '+o+'/>'+
      '<path d="M67 82q6-1 8-5-6-2-9 2z" fill="var(--jade)" opacity=".7"/>';
    return '<svg width="'+size+'" height="'+Math.round(size*vh/120)+'" viewBox="'+vb+'" aria-hidden="true">'+g+'</svg>';
  }
  var h=16+st*3.6, top=104-h;
  var vbTop=Math.round(top-20); vh=112-vbTop; vb="0 "+vbTop+" 120 "+vh;
  g='<path d="M18 106h84" stroke="var(--line2)" stroke-width="2" '+o+'/>';
  g+='<path d="M60 106 C 58 '+(106-h*0.4).toFixed(0)+' 62 '+(106-h*0.7).toFixed(0)+' 60 '+top.toFixed(0)+'" stroke="var(--jade)" stroke-width="'+(2.4+st*0.1).toFixed(1)+'" '+o+'/>';
  var pairs=Math.min(7,Math.ceil(st/2.6));
  for(var i=0;i<pairs;i++){
    var y=106-h*(0.22+0.64*(i/Math.max(1,pairs-0.01)));
    var w=10+Math.min(st,14)*0.8-i*1.1, side=(i%2?1:-1);
    g+='<path d="M60 '+y.toFixed(0)+' q '+(side*w).toFixed(0)+' -'+(w*0.72).toFixed(0)+' '+(side*w*1.5).toFixed(0)+' 2 q -'+(side*w*0.75).toFixed(0)+' '+(w*0.6).toFixed(0)+' -'+(side*w*1.5).toFixed(0)+' -2 z" fill="var(--jade)" opacity="'+(0.45+i*0.07).toFixed(2)+'"/>';
  }
  if(st>=12)
    g+='<path d="M60 '+(top+16).toFixed(0)+' q -16 -6 -22 -20 M60 '+(top+22).toFixed(0)+' q 16 -6 22 -18" stroke="var(--jade)" stroke-width="2.2" opacity=".6" '+o+'/>';
  if(st>=15){
    var fl=[[38,top+2],[82,top+6],[60,top-5]];
    for(var k=0;k<Math.min(3,st-14);k++)
      g+='<circle cx="'+fl[k][0]+'" cy="'+fl[k][1].toFixed(0)+'" r="'+(4.2+(st>=20?1.6:0)).toFixed(1)+'" fill="var(--ochre)" opacity=".88"/>';
  }
  if(st>=20)
    g+='<circle cx="60" cy="'+(top-13).toFixed(0)+'" r="3.2" fill="var(--ochre)"/>'+
       '<path d="M45 '+(top-18).toFixed(0)+'l3 5-3 5M75 '+(top-18).toFixed(0)+'l-3 5 3 5" stroke="var(--ochre)" stroke-width="1.8" opacity=".7" '+o+'/>';
  return '<svg width="'+size+'" height="'+Math.round(size*vh/120)+'" viewBox="'+vb+'" aria-hidden="true">'+g+'</svg>';
}

var KEY="hansa-learn-v1";

function today(){var d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);}
var S;
function load(){
  try{var r=localStorage.getItem(KEY);
    S=r?JSON.parse(r):null;}catch(e){S=null;}
  if(!S)S={done:{},pos:{},quiz:{},wrong:{},due:{},streak:0,last:0,dday:"",hist:[],theme:""};
  ["done","pos","quiz","wrong","due"].forEach(function(k){if(!S[k])S[k]={};});
  if(!S.hist)S.hist=[]; if(S.dday==null)S.dday="";
  /* 옛 저장본: 마친 수업에 복습 일정이 없으면 내일로 잡아 준다 */
  Object.keys(S.done).forEach(function(k){ if(!S.due[k])S.due[k]={n:0,at:today()+1}; });
  if(S.last&&S.last<today()-1)S.streak=0;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function markDay(){var t=today();if(S.last!==t){S.streak=(S.last===t-1)?S.streak+1:1;S.last=t;save();}}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
/* 문항 본문: 줄바꿈과 밑줄만 되살리고 나머지는 그대로 막는다 */
function qh(t){return esc(t).replace(/\n/g,"<br>").replace(/&lt;(\/?)u&gt;|&lt;(\/?)u>/g,function(_,a,b){return "<"+(a||b||"")+"u>";});}
function bokiBox(b){return b?'<div class="bokibox">'+b.map(function(t,i){
  return '<div class="bk"><span>'+BOKI[i]+'.</span><p>'+esc(t)+'</p></div>';}).join("")+'</div>':'';}
function doneCount(){return LESSONS.filter(function(l){return S.done[l.id];}).length;}
function nextLesson(){
  for(var i=0;i<LESSONS.length;i++)if(!S.done[LESSONS[i].id])return LESSONS[i];
  return null;
}

/* ── 화면 ── */
var view=document.getElementById("Lview"),titleReal=document.getElementById("Ltitle"),
    backEl=document.getElementById("Lback");
/* 창 제목에는 경로만 띄운다. 화면마다 넣던 한글 제목은 여기서 흘려보낸다 —
   render 를 거치지 않고 다시 그리는 곳이 있어서 한 군데서 막는 편이 확실하다 */
var titleEl={set textContent(v){},get textContent(){return titleReal.textContent;}};
var stack=[],VIEWS={};
function go(n,a,rep){
  if(rep)stack[stack.length-1]={n:n,a:a};
  else{stack.push({n:n,a:a});try{history.pushState({i:stack.length},"");}catch(e){}}
  render();
}
function back(){if(stack.length>1){stack.pop();render();}}
window.addEventListener("popstate",function(){
  if(window.__hansa!=="learn")return;
  if(stack.length>1){stack.pop();render();}
  else{try{history.pushState({i:1},"");}catch(e){}}
});
function render(){
  var s=stack[stack.length-1];
  backEl.style.display=stack.length>1?"":"none";
  window.scrollTo(0,0);
  VIEWS[s.n](s.a);
}
backEl.onclick=back;

/* 마친 수업에서 한 장 뽑아 홈에 띄운다 */
function peekCard(){
  var pool=[];
  LESSONS.forEach(function(l){
    if(!S.done[l.id])return;
    l.cards.forEach(function(c){
      if(c.t==="hint")pool.push({l:l,html:'<b class="k">'+esc(c.k)+'</b><span>'+c.b+'</span>'});
      if(c.t==="fact")pool.push({l:l,html:'<b class="k" style="color:var(--ink)">'+c.y+' · '+esc(c.n)+'</b><span>'+c.so+'</span>'});
      if(c.t==="chain")pool.push({l:l,html:'<b class="k" style="font-size:16px">'+esc(c.title)+'</b><span>'+
        c.items.map(function(x){return x.replace(/<[^>]+>/g,"");}).join(" → ")+'</span>'});
    });
  });
  if(!pool.length)return null;
  return pool[Math.floor(Math.random()*pool.length)];
}

/* ── 간격 반복: 마친 수업을 1 · 3 · 7 · 16일 뒤에 다시 묻는다 ── */
var DUE_DAYS=[1,3,7,16];
function dueList(){
  var t=today();
  return LESSONS.filter(function(l){ var d=S.due[l.id]; return S.done[l.id]&&d&&d.at<=t; });
}
function dueBump(lid,ok){
  var d=S.due[lid]||{n:0,at:today()};
  if(ok)d.n=Math.min(DUE_DAYS.length-1,d.n+1); else d.n=0;
  d.at=today()+DUE_DAYS[d.n];
  S.due[lid]=d; save();
}
function ddayLeft(){
  if(!S.dday)return null;
  var d=new Date(S.dday+"T00:00:00");
  if(isNaN(d))return null;
  return Math.round(Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)-today());
}
/* 남은 날짜에 맞춘 하루 권장량 */
function pace(){
  var L=ddayLeft(); if(L==null||L<0)return null;
  var left=LESSONS.length-doneCount(); if(!left)return null;
  return {left:left, days:Math.max(1,L), per:Math.ceil(left/Math.max(1,L))};
}

/* ── 오답 노트 ── */
function wkey(lid,kind,idx){return lid+"#"+kind+idx;}
function wAdd(lid,kind,idx,chose){
  var k=wkey(lid,kind,idx),w=S.wrong[k];
  if(w){w.miss++;w.at=Date.now();w.chose=chose;}
  else S.wrong[k]={lid:lid,kind:kind,idx:idx,miss:1,at:Date.now(),chose:chose};
  save();
}
function wClear(lid,kind,idx){ delete S.wrong[wkey(lid,kind,idx)]; save(); }
function wCount(){return Object.keys(S.wrong).length;}
/* 오답 항목을 실제 문제로 되살린다 */
function wItem(w){
  if(w.kind==="e"){                      /* 내신 실전 문항 */
    var x=(typeof EMAP!=="undefined")?EMAP[w.idx]:null; if(!x)return null;
    return {lid:"EXAM",kind:"e",idx:w.idx,lesson:{title:"내신 실전 · "+UMAP[x.u].n},
      q:x.q,c:x.c,a:x.a,e:x.e,miss:w.miss,chose:w.chose,type:x.type,boki:x.boki};
  }
  var l=LMAP[w.lid]; if(!l)return null;
  if(w.kind==="q"){ var q=l.quiz[w.idx]; if(!q)return null;
    return {lid:w.lid,kind:"q",idx:w.idx,lesson:l,q:q.q,c:q.c,a:q.a,e:q.e,miss:w.miss,chose:w.chose}; }
  var c=l.cards[w.idx]; if(!c||c.t!=="pick")return null;
  return {lid:w.lid,kind:"p",idx:w.idx,lesson:l,q:c.q,c:c.c,a:c.a,e:c.e,miss:w.miss,chose:w.chose};
}
function wList(){
  return Object.keys(S.wrong).map(function(k){return wItem(S.wrong[k]);})
    .filter(Boolean).sort(function(a,b){
      var ai=LESSONS.indexOf(LMAP[a.lid]||{}),bi=LESSONS.indexOf(LMAP[b.lid]||{});
      return ai-bi||String(a.idx).localeCompare(String(b.idx));});
}

/* ── 레슨 ── */
var L=null;
function vLesson(a){
  var l=LMAP[a.id];
  if(!L||L.id!==a.id){
    L={id:a.id,l:l,i:(S.done[l.id]?0:(S.pos[l.id]||0)),phase:"card",qi:0,qok:0,qlog:[],revealed:false,answered:false};
    if(L.i>=l.cards.length)L.i=0;
  }
  titleEl.textContent=l.title;
  if(L.phase==="quiz")return paintQuiz();
  if(L.phase==="end")return paintEnd();
  paintCard();
}
function hud(){
  var l=L.l,tot=l.cards.length+l.quiz.length;
  var cur=L.phase==="card"?L.i:l.cards.length+L.qi;
  return '<div style="display:flex;align-items:center;gap:12px;padding:2px 0 16px">'+
    '<span class="track"><i style="width:'+(cur/tot*100)+'%"></i></span>'+
    '<span class="step">'+(cur+1)+' / '+tot+'</span></div>';
}
function nextBtn(label,fn){
  var h='<div class="sticky"><button class="cta" id="nx">'+label+'</button></div>';
  setTimeout(function(){var b=document.getElementById("nx");if(b)b.onclick=fn;},0);
  return h;
}
function advance(){
  L.i++; L.revealed=false; L.answered=false;
  S.pos[L.id]=L.i; save();
  if(L.i>=L.l.cards.length){L.phase="quiz";L.qi=0;L.qok=0;L.qlog=[];}
  vLesson({id:L.id});
}

function paintCard(){
  var l=L.l,c=l.cards[L.i],h=hud();
  if(L.i===0)h+='<div class="card"><div class="scene">'+scene(l.sc,72)+'</div>'+
    '<div class="eyebrow">'+esc(l.part)+' · '+(LESSONS.indexOf(l)+1)+'번째 수업</div>'+
    '<div class="h">'+esc(l.title)+'</div><div class="bd">'+esc(l.hook)+'</div></div>';

  if(c.t==="story")
    h+='<div class="card"><div class="eyebrow">이야기</div><div class="h sm">'+esc(c.h)+'</div>'+
       '<div class="bd">'+c.b+'</div></div>';

  if(c.t==="fact")
    h+='<div class="card"><span class="yr">'+c.y+'</span>'+
       '<div class="h">'+esc(c.n)+'</div><div class="bd">'+c.b+'</div>'+
       '<div class="wsblock">'+
         '<div class="ws why"><span class="lb">왜?</span><p>'+c.why+'</p></div>'+
         '<div class="ws so"><span class="lb">그래서</span><p>'+c.so+'</p></div>'+
       '</div></div>';

  if(c.t==="chain"){
    h+='<div class="card"><div class="eyebrow">인과 사슬</div><div class="h sm">'+esc(c.title)+'</div>'+
       '<div class="chain">'+c.items.map(function(x,i){
         return '<div class="cl" style="animation-delay:'+(i*130)+'ms"><span class="dot"></span><p>'+x+'</p></div>';
       }).join("")+'</div></div>';
  }

  if(c.t==="hint")
    h+='<div class="card hintcard"><div class="eyebrow">이렇게 외우자</div>'+
       '<div class="k">'+esc(c.k)+'</div><div class="bd">'+c.b+'</div></div>';

  if(c.t==="compare")
    h+='<div class="card"><div class="eyebrow">헷갈리지 않게</div><div class="h sm">'+esc(c.title)+'</div>'+
       '<div class="cmp"><div class="a"><h4>'+c.l.n+'</h4><ul>'+c.l.p.map(function(x){return "<li>"+x+"</li>";}).join("")+'</ul></div>'+
       '<div class="b"><h4>'+c.r.n+'</h4><ul>'+c.r.p.map(function(x){return "<li>"+x+"</li>";}).join("")+'</ul></div></div></div>';

  if(c.t==="check"){
    h+='<div class="card"><div class="eyebrow">잠깐, 스스로 떠올려 보자</div><div class="recall">'+
       '<div class="q">'+esc(c.q)+'</div>'+
       (L.revealed?'<div class="ans">'+esc(c.a)+'</div>'
                  :'<div class="ans blur">'+esc(c.a)+'</div>')+
       '<div class="tip">'+(L.revealed?"맞혔으면 그대로, 틀렸으면 한 번 더 소리 내어 읽어 보자":esc(c.hint||"머릿속으로 답해 본 다음 눌러 봐"))+'</div>'+
       '</div></div>';
    if(!L.revealed){
      h+=nextBtn("답 확인",function(){L.revealed=true;buzz(12);vLesson({id:L.id});});
      view.innerHTML=h;return;
    }
  }

  if(c.t==="pick"){
    h+='<div class="card"><div class="eyebrow">골라 보자</div><div class="h sm">'+esc(c.q)+'</div>'+
       '<div class="two" id="two">'+c.c.map(function(x,i){
         return '<button class="tw" data-i="'+i+'">'+esc(x)+'</button>';}).join("")+'</div>'+
       '<div id="fb"></div></div>';
    view.innerHTML=h;
    Array.prototype.forEach.call(view.querySelectorAll("#two .tw"),function(b){
      b.onclick=function(){
        if(L.answered)return; L.answered=true;
        var ok=+b.dataset.i===c.a;
        Array.prototype.forEach.call(view.querySelectorAll("#two .tw"),function(x,i){
          x.disabled=true; if(i===c.a)x.classList.add("ok"); else if(x===b)x.classList.add("no");
        });
        buzz(ok?14:[20,40,20]); markDay();
        if(ok)wClear(L.id,"p",L.i); else wAdd(L.id,"p",L.i,+b.dataset.i);
        document.getElementById("fb").innerHTML=
          '<div class="fb '+(ok?"ok":"no")+'"><span class="m">'+(ok?"맞아":"아냐")+'</span><span>'+c.e+'</span></div>';
        view.insertAdjacentHTML("beforeend",nextBtn("다음",advance));
      };
    });
    return;
  }

function paintQuiz(){
  var l=L.l,q=l.quiz[L.qi];
  var h=hud()+'<div class="card"><div class="eyebrow">마무리 퀴즈 '+(L.qi+1)+' / '+l.quiz.length+'</div>'+
    '<div class="h sm">'+esc(q.q)+'</div></div>'+
    '<div style="margin-top:12px" id="opts">'+q.c.map(function(x,i){
      return '<button class="qopt" data-i="'+i+'"><span class="kx">'+"ABCD".charAt(i)+'</span><span>'+esc(x)+'</span></button>';
    }).join("")+'</div><div id="fb"></div>';
  view.innerHTML=h;
  Array.prototype.forEach.call(view.querySelectorAll("#opts .qopt"),function(b){
    b.onclick=function(){
      if(L.answered)return; L.answered=true;
      var ok=+b.dataset.i===q.a;
      Array.prototype.forEach.call(view.querySelectorAll("#opts .qopt"),function(x,i){
        x.disabled=true;
        if(i===q.a)x.classList.add("ok"); else if(x===b)x.classList.add("no"); else x.classList.add("dim");
      });
      if(ok){
        L.qok++; L.combo=(L.combo||0)+1;
        if(L.combo>=3&&L.combo%3===0)pop(L.combo+"연속!"); else pop("좋아!");
        wClear(L.id,"q",L.qi);
      }else{
        L.combo=0; wAdd(L.id,"q",L.qi,+b.dataset.i);
      }
      L.qlog.push({q:q,ok:ok});
      buzz(ok?14:[20,40,20]); markDay();
      document.getElementById("fb").innerHTML=
        '<div class="fb '+(ok?"ok":"no")+'"><span class="m">'+(ok?"○":"×")+'</span><span>'+esc(q.e)+'</span></div>';
      view.insertAdjacentHTML("beforeend",nextBtn(
        L.qi+1>=l.quiz.length?"수업 마치기":"다음 문제",function(){
          L.qi++; L.answered=false;
          if(L.qi>=l.quiz.length){L.phase="end";finishLesson();}
          vLesson({id:L.id});
        }));
    };
  });
}
function finishLesson(){
  S.done[L.id]=Date.now();
  dueBump(L.id, L.qok>=Math.ceil(L.l.quiz.length*0.75));   /* 잘 봤으면 더 멀리 미룬다 */
  S.quiz[L.id]={n:L.l.quiz.length,ok:L.qok};
  S.pos[L.id]=0; markDay(); save();
}

/* ── 연표: 수업 속 사실 카드를 연도순으로 한 장에 모은다 ── */
var TL=null;
function timeline(){
  if(TL)return TL;
  TL=[];
  LESSONS.forEach(function(l){
    l.cards.forEach(function(c,i){
      if(c.t==="fact"&&c.y!=null)
        TL.push({y:c.y,n:c.n,u:l.u,lid:l.id,ci:i,lt:l.title});
    });
  });
  /* 같은 해 안에서는 교과서 차례 그대로 둔다 (정렬이 안정적이라 그대로 남는다) */
  TL.sort(function(a,b){return a.y-b.y;});
  return TL;
}
var RVTAB="hint",TLU="";
/* 렌더를 우회하면 창 제목이 경로로 안 바뀐다. 상태만 바꾸고 render 를 태운다 */
function jumpCard(lid,ci){
  L=null; go("lesson",{id:lid});
  if(L){ L.i=Math.max(0,Math.min(ci,LMAP[lid].cards.length-1));
    L.phase="card"; L.revealed=false; L.answered=false; render(); }
}

var IDX=null, FQ="";
function buildIndex(){
  if(IDX)return IDX;
  IDX=[];
  LESSONS.forEach(function(l,li){
    IDX.push({t:"수업",lid:l.id,li:li,ci:0,head:l.title,body:l.hook});
    l.cards.forEach(function(c,ci){
      var head="",body="";
      if(c.t==="fact"){head=c.n+" · "+c.y+"년";body=c.b+" "+c.why+" "+c.so;}
      else if(c.t==="hint"){head=c.k;body=c.b;}
      else if(c.t==="chain"){head=c.title;body=c.items.join(" ");}
      else if(c.t==="compare"){head=c.title;body=c.l.n+" "+c.l.p.join(" ")+" "+c.r.n+" "+c.r.p.join(" ");}
      else if(c.t==="story"){head=c.h;body=c.b;}
      else if(c.t==="check"){head=c.q;body=c.a;}
      else if(c.t==="pick"){head=c.q;body=c.c.join(" ")+" "+c.e;}
      if(head||body)IDX.push({t:"수업",lid:l.id,li:li,ci:ci,head:head,body:body,sub:l.title});
    });
    l.quiz.forEach(function(q,qi){
      IDX.push({t:"퀴즈",lid:l.id,li:li,ci:-1,head:q.q,body:q.c.join(" ")+" "+q.e,sub:l.title,
        ans:q.c[q.a],ex:q.e});
    });
  });
  EXAM.forEach(function(q){
    IDX.push({t:"내신",eid:q.id,head:q.q.split("\n")[0],
      body:(q.boki?q.boki.join(" "):"")+" "+q.c.join(" ")+" "+q.e,
      sub:UMAP[q.u].n, ans:(q.type==="short"?q.c[0]:q.c[q.a]), ex:q.e});
  });
  return IDX;
}
function strip(x){return String(x).replace(/<[^>]+>/g,"");}
function findHits(term){
  var t=term.trim().toLowerCase(); if(t.length<1)return [];
  return buildIndex().filter(function(r){
    return (strip(r.head)+" "+strip(r.body)).toLowerCase().indexOf(t)>=0;
  }).slice(0,60);
}
function hl(text,term){
  var s0=strip(text), i=s0.toLowerCase().indexOf(term.toLowerCase());
  if(i<0)return esc(s0.slice(0,80));
  var a=Math.max(0,i-26);
  return (a?"…":"")+esc(s0.slice(a,i))+"<mark>"+esc(s0.slice(i,i+term.length))+"</mark>"+
         esc(s0.slice(i+term.length,i+term.length+52))+"…";
}
function vFind(){
  titleEl.textContent="/FIND";
  var hits=FQ.trim()?findHits(FQ):[];
  view.innerHTML=
    '<div class="findbar"><span class="mg">&#9906;</span>'+

        '문항을 한꺼번에 찾아. 수업 시간에 처음 듣는 말이 나오면 여기 쳐 봐.</p>'+
        '<div class="part">이런 걸 찾아봐</div><div class="chips" id="sug">'+
        ["미쓰야 협정","산미 증식 계획","복벽주의","태화관","자유시 참변","황국 신민 서사"]
          .map(function(w){return '<button class="chip" data-w="'+w+'">'+w+'</button>';}).join("")+'</div>'
      : (!hits.length
        ? '<div class="empty">'+scene("paper",56)+'<p><b>'+esc(FQ)+'</b> 는 못 찾았어.<br>낱말을 줄여서 다시 쳐 봐.</p></div>'
        : '<div class="part">결과 '+hits.length+'개</div>'+hits.map(function(r,i){
            return '<button class="hit" data-i="'+i+'"><span class="hk '+(r.t==="내신"?"e":(r.t==="퀴즈"?"q":"c"))+'">'+r.t+'</span>'+
              '<span class="ht"><b>'+hl(r.head,FQ)+'</b>'+
              (r.body?'<small>'+hl(r.body,FQ)+'</small>':'')+
              (r.sub?'<i>'+esc(r.sub)+'</i>':'')+'</span></button>';
          }).join("")));
  var inp=document.getElementById("fIn");
  var run=function(){ FQ=inp.value; var pos=inp.selectionStart; vFind();
    var n=document.getElementById("fIn"); if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}} };
  var tmr=null;
  inp.addEventListener("input",function(){clearTimeout(tmr);tmr=setTimeout(run,220);});
  inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();clearTimeout(tmr);run();}});
  /* 찾기 창을 열면 바로 칠 수 있게 커서를 넣어 준다 */
  try{inp.focus({preventScroll:true});}catch(e){inp.focus();}
  var cl=document.getElementById("fClr"); if(cl)cl.onclick=function(){FQ="";vFind();};
  Array.prototype.forEach.call(view.querySelectorAll("#sug .chip"),function(b){
    b.onclick=function(){FQ=b.dataset.w;vFind();};
  });
  Array.prototype.forEach.call(view.querySelectorAll(".hit"),function(b){
    b.onclick=function(){
      var r=hits[+b.dataset.i];

    };
  });
}

/* ═══════════════════════════════════════════

   ═══════════════════════════════════════════ */
var EMAP={};EXAM.forEach(function(q){EMAP[q.id]=q;});
var TYPE_NAME={mc5:"5지선다",boki:"<보기> 조합형",neg:"옳지 않은 것",order:"순서 배열",short:"단답형"};
var BOKI=["ㄱ","ㄴ","ㄷ","ㄹ"];

function e2init(){
  if(!S.exam)S.exam={best:0,runs:0,typeN:{},typeOk:{}};
  if(!S.exam.typeN)S.exam.typeN={};
  if(!S.exam.typeOk)S.exam.typeOk={};
}
function normKo(x){return String(x).toLowerCase().replace(/[\s·.,'"‘’“”()\-–—]/g,"");}
function shortOk(input,accept){
  var v=normKo(input); if(!v)return false;
  return accept.some(function(a){return normKo(a)===v;});
}

/* ── 시험 고르기 ── */
function vExamPick(){
  titleEl.textContent="내신 실전";
  e2init();
  if(!EP)EP={units:[],n:10};
  var avail=function(us){return EXAM.filter(function(q){return !us.length||us.indexOf(q.u)>=0;}).length;};
  var can=avail(EP.units);
  view.innerHTML=
    '<div class="hero" style="padding-bottom:16px">'+
      '<h1 style="font-size:21px">학교 시험처럼 풀어 보자</h1>'+
      '<p>&lt;보기&gt; 조합형, 옳지 않은 것 찾기, 순서 배열, 단답형까지 '+EXAM.length+'문항. '+
      '끝까지 풀고 한 번에 채점해.</p>'+
      (S.exam.runs?'<div class="prog" style="margin-top:14px"><div class="bestbox"><b>'+S.exam.best+'</b><small>최고 점수</small></div>'+
        '<div class="pt"><b>'+S.exam.runs+'회 응시</b><small>'+
        (function(){var w=weakType();return w?"약한 유형 · "+TYPE_NAME[w].replace(/<|>/g,"")||"":"";})()+'</small></div></div>':'')+
    '</div>'+
    '<div class="part">범위</div>'+
    '<div class="chips" id="uch">'+
      '<button class="chip'+(EP.units.length?"":" on")+'" data-u="">전체</button>'+
      UNITS.map(function(u){
        var n=EXAM.filter(function(q){return q.u===u.id;}).length;
        return '<button class="chip'+(EP.units.indexOf(u.id)>=0?" on":"")+'" data-u="'+u.id+'">'+esc(u.n)+' <i>'+n+'</i></button>';
      }).join("")+'</div>'+
    '<div class="part">문항 수</div>'+
    '<div class="chips" id="nch">'+[10,20,30].map(function(n){
      return '<button class="chip'+(EP.n===n?" on":"")+'" data-n="'+n+'"'+(can<n?" disabled":"")+'>'+n+'문항</button>';

    '<div class="sticky"><button class="cta" id="start">'+IC.play+' 시험 시작</button></div>';

    b.onclick=function(){
      var u=b.dataset.u;
      if(!u)EP.units=[];
      else{var i=EP.units.indexOf(u); if(i>=0)EP.units.splice(i,1); else EP.units.push(u);}

var EP=null,X=null;

/* ── 시험지 ── */
function vExamRun(){
  if(!X)return go("exam",null,true);
  var q=X.q[X.i],no=X.i+1;
  titleEl.textContent="문항 "+no+" / "+X.q.length;

    '<div class="pno"><b>'+no+'</b><span class="tt">'+TYPE_NAME[q.type].replace("<","&lt;").replace(">","&gt;")+'</span>'+
      '<span class="pts">'+esc(UMAP[q.u].n)+'</span></div>'+
    '<div class="pq">'+qh(q.q)+'</div>'+bokiBox(q.boki)+'</div>';
  if(q.type==="short"){
    body+='<div class="shortin"><input type="text" id="sIn" inputmode="text" autocomplete="off" '+
      'autocapitalize="off" spellcheck="false" placeholder="답을 적어 보세요" value="'+esc(chosen||"")+'"></div>';
  }else{
    body+='<div class="opts5" id="opts">'+q.c.map(function(c,i){
      return '<button class="o5'+(chosen===i?" pick":"")+'" data-i="'+i+'">'+

    }).join("")+'</div>';
  }
  var unanswered=X.q.filter(function(y){return X.ans[y.id]==null||X.ans[y.id]==="";}).length;
  body+='<div class="sticky">'+
    '<div class="omr" id="omr">'+X.q.map(function(y,i){
      var st=(X.ans[y.id]!=null&&X.ans[y.id]!=="")?"f":"";
      return '<button class="ob '+st+(i===X.i?" cur":"")+'" data-j="'+i+'">'+(i+1)+'</button>';
    }).join("")+'</div>'+
    '<div class="row" style="margin-top:10px">'+
      '<button class="cta ghost" id="prev"'+(X.i===0?" disabled":"")+'>이전</button>'+
      (X.i===X.q.length-1
        ? '<button class="cta" id="submit">제출하기'+(unanswered?' ('+unanswered+'개 빈칸)':'')+'</button>'
        : '<button class="cta" id="next">다음</button>')+
    '</div></div>';
  view.innerHTML=body;
  var save1=function(){
    if(q.type==="short"){var el=document.getElementById("sIn");if(el)X.ans[q.id]=el.value;}
  };
  Array.prototype.forEach.call(view.querySelectorAll("#opts .o5"),function(b){
    b.onclick=function(){
      X.ans[q.id]=+b.dataset.i;
      Array.prototype.forEach.call(view.querySelectorAll("#opts .o5"),function(x){x.classList.remove("pick");});
      b.classList.add("pick"); buzz(8);
      var ob=view.querySelectorAll("#omr .ob")[X.i]; if(ob)ob.classList.add("f");
      /* 자동으로 넘기지 않는다. 시험지처럼 답을 고치러 돌아갈 수 있어야 한다 */
      var sb2=document.getElementById("submit");
      if(sb2){ var un=X.q.filter(function(y){return X.ans[y.id]==null||X.ans[y.id]==="";}).length;
        sb2.textContent="제출하기"+(un?" ("+un+"개 빈칸)":""); }
    };
  });
  var pv=document.getElementById("prev"); if(pv)pv.onclick=function(){save1();X.i--;vExamRun();};
  var nx=document.getElementById("next"); if(nx)nx.onclick=function(){save1();X.i++;vExamRun();};
  var sb=document.getElementById("submit"); if(sb)sb.onclick=function(){save1();gradeExam();};
  Array.prototype.forEach.call(view.querySelectorAll("#omr .ob"),function(b){
    b.onclick=function(){save1();X.i=+b.dataset.j;vExamRun();};
  });

    si.addEventListener("input",function(){

        sb2.textContent="제출하기"+(un?" ("+un+"개 빈칸)":"");}
    });
    si.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();save1();
      if(X.i<X.q.length-1){X.i++;vExamRun();}else gradeExam();}});
  }

/* ── 채점 ── */
function gradeExam(){
  e2init();
  var ok=0,byType={};
  X.q.forEach(function(q){
    var a=X.ans[q.id],good;
    if(q.type==="short")good=a!=null&&shortOk(a,q.c);
    else good=a===q.a;
    if(good)ok++; else wAdd("EXAM","e",q.id,q.type==="short"?null:a);
    if(good)wClear("EXAM","e",q.id);
    var t=byType[q.type]||(byType[q.type]={n:0,ok:0});
    t.n++; if(good)t.ok++;
    S.exam.typeN[q.type]=(S.exam.typeN[q.type]||0)+1;
    if(good)S.exam.typeOk[q.type]=(S.exam.typeOk[q.type]||0)+1;
  });
  var score=Math.round(ok/X.q.length*100);
  X.score=score; X.ok=ok; X.byType=byType;
  X.best=score>S.exam.best;
  if(X.best)S.exam.best=score;
  S.exam.runs++; markDay(); save();
  go("examResult",null,true);
}
function weakType(){
  e2init();
  var worst=null,wr=2;
  Object.keys(S.exam.typeN).forEach(function(t){
    if(S.exam.typeN[t]<3)return;
    var r=(S.exam.typeOk[t]||0)/S.exam.typeN[t];
    if(r<wr){wr=r;worst=t;}
  });
  return wr<0.8?worst:null;
}

/* ── 결과 ── */
function vExamResult(){
  titleEl.textContent="채점 결과";
  var types=Object.keys(X.byType);
  var rates=types.map(function(t){return {t:t,r:X.byType[t].ok/X.byType[t].n,n:X.byType[t].n,ok:X.byType[t].ok};});
  rates.sort(function(a,b){return a.r-b.r||b.n-a.n;});
  var cand=rates.filter(function(x){return x.n>=2;});   /* 한 문항만 틀린 걸 약점이라 하진 않는다 */
  var weakest=(cand.length&&cand[0].r<0.7&&rates.length>1)?cand[0].t:null;
  var wrongs=X.q.filter(function(q){
    var a=X.ans[q.id];
    return q.type==="short"?!(a!=null&&shortOk(a,q.c)):a!==q.a;
  });
  view.innerHTML=
    '<div class="done-hero">'+
      (X.best?'<div class="stamp show">'+stampSVG(70)+'</div>':'')+
      '<div class="big">'+X.score+'<span style="font-size:26px">점</span></div>'+
      '<div class="sub">'+X.q.length+'문항 중 '+X.ok+'개 정답'+
        (X.best?' · <b style="color:var(--jade)">최고 점수 경신!</b>':' · 최고 '+S.exam.best+'점')+'</div></div>'+
    '<div class="part">유형별 정답률</div>'+
    '<div class="tchart">'+rates.slice().sort(function(a,b){return b.r-a.r;}).map(function(x){
      var pct=Math.round(x.r*100);
      return '<div class="trow">'+
        '<span class="tn">'+TYPE_NAME[x.t].replace("<","&lt;").replace(">","&gt;")+
          (x.t===weakest?'<em class="wk">약점</em>':'')+'</span>'+
        '<span class="tbar"><i style="width:'+pct+'%"></i></span>'+
        '<span class="tv">'+x.ok+'/'+x.n+'</span></div>';
    }).join("")+'</div>'+
    (weakest?'<p class="note" style="margin-top:10px"><b style="color:var(--tx)">'+
      TYPE_NAME[weakest].replace("<","&lt;").replace(">","&gt;")+'</b> 유형이 제일 약해. 이 유형만 골라 다시 풀어 보면 빨리 오를 거야.</p>':'')+
    (wrongs.length
      ? '<div class="part">틀린 문항 '+wrongs.length+'개 · 오답 노트에 담았어</div>'+
        wrongs.map(function(q){
          var a=X.ans[q.id];
          return '<div class="wcard"><div class="wq">'+qh(q.q)+'</div>'+bokiBox(q.boki)+
            (q.type==="short"
              ? (a?'<div class="wline no">내 답 · '+esc(a)+'</div>':'<div class="wline no">답을 쓰지 않았어</div>')+
                '<div class="wline ok">정답 · '+esc(q.c[0])+'</div>'
              : (a!=null?'<div class="wline no">내 답 · '+esc(q.c[a])+'</div>':'<div class="wline no">고르지 않았어</div>')+
                '<div class="wline ok">정답 · '+"①②③④⑤".charAt(q.a)+' '+esc(q.c[q.a])+'</div>')+
            '<div class="wex">'+esc(q.e)+'</div></div>';
        }).join("")
      : '<div class="part">완벽</div><p class="note">전부 맞혔어. 이 범위는 확실히 잡았다고 봐도 돼.</p>')+
    '<div class="sticky"><div class="row">'+
      '<button class="cta ghost" id="hm">홈으로</button>'+
      '<button class="cta" id="again">다시 보기</button></div></div>';
  document.getElementById("hm").onclick=function(){X=null;stack=[{n:"home"}];render();};
  document.getElementById("again").onclick=function(){X=null;go("exam",null,true);};
}
