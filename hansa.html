{id:"x9a",u:"s9",type:"mc5",q:"다음 자료를 활동 지침으로 삼은 단체로 옳은 것은?\n\n우리는 '외교', '준비' 등의 미몽을 버리고 민중 직접 혁명의 수단을 취함을 선언하노라.",c:["의열단", "한인 애국단", "신간회", "대한 광복회", "조선 의용대"],a:0,e:"신채호의 「조선 혁명 선언」(1923)은 의열단의 활동 지침이다."},
{id:"x9b",u:"s9",type:"boki",q:"한인 애국단에 대한 설명으로 옳은 것을 <보기>에서 고른 것은?",boki:["김구가 임시 정부의 침체를 극복하려고 조직하였다.", "이봉창이 도쿄에서 일왕의 마차에 폭탄을 던졌다.", "김원봉이 만주 지린에서 조직하였다.", "「조선 혁명 선언」을 활동 지침으로 삼았다."],c:["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"],a:0,e:"ㄷ·ㄹ은 의열단에 대한 설명이다."},
{id:"x9c",u:"s9",type:"mc5",q:"윤봉길 의거의 결과로 옳은 것은?",c:["중국 국민당 정부가 한국 독립운동을 적극 지원하게 되었다.", "일제가 헌병 경찰제를 실시하였다.", "국민 대표 회의가 열렸다.", "신간회가 해소되었다.", "의열단이 조직되었다."],a:0,e:"한중 공동 항일 전선 구축에도 큰 영향을 주었다."},
{id:"x9d",u:"s9",type:"neg",q:"의열단에 대한 설명으로 옳지 않은 것은?",c:["김원봉 등이 만주 지린에서 조직하였다.", "김상옥이 종로 경찰서에 폭탄을 던졌다.", "나석주가 동양 척식 주식회사에 폭탄을 던졌다.", "단원들이 황푸 군관 학교에서 군사 훈련을 받았다.", "윤봉길이 상하이 훙커우 공원에서 의거를 일으켰다."],a:4,e:"윤봉길은 한인 애국단원이다."},
{id:"x9e",u:"s9",type:"short",q:"1932년 한인 애국단의 첫 거사로 도쿄에서 일왕의 마차에 폭탄을 던진 인물은?",c:["이봉창"],a:null,e:"이를 구실로 일제는 상하이를 침략하였다(상하이 사변)."},
{id:"x10a",u:"s10",type:"mc5",q:"다음 구호를 내세운 운동으로 옳은 것은?\n\n내 살림 내 것으로 · 조선 사람 조선 것",c:["물산 장려 운동", "민립 대학 설립 운동", "브나로드 운동", "형평 운동", "자치 운동"],a:0,e:"조만식의 주도로 평양에서 시작되었다."},
{id:"x10b",u:"s10",type:"neg",q:"실력 양성 운동에 대한 설명으로 옳지 않은 것은?",c:["물산 장려 운동은 토산품 애용과 근검저축을 주장하였다.", "민립 대학 설립 운동은 조선 민립 대학 기성회가 이끌었다.", "『조선일보』는 문자 보급 운동을 전개하였다.", "『동아일보』는 브나로드 운동을 전개하였다.", "민립 대학 설립 운동은 일제의 지원으로 대학 설립에 성공하였다."],a:4,e:"자연재해와 일제의 탄압으로 성과를 거두지 못하였다."},
{id:"x10c",u:"s10",type:"mc5",q:"다음 주장이 담긴 운동으로 옳은 것은?\n\n조선 내에서는 허용되는 범위 내에서 일대 정치적 결사를 조직해야 한다.",c:["자치 운동", "물산 장려 운동", "6·10 만세 운동", "신간회 창립", "민족 유일당 운동"],a:0,e:"이광수의 「민족적 경륜」(1924). 일제의 지배를 인정한 타협적 운동이다."},
{id:"x10d",u:"s10",type:"short",q:"러시아어로 '민중 속으로'라는 뜻으로, 1931년부터 『동아일보』가 전개한 농촌 계몽 운동은?",c:["브나로드 운동", "브나로드"],a:null,e:"학생과 청년이 농촌에서 글을 가르치고 미신 타파·근검절약을 강조하였다."},
{id:"x11a",u:"s11",type:"mc5",q:"다음 자료의 쟁의로 옳은 것은?\n\n지주 문재철 씨는 소작인회의 요구인 4할을 승낙하는 동시에 이천 원을 소작인회에 기부하기로 되었더라.",c:["암태도 소작 쟁의", "원산 총파업", "형평 운동", "6·10 만세 운동", "물산 장려 운동"],a:0,e:"1년여의 투쟁 끝에 소작료 인하를 이끌어 낸 대표적 소작 쟁의이다."},
{id:"x11b",u:"s11",type:"mc5",q:"원산 총파업에 대한 설명으로 옳은 것은?",c:["일본인 감독의 한국인 노동자 구타가 계기가 되었다.", "순종의 장례일에 일어났다.", "나주역의 한·일 학생 충돌이 계기가 되었다.", "백정에 대한 차별 철폐를 주장하였다.", "1년여의 투쟁 끝에 소작료 인하를 이끌어 냈다."],a:0,e:"4개월여 이어진 일제 강점기 최대 규모의 노동 운동이다."},
{id:"x11c",u:"s11",type:"boki",q:"1930년대 농민·노동 운동에 대한 설명으로 옳은 것을 <보기>에서 고른 것은?",boki:["혁명적 농민 조합과 혁명적 노동조합을 결성하였다.", "비합법적인 폭력 투쟁의 형태로 바뀌었다.", "일제와 타협하여 자치권을 얻으려 하였다.", "중일 전쟁 이후 더욱 활발해졌다."],c:["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"],a:0,e:"중일 전쟁 이후에는 일제의 강력한 탄압으로 위축되었다."},
{id:"x12a",u:"s12",type:"mc5",q:"다음 격문이 뿌려진 운동으로 옳은 것은?\n\n대한 독립 만세! 대한 독립운동가여 단결하라! 일체의 납세를 거부하자!",c:["6·10 만세 운동", "광주 학생 항일 운동", "3·1 운동", "원산 총파업", "물산 장려 운동"],a:0,e:"순종의 장례일(1926)에 일어났다."},
{id:"x12b",u:"s12",type:"mc5",q:"광주 학생 항일 운동에 대한 설명으로 옳은 것은?",c:["신간회가 진상 조사단을 파견하였다.", "순종의 장례일에 일어났다.", "민족 대표 33인이 독립 선언서를 발표하였다.", "조만식이 평양에서 주도하였다.", "고종의 서거가 계기가 되었다."],a:0,e:"3·1 운동 이후 최대 규모의 항일 민족 운동이다(1929)."},
{id:"x12c",u:"s12",type:"neg",q:"6·10 만세 운동에 대한 설명으로 옳지 않은 것은?",c:["순종의 장례일에 일어났다.", "사회주의 계열과 천도교가 준비하였다.", "준비 과정이 사전에 발각되었다.", "민족 협동 전선의 공감대 형성에 영향을 주었다.", "전국으로 확산되어 3·1 운동보다 큰 규모가 되었다."],a:4,e:"전국적 시위로 확대되지는 못하였다."},
{id:"x13a",u:"s13",type:"mc5",q:"다음 강령을 내건 단체로 옳은 것은?\n\n• 우리는 정치적·경제적 각성을 촉진함.\n• 우리는 단결을 공고히 함.\n• 우리는 기회주의를 일체 부인함.",c:["신간회", "근우회", "의열단", "조선 형평사", "한인 애국단"],a:0,e:"'기회주의'는 자치 운동 같은 타협론을 가리킨다."},
{id:"x13b",u:"s13",type:"boki",q:"신간회에 대한 설명으로 옳은 것을 <보기>에서 고른 것은?",boki:["비타협적 민족주의자와 사회주의자가 함께 창립하였다.", "광주 학생 항일 운동의 진상 조사단을 파견하였다.", "비밀 결사로 조직되어 105인 사건으로 해체되었다.", "자치 운동을 적극 지지하였다."],c:["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"],a:0,e:"ㄷ은 신민회. 신간회는 합법 단체이고 자치 운동을 배격했다."},
{id:"x13c",u:"s13",type:"order",q:"다음 사건을 일어난 순서대로 바르게 나열한 것은?\n(가) 신간회 창립  (나) 정우회 선언  (다) 신간회 해소  (라) 제1차 국공 합작",c:["(라)-(나)-(가)-(다)", "(나)-(라)-(가)-(다)", "(라)-(가)-(나)-(다)", "(가)-(나)-(라)-(다)", "(나)-(가)-(라)-(다)"],a:0,e:"국공 합작(1924) → 정우회 선언(1926) → 신간회(1927) → 해소(1931)."},
{id:"x13d",u:"s13",type:"short",q:"사회주의 진영이 민족주의 진영과 손잡자고 밝힌 1926년의 선언은?",c:["정우회 선언", "정우회선언"],a:null,e:"이듬해 신간회 창립으로 이어졌다."},

{id:"w6",u:"s3",q:"산미 증식 계획이 한국 농민의 삶에 끼친 영향을 서술하시오.",
 keys:["쌀 부족","반출","식량 사정","수리 조합비","소작농","이주"],
 model:"일본은 공업화로 도시 인구가 늘면서 쌀이 부족해지자 한국에서 산미 증식 계획을 실시해 부족한 쌀을 보충하려 하였다. 쌀 생산량은 늘었으나 목표에는 미치지 못하였는데도 일본으로의 반출은 예정대로 진행되어 한국의 식량 사정은 악화되었다. 비료 대금과 수리 조합비 등 증산 비용까지 농민에게 전가되어, 많은 자작농이 소작농이나 화전민·토막민으로 몰락하고 만주·연해주·일본 등지로 이주하기도 하였다.",
 tip:"「늘었는데도 못 먹었다」가 이 문제의 핵심이다."},

{id:"w7",u:"s4",q:"일제가 민족 말살 정책을 편 목적과 구체적인 내용을 서술하시오.",
 keys:["중일 전쟁","내선일체","일선동조론","황국 신민 서사","신사 참배","일본식","조선어"],
 model:"중일 전쟁 이후 한국인을 전쟁에 동원하려면 민족의식을 지워야 했기 때문이다. 일제는 내선일체와 일선동조론을 내세워 일본과 조선이 하나이며 뿌리가 같다고 선전하였다. 황국 신민 서사를 외우게 하고 신사 참배와 궁성 요배를 강요하였으며, 성과 이름도 일본식으로 바꾸도록 강요하였다. 학교에서는 조선어 과목을 사실상 없애고 일본어만 쓰게 하였다.",
 tip:"목적(전쟁 동원)을 먼저 밝히고 수단을 나열해야 완성된 답이 된다."},
{id:"w8",u:"s4",q:"국가 총동원법 제정 이후 인적·물적 자원이 어떻게 동원되었는지 서술하시오.",
 keys:["국가 총동원법","지원병","징병","징용","여자 정신 근로령","위안부","공출"],
 model:"일제는 1938년 국가 총동원법을 만들어 한국의 사람과 물자를 마음대로 동원하였다. 지원병제로 시작해 학도 지원병제와 징병제로 이어져 청년들을 전쟁터로 내몰았고, 국민 징용령으로 광산과 군수 공장에 끌고 갔다. 여자 정신 근로령으로 여성까지 동원하였으며, 많은 여성이 일본군 '위안부'로 끌려가 참혹한 피해를 입었다. 물자는 미곡과 금속을 공출하고 식량은 배급제로 통제하였다.",
 tip:"사람(인적)과 물자(물적)를 나누어 쓰면 빠뜨리지 않는다."},

{id:"w9",u:"s5",q:"1910년대 국내에서 활동한 독립 의군부와 대한 광복회를 비교하여 서술하시오.",
 keys:["독립 의군부","임병찬","복벽주의","대한 광복회","박상진","공화주의"],
 model:"독립 의군부는 임병찬이 고종의 밀지를 받아 조직한 단체로, 옛 왕정을 되돌리려는 복벽주의를 지향하며 국권 반환 요구서를 보내려 하였다. 대한 광복회는 박상진을 중심으로 군대식으로 조직된 비밀 결사로, 공화주의를 지향하며 군자금을 모으고 친일파를 처단하였으며 만주에 독립군 기지를 세우려 하였다.",
 tip:"두 단체의 차이는 결국 「어떤 나라를 세울 것인가」다."},
{id:"w10",u:"s5",q:"1910년대 국외에 세워진 독립운동 기지를 지역별로 서술하시오.",
 keys:["서간도","신흥 강습소","북간도","명동 학교","연해주","신한촌","권업회"],
 model:"서간도 삼원보에서는 경학사를 조직하고 신흥 강습소를 세워 독립군을 길렀으며, 이는 뒤에 신흥 무관 학교로 발전하였다. 북간도에서는 서전서숙과 명동 학교가 세워지고 간민회가 동포 사회를 이끌었으며, 대종교 인사들은 중광단을 조직하였다. 연해주 블라디보스토크에는 신한촌이 형성되고 권업회가 조직되었다. 상하이에서는 신규식 등이 동제사를 조직하였다.",
 tip:"지역 → 단체 → 학교 순으로 한 덩어리씩 쓰면 외우기도 쉽다."},

{id:"w11",u:"s6",q:"3·1 운동이 어떻게 전개되었는지 단계별로 서술하시오.",
 keys:["민족 대표","태화관","탑골 공원","도시","농촌","무력","제암리"],
 model:"민족 대표 33인은 태화관에서 독립 선언식을 하고 스스로 잡혀갔으며, 탑골 공원에서는 학생과 시민이 독립 선언서를 낭독하고 만세 시위를 벌였다. 처음에는 서울 등 도시에서 학생·상인·노동자가 주도하였고, 이어 철도와 장터를 따라 농촌으로 퍼져 장날을 이용한 시위가 잇따랐다. 일제가 무자비하게 진압하자 일부 지역에서는 경찰 관서와 헌병대를 습격하는 무력 투쟁으로 발전하였으며, 화성 제암리에서는 일본군의 학살이 벌어졌다.",
 tip:"도시 → 농촌 → 무력화, 이 세 칸이 채점 기준이다."},
{id:"w12",u:"s6",q:"3·1 운동이 국내와 국외에 끼친 영향을 나누어 서술하시오.",
 keys:["대한민국 임시 정부","문화 통치","주체","5·4 운동","반제국주의"],
 model:"국내에서는 독립운동을 이끌 구심점이 필요하다는 것을 깨달아 대한민국 임시 정부 수립으로 이어졌고, 일제는 무단 통치를 이른바 문화 통치로 바꾸었다. 또 학생·농민·노동자·여성 등으로 민족 운동의 주체가 크게 넓어졌다. 국외에서는 중국의 5·4 운동 등에 영향을 주어 반제국주의 민족 운동으로 평가받는다.",
 tip:"국내 셋(임정·문화 통치·주체 확대), 국외 하나(5·4 운동)로 나눠 담는다."},

{id:"w13",u:"s7",q:"여러 곳에 세워진 임시 정부가 하나로 통합된 과정과 그 성격을 서술하시오.",
 keys:["대한 국민 의회","상하이","한성 정부","통합","삼권 분립","민주 공화제"],
 model:"3·1 운동 뒤 연해주에 대한 국민 의회, 상하이에 임시 정부, 국내에 한성 정부가 각각 세워졌다. 1919년 9월 한성 정부의 법통을 잇되 외교 활동에 유리한 상하이에 자리를 두기로 하여 대한민국 임시 정부로 통합되었다. 임시 의정원·국무원·법원의 삼권 분립에 바탕을 둔 우리 역사 최초의 민주 공화제 정부였다.",
 tip:"「법통은 한성, 위치는 상하이」 한 줄이면 통합 과정이 설명된다."},
{id:"w14",u:"s7",q:"대한민국 임시 정부의 활동을 쓰고, 국민 대표 회의가 열리게 된 배경을 서술하시오.",
 keys:["연통제","교통국","독립 공채","구미 위원부","독립신문","국민 대표 회의","창조파","개조파"],
 model:"임시 정부는 국내와 연결하기 위해 비밀 행정망인 연통제와 통신 기관인 교통국을 두었고, 독립 공채를 발행하여 자금을 모았다. 미국에 구미 위원부를 두어 외교 활동을 폈으며 독립신문을 펴내 소식을 알렸다. 그러나 연통제와 교통국이 일제에 발각되고 외교 활동도 뚜렷한 성과를 내지 못하면서 노선을 둘러싼 갈등이 커졌고, 1923년 국민 대표 회의가 열려 새 정부를 세우자는 창조파와 임시 정부를 고쳐 쓰자는 개조파가 맞섰다.",
 tip:"활동을 먼저 쭉 쓰고 「그러나」로 꺾어 배경을 잇는다."},

{id:"w15",u:"s8",q:"봉오동 전투와 청산리 대첩의 전개 과정을 서술하시오.",
 keys:["홍범도","대한 독립군","봉오동","훈춘 사건","김좌진","북로 군정서","청산리"],
 model:"1920년 홍범도가 이끄는 대한 독립군 등 연합 부대가 봉오동에서 일본군을 크게 무찔렀다. 일제는 훈춘 사건을 조작하여 대규모 병력을 만주에 투입하였고, 이에 맞서 김좌진의 북로 군정서와 홍범도 부대 등 연합 부대가 청산리 일대의 백운평·어랑촌 등지에서 여러 날 동안 싸워 큰 승리를 거두었다.",
 tip:"봉오동 → 훈춘 사건(구실) → 청산리, 가운데 고리를 빠뜨리지 않는다."},
{id:"w16",u:"s8",q:"간도 참변과 자유시 참변 이후 만주의 독립군이 어떻게 재정비되었는지 서술하시오.",
 keys:["간도 참변","자유시 참변","참의부","정의부","신민부","미쓰야 협정","3부 통합"],
 model:"청산리 대첩에 대한 보복으로 일제가 간도 참변을 일으켜 한인 동포를 학살하였다. 독립군은 러시아 자유시로 이동하였으나 지휘권을 둘러싼 다툼 끝에 자유시 참변으로 큰 피해를 입었다. 만주로 돌아온 독립군은 참의부·정의부·신민부의 3부로 정비되어 군사 활동과 함께 동포 사회를 다스리는 자치 기능까지 맡았다. 일제가 만주 군벌과 미쓰야 협정을 맺어 활동이 어려워지자 3부 통합 운동이 일어났다.",
 tip:"참변 둘 → 3부 → 미쓰야 협정 → 통합 운동, 사슬로 외운다."},
{id:"w17",u:"s8",q:"1930년대 만주에서 한중 연합 작전이 이루어진 배경과 그 활동을 서술하시오.",
 keys:["만주 사변","만주국","조선 혁명군","양세봉","영릉가","한국 독립군","지청천","쌍성보","대전자령"],
 model:"1931년 일제가 만주를 침략하고 이듬해 만주국을 세우자 중국 내에서 일본에 대한 반감이 높아졌다. 이에 만주의 독립군은 항일 중국군과 연합하여 무장 투쟁을 전개하였다. 남만주에서는 양세봉이 이끄는 조선 혁명군이 영릉가 전투 등에서 일본군을 격퇴하였고, 북만주에서는 지청천이 이끄는 한국 독립군이 쌍성보 전투와 대전자령 전투에서 승리하였다. 이후 일본군의 공세로 항일 중국군의 활동이 위축되면서 무장 투쟁도 큰 제약을 받았다.",
 tip:"남만주는 조선 혁명군·양세봉, 북만주는 한국 독립군·지청천. 짝으로 외운다."},
{id:"w18",u:"s8",q:"사회주의 계열의 만주 항일 무장 투쟁이 어떻게 전개되었는지 서술하시오.",
 keys:["중국 공산당","동북 인민 혁명군","동북 항일 연군","조국 광복회"],
 model:"중국 공산당이 만주 일대의 항일 유격대를 규합하여 동북 인민 혁명군을 편성하자 많은 한인 사회주의자도 이에 가담하였다. 동북 인민 혁명군은 이후 동북 항일 연군으로 발전하였으며, 여기에 소속된 한인 유격대원들은 민족주의자와 함께 조국 광복회를 조직하여 활동하였다.",
 tip:"인민 혁명군 → 항일 연군 → 조국 광복회. 이름이 바뀌는 순서가 곧 답이다."},
/* ── 교과서 34~63쪽 ── */
{id:"w19",u:"s9",q:"의열단과 한인 애국단의 활동을 비교하여 서술하시오.",
 keys:["김원봉", "조선 혁명 선언", "김구", "임시 정부", "윤봉길", "중국 국민당"],
 model:"의열단은 1919년 김원봉 등이 만주 지린에서 조직하여 신채호의 「조선 혁명 선언」을 활동 지침으로 삼았고, 김익상·김상옥·나석주 등이 조선 총독부·종로 경찰서·동양 척식 주식회사에 폭탄을 던졌다. 한인 애국단은 1931년 김구가 침체된 임시 정부에 활기를 불어넣으려고 조직하였으며, 이봉창이 도쿄에서 일왕의 마차에, 윤봉길이 상하이 훙커우 공원에서 폭탄을 던졌다. 윤봉길 의거는 중국 국민당 정부가 한국 독립운동을 적극 지원하는 계기가 되었다.",
 tip:"조직한 사람과 곳 → 대표 의거 → 결과 순으로 두 단체를 나란히 쓴다."},
{id:"w20",u:"s10",q:"물산 장려 운동이 일어난 배경과 전개, 한계를 서술하시오.",

function normKo(x){return String(x).toLowerCase().replace(/[\s·.,'"‘’“”()\-–—]/g,"");}
function shortOk(input,accept){
  var v=normKo(input); if(!v)return false;
  return accept.some(function(a){return normKo(a)===v;});
}

/* ── 채점 ── */
function gradeExam(){
  e2init();
  var ok=0,byType={};
  X.q.forEach(function(q){
    var a=X.ans[q.id],good;
    if(q.type==="short")good=a!=null&&shortOk(a,q.c);
    else good=a===q.a;
    if(good)ok++; else wAdd("EXAM","e",q.id,q.type==="short"?null:unmix(q,a));
    if(good)wOk("EXAM","e",q.id);
    uHit(q.u,good);
    var t=byType[q.type]||(byType[q.type]={n:0,ok:0});
    t.n++; if(good)t.ok++;
    S.exam.typeN[q.type]=(S.exam.typeN[q.type]||0)+1;
    if(good)S.exam.typeOk[q.type]=(S.exam.typeOk[q.type]||0)+1;
  });
  var score=Math.round(ok/X.q.length*100);
  X.score=score; X.ok=ok; X.byType=byType;
  X.best=score>S.exam.best;
  if(X.best)S.exam.best=score;
  S.exam.runs++; markDay(); save();
  go("examResult",null,true);
}
function weakType(){
  e2init();
  var worst=null,wr=2;
  Object.keys(S.exam.typeN).forEach(function(t){
    if(S.exam.typeN[t]<3)return;
    var r=(S.exam.typeOk[t]||0)/S.exam.typeN[t];
    if(r<wr){wr=r;worst=t;}
  });
  return wr<0.8?worst:null;
}

/* ══════════ 서술형 연습 화면 ══════════
   객관식은 고르면 끝이지만 서술형은 「무엇을 안 썼는지」를 알아야 는다.
   그래서 채점 기준(핵심어)을 그대로 보여 주고, 쓴 글에서 자동으로 찾아 표시한 뒤
   빠진 것만 눈에 띄게 남긴다 */
var W=null;
function winit(){ if(!S.essay)S.essay={}; }
function wnorm(x){ return String(x).toLowerCase().replace(/[\s·'"‘’“”()\[\]{}<>,.\-–—/]/g,""); }
/* 핵심어는 "가|나" 로 대체 표현을 적을 수 있다 */
function whit(text,key){
  var t=wnorm(text);
  return String(key).split("|").some(function(k){ return t.indexOf(wnorm(k))>=0; });
}
function wdone(x){ var r=S.essay[x.id]; return r&&r.best>=Math.ceil(x.keys.length*0.6); }

function vEssayPick(){
  titleEl.textContent="서술형 연습";

function vEssayRun(a){
  winit();
  var x=WMAP[a.id]; if(!x)return go("essay",null,true);
  if(!W||W.id!==a.id)W={id:a.id,text:"",shown:false,hit:{}};
  titleEl.textContent="서술형";
  var idx=ESSAY.indexOf(x),nx=ESSAY[idx+1];
  var h='<div class="card"><div class="eyebrow">'+esc(UMAP[x.u].n)+' · 서술형</div>'+
    '<div class="h sm">'+esc(x.q)+'</div>'+

    '<div class="wbox"><textarea id="wta" rows="7" placeholder="여기에 답을 써 보자. 비워 두고 바로 기준만 봐도 돼.">'+esc(W.text)+'</textarea></div>';
  if(!W.shown){
    h+='<div class="card hintcard"><div class="eyebrow">먼저 이렇게</div><div class="bd">'+esc(x.tip)+'</div></div>';
    h+=nextBtnW("채점 기준 보기",function(){
      var ta=document.getElementById("wta"); W.text=ta?ta.value:"";
      W.shown=true;
      x.keys.forEach(function(k){ W.hit[k]=whit(W.text,k); });
      buzz(12); vEssayRun(a);
    });
    view.innerHTML=h;
    return;
  }
  var got=x.keys.filter(function(k){return W.hit[k];}).length;
  var pass=got>=Math.ceil(x.keys.length*0.6);
  h+='<div class="card"><div class="eyebrow">채점 기준 · 넣은 것을 눌러서 켜고 끄자</div>'+
     '<div class="wkeys" id="wk">'+x.keys.map(function(k,i){
       return '<button class="wkey'+(W.hit[k]?" on":"")+'" data-i="'+i+'">'+
         (W.hit[k]?IC.check+' ':'')+esc(k.split("|")[0])+'</button>';
     }).join("")+'</div>'+
     '<div class="wscore '+(pass?"ok":"no")+'" id="wsc">'+got+' / '+x.keys.length+
       '<small>'+(pass?"기준 통과. 빠진 것만 한 번 더 읽어 보자.":"조금 모자라. 모범 답안에서 빠진 말을 찾아 보자.")+'</small></div>'+
     '</div>'+
     '<div class="part">모범 답안</div>'+
     '<div class="rv"><div class="b" id="wmd" style="font-size:15px;color:var(--ink)">'+wmark(x)+'</div></div>';
  h+=nextBtnW(nx?"다음 문항":"목록으로",function(){
    W=null; if(nx)go("essayRun",{id:nx.id},true); else go("essay",null,true);
  });
  view.innerHTML=h;
  Array.prototype.forEach.call(view.querySelectorAll("#wk .wkey"),function(b){
    b.onclick=function(){
      var k=x.keys[+b.dataset.i];
      W.hit[k]=!W.hit[k];
      wsave(x);
      vEssayRun(a);
    };
  });
  wsave(x);
}
/* 모범 답안에서 핵심어를 짚어 준다 — 빠뜨린 것은 빨갛게 */
function wmark(x){
  var out=esc(x.model);
  x.keys.forEach(function(k){
    k.split("|").forEach(function(one){
      var t=esc(one);
      if(out.indexOf(t)<0)return;
      out=out.split(t).join('<em class="wk '+(W.hit[k]?"on":"off")+'">'+t+'</em>');
    });
  });
  return out;
}
function wsave(x){
  var got=x.keys.filter(function(k){return W.hit[k];}).length;
  var r=S.essay[x.id]||{best:0,tot:x.keys.length};
  r.tot=x.keys.length; r.last=got; r.at=Date.now();
  if(got>r.best)r.best=got;
  S.essay[x.id]=r; save(); markDay();
}

   p:"한용운이 <b>불교 대중화</b> 노력, 조선 불교 유신회 조직, 일제의 불교 통제에 저항.",
   b:"한용운 등이 <b>청년 승려들</b>과 조선 불교 유신회를 조직하고 <b>사찰령</b> 등 불교 통제에 저항.",
   tip:"'불교 대중화'는 프린트에만, 통제의 이름(사찰령)은 교과서에 나와.",l:"L30",k:"사찰령"},
  {pg:15,u:"s16",t:"조선어 연구회는 언제?",
   p:"3·1 운동 이후 주시경의 제자들이 중심이 되어 조직<b>(1921)</b>.",
   b:"연도 없이 '3·1 운동 이후 주시경의 제자들이 국문 연구소의 후신으로 조직'.",
   tip:"연도가 필요하면 프린트의 1921. 조선어 학회는 둘 다 1931.",l:"L30",k:"가갸날"},
  {pg:17,u:"s18",t:"충칭 임시 정부의 체제",

   b:"민족주의 계열 <b>정당이 통합한</b> 한국 독립당의 주도로 운영, 김구를 주석으로 선출해 <b>단일 지도 체제</b>.",
   tip:"'주석제'는 프린트 표현, '단일 지도 체제'는 교과서 표현. 같은 이야기야.",l:"L32",k:"주석"}

 only:[
  {pg:1,u:"s1",t:"제1차 세계 대전의 배경과 전개",
   l:"L1",k:"비스마르크",b:"나폴레옹(3세)이 몰락한 뒤 <b>비스마르크</b>가 현상 유지 · 프랑스 고립을 이끌다가, <b>빌헬름 2세</b>가 세계 정책으로 식민지 쟁탈에 나섬. <b>범게르만주의</b>(독일 · 오스트리아-헝가리) ↔ <b>범슬라브주의</b>(러시아)가 발칸반도에서 충돌. 전쟁 중 독일의 <b>무제한 잠수함 작전</b> · <b>치머만 전보 사건</b> → 미국 참전."},
  {pg:1,u:"s1",t:"민족 자결주의 · 국제 연맹의 한계",l:"L1",k:"승전국 식민지엔",
   b:"민족 자결주의는 <b>승전국의 식민지에는 적용되지 않았어</b>(일본은 승전국 → 한국은 대상 밖). 국제 연맹은 미국 등 강대국이 빠졌고 <b>군사적 제재 수단이 없었어</b>."},
  {pg:1,u:"s1",t:"반제국주의 운동 · 제2차 대전 앞부분",l:"L2",k:"체코슬로바키아",
   b:"러시아 혁명 · 민족 자결주의의 영향 → 3·1 운동, 중국의 5·4 운동, <b>인도의 반영 운동</b>. 제2차 대전 전 독일이 <b>오스트리아 · 체코슬로바키아를 병합</b>했지만, 베르사유 체제가 가혹했다고 여긴 영국 · 프랑스는 <b>관망</b>."},
  {pg:1,u:"s1",t:"일본의 국제 연맹 탈퇴",l:"L2",k:"탈퇴",
   b:"만주 사변(1931) → 만주국 수립 → <b>국제 연맹 탈퇴</b> → 루거우차오 사건으로 중일 전쟁(1937). 교과서엔 '탈퇴'가 나오지 않아."},
  {pg:2,u:"s2",t:"1910년대 경제 법령",l:"L5",k:"은행령",
   b:"회사령 말고도 어업 · 광업 등에 허가제. 프린트 확인 문제는 <b>어업령 · 광업령 · 은행령</b>을 들어 '신고제로 규정 ×(허가제)'를 묻는다. 은행령은 교과서에 없는 이름이야."},
  {pg:9,u:"s9",t:"의열단의 방식",
   b:"<b>소수 인원, 적은 비용</b>으로 암살 · 파괴 활동을 수행. 교과서는 '다섯 가지 파괴 대상과 일곱 가지 암살 대상'으로 설명해.",l:"L21",k:"소수 인원"},
  {pg:10,u:"s10",t:"민립 대학 구호",
   b:"'<b>한민족 1천만이 한 사람 1원씩</b>'.",l:"L23",k:"1천만이 한 사람"},
  {pg:14,u:"s15",t:"근우회의 다른 이름과 활동",
   b:"'<b>여성계 민족 유일당</b>', <b>국내외 지회</b>, <b>부인 강좌</b>.",l:"L28",k:"여성계"},
  {pg:15,u:"s16",t:"한용운의 불교 대중화",
   b:"한용운이 <b>불교 대중화</b>에 힘썼다는 표현.",l:"L30",k:"종교계의 민족 운동 (프린트"}

 ox:[
  [2,"s1","제1차 세계 대전은 제국주의 열강의 식민지 쟁탈전에서 비롯되었다.",1,""],
  [2,"s2","조선 총독은 일왕에 직속되어 일본 의회나 내각의 통제를 거의 받지 않았다.",1,""],
  [2,"s2","일제는 어업령, 광업령, 은행령 등의 법령을 제정하여 경제 활동을 신고제로 규정하였다.",0,"신고제가 아니라 허가제."],
  [3,"s3","일제 강점기 전 시기에 걸쳐 문관 총독은 한 번도 임명된 적이 없었다.",1,""],
  [3,"s3","3·1 운동 이후 일제는 보통학교에서 무상 교육을 실시하였다.",0,"학교 수가 모자라고 경제적 부담이 커서 한국인 취학률은 낮았어."],
  [3,"s3","산미 증식 계획으로 한국 농민은 소작료와 증산 비용까지 부담하는 이중적 수탈 구조에 놓였다.",1,""],
  [4,"s4","일본식 성명으로 바꾸기를 거부하면 식량 배급을 받을 수 없었다.",1,""],
  [4,"s4","중·일 전쟁 이후 전쟁에 필요한 식량 확보를 위해 산미 증식 계획을 더욱 확대하였다.",1,"1934년에 멈췄다가 중일 전쟁 뒤 재개했어."],
  [4,"s4","황국 신민화 정책은 한국인의 저항을 약화시켜 침략 전쟁에 효율적으로 동원하려는 것이었다.",1,""],
  [4,"s4","일제의 병참 기지화 정책으로 한국에서 소비재 생산이 촉진되었다.",0,"군수 산업 중심으로 바뀌어 소비재 산업은 위축됐어."],
  [5,"s5","1910년대에는 국민 주권에 바탕을 둔 공화주의 이념이 확산되었다.",1,""],
  [5,"s5","일제 강점 이후에도 소규모의 의병 투쟁은 계속되었다.",1,""],
  [5,"s5","무장 독립 전쟁 준비는 만주, 연해주 일대에서만 이루어졌다.",0,"미주에서도 — 하와이의 대조선 국민군단(박용만)."],
  [6,"s6","3·1 운동은 민족 대표들이 탑골 공원에서 독립 선언서를 낭독하며 시작되었다.",0,"민족 대표는 태화관, 탑골 공원은 학생 · 시민."],
  [6,"s6","농민의 시위는 일제의 무자비한 탄압에 맞서 무력적 투쟁 운동으로 발전하기도 하였다.",1,""],
  [6,"s6","3·1 운동에 놀란 일제는 '문화 정치'에서 폭압적인 무단 통치로 식민지 지배 정책을 전환하였다.",0,"거꾸로야. 무단 통치 → '문화 정치'."],
  [6,"s6","3·1 운동은 다양한 민족 운동과 사회 운동이 전개될 수 있는 토대를 마련하였다.",1,""],
  [6,"s6","3·1 운동은 중국의 5·4 운동 등 약소민족의 반제국주의 운동에 영향을 주었다.",1,""],
  [7,"s7","대한민국 임시 정부는 최초의 민주 공화제 정부로서 삼권 분립의 원칙에 따라 구성되었다.",1,""],
  [7,"s7","초기의 대한민국 임시 정부는 외교 활동에만 주력하고 무장 투쟁에는 관심이 없었다.",0,"국무원 아래 군무부를 두고 육군 주만 참의부를 편성했어."],
  [7,"s7","군자금을 조달하고 정부 문서와 명령을 전달한 임시 정부의 국내 비밀 행정 조직은 연통제이다.",1,""],
  [8,"s8","3·1 운동 이후 만주, 연해주 일대의 독립운동 기지를 중심으로 여러 독립군 부대가 조직되었다.",1,""],
  [8,"s8","대한 독립군은 봉오동 전투의 주역이다.",1,""],
  [8,"s8","중국군과 연합하여 쌍성보·대전자령 전투 등에서 승리를 거둔 지청천이 이끈 부대는 한국 독립군이다.",1,""],
  [9,"s9","의열단은 개인 폭력 투쟁을 전개하였다.",1,""],
  [9,"s9","의열단원들은 중국 국민당 정부가 운영하는 황푸 군관 학교에 들어가 정규 군사 훈련을 받았다.",1,""],
  [9,"s9","만주를 침략한 일제는 세계의 관심을 돌리기 위해 이 사건(이봉창 의거)을 보도한 중국 언론의 반일적인 태도를 구실로 만주 사변을 일으켰다.",0,"만주 사변이 아니라 상하이 사변(1932). 만주 사변(1931)은 이미 일어난 뒤였어."],
  [10,"s10","물산 장려 운동은 나라 빚을 갚자는 취지로 대구에서 시작되었다.",0,"그건 국채 보상 운동. 물산 장려 운동은 평양, 조만식."],
  [10,"s10","자치 운동의 성과로 일제는 조선 의회의 설립을 허용하였다.",0,"성과 없이 민족 분열 정책에 이용만 당했어."],
  [10,"s10","브나로드(Vnarod)는 러시아 어로 '민중 속으로'라는 의미이다.",1,""],
  [10,"s10","실력 양성 운동은 일제가 허용하는 범위 안에서 전개되었다.",1,""],
  [11,"s11","소작 쟁의가 일어나면 일제는 농민의 입장에서 문제를 해결하려고 노력하였다.",0,"일제는 지주 편에서 탄압했어."],
  [11,"s11","노동자에 대한 비인간적 대우와 민족 차별, 열악한 작업 환경도 노동 쟁의의 주요 원인이었다.",1,""],
  [11,"s11","1930년대 농민·노동 운동은 농민·노동자의 생존권 투쟁 형태로 확산되었다.",0,"생존권 투쟁은 1920년대. 1930년대는 반제국주의 항일 투쟁."],
  [12,"s12","농민·노동 운동, 청년·학생 운동은 사회주의 사상의 보급과 더불어 더욱 활발해졌다.",1,""],
  [12,"s12","광주 학생 항일 운동은 학생, 시민, 노동자가 함께 한 3·1 운동 이후 최대 규모의 항일 민족 운동이었다.",1,""],
  [12,"s13","민족 유일당 운동은 국내뿐만 아니라 국외에서도 전개되었다.",1,""],
  [12,"s13","신간회의 해소로 비타협적 민족주의 진영과 사회주의 진영의 연대가 강화되었다.",0,"해소로 연대가 무너졌어."],
  [13,"s14","식민지 공업화의 추진으로 함흥, 청진 등 북부 지방의 공업 도시가 발달하였다.",1,""],
  [13,"s14","1930년대에 전개된 농촌 진흥 운동으로 농민의 생활이 근본적으로 개선되었다.",0,"농촌 통제를 강화하고 빈곤의 책임을 농민에게 돌렸을 뿐이야."],
  [13,"s14","1920~1930년대에는 신문, 잡지, 영화 등의 매체를 통해 대중문화가 유행하였다.",1,""],
  [14,"s15","일제 강점기 여성에게는 남존여비(男尊女卑)의 가부장적 인습이 거의 사라졌다.",0,"가부장적 인습이 남았고 일제가 차별을 법으로 규정했어."],
  [14,"s15","1930년대 일제는 소년 운동을 민족 운동으로 간주하여 탄압하였다.",1,""],
  [14,"s15","갑오개혁 이후에도 백정에 대한 사회적 차별은 여전히 남아 있었다.",1,""],
  [15,"s16","일제는 한국 강점과 식민 통치를 합리화하기 위해 식민 사관을 날조하였다.",1,""],
  [15,"s16","사회 경제 사학은 민족정신을 확립하여 독립운동의 정신적 토대를 마련하였다.",0,"민족정신은 민족주의 사학(박은식 · 신채호)."],
  [15,"s16","정인보는 조선학 운동을 펼쳤으며, 특히 조선 후기 실학 연구에 주력하여 성과를 거두었다.",1,""],
  [15,"s16","천도교는 청년·여성·소년 운동에도 앞장섰으며, 『개벽』, 『신여성』 등의 잡지를 발간하였다.",1,""],
  [16,"s17","독립운동 세력을 통합하려는 노력 속에서 김구 등이 민족 혁명당을 결성하였다.",0,"민족 혁명당은 김원봉. 김구는 한국 국민당."],

var PRTAB="under", PROX={}, PRX=false, PBO={}, PBF=false;
/* 카드 본문에 k 가 들어 있는 첫 카드. 못 찾으면 수업 첫 장 */
function prFind(lid,k){
  var l=LMAP[lid]; if(!l||!k)return 0;
  for(var i=0;i<l.cards.length;i++)if(JSON.stringify(l.cards[i]).indexOf(k)>=0)return i;
  return 0;
}
function prGo(x){ return x.l?'<button class="prgo" data-l="'+x.l+'" data-k="'+esc(x.k||"")+'">'+esc(LMAP[x.l].title)+' 수업에서 보기 '+IC.chev+'</button>':''; }
function prUnit(u){ return u&&UMAP[u]?'<span class="pru">'+esc(UMAP[u].n)+'</span>':''; }
/* 수업 카드에 붙는 표시 — 프린트에서 보충했는지, 교과서엔 아예 없는지 */
function prB(c){
  if(!c||!c.pr)return "";
  return '<span class="prtag'+(c.po?" po":"")+'">'+(c.po?"프린트에만":"프린트 보충")+' · '+c.pr+'쪽</span>';
}
function vPrint(){
  titleEl.textContent="학교 프린트 정리";
  var P=PRINT, xs=P.ox.filter(function(o){return !o[3];}).length;
  var T=[["under","밑줄"],["blank","빈칸"],["diff","차이"],["only","한쪽만"],["ox","O·X"]];
  var h='<p class="note" style="margin-bottom:12px">광문고 한국사2 학습지 17쪽(교과서 10~61쪽)을 교과서 원문과 한 줄씩 맞춰 봤어. '+
    '프린트에서 보충한 내용은 수업 끝에 <span class="prtag">프린트 보충</span> 카드로 붙여 뒀고, '+
    '교과서엔 없는 표현은 <span class="prtag po">프린트에만</span>으로 표시했어.</p>'+
    '<div class="tabs" role="tablist">'+T.map(function(t){
      return '<button class="tb" role="tab" data-t="'+t[0]+'" aria-selected="'+(PRTAB===t[0])+'">'+t[1]+'</button>';}).join("")+'</div>';
  if(PRTAB==="under"){
    h+='<p class="note" style="margin-bottom:12px">선생님이 보충 · 삭제한 곳에 밑줄을 쳤다고 한 부분이야. 프린트 전체에서 밑줄은 이 두 곳뿐이야.</p>';
    h+=P.under.map(function(x){
      return '<div class="prc und"><div class="prh"><span class="prp">프린트 '+x.pg+'쪽</span><span class="prw">'+esc(x.where)+'</span></div>'+
        '<p class="prq"><u>'+esc(x.q)+'</u></p><p class="prb">'+x.b+'</p>'+prGo(x)+'</div>';}).join("");
  }
  if(PRTAB==="diff"){
    h+='<p class="note" style="margin-bottom:12px">뜻은 같은데 말이 다르거나, 한쪽이 더 자세한 곳이야. 시험은 선생님 프린트 표현으로 나올 수 있으니 둘 다 알아 두자.</p>';
    h+=P.diff.map(function(x){
      return '<div class="prc"><div class="prh"><span class="prp">프린트 '+x.pg+'쪽</span>'+prUnit(x.u)+'</div>'+
        '<div class="prt">'+esc(x.t)+'</div>'+
        '<div class="prv"><div><b>프린트</b><p>'+x.p+'</p></div><div><b>교과서</b><p>'+x.b+'</p></div></div>'+
        '<p class="prtip">'+esc(x.tip)+'</p>'+prGo(x)+'</div>';}).join("");
  }
  if(PRTAB==="only"){
    h+='<div class="part" style="margin-top:0">프린트에만 있는 것</div>'+
      '<p class="note" style="margin:0 0 12px">교과서엔 없고 선생님이 더 넣은 내용이야. 선생님이 따로 챙긴 거라 시험에 나올 수 있어.</p>'+
      P.only.map(function(x){
        return '<div class="prc"><div class="prh"><span class="prp">프린트 '+x.pg+'쪽</span>'+prUnit(x.u)+'</div>'+
          '<div class="prt">'+esc(x.t)+'</div><p class="prb">'+x.b+'</p>'+prGo(x)+'</div>';}).join("")+
      '<div class="part">교과서에만 있는 것</div>'+
      '<p class="note" style="margin:0 0 12px">프린트엔 빠졌지만 교과서 본문에 있는 것. 수업에 이미 들어 있으니 한 번씩만 훑어 두자.</p>'+
      P.tb.map(function(x){
        return '<div class="prc sm"><div class="prh">'+prUnit(x.u)+'</div><div class="prt">'+esc(x.t)+'</div>'+prGo(x)+'</div>';}).join("");
  }
  if(PRTAB==="blank"){
    var ALLB=PBLANK.concat(PCHK);
    var mk=ALLB.filter(function(r){return S.pmark[r.id];}).length;
    var pick=function(a){return PBF?a.filter(function(r){return S.pmark[r.id];}):a;};
    var b1=pick(PBLANK), b2=pick(PCHK), bl=b1.concat(b2);
    var allOpen=bl.length&&bl.every(function(r){return PBO[r.id];});
    var nb=function(a){return a.reduce(function(n,r){return n+(r[2].match(/\{/g)||[]).length;},0);};
    h+='<p class="note" style="margin-bottom:10px">프린트 \'내용 정리\'에서 선생님이 괄호로 비워 둔 핵심어 '+nb(PBLANK)+'개와 '+
      '\'확인 문제\'의 고르기 · 빈칸 '+PCHK.length+'문항이야. '+
      '먼저 속으로 채워 본 다음 문장을 눌러 확인해. 못 떠올렸으면 「헷갈림」을 눌러 두면 따로 모아 볼 수 있어.</p>'+
      '<div class="tlbar"><button class="chip'+(PBF?" on":"")+'" id="pbf">'+(PBF?"전부 보기":"헷갈림만 ("+mk+")")+'</button>'+
      '<button class="chip" id="pba">'+(allOpen?"다시 가리기":"답 다 펴기")+'</button>'+
      '<span class="cnt">'+bl.length+'문장</span></div>';
    if(!bl.length)h+='<div class="empty">'+scene("book",56)+'<p>아직 「헷갈림」으로 표시한 빈칸이 없어.</p></div>';
    var row=function(r){
      var open=!!PBO[r.id], on=!!S.pmark[r.id];
      return '<div class="pbl'+(open?" open":"")+'"><button class="pbs" data-id="'+r.id+'" aria-expanded="'+open+'">'+
        esc(r[2]).replace(/\{([^}]+)\}/g,function(_,a){return '<span class="pbk">'+a+'</span>';})+'</button>'+
        '<button class="pbm'+(on?" on":"")+'" data-id="'+r.id+'" aria-pressed="'+on+'">'+(on?"헷갈림 ✓":"헷갈림")+'</button></div>';
    };
    var bp=0;
    b1.forEach(function(r){
      if(r[0]!==bp){bp=r[0];h+='<div class="part">프린트 '+bp+'쪽 · '+esc(UMAP[r[1]].n)+'</div>';}
      h+=row(r);
    });
    if(b2.length){
      h+='<div class="part">확인 문제 · 고르기와 빈칸 '+b2.length+'</div>';
      bp=0;
      b2.forEach(function(r){
        if(r[0]!==bp){bp=r[0];h+='<p class="note prpg">프린트 '+bp+'쪽 · '+esc(UMAP[r[1]].n)+'</p>';}
        h+=row(r);
      });
    }
  }
  if(PRTAB==="ox"){
    var list=PRX?P.ox.filter(function(o){return !o[3];}):P.ox;
    h+='<p class="note" style="margin-bottom:10px">프린트 확인 문제의 O·X를 그대로 옮겼어. 누르기 전에 먼저 ○인지 ×인지 정해 봐.</p>'+
      '<div class="tlbar"><button class="chip'+(PRX?" on":"")+'" id="prx">'+(PRX?"전부 보기":"× 문제만 ("+xs+")")+'</button>'+
      '<button class="chip" id="pra">'+(list.every(function(o){return PROX[P.ox.indexOf(o)];})?"다시 가리기":"답 다 펴기")+'</button>'+
      '<span class="cnt">'+list.length+'문항</span></div>';
    var pg=0;
    list.forEach(function(o){
      var i=P.ox.indexOf(o), open=!!PROX[i];
      if(o[0]!==pg){pg=o[0];h+='<div class="part">프린트 '+pg+'쪽 · '+esc(UMAP[o[1]].n)+'</div>';}
      h+='<button class="prox'+(open?(o[3]?" o":" x"):"")+'" data-i="'+i+'">'+
        '<span class="pa">'+(open?(o[3]?"○":"×"):"?")+'</span>'+
        '<span class="ps">'+esc(o[2])+(open&&o[4]?'<small>'+esc(o[4])+'</small>':'')+'</span></button>';
    });
  }
  view.innerHTML=h;
  Array.prototype.forEach.call(view.querySelectorAll(".tb"),function(b){
    b.onclick=function(){ if(PRTAB===b.dataset.t)return; PRTAB=b.dataset.t; render(); };});
  Array.prototype.forEach.call(view.querySelectorAll(".prgo"),function(b){
    b.onclick=function(){ jumpCard(b.dataset.l,prFind(b.dataset.l,b.dataset.k)); };});
  Array.prototype.forEach.call(view.querySelectorAll(".prox"),function(b){
    b.onclick=function(){ var i=+b.dataset.i; PROX[i]=!PROX[i]; buzz(10); vPrint(); };});
  Array.prototype.forEach.call(view.querySelectorAll(".pbs"),function(b){
    b.onclick=function(){ PBO[b.dataset.id]=!PBO[b.dataset.id]; buzz(10); vPrint(); };});
  Array.prototype.forEach.call(view.querySelectorAll(".pbm"),function(b){
    b.onclick=function(){ var id=b.dataset.id; if(S.pmark[id])delete S.pmark[id]; else S.pmark[id]=1; save(); vPrint(); };});
  var pf=view.querySelector("#pbf");
  if(pf)pf.onclick=function(){PBF=!PBF;vPrint();};
  var pba=view.querySelector("#pba");
  if(pba)pba.onclick=function(){
    var bl=PBLANK.concat(PCHK); if(PBF)bl=bl.filter(function(r){return S.pmark[r.id];});
    var all=bl.every(function(r){return PBO[r.id];});
    bl.forEach(function(r){PBO[r.id]=!all;}); vPrint();};
  var px=view.querySelector("#prx");
  if(px)px.onclick=function(){PRX=!PRX;vPrint();};
  var pa=view.querySelector("#pra");
  if(pa)pa.onclick=function(){
    var list=PRX?PRINT.ox.filter(function(o){return !o[3];}):PRINT.ox;
    var all=list.every(function(o){return PROX[PRINT.ox.indexOf(o)];});

    var b=nBox(x.id); return {k:x.id+"|"+(Math.random()<0.5?"c":"n"),w:(b===0?0:b<0?1:b+1)+Math.random()};
  }).sort(function(a,b){return a.w-b.w;}).slice(0,20);
  if(ids)shuffleArr(list);
  S.nrun={q:list.map(function(o){return o.k;}),miss:{},ok1:0,ok2:0,n:list.length,wr:[]};
  save();
}
var NR=null;   /* 지금 화면에 떠 있는 카드(섞은 보기) */
function vNames(){
  titleEl.textContent="인물·단체 카드";
  if(!S.nopt)S.nopt={r:"all",k:"mix"};
  var o=S.nopt, pool=nPool(), kn=nKnown(), run=S.nrun&&S.nrun.q.length?S.nrun:null;
  var wn=Object.keys(S.wrong).filter(function(k){return S.wrong[k].kind==="n";}).length;
  var chip=function(id,v,cur,t){return '<button class="chip'+(cur===v?" on":"")+'" data-'+id+'="'+v+'">'+t+'</button>';};
  var h='<div class="card ncard"><div class="eyebrow">인물 '+NAMES.filter(function(x){return x.k==="인물";}).length+
      ' · 단체 '+NAMES.filter(function(x){return x.k==="단체";}).length+'</div>'+
    '<div class="h">외운 것 '+kn+' / '+NAMES.length+'</div>'+
    '<div style="display:flex;align-items:center;gap:12px;margin:10px 0 4px"><span class="track"><i style="width:'+(kn/NAMES.length*100)+'%"></i></span></div>'+
    '<p class="note" style="margin-top:8px">단서를 보고 이름을, 이름을 보고 한 일을 골라. 맞히면 바로 다음 카드, '+
    '틀리면 몇 장 뒤에 <b>다시 나오고</b> 오답 노트에도 남아. 처음에 한 번에 맞힌 게 쌓이면(세 번) 「외운 것」이 돼.</p></div>';
  if(run)h+='<button class="cta" id="nres" style="margin-top:14px">'+IC.play+' 이어서 풀기 (남은 '+run.q.length+'장)</button>';
  h+='<div class="part">범위</div><div class="chips">'+
      chip("r","all",o.r,"전체")+chip("r","a",o.r,"8~33쪽")+chip("r","b",o.r,"34~63쪽")+'</div>'+
    '<div class="part">종류</div><div class="chips">'+
      chip("k","mix",o.k,"섞기")+chip("k","인물",o.k,"인물만")+chip("k","단체",o.k,"단체만")+'</div>'+
    '<p class="note" style="margin:10px 0 0">이 범위 '+pool.length+'개 가운데 약한 것부터 20장을 뽑아.'+
      (wn?' 오답 노트에 인물·단체 카드 '+wn+'장이 있어.':'')+'</p>'+
    '<button class="cta'+(run?" ghost":"")+'" id="nnew" style="margin-top:12px">'+(run?"새 판 20장":IC.play+" 20장 시작")+'</button>';
  view.innerHTML=h;
  Array.prototype.forEach.call(view.querySelectorAll("[data-r]"),function(b){b.onclick=function(){S.nopt.r=b.dataset.r;save();vNames();};});
  Array.prototype.forEach.call(view.querySelectorAll("[data-k]"),function(b){b.onclick=function(){S.nopt.k=b.dataset.k;save();vNames();};});
  var nr=view.querySelector("#nres"); if(nr)nr.onclick=function(){NR=null;go("nrun");};
  view.querySelector("#nnew").onclick=function(){ if(!pool.length)return; nDeal(); NR=null; go("nrun"); };
}
function vNRun(){
  titleEl.textContent="인물·단체 카드";
  var R=S.nrun;
  if(!R){ go("names",null,true); return; }
  if(!R.q.length)return nEnd();
  var key=R.q[0];
  if(!NR||NR.key!==key){
    var b=nOpts(key); if(!b){R.q.shift();save();return vNRun();}
    NR={key:key,b:b,m:mixQ({q:b.q,c:b.c,a:0,e:b.e}),done:false};
  }
  var x=NR.b.x, m=NR.m, again=R.miss[key]>0, left=R.q.length, tot=R.n;
  var fin=tot-new Set(R.q).size;
  var h='<div style="display:flex;align-items:center;gap:12px;padding:2px 0 16px">'+
      '<span class="track"><i style="width:'+(fin/tot*100)+'%"></i></span>'+
      '<span class="step">남은 '+left+'장</span></div>'+
    '<div class="card ncard"><div class="eyebrow">'+x.k+' · '+esc(UMAP[x.u].n)+(again?' · <span class="nagain">다시 나온 카드</span>':'')+'</div>'+
    (NR.b.dir==="n"
      ? '<div class="nname">'+esc(x.n)+'</div><div class="h sm">맞는 설명은?</div>'
      : '<div class="h sm">'+(x.k==="인물"?"누구일까?":"어느 단체일까?")+'</div>'+
        '<ul class="nclue">'+x.cl.map(function(c){return '<li>'+c+'</li>';}).join("")+'</ul>')+
    '<div class="nkeep">'+kBtn("N:"+x.id)+'</div>'+
    '</div><div style="margin-top:12px" id="opts">'+m.c.map(function(c,i){
      return '<button class="qopt" data-i="'+i+'"><span class="kx">'+"ABCD".charAt(i)+'</span><span>'+stripTags(c)+'</span></button>';
    }).join("")+'</div>'+
    '<button class="nskip" id="nskip">모르겠어 · 넘기기</button><div id="fb"></div>';
  view.innerHTML=h;
  /* 넘기기 = 틀린 것과 똑같이 처리한다(정답을 보여 주고, 3~5장 뒤에 다시, 오답 노트에도) */
  view.querySelector("#nskip").onclick=function(){ answer(null); };
  Array.prototype.forEach.call(view.querySelectorAll("#opts .qopt"),function(bt){
    bt.onclick=function(){ answer(bt); };
  });
  function answer(bt){
      if(NR.done)return; NR.done=true;
      var skip=!bt, mine=skip?null:+bt.dataset.i, ok=!skip&&mine===m.a;
      var sk=view.querySelector("#nskip"); if(sk)sk.remove();
      Array.prototype.forEach.call(view.querySelectorAll("#opts .qopt"),function(e,i){
        e.disabled=true; if(i===m.a)e.classList.add("ok"); else if(e===bt)e.classList.add("no"); else e.classList.add("dim");});
      buzz(ok?14:[20,40,20]); markDay();
      var first=!R.miss[key];
      uHit(x.u,ok);
      if(ok){
        R.q.shift();
        if(first){ R.ok1++; S.nbox[x.id]=Math.min(5,Math.max(0,nBox(x.id))+1); wOk("NAME","n",key); }
        else R.ok2++;
        R.cmb=(R.cmb||0)+1; pop(R.cmb>=3&&R.cmb%3===0?R.cmb+"연속!":(first?"좋아!":"이번엔 맞혔어!"));
        save();
        var tok=NR;
        setTimeout(function(){ if(NR===tok&&stack[stack.length-1].n==="nrun"){NR=null;vNRun();} },800);
        document.getElementById("fb").innerHTML='<div class="fb ok"><span class="m">○</span><span>'+esc(x.e)+'</span></div>';
        return;
      }
      R.cmb=0; R.miss[key]=(R.miss[key]||0)+1; if(R.wr.indexOf(key)<0)R.wr.push(key);
      if(skip)R.sk=(R.sk||0)+1;
      S.nbox[x.id]=0; wAdd("NAME","n",key,skip?null:unmix(m,mine));
      /* 틀린 카드는 3~5장 뒤에 다시 — 남은 게 적으면 맨 끝 */
      R.q.shift(); R.q.splice(Math.min(R.q.length,3+Math.floor(Math.random()*3)),0,key);
      save();
      document.getElementById("fb").innerHTML='<div class="fb no"><span class="m">'+(skip?"→":"×")+'</span><span>'+
        (skip?'<small class="nskd">넘겼어 · 조금 뒤에 다시 나와</small><br>':'')+'<b>'+
        esc(stripTags(m.c[m.a]))+'</b><br>'+esc(x.e)+
        (LMAP[x.l]?'<br><button class="prgo" id="nles">'+esc(LMAP[x.l].title)+' 수업에서 보기 '+IC.chev+'</button>':'')+'</span></div>';
      var nl=view.querySelector("#nles");
      if(nl)nl.onclick=function(){ NR=null; jumpCard(x.l,prFind(x.l,x.n)); };
      view.insertAdjacentHTML("beforeend",nextBtnW("다음",function(){NR=null;vNRun();}));
  }
}
function nEnd(){
  var R=S.nrun;
  var h='<div class="done-hero"><div class="scene">'+scene("book",64)+'</div>'+
    '<div class="big">'+R.ok1+' / '+R.n+'</div>'+
    '<div class="sub">한 번에 맞힌 카드'+(R.ok2?' · 다시 나와서 맞힌 카드 '+R.ok2+'장':'')+(R.sk?' · 넘긴 횟수 '+R.sk:'')+'</div></div>';
  if(R.wr.length)h+='<div class="part">이번 판에서 틀렸거나 넘긴 것</div>'+R.wr.map(function(k){
      var x=NMAP[k.split("|")[0]]; if(!x)return "";
      return '<div class="wcard"><div class="wq"><b>'+esc(x.n)+'</b> <small class="nk">'+x.k+'</small></div><div class="wex">'+esc(x.e)+'</div></div>';}).join("");
  h+='<p class="note" style="margin:12px 0 0">외운 것 '+nKnown()+' / '+NAMES.length+
    (R.wr.length?' · 틀렸던 카드는 오답 노트에도 들어갔어.':'')+'</p>'+
    '<div class="sticky"><div class="row">'+
    (R.wr.length?'<button class="cta ghost" id="nagain2">틀린 것만 한 판 더</button>':'<button class="cta ghost" id="nhome">처음으로</button>')+
    '<button class="cta" id="nnext">새 판 20장</button></div></div>';
  view.innerHTML=h;
  var wr=R.wr.slice();
  var a=view.querySelector("#nagain2"); if(a)a.onclick=function(){nDeal(wr);NR=null;vNRun();};
  var hm=view.querySelector("#nhome"); if(hm)hm.onclick=function(){S.nrun=null;save();go("names",null,true);};
  view.querySelector("#nnext").onclick=function(){nDeal();NR=null;vNRun();};
}

/* ── 킵: 헷갈리는 걸 찍어 두고 한곳에서 모아 본다 ──
   수업 카드는 "L21#3", 인물·단체 카드는 "N:n_kimgu" 로 S.keep 에 남는다.
   프린트 빈칸의 「헷갈림」(S.pmark)도 같은 목록에 함께 보여 준다 */
var KPTAB="all", KPO={};
function kOn(k){return !!S.keep[k];}
function kToggle(k){ if(S.keep[k])delete S.keep[k]; else S.keep[k]=Date.now(); save(); }
function kBtn(k){var on=kOn(k);
  return '<button class="kbtn'+(on?" on":"")+'" data-k="'+esc(k)+'" aria-pressed="'+on+'">'+(on?"★ 킵함":"☆ 킵")+'</button>';}
/* 수업 카드 한 장을 머리말 + 본문으로 줄인다(찾기 색인과 같은 규칙) */
function kCardText(c){
  if(c.t==="fact")return {h:c.n+" · "+yLab(c),b:c.b+'<p class="kso">→ '+c.so+'</p>'};
  if(c.t==="hint")return {h:c.k,b:c.b};
  if(c.t==="chain")return {h:c.title,b:c.items.join("<br>")};
  if(c.t==="compare")return {h:c.title,b:'<b>'+c.l.n+'</b> — '+c.l.p.join(" · ")+'<br><b>'+c.r.n+'</b> — '+c.r.p.join(" · ")};
  if(c.t==="story")return {h:c.h,b:c.b};
  if(c.t==="check")return {h:c.q,b:esc(c.a)};
  if(c.t==="pick")return {h:c.q,b:'<b>'+esc(c.c[c.a])+'</b> — '+esc(c.e)};
  return {h:"",b:""};
}
function kList(){
  var out=[];
  LESSONS.forEach(function(l){ l.cards.forEach(function(c,i){ var k=l.id+"#"+i;
    if(S.keep[k]){ var t=kCardText(c); out.push({g:"card",k:k,lid:l.id,ci:i,sub:l.title,h:t.h,b:t.b}); } }); });
  NAMES.forEach(function(x){ var k="N:"+x.id;
    if(S.keep[k])out.push({g:"name",k:k,sub:x.k+" · "+UMAP[x.u].n,h:x.n,
      b:'<ul class="nclue">'+x.cl.map(function(c){return "<li>"+c+"</li>";}).join("")+'</ul><p class="kso">→ '+esc(x.e)+'</p>',x:x}); });
  FLOWS.forEach(function(f){ var k="O:"+f.id;
    if(S.keep[k])out.push({g:"flow",k:k,fid:f.id,sub:"흐름 · "+UMAP[f.u].n,h:f.t,
      b:'<ol class="kfl">'+f.s.map(function(x){return '<li><b>'+esc(x.n)+'</b> <small>'+esc(x.y)+'</small><br>'+esc(x.w)+'</li>';}).join("")+'</ol>'}); });
  PBLANK.concat(PCHK).forEach(function(r){ if(S.pmark[r.id])out.push({g:"blank",k:r.id,sub:"프린트 "+r[0]+"쪽 · "+UMAP[r[1]].n,r:r}); });
  return out;
}
function kCount(){return kList().length;}
function vKeep(){
  titleEl.textContent="킵한 것";
  var all=kList(), n={card:0,name:0,flow:0,blank:0};
  all.forEach(function(x){n[x.g]++;});
  var list=KPTAB==="all"?all:all.filter(function(x){return x.g===KPTAB;});
  var hide=S.kpHide==null?true:!!S.kpHide;

  var h='<p class="note" style="margin-bottom:12px">수업 카드와 인물·단체 카드에서 <b>☆ 킵</b>을 누른 것(흐름 맞추기 결과 포함), 프린트 빈칸에서 '+
      '<b>헷갈림</b>을 누른 것이 여기 모여. 풀어도 저절로 빠지지 않아. 다 외웠으면 <b>지우기</b>를 눌러.</p>'+
    '<div class="chips" style="margin-bottom:10px">'+T.map(function(t){

    '<div class="tlbar"><button class="chip'+(hide?" on":"")+'" id="kph">'+(hide?"가리고 보기":"다 펴 놓기")+'</button>'+

  if(!list.length)h+='<div class="empty">'+scene("book",56)+'<p>'+(all.length?"이 칸엔 아직 없어.":
      "아직 킵한 게 없어.<br>수업을 보다가 헷갈리는 카드가 나오면 위쪽의 <b>☆ 킵</b>을 눌러 봐.")+'</p></div>';

      var r=x.r, bo=!!PBO[r.id];

        '</div><div class="delrow"><button class="delbtn" data-kd="'+esc(x.k)+'" data-kg="blank">지우기</button></div></div>';
      return;
    }
    h+='<div class="kitem"><div class="kt">'+esc(x.sub)+'</div>'+
      '<div class="kh">'+(x.g==="card"?x.h:esc(x.h))+'</div>'+
      (open?'<div class="kb">'+x.b+'</div>':'<button class="peekbtn" data-kk="'+esc(x.k)+'"><span>속으로 떠올린 다음 눌러 봐</span></button>')+
      (x.g==="flow"?'<button class="prgo" data-of="'+x.fid+'">이 흐름 다시 맞추기 '+IC.chev+'</button>':
       x.g==="card"?'<button class="prgo" data-l="'+x.lid+'" data-ci="'+x.ci+'">수업에서 보기 '+IC.chev+'</button>':
        (LMAP[x.x.l]?'<button class="prgo" data-l="'+x.x.l+'" data-nk="'+esc(x.x.n)+'">'+esc(LMAP[x.x.l].title)+' 수업에서 보기 '+IC.chev+'</button>':''))+
      '<div class="delrow"><button class="delbtn" data-kd="'+esc(x.k)+'" data-kg="'+x.g+'">지우기</button></div></div>';

  view.innerHTML=h;
  Array.prototype.forEach.call(view.querySelectorAll("[data-kt]"),function(b){b.onclick=function(){KPTAB=b.dataset.kt;vKeep();};});
  view.querySelector("#kph").onclick=function(){S.kpHide=!hide;KPO={};save();vKeep();};
  Array.prototype.forEach.call(view.querySelectorAll("[data-kk]"),function(b){b.onclick=function(){KPO[b.dataset.kk]=1;buzz(10);vKeep();};});

  /* 지우기: 빈칸은 S.pmark, 나머지는 S.keep 에서 뺀다. 5초 안에 되돌릴 수 있다 */
  var kDel=function(items){
    var back=items.map(function(x){ var st=x.g==="blank"?S.pmark:S.keep; var v=st[x.k]; delete st[x.k]; return [st,x.k,v]; });
    save(); return function(){ back.forEach(function(b){b[0][b[1]]=b[2];}); save(); if(stack[stack.length-1].n==="keep"){var sy=window.scrollY;vKeep();window.scrollTo(0,sy);} };
  };
  Array.prototype.forEach.call(view.querySelectorAll(".kitem [data-kd]"),function(b){b.onclick=function(){

    undoBar("킵에서 지웠어",fn);

  if(kda)armBtn(kda,function(){ var fn=kDel(list); vKeep(); undoBar(list.length+"개를 킵에서 지웠어",fn); });
  Array.prototype.forEach.call(view.querySelectorAll(".kitem .prgo"),function(b){b.onclick=function(){
    if(b.dataset.of){ oStartFlow(b.dataset.of); return; }
    jumpCard(b.dataset.l, b.dataset.ci!=null?+b.dataset.ci:prFind(b.dataset.l,b.dataset.nk)); };});
}

function uHit(u,ok){ if(!u)return; if(!S.ust)S.ust={}; var t=S.ust[u]||(S.ust[u]={n:0,ok:0}); t.n++; if(ok)t.ok++; }
function wUnit(x){
  if(x.kind==="e"){var q=EMAP[x.idx];return q?q.u:null;}
  if(x.kind==="n"){var y=NMAP[String(x.idx).split("|")[0]];return y?y.u:null;}
  var l=LMAP[x.lid]; return l?l.u:null;
}
var WU=null, WKO=null;
function uStats(){
  var M={}; UNITS.forEach(function(u){M[u.id]={u:u,n:0,ok:0,wr:0,cf:0,ls:0,dn:0};});
  var U=function(u){return M[u];};
  Object.keys(S.ust||{}).forEach(function(u){ if(M[u]){M[u].n+=S.ust[u].n;M[u].ok+=S.ust[u].ok;} });
  LESSONS.forEach(function(l){ var m=U(l.u); if(!m)return; m.ls++; if(S.done[l.id])m.dn++;
    var q=S.quiz[l.id]; if(q&&!(S.ust&&S.ust[l.u])){ m.n+=q.n; m.ok+=q.ok; } });
  wList().forEach(function(x){ if(x.fix>0)return; var m=U(wUnit(x)); if(m)m.wr++; });
  Object.keys(S.mem).forEach(function(k){ if(S.mem[k]!==0)return; var l=LMAP[k.split("#")[0]]; if(l&&U(l.u))U(l.u).cf++; });
  PBLANK.concat(PCHK).forEach(function(r){ if(S.pmark[r.id]&&U(r[1]))U(r[1]).cf++; });
  Object.keys(S.keep).forEach(function(k){ var u=null;
    if(k.indexOf("N:")===0){var y=NMAP[k.slice(2)];u=y&&y.u;}
    else if(k.indexOf("O:")===0){var f=FMAP[k.slice(2)];u=f&&f.u;}
    else {var l=LMAP[k.split("#")[0]];u=l&&l.u;}
    if(u&&U(u))U(u).cf++; });
  var o=oS();
  Object.keys(o.fm).forEach(function(k){ if(o.fm[k]>0&&U(k.split("|")[0]))U(k.split("|")[0]).cf++; });
  Object.keys(o.sets).forEach(function(id){ var f=FMAP[id]; if(f&&o.sets[id].b===0&&U(f.u))U(f.u).cf++; });
  NAMES.forEach(function(x){ if(S.nbox[x.id]===0&&U(x.u))U(x.u).cf++; });
  return UNITS.map(function(u){ var m=M[u.id];
    m.acc=m.n>=5?m.ok/m.n:null;
    var trouble=m.wr+m.cf, none=m.n<5&&!trouble&&!m.dn;
    m.lv=none?"기록 부족":((m.acc!=null&&m.acc<0.6)||trouble>=5)?"약함":((m.acc!=null&&m.acc<0.8)||trouble>=2||m.dn<m.ls)?"보통":"좋음";
    m.score=(m.acc==null?0.35:1-m.acc)*3+m.wr*0.5+m.cf*0.4+(m.ls?(1-m.dn/m.ls)*1.5:0)-(none?5:0);
    return m; }).sort(function(a,b){return b.score-a.score;});
}
function uWhy(m){
  var t=[]; if(m.acc!=null)t.push("정답률 "+Math.round(m.acc*100)+"%");
  if(m.wr)t.push("오답 "+m.wr); if(m.cf)t.push("헷갈림 "+m.cf); if(m.ls>m.dn)t.push("안 배운 수업 "+(m.ls-m.dn));
  return t.join(" · ")||"아직 기록이 없어";
}

function sheetWrongLine(x){
  var plain=function(v){return String(v==null?"":v).replace(/<\/?(b|u|em|i|small|br)\s*\/?>/g,"");};
  if(x.kind==="n"){
    var nb=nOpts(x.idx); if(!nb)return "";
    return nb.dir==="n"?'<b>'+esc(nb.x.n)+'</b> → '+esc(stripTags(nb.c[0]))
                       :esc(nb.x.cl.map(stripTags).join(" · "))+' → <b>'+esc(nb.x.n)+'</b>';
  }
  var lines=plain(x.q).split("\n"), stem=lines[0], ans;
  if(x.type==="short") ans=x.c[0];
  else if(x.boki){
    ans=String(x.c[x.a]); var parts=ans.split(/\s*,\s*/).map(function(L){var i=BOKI.indexOf(L);return i>=0&&x.boki[i]?L+". "+x.boki[i]:L;});
    ans=ans+" ("+parts.join(" / ")+")";
  }else if(x.type==="order"){
    var seg={}, body=lines.slice(1).join(" "), m, re=/\(([가-힣])\)\s*(.+?)(?=\s*\([가-힣]\)|$)/g;
    while((m=re.exec(body)))seg[m[1]]=m[2].trim();
    ans=String(x.c[x.a]).split("-").map(function(t){var k=t.replace(/[()\s]/g,"");return seg[k]||t;}).join(" → ");
  }else ans=plain(x.c[x.a]);
  return esc(stem)+' → <b>'+esc(ans)+'</b>';
}

{id:"s2-ox10",unit:"s2",type:"ox",question:"토지 조사 사업으로 총독부가 차지한 땅은 동양 척식 주식회사나 일본인에게 넘어갔다.",choices:["O","X"],answer:0,explain:"맞다. 그것도 헐값에 넘겼다.",era:"칼을 찬 교사의 시대"},
{id:"s3-ox11",unit:"s3",type:"ox",question:"문화 정치 시기에 문관 총독이 여러 명 임명되었다.",choices:["O","X"],answer:1,explain:"관제만 고쳤을 뿐 문관 총독은 단 한 명도 임명되지 않았다. 문화 정치가 기만적이라는 대표 근거다.",era:"가면을 쓴 통치"},
{id:"s3-ox12",unit:"s3",type:"ox",question:"보통 경찰제로 바뀌면서 경찰 인원과 관서 수가 줄어들었다.",choices:["O","X"],answer:1,explain:"오히려 대폭 늘어났다. 이름만 바꾸고 감시는 더 촘촘해졌다.",era:"가면을 쓴 통치"},
{id:"s3-ox13",unit:"s3",type:"ox",question:"치안 유지법은 사유 재산 제도를 부인하는 결사를 처벌 대상으로 삼았다.",choices:["O","X"],answer:0,explain:"맞다. 그래서 사회주의자 탄압에 특히 많이 쓰였다.",era:"가면을 쓴 통치"},
{id:"s3-ox14",unit:"s3",type:"ox",question:"도 평의회와 부·면 협의회는 의결권을 가진 자치 기구였다.",choices:["O","X"],answer:1,explain:"의결권이 없는 자문 기구였다. 지방 행정 참여는 선전에 불과했다.",era:"가면을 쓴 통치"},
{id:"s3-ox15",unit:"s3",type:"ox",question:"산미 증식 계획으로 쌀 생산량은 늘었지만 한국의 식량 사정은 오히려 나빠졌다.",choices:["O","X"],answer:0,explain:"맞다. 생산은 목표에 못 미쳤는데 반출은 예정대로 진행됐기 때문이다.",era:"가면을 쓴 통치"},
{id:"s3-ox16",unit:"s3",type:"ox",question:"산미 증식 계획의 증산 비용은 총독부가 부담했다.",choices:["O","X"],answer:1,explain:"비료 대금·수리 조합비가 농민에게 전가되어 자작농이 소작농·화전민·토막민으로 몰락했다.",era:"가면을 쓴 통치"},
{id:"s3-ox17",unit:"s3",type:"ox",question:"1923년 일본 상품에 대한 관세가 대부분 폐지되면서 한국인 기업이 타격을 입었다.",choices:["O","X"],answer:0,explain:"맞다. 회사령 폐지로 한국인 기업이 늘긴 했지만 대부분 영세해서 값싼 일본 제품을 당해내지 못했다.",era:"가면을 쓴 통치"},
{id:"s4-ox18",unit:"s4",type:"ox",question:"내선일체는 일본인과 한국인이 같은 조상에서 나왔다는 주장이다.",choices:["O","X"],answer:1,explain:"그건 일선동조론이다. 내선일체는 내지(일본)와 한국이 한몸이라는 뜻이다.",era:"이름을 빼앗긴 시대"},
{id:"s4-ox19",unit:"s4",type:"ox",question:"황국 신민 서사는 매일 아침 궁성 요배와 함께 강요되었다.",choices:["O","X"],answer:0,explain:"맞다. 신사 참배까지 세트로 강요했고, 거부하면 처벌하고 학교도 폐쇄했다.",era:"이름을 빼앗긴 시대"},
{id:"s4-ox20",unit:"s4",type:"ox",question:"일제는 소학교의 명칭을 국민학교로 바꾸었다.",choices:["O","X"],answer:0,explain:"맞다. 황국 신민의 학교라는 뜻이다.",era:"이름을 빼앗긴 시대"},
{id:"s4-ox21",unit:"s4",type:"ox",question:"남면북양 정책은 남부에서 양을 기르고 북부에서 면화를 재배하게 한 것이다.",choices:["O","X"],answer:1,explain:"반대다. 남부에서 면화, 북부에서 양. 이름 순서 그대로다.",era:"이름을 빼앗긴 시대"},
{id:"s4-ox22",unit:"s4",type:"ox",question:"식민지 공업화로 세워진 중화학 공업 공장은 주로 북부 지방에 몰렸다.",choices:["O","X"],answer:0,explain:"맞다. 석탄·철 등 지하자원이 풍부해서다. 그 결과 지역 간 산업 불균형이 심해졌다.",era:"이름을 빼앗긴 시대"},
{id:"s4-ox23",unit:"s4",type:"ox",question:"국가 총동원법은 중일 전쟁을 일으킨 뒤 공포되었다.",choices:["O","X"],answer:0,explain:"맞다. 1937년 중일 전쟁 → 1938년 국가 총동원법. 이 법이 징용·징병·공출의 근거가 된다.",era:"이름을 빼앗긴 시대"},
{id:"s4-ox24",unit:"s4",type:"ox",question:"조선어 학회 사건은 치안 유지법 위반을 적용해 이루어졌다.",choices:["O","X"],answer:0,explain:"맞다. 1942년, 우리말 연구를 독립운동으로 몰아 회원들을 구속했다.",era:"이름을 빼앗긴 시대"},
{id:"s5-ox25",unit:"s5",type:"ox",question:"독립 의군부는 민주 공화제 국가 건설을 목표로 하였다.",choices:["O","X"],answer:1,explain:"독립 의군부는 복벽주의(고종 복위). 대한 광복회가 민주 공화제다. 교과서가 가장 자주 묻는 대비다.",era:"국경을 넘은 사람들"},
{id:"s5-ox26",unit:"s5",type:"ox",question:"대한 광복회는 박상진 등이 주도하였다.",choices:["O","X"],answer:0,explain:"맞다. 친일파를 처단하고 만주에 무관 학교를 세우려 했다.",era:"국경을 넘은 사람들"},
{id:"s5-ox27",unit:"s5",type:"ox",question:"경학사와 신흥 강습소는 북간도에 세워졌다.",choices:["O","X"],answer:1,explain:"서간도 삼원보다. 북간도는 간민회·명동 학교·중광단이다.",era:"국경을 넘은 사람들"},
{id:"s5-ox28",unit:"s5",type:"ox",question:"중광단은 이후 북로 군정서로 발전하였다.",choices:["O","X"],answer:0,explain:"맞다. 서일 등 대종교 간부들이 만들었고, 청산리에서 김좌진이 이끄는 그 부대가 된다.",era:"국경을 넘은 사람들"},
{id:"s5-ox29",unit:"s5",type:"ox",question:"권업회와 신한촌은 연해주에서 조직되고 건설되었다.",choices:["O","X"],answer:0,explain:"맞다. 이후 이상설·이동휘를 정·부통령으로 한 대한 광복군 정부가 세워진다.",era:"국경을 넘은 사람들"},
{id:"s5-ox30",unit:"s5",type:"ox",question:"대동단결 선언은 국민 주권론의 입장에서 발표되었다.",choices:["O","X"],answer:0,explain:"맞다. 1917년, 임시 정부 수립의 이론적 바탕이 되었다.",era:"국경을 넘은 사람들"},
{id:"s6-ox31",unit:"s6",type:"ox",question:"3·1 운동은 순종의 국장일에 즈음하여 계획되었다.",choices:["O","X"],answer:1,explain:"고종의 국장일이다. 순종의 장례일에 일어난 건 6·10 만세 운동(1926).",era:"만세의 봄"},
{id:"s6-ox32",unit:"s6",type:"ox",question:"민족 대표는 탑골 공원에서 독립 선언식을 거행하였다.",choices:["O","X"],answer:1,explain:"시위가 과격해질 것을 우려해 태화관에서 했다. 탑골 공원에서는 학생과 시민이 선언서를 낭독했다.",era:"만세의 봄"},
{id:"s6-ox33",unit:"s6",type:"ox",question:"2·8 독립 선언은 도쿄에서 유학생들이 발표하였다.",choices:["O","X"],answer:0,explain:"맞다. 조선 청년 독립단 이름으로 발표했고 3·1 운동의 직접적 계기가 되었다.",era:"만세의 봄"},
{id:"s6-ox34",unit:"s6",type:"ox",question:"3·1 운동은 처음부터 끝까지 평화적인 만세 시위로만 전개되었다.",choices:["O","X"],answer:1,explain:"헌병 경찰의 무자비한 진압에 무력 투쟁으로 발전했다. 일부 농민은 경찰 관서와 헌병대를 습격했다.",era:"만세의 봄"},
{id:"s6-ox35",unit:"s6",type:"ox",question:"3·1 운동은 중국의 5·4 운동에 영향을 주었다.",choices:["O","X"],answer:0,explain:"맞다. 대표적인 반제국주의 민족 운동으로 세계사적 의의를 갖는다.",era:"만세의 봄"},
{id:"s6-ox36",unit:"s6",type:"ox",question:"제암리 학살은 경기도 화성에서 일어났다.",choices:["O","X"],answer:0,explain:"맞다. 주민을 교회에 모아 놓고 문을 잠근 채 총을 쏘고 불을 질렀다.",era:"만세의 봄"},
{id:"s7-ox37",unit:"s7",type:"ox",question:"대한민국 임시 정부는 삼권 분립에 기초한 민주 공화제를 채택하였다.",choices:["O","X"],answer:0,explain:"맞다. 임시 의정원(입법)·국무원(행정)·법원(사법). 우리 역사상 최초다.",era:"황제의 나라에서 국민의 나라로"},
{id:"s7-ox38",unit:"s7",type:"ox",question:"임시 정부 통합 과정에서 무장 투쟁에 유리한 간도에 정부를 두기로 하였다.",choices:["O","X"],answer:1,explain:"상하이로 정했다. 조계 지역이 많아 외교 활동에 유리했기 때문이다.",era:"황제의 나라에서 국민의 나라로"},
{id:"s7-ox39",unit:"s7",type:"ox",question:"연통제는 국내에 설치된 비밀 행정 조직이었다.",choices:["O","X"],answer:0,explain:"맞다. 군자금 조달과 문서·명령 전달을 맡았다. 통신 기관은 교통국이다.",era:"황제의 나라에서 국민의 나라로"},
{id:"s7-ox40",unit:"s7",type:"ox",question:"구미 위원부는 상하이에 설치되었다.",choices:["O","X"],answer:1,explain:"미국에 설치했다. 이승만을 중심으로 외교 활동을 벌였다.",era:"황제의 나라에서 국민의 나라로"},
{id:"s7-ox41",unit:"s7",type:"ox",question:"국민 대표 회의는 개조파와 창조파의 대립으로 결렬되었다.",choices:["O","X"],answer:0,explain:"맞다. 이후 많은 독립운동가가 이탈해 임시 정부가 침체에 빠진다.",era:"황제의 나라에서 국민의 나라로"},
{id:"s7-ox42",unit:"s7",type:"ox",question:"이승만이 탄핵된 뒤 제2대 대통령이 된 인물은 박은식이다.",choices:["O","X"],answer:0,explain:"맞다. 이어서 헌법을 고쳐 국무령 중심의 집단 지도 체제로 바꾸었다.",era:"황제의 나라에서 국민의 나라로"},
{id:"s8-ox43",unit:"s8",type:"ox",question:"봉오동 전투는 김좌진이 지휘하였다.",choices:["O","X"],answer:1,explain:"봉오동은 홍범도(+안무·최진동), 청산리가 김좌진(+홍범도)이다. 봉-홍, 청-김.",era:"봉오동에서 대전자령까지"},
{id:"s8-ox44",unit:"s8",type:"ox",question:"훈춘 사건은 일제가 만주 출병의 구실을 만들려고 꾸민 자작극이다.",choices:["O","X"],answer:0,explain:"맞다. 중국 마적을 매수해 훈춘의 일본 영사관을 공격하게 했다.",era:"봉오동에서 대전자령까지"},
{id:"s8-ox45",unit:"s8",type:"ox",question:"자유시 참변은 일본군의 공격으로 독립군이 희생된 사건이다.",choices:["O","X"],answer:1,explain:"러시아 적군이 무장 해제하는 과정에서 벌어졌다. 일본군의 보복 학살은 간도 참변이다.",era:"봉오동에서 대전자령까지"},
{id:"s8-ox46",unit:"s8",type:"ox",question:"3부는 민정 조직과 군정 조직을 갖춘 사실상의 자치 정부였다.",choices:["O","X"],answer:0,explain:"맞다. 세금까지 거두어 운영했다. 참의부(남만주)·정의부(지린)·신민부(북만주).",era:"봉오동에서 대전자령까지"},
{id:"s8-ox47",unit:"s8",type:"ox",question:"미쓰야 협정은 일제가 만주 군벌과 맺은 독립군 탄압 협정이다.",choices:["O","X"],answer:0,explain:"맞다. 중국 관헌이 독립운동가를 잡아 일제에 넘기고 포상금을 받았다.",era:"봉오동에서 대전자령까지"},
{id:"s8-ox48",unit:"s8",type:"ox",question:"3부 통합 운동의 결과 완전한 통합이 이루어졌다.",choices:["O","X"],answer:1,explain:"국민부(남만주)와 혁신 의회(북만주)로 갈렸다. 각각 조선 혁명군, 한국 독립군으로 이어진다.",era:"봉오동에서 대전자령까지"},
{id:"s8-ox49",unit:"s8",type:"ox",question:"영릉가 전투와 흥경성 전투는 지청천이 이끈 한국 독립군의 전투이다.",choices:["O","X"],answer:1,explain:"그건 양세봉의 조선 혁명군이다. 지청천의 한국 독립군은 쌍성보·동경성·대전자령.",era:"봉오동에서 대전자령까지"},
{id:"s8-ox50",unit:"s8",type:"ox",question:"동북 항일 연군 소속 한인 유격대원들은 조국 광복회를 조직하였다.",choices:["O","X"],answer:0,explain:"맞다. 중국 공산당의 동북 인민 혁명군 → 동북 항일 연군 순으로 발전했다.",era:"봉오동에서 대전자령까지"},
{id:"s1-od1",unit:"s1",type:"order",question:"일어난 순서대로 놓으세요",choices:["1914|제1차 세계 대전 발발","1917|러시아 혁명","1919|파리 강화 회의","1921|워싱턴 회의"],answer:null,explain:"사라예보 사건으로 시작된 대전이 끝나고, 그 뒤처리를 위해 파리에 모였다.",era:"세계대전의 소용돌이"},
{id:"s1-od2",unit:"s1",type:"order",question:"일어난 순서대로 놓으세요",choices:["1929|대공황","1931|만주 사변","1937|중일 전쟁","1939|제2차 세계 대전","1941|아시아·태평양 전쟁"],answer:null,explain:"대공황 → 전체주의 → 침략 전쟁으로 이어지는 흐름이다.",era:"세계대전의 소용돌이"},
{id:"s2-od1",unit:"s2",type:"order",question:"일어난 순서대로 놓으세요",choices:["1910. 8.|국권 피탈","1910. 12.|회사령 공포","1912. 3.|조선 태형령","1912. 8.|토지 조사령","1918|토지 조사 사업 종결"],answer:null,explain:"강점 직후부터 무단 통치의 법령이 줄줄이 만들어졌다.",era:"칼을 찬 교사의 시대"},
{id:"s2-od2",unit:"s2",type:"order",question:"일어난 순서대로 놓으세요",choices:["1910|헌병 경찰제 실시","1912|조선 태형령 시행","1918|토지 조사 사업 종결","1919|3·1 운동"],answer:null,explain:"무단 통치가 3·1 운동을 불러왔다.",era:"칼을 찬 교사의 시대"},

{id:"s5-od1",unit:"s5",type:"order",question:"일어난 순서대로 놓으세요",choices:["1910|대한인 국민회 결성","1912|독립 의군부 조직","1914|대한 광복군 정부 수립","1915|대한 광복회 조직","1917|대동단결 선언"],answer:null,explain:"국내 비밀 결사와 국외 기지가 나란히 자라났다.",era:"국경을 넘은 사람들"},
{id:"s6-od1",unit:"s6",type:"order",question:"일어난 순서대로 놓으세요",choices:["1919. 1.|고종 서거","1919. 2. 8.|2·8 독립 선언","1919. 3. 1.|독립 선언과 만세 시위","1919. 4.|제암리 학살","1919. 9.|대한민국 임시 정부 통합"],answer:null,explain:"3·1 운동은 한 해 안에 벌어진 일이라 월까지 따져야 한다.",era:"만세의 봄"},
{id:"s7-od1",unit:"s7",type:"order",question:"일어난 순서대로 놓으세요",choices:["1919. 3.|3·1 운동","1919. 4.|상하이 임시 정부 수립","1919. 9.|임시 정부 통합","1923|국민 대표 회의","1925|이승만 탄핵, 박은식 취임"],answer:null,explain:"수립에서 통합, 그리고 위기와 개편으로 이어진다.",era:"황제의 나라에서 국민의 나라로"},

{id:"s2-src1",unit:"s2",type:"source",question:"제1조 다음 각호에 해당하는 자는 구류 또는 벌금에 처한다.\n19. 함부로 대중을 모아 관공서에 청원 또는 진정을 한 자\n32. 경찰 관서에서 특별히 지시 또는 명령한 사항을 위반한 자\n— 『조선 총독부 관보』, 1912",choices:["경찰범 처벌 규칙","치안 유지법","국가 총동원법","조선 태형령"],answer:0,explain:"무단 통치기의 경찰범 처벌 규칙. 일상까지 경찰이 통제했다.",era:"칼을 찬 교사의 시대"},
{id:"s2-src2",unit:"s2",type:"source",question:"제1조 3개월 이하의 징역 또는 구류에 처해야 하는 자는 상황에 따라 태형에 처할 수 있다.\n제13조 본령은 조선인에 한하여 적용한다.\n— 『조선 총독부 관보』 호외, 1912",choices:["조선 태형령","경찰범 처벌 규칙","회사령","토지 조사령"],answer:0,explain:"제13조가 핵심. 한국인에게만 적용한 노골적 차별 법령이다.",era:"칼을 찬 교사의 시대"},
{id:"s2-src3",unit:"s2",type:"source",question:"제4조 토지의 소유자는 조선 총독이 정하는 기간 내에 그 주소, 성명·명칭 및 소유지의 소재, 지목, 자번호, 사표, 등급, 지적, 결수를 임시 토지 조사 국장에게 신고하여야 한다.\n— 『조선 총독부 관보』, 1912",choices:["토지 조사령","회사령","방곡령","조선 태형령"],answer:0,explain:"기한 안에 신고해야 소유권을 인정받는 기한부 신고제. 놓친 땅은 총독부가 차지했다.",era:"칼을 찬 교사의 시대"},
{id:"s2-src4",unit:"s2",type:"source",question:"제1조 회사의 설립은 조선 총독의 허가를 받아야 한다.\n제5조 …조선 총독은 사업의 정지·금지, 지점의 폐쇄 또는 회사의 해산을 명령할 수 있다.\n— 『조선 총독부 관보』, 1910",choices:["회사령","토지 조사령","산미 증식 계획","국가 총동원법"],answer:0,explain:"허가제로 한국인 기업의 성장을 막았다. 1920년에 폐지되며 신고제로 바뀐다.",era:"칼을 찬 교사의 시대"},
{id:"s3-src1",unit:"s3",type:"source",question:"• 친일 인물을 물색하고, 각기 계급 및 사정에 따라 여러 친일적 단체를 만들게 한 후 편의와 원조를 제공하여 충분히 활동하게 한다.\n• 조선인 부호들과 민중을 대립하게 하고, 이들에게 일본 자본을 공급해 친일화한다.\n— 조선 총독부, 『사이토 마코토 문서』",choices:["문화 정치의 민족 분열 의도","무단 통치의 강화 방침","민족 말살 통치의 지침","전시 동원 체제의 계획"],answer:0,explain:"이른바 문화 정치의 속셈이 그대로 드러난 문서다.",era:"가면을 쓴 통치"},
{id:"s3-src2",unit:"s3",type:"source",question:"제1조 국체를 변혁하거나 사유 재산 제도를 부인할 목적으로 결사를 조직하거나 또는 그 사정을 알고 이에 가입한 자는 10년 이하의 징역 또는 금고에 처한다.\n— 『조선 총독부 관보』, 1925",choices:["치안 유지법","경찰범 처벌 규칙","조선 태형령","국가 총동원법"],answer:0,explain:"사유 재산 제도를 부인할 목적이라는 문구 때문에 사회주의자 탄압에 특히 쓰였다.",era:"가면을 쓴 통치"},
{id:"s3-src3",unit:"s3",type:"source",question:"(관제 개정의 취지는) 시세에 맞추어 시정의 편리함을 도모하는 데 있다. …… 문화적 제도의 혁신에 의하여 조선인을 이끌어서 …… 정치상·사회상의 대우에서 일본인과 동일하게 취급하려는 궁극적 목적을 달성하고자 한다.\n— 『조선 총독부 관보』, 1919. 9.",choices:["문화 정치를 표방한 시정 방침","무단 통치의 시작을 알린 훈시","황국 신민화 정책의 선언","병참 기지화 정책의 지침"],answer:0,explain:"3·1 운동 뒤 새 총독 사이토 마코토가 발표했다. 문관 총독은 끝내 한 명도 나오지 않았다.",era:"가면을 쓴 통치"},
{id:"s4-src1",unit:"s4",type:"source",question:"제1조 국가 총동원이란 전시에 국방 목적의 달성을 위해 국가의 전력을 가장 유효하게 발휘하도록 인적·물적 자원을 통제 운용하는 것을 가리킨다.\n제4조 제국 신민을 징용하여 총동원 업무에 종사하게 할 수 있다.\n— 『조선 총독부 관보』, 1938",choices:["국가 총동원법","치안 유지법","회사령","조선 태형령"],answer:0,explain:"중일 전쟁을 일으킨 뒤 공포했다. 강제 징용·징병·공출의 법적 근거가 된다.",era:"이름을 빼앗긴 시대"},
{id:"s4-src2",unit:"s4",type:"source",question:"1. 우리는 대일본 제국의 신민입니다.\n2. 우리는 마음을 합하여 천황 폐하에게 충의를 다합니다.\n3. 우리는 인고 단련하여 훌륭하고 강한 국민이 되겠습니다.\n— 조선 총독부, 『시정 30년사』",choices:["황국 신민 서사","국민학교 규정","황국 신민화 교육령","국민정신 총동원 요강"],answer:0,explain:"아동용 황국 신민 서사. 매일 외우게 하고 궁성 요배를 시켰다.",era:"이름을 빼앗긴 시대"},
{id:"s4-src3",unit:"s4",type:"source",question:"이번 사변에서 우리 조선은 상당량의 군수 물자를 공출하여 …… 일본으로부터의 해상 수송이 차단당하는 경우가 있더라도, 조선의 힘만으로 보충할 수 있도록 조선 산업 분야를 다각화하며 특히 군수 공업의 육성에 역점을 두어야 한다.\n— 『동아일보』, 1938",choices:["병참 기지화 정책","산미 증식 계획","남면북양 정책","토지 조사 사업"],answer:0,explain:"한반도를 전쟁 물자 공급 기지로 삼겠다는 조선 총독의 훈시다.",era:"이름을 빼앗긴 시대"},
{id:"s5-src1",unit:"s5",type:"source",question:"1. 일반 부호로부터 의연금을 받는 한편, 일본인이 불법 징수한 세금을 압수하여 무장을 준비한다.\n2. 남북 만주에 사관 학교를 설치하고 인재를 양성하여 사관으로 채용한다.\n7. 무력이 완비되는 대로 일본인 섬멸전을 단행하여 최후의 목적을 이룬다.",choices:["대한 광복회 강령","독립 의군부 강령","신민회 4대 강령","대한민국 건국 강령"],answer:0,explain:"박상진이 주축이 된 대한 광복회. 독립 전쟁으로 국권을 되찾자는 공화주의 노선이다.",era:"국경을 넘은 사람들"},
{id:"s5-src2",unit:"s5",type:"source",question:"융희 황제가 삼보(영토, 인민, 주권)를 포기한 경술년 8월 29일은 우리 동지가 삼보를 계승한 날이니 …… 저 황제권 소멸의 때가 즉 민권 발생의 때이고, 구한국의 마지막 날은 즉 신한국 최초의 날이니.",choices:["대동단결 선언","2·8 독립 선언","3·1 독립 선언서","대한민국 임시 헌장"],answer:0,explain:"1917년 신규식·박은식·신채호·조소앙 등이 발표한 국민 주권론. 임시 정부 수립의 밑돌이 된다.",era:"국경을 넘은 사람들"},
{id:"s5-src3",unit:"s5",type:"source",question:"8월 초에 여러 형제분이 일시에 협력하여 만주로 갈 준비를 하였다. 비밀리에 땅과 집을 파는데, 여러 집을 일시에 파니 이 얼마나 어려웠겠는가.\n— 이은숙, 『서간도 시종기』",choices:["이회영 일가의 서간도 망명","안창호의 미주 망명","김구의 상하이 망명","이상설의 연해주 망명"],answer:0,explain:"대부호였던 이회영 일가가 전 재산을 처분해 삼원보에 독립운동 기지를 세웠다.",era:"국경을 넘은 사람들"},
{id:"s6-src1",unit:"s6",type:"source",question:"3. 본 단체는 만국 평화 회의의 민족 자결주의를 우리 민족에게도 적용할 것을 청구한다.\n4. 앞의 요구가 실현되지 않을 경우, 우리 민족은 일본에 대하여 영원히 혈전을 벌일 것을 선언한다.",choices:["2·8 독립 선언","3·1 독립 선언서","대동단결 선언","대한민국 건국 강령"],answer:0,explain:"도쿄 유학생들이 조선 청년 독립단 이름으로 발표했다. 3·1 운동의 직접적 계기다.",era:"만세의 봄"},
{id:"s6-src2",unit:"s6",type:"source",question:"우리는 오늘 우리 조선이 독립국임과 조선인이 자주민임을 선언하노라. 우리는 이를 세계 모든 나라에 알려 인류가 모두 평등하다는 큰 뜻을 분명히 하고, 우리 후손이 민족 스스로 살아갈 정당한 권리를 영원히 누리게 할 것이다.",choices:["3·1 독립 선언서","2·8 독립 선언","대동단결 선언","헌의 6조"],answer:0,explain:"1919년 3월 1일. 민족 대표는 태화관에서, 학생과 시민은 탑골 공원에서 낭독했다.",era:"만세의 봄"},
{id:"s6-src3",unit:"s6",type:"source",question:"피고 한이순 등은 천안 사립 광명학교 학생으로 독립 만세 운동을 공모하고 3월 20일 학생 약 80명을 인솔하여 양대리 시장에 이르러 국기를 흔들고 조선 독립 만세를 불렀다.\n— 공주 지방 법원, 1919",choices:["3·1 운동에 참여한 학생의 판결문","6·10 만세 운동 참가자 신문 조서","광주 학생 항일 운동 재판 기록","물산 장려 운동 관련 문서"],answer:0,explain:"농촌 시위는 주로 장날에 열렸다. 최연소 수감자 한이순은 당시 13세였다.",era:"만세의 봄"},
{id:"s7-src1",unit:"s7",type:"source",question:"유구한 역사와 전통에 빛나는 우리 대한 국민은 3·1 운동으로 건립된 대한민국 임시 정부의 법통과 불의에 항거한 4·19 민주 이념을 계승하고 …….",choices:["대한민국 헌법 전문","대한민국 임시 헌장","대한민국 건국 강령","제헌 헌법 제1조"],answer:0,explain:"지금 헌법이 임시 정부의 법통을 잇는다고 못 박고 있다.",era:"황제의 나라에서 국민의 나라로"},
{id:"s7-src2",unit:"s7",type:"source",question:"3·1 운동에서 나타난 민족적 열망을 바탕으로 출범한 임시 정부는 민족의 대표 기관이다. 그러니 문제가 있다면 조직과 체제를 개선하여 독립운동 단체의 중심 역할을 하도록 만들어야 한다.",choices:["개조파의 주장","창조파의 주장","위임 통치 청원의 논리","한인 애국단의 강령"],answer:0,explain:"임시 정부를 고쳐 쓰자는 개조파. 새로 만들자는 창조파와 맞서다 회의가 결렬됐다.",era:"황제의 나라에서 국민의 나라로"},
{id:"s7-src3",unit:"s7",type:"source",question:"본 국민 대표 회의에서 실제 독립운동에 적합하도록 새로운 조직을 만들어야 한다. 국내외 여러 독립운동 기관 중에서 상하이의 임시 정부를 개조하여 그 계통을 이어갈 이유는 없다.",choices:["창조파의 주장","개조파의 주장","신채호의 조선혁명선언","대동단결 선언"],answer:0,explain:"임시 정부를 새로 만들자는 창조파. 대립 끝에 국민 대표 회의는 성과 없이 끝났다.",era:"황제의 나라에서 국민의 나라로"},
{id:"s8-src1",unit:"s8",type:"source",question:"2. 중국 관헌은 각 현에 명령하여 만주에 거주하는 한국인이 무기를 휴대하고 조선에 침입하는 것을 엄금한다. 범한 자는 이를 체포하여 일본 경찰에 인도한다.\n3. 조선인 단체를 해산하고 소유한 총기를 수색하여 이를 몰수하고 무장을 해제한다.",choices:["미쓰야 협정","가쓰라·태프트 밀약","한일 의정서","기유각서"],answer:0,explain:"1925년 조선 총독부 경무 국장 미쓰야가 만주 군벌과 맺었다. 3부 통합 운동의 배경이 된다.",era:"봉오동에서 대전자령까지"},
{id:"s8-src2",unit:"s8",type:"source",question:"6월 7일 …… 북간도에 주둔한 아군 700여 명이 …… 왕칭현 봉오동을 향하여 행군할 때 …… 군을 지휘하는 홍범도, 최진동 두 장군은 적을 공격하여 급히 사격으로 적에게 120여 명의 사상자를 내게 하였고.\n— 『독립신문』, 1920",choices:["봉오동 전투","청산리 대첩","영릉가 전투","대전자령 전투"],answer:0,explain:"홍범도의 대한 독립군, 안무의 국민회군, 최진동의 군무 도독부군이 연합했다.",era:"봉오동에서 대전자령까지"},
{id:"s8-src3",unit:"s8",type:"source",question:"교전은 아침부터 저녁까지 계속되었다. 굶주림! 그러나 이를 의식할 시간도 먹을 시간도 없었다. 마을 아낙네들이 치마폭에 밥을 싸 가지고 빗발치는 총알 사이로 산에 올라와 한 덩이 두 덩이 동지들 입에 넣어 주었다.\n— 이범석, 『우둥불』",choices:["청산리 대첩과 간도 동포의 지원","봉오동 전투의 매복 작전","자유시 참변의 혼란","영릉가 전투의 한중 연합"],answer:0,explain:"청산리 대첩은 간도 한인 사회의 뒷받침이 있었기에 가능했다.",era:"봉오동에서 대전자령까지"},
{id:"s8-src4",unit:"s8",type:"source",question:"조선 혁명군 총사령 양세봉, 참모장 김학규 등은 일부 병력을 이끌고 중국 의용군 왕동헌·양석복 등이 이끄는 부대와 합세하였다. …… 당일 오후 3시경 신빈현 서쪽의 영릉가성을 점령하였다.\n— 『광복』 제1권",choices:["영릉가 전투","대전자령 전투","쌍성보 전투","봉오동 전투"],answer:0,explain:"양세봉의 조선 혁명군이 남만주에서 벌인 한중 연합 작전이다.",era:"봉오동에서 대전자령까지"},
{id:"s8-src5",unit:"s8",type:"source",question:"대전자령의 양쪽은 우뚝 서 있어 그 절벽은 기어 올라갈 수 없는 험악한 골짜기였다. …… 지청천 장군은 우리 군 500명만 선발대로 하고 중국군 2,000명과 혼성하여 …… 일본군의 후방이 이 고개의 중간을 넘었을 때 일시에 공격하기로 하였다.\n— 지헌모, 『청천 장군의 혁명 투쟁사』",choices:["대전자령 전투","영릉가 전투","흥경성 전투","청산리 대첩"],answer:0,explain:"지청천의 한국 독립군이 북만주에서 거둔 승리. 뒤에 한국광복군 창설을 주도한다.",era:"봉오동에서 대전자령까지"},

var UMAP={};UNITS.forEach(function(u){UMAP[u.id]=u;});
var QMAP={};QUESTIONS.forEach(function(q){QMAP[q.id]=q;});
var KEY="hansa-monster-v1";
var GOAL=10;                 /* 4지선다 한 판 문제 수 */
var OX_TIME=60;              /* 스피드 OX 제한 시간(초) */
var MON_KILL=3;              /* 몬스터를 없애는 데 필요한 연속 정답 */

/* ── 저장 ── */
function today(){var d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);}
function blank(){return{monsters:{},unit:{},correct:0,total:0,streak:0,last:0,best:{ox:0},played:0};}
var S;
function load(){
  try{var r=localStorage.getItem(KEY);S=r?Object.assign(blank(),JSON.parse(r)):blank();}catch(e){S=blank();}
  if(S.last&&S.last<today()-1)S.streak=0;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function markDay(){var t=today();if(S.last!==t){S.streak=(S.last===t-1)?S.streak+1:1;S.last=t;save();}}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}

/* ── 몬스터 ── */
function monCount(){return Object.keys(S.monsters).length;}
function monHit(id,ok){
  var m=S.monsters[id];
  if(ok){ if(m){ m.hp++; if(m.hp>=MON_KILL) delete S.monsters[id]; } }
  else { if(m) m.hp=0; else S.monsters[id]={hp:0,at:Date.now()}; }
}
/* id 로 생김새를 정한다 — 같은 문제는 늘 같은 몬스터 */
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
var MON_HUE=[268,196,338,32,152,218];
function monsterSVG(id,size,mood){
  /* 해시는 부호 없는 32비트다. >> 로 자르면 윗비트가 선 값은 음수가 되어 몸통 모양(shape)이
     -1·-2 로 나와 몸 없이 눈만 그려졌다(전체의 약 3분의 1). >>> 로 자른다 */
  var h=hash(id),hue=MON_HUE[h%MON_HUE.length],eyes=1+(h>>>3)%3,shape=(h>>>6)%3,spikes=(h>>>9)%3;
  var body=["M50 8c24 0 38 17 38 39 0 24-16 45-38 45S12 71 12 47C12 25 26 8 50 8z",
            "M50 10c26 0 40 20 36 44-3 21-14 38-36 38s-33-17-36-38C10 30 24 10 50 10z",
            "M50 9c22 0 40 15 40 36 0 27-18 47-40 47S10 72 10 45C10 24 28 9 50 9z"][shape];
  var g="g"+h.toString(36),f='hsl('+hue+',42%,62%)',dk='hsl('+hue+',44%,38%)';
  var sp="";
  if(spikes===1)sp='<path d="M30 14l6-11 7 11M57 13l7-11 6 11" fill="'+dk+'"/>';
  if(spikes===2)sp='<circle cx="24" cy="20" r="6" fill="'+dk+'"/><circle cx="76" cy="20" r="6" fill="'+dk+'"/>';
  var ey="",xs=eyes===1?[50]:eyes===2?[36,64]:[32,50,68];
  var sad=mood==="weak";
  xs.forEach(function(x){
    ey+='<ellipse cx="'+x+'" cy="46" rx="'+(eyes===3?7:9)+'" ry="'+(eyes===3?9:11)+'" fill="#14101A"/>'+

/* ── 문제 뽑기: 몬스터 우선, 같은 사실은 한 판에 한 번만 ── */
function stem(id){var p=id.split("-");return p[0]+"-"+p[1];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
/* 「○○은(는) 몇 년의 일일까?」 는 내지 않는다. 정확한 연도가 아니라 전개를 보는 앱이다.
   기록에 남은 옛 몬스터가 깨지지 않게 QMAP 에서 지우지는 않고 출제만 막는다 */
function usable(q){ return !/-yr$/.test(q.id); }
function pool(type,unit){
  return QUESTIONS.filter(function(q){
    return q.type===type && usable(q) && (!unit||q.unit===unit);
  });
}
function buildRound(type,unit,n){
  var p=pool(type,unit),mine=[],rest=[],seen={},out=[];
  p.forEach(function(q){ (S.monsters[q.id]?mine:rest).push(q); });
  /* 몬스터는 우선 복습 대상이라 같은 사실이 겹쳐도 넣는다 */
  var quota=(typeof monsterQuota==="function")?monsterQuota(n):n;
  shuffle(mine).forEach(function(q){ if(out.length<Math.min(n,quota)){ out.push(q); seen[stem(q.id)]=1; } });
  /* 나머지는 한 판에 같은 사실이 두 번 나오지 않게 거른다 */
  var restS=shuffle(rest);
  restS.forEach(function(q){ var k=stem(q.id); if(out.length<n&&!seen[k]){ seen[k]=1; out.push(q); } });
  /* 그래도 모자라면 남은 것으로 채운다 */
  for(var j=0;j<restS.length&&out.length<n;j++) if(out.indexOf(restS[j])<0) out.push(restS[j]);
  return out;
}

var G=null,tickTimer=null,advTimer=null;
function stopAll(){
  if(tickTimer){clearInterval(tickTimer);tickTimer=null;}

var MODE_TITLE={ox:"스피드 O·X",mc:"4지선다",order:"연표 세우기",hunt:"몬스터 사냥",listen:"듣기 모드"};

function vPlay(a){
  if(!G||G.key!==JSON.stringify(a)){
    var q;
    if(a.mode==="ox")        q=buildRound("ox",null,60);
    else if(a.mode==="mc")   q=buildRound("mc",a.unit||null,GOAL);
    else if(a.mode==="order")q=buildRound("order",null,5);
    else if(a.mode==="listen")q=shuffle(QUESTIONS.filter(function(x){return x.type!=="order"&&usable(x);})).slice(0,40);
    else { /* hunt */
      var ids=Object.keys(S.monsters);
      q=shuffle(ids.map(function(i){return QMAP[i];}).filter(function(x){return x&&usable(x);}));
    }
    G={key:JSON.stringify(a),mode:a.mode,unit:a.unit,queue:q,i:0,score:0,combo:0,maxCombo:0,
       ok:0,log:[],left:OX_TIME,done:false,answered:false};
  }
  titleEl.textContent=MODE_TITLE[G.mode]+(G.unit?" · "+UMAP[G.unit].name:"");
  if(!G.queue.length){
    view.innerHTML='<div class="empty">'+monsterSVG("none",80,"weak")+
      '<p>지금 풀 수 있는 문제가 없어요.<br>다른 모드를 골라 보세요.</p></div>';
    return;
  }
  if(G.mode==="listen")return vListen();
  if(G.mode==="ox"&&!tickTimer)startClock();

function startClock(){

/* 남은 시간은 그대로 두고 시계만 다시 돌린다 — 앱을 갈아 끼웠다 돌아왔을 때 쓴다 */
function runClock(){
  if(tickTimer)clearInterval(tickTimer);
  tickTimer=setInterval(function(){
    /* 화면을 떠났는데 시계가 계속 돌면 남의 화면 위에 결과를 그려 버린다 */
    if(!G||stack[stack.length-1].n!=="play"){clearInterval(tickTimer);tickTimer=null;return;}
    G.left--;
    var t=document.getElementById("clock");
    if(t){t.textContent=G.left+"초";t.classList.toggle("warn",G.left<=10);}
    if(G.left<=0){clearInterval(tickTimer);tickTimer=null;finish();}
  },1000);
}

  if(G.mode==="ox")
    return '<div class="hud"><span class="timer'+(G.left<=10?' warn':'')+'" id="clock">'+G.left+'초</span>'+

      '<span style="flex:1"></span><span class="score">'+G.score+'</span></div>';

function paintQ(){
  var q=G.queue[G.i];
  G.answered=false;
  if(q.type==="order")return paintOrder(q);
  var isOX=q.type==="ox";
  view.innerHTML=hud()+
    '<div class="qcard">'+qmeta(q)+
      '<div class="qtext'+(isOX&&q.question.length<40?' big':'')+'">'+esc(q.question)+'</div></div>'+
    (isOX
      ? '<div class="ox2" id="ansBox"><button class="oxb o" data-i="0">O</button><button class="oxb x" data-i="1">X</button></div>'
      : '<div class="answers" id="ansBox">'+q.choices.map(function(c,i){
          return '<button class="ans" data-i="'+i+'"><span class="kx">'+"ABCD".charAt(i)+'</span><span>'+esc(c)+'</span></button>';
        }).join("")+'</div>')+
    '<div id="fbBox"></div><div class="grow"></div>';
  Array.prototype.forEach.call(view.querySelectorAll("#ansBox button"),function(b){
    b.onclick=function(){choose(+b.dataset.i,b);};
  });
}

function choose(idx,btn){
  if(G.answered)return; G.answered=true;
  var q=G.queue[G.i],ok=idx===q.answer;
  var box=document.getElementById("ansBox");
  Array.prototype.forEach.call(box.children,function(b,i){
    b.disabled=true;
    if(i===q.answer)b.classList.add("ok");
    else if(b===btn)b.classList.add("no");
    else b.classList.add("dim");
  });
  grade(q,ok);
  if(G.mode==="ox"){
    /* 속도 모드는 해설을 붙잡지 않는다. 복습은 결과 화면에서 */
    advTimer=setTimeout(next,ok?520:900);
  }else{
    document.getElementById("fbBox").innerHTML=
      '<div class="fb '+(ok?"ok":"no")+'"><span class="em">'+(ok?"○":"×")+'</span><span>'+esc(q.explain)+'</span></div>'+
      '<div class="sticky"><button class="btn" id="nx">'+(G.i+1>=G.queue.length?"결과 보기":"다음")+'</button></div>';
    var nx=document.getElementById("nx"); nx.onclick=next; nx.focus({preventScroll:true});
  }
}

function grade(q,ok){
  markDay();
  G.log.push({id:q.id,ok:ok});
  if(ok){
    G.ok++; G.combo++; if(G.combo>G.maxCombo)G.maxCombo=G.combo;
    if(G.mode==="ox"){
      var gain=Math.round((40+G.left*2)*(1+Math.min(G.combo,10)*0.15));
      G.score+=gain; pop("+"+gain);
    }
    buzz(18); flash("rgba(53,214,160,.28)");
  }else{
    G.combo=0; buzz([25,45,25]); flash("rgba(255,78,99,.3)");
  }
  monHit(q.id,ok);
  S.total++; if(ok)S.correct++;
  var st=S.unit[q.unit]||[0,0]; st[0]++; if(ok)st[1]++; S.unit[q.unit]=st;
  save();
}

function paintOrder(q){
  var correct=q.choices.slice();
  var cur=shuffle(correct);
  while(cur.join("|")===correct.join("|"))cur=shuffle(correct);   /* 처음부터 정답이면 다시 섞는다 */
  view.innerHTML=hud()+
    '<div class="qcard">'+qmeta(q)+'<div class="qtext">'+esc(q.question)+'</div>'+
      '<p class="note">이른 것이 위로 오게. 손잡이를 끌거나 오른쪽 화살표로 옮기세요. 연도는 채점할 때 공개돼요.</p></div>'+
    '<div class="tl" id="tl"></div><div id="fbBox"></div><div class="grow"></div>'+
    '<div class="sticky"><button class="btn" id="chk">맞춰 보기</button></div>';
  var tl=document.getElementById("tl");
  function draw(){
    tl.innerHTML=cur.map(function(c,i){
      var p=c.split("|");
      return '<div class="tlc" data-i="'+i+'"><span class="grip" data-g="'+i+'">'+ICON.grip+'</span>'+
        '<span class="ord">'+(i+1)+'</span><span class="nm">'+esc(p[1]||c)+'</span>'+
        '<span class="mv"><button data-up="'+i+'" aria-label="위로"'+(i===0?" disabled":"")+'>'+ICON.up+'</button>'+
        '<button data-dn="'+i+'" aria-label="아래로"'+(i===cur.length-1?" disabled":"")+'>'+ICON.down+'</button></span></div>';
    }).join("");
    Array.prototype.forEach.call(tl.querySelectorAll("[data-up]"),function(b){
      b.onclick=function(){var i=+b.dataset.up;swap(i,i-1);};});
    Array.prototype.forEach.call(tl.querySelectorAll("[data-dn]"),function(b){
      b.onclick=function(){var i=+b.dataset.dn;swap(i,i+1);};});
    Array.prototype.forEach.call(tl.querySelectorAll(".grip"),function(g){
      g.addEventListener("pointerdown",startDrag);});
  }
  function swap(a,b){
    if(b<0||b>=cur.length)return;
    var t=cur[a];cur[a]=cur[b];cur[b]=t;buzz(10);draw();
  }
  /* 포인터 기반 드래그 — HTML5 drag&drop 은 터치에서 동작하지 않는다 */
  var drag=null;
  function startDrag(ev){
    if(G.answered)return;
    ev.preventDefault();
    var cards=Array.prototype.slice.call(tl.children);
    var idx=+ev.currentTarget.dataset.g,el=cards[idx];
    var hs=cards.map(function(c){return c.offsetHeight;});
    var gap=8,tops=[],acc=0;
    hs.forEach(function(h){tops.push(acc);acc+=h+gap;});
    drag={idx:idx,at:idx,el:el,cards:cards,hs:hs,tops:tops,gap:gap,y0:ev.clientY};
    el.classList.add("drag");
    el.setPointerCapture(ev.pointerId);
    el.addEventListener("pointermove",moveDrag);
    el.addEventListener("pointerup",endDrag);
    el.addEventListener("pointercancel",endDrag);
  }
  function moveDrag(ev){
    if(!drag)return;
    var dy=ev.clientY-drag.y0;
    drag.el.style.transform="translateY("+dy+"px)";
    var center=drag.tops[drag.idx]+drag.hs[drag.idx]/2+dy;
    var at=0;
    for(var i=0;i<drag.tops.length;i++)
      if(center>drag.tops[i]+drag.hs[i]/2) at=Math.min(i+1,drag.tops.length-1);
    if(at!==drag.at){drag.at=at;buzz(8);layout();}
  }
  function layout(){
    var seq=[];
    for(var i=0;i<drag.cards.length;i++) if(i!==drag.idx) seq.push(i);
    seq.splice(drag.at,0,drag.idx);
    var acc=0,pos={};
    seq.forEach(function(i){pos[i]=acc;acc+=drag.hs[i]+drag.gap;});
    drag.cards.forEach(function(c,i){
      if(i===drag.idx)return;
      c.style.transform="translateY("+(pos[i]-drag.tops[i])+"px)";
    });
  }
  function endDrag(){
    if(!drag)return;
    var from=drag.idx,to=drag.at;
    drag.cards.forEach(function(c){c.style.transform="";c.classList.remove("drag");});
    drag=null;
    if(from!==to){var it=cur.splice(from,1)[0];cur.splice(to,0,it);buzz(14);}
    draw();
  }
  draw();
  document.getElementById("chk").onclick=function(){
    if(G.answered)return; G.answered=true;
    var ok=cur.join("|")===correct.join("|");
    grade(q,ok);
    tl.innerHTML=correct.map(function(c,i){
      var p=c.split("|"),right=cur[i]===c;
      return '<div class="tlc '+(right?"ok":"no")+'"><span class="yr">'+esc(p[0])+'</span>'+
        '<span class="nm">'+esc(p[1]||"")+'</span></div>';
    }).join("");
    document.getElementById("fbBox").innerHTML=
      '<div class="fb '+(ok?"ok":"no")+'"><span class="em">'+(ok?"○":"×")+'</span><span>'+
      (ok?"순서 완벽해요! ":"")+esc(q.explain)+'</span></div>';
    var s=view.querySelector(".sticky");
    s.innerHTML='<button class="btn" id="nx">'+(G.i+1>=G.queue.length?"결과 보기":"다음")+'</button>';
    document.getElementById("nx").onclick=next;
  };
}

/* ═══════════ 듣기 모드 ═══════════
   iOS 는 사용자 제스처 없이 다음 문장을 이어 읽지 못하고 화면이 꺼지면 멈춘다.
   그래서 시작 버튼을 한 번 누르면 그 세션 동안 onend 로 체인을 이어 간다.       */
var SP=window.speechSynthesis,voiceKO=null,speaking=false;
function pickVoice(){
  if(!SP)return;
  var vs=SP.getVoices()||[];
  voiceKO=vs.filter(function(v){return /^ko/i.test(v.lang);})[0]||null;
}
if(SP){pickVoice();SP.onvoiceschanged=pickVoice;}
function speakStop(){ speaking=false; try{ if(SP)SP.cancel(); }catch(e){} }
function say(text,rate,done){
  if(!SP){done&&done();return;}
  var u=new SpeechSynthesisUtterance(text);
  u.lang="ko-KR"; u.rate=rate||1; u.pitch=1;
  if(voiceKO)u.voice=voiceKO;
  u.onend=function(){ if(speaking)done&&done(); };
  u.onerror=function(){ if(speaking)done&&done(); };
  try{SP.speak(u);}catch(e){done&&done();}
}
function vListen(){
  if(!SP){
    view.innerHTML='<div class="empty">'+monsterSVG("nospeech",80,"weak")+
      '<p>이 브라우저는 음성 읽기를 지원하지 않아요.<br>다른 모드를 이용해 주세요.</p></div>'+
      '<div class="sticky"><button class="btn ghost" id="hm">홈으로</button></div>';
    document.getElementById("hm").onclick=back; return;
  }
  var q=G.queue[G.i];
  view.innerHTML=
    '<div class="hud"><span class="timer">'+(G.i+1)+' / '+G.queue.length+'</span>'+
      '<span class="track"><i style="width:'+Math.round(G.i/G.queue.length*100)+'%"></i></span></div>'+
    '<div class="listen"><div class="wave'+(speaking?" on":"")+'" id="wave">'+
      '<i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>'+
      '<p class="note" id="phase" style="text-align:center">'+
      (speaking?"읽는 중":"시작을 누르면 문제와 정답을 이어서 읽어 줘요")+'</p></div>'+
    '<div class="qcard">'+qmeta(q)+'<div class="qtext">'+esc(q.question)+'</div>'+
      '<div id="revealBox"></div></div>'+
    (voiceKO?'':'<p class="note" style="margin-top:12px">이 기기에 한국어 음성이 없어 발음이 어색할 수 있어요.</p>')+
    '<p class="note" style="margin-top:12px">화면이 꺼지면 읽기가 멈춰요. 화면 자동 잠금을 잠시 꺼 두면 편해요.</p>'+
    '<div class="grow"></div>'+
    '<div class="sticky"><div class="btnrow">'+
      '<button class="btn ghost" id="skip">건너뛰기</button>'+
      '<button class="btn" id="tog">'+(speaking?"멈춤":"시작")+'</button></div></div>';
  document.getElementById("tog").onclick=function(){
    if(speaking){ speakStop(); vListen(); } else { speaking=true; runListen(); }
  };
  document.getElementById("skip").onclick=function(){
    speakStop(); G.i=(G.i+1)%G.queue.length; vListen();
  };
}
function runListen(){
  var q=G.queue[G.i];
  vListen();
  var ansTx=q.type==="ox"?("정답은, "+(q.answer===0?"오":"엑스")):("정답은, "+q.choices[q.answer]);
  say(q.question,1,function(){
    if(!speaking)return;
    var ph=document.getElementById("phase"),rb=document.getElementById("revealBox");
    if(ph)ph.textContent="정답 공개";
    if(rb)rb.innerHTML='<div class="fb ok" style="margin-top:12px"><span class="em">○</span><span><b>'+
      esc(q.type==="ox"?(q.answer===0?"O":"X"):q.choices[q.answer])+'</b><br>'+esc(q.explain)+'</span></div>';
    setTimeout(function(){
      if(!speaking)return;
      say(ansTx+". "+q.explain,1,function(){
        if(!speaking)return;
        markDay();
        setTimeout(function(){
          if(!speaking)return;
          G.i=(G.i+1)%G.queue.length;
          runListen();
        },700);
      });
    },1600);
  });
}
