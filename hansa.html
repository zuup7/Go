/* ── SVG 초상 — 사진이 아니라 특징만 살린 도식 일러스트 ── */
function portrait(f,size){
  var t=f.t,gc=GRADE[f.g].c,h=hash(f.id),hue=(h%40)+18;
  var skin="hsl("+hue+",34%,"+(72-(h>>4)%8)+"%)",dark="hsl("+hue+",30%,44%)";
  var CLOTH=["#3C3550","#2B3448","#4A4136","#7A4A55","#6B5A3E"][t.cloth]||"#3C3550";
  var HAIR="#1B1620";
  var s='<svg viewBox="0 0 100 100" width="'+size+'" height="'+size+'" aria-hidden="true">';
  s+='<circle cx="50" cy="50" r="49" fill="'+gc+'" opacity=".12"/>';
  /* 옷 */
  if(t.cloth===3) s+='<path d="M22 100c0-16 12-24 28-24s28 8 28 24z" fill="'+CLOTH+'"/><path d="M50 78l-9 22h18z" fill="#E9E2ED"/>';
  else if(t.cloth===2) s+='<path d="M22 100c0-16 12-24 28-24s28 8 28 24z" fill="'+CLOTH+'"/><rect x="34" y="84" width="32" height="4" fill="#2A2438"/>';
  else if(t.cloth===4) s+='<path d="M22 100c0-16 12-24 28-24s28 8 28 24z" fill="'+CLOTH+'"/>';
  else s+='<path d="M22 100c0-16 12-24 28-24s28 8 28 24z" fill="'+CLOTH+'"/><path d="M50 77l-10 23 5 0 5-14 5 14 5 0z" fill="#E9E2ED"/>';
  s+='<rect x="43" y="64" width="14" height="14" rx="5" fill="'+dark+'"/>';
  /* 얼굴 */
  s+='<ellipse cx="50" cy="47" rx="21" ry="24" fill="'+skin+'"/>';
  /* 머리 */
  if(t.hair===0) s+='<path d="M29 44c0-15 9-23 21-23s21 8 21 23c0-7-9-11-21-11s-21 4-21 11z" fill="'+HAIR+'"/>';
  if(t.hair===1) s+='<path d="M29 45c-1-17 9-25 21-25s22 8 21 25c-2-9-4-13-21-13s-19 4-21 13z" fill="'+HAIR+'"/><path d="M50 20c9 0 15 5 17 12l-6 2c-2-6-6-8-11-8z" fill="#0F0C13"/>';
  if(t.hair===2) s+='<path d="M30 42c0-14 9-21 20-21s20 7 20 21c-3-6-8-9-20-9s-17 3-20 9z" fill="'+HAIR+'"/>';
  if(t.hair===3) s+='<path d="M28 48c0-18 10-27 22-27s22 9 22 27c0-9-4-14-8-16-5 3-23 4-28 0-4 3-8 7-8 16z" fill="'+HAIR+'"/><path d="M50 71c4 0 7 6 7 13s-3 12-7 12-7-5-7-12 3-13 7-13z" fill="'+HAIR+'"/>';
  if(t.hair===4) s+='<ellipse cx="50" cy="30" rx="19" ry="12" fill="'+skin+'"/>';
  /* 갓 · 군모 · 중절모 */
  if(t.hat===1) s+='<ellipse cx="50" cy="26" rx="34" ry="6" fill="#191320"/><path d="M36 26c0-10 5-16 14-16s14 6 14 16z" fill="#221A2B"/>';
  if(t.hat===2) s+='<path d="M30 30c0-11 8-17 20-17s20 6 20 17z" fill="#3A4130"/><rect x="27" y="29" width="46" height="5" rx="2.5" fill="#262B1F"/><circle cx="50" cy="22" r="3.4" fill="#D7A93F"/>';
  if(t.hat===3) s+='<ellipse cx="50" cy="27" rx="28" ry="5" fill="#241C2E"/><path d="M36 27c0-11 5-16 14-16s14 5 14 16z" fill="#2E2439"/>';
  /* 눈코입 */
  s+='<ellipse cx="42" cy="46" rx="2.6" ry="3" fill="#14101A"/><ellipse cx="58" cy="46" rx="2.6" ry="3" fill="#14101A"/>';
  s+='<path d="M37 39q5 -3 10 0M53 39q5 -3 10 0" stroke="#14101A" stroke-width="2" fill="none" stroke-linecap="round"/>';
  if(t.beard===1) s+='<path d="M42 57h16" stroke="#14101A" stroke-width="3.4" stroke-linecap="round"/>';
  if(t.beard===2) s+='<path d="M42 56h16" stroke="#14101A" stroke-width="3.2" stroke-linecap="round"/><path d="M40 60q10 16 20 0q-4 12-10 12t-10-12z" fill="#14101A"/>';
  if(t.beard!==2) s+='<path d="M45 60q5 4 10 0" stroke="#4A3540" stroke-width="2.2" fill="none" stroke-linecap="round"/>';
  if(t.glasses) s+='<circle cx="42" cy="46" r="7.5" fill="none" stroke="#2A2438" stroke-width="2.2"/><circle cx="58" cy="46" r="7.5" fill="none" stroke="#2A2438" stroke-width="2.2"/><path d="M49.5 46h1M34.5 45l-5-2M65.5 45l5-2" stroke="#2A2438" stroke-width="2.2" stroke-linecap="round"/>';
  return s+'</svg>';
}

/* ── 보스 SVG ── */
function bossSVG(era,size,hurt){
  var b=BOSSES[era],h=b.hue,f='hsl('+h+',48%,52%)',d='hsl('+h+',52%,30%)',l='hsl('+h+',56%,66%)';
  var s='<svg viewBox="0 0 120 120" width="'+size+'" height="'+size+'" aria-hidden="true">';
  s+='<defs><radialGradient id="bg'+era+'" cx="40%" cy="26%"><stop offset="0" stop-color="'+l+'"/><stop offset="1" stop-color="'+f+'"/></radialGradient></defs>';
  if(b.form===0){ /* 소용돌이 */
    s+='<circle cx="60" cy="60" r="46" fill="url(#bg'+era+')"/>';
    s+='<path d="M60 22a38 38 0 1 1-26 65 30 30 0 1 0 20-52 22 22 0 1 1 14 39" fill="none" stroke="'+d+'" stroke-width="7" stroke-linecap="round"/>';
  } else if(b.form===1){ /* 칼 */
    s+='<path d="M60 12c22 0 40 20 40 46s-18 50-40 50S20 84 20 58 38 12 60 12z" fill="url(#bg'+era+')"/>';
    s+='<path d="M44 24l32 62M76 24L44 86" stroke="'+d+'" stroke-width="8" stroke-linecap="round"/>';
  } else if(b.form===2){ /* 가면 */
    s+='<path d="M26 34h68v30c0 24-16 44-34 44S26 88 26 64z" fill="url(#bg'+era+')"/>';
    s+='<ellipse cx="45" cy="62" rx="9" ry="12" fill="#14101A"/><ellipse cx="75" cy="62" rx="9" ry="12" fill="#14101A"/>';
    s+='<path d="M42 90q18 12 36 0" stroke="'+d+'" stroke-width="6" fill="none" stroke-linecap="round"/>';
  } else { /* 그림자 */
    s+='<path d="M60 14c26 0 42 18 42 42 0 30-18 50-42 50S18 86 18 56C18 32 34 14 60 14z" fill="url(#bg'+era+')"/>';
    s+='<path d="M32 46l20 10-20 10M88 46L68 56l20 10" stroke="'+d+'" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
  }
  s+='<ellipse cx="46" cy="'+(hurt?58:54)+'" rx="7" ry="'+(hurt?4:9)+'" fill="#0F0C13"/>';
  s+='<ellipse cx="74" cy="'+(hurt?58:54)+'" rx="7" ry="'+(hurt?4:9)+'" fill="#0F0C13"/>';
  return s+'</svg>';
}

/* ── 2단계 상태 (기존 저장 구조에 필드만 더한다) ── */
function s2init(){
  if(!S.cleared)S.cleared={};        /* 격파한 시대 */
  if(!S.dex)S.dex={};                /* 모은 인물 카드 */
  if(S.pt==null)S.pt=0;              /* 카드 뽑기용 학습 포인트 */
  if(!S.items)S.items={fifty:1,time:1,revive:1};
  if(!S.mission||S.mission.day!==today())S.mission={day:today(),p:{},done:{}};
  if(!S.stamp)S.stamp=[];            /* 출석 도장 */
  if(S.dday==null)S.dday="";
  var t=today();
  if(S.stamp.indexOf(t)<0&&S.last===t)S.stamp.push(t);
  if(S.stamp.length>60)S.stamp=S.stamp.slice(-60);
}
function ddayLeft(){
  if(!S.dday)return null;
  var d=new Date(S.dday+"T00:00:00");
  if(isNaN(d))return null;
  return Math.round(Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)-today());
}
/* 시험이 가까울수록 몬스터 비중을 올린다. D-day 를 안 넣으면 기존 그대로 전부 우선 */
function monsterQuota(n){
  var L=ddayLeft();
  if(L==null)return n;
  var r=L<=6?1:L<=13?0.8:L<=29?0.6:0.4;
  return Math.max(1,Math.ceil(n*r));
}

/* ── 오늘의 미션: 날짜로 3개 고정 ── */
function todayMissions(){
  var t=today(),out=[],used={};
  for(var i=0;i<3;i++){
    var k=(hash("m"+t+i)+i*7)%MISSIONS.length,gu=0;
    while(used[k]&&gu++<MISSIONS.length)k=(k+1)%MISSIONS.length;
    used[k]=1;out.push(MISSIONS[k]);
  }
  return out;
}
function missionBump(k,v){
  var m=S.mission.p;m[k]=(m[k]||0)+(v||1);
  todayMissions().forEach(function(ms){
    if(!S.mission.done[ms.id]&&(m[ms.k]||0)>=ms.goal){
      S.mission.done[ms.id]=1; grantItem(); toast("미션 완료 · "+ms.n);
    }
  });
}
function missionMax(k,v){ var m=S.mission.p; if((m[k]||0)<v){m[k]=v;missionBump(k,0);} }

/* ── 아이템 · 카드 보상 (정답으로만 얻는다) ── */
function grantItem(which){
  var keys=Object.keys(ITEMS),k=which||keys[Math.floor(Math.random()*keys.length)];
  S.items[k]=(S.items[k]||0)+1; save();
  toast(ITEMS[k].ic+" "+ITEMS[k].n+" 획득");
  return k;
}
function drawCard(){
  var own=S.dex,pool=FIGURES.filter(function(f){return !own[f.id];});
  if(!pool.length)return null;
  var bag=[];
  pool.forEach(function(f){ for(var i=0;i<GRADE[f.g].p;i++)bag.push(f); });
  var f=bag[Math.floor(Math.random()*bag.length)];
  S.dex[f.id]=Date.now(); save();
  return f;
}
function addPoint(){
  S.pt++;
  if(S.pt%10!==0)return;
  var f=drawCard(); if(!f)return;
  if(G&&G.mode==="ox"){                       /* 타이머가 도는 중엔 결과 화면에서 보여 준다 */
    (G.pending=G.pending||[]).push(f);

  } else cardModal(f);
}

/* ── 키워드 입력형 (서술형 대비) ── */
function norm(s){return String(s).toLowerCase().replace(/[\s·.,'"‘’“”()·\-–—]/g,"");}
function kwMatch(input,spec){
  var v=norm(input); if(!v)return false;
  return spec.split("|").some(function(alt){
    var a=norm(alt); return a.length>0&&(v===a||v.indexOf(a)>=0||a.indexOf(v)>=0&&v.length>=Math.min(3,a.length));
  });
}
function paintKeyword(q){
  view.innerHTML=hud()+
    '<div class="qcard">'+qmeta(q)+'<div class="qtext">'+esc(q.question)+'</div>'+
      '<p class="note">띄어쓰기는 신경 쓰지 않아도 돼요. 순서도 상관없어요.</p></div>'+
    '<div class="kws" id="kws">'+q.choices.map(function(_,i){
      return '<label class="kw"><span class="kn">'+(i+1)+'</span>'+
        '<input type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" '+
        'placeholder="키워드 '+(i+1)+'" data-k="'+i+'"></label>';
    }).join("")+'</div><div id="fbBox"></div><div class="grow"></div>'+
    '<div class="sticky"><button class="btn" id="kchk">제출</button></div>';
  var ins=Array.prototype.slice.call(view.querySelectorAll("#kws input"));
  ins.forEach(function(inp,i){
    inp.addEventListener("keydown",function(e){
      if(e.key==="Enter"){ e.preventDefault(); if(i<ins.length-1)ins[i+1].focus(); else document.getElementById("kchk").click(); }
    });
  });
  document.getElementById("kchk").onclick=function(){
    if(G.answered)return;
    var vals=ins.map(function(x){return x.value;});
    var used={},hit=q.choices.map(function(spec,si){
      for(var i=0;i<vals.length;i++){ if(used[i])continue; if(kwMatch(vals[i],spec)){used[i]=1;return true;} }
      return false;
    });
    var ok=hit.every(Boolean);
    G.answered=true;
    ins.forEach(function(x){x.disabled=true;});
    view.querySelectorAll(".kw").forEach&&Array.prototype.forEach.call(view.querySelectorAll(".kw"),function(l,i){
      l.classList.add(hit[i]?"ok":"no");
    });
    grade(q,ok);
    document.getElementById("fbBox").innerHTML=
      '<div class="fb '+(ok?"ok":"no")+'"><span class="em">'+(ok?"○":"×")+'</span><span>'+
      '<b>정답 키워드</b> · '+q.choices.map(function(s){return esc(s.split("|")[0]);}).join(" / ")+
      '<br>'+esc(q.explain)+'</span></div>';
    var s=view.querySelector(".sticky");
    s.innerHTML='<button class="btn" id="nx">'+(G.mode==="story"?"계속":(G.i+1>=G.queue.length?"결과 보기":"다음"))+'</button>';
    document.getElementById("nx").onclick=next;
  };
  ins[0].focus({preventScroll:true});
}

  var q=G.queue[G.i];

    var wrong=[];q.choices.forEach(function(_,i){if(i!==q.answer)wrong.push(i);});

    G.revive=true; toast("✦ 부활 준비 — 다음에 틀려도 없던 일이 돼요");

}

  /* 부활: 틀린 걸 없던 일로 되돌린다 */
  if(!ok&&G.revive){ G.revive=false; toast("✦ 부활 — 이번 오답은 넘어갑니다"); ok=true; G.revived=true; }
  var ms=Date.now()-(G.t0||Date.now());

function s3init(){
  /* 연도 맞히기를 그만두었으니 그때 잡힌 몬스터도 놓아 준다 */
  Object.keys(S.monsters).forEach(function(id){ if(/-yr$/.test(id))delete S.monsters[id]; });

  if(S.best.cho==null)S.best.cho=0;      /* 초성 사냥 최고 점수 */
  if(S.best.sv==null)S.best.sv=0;        /* 서바이벌 최다 문제 */
  if(!S.best.pair)S.best.pair=null;      /* 짝 맞추기 최단 기록 {t,m} */
}

/* ── 한글 초성 ── */
var CHO=["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
/* n 글자까지는 원래 글자를 보여 주고 나머지는 초성만 남긴다 */
function choMask(term,n){
  var out="",shown=0;
  for(var i=0;i<term.length;i++){
    var c=term.charAt(i),k=c.charCodeAt(0)-0xAC00;
    if(k>=0&&k<11172){
      if(shown<n){out+='<b class="got">'+c+'</b>';shown++;}
      else out+=CHO[Math.floor(k/588)];
    }else out+=c;
  }
  return out;
}
function hangulLen(s){
  var n=0;for(var i=0;i<s.length;i++){var k=s.charCodeAt(i)-0xAC00;if(k>=0&&k<11172)n++;}
  return n;
}
/* 띄어쓰기·가운뎃점·따옴표를 무시하고 견준다 */
function sameWord(a,b){
  var f=function(s){return (s||"").replace(/[\s·・‧'"’“”()（）「」『』,.\-–—~]/g,"").toLowerCase();};
  return f(a)===f(b) && f(a).length>0;
}

/* ── 초성 사냥 문제 풀 ── */
var CHO_POOL=null;
function choPool(unit){
  if(!CHO_POOL){
    CHO_POOL=[];
    QUESTIONS.forEach(function(q){
      if(q.type!=="mc"||!/-(ev|bl)$/.test(q.id))return;
      var t=q.choices[q.answer];
      /* 초성이 나오려면 한글이 있어야 하고, 너무 길면 못 맞힌다 */
      if(!t||!/[가-힣]/.test(t)||hangulLen(t)<2||t.length>16)return;
      var hint=/-bl$/.test(q.id)
        ? q.question.replace(/^\[[^\]]*\]\s*/,"").replace(/[　\s]*_+[　\s]*/," ○○○ ")
        : q.question;
      CHO_POOL.push({id:q.id,unit:q.unit,era:q.era,term:t,hint:hint});
    });
  }
  return unit?CHO_POOL.filter(function(x){return x.unit===unit;}):CHO_POOL;
}

var CHO_N=10;
function vCho(a){
  a=a||{};
  if(!G||G.key!==JSON.stringify(a)){
    var p=choPool(a.unit);
    /* 몬스터(전에 틀린 문제)를 먼저 낸다 — 다른 모드와 같은 규칙 */
    var mine=p.filter(function(x){return S.monsters[x.id];});
    var rest=p.filter(function(x){return !S.monsters[x.id];});
    G={key:JSON.stringify(a),mode:"cho",unit:a.unit,
       queue:shuffle(mine).concat(shuffle(rest)).slice(0,CHO_N),
       i:0,score:0,combo:0,maxCombo:0,ok:0,log:[],left:0,done:false,answered:false,hint:0};
  }
  if(!G.queue.length){
    view.innerHTML='<div class="empty">'+monsterSVG("none",80,"weak")+
      '<p>이 단원에는 낼 낱말이 없어요.<br>다른 단원을 골라 보세요.</p></div>';
    return;
  }
  paintCho();
}

function paintCho(){

      (G.combo>=2?'<span class="combo">'+ICON.fire+' '+G.combo+'</span>':'')+
      '<span class="score">'+G.score+'</span></div>'+
    '<div class="qcard">'+
      /* 시대 이름이 답을 그대로 품는 경우가 있다(「봉오동에서…」→ 봉오동 전투). 쪽수만 보여 준다 */
      '<div class="qmeta"><span>'+(u?u.no+" · "+u.book:"")+'</span>'+
      (S.monsters[x.id]?'<span class="mob">'+monsterSVG(x.id,19)+' 몬스터</span>':'')+'</div>'+
      '<div class="chotext" id="choT">'+choMask(x.term,0)+'</div>'+
      '<p class="chohint">'+esc(x.hint)+'</p></div>'+
    '<label class="choin" id="choBox"><span>ANS</span>'+
      '<input type="text" id="choIn" inputmode="text" autocomplete="off" autocapitalize="off" '+
      'spellcheck="false" placeholder="초성에 맞는 낱말"></label>'+
    '<div id="fbBox"></div><div class="grow"></div>'+
    '<div class="sticky"><div class="btnrow">'+
      '<button class="btn ghost" id="choHint">한 글자 열기</button>'+
      '<button class="btn" id="choOk">제출</button></div></div>';
  var inp=document.getElementById("choIn");
  inp.addEventListener("keydown",function(e){
    if(e.key==="Enter"){e.preventDefault();choSubmit();}
  });
  document.getElementById("choOk").onclick=choSubmit;

    if(G.answered)return;
    var max=hangulLen(x.term)-1;                 /* 마지막 한 글자는 남겨 둔다 */
    if(G.hint>=max){toast("더 열 글자가 없어요");return;}
    G.hint++; buzz(10);
    document.getElementById("choT").innerHTML=choMask(x.term,G.hint);
  };
  inp.focus({preventScroll:true});
}

function choSubmit(){
  if(G.answered)return;
  var x=G.queue[G.i],inp=document.getElementById("choIn");
  var ok=sameWord(inp.value,x.term);
  G.answered=true; inp.disabled=true;

  document.getElementById("choT").innerHTML=choMask(x.term,999);
  grade(QMAP[x.id],ok);
  if(ok){
    /* 힌트를 열수록 점수가 깎인다 */
    var gain=Math.max(20,100+(G.combo-1)*20-G.hint*30);
    G.score+=gain; pop("+"+gain);
  }
  document.getElementById("fbBox").innerHTML=
    '<div class="fb '+(ok?"ok":"no")+'" style="margin-top:14px"><span class="em">'+(ok?"○":"×")+'</span>'+
    '<span><b>'+esc(x.term)+'</b>'+(ok?'':' — 이 낱말이었어요')+'</span></div>';
  var s=view.querySelector(".sticky");
  s.innerHTML='<button class="btn" id="nx">'+(G.i+1>=G.queue.length?"결과 보기":"다음")+'</button>';
  document.getElementById("nx").onclick=function(){
    G.i++;
    if(G.i>=G.queue.length){ missionBump("cho"); finish(); return; }
    paintCho();
  };
  document.getElementById("nx").focus({preventScroll:true});
}

/* ═══════════ 짝 맞추기 ═══════════ */
/* 인물 ↔ 한 줄 활동. 연도를 짝짓던 자리를 인물로 바꿨다 — 날짜가 아니라 누가 뭘 했나가 남는다 */
var PAIR_POOL=null;
function pairPool(unit){
  if(!PAIR_POOL)PAIR_POOL=FIGURES.map(function(f){
    return {id:f.id,unit:f.u,t:f.n,y:f.d};
  });
  return unit?PAIR_POOL.filter(function(x){return x.unit===unit;}):PAIR_POOL;
}

var PAIR_N=5,P=null,pairTimer=null;
function runPairTimer(){
  if(pairTimer)clearInterval(pairTimer);
  pairTimer=setInterval(function(){
    if(!P||P.over||stack[stack.length-1].n!=="pair"){clearInterval(pairTimer);pairTimer=null;return;}
    P.secs=Math.round((Date.now()-P.t0)/1000);
    var t=document.getElementById("pT"); if(t)t.textContent=P.secs+"초";
  },1000);
}
function vPair(a){
  a=a||{};
  if(!P||P.key!==JSON.stringify(a)){
    var src=shuffle(pairPool(a.unit)).slice(0,PAIR_N);
    var cards=[];
    src.forEach(function(x,i){
      cards.push({p:i,k:"n",v:x.t}); cards.push({p:i,k:"y",v:x.y});
    });
    P={key:JSON.stringify(a),src:src,cards:shuffle(cards),open:[],hit:{},
       moves:0,t0:Date.now(),secs:0,over:false,lock:false};
  }
  if(P.src.length<2){
    view.innerHTML='<div class="empty"><p>짝을 지을 사건이 모자라요.<br>다른 단원을 골라 보세요.</p></div>';
    return;
  }
  runPairTimer();
  paintPair();
}

function paintPair(){
  var done=Object.keys(P.hit).length;
  view.innerHTML=
    '<div class="pbar"><span class="t" id="pT">'+P.secs+'초</span>'+
      '<span class="track"><i style="width:'+Math.round(done/P.src.length*100)+'%"></i></span>'+
      '<span class="m">'+done+' / '+P.src.length+' 짝 · '+P.moves+'번</span></div>'+
    (P.over
      /* 끝나면 짝을 연도순으로 세워 보여 준다 — 이게 이 판의 배움이다 */
      ? '<div class="qcard"><div class="qtext" style="font-size:17px">이번 판의 인물</div>'+
        '<div class="prow">'+P.src.map(function(x){
          return '<div class="pr"><span class="py">'+esc(x.t)+'</span><span class="pn">'+esc(x.y)+'</span></div>';
        }).join("")+'</div></div>'
      : '<div class="qcard"><div class="qtext" style="font-size:17px">인물과 한 일을 짝지어요</div>'+
        '<p class="note">두 장을 뒤집어 인물과 그가 한 일이 맞으면 그대로 남아요.</p></div>')+
    '<div class="pgrid" id="pg">'+P.cards.map(function(c,i){
      var up=P.hit[c.p]||P.open.indexOf(i)>=0;
      return '<button class="pcard'+(P.hit[c.p]?" hit":(up?" up":""))+'" data-i="'+i+'"'+
        (up?' disabled':'')+'>'+
        (up?'<span class="fr'+(c.k==="y"?" d":"")+'">'+esc(c.v)+'</span>'
           :'<span class="bk">?</span>')+'</button>';
    }).join("")+'</div><div class="grow"></div>'+
    (P.over
      ? '<div class="sticky"><div class="btnrow">'+
        '<button class="btn ghost" id="pHome">홈으로</button>'+
        '<button class="btn" id="pAgain">한 판 더</button></div></div>'
      : '');
  Array.prototype.forEach.call(view.querySelectorAll(".pcard"),function(b){
    b.onclick=function(){pairFlip(+b.dataset.i);};
  });
  if(P.over){
    document.getElementById("pHome").onclick=function(){P=null;stack=[{n:"home"}];render();};
    document.getElementById("pAgain").onclick=function(){var k=P.key;P=null;go("pair",JSON.parse(k),true);};
  }
}

function pairFlip(i){
  if(P.over||P.lock)return;
  var c=P.cards[i];
  if(P.hit[c.p]||P.open.indexOf(i)>=0)return;
  P.open.push(i);
  if(P.open.length<2){paintPair();return;}
  P.moves++;
  var a=P.cards[P.open[0]],b=P.cards[P.open[1]];
  if(a.p===b.p&&a.k!==b.k){
    P.hit[a.p]=1; P.open=[]; buzz(18); flash("rgba(72,211,172,.26)");
    if(Object.keys(P.hit).length>=P.src.length)return pairDone();
    paintPair();
  }else{
    P.lock=true; buzz([20,40]); paintPair();
    setTimeout(function(){ if(!P)return; P.open=[]; P.lock=false; paintPair(); },780);
  }
}

function pairDone(){
  P.over=true;
  P.secs=Math.round((Date.now()-P.t0)/1000);
  if(pairTimer){clearInterval(pairTimer);pairTimer=null;}
  markDay(); s2init(); s3init();
  missionBump("pair");
  /* 최단 시간을 기록으로 남긴다. 같으면 뒤집은 횟수가 적은 쪽 */
  var b=S.best.pair,mine={t:P.secs,m:P.moves};
  var better=!b||mine.t<b.t||(mine.t===b.t&&mine.m<b.m);
  if(better)S.best.pair=mine;
  save();
  paintPair();
  var st=view.querySelector(".sticky");
  var head=document.createElement("div");
  head.className="result svend";
  head.innerHTML='<div class="big">'+P.secs+'<span style="font-size:20px">초</span></div>'+
    '<div class="sub">'+P.moves+'번 만에 '+P.src.length+'짝 · '+
      (better?'<b style="color:var(--jade)">새 기록!</b>':'최고 '+(b?b.t+"초":"–"))+'</div>';
  view.insertBefore(head,view.firstChild);
  if(better)toast("★ 새 기록 "+P.secs+"초");
}

var _hud3=hud;
hud=function(){

      '<span class="score">'+G.log.length+'</span></div>';

  return _hud3();
};

var _grade3=grade;
grade=function(q,ok){
  var before=(G&&G.revive);
  _grade3(q,ok);
  /* 부활 아이템을 썼으면 목숨은 깎지 않는다 — _grade3 가 이미 정답으로 바꿔 놨다 */
  if(G&&G.mode==="sv"&&!ok&&!before&&!G.revived)G.lives--;
  if(G)G.revived=false;
};

var _next3=next;
next=function(){
  if(G&&G.mode==="sv"){
    advTimer=null;
    if(G.lives<=0)return finish();
    G.i++;
    if(G.i>=G.queue.length)G.queue=G.queue.concat(shuffle(svPool()));
    paintQ();

};

var _finish3=finish;
finish=function(){

    s3init();

    if(lasted>(S.best.sv||0))S.best.sv=lasted;
    if(lasted>=10)missionBump("sv");
    save();
  }
  if(G&&G.mode==="cho"){
    s3init();
    if(G.score>(S.best.cho||0)){S.best.cho=G.score;}
    save();
  }
  _finish3();
};

var _vPlay3=vPlay;
vPlay=function(a){
  if(a&&a.mode==="sv"){
    if(!G||G.key!==JSON.stringify(a)){
      G={key:JSON.stringify(a),mode:"sv",unit:null,queue:shuffle(svPool()),i:0,score:0,
         combo:0,maxCombo:0,ok:0,log:[],left:0,done:false,answered:false,lives:SV_LIVES};
    }

var _vResult3=vResult;
vResult=function(){
  _vResult3();

  var extra="";
  if(G.mode==="cho")
    extra='<div class="sub" style="margin-top:6px">최고 '+(S.best.cho||0)+'점</div>';
  if(G.mode==="sv")
    extra='<div class="sub" style="margin-top:6px">'+G.log.length+'문제까지 버텼어요 · 최고 '+(S.best.sv||0)+'문제</div>';
  if(extra){
    var r=view.querySelector(".result");

function s4init(){
  if(!S.best)S.best={};
  if(S.best.first==null)S.best.first=0;      /* 먼저 온 쪽 최고 점수 */
  if(!S.chal||S.chal.d!==today())S.chal={d:today(),done:0,ok:0,n:0};

/* ── 사건 ↔ 연도 목록. 연도는 채점에만 쓰고 문제로 내지 않는다 ── */
var EVENTS=null;
function eventList(){
  if(EVENTS)return EVENTS;
  var out=[];
  var dup=function(t){
    for(var i=0;i<out.length;i++){
      var a=out[i].t;
      if(a===t||a.indexOf(t)===0||t.indexOf(a)===0)return true;   /* 「대한인 국민회」/「… 결성」 */
    }
    return false;
  };
  var add=function(t,y,u){
    t=(t||"").trim();
    if(!t||!/^\d{4}$/.test(String(y))||dup(t))return;
    out.push({t:t,y:+y,u:u});
  };
  QUESTIONS.forEach(function(q){
    if(/-yr$/.test(q.id)){
      var m=q.question.match(/[「『]([^」』]+)[」』]/);
      if(m)add(m[1],q.choices[q.answer],q.unit);
    }
  });
  QUESTIONS.forEach(function(q){
    if(q.type!=="order")return;
    q.choices.forEach(function(c){ var p=c.split("|"); if(p.length===2)add(p[1],p[0],q.unit); });
  });
  EVENTS=out;
  return out;
}

var DUEL_TIME=60,F=null,duelTimer=null,duelAdv=null;
function runDuelTimer(){
  if(duelTimer)clearInterval(duelTimer);
  duelTimer=setInterval(function(){
    /* 화면을 떠났는데 시계가 계속 돌면 남의 화면 위에 결과를 그려 버린다 */
    if(!F||F.over||stack[stack.length-1].n!=="first"){clearInterval(duelTimer);duelTimer=null;return;}
    F.left--;
    var t=document.getElementById("dT");
    if(t){t.textContent=Math.max(0,F.left)+"초";t.classList.toggle("warn",F.left<=10);}
    if(F.left<=0)duelEnd();
  },1000);
}
function duelPair(){
  var p=eventList();
  for(var t=0;t<60;t++){
    var a=p[Math.floor(Math.random()*p.length)],b=p[Math.floor(Math.random()*p.length)];
    if(a!==b&&a.y!==b.y)return Math.random()<0.5?[a,b]:[b,a];
  }
  return [p[0],p[1]];
}
function vFirst(){
  if(!F||F.over){
    F={pair:duelPair(),score:0,combo:0,maxCombo:0,ok:0,n:0,left:DUEL_TIME,answered:false,over:false};
  }
  runDuelTimer();
  paintDuel();
}
function paintDuel(){
  if(F.over)return paintDuelEnd();
  var a=F.pair[0],b=F.pair[1];
  view.innerHTML=
    '<div class="hud"><span class="timer'+(F.left<=10?" warn":"")+'" id="dT">'+F.left+'초</span>'+
      (F.combo>=2?'<span class="combo">'+ICON.fire+' '+F.combo+'연속</span>':'')+
      '<span style="flex:1"></span><span class="score">'+F.score+'</span></div>'+
    '<div class="qcard"><div class="qtext" style="font-size:19px">둘 중 <b style="color:var(--amber)">먼저</b> 일어난 일은?</div>'+
      '<p class="dhint">연도를 몰라도 돼. 어느 쪽이 앞인지만 고르면 돼.</p></div>'+
    '<div class="duel" id="duel">'+
      '<button class="dcd" data-i="0"><span class="no">A</span><span class="nm">'+esc(a.t)+'</span>'+
        '<span class="yy">'+a.y+'</span></button>'+
      '<div class="vs"><i></i><b>VS</b><i></i></div>'+
      '<button class="dcd" data-i="1"><span class="no">B</span><span class="nm">'+esc(b.t)+'</span>'+
        '<span class="yy">'+b.y+'</span></button>'+
    '</div><div class="grow"></div>';
  Array.prototype.forEach.call(view.querySelectorAll(".dcd"),function(btn){
    btn.onclick=function(){duelPick(+btn.dataset.i);};
  });
}
function duelPick(i){
  if(F.answered||F.over)return;
  F.answered=true; F.n++;
  var cards=view.querySelectorAll(".dcd");
  var first=F.pair[0].y<F.pair[1].y?0:1;
  var ok=i===first;
  Array.prototype.forEach.call(cards,function(c,k){
    c.disabled=true; c.classList.add("show");
    c.classList.add(k===first?"dwin":"dlose");   /* .win 은 셸의 창 클래스라 못 쓴다 */
  });
  markDay();
  if(ok){
    F.ok++; F.combo++; if(F.combo>F.maxCombo)F.maxCombo=F.combo;
    var gain=50+Math.min(F.combo,10)*10;
    F.score+=gain; pop("+"+gain);
    buzz(16); flash("rgba(72,211,172,.26)");
  }else{
    F.combo=0; F.left=Math.max(1,F.left-3);      /* 틀리면 3초를 잃는다 */
    buzz([25,45,25]); flash("rgba(255,110,124,.3)");
    var t=document.getElementById("dT"); if(t)t.textContent=F.left+"초";
  }
  /* 다음 짝으로 넘기는 예약. 화면을 떠났으면 그리지 않는다 */
  duelAdv=setTimeout(function(){
    duelAdv=null;
    if(!F||F.over||stack[stack.length-1].n!=="first")return;
    F.pair=duelPair(); F.answered=false; paintDuel();
  },ok?460:820);
}
function duelEnd(){
  if(!F||F.over)return;
  F.over=true;
  if(duelTimer){clearInterval(duelTimer);duelTimer=null;}
  s4init();
  var better=F.score>(S.best.first||0);
  if(better)S.best.first=F.score;
  missionBump("first"); save();
  paintDuelEnd();
  if(better)toast("★ 새 기록 "+F.score+"점");
}
function paintDuelEnd(){
  view.innerHTML=
    '<div class="result"><div class="big">'+F.score+'</div>'+
      '<div class="sub">'+F.n+'번 중 '+F.ok+'개 맞힘 · 최고 '+(S.best.first||0)+'점</div></div>'+
    '<div class="rgrid">'+stat(F.ok+" / "+F.n,"정답")+stat(F.maxCombo,"최고 콤보")+
      stat(eventList().length,"사건 수")+'</div>'+
    '<div class="sect">이럴 때 강해져</div>'+
    '<p class="note">순서를 아는 것이 곧 흐름을 아는 것이다. 「연표 세우기」로 이어서 해 보면 좋다.</p>'+
    '<div class="grow"></div>'+
    '<div class="sticky"><div class="btnrow">'+

function chalQueue(){

  speakStop();
};
window.__hansaResume.mon=function(){

    runPairTimer();
  }
  if(n==="first"&&F&&!F.over&&F.left>0)runDuelTimer();
};

["s2",1918,"토지 조사 사업의 결과","총독부는 지세 수입이 늘고 소유권이 불분명한 토지와 국공유지를 차지했으며, 그 땅은 동양 척식 주식회사나 일본인에게 헐값으로 넘어갔다.","동양 척식 주식회사"],

["s4",1943,"인력 수탈","지원병제·학도 지원병제·징병제로 청년을 전쟁터로 보내고, 국민 징용령으로 청장년을 탄광과 군수 공장에 강제 동원했다.","국민 징용령"],
["s4",1944,"여자 정신 근로령","수십만 명의 여성을 군수 공장 등에 동원했다. 앞서 수많은 여성이 일본군 위안부로 끌려가 성 노예가 되기도 했다.","일본군 위안부"],
["s4",1939,"공출과 배급제","집집마다 할당량을 정해 쌀을 걷고 배급제를 시행했으며, 무기를 만들려 절의 종과 놋그릇·숟가락까지 빼앗아 갔다.","배급제"],
["s4",1938,"국민정신 총동원 운동","전국 조직망의 말단에 애국반을 두어 일장기 게양·신사 참배·애국 저금을 강요하고 공출과 징용에 앞장서게 했다.","애국반"],

/* ================= s5 · 1910년대 국내외 독립운동 (20~21쪽) ================= */
["s5",1912,"독립 의군부","의병장 출신 임병찬 등이 고종의 밀명을 받아 조직했으며, 복벽주의를 내세워 고종을 다시 황제로 세우려 했다.","복벽주의"],
["s5",1915,"대한 광복회","박상진 등이 주축이 되어 국권 회복 뒤 민주 공화제 국가 건설을 추구했고, 친일파를 처단하며 만주에 무관 학교 설립을 추진했다.","민주 공화제"],
["s5",1911,"서간도 삼원보","신민회의 이회영·이상룡 등이 자치 기관인 경학사를 조직하고 독립군을 기르기 위해 신흥 강습소를 세웠다.","경학사"],
["s5",1919,"신흥 무관 학교","신흥 강습소가 발전한 학교로, 3·1 운동 이후 만주로 향한 청년들을 받아 군사 훈련을 실시했다.","신흥 강습소"],
["s5",1913,"북간도의 민족 운동","간민회 등 자치 단체가 동포 사회를 이끌었고 서전서숙을 계승한 명동 학교가 세워졌다.","명동 학교"],
["s5",1911,"중광단","서일 등 대종교 간부들이 만든 무장 독립 단체로 이후 북로 군정서로 발전했다.","북로 군정서"],
["s5",1911,"연해주 권업회","블라디보스토크 교외에 세운 신한촌을 중심으로 활동한 자치 단체다.","신한촌"],
["s5",1914,"대한 광복군 정부","연해주에서 이상설과 이동휘를 정·부통령으로 하여 수립되었다.","이상설"],
["s5",1910,"대한인 국민회","장인환과 전명운의 의거를 계기로 애국심이 높아지자 안창호의 주도로 미주 한인 단체들이 통합해 만들었다.","안창호"],
["s5",1914,"대조선 국민군단","하와이에서 박용만 등이 조직해 군사 훈련을 실시했다.","박용만"],
["s5",1912,"동제사","상하이에서 신규식 등이 조직했고, 이들 중 일부가 신한청년당을 결성해 임시 정부 수립의 기반을 닦았다.","신한청년당"],
["s5",1917,"대동단결 선언","신규식·박은식·신채호·조소앙 등이 상하이에서 발표했으며, 주권이 순종에게서 일반 국민에게 넘어왔다는 국민 주권론을 폈다.","국민 주권론"],

/* ================= s6 · 3·1 운동 (22~25쪽) ================= */
["s6",1918,"3·1 운동의 국제적 배경","러시아 혁명 뒤 레닌이 약소민족 해방 운동 지원을 선언하고 미국 대통령 윌슨이 민족 자결주의를 제창하면서 독립운동가들이 희망을 품었다.","민족 자결주의"],
["s6",1919,"김규식의 파리 파견","상하이의 신한청년당이 한국의 독립을 청원하려 파리 강화 회의에 대표로 보냈다.","신한청년당"],
["s6",1919,"2·8 독립 선언","일본에 유학 중이던 학생들이 조선 청년 독립단의 이름으로 도쿄에서 독립 선언서를 발표했다.","조선 청년 독립단"],
["s6",1919,"고종의 서거","일제가 독살했다는 소문이 퍼져 분노가 커졌고, 종교계 지도자와 학생들이 국장일에 즈음해 만세 시위를 계획했다.","국장일"],
["s6",1919,"민족 대표의 독립 선언","손병희·이승훈·한용운 등은 시위가 과격해질 것을 우려해 탑골 공원 대신 태화관에 모여 독립 선언식을 가졌다.","태화관"],
["s6",1919,"탑골 공원 만세 시위","학생과 시민이 독립 선언서를 낭독하고 대한 독립 만세를 외치며 거리로 쏟아져 나왔다.","독립 선언서"],
["s6",1919,"시위의 확산","도시에서 농촌으로 번지며 주로 장날을 이용했고, 학생·교사·상인·노동자에 기생과 걸인까지 계층을 가리지 않고 참여했다.","장날"],
["s6",1919,"제암리 학살","경기도 화성 제암리에서 일본군이 주민을 교회에 모아 놓고 총을 쏜 뒤 불을 질렀다.","제암리"],
["s6",1919,"무력 투쟁으로의 발전","헌병 경찰의 무자비한 진압에 시위가 격화되어 일부 농민이 경찰 관서와 헌병대 등 식민 통치 기관을 습격했다.","습격"],
["s6",1919,"3·1 운동의 의의","일제 강점기 최대 규모의 항일 운동으로 우리 민족의 독립 의지를 전 세계에 알렸고, 학생·농민·노동자·여성이 참여해 민족 운동의 주체가 확대되었다.","최대 규모"],
["s6",1919,"3·1 운동의 영향","민족 운동을 조직적으로 지도할 구심점이 필요하다는 인식에서 대한민국 임시 정부가 수립되었고, 일제는 통치 방식을 문화 정치로 바꾸었다.","구심점"],
["s6",1919,"세계사적 의의","대표적인 반제국주의 민족 운동으로 중국의 5·4 운동 등 약소민족의 민족 운동에 영향을 주었다.","5·4 운동"],
["s6",1919,"유관순","이화 학당 학생으로 천안 아우내 장터에서 만세 시위를 주도하다 붙잡혀 서대문 형무소에서 순국했다.","아우내"],

/* ================= s7 · 대한민국 임시 정부 (26~29쪽) ================= */
["s7",1919,"여러 임시 정부의 수립","연해주에 대한 국민 의회, 상하이에 대한민국 임시 정부가 세워지고 국내에서는 한성 정부 수립이 선포되었다.","대한 국민 의회"],
["s7",1919,"임시 정부의 통합","한성 정부의 법통을 잇고 대한 국민 의회를 통합했으며, 조계 지역이 많아 외교에 유리한 상하이에 정부를 두기로 결정했다.","상하이"],
["s7",1919,"민주 공화제 채택","우리 역사상 최초의 민주 공화제 정부로, 삼권 분립에 따라 입법 기관인 임시 의정원, 행정 기관인 국무원, 사법 기관인 법원을 두었다.","임시 의정원"],
["s7",1919,"초대 각료 선출","대한민국 임시 헌법을 공포하고 임시 대통령에 이승만, 국무총리에 이동휘를 선임했다.","이동휘"],
["s7",1919,"연통제","국내에 설치한 비밀 행정 조직으로 군자금을 조달하고 정부의 문서와 명령을 전달했다.","비밀 행정 조직"],
["s7",1919,"교통국","정보 수집과 자금 모집을 맡은 통신 기관으로, 이륭 양행에 근거를 둔 안동 교통국의 활약이 두드러졌다.","이륭 양행"],
["s7",1919,"독립 공채","광복 후 갚겠다고 약속하고 발행한 증서로 국내와 미주 동포에게 팔아 독립운동 자금을 마련했다.","독립운동 자금"],
["s7",1919,"구미 위원부","미국에 설치해 대통령 이승만을 중심으로 외교 활동을 벌였다.","이승만"],
["s7",1919,"독립신문과 사료집","독립신문을 펴내 동포에게 소식을 알리고, 임시 사료 편찬회를 두어 한일 관계 사료집을 간행했다.","한일 관계 사료집"],
["s7",1923,"육군 주만 참의부","국무원 산하 군무부의 직할 부대로 편성되어 만주에서 항일 투쟁을 전개했다.","군무부"],
["s7",1923,"국민 대표 회의","연통제와 교통국이 발각되고 외교 활동이 성과를 내지 못하자 열렸으나, 개조파와 창조파의 대립으로 결렬되며 임시 정부가 침체에 빠졌다.","개조파"],
["s7",1925,"이승만 탄핵","국제 연맹에 위임 통치를 청원한 일과 직무를 다하지 않은 점이 문제 되어 탄핵되었고 박은식이 제2대 대통령이 되었다.","박은식"],
["s7",1925,"국무령 중심 체제","헌법을 고쳐 국무령 중심의 집단 지도 체제로 바꾸고 이동녕과 김구를 중심으로 조직을 재정비했다.","집단 지도 체제"],

/* ================= s8 · 무장 독립 전쟁 (30~33쪽) ================= */
["s8",1920,"봉오동 전투","홍범도의 대한 독립군, 안무의 국민회군, 최진동의 군무 도독부군이 연합해 일본군을 봉오동 골짜기로 유인한 뒤 기습해 크게 무찔렀다.","최진동"],
["s8",1920,"훈춘 사건","일제가 만주에 군대를 넣을 구실을 만들려고 중국 마적을 매수해 훈춘의 일본 영사관을 공격하게 한 자작극이다.","마적"],
["s8",1920,"청산리 대첩","김좌진의 북로 군정서와 홍범도의 대한 독립군 등이 백운평 전투를 시작으로 어랑촌·고동하 전투 등 10여 차례를 싸워 일본군을 크게 격파했다.","백운평"],
["s8",1920,"간도 참변","일제가 독립군의 근거지를 없앤다는 구실로 서너 달에 걸쳐 간도의 한인 마을을 불태우고 수많은 한인을 학살했다.","근거지"],
["s8",1921,"자유시 참변","밀산에 모였다가 레닌의 지원을 기대하며 자유시로 옮긴 독립군이 지휘권 분쟁 끝에 러시아 적군에게 무장 해제당하며 희생되었다.","무장 해제"],
["s8",1924,"3부의 성립","남만주에 참의부, 지린성 일대에 정의부, 북만주에 신민부가 세워졌다.","정의부"],
["s8",1925,"3부의 성격","민정 조직과 군정 조직을 갖추고 관할 구역 한인에게 세금을 거두어 운영한 사실상의 공화주의 자치 정부였다.","공화주의 자치 정부"],
["s8",1925,"미쓰야 협정","조선 총독부 경무 국장 미쓰야가 만주 군벌과 맺어, 한국인 독립운동가를 체포해 일본 경찰에 넘기도록 했다.","만주 군벌"],
["s8",1929,"3부 통합 운동","통합 방법을 둘러싼 이견으로 완전한 통합에 이르지 못한 채 남만주의 국민부와 북만주의 혁신 의회로 재편되었다.","국민부"],
["s8",1929,"조선 혁명군 조직","국민부가 조선 혁명당을 결성하고 그 아래에 조직한 무장 부대다.","조선 혁명당"],
["s8",1930,"한국 독립당과 한국 독립군","혁신 의회가 해체된 뒤 지청천 등이 한국 독립당을 만들었고, 만주 사변이 일어나자 그 산하에 한국 독립군을 편성했다.","지청천"],
["s8",1932,"영릉가 전투","양세봉이 이끄는 조선 혁명군이 중국 의용군과 힘을 합쳐 일본군을 물리치고 영릉가성을 점령했다.","양세봉"],
["s8",1932,"쌍성보 전투","지청천이 이끄는 한국 독립군이 중국군과 연합해 승리를 거두었다.","한국 독립군"],
["s8",1933,"대전자령 전투","한국 독립군이 험한 골짜기인 대전자령에 매복했다가 일본군의 후방이 고개를 넘을 때 일시에 공격해 크게 이겼다.","대전자령"],
["s8",1933,"동경성 전투와 흥경성 전투","한국 독립군은 동경성에서, 조선 혁명군은 흥경성에서 각각 일본군과 싸웠다.","동경성"],
["s8",1934,"양세봉 전사","조선 혁명군은 사령관 양세봉이 전사한 뒤 세력이 약해졌으나 1930년대 후반까지 항일 투쟁을 이어 갔다.","양세봉"],
["s8",1933,"동북 인민 혁명군","중국 공산당이 만주의 항일 유격대를 규합해 편성했고 많은 한인 사회주의자가 참여했으며 이후 동북 항일 연군으로 발전했다.","동북 항일 연군"],
["s8",1936,"조국 광복회","동북 항일 연군에 속한 한인 유격대원들이 민족주의자와 함께 조직했다.","동북 항일 연군"],
["s8",1935,"지청천의 중국 관내 이동","한국 독립군 지도부가 임시 정부의 요청으로 만리장성 이남으로 옮겼고, 지청천은 뒷날 한국광복군 창설을 주도했다.","한국광복군"],

["x0",-2333,"고조선 건국","단군왕검이 세운 우리 역사 최초의 국가. 당시 사회 모습은 8조법을 통해 짐작할 수 있다.","8조법"],

{u:"s10",t:"실력 양성 운동 삼총사",k:"물 · 민 · 문",e:"<em>물</em>산 장려 운동(1920, 조만식·평양) · <em>민</em>립 대학 설립 운동(1923, 이상재) · <em>문</em>맹 퇴치 — 문자 보급(1929, 조선일보)·브나로드(1931, 동아일보)."},

{u:"s13",t:"1920년대 국내 민족 운동의 갈래",k:"타협 → 자치 / 비타협 + 사회주의 → 신간회",e:"실력 양성 운동이 막히자 민족주의가 <b>타협</b>(자치 운동)과 <b>비타협</b>으로 갈렸고, 비타협 쪽이 정우회 선언(1926)을 낸 <b>사회주의</b>와 손잡아 <em>신간회</em>(1927)가 됐다. 해소는 1931."},
{u:"s15",t:"대중 운동 세 갈래",k:"여 근 · 소 방 · 형 진",e:"<em>여</em>성 운동 = <b>근</b>우회(1927) · <em>소</em>년 운동 = <b>방</b>정환(어린이날) · <em>형</em>평 운동 = <b>진</b>주 조선 형평사(1923)."},
{u:"s16",t:"식민 사관 세 가지",k:"타 · 정 · 당",e:"<em>타</em>율성론(외세에 휘둘렸다) · <em>정</em>체성론(발전이 없었다) · <em>당</em>파성론(단결 못 한다). 정체성론을 정면으로 반박한 게 <b>백남운</b>."},

var FMAP={},OMAP={};
FACTS.forEach(function(f){FMAP[f.id]=f;});
OX.forEach(function(o){OMAP[o.id]=o;});

var UMAP={};UNITS.forEach(function(u){UMAP[u.id]=u;});
var IN_RANGE=UNITS.filter(function(u){return u.g===1;}).map(function(u){return u.id;});

var BOX_DAYS=[0,1,3,7,16];            /* 라이트너 상자별 다음 복습까지 걸리는 날 */
var RANKS=[[0,"서당 학동"],[120,"향교 유생"],[320,"성균관 유생"],[650,"과거 급제"],
           [1100,"사관 史官"],[1700,"실록 편수관"],[2500,"연표 마스터"]];
var KEY="hansa-sprint-v2";   /* 교과서 단원 구조로 개편 */

/* ---------- 날짜 ---------- */
function dayNo(d){d=d||new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);}
function fmtY(y){return y<0?"기원전 "+(-y):String(y);}
function yl(f){return f.ya||fmtY(f.y);}

/* ---------- 상태 ---------- */
var S;
function blank(){
  return {srs:{},xp:0,streak:0,last:0,goal:20,units:IN_RANGE.slice(),
          dday:"",today:{day:dayNo(),n:0,ok:0},wrong:[],seenDays:0,theme:""};
}
function load(){
  try{var r=localStorage.getItem(KEY);S=r?Object.assign(blank(),JSON.parse(r)):blank();}
  catch(e){S=blank();}
  if(!S.units||!S.units.length)S.units=IN_RANGE.slice();
  /* 범위가 8~63쪽으로 늘었다 — 예전 저장본에도 새 소단원을 한 번 켜 준다 */
  if((S.rangeV||1)<2){
    IN_RANGE.forEach(function(u){ if(S.units.indexOf(u)<0)S.units.push(u); });
    S.units=S.units.filter(function(u){return !!UMAP[u];});
    S.rangeV=2;
  }
  var t=dayNo();
  if(!S.today||S.today.day!==t)S.today={day:t,n:0,ok:0};
  if(S.last&&S.last<t-1)S.streak=0;      /* 하루라도 건너뛰면 연속 끊김 */
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

function rankOf(xp){var r=RANKS[0],nx=null;
  for(var i=0;i<RANKS.length;i++){if(xp>=RANKS[i][0])r=RANKS[i];else{nx=RANKS[i];break;}}
  return {name:r[1],cur:r[0],next:nx?nx[0]:r[0]+1};}

/* ---------- 학습 풀 ---------- */
function inScope(u){return S.units.indexOf(u)>=0;}
/* 단원별 항목은 바뀌지 않는다 — 한 번 묶어 두고 계속 쓴다 */
var BY_UNIT=null;
function byUnit(id){
  if(!BY_UNIT){
    BY_UNIT={};
    FACTS.concat(OX).forEach(function(x){ (BY_UNIT[x.u]=BY_UNIT[x.u]||[]).push(x); });
  }
  return BY_UNIT[id]||[];
}
function poolFacts(){return FACTS.filter(function(f){return inScope(f.u);});}
function poolOx(){return OX.filter(function(o){return inScope(o.u);});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function buildQueue(){
  var t=dayNo(),ids=[],due=[],fresh=[];
  poolFacts().forEach(function(f){ids.push(f.id);});
  poolOx().forEach(function(o){ids.push(o.id);});
  ids.forEach(function(id){
    var r=S.srs[id];
    if(!r)fresh.push(id); else if(r.due<=t)due.push(id);
  });
  var q=shuffle(due);
  var room=Math.max(S.goal-S.today.n,6);
  if(q.length<room)q=q.concat(shuffle(fresh).slice(0,room-q.length));
  return q.slice(0,Math.min(60,room));
}

/* ---------- 채점 ---------- */
function grade(id,score){          /* score: 0 다시 · 1 애매 · 2 정답/쉬움 */
  var t=dayNo(),r=S.srs[id]||{b:0,due:t};
  if(score===0){r.b=0;r.due=t;}
  else if(score===1){r.b=Math.max(0,r.b);r.due=t+1;}
  else{r.b=Math.min(4,r.b+1);r.due=t+BOX_DAYS[r.b];}
  S.srs[id]=r;
  S.today.n++;
  if(score===2){S.today.ok++;S.xp+=10+Math.min(10,combo*2);combo++;
    var w=S.wrong.indexOf(id);if(w>=0)S.wrong.splice(w,1);}
  else{S.xp+=2;combo=0;if(S.wrong.indexOf(id)<0)S.wrong.push(id);}
  var t2=dayNo();
  if(S.last!==t2){S.streak=(S.last===t2-1)?S.streak+1:1;S.last=t2;S.seenDays++;}
  save();paintTop();
  if(combo&&combo%3===0)flashCombo(combo);
}
var combo=0;
function flashCombo(n){
  var el=document.createElement("div");el.className="combo";el.textContent=n+" 연속!";
  (document.getElementById("Sapp")||document.body).appendChild(el);setTimeout(function(){el.remove();},760);
}

/* ---------- 상단 페인트 ---------- */
function paintTop(){
  var g=S.goal,n=S.today.n,p=Math.min(1,n/g);
  document.getElementById("SringArc").style.strokeDashoffset=String(119.4*(1-p));
  document.getElementById("SringTx").textContent=Math.round(p*100)+"%";
  document.getElementById("StodayVal").textContent=n>=g?n+"문제 · 목표 달성":n+" / "+g+" 문제";
  var r=rankOf(S.xp);
  document.getElementById("SrankTx").textContent=r.name;
  document.getElementById("SxpFill").style.width=
    Math.min(100,((S.xp-r.cur)/Math.max(1,r.next-r.cur))*100)+"%";
  document.querySelector("#ScStrk .n").textContent=S.streak;
  var dd=document.getElementById("ScDday");
  if(S.dday){
    var diff=Math.round((dayNo(new Date(S.dday+"T00:00:00"))-dayNo()));
    dd.innerHTML=diff>0?'D-<span class="n">'+diff+'</span>':(diff===0?'<span class="n">D-DAY</span>':'D+<span class="n">'+(-diff)+'</span>');
    dd.style.display="";
  }else{dd.innerHTML="시험일 +";}
  paintMastery();
}
function paintMastery(){
  var box=document.getElementById("Smastery");if(!box)return;
  box.innerHTML=UNITS.filter(function(u){return inScope(u.id);}).map(function(u){
    var xs=byUnit(u.id);
    var all=xs.length,got=0;
    xs.forEach(function(x){var r=S.srs[x.id];if(r)got+=Math.min(4,r.b);});
    var pct=Math.round(got/(all*4)*100);
    /* 초록·황토·빨강 세 색은 정상 시야에서도 구분이 어려워(ΔE 기준 미달) 길이 하나로만 나타내고,
       약한 단원은 글자로 짚어 준다 */
    return '<div class="ubar"><div class="r1"><span>'+u.short+
           (got>0&&pct<35?' <b class="wk">약함</b>':'')+'</span><span>'+pct+'%</span></div>'+
           '<div class="tr"><i style="width:'+pct+'%"></i></div></div>';
  }).join("");
}

/* ---------- 문제 생성 ---------- */
function distinct(arr,n,not){
  var out=[],seen={};seen[not]=1;
  shuffle(arr).forEach(function(v){if(out.length<n&&!seen[v]){seen[v]=1;out.push(v);}});
  return out;
}
function makeItem(id){
  if(id.charAt(0)==="o"){var o=OMAP[id];return {kind:"ox",id:id,u:o.u,ox:o};}
  var f=FMAP[id],sib=FACTS.filter(function(x){return x.u===f.u&&x.id!==f.id;});
  var kinds=["flash","event"];
  var ys=distinct(sib.filter(function(x){return !x.ya;}).map(function(x){return x.y;}),3,f.y);
  if(ys.length===3&&!f.ya)kinds.push("year");   /* 대략의 시기만 있는 것은 연도 문제로 내지 않는다 */   /* 선택지 4개를 못 채우면 연도 문제는 건너뛴다 */
  if(f.d.indexOf(f.k)>=0)kinds.push("cloze");
  var kind=kinds[Math.floor(Math.random()*kinds.length)];
  if(kind==="year")return {kind:"year",id:id,u:f.u,f:f,opts:shuffle(ys.concat([f.y])),ans:f.y};
  if(kind==="event"){
    var ts=distinct(sib.map(function(x){return x.t;}),3,f.t).concat([f.t]);
    return {kind:"event",id:id,u:f.u,f:f,opts:shuffle(ts),ans:f.t};
  }
  if(kind==="cloze"){
    var ks=distinct(sib.map(function(x){return x.k;}),3,f.k).concat([f.k]);
    return {kind:"cloze",id:id,u:f.u,f:f,opts:shuffle(ks),ans:f.k};
  }
  return {kind:"flash",id:id,u:f.u,f:f};
}
function makeOrder(){
  /* 연도가 4개 이상 서로 다른 단원만 후보로 삼는다.
     3·1 운동처럼 사건이 한 해에 몰린 단원은 순서를 물을 수 없다. */
  var byU={};poolFacts().forEach(function(f){ if(!f.ya)(byU[f.u]=byU[f.u]||[]).push(f); });
  var us=Object.keys(byU).filter(function(u){
    var ys={},n=0;
    byU[u].forEach(function(f){if(!ys[f.y]){ys[f.y]=1;n++;}});
    return n>=4;
  });
  if(!us.length)return null;
  var u=us[Math.floor(Math.random()*us.length)];
  var seen={},cand=[];
  shuffle(byU[u]).forEach(function(f){if(!seen[f.y]){seen[f.y]=1;cand.push(f);}});
  var four=cand.slice(0,4);
  return {kind:"order",u:u,items:shuffle(four),
          sorted:four.slice().sort(function(a,b){return a.y-b.y;})};
}

/* ---------- 렌더 헬퍼 ---------- */
var st=function(){return document.getElementById("Sstage");};
function uName(u){return UMAP[u]?UMAP[u].short:"";}
function uCls(u){return UMAP[u]?UMAP[u].c:"cd";}
function head(u,kindLabel){
  return '<div class="card-h"><span class="tag '+uCls(u)+'">'+uName(u)+'</span>'+
         '<span class="kind">'+kindLabel+'</span></div>';
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}

/* ---------- 모드: 오늘의 스프린트 ---------- */
var queue=[],qi=0;
function startToday(){queue=buildQueue();qi=0;stepToday();}
function stepToday(){
  if(qi>=queue.length){
    var acc=S.today.n?Math.round(S.today.ok/S.today.n*100):0;
    st().innerHTML='<div class="card"><div class="card-b"><div class="empty">'+
      '<div class="big">畢</div>'+
      '<p><b style="color:var(--tx);font-size:17px">오늘 몫 끝!</b><br>'+
      '오늘 '+S.today.n+'문제 · 정답률 '+acc+'% · 🔥 '+S.streak+'일 연속</p>'+
      '<p style="margin-top:14px">복습할 카드는 내일 다시 나와요.<br>더 하고 싶으면 아래 버튼을 눌러요.</p>'+
      '</div><div class="btn-row" style="margin-top:4px">'+
      '<button class="btn ghost" id="bMore">10문제 더</button>'+
      '<button class="btn" id="bCheat">치트키 보기</button></div></div></div>';
    document.getElementById("bMore").onclick=function(){queue=queue.concat(buildQueue().slice(0,10));stepToday();};
    document.getElementById("bCheat").onclick=function(){go("cheat");};
    return;
  }
  /* 5문제마다 연표 정렬 게임 한 판 */
  if(qi>0&&qi%5===0&&Math.random()<.7){var o=makeOrder();if(o){renderOrder(o,function(){qi++;stepToday();});return;}}
  renderItem(makeItem(queue[qi]),function(){qi++;stepToday();});
}

function renderItem(it,done){
  if(it.kind==="flash")return renderFlash(it,done);
  if(it.kind==="ox")return renderOx(it,done);
  return renderChoice(it,done);
}

function renderOrder(g,done){
  var picked=[],wrong=false;
  function paint(){
    st().innerHTML='<div class="card">'+head(g.u,"연표 정렬")+'<div class="card-b">'+
      '<div class="q sm">일어난 순서대로 눌러 주세요</div>'+
      '<p class="hint" style="margin-top:6px">빠른 것부터 → 늦은 것까지</p>'+
      '<div class="opts" id="op">'+g.items.map(function(f){
        var i=picked.indexOf(f.id);
        var cls=i>=0?(wrong?"":"ok"):"";
        return '<button class="opt '+cls+'" data-id="'+f.id+'"'+(i>=0?" disabled":"")+'>'+
               '<span class="k">'+(i>=0?(i+1):"·")+'</span><span>'+esc(f.t)+
               (i>=0||wrong?' <span style="color:var(--tx-3)">— '+yl(f)+'</span>':'')+'</span></button>';
      }).join("")+'</div><div id="fb"></div></div></div>';
    Array.prototype.forEach.call(document.querySelectorAll("#op .opt"),function(b){
      b.onclick=function(){
        var f=FMAP[b.dataset.id];
        if(f.id===g.sorted[picked.length].id){
          picked.push(f.id);
          if(picked.length===g.items.length)finish(true); else paint();
        }else{wrong=true;finish(false);}
      };
    });
  }
  function finish(ok){
    wrong=!ok;paint();
    Array.prototype.forEach.call(document.querySelectorAll("#op .opt"),function(x){x.disabled=true;});
    g.items.forEach(function(f){grade(f.id,ok?2:0);});
    document.getElementById("fb").innerHTML=
      '<div class="fb '+(ok?"ok":"no")+'" style="margin-top:14px"><span class="ic">'+(ok?"○":"×")+
      '</span><span>'+(ok?"완벽한 순서예요! 4장 모두 +XP":"순서가 어긋났어요. 아래 연표로 확인하세요.")+'</span></div>'+
      '<div class="rail-line" style="margin-top:12px">'+g.sorted.map(function(f){
        return '<div class="rl"><span class="y'+(f.ya?' ya':'')+'">'+yl(f)+'</span><span class="dot"></span>'+
               '<div><div class="t">'+esc(f.t)+'</div><div class="s">'+f.d+'</div></div></div>';
      }).join("")+'</div>'+
      '<button class="btn wide" id="bNext" style="margin-top:14px">다음 →</button>';
    document.getElementById("bNext").onclick=done;
  }
  paint();
}

/* ---------- 모드: 연표 ---------- */
/* 시기 구분 — 통치 방식이 바뀐 두 지점(3·1 운동, 만주 사변)에서 끊는다.
   범위 밖 단원까지 켜 두었을 때를 대비해 앞뒤로 한 칸씩 더 둔다 */
var ERAS=[
  {max:1909,n:"1910년 이전",t:"강점 이전"},
  {max:1919,n:"1910년대",t:"무단 통치 — 헌병 경찰과 토지 조사 (3·1 운동까지)"},
  {max:1930,n:"1919~1920년대",t:"이른바 문화 통치 — 3·1 운동 뒤~만주 사변 전, 겉모습만 바꾸고 쌀을 실어 가다"},
  {max:1945,n:"1930~40년대",t:"민족 말살 · 전시 동원 — 만주 사변 뒤, 이름과 말까지 빼앗다"},
  {max:9999,n:"1945년 이후",t:"광복 이후"}
];
function eraOf(y){for(var i=0;i<ERAS.length;i++)if(y<=ERAS[i].max)return i;return ERAS.length-1;}
/* 1919년은 햇수만으로 갈리지 않는다 — 3·1 운동 뒤에 생긴 것(문화 정치 시작 s3, 신흥 무관 학교 s5, 임시 정부 s7, 의열단·강우규 s9)은 1920년대 칸.
   1930년 「식민지 공업화」 같은 민족 말살 통치 단원(s4) 사실은 1930년대 칸 */
var ERA1919={s3:1,s5:1,s7:1,s9:1};
function eraOfF(f){ if(f.y===1919&&ERA1919[f.u])return eraOf(1920); if(f.y===1930&&f.u==="s4")return eraOf(1931); return eraOf(f.y); }
var TRACK={s1:"world",s2:"rule",s3:"rule",s4:"rule",s5:"resist",s6:"resist",s7:"resist",s8:"resist",
  s9:"resist",s10:"resist",s11:"resist",s12:"resist",s13:"resist",s14:"life",s15:"resist",s16:"resist",s17:"resist",s18:"resist"};
var TRACKN={rule:"일제",resist:"우리",world:"세계",life:"삶",other:"그 밖"};
/* 단원 갈래를 따르되, 사실 하나가 따로 적어 두면 그걸 쓴다 (예: 민족 문화 단원 안의 「조선사 편수회」는 일제가 한 일) */
function trackOf(u,f){return (f&&f.tk)||TRACK[u]||"other";}
/* 기본은 「전체 순서」 — 단원 경계를 지우고 처음부터 끝까지 한 줄로 세운다 */
var TLFLOW=true;
function viewTimeline(){
  var fs=poolFacts(),body="",n=fs.length;
  if(TLFLOW){
    var g=fs.slice().sort(function(a,b){return a.y-b.y||eraOfF(a)-eraOfF(b);});
    var ce=-1;
    body+='<div class="rail-line">';
    g.forEach(function(f){
      var ei=eraOfF(f);
      if(ei!==ce){ ce=ei;
        body+='<div class="era"><b>'+ERAS[ei].n+'</b><span>'+esc(ERAS[ei].t)+'</span></div>'; }
      var k=trackOf(f.u,f);
      body+='<div class="rl k-'+k+'"><span class="y'+(f.ya?' ya':'')+'">'+yl(f)+'</span><span class="dot"></span>'+
        '<div><div class="t">'+esc(f.t)+'<em class="tg">'+TRACKN[k]+'</em>'+(f.pr?'<em class="tg pr">프린트</em>':'')+'</div>'+
        '<div class="s">'+f.d+'</div></div></div>';
    });
    body+='</div>';
  }else{
    /* 단원마다 전체를 다시 훑지 않고 한 번에 묶는다 */
    var by={};
    fs.forEach(function(f){ (by[f.u]=by[f.u]||[]).push(f); });
    UNITS.forEach(function(u){
      var gg=by[u.id];
      if(!gg||!gg.length)return;
      gg=gg.slice().sort(function(a,b){return a.y-b.y;});
      body+='<div class="sect" style="margin-top:20px">'+u.short+' · '+u.bk+'</div><div class="rail-line">'+
        gg.map(function(f){
          return '<div class="rl"><span class="y'+(f.ya?' ya':'')+'">'+yl(f)+'</span><span class="dot"></span>'+
            '<div><div class="t">'+esc(f.t)+'</div><div class="s">'+f.d+'</div></div></div>';
        }).join("")+'</div>';
    });
  }
  st().innerHTML='<div class="card"><div class="card-b">'+
    '<div class="q sm">연표 정렬 게임</div><p class="d" style="margin-top:6px">네 장의 카드를 순서대로 눌러 맞히세요. 순서 감각이 시험에서 제일 잘 나옵니다.</p>'+
    '<button class="btn wide" id="bPlay" style="margin-top:14px">한 판 시작</button></div></div>'+
    '<div class="card"><div class="card-b" style="padding-top:4px">'+
    '<div class="tlsw"><button class="btn'+(TLFLOW?"":" ghost")+'" id="tlF">전체 순서로 쭉</button>'+
    '<button class="btn'+(TLFLOW?" ghost":"")+'" id="tlU">소단원별로</button></div>'+
    (TLFLOW?'<p class="hint" style="margin:10px 0 4px">단원 경계를 지우고 '+n+'개 항목을 일어난 순서대로 한 줄에 세웠습니다. '+
      '<b>일제</b>가 한 일과 <b>우리</b>가 한 일이 어떻게 맞물리는지 위에서 아래로 쭉 읽어 내려가세요.</p>':'')+
    body+
    '<p class="hint" style="margin-top:18px">소단원 '+n+'개 항목</p></div></div>';
  document.getElementById("tlF").onclick=function(){if(!TLFLOW){TLFLOW=true;viewTimeline();}};
  document.getElementById("tlU").onclick=function(){if(TLFLOW){TLFLOW=false;viewTimeline();}};
  document.getElementById("bPlay").onclick=function(){
    var gm=makeOrder();
    if(!gm){st().innerHTML='<div class="card"><div class="card-b"><div class="empty"><p>단원을 더 선택하면 게임을 할 수 있어요.</p></div></div></div>';return;}
    (function loop(g2){renderOrder(g2,function(){var nx=makeOrder();if(nx)loop(nx);else viewTimeline();});})(gm);
  };
}

/* ---------- 헷갈리는 짝 가려내기 ----------
   시험이 노리는 건 「비슷해서 섞이는 둘」이다. 비교표에 이미 그 짝과
   구분 근거가 줄 단위로 들어 있으니, 새 문제를 적는 대신 그 줄을 그대로 낸다.
   한 줄을 보여 주고 「둘 중 어느 쪽이냐」만 묻는다 */
function pname(n){ return String(n).replace(/\s*\(.*?\)\s*/g,"").replace(/^=\s*/,"").trim(); }
/* 이름이 그대로 박힌 줄은 답이 보이니 내지 않는다 */
function pgive(line,names){
  var t=String(line).replace(/<[^>]+>/g,"");
  return names.some(function(n){
    return pname(n).split(/[·\s]+/).filter(function(w){return w.length>=2;})
      .some(function(w){return t.indexOf(w)>=0;});
  });
}
function pairPool(){
  var out=[];
  COMPARE.forEach(function(c,ci){
    if(!inScope(c.u))return;
    var names=[c.a.n,c.b.n];
    ["a","b"].forEach(function(side){
      c[side].p.forEach(function(line,li){
        if(pgive(line,names))return;
        out.push({id:"cp"+ci+side+li,u:c.u,t:c.t,line:line,side:side,
                  an:c.a.n,bn:c.b.n,c:c});
      });
    });
  });
  return out;
}
function startPairs(){
  var pool=shuffle(pairPool());
  if(pool.length<4){
    st().innerHTML='<div class="card"><div class="card-b"><div class="empty">'+
      '<p>단원을 더 켜면 가려낼 짝이 생겨요.</p></div></div></div>';
    return;
  }
  var i=0,ok=0,n=0;
  (function nx(){
    if(i>=pool.length){ pool=shuffle(pool); i=0; }
    renderPair(pool[i++],function(good){ n++; if(good)ok++; nx(); },function(){ viewCheat(); },
      function(){ return {ok:ok,n:n}; });
  })();
}
function renderPair(q,done,quit,score){
  var sc=score(),answered=false;
  st().innerHTML='<div class="card">'+head(q.u,"헷갈리는 짝")+'<div class="card-b">'+
    '<div class="q sm">'+esc(q.t)+'</div>'+
    '<p class="hint" style="margin-top:6px">아래 설명은 둘 중 어느 쪽일까요?</p>'+
    '<div class="pline">'+q.line+'</div>'+
    '<div class="opts" id="op">'+
      '<button class="opt" data-s="a"><span class="k">1</span><span>'+q.an+'</span></button>'+
      '<button class="opt" data-s="b"><span class="k">2</span><span>'+q.bn+'</span></button>'+
    '</div><div id="fb"></div>'+
    (sc.n?'<p class="hint" style="margin-top:12px">이번 판 '+sc.ok+' / '+sc.n+'</p>':'')+
    '</div></div>';
  Array.prototype.forEach.call(document.querySelectorAll("#op .opt"),function(b){
    b.onclick=function(){
      if(answered)return; answered=true;
      var good=b.dataset.s===q.side;
      Array.prototype.forEach.call(document.querySelectorAll("#op .opt"),function(x){
        x.disabled=true;
        if(x.dataset.s===q.side)x.classList.add("ok");
        else if(x===b)x.classList.add("no");
      });
      /* 틀린 쪽은 비교표를 통째로 펴 준다 — 어디서 갈리는지 한 번에 보이게 */
      var c=q.c;
      document.getElementById("fb").innerHTML=
        '<div class="fb '+(good?"ok":"no")+'" style="margin-top:14px"><span class="ic">'+(good?"○":"×")+
        '</span><span>'+(good?"맞아요. "+esc(pname(q.side==="a"?q.an:q.bn))+" 쪽입니다."
                             :"아니에요. "+esc(pname(q.side==="a"?q.an:q.bn))+" 쪽입니다.")+'</span></div>'+
        (good?'':'<div class="cmp" style="margin-top:12px">'+
          '<div class="a"><h4>'+c.a.n+'</h4><ul>'+c.a.p.map(function(x){return "<li>"+x+"</li>";}).join("")+'</ul></div>'+
          '<div class="b"><h4>'+c.b.n+'</h4><ul>'+c.b.p.map(function(x){return "<li>"+x+"</li>";}).join("")+'</ul></div></div>')+
        '<div class="btn-row" style="margin-top:14px">'+
          '<button class="btn ghost" id="bStop">그만</button>'+
          '<button class="btn" id="bNext">다음 →</button></div>';
      document.getElementById("bNext").onclick=function(){done(good);};
      document.getElementById("bStop").onclick=quit;
    };
  });
}

/* ---------- 모드: 나 ---------- */
function viewMe(){
  var t=dayNo(),due=0,learned=0,total=0;
  poolFacts().concat(poolOx()).forEach(function(x){
    total++;var r=S.srs[x.id];
    if(r){if(r.b>=3)learned++;if(r.due<=t)due++;}
  });
  var acc=S.today.n?Math.round(S.today.ok/S.today.n*100):0;
  st().innerHTML=
    '<div class="card"><div class="card-b">'+
      '<div class="q sm">지금까지</div>'+
      '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px">'+
      stat("🔥 연속 학습",S.streak+"일")+stat("⭐ 누적 XP",S.xp)+
      stat("✅ 확실히 외운 것",learned+" / "+total)+stat("📥 오늘 복습 대기",due+"개")+
      stat("🎯 오늘 정답률",S.today.n?acc+"%":"–")+stat("📕 오답 노트",S.wrong.length+"개")+
      '</div></div></div>'+
    (S.wrong.length?'<button class="btn wide" id="bWrong">오답 노트 복습하기 ('+S.wrong.length+')</button>':'')+
    '<div class="sect">다른 앱으로</div>'+
    '<div class="tlsw" style="margin-bottom:14px">'+
      '<button class="btn ghost" data-hansa-go="learn">첫 수업</button>'+
      '<button class="btn ghost" data-hansa-go="mon">오답 몬스터</button>'+
    '</div>'+
    '<div class="sect">출제 범위</div>'+
    '<div class="card"><div class="card-b">'+
      '<div id="mePick"></div>'+
      '<p class="hint" style="margin-top:11px">켠 소단원에서만 문제가 나와요. 진도 나간 데까지만 켜 두면 아는 데서만 출제됩니다.</p>'+
    '</div></div>'+
    '<div class="sect">설정</div>'+
    '<div class="card"><div class="card-b">'+
      '<div class="setrow"><span>시험일 (D-day)</span><div><input type="date" id="iDday" value="'+(S.dday||"")+'"></div></div>'+
      '<div class="setrow"><span>하루 목표 문제 수</span><div><input type="number" id="iGoal" min="5" max="80" step="5" value="'+S.goal+'"></div></div>'+
      '<div class="setrow"><span>진도 초기화</span><div><button class="btn ghost" id="bReset" style="width:100%;padding:7px">전부 지우기</button></div></div>'+
    '</div></div>'+
    '<div class="card"><div class="card-b"><div class="q sm">이렇게 쓰면 제일 잘 외워져요</div>'+
      '<ol style="margin:12px 0 0 18px;color:var(--tx-2);font-size:14.5px;line-height:1.85">'+
      '<li><b style="color:var(--tx)">하루 한 번, 오늘 탭만</b> — 틀린 건 오늘 또, 맞힌 건 1 → 3 → 7 → 16일 뒤에 다시 나와요. 시험 전날 몰아치기보다 훨씬 오래 남습니다.</li>'+
      '<li><b style="color:var(--tx)">배운 소단원만 켜기</b> — 진도가 01단원까지면 세계사·무단 통치·문화 정치·민족 말살만 켜세요. 안 배운 데서 문제가 나오면 김이 샙니다.</li>'+
      '<li><b style="color:var(--tx)">이동 시간엔 O·X</b> — 교과서가 실제로 파고드는 함정만 모았어요. 문관 총독, 보통 경찰 인원, 복벽주의 같은 것들요.</li>'+
      '<li><b style="color:var(--tx)">시험 3일 전엔 치트키</b> — 두문자와 비교표만 훑어도 순서 문제와 헷갈림 문제를 잡을 수 있어요.</li>'+
      '<li><b style="color:var(--tx)">연표 정렬은 서술형 대비</b> — 순서를 알면 인과 관계가 보이고, 그게 서술형 점수가 됩니다.</li>'+
      '</ol></div></div>';
  if(S.wrong.length)document.getElementById("bWrong").onclick=function(){
    var bag=S.wrong.slice(),i=0;
    (function nx(){
      if(i>=bag.length){viewMe();return;}
      renderItem(makeItem(bag[i++]),nx);
    })();
  };
  drawPick("mePick");
  document.getElementById("iDday").onchange=function(){S.dday=this.value;save();paintTop();};
  document.getElementById("iGoal").onchange=function(){S.goal=Math.max(5,Math.min(80,+this.value||20));save();paintTop();};
  document.getElementById("bReset").onclick=function(){
    if(confirm("학습 기록을 전부 지울까요? 되돌릴 수 없어요."))
      {S=blank();save();paintTop();viewMe();}
  };
}
function stat(l,v){
  return '<div class="stat"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>';
}
function drawPick(id){
  var box=document.getElementById(id);if(!box)return;
  var html="";
  [[1,"교과서 Ⅰ단원 · 일제 식민 통치와 민족 운동"],[2,"그 밖의 단원 · 필요할 때만"]].forEach(function(g){
    html+='<div class="ugrp">'+g[1]+'</div><div class="upick">'+
      UNITS.filter(function(u){return u.g===g[0];}).map(function(u){
        return '<button class="uchip" data-u="'+u.id+'" aria-pressed="'+inScope(u.id)+
               '" title="'+u.name+'">'+u.short+'<small>'+u.bk+'</small></button>';
      }).join("")+'</div>';
  });
  box.innerHTML=html;
  Array.prototype.forEach.call(box.querySelectorAll(".uchip"),function(b){
    b.onclick=function(){
      var u=b.dataset.u,i=S.units.indexOf(u);
      if(i>=0){if(S.units.length>1)S.units.splice(i,1);}else S.units.push(u);
      save();drawPick("mePick");drawPick("railPick");paintTop();
      if(mode!=="me")go(mode);
    };
  });
}

/* ---------- HANSA OS 셸 ---------- */
var DOW=["SUN","MON","TUE","WED","THU","FRI","SAT"];
function tick(){
  var d=new Date(),h=d.getHours(),ap=h<12?"AM":"PM",hh=h%12||12;
  var el=document.getElementById("Sclk");
  if(el)el.textContent=DOW[d.getDay()]+" "+String(hh).padStart(2,"0")+":"+
    String(d.getMinutes()).padStart(2,"0")+ap+" "+d.getFullYear();
}
tick(); setInterval(tick,20000);

/* 독 아이콘 — 16×16 격자에 <rect> 를 찍어 그린 인라인 SVG */
function px(rects){
  return '<svg width="28" height="28" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">'+
    rects.map(function(r){return '<rect x="'+r[0]+'" y="'+r[1]+'" width="'+r[2]+'" height="'+r[3]+'" fill="'+r[4]+'"/>';}).join("")+'</svg>';
}
var K="#2B1F33",W="#FBF3E2",Y="#F5C63C",R="#D2453B",T="#2F8C7E",B="#3D6BB5",O="#E0812C";
var NICO={
  /* 과녁 = 오늘 */
  today:px([[2,2,12,12,K],[3,3,10,10,W],[5,5,6,6,K],[6,6,4,4,R],[7,7,2,2,W]]),
  /* 두루마리 = 연표 */
  time:px([[2,2,12,12,K],[3,3,10,10,W],[3,3,10,2,O],[5,7,6,1,K],[5,9,6,1,K],[5,11,4,1,K]]),
  /* 번개 = 퀴즈 */
  quiz:px([[2,2,12,12,K],[3,3,10,10,B],[9,3,3,5,Y],[6,6,4,4,Y],[4,8,5,5,Y]]),
  /* 열쇠 = 치트키 */
  cheat:px([[2,2,12,12,K],[3,3,10,10,W],[4,6,5,5,Y],[5,7,3,3,W],[9,7,4,2,Y],[11,9,1,2,Y]]),
  /* 막대그래프 = 나 */
  me:px([[2,2,12,12,K],[3,3,10,10,W],[4,9,2,4,R],[7,6,2,7,T],[10,4,2,9,B]])
};
/* ---------- 네비 ---------- */
var TABS=[["today","today","오늘"],["time","time","연표"],["quiz","quiz","퀴즈"],
          ["cheat","cheat","치트키"],["me","me","나"]];
var NPATH={today:"/TODAY",time:"/TIMELINE",quiz:"/QUIZ",cheat:"/CHEAT",me:"/ME"};
var mode="today";
function go(m){
  mode=m;combo=0;
  Array.prototype.forEach.call(document.querySelectorAll(".nb"),function(b){
    b.setAttribute("aria-current",String(b.dataset.m===m));
  });
  var wt=document.getElementById("SwinTtl"); if(wt)wt.textContent=NPATH[m]||"/";
  window.scrollTo({top:0,behavior:"instant"});
  if(m==="today")startToday();
  else if(m==="time")viewTimeline();
  else if(m==="quiz")startQuiz();
  else if(m==="cheat")viewCheat();
  else viewMe();
}

/* ---------- 부팅 ---------- */
load();
document.getElementById("Snav").innerHTML=TABS.map(function(t){
  return '<button class="nb" data-m="'+t[0]+'"><span class="g">'+NICO[t[1]]+'</span>'+t[2]+'</button>';
}).join("");
Array.prototype.forEach.call(document.querySelectorAll(".nb"),function(b){
  b.onclick=function(){go(b.dataset.m);};
});
document.getElementById("ScDday").onclick=function(){
  go("me");
  setTimeout(function(){var i=document.getElementById("iDday");if(i){i.scrollIntoView({block:"center"});i.focus();}},60);
};
drawPick("railPick");
paintTop();
go("today");


/* 셸이 부를 수 있게 홈으로 가는 길을 하나 내어 둔다 */
window.__hansaHome=window.__hansaHome||{};
window.__hansaHome.sprint=function(){ go("today"); };

})();
</script>
<script>
/* ══════════════════════════════════════════════════════════════
   셸 — 앱 갈아 끼우기
   두 앱은 정적 id 만 다르고 화면 안에서 만드는 id 는 겹칠 수 있다.
   그래서 쉬는 앱의 뿌리를 DOM 에서 떼어 둔다 — getElementById 가 못 찾는다.
   요소 참조는 살아 있으므로 다시 붙이면 그대로 이어진다.
   ══════════════════════════════════════════════════════════════ */
(function(){
  var HOLD={}, SLOT={};
  var APPS=[
    {k:"learn",el:document.getElementById("Lapp"),n:"첫 수업",
     ic:'<svg width="22" height="22" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="2" y="2" width="12" height="12" fill="#2B1F33"/><rect x="3" y="3" width="10" height="10" fill="#FBF3E2"/><rect x="7" y="3" width="2" height="10" fill="#2B1F33"/><rect x="4" y="5" width="3" height="1" fill="#2B1F33"/><rect x="9" y="5" width="3" height="1" fill="#2B1F33"/><rect x="4" y="7" width="3" height="1" fill="#2B1F33"/><rect x="9" y="7" width="3" height="1" fill="#2B1F33"/></svg>',
     key:"hansa-learn-v1"},
    {k:"mon",el:document.getElementById("Mapp"),n:"몬스터",
     ic:'<svg width="22" height="22" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="3" y="2" width="10" height="11" fill="#2B1F33"/><rect x="4" y="3" width="8" height="9" fill="#B79EEC"/><rect x="5" y="6" width="2" height="3" fill="#2B1F33"/><rect x="9" y="6" width="2" height="3" fill="#2B1F33"/><rect x="3" y="13" width="2" height="1" fill="#2B1F33"/><rect x="7" y="13" width="2" height="1" fill="#2B1F33"/><rect x="11" y="13" width="2" height="1" fill="#2B1F33"/></svg>',
     key:"hansa-monster-v1"},
    {k:"sprint",el:document.getElementById("Sapp"),n:"연표",
     ic:'<svg width="22" height="22" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="2" y="2" width="12" height="12" fill="#2B1F33"/><rect x="3" y="3" width="10" height="10" fill="#FBF3E2"/><rect x="3" y="3" width="10" height="2" fill="#E0812C"/><rect x="5" y="7" width="6" height="1" fill="#2B1F33"/><rect x="5" y="9" width="6" height="1" fill="#2B1F33"/><rect x="5" y="11" width="4" height="1" fill="#2B1F33"/></svg>',
     key:"hansa-sprint-v2"}
  ];
  APPS.forEach(function(a){
    SLOT[a.k]=document.createComment("app:"+a.k);
    a.el.parentNode.insertBefore(SLOT[a.k],a.el);
  });

  function badge(a){
    try{
      var S=JSON.parse(localStorage.getItem(a.key)||"{}");
      if(a.k==="learn"){
        var w=Object.keys(S.wrong||{}).length;
        var due=0,t=Math.floor(Date.now()/864e5);
        Object.keys(S.due||{}).forEach(function(id){ if(S.done&&S.done[id]&&S.due[id].at<=t)due++; });
        return w+due;
      }
      if(a.k==="sprint")return (S.wrong||[]).length;
      return Object.keys(S.monsters||{}).length;
    }catch(e){ return 0; }
  }

  var bar=document.getElementById("tsk");
  function paint(){
    bar.innerHTML=APPS.map(function(a){
      var n=badge(a);
      return '<button class="tb" data-k="'+a.k+'" aria-current="'+(window.__hansa===a.k)+'">'+
        '<span class="ic">'+a.ic+'</span>'+a.n+
        (n?'<span class="bdg">'+(n>99?"99":n)+'</span>':'')+'</button>';
    }).join("");
    Array.prototype.forEach.call(bar.querySelectorAll(".tb"),function(b){
      b.onclick=function(){ switchTo(b.dataset.k); };
    });
  }

  function switchTo(k){
    if(window.__hansa===k){
      /* 켜져 있는 앱을 다시 누르면 그 앱의 홈으로 */
      try{ window.__hansaHome&&window.__hansaHome[k]&&window.__hansaHome[k](); }catch(e){}
      window.scrollTo(0,0); paint(); return;
    }
    var prev=window.__hansa;
    if(prev){ try{ window.__hansaPause&&window.__hansaPause[prev]&&window.__hansaPause[prev](); }catch(e){} }
    window.__hansa=k;
    APPS.forEach(function(a){
      if(a.k===k){
        if(!a.el.parentNode)SLOT[a.k].parentNode.insertBefore(a.el,SLOT[a.k].nextSibling);
      }else if(a.el.parentNode){
        HOLD[a.k]=a.el; a.el.parentNode.removeChild(a.el);
      }
    });
    try{ localStorage.setItem("hansa-app",k); }catch(e){}
    try{ window.__hansaResume&&window.__hansaResume[k]&&window.__hansaResume[k](); }catch(e){}
    paint(); window.scrollTo(0,0);
  }
  window.__hansaSwitch=switchTo;
  /* 앱 안에 심어 둔 [data-hansa-go] 단추 — 어느 화면에서 눌러도 통한다 */
  document.addEventListener("click",function(e){
    var t=e.target,b=t&&t.closest&&t.closest("[data-hansa-go]");
    if(b){ e.preventDefault(); switchTo(b.getAttribute("data-hansa-go")); }
  });
  /* 앱 안에서 배지 숫자가 바뀌면 표시줄도 따라간다 */
  window.__hansaPaint=paint;
  setInterval(paint,4000);

  var DOW=["SUN","MON","TUE","WED","THU","FRI","SAT"];
  function tick(){
    var d=new Date(),h=d.getHours(),ap=h<12?"AM":"PM",hh=h%12||12;
    document.getElementById("clk").textContent=DOW[d.getDay()]+" "+
      String(hh).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+ap+" "+d.getFullYear();
  }
  tick(); setInterval(tick,20000);

  var last="learn";
  try{ last=localStorage.getItem("hansa-app")||"learn"; }catch(e){}
  window.__hansa=null;
  switchTo(APPS.some(function(a){return a.k===last;})?last:"learn");
})();
</script>
