 {t:"fact",y:1919,n:"교통국",b:"<b>통신 기관</b>이야. 정보를 모으고 분석하고 독립운동 자금을 모집했어. 특히 <b>이륭 양행</b>에 사무소를 둔 안동 교통국의 활약이 컸지.",
  why:"소식을 나르는 전용 조직이 필요했어.",
  so:"이륭 양행은 아일랜드계 영국인 조지 루이스 쇼가 운영하던 회사야. 아일랜드도 영국의 식민지였기에 한국 사정을 이해하고 도왔지."},
 {t:"compare",title:"이름이 헷갈리는 둘",l:{n:"연통제",p:["국내 <b>비밀 행정</b> 조직","군자금 조달","정부 문서 · 명령 전달"]},
  r:{n:"교통국",p:["<b>통신</b> 기관","정보 수집과 분석","<b>이륭 양행</b> 안동 교통국"]}},
 {t:"check",q:"이륭 양행에 사무소를 둔 조직은?",a:"교통국",hint:"소식을 나르는 쪽이야"},
 {t:"fact",y:1919,n:"독립 공채",b:"광복 후에 갚겠다고 약속하고 발행한 증서야. 국내는 물론 미주 동포에게도 팔았어.",
  why:"정부를 운영하려면 돈이 있어야 했으니까.",
  so:"들키면 큰 고초를 겪기에 불태우거나 가족조차 모르게 숨긴 경우가 많았어. 광복 후 1983년에야 상환이 시작됐는데 신청은 많지 않았대."},
 {t:"fact",y:1919,n:"구미 위원부",b:"<b>미국</b>에 설치해 대통령 이승만을 중심으로 외교 활동을 폈어.",
  why:"열강의 지지를 얻는 게 초기 임시 정부의 주요 전략이었어.",

 {t:"fact",y:1919,n:"독립신문과 사료집",b:"『독립신문』을 펴내 동포들에게 소식을 알렸고, 임시 사료 편찬회를 두어 『한일 관계 사료집』을 냈어.",
  why:"독립 의식을 높이고, 국제 사회에 한국 독립의 정당성을 알리려 했어.",
  so:"선전과 기록도 독립운동의 한 축이었어."},
 {t:"chain",title:"임시 정부를 굴린 네 가지",items:["연통제 — 국내 행정","교통국 — 통신 (이륭 양행)","독립 공채 — 자금","구미 위원부 — 외교 (미국)"]},

 {t:"pick",q:"구미 위원부가 설치된 곳은?",c:["미국","상하이"],a:0,e:"미국이야. 이승만을 중심으로 외교 활동을 벌였어."},
 {t:"check",pr:7,q:"대한민국 임시 정부의 통신 기관으로서 정보 수집과 분석, 독립운동 자금 모집의 역할을 하면서 연통제 활동을 보조한 기관은?",a:"교통국 — 선생님이 밑줄로 고친 문제야. 연통제는 비밀 행정 조직, 교통국은 그걸 돕는 통신 기관.",hint:"행정이 아니라 통신"},
 {t:"check",pr:7,q:"초기의 대한민국 임시 정부는 외교 활동에만 주력하고 무장 투쟁에는 관심이 없었다 — ○일까 ×일까?",a:"× — 국무원 아래 군무부를 두고, 직할 부대로 육군 주만 참의부 등을 편성했어.",hint:"군무부"}

 {q:"구미 위원부가 설치된 나라는?",c:["미국","중국","러시아","프랑스"],a:0,e:"이승만 중심의 외교 기관이야."},

{id:"L17",u:"s7",part:"나라를 다시 세우다",title:"흔들리다",sc:"fog",
 hook:"기대를 모으고 출발했지만 몇 년 만에 임시 정부는 흔들렸어. 왜 그랬는지, 그리고 어떻게 수습했는지가 이 레슨이야.",
 cards:[
 {t:"story",h:"세 가지가 겹쳤어",b:"① 연통제와 교통국이 일제에 발각돼 자금줄이 끊겼고 ② 외교 활동이 뚜렷한 성과를 내지 못했고 ③ 이승만이 국제 연맹에 위임 통치를 요청했던 사실이 알려져 신채호 등이 크게 반발했어."},
 {t:"fact",y:1923,n:"국민 대표 회의",b:"각계 독립운동 지도자가 모여 새 방향을 찾으려 했어. 그런데 <b>개조파</b>와 <b>창조파</b>로 갈려 대립하다 결렬됐지.",
  why:"노선 차이가 이미 너무 깊었어. 외교냐 무장 투쟁이냐, 민족주의냐 사회주의냐.",
  so:"많은 독립운동가가 떠나면서 임시 정부는 침체에 빠져."},
 {t:"compare",title:"개조파 vs 창조파",l:{n:"개조파",p:["임시 정부는 <b>민족의 대표 기관</b>","3·1 운동의 열망으로 출범했으니 정통성 인정","조직과 체제를 <b>개선</b>하자","→ 고쳐 쓰자"]},
  r:{n:"창조파",p:["상하이 임정의 계통을 이을 <b>이유 없다</b>","실제 독립운동에 맞는 <b>새 조직</b> 필요","→ 새로 만들자","결과: 대립 끝에 <b>결렬</b>"]}},
 {t:"check",q:"임시 정부를 고쳐 쓰자고 한 쪽은?",a:"개조파",hint:"'개조'라는 말 자체가 고친다는 뜻이야"},
 {t:"fact",y:1925,n:"이승만 탄핵",b:"미주 지역 자금을 독점하고 대통령 직무를 다하지 않았다는 이유로 탄핵됐어. 위임 통치 청원 문제도 컸지. 후임 제2대 대통령은 <b>박은식</b>이야.",
  why:"지도부가 제 역할을 못 하니 정리가 필요했어.",
  so:"임시 정부가 스스로 지도자를 갈아치울 수 있는 조직이었다는 뜻이기도 해."},
 {t:"fact",y:1925,n:"국무령 중심 체제",b:"헌법을 고쳐 대통령제에서 <b>국무령 중심의 집단 지도 체제</b>로 바꿨어. <b>이동녕</b>과 <b>김구</b>를 중심으로 조직을 다시 세웠지.",
  why:"한 사람에게 힘이 몰리는 구조가 문제였으니까.",
  so:"이 체제 아래에서 김구가 뒷날 한인 애국단을 만들어 침체를 뚫어 내게 돼."},
 {t:"chain",title:"위기와 수습",items:["연통제·교통국 발각 · 외교 성과 부진","국민 대표 회의(1923) — 개조파 vs 창조파","결렬 → 침체","이승만 탄핵, 박은식 취임(1925)","국무령 중심 집단 지도 체제(1925)"]},
 {t:"hint",k:"국(23) · 탄(25) → 곧이어 국무령",b:"<em>국</em>민 대표 회의 1923 → 이승만 <em>탄</em>핵 1925 → 같은 해 헌법을 고쳐 <em>국무령</em> 체제. 탄핵과 국무령은 한 묶음으로 외우자."},
 {t:"pick",q:"국민 대표 회의의 결과는?",c:["개조파와 창조파의 대립으로 결렬","임시 정부가 해산됨"],a:0,e:"결렬 후 많은 이가 떠나 침체에 빠졌지만 정부는 유지됐어."}
 ],
 quiz:[
 {q:"1923년 임시 정부의 방향을 논의한 회의는?",c:["국민 대표 회의","관민 공동회","만민 공동회","임시 의정원 회의"],a:0,e:"개조파와 창조파의 대립으로 결렬됐어."},
 {q:"임시 정부를 고쳐 쓰자고 주장한 쪽은?",c:["개조파","창조파","외교론자","무장 투쟁론자"],a:0,e:"창조파는 새 조직을 만들자고 했어."},
 {q:"이승만 탄핵 후 제2대 대통령이 된 사람은?",c:["박은식","김구","이동녕","안창호"],a:0,e:"『한국통사』를 쓴 역사학자이기도 해."},
 {q:"1925년 이승만 탄핵 직후 임시 정부가 바꾼 체제는?",c:["국무령 중심 집단 지도 체제","대통령 중심제","내각 책임제","주석 중심제"],a:0,e:"한 사람에게 권력이 몰리는 걸 막으려 했어."}
 ]},

{id:"L18",u:"s8",part:"총을 들다",title:"봉오동에서 청산리로",sc:"mountain",
 hook:"3·1 운동 뒤 '평화적으로는 안 되겠다'는 생각이 퍼졌어. 만주의 독립군이 일본 정규군과 정면으로 붙어 이긴 두 번의 싸움, 이건 반드시 구분해야 해.",
 cards:[
 {t:"story",h:"왜 만주였을까",b:"독립군은 국경 너머 만주와 연해주에 기지를 두고 수시로 압록강·두만강을 건너와 일본 군경을 공격했어. 위협을 느낀 일본군이 추격대를 편성해 두만강을 건너오면서 정면 대결이 벌어져."},
 {t:"fact",y:1920,n:"봉오동 전투",b:"<b>홍범도</b>의 대한 독립군, <b>안무</b>의 국민회군, <b>최진동</b>의 군무 도독부군이 연합했어. 일본군을 봉오동 골짜기로 유인한 뒤 미리 매복해 있다가 기습해 크게 이겼지. 1920년 6월이야.",
  why:"지형을 아는 쪽이 유리하다는 걸 알았거든.",
  so:"패배한 일제는 대규모 병력을 동원할 구실을 찾게 돼."},
 {t:"fact",y:1920,n:"훈춘 사건",b:"일제가 중국 마적을 매수해 훈춘의 일본 영사관을 공격하게 한 <b>자작극</b>이야.",
  why:"'우리 국민이 공격당했으니 군대를 보낸다'는 명분을 스스로 만든 거지.",
  so:"이 구실로 약 2만 명의 병력을 만주에 투입했어."},
 {t:"check",q:"일제가 만주 출병 구실을 만들려 꾸민 자작극은?",a:"훈춘 사건",hint:"중국 마적을 매수했어"},
 {t:"fact",y:1920,n:"청산리 대첩",b:"<b>김좌진</b>의 북로 군정서와 <b>홍범도</b>의 대한 독립군 등이 연합했어. <b>백운평</b> 전투를 시작으로 완루구·어랑촌·고동하 등 10여 차례를 싸워 일본군을 크게 격파했지. 1920년 10월이야.",
  why:"백두산 방향으로 이동하며 유리한 지점을 골라 반격했어.",
  so:"독립 전쟁사 최대의 승리야. 간도 한인들이 총알이 빗발치는 산으로 밥을 날라 준 덕도 컸어."},
 {t:"compare",title:"절대 헷갈리면 안 되는 둘",l:{n:"봉오동 전투 (1920. 6.)",p:["<b>홍범도</b>의 대한 독립군","+ 안무 국민회군, 최진동 군무 도독부군","골짜기로 <b>유인</b>해 매복 기습","→ 일제가 훈춘 사건 조작"]},
  r:{n:"청산리 대첩 (1920. 10.)",p:["<b>김좌진</b>의 북로 군정서 + 홍범도","<b>백운평</b>·어랑촌·고동하 등 10여 차례","독립 전쟁사 최대의 승리","→ 보복으로 간도 참변"]}},
 {t:"hint",k:"봉-홍 / 청-김",b:"<em>봉</em>오동은 <em>홍</em>범도, <em>청</em>산리는 <em>김</em>좌진. 둘 다 ㅇ·ㅎ / ㅊ·ㄱ 로 짝지어 외워. 홍범도는 둘 다 참여했다는 것도 기억해 두면 좋아."},
 {t:"pick",q:"청산리 대첩의 첫 전투는?",c:["백운평 전투","봉오동 전투"],a:0,e:"백운평을 시작으로 어랑촌·고동하 등 10여 차례를 싸웠어."}
 ],
 quiz:[
 {q:"봉오동 전투를 이끈 인물은?",c:["홍범도","김좌진","지청천","양세봉"],a:0,e:"안무·최진동 부대와 연합했어."},
 {q:"일제가 만주 출병 구실로 조작한 사건은?",c:["훈춘 사건","제암리 사건","자유시 참변","간도 참변"],a:0,e:"중국 마적을 매수한 자작극이야."},
 {q:"청산리 대첩의 주력 부대는?",c:["북로 군정서","대한 독립군","조선 혁명군","한국 독립군"],a:0,e:"김좌진이 이끌었고 중광단에서 발전한 부대야."},
 {q:"청산리 대첩에 포함되지 않는 전투는?",c:["봉오동 전투","백운평 전투","어랑촌 전투","고동하 전투"],a:0,e:"봉오동은 그 넉 달 전 별개의 전투야."}
 ]},

{id:"L19",u:"s8",part:"총을 들다",title:"두 번의 참변, 그리고 3부",sc:"snow",
 hook:"승리 뒤에 곧바로 비극이 왔어. 이름이 비슷한 두 참변, 가해자가 서로 달라. 이것만 구분하면 이 레슨은 끝이야.",
 cards:[
 {t:"fact",y:1920,n:"간도 참변",b:"일제가 독립군의 근거지를 없앤다는 구실로 서너 달에 걸쳐 간도의 한인 마을을 불태우고 수많은 한인을 학살했어.",
  why:"청산리 대첩에 대한 <b>보복</b>이었어.",
  so:"가해자는 <b>일본군</b>이야. 독립군을 도운 민간인을 겨냥한 학살이었지."},
 {t:"fact",y:1921,n:"자유시 참변",b:"간도의 독립군 4천여 명이 밀산에 모였다가 레닌의 지원을 기대하며 러시아 <b>자유시</b>로 옮겨 갔어. 그런데 부대를 통합하는 과정에서 지휘권을 둘러싼 분쟁이 일어났고, 지휘권 양도를 거부한 독립군을 러시아 <b>적군</b>이 무장 해제하면서 많은 이가 희생됐지.",
  why:"여러 부대가 모였는데 누가 지휘하느냐를 정하지 못했어.",
  so:"가해자는 <b>러시아 적군</b>이야. 원인은 <b>지휘권 분쟁</b>이고. 간도 참변과 바꿔 내는 문제가 정말 많아."},
 {t:"compare",title:"가해자가 다르다",l:{n:"간도 참변 (1920)",p:["가해자: <b>일본군</b>","구실: 독립군 근거지 제거","청산리 대첩에 대한 보복","한인 마을 방화 · 민간인 학살"]},
  r:{n:"자유시 참변 (1921)",p:["가해자: 러시아 <b>적군</b>","배경: 밀산 집결 → 자유시 이동","원인: <b>지휘권</b> 분쟁","무장 해제 과정에서 희생"]}},
 {t:"check",q:"자유시 참변의 가해자는?",a:"러시아 적군",hint:"일본군이 아니야. 그게 함정이지"},
 {t:"fact",y:1924,n:"3부의 성립",b:"두 참변으로 큰 타격을 입은 독립군이 전열을 가다듬고 부대를 통합했어. 남만주에 <b>참의부</b>, 지린성 일대에 <b>정의부</b>, 북만주에 <b>신민부</b>가 세워졌지.",
  why:"흩어져서는 버틸 수 없었으니까.",
  so:"신민부는 자유시에서 돌아온 독립군이 중심이 됐어."},
 {t:"fact",y:1925,n:"3부의 성격",b:"민정 조직과 군정 조직을 함께 갖췄어. 관할 구역 한인들에게 세금을 걷어 운영한 사실상의 <b>공화주의 자치 정부</b>였지.",
  why:"동포 사회를 지키면서 군대도 길러야 했으니까.",
  so:"단순한 부대가 아니라 '정부'였다는 게 핵심이야."},
 {t:"fact",y:1925,n:"미쓰야 협정",b:"조선 총독부 경무 국장 미쓰야가 만주 <b>군벌</b>과 맺은 협정이야. 한국인 독립운동가를 체포해 일본 경찰에 넘기도록 했지.",
  why:"일본군이 직접 못 잡으니 중국 쪽 손을 빌린 거야.",
  so:"중국 관헌이 독립운동가를 잡아 넘기고 포상금을 받으면서 만주 독립운동이 크게 위축됐어."},
 {t:"fact",y:1929,n:"3부 통합 운동",b:"위기를 넘으려 3부를 합치려 했지만 방법을 두고 의견이 갈려 완전한 통합에는 이르지 못했어. 남만주의 <b>국민부</b>와 북만주의 <b>혁신 의회</b>로 재편됐지.",
  why:"미쓰야 협정으로 활동이 막히자 뭉쳐야 했어.",
  so:"국민부는 조선 혁명당을 만들고 그 아래 <b>조선 혁명군</b>을, 혁신 의회는 해체된 뒤 한국 독립당으로 이어져 <b>한국 독립군</b>을 편성해."},
 {t:"hint",k:"참(남) · 정(지린) · 신(북)",b:"<em>참</em>의부 남만주, <em>정</em>의부 지린, <em>신</em>민부 북만주. 그리고 통합은 <em>국민부</em>(남)와 <em>혁신 의회</em>(북) 둘로 갈렸다고 기억해."},
 {t:"pick",q:"간도 참변의 가해자는?",c:["일본군","러시아 적군"],a:0,e:"간도는 일본군, 자유시는 러시아 적군이야."}
 ],
 quiz:[
 {q:"청산리 대첩에 대한 보복으로 일어난 사건은?",c:["간도 참변","자유시 참변","훈춘 사건","미쓰야 협정"],a:0,e:"일본군이 간도의 한인을 학살했어."},
 {q:"자유시 참변의 직접적 원인은?",c:["지휘권을 둘러싼 분쟁","일본군의 기습","식량 부족","중국군의 배신"],a:0,e:"러시아 적군이 무장 해제하는 과정에서 희생됐어."},
 {q:"3부에 해당하지 않는 것은?",c:["국민부","참의부","정의부","신민부"],a:0,e:"국민부는 3부 통합 운동의 결과로 나온 조직이야."},
 {q:"1925년 조선 총독부가 만주 군벌과 맺은 협정은?",c:["미쓰야 협정","가쓰라·태프트 밀약","기유각서","한일 의정서"],a:0,e:"독립운동가를 체포해 넘기도록 했어."}
 ]},

{id:"L20",u:"s8",part:"총을 들다",title:"손을 잡다",sc:"twohand",
 hook:"무장 독립 전쟁의 마지막 이야기야. 일본이 만주를 삼키자 중국도 발등에 불이 떨어졌어. 그래서 한국 독립군과 중국군이 손을 잡게 돼. 지휘관 두 명과 전투 이름만 짝지으면 끝나.",
 cards:[
 {t:"story",h:"왜 손을 잡았을까",b:"1931년 만주 사변, 이듬해 만주국 수립. 중국 안에서 일본에 대한 반감이 치솟았어. 적이 같아진 거지. 그래서 만주에서 활동하던 독립군이 항일 중국군과 연합해 싸우게 돼."},
 {t:"fact",y:1932,n:"조선 혁명군 — 양세봉",b:"<b>양세봉</b>이 이끄는 조선 혁명군(국민부 계열)이 <b>남만주</b>에서 중국 의용군과 힘을 합쳤어. <b>영릉가 전투</b>(1932)에서 일본군을 물리치고 영릉가성을 점령했고, <b>흥경성 전투</b>(1933)에서도 싸웠지.",
  why:"국민부가 남만주를 기반으로 했거든.",
  so:"양세봉이 전사한 뒤 세력이 약해졌지만 1930년대 후반까지 투쟁을 이어 갔어."},
 {t:"fact",y:1933,n:"한국 독립군 — 지청천",b:"<b>지청천</b>이 이끄는 한국 독립군(혁신 의회 계열)이 <b>북만주</b>에서 중국군과 연합했어. <b>쌍성보</b>(1932), <b>동경성</b>(1933), <b>대전자령</b>(1933) 전투에서 승리했지.",
  why:"혁신 의회가 북만주를 기반으로 했어.",
  so:"뒤에 임시 정부의 요청으로 중국 관내로 옮겨 갔고, 지청천은 <b>한국광복군</b> 창설을 주도하게 돼."},
 {t:"compare",title:"이 표만 외우면 끝",l:{n:"조선 혁명군",p:["총사령관 <b>양세봉</b>","모체: 국민부 → 조선 혁명당","활동: <b>남</b>만주","<b>영</b>릉가(32) · <b>흥</b>경성(33)"]},
  r:{n:"한국 독립군",p:["총사령관 <b>지청천</b>","모체: 혁신 의회 → 한국 독립당","활동: <b>북</b>만주","<b>쌍</b>성보(32) · <b>동</b>경성 · <b>대</b>전자령(33)"]}},
 {t:"check",q:"대전자령 전투를 이끈 지휘관은?",a:"지청천",hint:"북만주의 한국 독립군이야"},
 {t:"fact",y:1936,n:"동북 항일 연군",b:"중국 공산당이 만주의 항일 유격대를 모아 <b>동북 인민 혁명군</b>(1933)을 만들었고, 여기에 많은 한인 사회주의자가 참여했어. 이 부대가 1936년에 <b>동북 항일 연군</b>으로 발전해.",
  why:"사회주의 계열도 항일이라는 목표는 같았어.",
  so:"소속 한인 유격대원들은 민족주의자와 함께 <b>조국 광복회</b>를 조직했어(1936)."},
 {t:"chain",title:"만주 무장 투쟁 전체 흐름",items:["봉오동(1920.6) · 청산리(1920.10)","간도 참변 · 자유시 참변","3부 성립(1920년대 중반)","미쓰야 협정(1925) → 3부 통합 운동(1920년대 후반)","국민부 → 조선 혁명군 (양세봉)","혁신 의회 → 한국 독립군 (지청천)","한중 연합 작전 · 동북 항일 연군"]},
 {t:"hint",k:"양-남-영흥 / 지-북-쌍동대",b:"<em>양</em>세봉은 <em>남</em>만주에서 <em>영</em>릉가·<em>흥</em>경성. <em>지</em>청천은 <em>북</em>만주에서 <em>쌍</em>성보·<em>동</em>경성·<em>대</em>전자령. 이름 첫 글자로 묶으면 안 헷갈려."},
 {t:"pick",q:"영릉가 전투를 이끈 부대는?",c:["조선 혁명군","한국 독립군"],a:0,e:"양세봉의 조선 혁명군이야. 지청천의 한국 독립군은 쌍성보·동경성·대전자령."}
 ],
 quiz:[
 {q:"한중 연합 작전이 활발해진 계기는?",c:["만주 사변","중일 전쟁","청산리 대첩","미쓰야 협정"],a:0,e:"일본이 만주를 침략하자 중국 내 반감이 커졌어."},
 {q:"조선 혁명군의 총사령관은?",c:["양세봉","지청천","김좌진","홍범도"],a:0,e:"남만주에서 영릉가·흥경성 전투를 이끌었어."},
 {q:"대전자령 전투를 승리로 이끈 부대는?",c:["한국 독립군","조선 혁명군","북로 군정서","대한 독립군"],a:0,e:"지청천이 이끄는 한국 독립군이야."},
 {q:"동북 항일 연군 소속 한인들이 민족주의자와 함께 만든 조직은?",c:["조국 광복회","조선 혁명당","한국 독립당","신간회"],a:0,e:"1936년에 조직됐어."}
 ]},

{id:"L21",u:"s9",part:"다른 방식으로 싸우다",title:"폭탄에 담은 뜻",sc:"bomb",
 hook:"3·1 운동 뒤에도 일제는 꿈쩍하지 않았어. 그러자 몇몇은 생각했어. 적의 심장부를 직접 치면 어떨까? 폭탄 한 발로 온 민족의 뜻을 보여 주려던 사람들, 의열단 이야기야.",
 cards:[
 {t:"story",h:"외교도 준비도 믿을 수 없다면",b:"파리 강화 회의에 기대를 걸었지만 성과가 없었어. 실력을 기르자는 쪽은 시간이 너무 걸린다고 봤고. 그래서 <b>침략의 원흉을 직접 처단하고 식민 통치 기관을 부수자</b>는 흐름이 생겨. 이걸 <b>의열 투쟁</b>이라고 해."},
 {t:"fact",y:1919,n:"강우규의 의거",b:"1919년 가을, 60대의 <b>강우규</b>가 경성 <b>남대문역</b>에서 새로 부임하는 총독에게 폭탄을 던졌어. 이건 어떤 단체의 거사가 아니라 <b>개인 의열 투쟁</b>이야.",
  why:"3·1 운동을 짓밟은 통치의 책임자를 겨냥했어.",
  so:"총독은 무사했지만 수십 명이 다쳤고, 강우규는 사형을 선고받았어. 한 사람의 결단이 얼마나 큰 울림을 주는지 보여 준 사건이야."},
 {t:"fact",y:1919,n:"의열단",b:"1919년 11월 <b>김원봉</b>·윤세주 등이 만주 <b>지린</b>에서 비밀 조직을 만들었어. 이름은 '정의로운 일을 맹렬히 실행한다'는 뜻. 다섯 가지 파괴 대상과 일곱 가지 암살 대상을 정해 두었지.",
  why:"감시와 탄압을 피하려고 비밀 조직으로 움직였어.",
  so:"조선 총독부·동양 척식 주식회사·경찰서 같은 식민 통치 기관, 그리고 총독·고관·친일파·밀정이 표적이 됐어."},
 {t:"fact",y:1921,n:"김익상의 의거",b:"의열단원 <b>김익상</b>이 국내로 몰래 들어와 식민 통치의 심장인 <b>조선 총독부</b>에 폭탄을 던졌어.",
  why:"식민 지배의 최고 기관을 직접 치겠다는 뜻이었어.",
  so:"일제의 간담을 서늘하게 만들고, 독립 의지가 꺾이지 않았다는 걸 널리 알렸어."},
 {t:"fact",y:1923,n:"조선 혁명 선언",b:"김원봉의 부탁으로 <b>신채호</b>가 쓴 글이야. '외교'와 '준비'라는 헛된 꿈을 버리고 <b>민중 직접 혁명</b>으로 강도 일본을 몰아내자고 했어.",
  why:"외교론과 실력 양성론으로는 독립이 안 된다고 봤거든.",
  so:"이 선언이 의열단의 <b>활동 지침</b>이 됐어. 시험에 '다음 선언을 지침으로 삼은 단체'가 나오면 답은 의열단이야."},
 {t:"fact",y:1923,n:"김상옥의 의거",b:"의열단원 <b>김상옥</b>이 독립운동가를 잡아들이던 <b>종로 경찰서</b>에 폭탄을 던졌어.",
  why:"독립운동 탄압의 최전선이 경찰서였기 때문이야.",
  so:"독립운동가를 잡아 가두던 곳을 직접 쳤다는 점에서 상징성이 컸어."},
 {t:"fact",y:1926,n:"나석주의 의거",b:"의열단원 <b>나석주</b>가 토지 수탈의 앞잡이였던 <b>동양 척식 주식회사</b>에 폭탄을 던지고 권총을 쏘아 일본인들을 살상했어.",
  why:"동척은 토지 조사 사업 이후 땅을 빼앗아 가던 대표적 수탈 기관이었어.",
  so:"신문이 '근래 전례 없는 중대 사건'이라고 보도할 만큼 큰 충격을 줬어."},
 {t:"check",q:"의열단의 활동 지침이 된 글과 그 글을 쓴 사람은?",a:"조선 혁명 선언 — 신채호",hint:"'민중 직접 혁명'을 외친 글이야"},
 {t:"chain",title:"의열단이 겨눈 곳",items:["<b>김익상</b> → 조선 총독부 (1921)","<b>김상옥</b> → 종로 경찰서 (1923)","<b>나석주</b> → 동양 척식 주식회사 (1926)","(개인 의거) <b>강우규</b> → 남대문역의 새 총독 (1919)"]},
 {t:"hint",k:"익-총 · 상-종 · 석-동",b:"김<em>익</em>상은 <em>총</em>독부, 김<em>상</em>옥은 <em>종</em>로 경찰서, 나<em>석</em>주는 <em>동</em>척. 강우규는 의열단이 아니라는 것도 같이 외워 두자."},
 {t:"pick",q:"동양 척식 주식회사에 폭탄을 던진 의열단원은?",c:["나석주","김상옥"],a:0,e:"나석주야(1926). 김상옥은 종로 경찰서."},
 {t:"fact",pr:9,y:1920,n:"박재혁·최수봉의 의거",b:"결성 이듬해인 1920년, 의열단원 <b>박재혁</b>은 <b>부산 경찰서</b>에, <b>최수봉</b>은 <b>밀양 경찰서</b>에 폭탄을 던졌어.",why:"의열단은 경찰서 같은 식민 통치 기관을 파괴 대상으로 정해 두었어.",so:"프린트 표의 의열단 의거는 모두 여섯 — 박재혁·최수봉(1920), 김익상(1921), 김상옥(1923), 김지섭(1924), 나석주(1926)."},
 {t:"fact",pr:9,y:1924,n:"김지섭의 의거",b:"의열단원 <b>김지섭</b>이 일본 도쿄의 <b>일본 왕궁</b>에 폭탄을 던졌어.",why:"국내를 넘어 일본의 한복판까지 겨눈 거야.",so:"이봉창(1932, 도쿄, 일왕의 마차)과 헷갈리기 쉬워. 김지섭은 <b>의열단</b>, 이봉창은 <b>한인 애국단</b>."},
 {t:"fact",pr:9,y:1928,n:"조명하의 의거",b:"<b>조명하</b>가 <b>타이완</b>(타이중)에서 <b>일본 왕족</b>을 처단했어. 강우규처럼 단체가 아닌 <b>개인 의열 투쟁</b>이야.",why:"식민지 타이완까지 건너가 일본 왕족을 겨눴어.",so:"프린트는 강우규(1919)와 조명하(1928)를 '개인 의열 투쟁'으로 따로 묶어 뒀어. 의열단원 사이에 섞어 내는 함정에 주의!"},
 {t:"chain",pr:9,title:"프린트 표로 다시 보는 의열 투쟁",items:["<b>의열단</b>(1919) — 만주, 김원봉. 지침은 신채호의 「조선 혁명 선언」(민중 직접 혁명)","→ <b>소수 인원, 적은 비용</b>으로 암살·파괴 활동","→ 박재혁 부산 경찰서 · 최수봉 밀양 경찰서 (1920)","→ 김익상 조선 총독부 (1921) · 김상옥 종로 경찰서 (1923)","→ 김지섭 일본 왕궁 (1924) · 나석주 동양 척식 주식회사 (1926)","→ <b>개인 폭력 투쟁의 한계</b> → 황푸 군관 학교 · 조선 혁명 간부 학교","따로: 개인 의열 투쟁 — 강우규(1919, 총독 마차) · 조명하(1928, 타이완)"]},
 {t:"hint",pr:9,k:"부-박 · 밀-최 · 왕-지섭",b:"<em>부</em>산은 <em>박</em>재혁, <em>밀</em>양은 <em>최</em>수봉 — 둘 다 1920. 일본 <em>왕</em>궁은 김<em>지섭</em>(1924). 앞에서 외운 '익-총 · 상-종 · 석-동'과 합치면 의열단 여섯 명 끝."},
 {t:"pick",pr:9,q:"타이완에서 일본 왕족을 처단한 인물은?",c:["조명하","김지섭"],a:0,e:"조명하(1928)야. 김지섭은 일본 왕궁에 폭탄을 던진 의열단원(1924)."}
 ],
 quiz:[
 {q:"의열단을 조직한 인물과 장소로 옳은 것은?",c:["김원봉 — 만주 지린","김구 — 상하이","신채호 — 베이징","윤봉길 — 도쿄"],a:0,e:"1919년 만주 지린에서 김원봉·윤세주 등이 조직했어."},
 {q:"「조선 혁명 선언」이 비판한 독립운동 방법은?",c:["외교론과 실력 양성론","무장 투쟁","민중 직접 혁명","의열 투쟁"],a:0,e:"외교와 준비를 헛된 꿈이라고 하고 민중 직접 혁명을 주장했어."},
 {q:"조선 총독부에 폭탄을 던진 의열단원은?",c:["김익상","나석주","이봉창","강우규"],a:0,e:"1921년 김익상의 의거야."},
 {q:"강우규의 남대문역 의거에 대한 설명으로 옳은 것은?",c:["단체에 속하지 않은 개인 의열 투쟁이었다.","의열단의 첫 거사였다.","한인 애국단이 계획하였다.","일왕을 겨냥하였다."],a:0,e:"1919년 새로 부임하는 총독을 겨냥한 개인 의거야."}
 ]},

{id:"L22",u:"s9",part:"다른 방식으로 싸우다",title:"김구의 마지막 카드",sc:"flag",
 hook:"1920년대 후반, 임시 정부는 거의 멈춰 서 있었어. 돈도 사람도 없었지. 그때 김구가 꺼낸 카드가 한인 애국단이야. 그리고 한 청년이 던진 폭탄이 중국 전체를 움직여.",
 cards:[
 {t:"story",h:"개인의 폭탄에서 조직의 군대로",b:"의열단은 폭탄을 던질수록 한계도 느꼈어. 한 사람이 희생해도 일제는 무너지지 않았거든. 그래서 방향을 바꿔 <b>정규 군사 훈련</b>을 받기로 해. 한편 상하이의 임시 정부는 <b>국민 대표 회의</b>가 깨진 뒤 침체에 빠져 있었어."},
 {t:"fact",y:1926,n:"황푸 군관 학교 입교",b:"1920년대 후반 의열단원들이 중국 국민당 정부가 운영하던 <b>황푸 군관 학교</b>에 들어가 정규 군사 훈련을 받았어.",
  why:"<b>개인 의열 투쟁</b>의 한계를 느끼고 조직적인 무장 투쟁으로 가려 했거든.",
  so:"의열단이 테러 조직에서 군사 조직으로 바뀌어 가는 출발점이야."},
 {t:"fact",y:1931,n:"한인 애국단",b:"국민 대표 회의 결렬 뒤 침체한 임시 정부에 활기를 불어넣으려고 <b>김구</b>가 조직했어. 만주 사변으로 독립운동 형편이 더 나빠진 때였지.",
  why:"큰 거사로 임시 정부의 존재를 세계에 다시 알려야 했어.",
  so:"이봉창과 윤봉길이 이 단체의 이름으로 거사에 나서."},
 {t:"fact",y:1932,n:"이봉창의 의거",b:"1932년 1월 한인 애국단의 첫 거사. <b>이봉창</b>이 <b>도쿄</b>에서 일왕의 마차를 향해 폭탄을 던졌어.",
  why:"일본의 한가운데서 일왕을 노린 거야.",
  so:"거사는 실패했지만 일본에 큰 충격을 줬어."},
 {t:"fact",y:1932,n:"상하이 사변",b:"일제가 이봉창 의거를 보도한 <b>중국 언론</b>의 반일적 태도 등을 구실로 상하이를 침략했어.",
  why:"만주 침략에 쏠린 세계의 눈을 돌리려는 속셈도 있었어.",
  so:"상하이를 점령한 일본군이 승리 기념식을 열게 되고, 그 자리가 윤봉길 의거의 무대가 돼."},
 {t:"fact",y:1932,n:"윤봉길의 의거",b:"1932년 4월 <b>윤봉길</b>이 상하이 <b>훙커우 공원</b>의 전승 기념식 겸 일왕 생일 축하식 단상에 폭탄을 던져 일본군 장성과 고관을 처단했어.",
  why:"상하이 사변의 승리를 자축하는 자리였어.",
  so:"<b>중국 국민당 정부가 한국 독립운동을 적극 지원</b>하는 계기가 됐고, 한중 공동 항일 전선의 바탕이 됐어."},
 {t:"fact",y:1932,n:"조선 혁명 간부 학교",b:"의열단이 중국 국민당 정부의 지원을 받아 세운 학교로, 독립군 간부를 길러 냈어.",
  why:"황푸에서 배운 군사 훈련을 우리 손으로 이어 가려 했어.",
  so:"여기서 길러진 사람들이 뒤에 민족 혁명당과 <b>조선 의용대</b>로 이어져."},
 {t:"compare",title:"이 둘을 섞으면 틀린다",l:{n:"의열단 (1919)",p:["<b>김원봉</b>","만주 <b>지린</b>","지침: 「조선 혁명 선언」","김익상·김상옥·나석주"]},
  r:{n:"한인 애국단 (1931)",p:["<b>김구</b>","<b>상하이</b>","목적: 임시 정부에 활기","이봉창·윤봉길"]}},

 {t:"pick",q:"한인 애국단을 조직한 사람은?",c:["김구","김원봉"],a:0,e:"김구야. 김원봉은 의열단."},

{id:"L23",u:"s10",part:"힘을 기르자",title:"힘부터 기르자",sc:"factory",
 hook:"독립은 당장 어렵다. 그렇다면 그날을 위해 경제와 교육부터 키우자. 1920년대 국내에서는 이런 생각이 퍼졌어. 쌀 대신 국산품, 총 대신 대학. 그리고 한쪽은 아예 일제와 타협하는 길로 빠지기도 해.",
 cards:[
 {t:"story",h:"외교가 막히자 나온 생각",b:"워싱턴 회의에서도 한국 문제는 다뤄지지 않았어. '당분간 독립은 어려우니 교육과 산업과 문화에 힘써 <b>실력을 길러야 한다</b>'는 주장이 퍼졌지. 이게 <b>실력 양성 운동</b>이야."},
 {t:"fact",y:1920,n:"물산 장려 운동",b:"<b>조만식</b>의 주도로 평양에서 시작해 전국으로 퍼졌어. '<b>내 살림 내 것으로</b>', '<b>조선 사람 조선 것</b>'을 외치며 토산품 애용, 근검저축, 금주·단연을 주장했지.",
  why:"조선 총독부가 한국과 일본 사이의 관세를 없애려 하자, 값싼 일본 상품에 민족 산업이 무너질까 봐 위기를 느꼈어.",
  so:"처음엔 큰 호응을 얻어 토산품 애용 의식을 심어 줬어."},
 {t:"fact",y:1923,n:"물산 장려 운동에 대한 비판",b:"수요는 느는데 공급이 따라가지 못하고 상인의 농간까지 겹쳐 <b>토산품 값이 폭등</b>했어. 일부 <b>사회주의자</b>는 자본가 계급의 이익만 챙기는 운동이라고 비판했지.",
  why:"노동자는 원래부터 무명옷 입고 살았는데 이제 와서 국산품을 쓰자는 건 자본가만 좋은 일이라는 거야.",
  so:"물산 장려 운동은 기대만큼 성과를 거두지 못했어."},
 {t:"fact",y:1923,n:"민립 대학 설립 운동",b:"<b>이상재</b>·이승훈 등이 <b>조선 민립 대학 기성회</b>를 만들고 1천만 원을 모으려 전국 모금 운동을 벌였어. 한국인의 손으로 대학을 세우자는 거였지.",
  why:"'문화 정치'라면서도 한국인에게 고등 교육의 기회는 거의 없었어.",
  so:"자연재해로 모금이 저조했고 일제가 <b>정치 운동</b>이라며 탄압해서 성과를 거두지 못했어."},
 {t:"compare",title:"산업이냐 교육이냐",l:{n:"물산 장려 운동",p:["<b>조만식</b> · 평양","토산품 애용·근검저축·금주·단연","계기: 관세 철폐 움직임","한계: 값 폭등, 사회주의자 비판"]},
  r:{n:"민립 대학 설립 운동",p:["<b>이상재</b> · 조선 민립 대학 기성회","'교육이 아니면 아니 된다'","1천만 원 모금","한계: 자연재해, 일제의 탄압"]}},
 {t:"fact",y:1929,n:"문자 보급 운동",b:"<b>『조선일보』</b>가 '<b>아는 것이 힘, 배워야 산다</b>'를 구호로 한글 교재를 나눠 주고 전국 순회강연을 열었어.",
  why:"수탈 속에서 농민은 가난했고 배울 기회도 없었어. 글을 모르면 속기 쉬웠지.",
  so:"언론이 앞장선 <b>농촌 계몽 운동</b>의 한 줄기야."},
 {t:"fact",y:1931,n:"브나로드 운동",b:"<b>『동아일보』</b>가 벌인 농촌 계몽 운동. 브나로드는 러시아어로 '<b>민중 속으로</b>'라는 뜻이야. 학생과 청년이 농촌에 가서 글을 가르치고 미신 타파와 근검절약을 강조했어.",
  why:"방학마다 학생들을 농촌으로 보내 문맹을 없애려 했어.",
  so:"문자 보급 운동과 함께 문맹 퇴치에 큰 역할을 했어."},
 {t:"fact",y:1924,n:"자치 운동",b:"실력 양성 운동이 성과를 못 내자 <b>이광수</b>·최린·김성수 등이 일제의 지배를 <b>인정하고</b> 그 안에서 자치권과 참정권을 얻자고 나섰어.",
  why:"'문화 정치'에 기대를 걸고 조선 의회를 세울 수 있다고 봤어.",
  so:"아무 성과 없이 일제의 <b>민족 분열 정책에 이용만</b> 당했어. 이렇게 일제와 손잡으려는 쪽을 <b>타협적</b> 민족주의라고 불러."},
 {t:"check",q:"브나로드 운동을 벌인 신문사는?",a:"동아일보",hint:"조선일보는 문자 보급 운동이야"},
 {t:"chain",title:"실력 양성 운동의 흐름",items:["외교 노력이 성과를 못 냄","→ 산업: <b>물산 장려 운동</b>(1920~)","→ 교육: <b>민립 대학 설립 운동</b>(1923)","→ 문맹 퇴치: 문자 보급(1929) · 브나로드(1931)","→ 성과 부족 → 일부가 <b>자치 운동</b>(타협)으로"]},
 {t:"hint",k:"물 · 민 · 문 / 조문동브",b:"실력 양성은 <em>물</em>산 장려 · <em>민</em>립 대학 · <em>문</em>맹 퇴치. 신문사는 <em>조</em>선일보 = <em>문</em>자 보급, <em>동</em>아일보 = <em>브</em>나로드."},
 {t:"pick",q:"'내 살림 내 것으로'를 외친 운동은?",c:["물산 장려 운동","민립 대학 설립 운동"],a:0,e:"조만식이 이끈 물산 장려 운동이야."},
 {t:"hint",pr:10,po:1,k:"한민족 1천만이 한 사람 1원씩",b:"프린트에만 나오는 <em>민립 대학 설립 운동</em>의 구호야. 교과서는 '1천만 원을 모으려 했다'고만 적었어. 1천만 명이 1원씩 = 1천만 원. 이 구호가 보이면 답은 민립 대학 설립 운동."},
 {t:"check",pr:10,q:"물산 장려 운동은 나라 빚을 갚자는 취지로 대구에서 시작되었다 — ○일까 ×일까?",a:"× — 그건 국채 보상 운동이야. 물산 장려 운동은 평양에서 조만식의 주도로 시작했어.",hint:"평양 · 조만식 · 토산품"},
 {t:"check",pr:10,q:"자치 운동의 성과로 일제가 조선 의회 설립을 허용하였다 — ○일까 ×일까?",a:"× — 아무 성과도 없었고 일제의 민족 분열 정책에 이용만 당했어.",hint:"타협의 결과는?"}
 ],

 {q:"물산 장려 운동을 주도한 인물은?",c:["조만식","이상재","이광수","방정환"],a:0,e:"평양에서 시작했어."},
 {q:"민립 대학 설립 운동이 실패한 까닭으로 옳은 것은?",c:["모금 부진과 일제의 탄압","사회주의자의 반대","자치 운동의 방해","신간회의 해소"],a:0,e:"자연재해로 모금이 저조했고 일제가 정치 운동이라며 탄압했어."},
 {q:"문자 보급 운동을 벌인 신문사는?",c:["조선일보","동아일보","매일신보","독립신문"],a:0,e:"'아는 것이 힘, 배워야 산다'."},

 ]},

{id:"L24",u:"s11",part:"힘을 기르자",title:"소작료와 총파업",sc:"field",
 hook:"수확의 절반이 넘게 지주에게 가고, 일본인의 절반도 안 되는 임금을 받던 사람들. 농민과 노동자는 살기 위해 싸우기 시작했어. 그런데 그 싸움이 점점 항일 투쟁으로 바뀌어 가.",
 cards:[
 {t:"story",h:"생존권이 흔들리다",b:"토지 조사 사업과 산미 증식 계획으로 많은 농민이 소작농이 됐어. 소작료는 수확의 <b>50%가 넘었고</b> 지주가 낼 세금까지 떠안았지. 노동자는 일본인 노동자의 <b>절반도 안 되는 임금</b>을 받으며 오래 일하고 차별까지 당했어."},
 {t:"fact",y:1923,n:"암태도 소작 쟁의",b:"전남 암태도의 농민들이 70~80%의 소작료를 요구하는 <b>지주</b>에 맞서 1년여를 싸웠어. 목포 법원까지 건너가 투쟁한 끝에 <b>소작료 인하</b>를 따냈지.",
  why:"고율의 소작료가 농민의 삶을 짓누르고 있었어.",
  so:"1920년대 소작 쟁의의 대표 사례가 돼."},
 {t:"fact",y:1927,n:"조선 농민 총동맹",b:"사회주의 운동의 영향으로 농민 조합이 활발히 만들어지면서 결성된 <b>전국적 농민 운동 단체</b>야.",
  why:"흩어진 농민 조합을 하나로 묶어 힘을 키우려 했어.",
  so:"1920년대 후반 소작 쟁의 건수와 참여 농민이 크게 늘어."},
 {t:"fact",y:1927,n:"조선 노동 총동맹",b:"노동 쟁의가 크게 늘어나면서 만들어진 <b>전국 규모의 노동 운동 단체</b>야. 노동자들은 임금 인상, 노동 시간 단축, 작업 환경 개선을 요구했어.",
  why:"사회주의 사상이 퍼지며 노동자의 계급 의식과 민족의식이 함께 높아졌어.",
  so:"쟁의가 격렬해질수록 경찰 탄압도 세졌고, 노동 쟁의는 점점 <b>항일 투쟁</b>으로 바뀌어 갔어."},
 {t:"fact",y:1929,n:"원산 총파업",b:"원산의 석유 회사에서 일본인 감독이 한국인 노동자를 <b>구타</b>한 일이 계기였어. 회사가 약속을 어기자 원산 노동자 전체가 총파업에 들어가 <b>4개월여</b> 버텼지.",
  why:"감독 파면과 근무 조건 개선이라는 요구를 회사가 무시하고 탄압했어.",
  so:"국내외 노동 단체가 전보와 돈을 보내 지원했어. 일제 강점기 <b>최대 규모의 노동 운동</b>이자 반제국주의 항일 운동이야."},
 {t:"compare",title:"농민의 싸움 vs 노동자의 싸움",l:{n:"암태도 소작 쟁의 (1923)",p:["<b>농민</b>","고율 소작료를 요구하는 <b>지주</b>에 맞섬","1년여 투쟁","결과: 소작료 인하"]},
  r:{n:"원산 총파업 (1929)",p:["<b>노동자</b>","일본인 감독의 <b>구타</b>가 계기","4개월여 지속, 국내외 지원","일제 강점기 최대 노동 운동"]}},
 {t:"fact",y:1931,n:"혁명적 농민·노동 조합",b:"1930년대 <b>대공황</b>으로 삶이 더 어려워지자 농민과 노동자가 사회주의 세력과 손잡고 <b>혁명적 농민 조합·혁명적 노동조합</b>을 만들었어. '토지를 농민에게!', '일본 제국주의 타도!'를 외쳤지.",
  why:"합법적인 쟁의로는 아무것도 바뀌지 않는다고 봤어.",
  so:"쟁의는 <b>비합법적 폭력 투쟁</b>으로 바뀌었어. 하지만 중일 전쟁 뒤 일제의 강력한 탄압으로 위축돼."},
 {t:"check",q:"1920년대와 1930년대 농민·노동 운동은 어떻게 달라졌나?",a:"생존권 투쟁에서 비합법적 반제국주의 항일 투쟁으로 급진화했다.",hint:"대공황 뒤에 '혁명적'이란 말이 붙었어"},

 {t:"hint",k:"암-농-소작료 · 원-노-총파업",b:"<em>암</em>태도는 <em>농</em>민이 소작료로, <em>원</em>산은 <em>노</em>동자가 총파업으로. '암농 원노'로 붙여 외우자."},
 {t:"pick",q:"일제 강점기 최대 규모의 노동 운동은?",c:["원산 총파업","암태도 소작 쟁의"],a:0,e:"1929년, 4개월여 이어졌어."},
 {t:"check",pr:11,q:"소작농이 지주 대신 떠안은 비용에는 무엇이 있었을까? 그리고 소작 쟁의에서는 무엇을 요구했을까?",a:"지세, 수리 조합비, 종자·비료 대금 등을 떠안았어. 그래서 소작료 인하와 소작권 이동 반대를 요구했지.",hint:"세금 · 물 · 씨앗과 거름"},
 {t:"check",pr:11,q:"1930년대 농민·노동 운동은 생존권 투쟁 형태로 확산되었다 — ○일까 ×일까?",a:"× — 생존권 투쟁은 1920년대. 1930년대엔 혁명적 조합을 중심으로 반제국주의 항일 투쟁이 됐어.",hint:"20년대 → 30년대로 어떻게 바뀌었지?"}
 ],

 {q:"암태도 소작 쟁의의 결과로 옳은 것은?",c:["소작료 인하를 이끌어 냈다.","조선 노동 총동맹이 해체되었다.","자치권을 얻었다.","민립 대학이 세워졌다."],a:0,e:"1년여 투쟁 끝에 이겼어."},

 {q:"1930년대 농민·노동 운동의 특징으로 옳은 것은?",c:["혁명적 조합을 만들어 비합법 투쟁을 벌였다.","일제와 타협해 자치를 요구하였다.","합법 단체인 신간회에만 의지하였다.","중일 전쟁 뒤 더 활발해졌다."],a:0,e:"대공황 뒤 급진화했고, 중일 전쟁 뒤에는 탄압으로 위축됐어."},

{id:"L25",u:"s12",part:"다시 만세를",title:"교실에서 거리로",sc:"school",
 hook:"'일본의 우월함만 가르치고 조선인은 반드시 망한다고 말하는 교사.' 1920년대 학생들은 이런 교실을 거부했어. 동맹 휴학으로 시작한 싸움이 두 번의 큰 만세 운동으로 번져.",
 cards:[
 {t:"story",h:"학교가 곧 억압이었다",b:"3·1 운동에서 스스로가 항일 투쟁의 주체라는 걸 깨달은 청년과 학생들은 단체를 만들어 움직였어. 학생들은 식민지 교육에 맞서 <b>동맹 휴학</b>을 벌였고, 등교 거부·수업 거부가 점점 거리 시위로 커졌지."},
 {t:"fact",y:1924,n:"조선 청년 총동맹",b:"여러 청년 단체의 활동을 <b>통일적</b>으로 이끌려고 결성된 조직이야.",
  why:"청년 단체들이 덕·체·지의 수양, 민중 계몽, 계급 해방 등 제각각 활동하고 있었어.",
  so:"청년·학생 운동이 한층 조직적으로 움직이는 바탕이 됐어."},
 {t:"fact",y:1926,n:"6·10 만세 운동",b:"마지막 황제 <b>순종</b>이 세상을 떠나자 사회주의 계열(조선 공산당)과 천도교, 학생 단체가 만세 시위를 준비했어. 계획이 미리 들켰지만 학생들은 <b>장례일인 6월 10일</b> 서울 곳곳에서 격문을 뿌리고 만세를 외쳤지.",
  why:"3·1 운동이 고종의 장례를 계기로 일어난 것처럼, 순종의 장례가 다시 기회가 됐어.",
  so:"전국으로 크게 퍼지진 못했지만, 준비 과정에서 <b>사회주의 계열과 민족주의 계열이 손잡은 경험</b>이 민족 협동 전선(신간회)의 공감대를 만들었어."},
 {t:"fact",y:1926,n:"성진회",b:"1926년 광주에서 학생들이 만든 비밀 결사야. 곧 해산됐지만 참여 학생들이 학교마다 비밀리에 <b>독서회</b>를 만들어 이어 갔어.",
  why:"드러내 놓고 활동하면 바로 잡혀갔으니까.",
  so:"이 독서회 조직이 광주 학생 항일 운동을 확산시키는 통로가 돼."},
 {t:"fact",y:1929,n:"광주 학생 항일 운동",b:"1929년 10월 <b>나주역</b>에서 일본인 남학생이 한국인 여학생을 희롱해 한·일 학생 사이에 충돌이 일어났어. 경찰과 언론이 일본인 학생 편만 들자 광주 학생들이 <b>11월 3일</b> 대규모 시위를 벌였지.",
  why:"민족 차별에 쌓였던 분노가 터진 거야.",
  so:"<b>신간회</b>가 진상을 알리면서 전국으로, 만주까지 번졌어. <b>3·1 운동 이후 최대 규모</b>의 항일 민족 운동이야."},
 {t:"compare",title:"두 번의 학생 만세",l:{n:"6·10 만세 운동 (1926)",p:["계기: <b>순종</b>의 장례","사회주의 계열 + 천도교 준비","사전 발각, 학생 중심 시위","의의: 좌우 연대 → 신간회로"]},
  r:{n:"광주 학생 항일 운동 (1929)",p:["계기: <b>나주역</b> 한·일 학생 충돌","독서회로 확산","<b>신간회</b> 진상 조사단","3·1 이후 최대 규모"]}},
 {t:"check",q:"3·1 운동과 6·10 만세 운동의 계기를 각각 말해 봐.",a:"3·1 운동은 고종의 서거, 6·10 만세 운동은 순종의 장례.",hint:"두 황제의 장례야"},
 {t:"chain",title:"학생 항일 운동의 흐름",items:["3·1 운동에서 주체로 자각","→ 동맹 휴학 · 조선 청년 총동맹(1924)","→ <b>6·10 만세 운동</b>(1926) — 좌우 연대 경험","→ 성진회 · 독서회 (비밀 조직)","→ <b>광주 학생 항일 운동</b>(1929) — 신간회 지원, 전국 확산"]},
 {t:"hint",k:"고3·1 / 순6·10 / 나주광주",b:"<em>고</em>종 → <em>3·1</em>, <em>순</em>종 → <em>6·10</em>, <em>나주</em>역 → <em>광주</em>. 황제 두 명과 역 하나."},
 {t:"pick",q:"신간회가 진상 조사단을 보낸 운동은?",c:["광주 학생 항일 운동","6·10 만세 운동"],a:0,e:"1929년 광주 학생 항일 운동이야. 신간회는 1927년에 생겼으니 1926년 6·10 때는 아직 없었어."},
 {t:"check",pr:12,q:"6·10 만세 운동의 의의 두 가지는?",a:"민중에게 구체적인 항일 투쟁 지침을 제시했고, 민족 협동 전선을 만들어야 한다는 공감대를 만들었어(→ 신간회).",hint:"지침, 그리고 좌우 연대"}
 ],
 quiz:[
 {q:"6·10 만세 운동의 계기는?",c:["순종의 장례","고종의 서거","나주역 충돌","관동 대지진"],a:0,e:"1926년 순종의 장례일에 일어났어."},
 {q:"6·10 만세 운동의 의의로 옳은 것은?",c:["좌우 연대의 경험이 민족 협동 전선의 공감대를 만들었다.","임시 정부 수립의 계기가 되었다.","무단 통치를 문화 통치로 바꾸었다.","전국으로 확산되어 3·1 운동보다 커졌다."],a:0,e:"사회주의 계열과 천도교가 함께 준비했어."},
 {q:"광주 학생 항일 운동이 전국으로 퍼지는 데 도움을 준 단체는?",c:["신간회","의열단","한인 애국단","조선 형평사"],a:0,e:"진상 조사단을 보내고 민중 대회를 추진했어."},
 {q:"광주 학생 항일 운동 확산의 통로가 된 학생 조직은?",c:["독서회","근우회","형평사","천도교 소년회"],a:0,e:"성진회 출신 학생들이 학교마다 독서회를 만들었어."}

{id:"L26",u:"s13",part:"다시 만세를",title:"좌우가 손잡다",sc:"twohand",
 hook:"새와 조개가 싸우는 사이 어부가 둘 다 잡아간다. 1920년대 신문 만평이야. 민족주의와 사회주의가 다투면 웃는 건 일제라는 거지. 그래서 둘이 손을 잡았어. 그게 신간회야.",
 cards:[
 {t:"story",h:"갈라진 두 진영",b:"3·1 운동 뒤 민족 운동은 <b>민족주의</b>와 <b>사회주의</b> 두 갈래로 나뉘어 방법과 이념을 두고 다퉜어. 게다가 민족주의 안에서도 자치 운동 같은 <b>타협</b> 세력이 나왔지. 이대로는 안 된다는 목소리가 커졌어."},
 {t:"fact",y:1924,n:"제1차 국공 합작",b:"중국의 <b>국민당과 공산당</b>이 손을 잡았어.",
  why:"이념이 달라도 공동의 적 앞에서는 힘을 합칠 수 있다는 걸 보여 줬어.",
  so:"국내외 <b>민족 유일당 운동</b>에 영향을 줬어. 국외에서는 베이징에서 한국 독립 유일당 촉성회가, 만주에서는 3부 통합 운동이 일어나."},
 {t:"fact",y:1926,n:"정우회 선언",b:"치안 유지법으로 탄압받던 <b>사회주의</b> 진영이 6·10 만세 운동 뒤 '민족주의 세력과 적극 제휴하자'고 선언했어.",
  why:"민족주의자와 손잡으면 <b>합법적</b>으로 활동할 공간이 생겼거든.",
  so:"이상재·안재홍 같은 <b>비타협적</b> 민족주의자와 연대할 길이 열렸어."},
 {t:"fact",y:1927,n:"신간회",b:"비타협적 민족주의자와 사회주의자가 함께 만든 <b>합법</b> 단체야. 2년여 만에 약 <b>140개</b> 지회, 4만여 명 회원을 둔 일제 강점기 <b>최대 규모</b>의 항일 단체가 됐어. 강령은 '<b>기회주의를 일체 부인함</b>'.",
  why:"'기회주의'란 일제와 타협하는 자치 운동을 가리켜.",
  so:"강연회를 열고 한국인 본위 교육, 착취 기관 철폐를 주장하며 소작·노동 쟁의와 동맹 휴학을 지원했어."},
 {t:"fact",y:1929,n:"신간회의 진상 조사단 파견",b:"광주 학생 항일 운동이 일어나자 신간회가 진상 조사단을 보내고 대규모 <b>민중 대회</b>를 준비했어.",
  why:"일제가 보도를 막고 학생들을 구속하고 있었어.",
  so:"민중 대회는 열리지 못했고 집행부 대부분이 구속되는 큰 타격을 입었어."},
 {t:"fact",y:1931,n:"신간회 해소",b:"새 집행부가 타협론자와 손잡으려는 태도를 보이고, 국제 공산주의 운동도 민족주의와의 협력을 부정하는 쪽으로 바뀌었어. 결국 사회주의자들이 <b>전체 대회</b>를 열어 해소를 결정했지.",
  why:"'해소'는 없애는 게 아니라 다른 운동으로 바꾼다는 뜻으로 썼어.",
  so:"좌우 연대가 무너졌어. 사회주의 계열은 혁명적 농민·노동 조합으로, 비타협적 민족주의 계열은 문화·학술 활동으로 갔어."},
 {t:"compare",title:"이름이 비슷한 두 단체",l:{n:"신민회 (1907)",p:["안창호·양기탁","<b>비밀 결사</b>","국외 독립운동 기지","105인 사건으로 해체"]},
  r:{n:"신간회 (1927)",p:["좌우 합작","<b>합법</b> 단체, 최대 규모","광주 학생 운동 진상 조사단","1931 스스로 해소"]}},

 {t:"chain",title:"신간회가 생기고 사라지기까지",items:["좌우 대립 + 타협 세력 등장","→ 제1차 국공 합작(1924)의 영향","→ 6·10 만세 운동의 연대 경험","→ <b>정우회 선언</b>(1926)","→ <b>신간회</b> 창립(1927) · 자매 단체 근우회","→ 광주 학생 운동 지원(1929) → 탄압","→ <b>해소</b>(1931)"]},

{id:"L27",u:"s14",part:"달라진 세상",title:"경성의 두 얼굴",sc:"city",
 hook:"전차가 다니고 백화점이 들어선 경성. 그런데 그 편리함은 누구 것이었을까? 같은 도시 안에 일본인 거리와 한국인 거리가 따로 있었고, 변두리엔 움막이 늘어섰어. 나라 밖으로 떠난 사람들은 더 큰 고난을 겪었지.",
 cards:[
 {t:"story",h:"식민지 도시화",b:"철도역이 생긴 <b>대전·신의주</b>, 일본으로 쌀을 실어 내던 항구 <b>군산·목포</b>, 공업화 정책으로 커진 <b>함흥·청진</b>. 도시가 이렇게 자랐어. 하지만 도시 안은 <b>한국인 거주지와 일본인 거주지로 나뉘었고</b>, 수도·전기·도로는 일본인 쪽에 몰렸지. 비용은 한국인이 내고 편리함은 일본인이 누렸어."},
 {t:"fact",y:1924,n:"「운수 좋은 날」",b:"현진건의 소설이야. <b>인력거꾼</b> 김 첨지가 모처럼 돈을 벌어 설렁탕을 사 왔지만 아픈 아내는 이미 숨진 뒤였어.",
  why:"인력거꾼의 한 달 수입이 네 식구 최소 생활비에도 못 미쳤대.",
  so:"비싼 물가와 주택난에 시달린 가난한 도시민의 모습을 보여 줘. 도시 곳곳엔 극빈자의 <b>토막촌</b>이 생겼고, 종종 강제로 철거됐어."},
 {t:"fact",y:1926,n:"영화 「아리랑」",b:"<b>나운규</b>가 각본·주연·감독을 맡아 크게 흥행했어. 흑백 무성 영화라 장면을 풀어 주는 <b>변사</b>가 배우만큼 인기였지.",
  why:"1920~1930년대 신문·잡지·영화·라디오로 대중문화가 퍼졌어.",
  so:"하지만 영화는 일제의 검열로 잘리기도 했고 정책 선전에 쓰이기도 했어. 서양식 옷을 입은 '모던 걸·모던 보이'도 이때 등장해."},
 {t:"fact",y:1932,n:"농촌 진흥 운동",b:"대공황으로 농민이 몰락하고 소작 쟁의가 격해지자 일제가 '생활 개선'을 내세워 벌인 운동이야.",
  why:"농민의 불만이 항일 투쟁으로 번지는 걸 막으려 했어.",
  so:"근본 문제는 그대로 두고 농촌 <b>통제</b>를 강화했어. 가난의 책임을 농민에게 돌리며 절약·저축·근면만 강조했지.",tk:"rule"},
 {t:"check",q:"일제 강점기 농민이 몰락해 된 사람들을 세 가지 말해 봐.",a:"소작농, 화전민, 도시 빈민인 토막민 (만주·연해주·일본으로 이주하기도 함)",hint:"산으로, 도시로, 나라 밖으로"},
 {t:"fact",y:1923,n:"관동 대지진 한국인 학살",b:"도쿄 부근에 대지진이 일어나자 일본 당국과 언론이 '조선인이 불을 지른다'는 <b>유언비어</b>를 퍼뜨렸어. 일본인 자경단 등이 재일 한국인 <b>6,000명 이상</b>을 학살했지.",
  why:"지진으로 생긴 사회 불안을 한국인 탓으로 돌리려 했어.",
  so:"나라 잃은 사람들이 타국에서 겪은 고난을 가장 참혹하게 보여 주는 사건이야."},
 {t:"fact",y:1937,n:"연해주 한인 강제 이주",b:"<b>소련</b>이 연해주에 살던 한국인 수십만 명을 약 6,000km 떨어진 <b>중앙아시아</b>로 강제로 옮겼어. 추위와 굶주림, 전염병으로 많은 사람이 목숨을 잃었지.",
  why:"일본과 전쟁이 나면 한국인이 일본에 협력할 거라는 구실이었어.",
  so:"이들의 후손이 오늘날의 <b>고려인</b>이야. 가해자가 일본이 아니라 소련이라는 게 시험 포인트!",tk:"world"},
 {t:"chain",title:"국외 이주 동포의 세 가지 고난",items:["<b>간도</b> — 간도 참변(1920), 일본군의 한인 마을 초토화","<b>일본</b> — 관동 대지진 학살(1923), 유언비어","<b>중앙아시아</b> — 연해주 한인 강제 이주(1937), 소련"]},
 {t:"hint",k:"간-일군 · 관-유언비어 · 연-소련",b:"<em>간</em>도 참변은 <em>일</em>본군, <em>관</em>동 대지진은 <em>유언비어</em>, <em>연</em>해주 강제 이주는 <em>소련</em>. 가해자를 헷갈리게 내는 게 단골 함정이야."},
 {t:"pick",q:"연해주 한인을 중앙아시아로 강제 이주시킨 나라는?",c:["소련","일본"],a:0,e:"1937년 소련이야."},
 {t:"chain",pr:13,title:"의식주의 변화",items:["<b>의</b> — 서양식 옷차림과 단발이 늘었어","→ 중일 전쟁 뒤 일제가 남성에게 <b>국민복</b>, 여성에게 <b>몸뻬</b>를 강요","<b>식</b> — 양식 · 일식 · 중식이 대중화, 배달 음식(설렁탕 · 냉면)도 늘었어","<b>주</b> — <b>도시형 한옥</b>(벽돌 · 유리) · <b>문화 주택</b>(서양식 + 일본식, 비싸서 사기 어려움)"]},
 {t:"hint",pr:13,k:"축 · 레 · 라 → 대중가요",b:"<em>축</em>음기 · <em>레</em>코드 · <em>라</em>디오가 퍼지면서 <em>대중가요</em>가 인기를 끌었어. 영화는 나운규의 「아리랑」 — 하지만 일제의 검열을 받았고 정책 선전 수단으로도 쓰였지."},
 {t:"pick",pr:13,q:"중일 전쟁 이후 일제가 여성에게 입도록 강요한 작업복은?",c:["몸뻬","국민복"],a:0,e:"몸뻬야. 국민복은 남성에게 강요했어."}
 ],
 quiz:[
 {q:"일제 강점기 도시의 모습으로 옳은 것은?",c:["한국인 거주지와 일본인 거주지가 구분되었다.","기반 시설은 한국인 거주지에 집중되었다.","토막촌이 생기지 않았다.","도시 인구가 줄었다."],a:0,e:"수도·전기·도로는 일본인 거주지에 잘 갖춰졌어."},
 {q:"군산·목포가 항구 도시로 성장한 까닭은?",c:["일본으로 쌀을 반출하던 창구였기 때문","공업화 정책의 중심지였기 때문","철도역이 들어섰기 때문","임시 정부가 있었기 때문"],a:0,e:"대전·신의주는 철도, 함흥·청진은 공업 도시야."},
 {q:"농촌 진흥 운동에 대한 설명으로 옳은 것은?",c:["농촌 통제를 강화하고 빈곤의 책임을 농민에게 돌렸다.","소작료를 크게 낮추었다.","동아일보가 주도한 계몽 운동이다.","조선 형평사가 벌였다."],a:0,e:"1930년대 일제가 벌인 운동이야."},
 {q:"관동 대지진 때 한국인 학살이 일어난 곳은?",c:["일본","간도","연해주","중앙아시아"],a:0,e:"1923년 도쿄 부근이야."}
 ]},

{id:"L28",u:"s15",part:"달라진 세상",title:"저울처럼 평등하게",sc:"scale",
 hook:"나라를 잃은 설움에 더해, 여성이라서, 아이라서, 백정 출신이라서 받는 차별이 있었어. 1920년대에는 이 차별을 없애자는 운동이 한꺼번에 일어나. 여성 운동, 소년 운동, 형평 운동이야.",
 cards:[
 {t:"story",h:"이중의 차별",b:"여성은 취학률이 낮고 임금은 남성의 절반 수준이었어. 어린이는 독립된 인격체가 아니라 어른에게 딸린 존재로 여겨졌지. 백정은 갑오개혁으로 신분제가 없어진 뒤에도 호적에 표시가 남아 학교 입학이나 취업에서 차별을 받았어."},
 {t:"fact",y:1923,n:"조선 형평사",b:"백정들이 뜻을 같이하는 사람들과 <b>진주</b>에서 창립했어. '형평(衡平)'은 <b>저울처럼 평등</b>하다는 뜻이야.",
  why:"일제가 호적에 직업을 '도한'으로 적거나 붉은 점을 찍어 백정 신분이 드러나게 했어.",
  so:"전국으로 조직을 넓혔고, 다른 사회 운동 단체와 연대해 항일 민족 운동도 벌였어."},
 {t:"fact",y:1923,n:"어린이날 제정",b:"천도교는 '어린아이를 때리지 말라, 한울님을 때리는 것'이라는 최시형의 뜻을 이어 소년 운동을 펼쳤어. <b>방정환</b>은 '어린이'라는 말을 널리 알리고 천도교 소년회를 이끌며 어린이날 제정에 앞장섰지.",
  why:"아이들을 온전한 인격체로 존중해야 한다고 봤어.",
  so:"잡지 『<b>어린이</b>』도 펴냈어."},
 {t:"fact",y:1927,n:"근우회",b:"<b>신간회</b> 결성을 계기로 민족주의 계열과 사회주의 계열의 여성 단체가 통합해 만들었어. '조선 여자의 공고한 단결', '조선 여자의 지위 향상'이 강령이야.",
  why:"신간회처럼 여성 운동도 좌우가 힘을 합쳐야 한다고 봤어.",
  so:"기관지 『근우』를 펴내고 강연회·야학으로 여성 계몽에 힘썼어. 행동 강령엔 조혼 폐지, 임금 차별 철폐가 들어 있었지."},
 {t:"fact",y:1927,n:"조선 소년 연합회",b:"소년 운동이 퍼지면서 만들어진 <b>전국</b> 조직이야.",
  why:"흩어진 소년 단체를 하나로 묶으려 했어.",
  so:"일제는 1930년대에 소년 운동을 민족 운동으로 보고 탄압했고, 중일 전쟁 뒤엔 어린이날 행사까지 모두 금지했어."},
 {t:"check",q:"근우회는 어떤 단체의 자매 단체라고 불릴까?",a:"신간회",hint:"같은 1927년, 같은 좌우 합작"},
 {t:"chain",title:"세 갈래 대중 운동",items:["<b>여성 운동</b> — 신여성 등장 → 근우회(1927)","<b>소년 운동</b> — 천도교 소년회, 방정환 → 어린이날 · 『어린이』","<b>형평 운동</b> — 백정 차별 → 조선 형평사(1923, 진주)"]},
 {t:"hint",k:"여 근 · 소 방 · 형 진",b:"<em>여</em>성은 <em>근</em>우회, <em>소</em>년은 <em>방</em>정환, <em>형</em>평은 <em>진</em>주. 세 글자씩 짝지어 외우자."},
 {t:"pick",q:"조선 형평사가 창립된 곳은?",c:["진주","평양"],a:0,e:"1923년 진주야. 평양은 물산 장려 운동이 시작된 곳."},
 {t:"hint",pr:14,po:1,k:"근우회 = 여성계의 민족 유일당",b:"프린트는 근우회를 '<em>신간회의 자매단체</em>(여성계 민족 유일당)'로 정리했어. 활동은 기관지 『근우』, <em>국내외 지회</em>, 강연회 · <em>부인 강좌</em> · 야학. 목표는 여성 계몽과 지위 · 권리 향상."},
 {t:"check",pr:14,q:"여성 운동이 일어난 배경 — 여성은 어떤 차별을 받았을까?",a:"가부장적 인습이 남았고 일제가 차별을 법으로 규정했어. 취학률이 낮고 임금은 남성의 절반 수준, 재산 상속과 친권 행사에서도 차별받았어.",hint:"집안, 법, 학교, 일터"}
 ],
 quiz:[
 {q:"형평 운동이 없애려 한 차별은?",c:["백정에 대한 차별","여성에 대한 차별","어린이에 대한 차별","노동자에 대한 차별"],a:0,e:"형평 = 저울처럼 평등."},
 {q:"근우회에 대한 설명으로 옳은 것은?",c:["민족주의·사회주의 계열 여성 단체가 통합해 만들었다.","방정환이 조직하였다.","진주에서 창립되었다.","물산 장려 운동을 주도하였다."],a:0,e:"신간회 결성을 계기로 1927년에 창립됐어."},
 {q:"잡지 『어린이』를 펴내고 어린이날 제정에 앞장선 인물은?",c:["방정환","조만식","이상재","한용운"],a:0,e:"천도교 소년회를 이끌었어."},
 {q:"중일 전쟁 이후 소년 운동은 어떻게 되었나?",c:["모든 활동이 금지되었다.","전국 조직으로 커졌다.","신간회와 통합되었다.","임시 정부로 옮겨 갔다."],a:0,e:"일제가 어린이날 행사까지 금지했어."}
 ]},

{id:"L29",u:"s16",part:"지켜야 할 것들",title:"역사를 지키는 싸움",sc:"book",
 hook:"총과 칼만 전쟁이 아니었어. 일제는 '너희 역사는 원래 남에게 휘둘리고, 발전도 없고, 싸움만 했다'고 가르쳤지. 그 거짓말과 싸운 학자들이 있었어. 역사를 지키면 나라를 되찾을 수 있다고 믿은 사람들이야.",
 cards:[
 {t:"story",h:"역사를 왜 비틀었을까",b:"일제는 식민 지배를 합리화하려고 한국사를 연구하고 왜곡했어. 한국인의 독립 의지를 꺾으려면 스스로의 역사를 부끄럽게 여기게 만드는 게 가장 확실했거든. 이렇게 만든 게 <b>식민 사관</b>이야."},
 {t:"fact",y:1925,n:"조선사 편수회",b:"조선 총독부에 딸린 기구로, <b>식민 사관</b>에 따라 『조선사』를 펴냈어. 식민 사관은 세 가지야 — <b>타율성론</b>(외세에 휘둘렸다), <b>정체성론</b>(발전 없이 멈춰 있었다), <b>당파성론</b>(단결 못 한다).",
  why:"한국사의 자율적·주체적 발전을 부정해 식민 지배를 정당화하려 했어.",
  so:"이 주장에 맞서 여러 갈래의 한국사 연구가 나와.",tk:"rule"},
 {t:"fact",y:1915,n:"박은식",b:"'조선 <b>국혼</b>'을 강조한 민족주의 사학자야. 『<b>한국통사</b>』로 일제의 침략 과정을, 『<b>한국독립운동지혈사</b>』로 민족의 독립운동사를 정리했어.",
  why:"나라는 빼앗겨도 역사·말·풍속 속의 '혼'이 살아 있으면 반드시 독립한다고 믿었어.",
  so:"<b>민족주의 사학</b>의 대표 학자야. 임시 정부 제2대 대통령이기도 해."},
 {t:"fact",y:1931,n:"신채호의 고대사 연구",b:"<b>고대사</b> 연구에 힘을 쏟아 『<b>조선상고사</b>』, 『조선사연구초』를 썼어. 의열단의 「조선 혁명 선언」을 쓴 그 신채호야.",
  why:"고대사에서 민족의 자주성과 정신을 찾으려 했어.",
  so:"박은식과 함께 민족주의 사학을 세웠어."},
 {t:"fact",y:1934,n:"조선학 운동",b:"<b>정인보</b> 등이 '문화가 살면 민족은 죽지 않는다'는 신념으로 1930년대 중반에 펼쳤어. 전통 사상과 문화의 독자성을 탐구했고, 특히 조선 후기 <b>실학</b> 연구에 성과를 냈지.",
  why:"민족 말살 정책이 거세지자 문화로 민족의 주체성을 지키려 했어.",
  so:"정약용의 글을 모은 『여유당전서』도 이 운동으로 펴냈어."},
 {t:"fact",y:1933,n:"백남운의 사회 경제 사학",b:"<b>백남운</b>은 마르크스의 유물 사관을 바탕으로 『조선사회경제사』를 썼어. 한국사도 다른 민족처럼 <b>세계사의 보편적인 발전 법칙</b>을 따랐다고 주장했지.",
  why:"한국사가 발전 없이 멈춰 있었다는 <b>정체성론</b>을 정면으로 반박하려 했어.",
  so:"민족정신을 강조한 민족주의 사학과는 다른 길이야. 이걸 <b>사회 경제 사학</b>이라고 해."},
 {t:"fact",y:1934,n:"진단 학회",b:"문헌 고증으로 객관적인 역사를 쓰려는 <b>실증 사학</b>자들이 만들고 『<b>진단학보</b>』를 펴냈어.",
  why:"감정이나 이념보다 사료에 근거한 연구를 하자는 거였어.",
  so:"민족주의 사학·사회 경제 사학과 함께 세 갈래 역사학 중 하나야."},
 {t:"compare",title:"식민 사관에 맞선 두 방식",l:{n:"민족주의 사학",p:["<b>박은식</b> · <b>신채호</b>","<b>민족정신</b>을 바로 세우자","『한국통사』 · 『조선상고사』","→ 정인보의 조선학 운동"]},
  r:{n:"사회 경제 사학",p:["<b>백남운</b>","마르크스의 유물 사관","『조선사회경제사』","보편적 발전 법칙 → 정체성론 반박"]}},
 {t:"check",q:"식민 사관의 세 가지를 말해 봐.",a:"타율성론, 정체성론, 당파성론",hint:"타·정·당"},
 {t:"chain",title:"역사 전쟁의 구도",items:["일제: <b>식민 사관</b> (조선사 편수회, 『조선사』)","↔ 민족주의 사학: 박은식 · 신채호 → 조선학 운동(정인보)","↔ 사회 경제 사학: 백남운 (정체성론 반박)","↔ 실증 사학: 진단 학회 (문헌 고증)"]},
 {t:"hint",k:"타 정 당 / 민 박신 · 사 백 · 실 진",b:"식민 사관은 <em>타</em>율성·<em>정</em>체성·<em>당</em>파성. 맞선 쪽은 <em>민</em>족주의 = <em>박</em>은식·<em>신</em>채호, <em>사</em>회 경제 = <em>백</em>남운, <em>실</em>증 = <em>진</em>단 학회."},
 {t:"pick",q:"'조선 국혼'을 강조한 역사학자는?",c:["박은식","백남운"],a:0,e:"박은식이야. 백남운은 사회 경제 사학."},
 {t:"check",pr:15,q:"사회 경제 사학은 민족정신을 확립하여 독립운동의 정신적 토대를 마련하였다 — ○일까 ×일까?",a:"× — 민족정신을 강조한 건 민족주의 사학(박은식·신채호). 사회 경제 사학(백남운)은 세계사의 보편적 발전 법칙으로 정체성론을 반박했어.",hint:"민족정신 = 민족주의 사학"}
 ],
 quiz:[
 {q:"식민 사관 중 정체성론의 주장은?",c:["한국사는 발전 없이 정체되었다.","한국사는 외세에 의해 타율적으로 전개되었다.","한국인은 단결할 수 없다.","한국과 일본은 조상이 같다."],a:0,e:"타율성론·당파성론과 구분하자."},
 {q:"『한국통사』를 쓴 인물은?",c:["박은식","신채호","백남운","정인보"],a:0,e:"『한국독립운동지혈사』도 박은식이야."},
 {q:"백남운의 역사 연구에 대한 설명으로 옳은 것은?",c:["한국사도 세계사의 보편적 발전 법칙을 따랐다고 보았다.","'조선 국혼'을 강조하였다.","진단 학회를 조직하였다.","고대사 연구에 주력하였다."],a:0,e:"사회 경제 사학으로 정체성론을 반박했어."},
 {q:"실증 사학자들이 조직한 단체는?",c:["진단 학회","조선어 학회","조선사 편수회","신간회"],a:0,e:"1934년, 『진단학보』를 펴냈어."}
 ]},

{id:"L30",u:"s16",part:"지켜야 할 것들",title:"말과 글, 믿음과 시",sc:"pen",
 hook:"한글 사전 원고가 압수당하고, 목사가 고문 끝에 숨지고, 시인이 옥에서 눈을 감았어. 그래도 말과 글, 믿음과 시는 끝까지 지켜졌어. 광복 뒤 서울역 창고에서 사전 원고가 다시 발견된 이야기로 끝나.",
 cards:[
 {t:"story",h:"지키려 한 것들",b:"일제는 역사뿐 아니라 언어와 종교까지 억압해 민족정신을 지우려 했어. 이에 맞서 <b>한글 연구</b>, <b>종교계의 민족 운동</b>, <b>저항 문학</b>, 그리고 <b>문화유산 지키기</b>가 이어졌어."},
 {t:"fact",y:1921,n:"조선어 연구회",b:"<b>주시경</b>의 제자들이 중심이 되어 만들었어. '<b>가갸날</b>'(지금의 한글날)을 정하고 잡지 『한글』을 펴내 한글 연구와 보급에 힘썼지.",
  why:"3·1 운동 뒤 우리말을 지키는 게 곧 민족을 지키는 일이라고 봤어.",
  so:"1931년 <b>조선어 학회</b>로 발전해."},
 {t:"fact",y:1931,n:"조선어 학회",b:"조선어 연구회가 발전한 단체야. <b>한글 맞춤법 통일안</b>과 표준어·외래어 표기법 통일안을 만들고, 『<b>조선말 큰사전</b>』 편찬을 추진했어.",
  why:"통일된 규칙이 있어야 한글을 제대로 가르치고 쓸 수 있었어.",
  so:"한글 강습 교재로 문맹 퇴치에도 참여했어. 하지만 1942년 <b>조선어 학회 사건</b>으로 회원들이 투옥되고 원고를 빼앗겨. 광복 뒤 서울역 창고에서 원고가 발견돼 『큰사전』이 나왔어."},
 {t:"fact",y:1911,n:"사찰령",b:"일제가 불교를 통제하려고 만든 법이야. 사찰 재산을 처분하거나 <b>주지</b>를 임명할 때도 조선 총독의 허가를 받게 했어.",
  why:"종교를 식민 지배에 이용하려 했어.",
  so:"<b>한용운</b> 등이 청년 승려들과 조선 불교 유신회를 만들어 이에 맞섰어.",tk:"rule"},
 {t:"fact",y:1922,n:"천도교의 제2의 독립 선언 계획",b:"3·1 운동을 이끈 <b>천도교</b>가 1922년에 제2의 독립 선언 운동을 계획했어. 『<b>개벽</b>』, 『신여성』 같은 잡지도 펴냈고 청년·여성·소년 운동에도 앞장섰지.",
  why:"3·1 운동의 정신을 이어 가려 했어.",
  so:"종교계의 민족 운동은 천도교 말고도 이어졌어. 대종교는 중광단, 원불교는 새 생활 운동, 천주교 신자들은 의민단, 개신교는 <b>신사 참배 거부</b>(주기철 목사 순교)."},
 {t:"check",q:"신사 참배를 거부하다 고문 끝에 순교한 목사는?",a:"주기철",hint:"개신교야"},
 {t:"story",h:"시로 싸운 사람들",b:"<b>심훈</b>(「그날이 오면」), <b>한용운</b>, <b>이상화</b>(「빼앗긴 들에도 봄은 오는가」), <b>이육사</b>(「광야」·「청포도」), <b>윤동주</b>는 광복의 염원을 시에 담았고 그 신념대로 살았어. 의열단원이던 이육사는 옥중에서 순국했고, 윤동주도 일본 유학 중 수감됐다가 세상을 떠났어. 반대로 전쟁을 찬양한 <b>친일 문학</b>을 쓴 문인들도 있었지."},
 {t:"fact",y:1936,n:"전형필의 문화유산 수집",b:"간송 <b>전형필</b>은 물려받은 재산으로 일본 등 국외로 흘러 나가던 문화유산을 사들였어. 『<b>훈민정음</b>』 해례본, 김홍도·신윤복의 그림, 고려청자를 지켜 냈지.",
  why:"문화유산을 지키는 것도 독립운동이라고 생각했어.",
  so:"그래서 '문화 독립운동가'라고 불려."},
 {t:"chain",title:"한글을 지킨 흐름",items:["주시경의 제자들","→ <b>조선어 연구회</b>(1921) — 가갸날, 『한글』","→ <b>조선어 학회</b>(1931) — 맞춤법 통일안, 『조선말 큰사전』 추진","→ 조선어 학회 사건(1942) — 투옥, 원고 압수","→ 광복 뒤 원고 발견 → 『큰사전』 출간"]},
 {t:"hint",k:"연구회 → 학회 → 사건",b:"조선어 <em>연구회</em>(가갸날) → 조선어 <em>학회</em>(맞춤법·큰사전) → 조선어 학회 <em>사건</em>(1942). 한 단체가 이름을 바꿔 가며 이어진 거야."},
 {t:"pick",q:"한글 맞춤법 통일안을 만든 단체는?",c:["조선어 학회","진단 학회"],a:0,e:"조선어 학회야. 진단 학회는 실증 사학."},
 {t:"chain",pr:15,title:"종교계의 민족 운동 (프린트 표)",items:["<b>대종교</b> — 나철, 단군 신앙 · 개천절 기념 → 무장 단체 <b>중광단</b>","<b>천도교</b> — 동학 계승, 3·1 운동 주도, 제2의 독립 선언 계획(1922), 『개벽』 · 『신여성』","<b>불교</b> — 한용운, 조선 불교 유신회, 일제의 불교 통제(사찰령)에 저항","<b>원불교</b> — 박중빈 창시, 허례 폐지 · 근검절약 · 협동 단결의 <b>새 생활 운동</b>","<b>개신교</b> — 교육 · 의료 사업, 신사 참배 거부(주기철 목사 순교)","<b>천주교</b> — 보육원 · 양로원 등 사회사업, 무장 단체 <b>의민단</b>"]},
 {t:"hint",pr:15,k:"대-중광단 · 천주-의민단",b:"종교계가 만든 <em>무장 단체</em>는 둘 — <em>대</em>종교의 <em>중광단</em>(뒤에 북로 군정서로), <em>천주</em>교의 <em>의민단</em>. 원불교는 싸움이 아니라 <em>새 생활 운동</em>."},
 {t:"pick",pr:15,q:"'새 생활 운동'을 펼친 종교는?",c:["원불교","천도교"],a:0,e:"박중빈이 창시한 원불교야. 허례 폐지, 근검절약, 협동 단결."}

{id:"L31",u:"s17",part:"광복을 향해",title:"하나로 뭉치자",sc:"chain",
 hook:"만주가 막히자 독립운동가들은 중국 본토로 옮겨 갔어. 그런데 단체가 너무 많고 제각각이었지. 하나로 뭉치자는 노력이 시작돼. 두 명의 이름, 김구와 김원봉을 기억해 둬.",
 cards:[
 {t:"story",h:"만주에서 중국 관내로",b:"일제가 만주를 차지하자 많은 독립운동가가 <b>중국 관내</b>로 옮겨 갔어. 여러 단체가 따로따로 움직이니 힘이 흩어졌지. 효율적으로 싸우려면 하나로 합쳐야 한다는 목소리가 커졌어."},
 {t:"fact",y:1935,n:"민족 혁명당",b:"1935년 <b>난징</b>에서 여러 독립운동 단체 대표가 모여 각 단체를 해체하고 하나의 당을 만들었어. 민족주의와 사회주의 계열이 합친 <b>중국 관내 최대의 통일 전선 정당</b>이야.",
  why:"흩어진 힘을 모아 효율적으로 싸우려 했어.",
  so:"그런데 의열단 계열(<b>김원봉</b>)이 당권을 쥐자 조소앙·지청천 등이 탈당하면서 통일 전선의 성격이 약해졌어."},
 {t:"fact",y:1935,n:"한국 국민당",b:"민족 혁명당에 참여하지 않은 <b>김구</b> 등 <b>임시 정부 옹호</b> 세력이 따로 만든 당이야.",
  why:"임시 정부를 중심에 두어야 한다고 봤어.",
  so:"그래서 중국 관내 독립운동은 김구 쪽과 김원봉 쪽, 두 진영으로 나뉘게 돼."},
 {t:"fact",y:1937,n:"한국 광복 운동 단체 연합회",b:"중일 전쟁이 터지자 김구의 <b>한국 국민당</b>을 중심으로 결성됐어.",
  why:"중일 전쟁을 독립의 기회로 보고 힘을 모으려 했어.",
  so:"김구 진영의 연합체야."},
 {t:"fact",y:1937,n:"조선 민족 전선 연맹",b:"같은 때 <b>김원봉</b>이 이끄는 민족 혁명당을 중심으로 결성됐어.",
  why:"김원봉 쪽도 항일 세력을 한데 묶으려 했어.",
  so:"김원봉 진영의 연합체야. 이 연맹이 이듬해 조선 의용대를 만들어."},
 {t:"compare",title:"두 진영",l:{n:"김구 쪽",p:["<b>한국 국민당</b> (1935)","→ 한국 광복 운동 단체 연합회 (1937)","임시 정부 옹호","→ 뒤에 한국광복군"]},
  r:{n:"김원봉 쪽",p:["<b>민족 혁명당</b> (1935)","→ 조선 민족 전선 연맹 (1937)","통일 전선 정당","→ 조선 의용대 (1938)"]}},
 {t:"fact",y:1938,n:"조선 의용대",b:"조선 민족 전선 연맹이 중국 국민당 정부의 지원을 받아 <b>우한</b>(한커우)에서 만든 부대야. <b>중국 관내 최초의 한인 부대</b>지. 일본군을 상대로 심리전, 포로 심문, 후방 공작을 맡았어.",
  why:"중일 전쟁을 적극적으로 싸울 기회로 봤어.",
  so:"1940년대 초 다수가 더 적극적으로 싸우려고 화북으로 옮겨 가."},
 {t:"fact",y:1939,n:"김구·김원봉의 공개 통신",b:"김구와 김원봉이 함께 「동지 동포 제군에게 보내는 공개 통신」을 발표해 <b>항일 전선의 통합</b>을 호소했어.",
  why:"두 진영을 지원하던 중국 국민당 정부도 단일화를 요구했어.",
  so:"통합이 추진됐지만 이념과 방식 차이로 쉽지 않았어. 결국 1942년 김원봉이 임시 정부에 합류하면서 이뤄져."},
 {t:"fact",y:1941,n:"조선 의용대 화북 지대",b:"조선 의용대 다수가 중국 공산당 세력이 일본군과 싸우던 <b>화북</b>으로 가서 만들었어. <b>타이항산</b>을 중심으로 호가장 전투, 반소탕전에서 큰 전과를 올렸지.",
  why:"후방 공작보다 직접 싸우는 투쟁을 원했어.",
  so:"뒤에 조선 독립 동맹 아래 <b>조선 의용군</b>으로 바뀌어."},
 {t:"check",q:"중국 관내에서 결성된 최초의 한인 부대는?",a:"조선 의용대 (1938, 우한)",hint:"조선 민족 전선 연맹이 만들었어"},
 {t:"chain",title:"중국 관내 항일 전선의 흐름",items:["만주 사변 → 중국 관내로 이동","→ 1935 <b>민족 혁명당</b>(김원봉) / <b>한국 국민당</b>(김구)","→ 1937 중일 전쟁: 두 연합체로 재편","→ 1938 <b>조선 의용대</b>(우한)","→ 1939 김구·김원봉 공개 통신","→ 1941 화북 지대 (타이항산) / 1942 일부는 광복군으로"]},
 {t:"hint",k:"민혁-난징-원봉 · 의용대-우한",b:"<em>민</em>족 <em>혁</em>명당은 <em>난징</em>, 김<em>원봉</em>. 조선 <em>의용대</em>는 <em>우한</em>. 김구는 늘 '임시 정부 쪽'."},
 {t:"pick",q:"민족 혁명당에 참여하지 않고 한국 국민당을 만든 인물은?",c:["김구","김원봉"],a:0,e:"김구야. 김원봉은 민족 혁명당의 중심."},
 {t:"check",pr:16,q:"한국광복군은 중국 국민당 정부의 지원을 받아 중국 관내에서 결성된 최초의 한인 부대이다 — ○일까 ×일까?",a:"× — 최초는 조선 의용대(1938, 우한·한커우). 한국광복군은 1940년 충칭에서 만들어졌어.",hint:"1938 vs 1940"},
 {t:"check",pr:16,q:"김구 등이 민족 혁명당을 결성하였다 — ○일까 ×일까?",a:"× — 민족 혁명당은 김원봉 등이 주도했어. 김구는 참여하지 않고 한국 국민당을 만들었지.",hint:"김구는 늘 임시 정부 쪽"}
 ],
 quiz:[
 {q:"민족 혁명당이 결성된 곳은?",c:["난징","충칭","우한","옌안"],a:0,e:"1935년 난징이야."},
 {q:"조선 의용대를 창설한 조직은?",c:["조선 민족 전선 연맹","한국 광복 운동 단체 연합회","대한민국 임시 정부","조선 독립 동맹"],a:0,e:"김원봉 쪽 연합체야."},
 {q:"조선 의용대 화북 지대의 활동 중심지는?",c:["타이항산","훙커우 공원","청산리","충칭"],a:0,e:"호가장 전투, 반소탕전에서 활약했어."},
 {q:"민족 혁명당의 통일 전선 성격이 약해진 까닭은?",c:["의열단 계열이 당권을 쥐자 일부가 탈당하였다.","일제가 강제로 해산시켰다.","임시 정부와 통합하였다.","신간회로 흡수되었다."],a:0,e:"조소앙·지청천 등이 탈당했어."}
 ]},

{id:"L32",u:"s18",part:"광복을 향해",title:"충칭의 임시 정부",sc:"flag",
 hook:"윤봉길 의거 뒤 일제의 추격을 피해 8년을 떠돈 임시 정부가 1940년 충칭에 자리를 잡아. 그리고 짧은 사이에 군대를 만들고, 나라의 설계도를 쓰고, 일본에 전쟁을 선포해.",
 cards:[
 {t:"story",h:"상하이에서 충칭까지",b:"상하이(1919) → 항저우(1932) → 전장 → 창사 → 광저우 → 류저우 → 치장 → <b>충칭</b>(1940). 임시 정부는 윤봉길 의거 이후 일제를 피해 계속 옮겨 다녔어. 충칭에서야 비로소 자리를 잡고 체제를 다시 세우지."},
 {t:"fact",y:1940,n:"임시 정부의 충칭 정착",b:"<b>윤봉길 의거</b> 뒤 여러 곳을 떠돌던 대한민국 임시 정부가 1940년 충칭에 정착했어. 중국 국민당 정부의 지원을 받아 체제를 고치고 항일 투쟁의 힘을 키웠지.",
  why:"윤봉길 의거로 일제의 추격이 심해졌어.",
  so:"<b>김구</b>를 주석으로 하는 단일 지도 체제를 갖췄어."},
 {t:"fact",y:1940,n:"한국 독립당",b:"<b>민족주의 계열</b> 정당들이 합쳐 만든 당이야. 충칭 시기 임시 정부 운영을 이끌었어.",
  why:"임시 정부를 받쳐 줄 튼튼한 여당이 필요했어.",
  so:"김구 쪽이 한국 국민당 → 한국 독립당으로 이어진 거야."},
 {t:"fact",y:1940,n:"한국광복군",b:"충칭의 임시 정부가 <b>지청천</b>을 총사령관으로 창설한 군대야.",
  why:"연합국과 함께 싸워야 광복 뒤 발언권이 생긴다고 봤어.",
  so:"1942년 김원봉의 조선 의용대 일부가 합류하면서 더 커져."},
 {t:"fact",y:1941,n:"건국 강령",b:"임시 정부가 광복 뒤 세울 민주 국가의 방향을 발표했어. 바탕은 <b>조소앙</b>의 <b>삼균주의</b> — <b>정치·경제·교육의 균등</b>이야.",
  why:"독립 뒤 어떤 나라를 세울지 미리 정해 둬야 했어.",
  so:"보통 선거, 토지와 큰 생산 기관의 국유화, 무상 교육을 담았어."},
 {t:"fact",y:1941,n:"대일 선전 성명서",b:"아시아·태평양 전쟁이 터지자 임시 정부가 일본에 <b>선전 포고</b>를 하고 한국광복군을 연합군의 일원으로 참전시켰어.",
  why:"일본이 미국과 싸우면 결국 질 거라고 내다봤어.",

 {t:"fact",y:1942,n:"조선 독립 동맹",b:"화북 지방의 <b>사회주의</b> 세력이 <b>김두봉</b>을 위원장으로 결성했어. 조선 의용대 화북 지대를 <b>조선 의용군</b>으로 바꿔 항일 무장 투쟁을 벌였지.",
  why:"화북에서 중국 공산당과 함께 싸우던 한인들이 조직을 갖춘 거야.",

  g='<path d="M18 106h84" stroke="var(--line2)" stroke-width="2" '+o+'/>';

  var pairs=Math.min(7,Math.ceil(st/2.6));
  for(var i=0;i<pairs;i++){

    g+='<path d="M60 '+y.toFixed(0)+' q '+(side*w).toFixed(0)+' '+(-w*0.72).toFixed(0)+' '+(side*w*1.5).toFixed(0)+' 2 q '+(-side*w*0.75).toFixed(0)+' '+(w*0.6).toFixed(0)+' '+(-side*w*1.5).toFixed(0)+' -2 z" fill="var(--jade)" opacity="'+(0.45+i*0.07).toFixed(2)+'"/>';

  if(st>=15){

  }

    g+='<circle cx="60" cy="'+(top-13).toFixed(0)+'" r="3.2" fill="var(--ochre)"/>'+
       '<path d="M45 '+(top-18).toFixed(0)+'l3 5-3 5M75 '+(top-18).toFixed(0)+'l-3 5 3 5" stroke="var(--ochre)" stroke-width="1.8" opacity=".7" '+o+'/>';

/* 마친 수업에서 한 장 뽑아 홈에 띄운다 */
function peekCard(){
  var pool=[];
  LESSONS.forEach(function(l){
    if(!S.done[l.id])return;
    l.cards.forEach(function(c){
      if(c.t==="hint")pool.push({l:l,html:'<b class="k">'+esc(c.k)+'</b><span>'+c.b+'</span>'});
      if(c.t==="fact")pool.push({l:l,html:'<b class="k" style="color:var(--ink)">'+yLab(c)+' · '+esc(c.n)+'</b><span>'+c.so+'</span>'});
      if(c.t==="chain")pool.push({l:l,html:'<b class="k" style="font-size:16px">'+esc(c.title)+'</b><span>'+
        c.items.map(function(x){return x.replace(/<[^>]+>/g,"");}).join(" → ")+'</span>'});
    });
  });
  if(!pool.length)return null;
  return pool[Math.floor(Math.random()*pool.length)];
}

/* ── 간격 반복: 마친 수업을 1 · 3 · 7 · 16일 뒤에 다시 묻는다 ── */
var DUE_DAYS=[1,3,7,16];
function dueList(){
  var t=today();
  return LESSONS.filter(function(l){ var d=S.due[l.id]; return S.done[l.id]&&d&&d.at<=t; });
}
function dueBump(lid,ok){
  var d=S.due[lid]||{n:0,at:today()};
  if(ok)d.n=Math.min(DUE_DAYS.length-1,d.n+1); else d.n=0;
  d.at=today()+DUE_DAYS[d.n];
  S.due[lid]=d; save();
}
function ddayLeft(){
  if(!S.dday)return null;
  var d=new Date(S.dday+"T00:00:00");
  if(isNaN(d))return null;
  return Math.round(Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)-today());
}
/* 남은 날짜에 맞춘 하루 권장량 */
function pace(){
  var L=ddayLeft(); if(L==null||L<0)return null;
  var left=LESSONS.length-doneCount(); if(!left)return null;
  return {left:left, days:Math.max(1,L), per:Math.ceil(left/Math.max(1,L))};
}

/* ── 오답 노트 ── */
function wkey(lid,kind,idx){return lid+"#"+kind+idx;}
function wAdd(lid,kind,idx,chose){
  var k=wkey(lid,kind,idx),w=S.wrong[k];
  if(w){w.miss++;w.at=Date.now();w.chose=chose;w.fix=0;}
  else S.wrong[k]={lid:lid,kind:kind,idx:idx,miss:1,at:Date.now(),chose:chose};
  save();
}
/* 맞혀도 지우지 않는다. 「맞힘」만 표시하고, 지우기는 사용자가 직접 한다 */
function wOk(lid,kind,idx){ var w=S.wrong[wkey(lid,kind,idx)]; if(!w)return; w.fix=(w.fix||0)+1; w.okAt=Date.now(); save(); }
function wClear(lid,kind,idx){ delete S.wrong[wkey(lid,kind,idx)]; save(); }
function wCount(){return Object.keys(S.wrong).length;}
function wFixed(){return Object.keys(S.wrong).filter(function(k){return S.wrong[k].fix>0;}).length;}
/* 지운 뒤 5초 동안 되돌릴 수 있게 한다. view 안에 붙여야 합친 앱(한사)에서도 스타일이 먹는다 */
var UNDO=null;
function undoBar(msg,fn){
  if(UNDO){clearTimeout(UNDO.t);if(UNDO.el)UNDO.el.remove();}
  var el=document.createElement("div"); el.className="undo"; el.setAttribute("role","status");
  el.innerHTML='<span>'+esc(msg)+'</span><button type="button">되돌리기</button>';
  view.appendChild(el);
  var u=UNDO={el:el,t:setTimeout(function(){el.remove();if(UNDO===u)UNDO=null;},5000)};
  el.querySelector("button").onclick=function(){clearTimeout(u.t);el.remove();UNDO=null;fn();};
}
/* 한꺼번에 지우는 버튼은 두 번 눌러야 한다(3초 안에). 확인 창은 샌드박스에서 막힐 수 있어서 쓰지 않는다 */
function armBtn(b,fn){
  var label=b.innerHTML, tm=null;
  b.onclick=function(){
    if(!b.classList.contains("arm")){ b.classList.add("arm"); b.textContent="한 번 더 누르면 지워져"; buzz(10);
      tm=setTimeout(function(){b.classList.remove("arm");b.innerHTML=label;},3000); return; }
    clearTimeout(tm); fn();
  };
}
/* 오답 항목을 실제 문제로 되살린다 */
function wItem(w){
  if(w.kind==="e"){                      /* 내신 실전 문항 */
    var x=(typeof EMAP!=="undefined")?EMAP[w.idx]:null; if(!x)return null;
    return {lid:"EXAM",kind:"e",idx:w.idx,lesson:{title:"내신 실전 · "+UMAP[x.u].n},
      q:x.q,c:x.c,a:x.a,e:x.e,miss:w.miss,chose:w.chose,type:x.type,boki:x.boki};
  }
  if(w.kind==="n"){                      /* 인물·단체 카드 */
    var nb=(typeof nOpts==="function")?nOpts(w.idx):null; if(!nb)return null;
    return {lid:"NAME",kind:"n",idx:w.idx,lesson:{title:"인물·단체 · "+UMAP[nb.x.u].n},
      q:nb.q,c:nb.c.map(stripTags),a:0,e:nb.e,miss:w.miss,chose:w.chose};
  }
  var l=LMAP[w.lid]; if(!l)return null;
  if(w.kind==="q"){ var q=l.quiz[w.idx]; if(!q)return null;
    return {lid:w.lid,kind:"q",idx:w.idx,lesson:l,q:q.q,c:q.c,a:q.a,e:q.e,miss:w.miss,chose:w.chose}; }
  var c=l.cards[w.idx]; if(!c||c.t!=="pick")return null;
  return {lid:w.lid,kind:"p",idx:w.idx,lesson:l,q:c.q,c:c.c,a:c.a,e:c.e,miss:w.miss,chose:w.chose};
}
function wList(){
  return Object.keys(S.wrong).map(function(k){var w=S.wrong[k],x=wItem(w); if(x){x.fix=w.fix||0;x.key=k;} return x;})
    .filter(Boolean).sort(function(a,b){
      var ai=LESSONS.indexOf(LMAP[a.lid]||{}),bi=LESSONS.indexOf(LMAP[b.lid]||{});
      return ai-bi||String(a.idx).localeCompare(String(b.idx));});
}

/* ── 레슨 ── */
var L=null;
function vLesson(a){
  var l=LMAP[a.id];
  if(!L||L.id!==a.id){
    L={id:a.id,l:l,i:(S.done[l.id]?0:(S.pos[l.id]||0)),phase:"card",qi:0,qok:0,qlog:[],revealed:false,answered:false,hit:{}};
    if(L.i>=l.cards.length)L.i=0;
  }
  titleEl.textContent=l.title;
  if(L.phase==="quiz")return paintQuiz();
  if(L.phase==="end")return paintEnd();
  paintCard();
}
function hud(){
  var l=L.l,tot=l.cards.length+l.quiz.length;
  var cur=L.phase==="card"?L.i:l.cards.length+L.qi;
  return '<div style="display:flex;align-items:center;gap:12px;padding:2px 0 16px">'+
    '<span class="track"><i style="width:'+(cur/tot*100)+'%"></i></span>'+
    '<span class="step">'+(cur+1)+' / '+tot+'</span>'+
    (L.phase==="card"?kBtn(L.id+"#"+L.i):'')+'</div>';
}
/* 되돌아갈 자리가 있나 — 첫 카드 앞으로는 못 간다 */
function canBack(){
  if(!L)return false;
  if(L.phase==="card")return L.i>0||L.revealed;
  if(L.phase==="quiz")return true;
  return false;
}
/* 한 칸 뒤로. 퀴즈에서 뒤로 가면 그때 매긴 점수도 같이 되돌린다 */
function goBack(){
  if(!canBack())return;
  buzz(10);
  if(L.phase==="card"){
    if(L.revealed){ L.revealed=false; return vLesson({id:L.id}); }   /* 답부터 다시 가린다 */
    L.i--;
  }else if(L.phase==="quiz"){
    if(L.qi===0){ L.phase="card"; L.i=L.l.cards.length-1; }
    else{
      L.qi--;
      var last=L.qlog.pop();
      if(last&&last.ok)L.qok--;
      L.combo=0;
    }
  }
  L.revealed=false; L.answered=false;
  S.pos[L.id]=L.i; save();
  vLesson({id:L.id});
}
/* 「다음」 옆에 「이전」을 붙여 준다. 되돌아갈 자리가 없으면 다음만 */
function nextBtn(label,fn){
  var back=canBack();
  var h='<div class="sticky">'+(back?'<div class="row back">':'')+
        (back?'<button class="cta ghost" id="prev">← 이전</button>':'')+
        '<button class="cta" id="nx">'+label+'</button>'+(back?'</div>':'')+'</div>';
  setTimeout(function(){
    var b=document.getElementById("nx");if(b)b.onclick=fn;
    var p=document.getElementById("prev");if(p)p.onclick=goBack;
  },0);
  return h;
}
/* 아직 고르기 전 화면 — 「이전」만 놓는다 */
function backOnly(){
  if(!canBack())return "";
  setTimeout(function(){var p=document.getElementById("prev");if(p)p.onclick=goBack;},0);
  return '<div class="sticky"><button class="cta ghost wide" id="prev">← 이전</button></div>';
}
function advance(){
  L.i++; L.revealed=false; L.answered=false;
  S.pos[L.id]=L.i; save();
  if(L.i>=L.l.cards.length){L.phase="quiz";L.qi=0;L.qok=0;L.qlog=[];}
  vLesson({id:L.id});
}

function paintCard(){
  var l=L.l,c=l.cards[L.i],h=hud();
  if(L.i===0)h+='<div class="card"><div class="scene">'+scene(l.sc,72)+'</div>'+
    '<div class="eyebrow">'+esc(l.part)+' · '+(LESSONS.indexOf(l)+1)+'번째 수업</div>'+
    '<div class="h">'+esc(l.title)+'</div><div class="bd">'+esc(l.hook)+'</div></div>';

  if(c.t==="story")
    h+='<div class="card">'+prB(c)+'<div class="eyebrow">이야기</div><div class="h sm">'+esc(c.h)+'</div>'+
       '<div class="bd">'+c.b+'</div></div>';

  if(c.t==="fact")
    h+='<div class="card">'+prB(c)+'<span class="yr'+(YAPX[c.n]?' ya':'')+'">'+yLab(c)+'</span>'+
       '<div class="h">'+esc(c.n)+'</div><div class="bd">'+c.b+'</div>'+
       '<div class="wsblock">'+
         '<div class="ws why"><span class="lb">왜?</span><p>'+c.why+'</p></div>'+
         '<div class="ws so"><span class="lb">그래서</span><p>'+c.so+'</p></div>'+
       '</div></div>';

  if(c.t==="chain"){
    h+='<div class="card">'+prB(c)+'<div class="eyebrow">인과 사슬</div><div class="h sm">'+esc(c.title)+'</div>'+
       '<div class="chain">'+c.items.map(function(x,i){
         return '<div class="cl" style="animation-delay:'+(i*130)+'ms"><span class="dot"></span><p>'+x+'</p></div>';
       }).join("")+'</div></div>';
  }

  if(c.t==="hint")
    h+='<div class="card hintcard">'+prB(c)+'<div class="eyebrow">이렇게 외우자</div>'+
       '<div class="k">'+esc(c.k)+'</div><div class="bd">'+c.b+'</div></div>';

  if(c.t==="compare")
    h+='<div class="card">'+prB(c)+'<div class="eyebrow">헷갈리지 않게</div><div class="h sm">'+esc(c.title)+'</div>'+
       '<div class="cmp"><div class="a"><h4>'+c.l.n+'</h4><ul>'+c.l.p.map(function(x){return "<li>"+x+"</li>";}).join("")+'</ul></div>'+
       '<div class="b"><h4>'+c.r.n+'</h4><ul>'+c.r.p.map(function(x){return "<li>"+x+"</li>";}).join("")+'</ul></div></div></div>';

  if(c.t==="check"){
    h+='<div class="card">'+prB(c)+'<div class="eyebrow">잠깐, 스스로 떠올려 보자</div><div class="recall">'+
       '<div class="q">'+esc(c.q)+'</div>'+
       (L.revealed?'<div class="ans">'+esc(c.a)+'</div>'
                  :'<div class="ans blur">'+esc(c.a)+'</div>')+
       '<div class="tip">'+(L.revealed?"맞혔으면 그대로, 틀렸으면 한 번 더 소리 내어 읽어 보자":esc(c.hint||"머릿속으로 답해 본 다음 눌러 봐"))+'</div>'+
       '</div></div>';
    if(!L.revealed){
      h+=nextBtn("답 확인",function(){L.revealed=true;buzz(12);vLesson({id:L.id});});
      view.innerHTML=h;return;
    }
  }

  if(c.t==="pick"){
    if(!L.pm||L.pmi!==L.i){ L.pm=mixQ(c); L.pmi=L.i; }
    var pc=L.pm;
    h+='<div class="card">'+prB(c)+'<div class="eyebrow">골라 보자</div><div class="h sm">'+esc(c.q)+'</div>'+
       '<div class="two" id="two">'+pc.c.map(function(x,i){
         return '<button class="tw" data-i="'+i+'">'+esc(x)+'</button>';}).join("")+'</div>'+
       '<div id="fb"></div></div>';
    view.innerHTML=h+backOnly();
    Array.prototype.forEach.call(view.querySelectorAll("#two .tw"),function(b){
      b.onclick=function(){
        if(L.answered)return; L.answered=true;
        var ok=+b.dataset.i===pc.a;
        Array.prototype.forEach.call(view.querySelectorAll("#two .tw"),function(x,i){
          x.disabled=true; if(i===pc.a)x.classList.add("ok"); else if(x===b)x.classList.add("no");
        });
        buzz(ok?14:[20,40,20]); markDay();
        if(!L.hit["p"+L.i]){L.hit["p"+L.i]=1;uHit(L.l.u,ok);}
        if(ok)wOk(L.id,"p",L.i); else wAdd(L.id,"p",L.i,unmix(pc,+b.dataset.i));
        document.getElementById("fb").innerHTML=
          '<div class="fb '+(ok?"ok":"no")+'"><span class="m">'+(ok?"맞아":"아냐")+'</span><span>'+c.e+'</span></div>';
        var sk0=view.querySelector(".sticky"); if(sk0)sk0.remove();
        view.insertAdjacentHTML("beforeend",nextBtn("다음",advance));
      };
    });
    return;
  }

  h+=nextBtn(L.i===L.l.cards.length-1?"마무리 퀴즈 풀기":"다음",advance);
  view.innerHTML=h;
}

/* ── 마무리 퀴즈 ── */
function paintQuiz(){
  var l=L.l;
  if(!L.mq||L.mqi!==L.qi){ L.mq=mixQ(l.quiz[L.qi]); L.mqi=L.qi; }
  var q=L.mq;
  var h=hud()+'<div class="card"><div class="eyebrow">마무리 퀴즈 '+(L.qi+1)+' / '+l.quiz.length+'</div>'+
    '<div class="h sm">'+esc(q.q)+'</div></div>'+
    '<div style="margin-top:12px" id="opts">'+q.c.map(function(x,i){
      return '<button class="qopt" data-i="'+i+'"><span class="kx">'+"ABCD".charAt(i)+'</span><span>'+esc(x)+'</span></button>';
    }).join("")+'</div><div id="fb"></div>';
  view.innerHTML=h+backOnly();
  Array.prototype.forEach.call(view.querySelectorAll("#opts .qopt"),function(b){
    b.onclick=function(){
      if(L.answered)return; L.answered=true;
      var ok=+b.dataset.i===q.a;
      Array.prototype.forEach.call(view.querySelectorAll("#opts .qopt"),function(x,i){
        x.disabled=true;
        if(i===q.a)x.classList.add("ok"); else if(x===b)x.classList.add("no"); else x.classList.add("dim");
      });
      if(!L.hit["q"+L.qi]){L.hit["q"+L.qi]=1;uHit(L.l.u,ok);}
      if(ok){
        L.qok++; L.combo=(L.combo||0)+1;
        if(L.combo>=3&&L.combo%3===0)pop(L.combo+"연속!"); else pop("좋아!");
        wOk(L.id,"q",L.qi);
      }else{
        L.combo=0; wAdd(L.id,"q",L.qi,unmix(q,+b.dataset.i));
      }
      L.qlog.push({q:q,ok:ok});
      buzz(ok?14:[20,40,20]); markDay();

/* 시기 구분 — 통치 방식이 바뀐 두 지점(3·1 운동, 만주 사변)에서 끊는다.
   1919년은 한 해 안에서 갈린다: 3·1 운동까지는 무단 통치, 그 뒤(임시 정부 · 의열단 · 문화 정치 시작)는 다음 시기 */

  {y:1919,n:"1910년대",t:"무단 통치",d:"3·1 운동까지. 헌병 경찰이 칼을 차고 다니고, 토지와 회사를 손에 넣던 때"},
  {y:1930,n:"1919~1920년대",t:"이른바 문화 통치",d:"3·1 운동 뒤부터 만주 사변(1931) 전까지. 놀란 일제가 겉모습만 바꾸고 쌀을 실어 가던 때"},
  {y:9999,n:"1930~40년대",t:"민족 말살 · 전시 동원",d:"만주 사변 이후. 전쟁에 끌어들이려고 이름과 말까지 빼앗던 때"}
];
function eraOf(y){ for(var i=0;i<ERAS.length;i++) if(y<=ERAS[i].y) return i; return ERAS.length-1; }
/* 사실 한 줄의 시기. 햇수만으로는 1919년이 갈리지 않는다 —
   3·1 운동 뒤에 생긴 것(일제의 문화 정치 시작 s3, 신흥 무관 학교 s5, 임시 정부 s7, 의열단 · 강우규 s9)은 1920년대 칸.
   3·1 운동 자체(s6), 파리 강화 회의(s1)는 무단 통치 칸.
   1930년 「식민지 공업화」는 민족 말살 통치 단원(s4)이라 1930년대 칸 */
var ERA1919={s3:1,s5:1,s7:1,s9:1};
/* 교과서가 한 해로 못 박지 않은 것(여러 해에 걸친 정책 · 흐름 · 설명) — [보여 줄 시기, 쌓아 가기 칸에 넣나, 통치↔저항 칸에 넣나].
   카드 · 연표에는 숫자 대신 이 말을 보여 주고, 연도를 겨루는 판(시대 섞기 · 묶음 안 순서)에서는 뺀다.
   숫자 y 는 연표 안 자리를 잡는 데만 쓴다. 시기 칸이 둘에 걸치면(예: 「1930년대」는 쌓아 가기 5·6칸) 그 판에서도 뺀다 */
var YAPX={"우민화 교육":["1910년대",1,1],"기간 시설 건설":["1910년대",1,1],
  "3부의 성립":["1920년대 중반",1,1],"3부의 성격":["1920년대 중반",1,1],"3부 통합 운동":["1920년대 후반",1,1],
  "자치 운동":["1920년대 중반~1930년대 초",0,0],"황푸 군관 학교 입교":["1920년대 후반",1,1],
  "혁명적 농민·노동 조합":["1930년대",0,1],"농촌 진흥 운동":["1930년대",0,1],"남면북양 정책":["1930년대",0,1],
  "조선학 운동":["1930년대 중반",1,1],"신채호의 고대사 연구":["1920~30년대",0,0],"백남운의 사회 경제 사학":["1930년대",0,1],
  "내선일체와 일선동조론":["1930년대",0,1],"신사 참배 강요":["1930년대",0,1],
  "인력 수탈":["1930년대 후반~1945",0,1],"공출과 배급제":["1930년대 후반~1945",0,1]};
function yLab(c){ var a=YAPX[c.n]; return a?a[0]:c.y; }
function eraOfRow(r){
  if(r.y===1919) return (ERA1919[r.u]||r.k==="rule")?1:0;
  if(r.y===1930&&r.u==="s4") return 2;
  return eraOf(r.y);

function timeline(){
  if(TL)return TL;
  TL=[];
  LESSONS.forEach(function(l){
    l.cards.forEach(function(c,i){
      if(c.t==="fact"&&c.y!=null)
        TL.push({y:c.y,n:c.n,u:l.u,lid:l.id,ci:i,lt:l.title,ya:YAPX[c.n]?YAPX[c.n][0]:null,
                 k:c.tk||TRACK[l.u]||"world",pr:c.pr||0,po:c.po||0,
                 so:(c.so||"").replace(/<[^>]+>/g,"")});
    });
  });
  /* 수업이 아직 없는 단원은 사실만 — 누르면 갈 수업이 없으니 lid 를 비워 둔다 */
  /* 수업 카드로 이미 있는 사실은 건너뛴다(단원+이름으로 맞춘다). 빠진 게 있어도 연표에서는 사라지지 않게 */
  var has={}; LESSONS.forEach(function(l){ l.cards.forEach(function(c){ if(c.t==="fact")has[l.u+"|"+c.n]=1; }); });
  TL_EXTRA.forEach(function(r){
    if(has[r[0]+"|"+r[2]])return;
    TL.push({y:r[1],n:r[2],u:r[0],lid:null,ci:null,lt:UMAP[r[0]].n+" · "+UMAP[r[0]].bk,ya:YAPX[r[2]]?YAPX[r[2]][0]:null,
             k:r[4]||TRACK[r[0]]||"world",so:r[3]});
  });
  /* 같은 해 안에서는 시기(1919년의 3·1 운동 전·후) → 교과서 차례 (정렬이 안정적이라 차례는 그대로 남는다) */
  TL.sort(function(a,b){return a.y-b.y||eraOfRow(a)-eraOfRow(b);});
  return TL;
}

   Ⅰ단원은 「일제가 한 일(01)」과 「우리가 한 일(02·03)」이 나란히 놓인 단원이다.
   시험은 그 둘을 같은 시기에 겹쳐 놓고 묻는다. 그래서 연표와 같은 자료로
   시기 × 갈래 표를 세워 둔다 — 새로 적는 게 아니라 사실 카드에서 뽑아 쓴다 */
function vFacing(){
  var all=timeline(), rows=[];
  var by={};
  all.forEach(function(r,i){
    r._i=i;
    var k=eraOfRow(r)+"/"+r.k;
    (by[k]=by[k]||[]).push(r);
  });
  var html=tabsHTML()+
    '<p class="note" style="margin-bottom:14px">같은 시기에 <b style="background:var(--red-l);color:var(--ink)">일제가 한 일</b>과 '+
      '<b style="background:var(--teal-l);color:var(--ink)">우리가 한 일</b>을 나란히 놓았어. '+
      '시험은 「1920년대에 일제는 ○○을 했고 우리는 △△로 맞섰다」처럼 이 둘을 겹쳐서 물어. '+
      '아무 칸이나 누르면 그 수업으로 가.</p>';
  ERAS.forEach(function(e,ei){
    var ru=by[ei+"/rule"]||[], re=by[ei+"/resist"]||[], wo=by[ei+"/world"]||[], li=by[ei+"/life"]||[];
    if(!ru.length&&!re.length&&!wo.length&&!li.length)return;
    html+='<div class="tle"><b>'+e.n+'</b><span><b class="t">'+esc(e.t)+'</b>'+
          '<small>'+esc(e.d)+'</small></span></div>'+
      '<div class="face">'+
        '<div class="fcol rule"><h4>일제가 한 일 <i>'+ru.length+'</i></h4>'+
          ru.map(fchip).join("")+'</div>'+
        '<div class="fcol resist"><h4>우리가 한 일 <i>'+re.length+'</i></h4>'+
          re.map(fchip).join("")+'</div>'+
      '</div>'+
      (li.length?'<div class="fworld flife"><b>사회와 삶</b>'+li.map(fchip).join("")+'</div>':'')+
      (wo.length?'<div class="fworld"><b>바깥 세계</b>'+wo.map(fchip).join("")+'</div>':'');
  });
  html+='<p class="note" style="margin:18px 0 4px">한 칸이 비어 보이면 그 시기에 그쪽 사건이 적다는 뜻이야. '+
        '1910년대 오른쪽이 긴 건 3·1 운동이 여기 걸리기 때문이야. 같은 1919년이라도 3·1 운동 뒤에 생긴 임시 정부 · 의열단은 다음 시기 칸에 있어. '+
        '점선 칸은 아직 안 배운 수업이야.</p>';
  view.innerHTML=html;
  tabsBind();
  Array.prototype.forEach.call(view.querySelectorAll(".fc"),function(b){
    b.onclick=function(){ var r=all[+b.dataset.i]; if(!r.lid)return pop("수업은 아직이야 — 내신 실전에서 풀 수 있어"); jumpCard(r.lid,r.ci); };
  });
}
function fchip(r){
  return '<button class="fc'+(r.lid?(S.done[r.lid]?"":" new"):" nol")+'" data-i="'+r._i+'">'+esc(r.n)+(r.pr?' <span class="prtag'+(r.po?" po":"")+'">프린트</span>':'')+'</button>';
}
function tabsBind(){
  Array.prototype.forEach.call(view.querySelectorAll(".tb"),function(b){
    /* render 를 태워야 창 제목이 경로로 남는다 */
    b.onclick=function(){ if(RVTAB===b.dataset.t)return; RVTAB=b.dataset.t; render(); };});
}
function tabsHTML(){
  return '<div class="tabs" role="tablist">'+
    [["hint","암기 장치"],["time","사건 흐름"],["face","통치↔저항"]].map(function(t){
      return '<button class="tb" role="tab" data-t="'+t[0]+'" aria-selected="'+(RVTAB===t[0])+'">'+t[1]+'</button>';
    }).join("")+'</div>';
}

/* ── 암기 장치: 그냥 읽는 대신 「가리고 떠올리기」로 바꾼다 ──
   읽기만 하면 아는 것 같지만 시험지 앞에서는 안 나온다.
   한 번 떠올려 보고 맞았는지 스스로 매기는 쪽이 훨씬 오래 남는다 */
/* 가리기·좁히기는 저장해 둔다 — 시험 직전엔 「덜 외운 것만」을 켜 두고 계속 쓰게 된다 */
function mmHide(){return (S.mmHide==null)?true:!!S.mmHide;}
function mmOnly(){return !!S.mmOnly;}
function stripTags(x){return String(x).replace(/<[^>]+>/g,"");}
function memList(){
  var out=[];
  LESSONS.forEach(function(l){
    if(!S.done[l.id])return;
    l.cards.forEach(function(c,i){
      if(c.t==="hint")
        out.push({k:l.id+"#h"+i,lid:l.id,ci:i,lt:l.title,u:l.u,kind:"암기 장치",
                  head:c.k,body:c.b,peek:""});
      if(c.t==="chain")
        out.push({k:l.id+"#c"+i,lid:l.id,ci:i,lt:l.title,u:l.u,kind:"인과 사슬",
                  head:c.title,
                  body:c.items.map(stripTags).join(" → "),
                  peek:stripTags(c.items[0])+" → ?"});
    });
  });
  /* 헷갈린 것부터 위로. 그다음 아직 안 매긴 것, 다 외운 것은 맨 아래 */
  return out.sort(function(a,b){
    var av=S.mem[a.k],bv=S.mem[b.k];
    var ar=(av===0?0:av===1?2:1), br=(bv===0?0:bv===1?2:1);
    return ar-br;
  });
}
function memCard(it){
  var v=S.mem[it.k];
  var open=!mmHide();
  return '<div class="rv mm'+(v===0?" m0":v===1?" m1":"")+'" data-k="'+it.k+'">'+
    '<div class="t">'+esc(it.lt)+' · '+it.kind+
      (v===0?'<em class="mst no">헷갈림</em>':v===1?'<em class="mst ok">기억함</em>':'')+'</div>'+
    '<div class="k"'+(it.kind==="인과 사슬"?' style="font-size:16px;color:var(--jade-d)"':'')+'>'+esc(it.head)+'</div>'+
    (open
      ? '<div class="b">'+it.body+'</div>'
      : '<button class="peekbtn" data-go="open">'+(it.peek?esc(it.peek)+'<span>… 나머지는?</span>'
                                                          :'<span>속으로 떠올린 다음 눌러 봐</span>')+'</button>')+
    (open?gradeHTML(v):'')+
  '</div>';
}
function gradeHTML(v){
  return '<div class="grade">'+
    '<button class="g0'+(v===0?" on":"")+'" data-g="0">헷갈려</button>'+
    '<button class="g1'+(v===1?" on":"")+'" data-g="1">기억났어</button></div>';
}
function vReview(){
  titleEl.textContent="다시 훑기";
  if(RVTAB==="time"){ vTimeline(); return; }
  if(RVTAB==="face"){ vFacing(); return; }
  var done=LESSONS.filter(function(l){return S.done[l.id];});
  if(!done.length){
    view.innerHTML=tabsHTML()+'<div class="empty">'+scene("book",64)+'<p>아직 마친 수업이 없어.<br>수업을 하나라도 끝내면 그때 배운 암기 장치와 인과 사슬이 여기 모여.<br><br>사건 흐름과 통치↔저항 탭은 지금도 볼 수 있어.</p></div>';
    tabsBind();
    return;
  }
  var all=memList();
  var no=all.filter(function(x){return S.mem[x.k]===0;}).length;
  var ok=all.filter(function(x){return S.mem[x.k]===1;}).length;
  var rest=all.length-no-ok;
  var hide=mmHide(),only=mmOnly();
  var list=only?all.filter(function(x){return S.mem[x.k]!==1;}):all;
  var html=tabsHTML()+
    '<p class="note" style="margin-bottom:12px">마친 수업 '+done.length+'개에서 뽑은 암기 장치와 인과 사슬이야. '+
      '<b>읽지 말고 먼저 떠올려 봐.</b> 가려 둔 칸을 누르기 전에 속으로 답한 다음, '+
      '맞았는지 스스로 매기면 헷갈리는 것만 위로 올라와.</p>'+
    '<div class="mmbar">'+
      '<span class="pill no">헷갈림 '+no+'</span>'+
      '<span class="pill ok">기억함 '+ok+'</span>'+
      '<span class="pill">아직 '+rest+'</span></div>'+
    '<div class="tlbar">'+
      '<button class="chip'+(hide?" on":"")+'" id="mmh">'+(hide?"가리고 보기":"다 펴 놓기")+'</button>'+
      '<button class="chip'+(only?" on":"")+'" id="mmo">'+(only?"전부 보기":"덜 외운 것만")+'</button>'+
      '<span class="cnt">'+list.length+' / '+all.length+'</span></div>';
  if(!list.length)
    html+='<div class="empty">'+scene("book",56)+'<p>다 「기억함」으로 매겼어. 훌륭해.<br>「전부 보기」를 누르면 다시 볼 수 있어.</p></div>';
  html+=list.map(memCard).join("");
  html+='<p class="note" style="margin:16px 0 4px">시험 며칠 전엔 「덜 외운 것만」으로 좁혀서 이것만 돌리면 돼.</p>';
  view.innerHTML=html;
  tabsBind();
  document.getElementById("mmh").onclick=function(){S.mmHide=!hide;save();vReview();};
  document.getElementById("mmo").onclick=function(){S.mmOnly=!only;save();vReview();};
  /* 한 칸만 건드린다 — 화면 전체를 다시 그리면 보던 자리를 잃는다.
     view 에 위임을 걸면 화면을 다시 그릴 때마다 겹쳐 쌓이니 칸마다 직접 건다 */
  var byKey={}; all.forEach(function(x){byKey[x.k]=x;});
  Array.prototype.forEach.call(view.querySelectorAll(".rv.mm"),function(card){
    var it=byKey[card.dataset.k]; if(it)bindMem(card,it);
  });
}
function bindGrade(card,it){
  Array.prototype.forEach.call(card.querySelectorAll(".grade button"),function(b){
    b.onclick=function(){
      var v=+b.dataset.g;
      S.mem[it.k]=v; save(); buzz(v?14:[16,30,16]);
      card.classList.remove("m0","m1"); card.classList.add(v?"m1":"m0");
      Array.prototype.forEach.call(card.querySelectorAll(".grade button"),function(x){
        x.classList.toggle("on",+x.dataset.g===v);});
      var t=card.querySelector(".t"),old=t.querySelector(".mst");
      if(old)old.remove();
      t.insertAdjacentHTML("beforeend",v?'<em class="mst ok">기억함</em>':'<em class="mst no">헷갈림</em>');
    };
  });
}
function bindMem(card,it){
  var op=card.querySelector("[data-go=open]");
  if(op)op.onclick=function(){
    buzz(10);
    op.insertAdjacentHTML("afterend",'<div class="b">'+it.body+'</div>'+gradeHTML(S.mem[it.k]));
    op.remove();
    bindGrade(card,it);
  };
  bindGrade(card,it);
}

/* ── 오답 노트 화면 ──
   맞혀도 지우지 않는다. 「맞힘 ✓」만 붙이고, 지우기는 사용자가 하나씩 또는 한꺼번에 한다 */
var WTAB="all", WQF=null;
function vWrong(){
  titleEl.textContent="오답 노트";
  var all=wList();
  if(!all.length){
    view.innerHTML='<div class="empty">'+scene("paper",64)+
      '<p>틀린 문제가 없어.<br>수업을 풀다 틀리면 여기 자동으로 모여.<br>맞혀도 남아 있으니, 다 외웠을 때 직접 지우면 돼.</p></div>';
    return;
  }
  var nf=all.filter(function(x){return x.fix>0;}).length, no=all.length-nf;
  var list=WTAB==="open"?all.filter(function(x){return !x.fix;}):WTAB==="fixed"?all.filter(function(x){return x.fix>0;}):all;
  var byL={};list.forEach(function(x){(byL[x.lid]=byL[x.lid]||[]).push(x);});
  var T=[["all","전체 "+all.length],["open","아직 못 맞힘 "+no],["fixed","맞힘 ✓ "+nf]];
  var html='<div class="wsum"><div class="wn">'+all.length+'</div>'+
    '<div class="wt"><b>다시 볼 문제 '+all.length+'개'+(nf?' · 맞힌 것 '+nf+'개':'')+'</b>'+
    '<small>맞혀도 남아 있어. 다 외웠으면 「지우기」로 직접 빼. 두 번 이상 틀린 건 빨간 점으로 표시했어.</small></div></div>'+
    '<div class="chips" style="margin-bottom:10px">'+T.map(function(t){
      return '<button class="chip'+(WTAB===t[0]?" on":"")+'" data-wt="'+t[0]+'">'+t[1]+'</button>';}).join("")+'</div>'+
    (list.length?'<button class="cta" id="wgo" style="margin-bottom:6px">'+IC.play+' '+
      (WTAB==="all"?"오답 다시 풀기":WTAB==="open"?"못 맞힌 것만 다시 풀기":"맞힌 것 다시 풀기")+' ('+list.length+')</button>'
      :'<div class="empty"><p>이 칸엔 없어.</p></div>');
  var groups=LESSONS.map(function(l){return {key:l.id,name:l.title};});
  groups.push({key:"EXAM",name:"내신 실전"});
  groups.push({key:"NAME",name:"인물·단체 카드"});
  groups.forEach(function(gr){
    var g=byL[gr.key]; if(!g)return;
    html+='<div class="part">'+esc(gr.name)+'</div>';
    g.forEach(function(x){
      html+='<div class="wcard'+(x.fix>0?" fixed":x.miss>1?" hot":"")+'">'+
        (x.fix>0?'<div class="wfix">맞힘 ✓'+(x.fix>1?'×'+x.fix:'')+'</div>':'')+
        '<div class="wq">'+qh(x.q)+(x.miss>1?'<span class="dots" title="'+x.miss+'번 틀림">'+
          new Array(Math.min(x.miss,4)).join('<i></i>')+'<i></i></span>':'')+'</div>'+bokiBox(x.boki)+
        (x.type==="short"
          ? '<div class="wline ok">정답 · '+esc(x.c[0])+'</div>'
          : (x.chose!=null&&x.c[x.chose]!==undefined&&x.chose!==x.a
              ? '<div class="wline no">내 답 · '+esc(x.c[x.chose])+'</div>':'')+
            '<div class="wline ok">정답 · '+esc(x.c[x.a])+'</div>')+
        '<div class="wex">'+esc(x.e)+'</div>'+
        '<div class="delrow"><button class="delbtn" data-wd="'+esc(x.key)+'">지우기</button></div></div>';
    });
  });
  html+='<div class="bulk">'+
    (nf?'<button class="delbtn" id="wdf">맞힌 것 '+nf+'개 지우기</button>':'')+
    '<button class="delbtn" id="wda">오답 '+all.length+'개 전부 지우기</button></div>';
  view.innerHTML=html;
  Array.prototype.forEach.call(view.querySelectorAll("[data-wt]"),function(b){b.onclick=function(){WTAB=b.dataset.wt;vWrong();};});
  var wg=document.getElementById("wgo");
  if(wg)wg.onclick=function(){WQF=WTAB;go("wquiz");};
  Array.prototype.forEach.call(view.querySelectorAll("[data-wd]"),function(b){b.onclick=function(){
    var k=b.dataset.wd, keep=S.wrong[k]; if(!keep)return;
    delete S.wrong[k]; save(); buzz(10);
    var sy=window.scrollY; vWrong(); window.scrollTo(0,sy);
    undoBar("오답에서 지웠어",function(){ S.wrong[k]=keep; save(); if(stack[stack.length-1].n==="wrong"){var s2=window.scrollY;vWrong();window.scrollTo(0,s2);} });
  };});
  var bulk=function(pred,msg){
    var gone={}; Object.keys(S.wrong).forEach(function(k){ if(pred(S.wrong[k])){gone[k]=S.wrong[k];delete S.wrong[k];} });
    save(); WTAB="all"; vWrong();
    undoBar(msg.replace("N",Object.keys(gone).length),function(){ for(var k in gone)S.wrong[k]=gone[k]; save();
      if(stack[stack.length-1].n==="wrong")vWrong(); });
  };
  var df=document.getElementById("wdf"); if(df)armBtn(df,function(){bulk(function(w){return w.fix>0;},"맞힌 것 N개를 지웠어");});
  armBtn(document.getElementById("wda"),function(){bulk(function(){return true;},"오답 N개를 전부 지웠어");});
}

/* ── 오답 다시 풀기 ── */
var W=null;
function vWQuiz(){
  if(!W){var q=wList(); if(WU){var fu=WU;q=q.filter(function(x){return wUnit(x)===fu;});} WU=null;
    var qf=WQF; WQF=null;
    if(qf==="open")q=q.filter(function(x){return !x.fix;}); else if(qf==="fixed")q=q.filter(function(x){return x.fix>0;});
    shuffleArr(q);
    /* 못 맞힌 것을 앞에 둔다 */
    q=q.filter(function(x){return !x.fix;}).concat(q.filter(function(x){return x.fix>0;}));
    W={q:q,i:0,ok:0,answered:false,start:q.length,okKeys:[]};}
  titleEl.textContent="오답 다시 풀기";
  if(!W.q.length||W.i>=W.q.length){
    var left=W.okKeys.filter(function(k){return S.wrong[k];});
    var open=Object.keys(S.wrong).filter(function(k){return !S.wrong[k].fix;}).length;
    var perfect=W.start>0&&W.ok===W.start;
    view.innerHTML='<div class="done-hero">'+
      (perfect?'<div class="stamp show">'+stampSVG(72)+'</div>':'<div class="scene">'+scene("paper",64)+'</div>')+
      '<div class="big">'+W.ok+' / '+W.start+'</div>'+
      '<div class="sub">'+(W.ok?W.ok+"개 맞혔어. ":"")+(open?"아직 못 맞힌 게 "+open+"개 있어.":
        wCount()?"남은 오답은 다 한 번씩 맞혔어. 다 외운 건 지워도 돼.":"오답 노트가 비었어.")+'</div></div>'+
      (left.length?'<div class="bulk"><button class="delbtn" id="wdok">이번에 맞힌 '+left.length+'개 오답에서 지우기</button></div>':'')+
      '<div class="sticky"><div class="row">'+
        '<button class="cta ghost" id="hm">홈으로</button>'+
        (open?'<button class="cta" id="ag">못 맞힌 것 한 번 더</button>':'<button class="cta" id="wn">오답 노트 보기</button>')+
      '</div></div>';
    var home=function(){W=null;stack=[{n:"home"}];render();};
    document.getElementById("hm").onclick=home;
    var ag=document.getElementById("ag"); if(ag)ag.onclick=function(){W=null;WQF="open";go("wquiz",null,true);};
    var wn=document.getElementById("wn"); if(wn)wn.onclick=function(){W=null;WTAB="all";go("wrong",null,true);};
    var dk=document.getElementById("wdok");
    if(dk)dk.onclick=function(){
      var gone={}; left.forEach(function(k){gone[k]=S.wrong[k];delete S.wrong[k];}); save(); buzz(10);
      vWQuiz();
      undoBar(left.length+"개를 오답에서 지웠어",function(){ for(var k in gone)S.wrong[k]=gone[k]; save(); if(W&&stack[stack.length-1].n==="wquiz")vWQuiz(); });
    };
    return;
  }
  var x=W.q[W.i];
  if(!x.mixed){
    var mx=mixQ({q:x.q,c:x.c,a:x.a,e:x.e,type:x.type,boki:x.boki});
    x.c=mx.c; x.a=mx.a; x.e=mx.e; x.boki=mx.boki; x.back=mx.back; x.mixed=true;
  }
  view.innerHTML=
    '<div style="display:flex;align-items:center;gap:12px;padding:2px 0 16px">'+
      '<span class="track"><i style="width:'+(W.i/W.q.length*100)+'%"></i></span>'+
      '<span class="step">'+(W.i+1)+' / '+W.q.length+'</span></div>'+
    '<div class="card"><div class="eyebrow">'+esc(x.lesson.title)+
      (x.miss>1?' · '+x.miss+'번 틀림':'')+'</div>'+
      '<div class="h sm">'+qh(x.q)+'</div>'+bokiBox(x.boki)+'</div>'+
    (x.type==="short"
      ? '<div class="shortin"><input type="text" id="wIn" inputmode="text" autocomplete="off" '+
        'autocapitalize="off" spellcheck="false" placeholder="답을 적어 보세요"></div>'
      : '<div style="margin-top:12px" id="opts">'+x.c.map(function(c,i){
          return '<button class="qopt" data-i="'+i+'"><span class="kx">'+"①②③④⑤".charAt(i)+'</span><span>'+esc(c)+'</span></button>';
        }).join("")+'</div>')+
    '<div id="fb"></div>'+
    (x.type==="short"?'<div class="sticky"><button class="cta" id="wsub">제출</button></div>':'');
  W.answered=false;

/* ── 선지 섞기 ──
   원본 데이터는 정답이 대개 첫 칸에 적혀 있다(수업 퀴즈 80문항 · 2지선다 20장 전부, 내신 대부분).
   그대로 내면 「무조건 첫 번째」로 다 맞힌다. 그래서 낼 때마다 섞은 사본을 만든다.
   원본은 건드리지 않고, 고른 번호는 원본 번호로 되돌려 저장한다(오답 노트가 원본을 보므로).
   <보기> 조합형은 선지 대신 ㄱ~ㄹ 진술의 자리를 섞고, 정답 조합과 해설 속 ㄱ~ㄹ 도 따라 바꾼다 */
var BLBL=["ㄱ","ㄴ","ㄷ","ㄹ"];
function lblSet(s){ var o=[]; String(s).replace(/[ㄱㄴㄷㄹ]/g,function(ch){o.push(BLBL.indexOf(ch));}); return o.sort().join(","); }
function mixQ(q){
  if(!q||!q.c||q.a==null||q.type==="short")return q;
  var m={},k; for(k in q)m[k]=q[k];
  if(q.boki){
    var sets=q.c.map(lblSet), want=sets[q.a], n=q.boki.length;
    for(var t=0;t<40;t++){
      var P=shuffleArr(BLBL.slice(0,n).map(function(_,i){return i;}));   /* 새 자리 j 에 원래 P[j] */
      var inv=[]; P.forEach(function(o,j){inv[o]=j;});
      var ns=want.split(",").map(function(x){return inv[+x];}).sort().join(",");
      var na=sets.indexOf(ns);
      if(na<0)continue;                      /* 정답 조합이 선지에 없는 배치는 버린다 */
      m.boki=P.map(function(o){return q.boki[o];});
      m.a=na;
      m.e=String(q.e).replace(/[ㄱㄴㄷㄹ]/g,function(ch){var o=BLBL.indexOf(ch);return inv[o]!=null?BLBL[inv[o]]:ch;});
      m.back=sets.map(function(sk){
        var orig=sk.split(",").map(function(x){return P[+x];}).sort().join(",");
        var oi=sets.indexOf(orig); return oi<0?null:oi;
      });
      return m;
    }
    return q;
  }
  var idx=shuffleArr(q.c.map(function(_,i){return i;}));   /* 새 자리 j 에 원래 idx[j] */
  m.c=idx.map(function(i){return q.c[i];});
  m.a=idx.indexOf(q.a);
  m.back=idx;
  return m;
}
function unmix(m,i){ return (m&&m.back&&i!=null)?m.back[i]:i; }
function shuffleArr(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

var IDX=null, FQ="";
function buildIndex(){
  if(IDX)return IDX;
  IDX=[];
  LESSONS.forEach(function(l,li){
    IDX.push({t:"수업",lid:l.id,li:li,ci:0,head:l.title,body:l.hook});
    l.cards.forEach(function(c,ci){
      var head="",body="";
      if(c.t==="fact"){head=c.n+" · "+yLab(c)+(YAPX[c.n]?"":"년");body=c.b+" "+c.why+" "+c.so;}
      else if(c.t==="hint"){head=c.k;body=c.b;}
      else if(c.t==="chain"){head=c.title;body=c.items.join(" ");}
      else if(c.t==="compare"){head=c.title;body=c.l.n+" "+c.l.p.join(" ")+" "+c.r.n+" "+c.r.p.join(" ");}
      else if(c.t==="story"){head=c.h;body=c.b;}
      else if(c.t==="check"){head=c.q;body=c.a;}
      else if(c.t==="pick"){head=c.q;body=c.c.join(" ")+" "+c.e;}
      if(head||body)IDX.push({t:"수업",lid:l.id,li:li,ci:ci,head:head,body:body,sub:l.title});
    });
    l.quiz.forEach(function(q,qi){
      IDX.push({t:"퀴즈",lid:l.id,li:li,ci:-1,head:q.q,body:q.c.join(" ")+" "+q.e,sub:l.title,
        ans:q.c[q.a],ex:q.e});
    });
  });
  ESSAY.forEach(function(x){
    IDX.push({t:"서술형",wid:x.id,head:x.q,body:x.keys.join(" ")+" "+x.model,sub:UMAP[x.u].n});
  });
  NAMES.forEach(function(x){
    var cl=x.cl.map(stripTags);
    IDX.push({t:"인물·단체",head:x.n,body:cl.join(" ")+" "+x.e,sub:x.k+" · "+UMAP[x.u].n,ans:cl.join(" · "),ex:x.e});
  });
  EXAM.forEach(function(q){
    IDX.push({t:"내신",eid:q.id,head:q.q.split("\n")[0],
      body:(q.boki?q.boki.join(" "):"")+" "+q.c.join(" ")+" "+q.e,
      sub:UMAP[q.u].n, ans:(q.type==="short"?q.c[0]:q.c[q.a]), ex:q.e});
  });
  return IDX;
}
function strip(x){return String(x).replace(/<[^>]+>/g,"");}
function findHits(term){
  var t=term.trim().toLowerCase(); if(t.length<1)return [];
  return buildIndex().filter(function(r){
    return (strip(r.head)+" "+strip(r.body)).toLowerCase().indexOf(t)>=0;
  }).slice(0,60);
}
function hl(text,term){
  var s0=strip(text), i=s0.toLowerCase().indexOf(term.toLowerCase());
  if(i<0)return esc(s0.slice(0,80));
  var a=Math.max(0,i-26);
  return (a?"…":"")+esc(s0.slice(a,i))+"<mark>"+esc(s0.slice(i,i+term.length))+"</mark>"+
         esc(s0.slice(i+term.length,i+term.length+52))+"…";
}

{id:"x8g",u:"s8",type:"mc5",q:"3부 통합 운동의 결과로 옳은 것은?",
 c:["국민부와 혁신 의회로 재편되었다.","완전한 통합이 이루어졌다.","3부가 모두 해체되었다.","임시 정부에 흡수되었다.","동북 항일 연군으로 통합되었다."],a:0,
