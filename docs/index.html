/* 차트런 — 픽셀 게임 껍데기. 캔버스는 정수배로만 키우고, 글자는 DOM 이 맡는다. */

:root {
  /* --view-w / --view-h 는 단위 없는 숫자다 (aspect-ratio 에 그대로 쓰려고).
     --scale 은 app.js 가 .shell 에 얹는다. 그래서 화면 폭 계산은 :root 가 아니라
     .screen-wrap 에서 해야 한다 — :root 에서 계산하면 아래 기본값 3 으로 굳어버린다. */
  --scale: 3;
  --view-w: 384;
  --view-h: 224;
  /* 눕힌 화면에서 좌우로 비워두는 폭. **원본은 touchLayout.js 의 ROTATED_SIDE** 이고
     createTouchLayout() 이 켜질 때 얹는다. 여기 값은 그 전까지 쓰는 같은 숫자다. */
  --rotated-side: 44px;
  /* 조작 버튼 기본 크기. 여백(폰마다 88~104px) 안에 들어가야 게임 화면을 안 가린다.
     테스트가 --rotated-side 와 함께 재고 있으니 한쪽만 바꾸면 걸린다. */
  --pad-w: 50px;
  --pad-h: 46px;
  --ink: #f2f0ff;
  --dim: #b3aecd;
  --bg: #0a0616;
  --panel: rgba(14, 8, 28, 0.88);
  --hot: #ff5d8f;
  --good: #39ff9a;
  --warn: #ffd166;
  /* DotGothic16 은 진짜 도트 폰트라 숫자·영문(#37, STAGE 1)이 픽셀로 나온다.
     한글은 안 들어있어서 자연스럽게 Gowun Dodum 으로 떨어진다. */
  --font: 'DotGothic16', 'Gowun Dodum', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
}

* {
  box-sizing: border-box;
}

/* display 를 지정한 요소도 hidden 이면 확실히 숨긴다 */
[hidden] {
  display: none !important;
}

html,
body {
  margin: 0;
  height: 100%;
}

body {
  background:
    radial-gradient(circle at 50% 0%, #2a1044 0%, var(--bg) 62%),
    var(--bg);
  color: var(--ink);
  font-family: var(--font);
  display: grid;
  place-items: center;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

.shell {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 12px;
  width: 100%;
  max-width: 100vw;
}

/* ── 화면 ─────────────────────────────────────────────── */
.screen-wrap {
  position: relative;
  /* 좁은 화면에서는 화면 너비에 맞춰 줄어든다 — 안 그러면 밖으로 삐져나간다 */
  width: min(calc(var(--view-w) * var(--scale) * 1px), 100%);
  max-height: 100%;
  aspect-ratio: var(--view-w) / var(--view-h);
  height: auto;
  border: 3px solid #3a2358;
  border-radius: 6px;
  box-shadow:
    0 0 0 3px #150a26,
    0 18px 50px rgba(0, 0, 0, 0.6);
  overflow: hidden;
  background: #000;
}

canvas#game {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* 살짝 스캔라인 */
.screen-wrap::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0, 0, 0, 0.14) 0 1px,
    transparent 1px 3px
  );
  opacity: 0.45;
}

.ui {
  position: absolute;
  inset: 0;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  font-size: clamp(11px, calc(var(--scale) * 3.4px), 17px);
}

/* ── HUD ──────────────────────────────────────────────── */
.hud {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 12px;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.85);
}

.hud-rank {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

#rank {
  font-size: 1.9em;
  line-height: 1;
  color: var(--warn);
}

.hud-right {
  display: flex;
  gap: 12px;
  color: var(--dim);
  font-size: 0.8em;
  padding-top: 4px;
}

.hud-right span {
  white-space: nowrap;
}

/* 데스크톱 아래쪽 키보드 안내. **규칙이 아예 없어서** 브라우저 기본 스타일로
   떴다 — 픽셀 폰트 UI 한가운데 kbd 만 고딕 모노스페이스였다.
   (폰에서는 body.handheld .help 가 통째로 숨긴다) */
.help {
  margin: 0;
  color: var(--dim);
  font-size: 12px;
  line-height: 1.9;
  text-align: center;
  max-width: 62ch;
}

.help kbd {
  font-family: var(--font);
  font-size: 0.9em;
  color: var(--ink);
  background: rgba(36, 19, 56, 0.6);
  border: 1px solid #43265f;
  border-radius: 4px;
  padding: 1px 5px;
  margin: 0 1px;
}

/* ── 가운데 패널 ──────────────────────────────────────── */
.center {
  flex: 1;
  /* flex 칸은 기본이 min-height: auto 라 내용보다 안 줄어든다 — 이게 없으면
     아래 패널의 max-height: 100% 가 잴 기준이 없어서 그냥 넘쳐 잘린다 */
  min-height: 0;
  display: grid;
  place-items: center;
  padding: 10px;
}

.panel {
  background: var(--panel);
  border: 3px solid #5a3382;
  border-radius: 6px;
  padding: clamp(14px, calc(var(--scale) * 6px), 30px);
  text-align: center;
  max-width: 90%;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

.panel h1 {
  margin: 4px 0;
  font-size: 2.6em;
  letter-spacing: 0.06em;
  color: var(--warn);
  text-shadow: 0 3px 0 #8a2350;
}

/* 2회차까지 끝낸 표시. 제목 옆에 작게 — 크게 두면 제목을 잡아먹는다 */
.panel h1 .crown {
  font-size: 0.5em;
  vertical-align: super;
  color: var(--good);
  text-shadow: none;
}

.panel h2 {
  margin: 4px 0;
  font-size: 1.5em;
  letter-spacing: 0.06em;
}

.big-rank {
  margin: 6px 0 0;
  font-size: 2em;
  color: var(--warn);
}

.tagline {
  margin: 8px 0 0;
  color: var(--dim);
  line-height: 1.6;
  font-size: 0.86em;
}

.press {
  margin: 14px 0 0;
  font-size: 0.82em;
  color: var(--good);
  animation: blink 1.1s steps(2, end) infinite;
}

.record {
  margin: 8px 0 0;
  font-size: 0.74em;
  color: var(--dim);
}

.panel.death {
  border-color: var(--hot);
}

.panel.good {
  border-color: var(--good);
}

.panel.ending {
  border-color: var(--warn);
  min-width: min(340px, 86%);
}

.panel.title-panel {
  min-width: min(320px, 86%);
  position: relative;
}

/* 첫 판에만 뜨는 조작 안내. 폰에서는 아래 .help 가 숨겨져 있어 여기가 유일한 설명이다 */
.first-help {
  list-style: none;
  margin: 12px auto 0;
  padding: 8px 10px;
  width: fit-content;
  text-align: left;
  font-size: 0.7em;
  line-height: 1.7;
  color: var(--dim);
  border: 1px solid #43265f;
  border-radius: 6px;
}

.first-help b {
  color: var(--ink);
  font-weight: 400;
}

/* 엔딩에서 「2회차 열림」. 클리어 표시(♛)와 달리 **지금 막 생긴 것**이라 눈에 띄어야 한다 */
.stats .opened {
  color: var(--good);
}

/* 저장이 막힌 기기에 뜨는 한 줄. 못 하게 막는 게 아니라 알려주는 것이다 */
.warn {
  margin: 8px 0 0;
  font-size: 0.7em;
  color: var(--warn);
}

/* ── 개발자 모드 ───────────────────────────────────────── */
/* 숨기려는 게 아니라 실수로 안 눌리게 하려는 것이므로 구석에 작게 둔다 */
.dev-open {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 26px;
  height: 26px;
  padding: 0;
  font-size: 12px;
  line-height: 1;
  color: var(--dim);
  background: transparent;
  border: 1px solid #43265f;
  border-radius: 5px;
  opacity: 0.5;
  cursor: pointer;
  /* .ui 전체가 pointer-events: none 이라 눌리는 것만 되살린다 */
  pointer-events: auto;
}

.dev-open:hover {
  opacity: 1;
}

/* 고르는 줄 (타이틀 · 스테이지 선택) */
.menu,
.slots {
  list-style: none;
  margin: 12px 0 0;
  padding: 0;
  display: grid;
  gap: 4px;
  font-size: 0.9em;
}

.menu li,
.slots li {
  padding: 5px 10px;
  border: 2px solid transparent;
  border-radius: 5px;
  color: var(--dim);
}

.menu li.on,
.slots li.on {
  color: var(--ink);
  border-color: var(--warn);
  background: rgba(255, 209, 102, 0.12);
}

/* 고를 게 늘면 224px 짜리 화면에 한 줄로는 안 들어간다 (하드모드가 붙으면서 13줄,
   2회차 입구가 붙으면서 15줄이 됐다). **세로로 채우고 넘치면 옆 칸으로** 넘어간다 —
   고르기는 selectIndex 하나짜리 1차원이라 ◀▶ 가 "목록을 따라 내려간다"로 읽힌다.
   줄 수를 따로 안 적는 게 중요하다. 목록이 더 늘어도 칸이 저절로 하나 더 생긴다.
   (8줄 × 2칸 = 16. padlayout 테스트가 이 곱을 목록 길이와 견준다 — 세 칸이 되면
   패널이 화면보다 넓어진다) */
.slots {
  --slot-rows: 8;
  grid-auto-flow: column;
  grid-template-rows: repeat(var(--slot-rows), auto);
  column-gap: 14px;
  /* 그래도 안 들어가면 잘리지 말고 굴러간다 (제목과 안내는 남는다) */
  overflow-y: auto;
  min-height: 0;
}

.slots li {
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  white-space: nowrap;
}

.panel.select-panel {
  min-width: min(300px, 86%);
  /* 목록만 굴러가고 제목·안내는 제자리에 남아야 한다 */
  max-height: 100%;
  display: flex;
  flex-direction: column;
}

/* 숫자판 */
.keypad-panel {
  min-width: min(260px, 86%);
}

.dots {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 12px 0;
}

.dots i {
  width: 12px;
  height: 12px;
  border: 2px solid #5a3382;
  border-radius: 50%;
}

.dots i.on {
  background: var(--warn);
  border-color: var(--warn);
}

/* 틀렸을 때 한 번 흔든다 */
.dots.bad i {
  border-color: var(--hot);
  background: transparent;
  animation: shake 0.3s;
}

@keyframes shake {
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  pointer-events: auto; /* .ui 가 none 이라 여기서 되살린다 */
}

.keypad button {
  font-family: var(--font);
  font-size: 1em;
  padding: 10px 0;
  color: var(--ink);
  background: #241338;
  border: 2px solid #5a3382;
  border-radius: 5px;
  cursor: pointer;
}

.keypad button:active {
  background: var(--warn);
  color: #2a1607;
}

.keypad button.wide {
  font-size: 0.8em;
}

.stats {
  list-style: none;
  margin: 14px 0 0;
  padding: 0;
  display: grid;
  gap: 5px;
  font-size: 0.82em;
}

/* 18초짜리 결혼식 컷신의 마침표가 표 한 장 뿅 이었다. 줄을 차례로 들여보낸다 —
   눈이 위에서 아래로 따라 읽게 된다. **전체 0.7초 안에 끝낸다**: 반복해서 보는
   화면이라 길면 그때부터는 기다림이다. (nth-child 로 늦추므로 줄이 늘어도
   여덟 번째까지는 저절로 붙는다) */
.panel.ending .stats li {
  animation: stat-in 0.26s ease-out both;
}

.panel.ending .stats li:nth-child(1) { animation-delay: 0.05s; }
.panel.ending .stats li:nth-child(2) { animation-delay: 0.13s; }
.panel.ending .stats li:nth-child(3) { animation-delay: 0.21s; }
.panel.ending .stats li:nth-child(4) { animation-delay: 0.29s; }
.panel.ending .stats li:nth-child(5) { animation-delay: 0.37s; }
.panel.ending .stats li:nth-child(6) { animation-delay: 0.45s; }
.panel.ending .stats li:nth-child(7) { animation-delay: 0.53s; }
.panel.ending .stats li:nth-child(n + 8) { animation-delay: 0.61s; }

@keyframes stat-in {
  from {
    opacity: 0;
    transform: translateY(-4px);
  }
}

/* 「아무 키나 누르면」은 **정말 누를 수 있게 된 뒤에** 뜬다.
   --ending-lock 은 core 의 ENDING_LOCK 과 같은 값이다 (테스트가 둘을 견준다).
   예전에는 입력을 안 받는 1.5초 동안에도 깜빡이고 있어서 거짓말을 했다. */
.panel.ending {
  --ending-lock: 1.5s;
}

.panel.ending .press {
  animation:
    stat-in 0.3s ease-out var(--ending-lock) both,
    blink 1.1s steps(2, end) calc(var(--ending-lock) + 0.3s) infinite;
}

.stats li {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  border-bottom: 1px dotted #4a2a66;
  padding-bottom: 3px;
}

.stats span {
  color: var(--dim);
}

/* 최고 기록을 깼을 때만 뜬다 */
.stats .fresh {
  margin-left: 6px;
  padding: 1px 4px;
  font-style: normal;
  font-size: 0.8em;
  color: #2a1607;
  background: var(--warn);
  border-radius: 3px;
}

@keyframes blink {
  50% {
    opacity: 0.25;
  }
}

/* ── 터치 조작 ────────────────────────────────────────── */
/* 화면 전체에 겹쳐 뜨는 반투명 패드. 화면 아래에 자리를 따로 내주면 좁은 폰에서
   정작 게임이 손톱만 해진다. 게임 화면(.screen-wrap)이 아니라 그 바깥(.shell)에
   얹어서, 가로 화면의 좌우 검은 여백으로 최대한 밀어낸다. */
.touch {
  display: none;
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
}

.touch-left,
.touch-right {
  position: absolute;
  bottom: 0;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 8px;
  pointer-events: auto;
}

.touch-left {
  left: 0;
}

.touch-right {
  right: 0;
}

.touch button {
  font-family: var(--font);
  font-size: 17px;
  color: var(--ink);
  background: rgba(36, 19, 56, 0.55);
  border: 2px solid rgba(160, 120, 220, 0.7);
  border-radius: 10px;
  padding: 0;
  /* 손 크기가 사람마다 다르다. 편집 바에서 --pad-scale 로 키우고 줄인다.
     기본값은 게임 화면을 덜 가리는 쪽으로 잡는다 — 손끝(44px)보다는 크게. */
  width: calc(var(--pad-w) * var(--pad-scale, 1));
  height: calc(var(--pad-h) * var(--pad-scale, 1));
  backdrop-filter: blur(2px);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

/* 점프는 제일 많이 누르니 제일 크게 */
.touch button[data-action='jump'] {
  width: calc((var(--pad-w) + 14px) * var(--pad-scale, 1));
  height: calc((var(--pad-h) + 12px) * var(--pad-scale, 1));
  background: rgba(90, 24, 60, 0.6);
  border-color: rgba(255, 120, 170, 0.75);
}

/* 이름이 적히는 버튼(점프·대시·마이크)은 기본 폭(50px)에 「마이크」가 안 들어간다.
   ◀▶ 처럼 한 글자인 버튼은 그대로 둔다. */
.touch button[data-action='jump'],
.touch button[data-action='dash'],
.touch button[data-action='throw'] {
  width: calc((var(--pad-w) + 14px) * var(--pad-scale, 1));
  font-size: 15px;
}

/* 「마이크」는 이 버튼들 중 제일 긴 이름이라, 고정 크기로 두면 버튼을 제일 작게(70%)
   줄였을 때 칸(41px)에 글자(40px)가 꽉 찬다. 칸과 같은 비율로 같이 줄인다. */
.touch button[data-action='dash'],
.touch button[data-action='throw'] {
  font-size: calc(15px * var(--pad-scale, 1));
}

.touch button.is-down {
  background: var(--hot);
  border-color: #ffd7e2;
}

/* 조작 버튼 투명도. 편집 바에서 고른다 (--pad-alpha 는 touchLayout 이 body 에 얹는다) */
.touch button[data-action] {
  opacity: var(--pad-alpha, 1);
}

.touch button[data-action][disabled] {
  opacity: 0.3;
}

/* 평소엔 비쳐 보이고 **누를 때만** 진해진다. 위 opacity 규칙과 특정도가 같으므로
   반드시 뒤에 와야 이긴다. (is-down 은 bindTouchButtons 가 붙인다) */
.touch button[data-action].is-down {
  opacity: 1;
}

/* ── 버튼 위치 커스텀 ─────────────────────────────────── */
/* 손 크기도 잡는 법도 사람마다 다르다. 끌어다 놓을 수 있게 한다. */
/* 아래 .touch button 규칙(58×52)을 확실히 덮으려고 선택자를 한 단계 더 준다 */
.touch button.pad-edit {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 34px;
  height: 34px;
  padding: 0;
  font-size: 15px;
  line-height: 1;
  color: var(--dim);
  background: rgba(36, 19, 56, 0.45);
  border: 1px solid rgba(160, 120, 220, 0.45);
  border-radius: 8px;
  pointer-events: auto;
  touch-action: none;
}

/* 눕힌 화면에서는 이쪽 끝이 내비게이션 바다 — 버튼과 같은 만큼 들인다 */
body.rotated .touch button.pad-edit {
  right: var(--rotated-side);
}

/* 멈춤 — 손잡이(✥) 왼쪽에 같은 크기로. 게임 중에 잘못 누르면 안 되니 작고 흐리게 둔다. */
.touch button.pause-btn {
  position: absolute;
  top: 8px;
  right: 50px;
  width: 34px;
  height: 34px;
  padding: 0;
  font-size: 15px;
  line-height: 1;
  color: var(--dim);
  background: rgba(36, 19, 56, 0.45);
  border: 1px solid rgba(160, 120, 220, 0.45);
  border-radius: 8px;
  /* .touch 전체가 pointer-events: none 이라 여기서 되살린다 —
     이게 없으면 캔버스가 탭을 다 먹어서 폰에서 버튼이 죽어 있다 */
  pointer-events: auto;
  touch-action: none;
}

/* 눌린 표시를 **여기서 다시** 준다.
   위쪽 `.touch button.is-down` 과 `.touch button.pause-btn` 은 가중치가 똑같아서(0-2-1)
   뒤에 오는 pause-btn 의 background·border 가 이긴다 — 그래서 ⏸ 만 눌러도 색이 안 변했다.
   진동은 오는데 화면은 그대로라 눌렸는지 알 수가 없었다. */
.touch button.pause-btn.is-down {
  background: var(--hot);
  border-color: #ffd7e2;
  color: var(--ink);
}

/* 손잡이(✥) 왼쪽에 42px 띄워서 — 세로 화면의 right: 8px / 50px 과 같은 간격 */
body.rotated .touch button.pause-btn {
  right: calc(var(--rotated-side) + 42px);
}

/* 자리를 직접 정한 뒤에는 위 top/right 대신 좌표가 먹어야 한다 */
body.custom-pads .touch button.pause-btn {
  top: auto;
  right: auto;
}

.pad-bar {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  background: rgba(6, 2, 14, 0.92);
  border: 2px solid var(--warn);
  border-radius: 6px;
  font-size: 12px;
  /* 조절할 게 늘어서 한 줄에 안 들어간다. 좁은 폰에서는 두 줄로 접힌다. */
  flex-wrap: wrap;
  justify-content: center;
  max-width: calc(100% - 24px);
  pointer-events: auto;
  z-index: 4;
}

.pad-hint {
  /* 안내는 제 줄을 차지한다 — 버튼들 사이에 끼면 좁은 폰에서 줄이 엉킨다 */
  flex-basis: 100%;
  text-align: center;
  color: var(--dim);
  font-size: 11px;
}

.pad-bar button {
  flex: none;
  width: auto;
  height: auto;
  font-family: var(--font);
  font-size: 12px;
  padding: 5px 10px;
  color: var(--ink);
  background: #241338;
  border: 1px solid #5a3382;
  border-radius: 5px;
  touch-action: none;
}

/* 크기 조절 — − 100% + */
.pad-size {
  display: flex;
  align-items: center;
  gap: 4px;
}

.pad-size button {
  width: 26px;
  padding: 4px 0;
  font-size: 14px;
  line-height: 1;
}

.pad-size b {
  min-width: 38px;
  text-align: center;
  color: var(--warn);
}

.pad-bar #pad-done {
  background: var(--good);
  border-color: var(--good);
  color: #06210f;
}

/* 자리를 직접 정해둔 상태 — 묶음 상자를 걷어내고 버튼마다 좌표를 준다.
   position: static 이 핵심이다. display: contents 만으로는 브라우저에 따라
   묶음 상자가 "기준 상자(containing block)" 로 남아서, 버튼이 화면 전체가 아니라
   묶음 안에서 좌표를 잡는다 — 그러면 엉뚱한 자리로 날아간다. */
body.custom-pads .touch-left,
body.custom-pads .touch-right {
  position: static;
  display: contents;
}

body.custom-pads .touch button[data-action] {
  position: absolute;
  transform: translate(-50%, -50%);
  pointer-events: auto;
}

/* 편집 중 */
body.pad-editing .touch {
  background: rgba(4, 2, 10, 0.55);
}

body.pad-editing .touch button[data-action] {
  outline: 2px dashed var(--warn);
  outline-offset: 2px;
  opacity: 0.95;
}

body.pad-editing .touch button[data-action][disabled] {
  opacity: 0.7;
}

/* 편집 중에는 손잡이가 숨으므로 편집 바만 남는다 */
body.pad-editing .touch button.pad-edit {
  display: none;
}

/* 편집 바와 안내가 같은 자리라 겹친다. 편집 중에는 안내를 걷는다. */
body.pad-editing .rotate-note {
  display: none;
}

/* ── 컷신 건너뛰기 ────────────────────────────────────── */
/* 컷신이 도는 동안만 오른쪽 아래에 뜬다. 예전에는 「아무 키나 누르면 넘어간다」를
   아무도 몰라서 18초짜리 엔딩을 끝까지 봐야 하는 줄 알았다. */
.skip-btn {
  position: absolute;
  right: 10px;
  bottom: 10px;
  padding: 7px 14px;
  font-family: var(--font);
  font-size: 0.78em;
  color: var(--ink);
  background: rgba(20, 10, 36, 0.72);
  border: 2px solid #6b3f96;
  border-radius: 6px;
  cursor: pointer;
  /* .ui 전체가 pointer-events: none 이라 눌리는 것만 되살린다 */
  pointer-events: auto;
  backdrop-filter: blur(2px);
}

.skip-btn:hover {
  border-color: var(--warn);
}

/* 눕힌 화면에서는 오른쪽 여백이 조작 버튼 자리다 — 안쪽으로 들인다 */
body.rotated .skip-btn {
  right: calc(var(--rotated-side) + 10px);
}

/* 컷신 동안에는 조작 버튼이 아무 일도 안 한다. 띄워두면 화면만 가리고, 무엇보다
   .touch 가 .ui 위에 얹혀 있어서 **대시 버튼이 「건너뛰기」를 덮어 누를 수가 없다**
   (보스 전환 컷신에서 실제로 걸렸다). 자리를 옮기는 중이면(pad-editing) 건드리지
   않는다 — 그때는 touchLayout 이 숨은 버튼까지 꺼내서 자리를 재고 있다. */
body.in-cut:not(.pad-editing) .touch-left,
body.in-cut:not(.pad-editing) .touch-right {
  display: none;
}

/* 타이틀 메뉴와 스테이지 선택도 탭으로.
   .ui 위에 캔버스가 얹혀 있어서 여기서 되살리지 않으면 줄을 눌러도 캔버스가 먹는다.
   특히 「뒤로」는 이게 없으면 폰에서 누를 방법이 아예 없다 (R 키가 없다). */
.title-panel .menu,
.select-panel .slots,
.select-panel .back-btn {
  pointer-events: auto;
}

.title-panel .menu li,
.select-panel .slots li {
  cursor: pointer;
}

.back-btn {
  align-self: center;
  margin: 10px 0 0;
  padding: 6px 18px;
  font-family: var(--font);
  font-size: 0.78em;
  color: var(--dim);
  background: transparent;
  border: 1px solid #43265f;
  border-radius: 6px;
  cursor: pointer;
  /* 목록이 굴러가도 이 버튼은 안 줄어든다 */
  flex: 0 0 auto;
}

.back-btn:hover {
  color: var(--ink);
}

/* ── 눌린 표시 ────────────────────────────────────────── */
/* 조작 버튼은 .is-down 으로 색이 바뀌는데(bindTouchButtons), 화면 UI 버튼에는
   :hover 밖에 없었다. **폰에는 hover 가 없다.** 게다가 body 에
   -webkit-tap-highlight-color: transparent 를 깔아둬서 브라우저 기본 탭 반응도
   없앴다 — 「건너뛰기」나 「뒤로」를 눌러도 정말로 아무 일도 안 일어난 것처럼 보였다.
   조작 버튼과 **같은 색**(--hot)을 써서 "눌림"이 게임 안에서 한 가지 뜻이 되게 한다. */
.skip-btn:active,
.back-btn:active,
.dev-open:active,
.pad-bar button:active,
.menu li:active,
.slots li:active {
  background: var(--hot);
  border-color: #ffd7e2;
  color: var(--ink);
}

/* 고른 줄은 원래 테두리가 밝다 — 누르는 동안에는 배경까지 차야 눌림이 읽힌다 */
.menu li:active,
.slots li:active {
  border-color: #ffd7e2;
}

/* 숨은 화면. 앨범 열일곱 장은 캔버스가 그리므로 **패널을 띄우지 않는다** —
   가운데에 패널이 뜨면 정작 보여줄 격자를 통째로 가린다. 나가는 버튼만 아래에 둔다
   (.center 가 grid 라 align-self 로 바닥에 붙는다) */
.gallery-bar {
  align-self: end;
  pointer-events: auto;
}

.gallery-bar .back-btn {
  background: rgba(10, 4, 16, 0.82);
  border-color: #5a3382;
  color: var(--ink);
}

/* 일시정지 메뉴 — .ui 전체가 pointer-events: none 이라 여기서 되살린다 (숫자판과 같은 이유) */
.pause-panel .menu {
  pointer-events: auto;
}

.pause-panel .menu li {
  cursor: pointer;
}

.touch button.is-moving {
  outline-color: var(--good);

/** 타일 한 칸. core/physics 의 TILE 과 같은 값이지만 boss.js 는 물리를 안 가져온다 */
const TILE_PX = 16;

/**
 * floorY 는 레이저가 닿을 바닥 높이다. 기본값을 두는 이유는
 * tests/boss.test.js 가 createBoss(640) 로 부르기 때문이다.
 */
function createBoss(arenaWidth, floorY = 192, hard = false) {
  const phases = phasesFor(hard);
  const maxHp = maxHpFor(hard);
  return {
    x: arenaWidth / 2 - BOSS_W / 2,
    y: 40,
    w: BOSS_W,
    h: BOSS_H,
    homeY: 40,
    hp: maxHp,
    maxHp,
    /**
     * 체력계가 뒤따라오는 잔상. 실제 체력을 **늦게** 쫓아온다.
     * 한 대가 3분의 1이라 막대가 순식간에 줄어드는데, 잔상이 없으면 언제 얼마나
     * 들어갔는지 눈이 못 따라간다. 그리는 쪽에서 만들면 판마다 상태가 달라지므로
     * 여기 둔다.
     */
    ghostHp: maxHp,
    /**
     * 이 보스가 볼 페이즈 표. 보스에 담아두고 **여기서만** 읽는다 —
     * PHASES 를 직접 보는 곳이 흩어져 있으면 하나만 빠져도 하드에서 3페이즈에 멈춘다.
     */
    phases,
    hard,
    phaseId: 1,
    /** 'attack' | 'open' | 'recover' | 'defeated' */
    state: 'attack',
    timer: 0,
    spin: 0,
    bob: 0,
    hurtFlash: 0,
    vulnerable: false,
    /**
     * 겉모습 값 셋. **판정에는 안 쓴다** — 그리는 쪽이 "지금 뭘 하는 중인지"를
     * 몸으로 보여주려고 읽는다. 상태는 툭툭 끊기므로 여기서 부드럽게 굴려둔다.
     * 규칙은 bossPose() 한 곳에서만 읽는다.
     */
    charge: 0,
    openness: 0,
    recoil: 0,
    /**
     * 한 무더기 쏘고 난 반동 1→0. fireRing 이 1 로 차고 stepLooks 가 깎는다.
     * 0.85초마다 아홉 발이 나가므로 **이 값 하나로 팔이 쉬지 않는다** —
     * 로봇이 가만히 떠서 탄만 뱉는 것처럼 보이던 게 이게 없어서였다.
     */
    fireKick: 0,
    /** 레이저를 쏘는 중 0~1. 겨누는 charge 와는 따로다 (모으기 ≠ 쏘기) */
    beam: 0,
    /**
     * 공룡 형태의 몸짓. 원반·로봇은 안 읽는다 (읽을 부위가 없다).
     *
     * swing  꼬리가 감긴(−) / 휘둘린(+) 정도 −1~1
     * paw    앞발 −1~1. +1 이 치켜든 것(예고), **−1 이 내리꽂은 것**, 0 이 평소.
     *        드는 건 천천히지만 찍는 건 한 프레임이라, stompAim→stomp 자리에서
     *        −1 로 직접 꺾고 그 뒤에만 0 으로 되돌린다
     * jaw    턱이 벌어진 정도 0~1
     * stride 걸음 위상. **시간이 아니라 움직인 거리**로 돈다 — 시간으로 돌리면
     *        느리게 배회할 때 발이 미끄러진다 (주인공 스프라이트와 같은 규칙)
     */
    swing: 0,
    paw: 0,
    jaw: 0,
    stride: 0,
    /** stride 를 재는 기준점. 지난 프레임의 x */
    strideFrom: arenaWidth / 2 - BOSS_W / 2,
    drift: 1,
    quarters: [],
    minionTimer: 0,
    micTimer: 0,
    defeatedAt: 0,
    floorY,
    /** 레이저 기둥의 가운데 x. 'aim' / 'laser' 동안에만 뜻이 있다 */
    beamX: 0,
    /** 쌍둥이 레이저의 둘째 기둥 (하드 4페이즈에만 뜻이 있다) */
    beamX2: 0,
    beamDir: 1,
    laserTimer: 0,
    // ── 공룡 형태의 공격 (3페이즈부터) ───────────────────────
    /** 꼬리를 휘두르기까지 / 내리찍기까지 */
    tailTimer: 0,
    stompTimer: 0,
    /** 꼬리가 지금 훑고 있는 x (왼→오). 'tail' 동안에만 뜻이 있다 */
    tailX: 0,
    tailDir: 1,
    /** 바닥을 타고 퍼지는 충격파. { x, dir } 둘 (양쪽) */
    waves: [],
    // ── 1·2페이즈의 새 패턴 ──────────────────────────────────
    whirlTimer: 0,
    /** 회오리의 빈 자리 각도 (aim 때 정한다) */
    whirlGap: Math.PI / 2,
    ceilTimer: 0,
    ceilPhase: 0,
    /** 천장에서 떨어지는 조각들 */
    ceilSlabs: [],
  };
}

/**
 * 지금 바닥을 훑고 있는 꼬리 칸. 안 휘두르고 있으면 null.
 *
 * 레이저와 같은 규칙이다 — **판정과 그림이 이 하나를 같이 본다.**
 * 사각형을 양쪽에 따로 적으면 보이는 자리와 죽는 자리가 달라진다.
 */
function tailBand(boss) {
  if (boss.state !== 'tail' && boss.state !== 'tailAim') return null;
  const phase = bossPhase(boss);
  const h = phase.tailHeight ?? 20;
  return {
    x: boss.tailX - TAIL_W / 2,
    y: boss.floorY - h,
    w: TAIL_W,
    h,
    live: boss.state === 'tail',
  };
}

/** 바닥을 타고 퍼지는 충격파들. 판정과 그림이 같이 본다 */
function shockWaves(boss) {
  const phase = bossPhase(boss);
  const h = phase.waveHeight ?? 14;
  return boss.waves.map((w) => ({
    x: w.x - WAVE_W / 2,
    y: boss.floorY - h,
    w: WAVE_W,
    h,
  }));
}

/**
 * 지금 훑고 있는 레이저 칸. 아무것도 안 쏘고 있으면 null.
 *
 * **판정(core/game.js)과 그림(render/sceneBoss.js)이 둘 다 이 하나를 본다.**
 * 사각형을 양쪽에 따로 적으면 언젠가 어긋나서, 보이는 자리와 죽는 자리가 달라진다.
 */
function laserBeam(boss) {
  if (!boss || (boss.state !== 'aim' && boss.state !== 'laser')) return null;
  // 가슴 코어에서 나간다 — 약점으로 열리는 그 자리다. 같은 구멍이 쏘고, 같은 구멍이 열린다.
  const top = boss.y + boss.h * 0.35;
  return {
    x: boss.beamX - LASER_W / 2,
    y: top,
    w: LASER_W,
    h: Math.max(0, boss.floorY - top),
    /** 예고선은 안 아프다. 예고에 맞아 죽으면 그건 예고가 아니다. */
    live: boss.state === 'laser',
  };
}

/**
 * 지금 훑고 있는 기둥 **전부**. 보통은 하나, 하드 4페이즈는 둘이다.
 *
 * 판정도 그림도 이 하나를 본다. 둘째 기둥을 그리는 쪽에서만 따로 계산하면
 * 보이는 자리와 죽는 자리가 어긋난다.
 */
function laserBeams(boss) {
  const first = laserBeam(boss);
  if (!first) return [];
  if (!bossPhase(boss).twinLaser) return [first];
  return [first, { ...first, x: boss.beamX2 - LASER_W / 2 }];
}

/** 던져서 맞히는 마이크. 보스가 주기적으로 흘린다. */
const MIC_SIZE = 10;

function createMic(x, y) {
  return { x, y, w: MIC_SIZE, h: MIC_SIZE, vy: 30, bob: 0, landed: false, life: 14 };
}

/** 손에 든 마이크를 던진다. 바라보는 쪽 위로 포물선을 그린다. */
function throwMic(player) {
  return {
    x: player.x + (player.dir > 0 ? player.w : -MIC_SIZE),
    y: player.y - 2,
    w: MIC_SIZE,
    h: MIC_SIZE,
    vx: player.dir * 190,
    vy: -210,
    spin: 0,
    life: 3,
  };
}

/** 날아가는 마이크 한 프레임. 살아있으면 true */
function updateThrown(mic, world, dt) {
  mic.life -= dt;
  mic.spin += dt * 16;
  mic.vy += 520 * dt;
  mic.x += mic.vx * dt;
  mic.y += mic.vy * dt;
  if (mic.life <= 0) return false;
  if (mic.y > world.pixelHeight + 20) return false;
  return mic.x > -30 && mic.x < world.pixelWidth + 30;
}

const bossPhase = (boss) => {
  const table = boss?.phases ?? phasesFor(false);
  return table.find((p) => p.id === boss.phaseId) ?? table[0];
};

/** 체력이 깎이면 페이즈를 다시 본다. 뒤로는 가지 않는다. */
function syncPhase(boss) {
  const next = phaseFor(boss.hp, boss.maxHp, boss.phases ?? phasesFor(false));
  if (next.id > boss.phaseId) {
    boss.phaseId = next.id;
    // 공룡이 되면 몸이 커진다. 가운데를 잡아두고 넓혀야 갑자기 옆으로 튀지 않는다.
    if (next.dino && boss.w !== DINO_W) {
      const cx = boss.x + boss.w / 2;
      boss.w = DINO_W;
      boss.h = DINO_H;
      boss.x = cx - DINO_W / 2;
    }
    boss.quarters = [];
    boss.state = 'recover';
    boss.timer = 1.2;
    return next.id;
  }
  return null;
}

/** 큰 걸 쓰려고 겨누는 중인 상태들 — 몸이 움츠러든다 */
const AIMING = new Set(['aim', 'whirlAim', 'tailAim', 'stompAim']);

/** 0→1 로 다가간다 (per, 초당 비율). dt 가 튀어도 1 을 안 넘는다 */
const toward = (v, target, per, dt) => v + (target - v) * Math.min(1, per * dt);

/**
 * 겉모습 값을 한 프레임 굴린다.
 *
 * 상태(boss.state)는 한 프레임에 툭 바뀌는데 몸이 따라 툭 바뀌면 싸구려로 보인다.
 * 여기서 이징을 걸어두면 그리는 쪽은 숫자만 읽으면 된다.
 */
function stepLooks(boss, dt) {
  boss.charge = toward(boss.charge, AIMING.has(boss.state) ? 1 : 0, 6, dt);
  // 열릴 때는 빨리 벌어지고 닫힐 때는 천천히 — 빨리 닫히면 칠 틈이 없어 보인다
  const open = boss.state === 'open' ? 1 : 0;
  boss.openness = toward(boss.openness, open, open ? 9 : 3.5, dt);
  boss.recoil = Math.max(0, boss.recoil - dt * 3);
  // 쏜 반동은 **빨리** 빠진다 (0.25초). 다음 무더기가 0.85초 뒤라 그 사이에
  // 팔이 제자리로 돌아와야 매번 새로 내리꽂는 것으로 보인다.
  boss.fireKick = Math.max(0, (boss.fireKick ?? 0) - dt * 4);
  boss.beam = toward(boss.beam ?? 0, boss.state === 'laser' ? 1 : 0, 8, dt);
  stepDinoLooks(boss, dt);
}

/**
 * 공룡 몸짓 한 프레임.
 *
 * 공룡이 아닌 페이즈에서도 그냥 0 으로 잦아든다 — 몸이 바뀔 때 값이 남아 있으면
 * 변신하는 순간 꼬리가 휘둘린 자세로 굳는다.
 */
function stepDinoLooks(boss, dt) {
  const phase = bossPhase(boss);

  // ── 꼬리: 감았다가(−) 훑으며 지나간다(+) ──
  let swing = 0;
  if (boss.state === 'tailAim') {
    // 훑을 방향의 **반대쪽으로** 감는다. 감기는 게 곧 예고다.
    swing = -boss.tailDir;
  } else if (boss.state === 'tail') {
    // 남은 시간으로 진행도를 잰다 (tailBand 의 tailX 와 같은 시계다)
    const span = phase.tailSweep ?? 1;
    const done = clamp(1 - boss.timer / span, 0, 1);
    swing = boss.tailDir * (done * 2 - 1);
  }
  // 감을 때는 천천히, 휘두를 때는 이징 없이 그대로 따라간다 (채찍은 느리면 안 읽힌다)
  boss.swing =
    boss.state === 'tail' ? swing : clamp(toward(boss.swing, swing, 7, dt), -1, 1);

  // ── 앞발: 들었다 내리꽂는다 ──
  // 드는 것(0→1)과 되돌아오는 것(−1→0)만 여기서 굴린다. 꽂는 순간은
  // stompAim→stomp 자리에서 −1 로 꺾는다 — 이징으로 내리면 충격파가 생긴 뒤에
  // 발이 닿아서 순서가 거꾸로 보인다.
  boss.paw = clamp(toward(boss.paw, boss.state === 'stompAim' ? 1 : 0, 5, dt), -1, 1);

  // ── 턱: 쏘는 중과 휘두르는 중에 벌어진다 ──
  const roaring = boss.state === 'laser' || boss.state === 'tail' || boss.state === 'whirl';
  boss.jaw = clamp(toward(boss.jaw, roaring ? 1 : 0, 8, dt), 0, 1);

  // ── 걸음: 움직인 거리만큼 돈다 ──
  boss.stride += Math.abs(boss.x - boss.strideFrom);
  boss.strideFrom = boss.x;
}

/**
 * 지금 이 보스를 **어떤 자세로 그릴까**.
 *
 * 싸움 화면이 보스 상태를 거의 안 보고 있었다 — 겨누든 맞든 비틀거리든 몸이 똑같고,
 * 약점이 열린 것도 가운데 재생버튼 하나로만 알렸다. 규칙을 여기 한 곳에 두고
 * 그리는 쪽은 물어보기만 한다 (bossBody 와 같은 방식).
 *
 * squash  1 보다 작으면 움츠러든 것 (겨누는 중)
 * spread  껍질이 벌어진 정도 0~1 (약점이 열린 중)
 * recoil  맞고 밀려난 정도 0~1
 * glow    틈에서 새는 빛의 세기 0~1
 * spin    회전 배속 (열리면 멎고 겨누면 빨라진다)
 *
 * 아래 넷은 **공룡 몸만** 읽는다 (stepDinoLooks 설명 참고).
 * swing / paw / jaw / stride
 */
const NEUTRAL_POSE = {
  squash: 1,
  spread: 0,
  recoil: 0,
  glow: 0,
  spin: 1,
  swing: 0,
  paw: 0,
  jaw: 0,
  stride: 0,
  lift: 0,
  lean: 0,
  fire: 0,
  charge: 0,
  beam: 0,
};

/**
 * 발이 땅에 닿는 높이. 내리꽂기가 멈추는 자리와 **같은 값**이라 여기 한 번만 적는다 —
 * 두 군데 적으면 발이 땅에 닿았는데 추진기가 계속 타는 그림이 된다.
 */
const bossFloor = (boss) => boss.floorY - BOSS_H - 6;

const bossPose = (boss) => {
  if (!boss) return NEUTRAL_POSE;
  const c = boss.charge;
  const o = boss.openness;
  return {
    squash: 1 - c * 0.12,
    spread: o,
    recoil: boss.recoil,
    glow: Math.max(c * 0.7, o),
    spin: 1 + c * 1.8 - o * 0.9,
    swing: boss.swing,
    paw: boss.paw,
    jaw: boss.jaw,
    stride: boss.stride,
    /**
     * 땅에서 얼마나 떠 있나 0~1.
     *
     * 이 보스는 **떠 있는 기계**다 — 공격할 때는 높이 뜨고 약점이 열릴 때 내려와
     * 발을 딛는다(phase.descendTo). 그런데 그리는 쪽이 그걸 몰라서 84픽셀 공중에
     * 있든 땅을 딛고 있든 똑같은 그림이었다. "떠 있다"가 아니라 "붙여넣은 그림"으로
     * 보이던 이유다. 추진기 세기와 다리 자세가 여기서 나온다.
     */
    lift: clamp((bossFloor(boss) - boss.y) / 90, 0, 1),
    /** 어느 쪽으로 밀고 있나 −1~1. 그쪽으로 몸이 기운다 */
    lean: boss.drift ?? 0,
    /** 방금 한 무더기 쐈나 1→0. 팔이 내리꽂혔다 돌아오고 추진기가 확 뿜는다 */
    fire: boss.fireKick ?? 0,
    /**
     * 큰 걸 모으는 중 0~1.
     *
     * 위 squash 가 이 값을 `1 - c*0.12` 로 **뭉개서** 내보낸다. 그리는 쪽이
     * 거기서 `(1-squash)/0.12` 로 되돌리게 두면 계수 0.12 가 두 군데 적히고,
     * 한쪽만 고치는 날 자세가 조용히 어긋난다. 원값을 같이 준다.
     */
    charge: boss.charge,
    /** 레이저를 쏘는 중 0~1. 모으는 것(charge)과 쏘는 것은 자세가 반대다 */
    beam: boss.beam ?? 0,
  };
};

function makeQuarters(boss, phase, arenaWidth) {
  boss.quarters = Array.from({ length: phase.quarters }, (_, i) => ({
    index: i,
    x: i % 2 === 0 ? -40 : arenaWidth + 40,
    y: 96 + (i >> 1) * 34,
    w: 22,
    h: 22,
    vx: (i % 2 === 0 ? 1 : -1) * phase.quarterSpeed,
    spin: 0,
    delay: i * 0.45,
  }));
}

/**
 * 보스 한 프레임.
 * ctx: { player, arenaWidth, spawnShot, addAlbum, dt }
 */
function updateBoss(boss, ctx, dt) {
  if (boss.state === 'defeated') {
    boss.defeatedAt += dt;
    boss.y += 22 * dt;
    boss.spin += dt * 2;
    return;
  }

  const phase = bossPhase(boss);

  // 마이크를 흘린다 — 주워서 던지면 멀리서도 한 대 먹일 수 있다
  boss.micTimer += dt;
  if (boss.micTimer >= phase.micEvery) {
    boss.micTimer = 0;
    ctx.dropMic?.(createMic(boss.x + boss.w / 2 - MIC_SIZE / 2, boss.y + boss.h));
  }

  boss.spin += dt * (1.2 + boss.phaseId * 0.5) * (1 - boss.openness * 0.9);
  boss.bob += dt;
  boss.hurtFlash = Math.max(0, boss.hurtFlash - dt);
  // 체력계 잔상이 실제 체력을 뒤늦게 따라잡는다 (bossGhostRatio 가 그걸 읽는다)
  boss.ghostHp = Math.max(boss.hp, (boss.ghostHp ?? boss.hp) - GHOST_CATCHUP * dt);
  boss.timer -= dt;
  stepLooks(boss, dt);

  // 좌우로 천천히 배회. 다만 레이저를 겨누거나 쏘는 동안에는 제자리에 선다 —
  // 큰 걸 쓰기로 마음먹은 놈이 멈추는 것 자체가 예고다.
  const charging =
    boss.state === 'aim' ||
    boss.state === 'laser' ||
    boss.state === 'tailAim' ||

  game.checkpoint = { ...game.world.spawn };
  game.boss = null;
  spawnEntities(game);
  game.camera = createCamera(VIEW.w, VIEW.h);
  game.camera.x = clamp(game.player.x - VIEW.w / 2, 0, Math.max(0, game.world.pixelWidth - VIEW.w));
  game.camera.y = clamp(game.player.y - VIEW.h / 2, 0, Math.max(0, game.world.pixelHeight - VIEW.h));
  game.scene = 'stageIntro';
  game.sceneTime = 0;
  game.rank = rankAt(index, 0);
  emit(game, 'stage', { index });
}

 *

 * 건너뛰기·소리·시간 안 흐르기를 두 벌 적으면 한쪽만 고치는 날이 온다.

  game.scene = 'intro';
  game.introCut = id;
  game.cutsceneTime = 0;
  game.sceneTime = 0;
  emit(game, 'cutscene', { id });
}

// ── 죽음과 부활 ──────────────────────────────────────────────
function killPlayer(game) {
  if (game.scene === 'death') return;
  game.chartOuts += 1;
  game.scene = 'death';
  game.sceneTime = 0;
  freezeGame(game, FREEZE.death);
  shakeCamera(game.camera, 1.2);
  addParticles(game, game.player.x + 5, game.player.y + 7, 14, ['#ff5d8f', '#ffd166', '#ffffff'], {
    speed: 110,
    life: 0.9,
  });
  emit(game, 'death', {});
}

function reviveAtCheckpoint(game) {
  game.world.restoreChanged();
  spawnEntities(game);
  respawnPlayer(game.player, game.checkpoint);
  game.scene = game.boss ? 'boss' : 'play';
  game.sceneTime = 0;
  game.caught = null;
  // 쫓아오는 것을 내 뒤로 물린다. 안 하면 눈뜨자마자 다시 잡혀서 빠져나올 수가 없다.
  if (isChase(game)) game.chaser = { x: game.player.x - CHASE_LEAD };
  if (game.boss) {
    // 보스는 체력을 유지한다 — 다시 처음부터는 너무 가혹하다
    game.boss.state = 'recover';
    game.boss.timer = 1.2;
    game.boss.quarters = [];
  }
  emit(game, 'revive', {});
}

// ── 충돌 처리 ────────────────────────────────────────────────
function isStomp(player, target) {
  return player.vy > 0 && player.y + player.h - target.y <= target.h * 0.65;
}

function handleAlbums(game, dt, held = false) {
  const { player, world } = game;
  const ctx = {
    world,
    player,
    spawnShot: (shot) => game.shots.push({ wobble: 0, ...shot }),
    addAlbum: (album) => game.albums.push(album),
  };

  for (const album of game.albums) {
    updateAlbum(album, ctx, dt);
    if (!album.alive || player.dead) continue;
    if (!overlaps(player, album)) continue;

    if (isStomp(player, album)) {
      const result = stompAlbum(album, ctx);
      if (result === 'blocked') {
        // 위에 가시가 박힌 앨범 — 밟은 쪽이 죽는다
        if (damagePlayer(player)) killPlayer(game);
        continue;
      }
      bounce(player, result === 'dead', held);
      // 아주 짧게. 한 판에 스무 번 넘게 하는 일이라 길면 판이 끊긴다
      freezeGame(game, FREEZE.stomp);
      emit(game, 'stomp', {});
      // 밟은 자리에서 **옆으로** 터진다. 사방으로 퍼지면 위에서 밟았다는 게 안 읽힌다.
      // (0 = 오른쪽, π = 왼쪽. 반반씩 나눠 양옆으로 보낸다)
      addParticles(game, album.x + album.w / 2, album.y + album.h / 2, 4, album.def.palette, {
        speed: 70,
        dir: 0,
        arc: Math.PI * 0.5,
      });
      addParticles(game, album.x + album.w / 2, album.y + album.h / 2, 4, album.def.palette, {
        speed: 70,
        dir: Math.PI,
        arc: Math.PI * 0.5,
      });
      if (result === 'dead') {
        game.defeated += 1;
        game.score += album.def.score;
        addText(game, album.x, album.y, `+${album.def.score}`, album.def.palette[2]);
      }
    } else if (damagePlayer(player)) {
      killPlayer(game);
    } else {
      emit(game, 'hurt', {});
    }
  }
  game.albums = game.albums.filter((a) => !albumGone(a));
}

/**
 * 한 대 맞았다고 알린다. **실제로 뭔가 벌어졌을 때만** 소리를 낸다.
 *
 * damagePlayer 는 무적일 때도 false 를 돌려준다. 그걸 그냥 "안 죽었다"로 읽고
 * 소리를 내면, 계속 닿아 있는 것(레이저 기둥 같은 것) 안에서는 무적 1.2초 동안
 * 프레임마다 아픈 소리가 터진다 — 70번쯤.
 */
function hurt(game) {
  const before = game.player.power;
  if (damagePlayer(game.player)) {
    killPlayer(game);
    return true;
  }
  // 파워업을 잃었으면 뭔가 벌어진 것이고, 그대로면 무적이라 아무 일도 없었던 것이다
  if (game.player.power !== before) {
    emit(game, 'hurt', {});
    return true;
  }
  return false;
}

/**
 * 레이저에 닿았나. 예고선(aim)은 안 아프다 — beam.live 하나로 갈린다.
 * 사각형은 boss.js 의 laserBeam 이 정한다. 그림도 같은 걸 본다.
 */
function handleLaser(game) {
  if (game.player.dead) return;
  for (const beam of laserBeams(game.boss)) {
    if (!beam.live) continue;
    if (overlaps(game.player, beam)) {
      hurt(game);
      return; // 한 프레임에 두 기둥에 두 번 맞을 이유가 없다
    }
  }
}

/**
 * 공룡 형태의 가로 공격 — 꼬리와 충격파.
 *
 * 레이저는 **세로 기둥**이라 옆으로 비켜서 피했다. 이건 바닥을 훑는 **가로**라
 * 뛰어야만 피한다. 피하는 축이 달라야 "새 형태"로 읽힌다.
 * 사각형은 boss.js 가 정하고, 그림도 같은 걸 본다.
 */
function handleGroundSweeps(game) {
  if (game.player.dead) return;
  const tail = tailBand(game.boss);
  if (tail?.live && overlaps(game.player, tail)) {
    hurt(game);
    return;
  }
  for (const wave of shockWaves(game.boss)) {
    if (overlaps(game.player, wave)) {
      hurt(game);
      return;
    }
  }
  // 천장에서 떨어지는 조각 — 예고 중(warn > 0)에는 안 아프다
  for (const slab of ceilingSlabs(game.boss)) {
    if (slab.warn > 0) continue;
    if (overlaps(game.player, slab)) {
      hurt(game);
      return;
    }
  }
}

function handleShots(game, dt) {
  const { player, world } = game;
  game.shots = game.shots.filter((shot) => {
    const alive = updateShot(shot, world, dt);
    if (!alive) return false;
    if (!player.dead && overlaps(player, shot)) {
      hurt(game);
      return false;
    }
    return true;
  });
}

function handlePickups(game) {
  const { player } = game;
  for (const pickup of game.world.pickups) {
    if (pickup.taken || !overlaps(player, pickup)) continue;
    pickup.taken = true;
    game.plays += 1;
    // 어느 칸이었는지 남긴다 — 죽어서 되살아난 같은 음표를 다시 주워도 안 늘어난다
    game.noteMemory.reveal(noteKey(game, pickup.tx, pickup.ty));
    game.score += 50;
    addText(game, pickup.x, pickup.y, '♪', '#ffd166');
    addParticles(game, pickup.x + 4, pickup.y + 4, 5, ['#ffd166', '#fff'], { speed: 40, life: 0.4 });
    emit(game, 'coin', {});
  }
}

function handleBlocks(game, events) {
  if (!events.bonked) return;
  const { tx, ty, ch } = events.bonked;
  const world = game.world;
  const key = markKey(game, tx, ty);
  addParticles(game, tx * TILE + 8, ty * TILE + 12, 6, ['#ffd166', '#fff'], { speed: 50, life: 0.4 });

  if (ch === T.ITEM) {
    world.setChar(tx, ty, T.USED);
    if (game.player.power === 'none') {
      game.player.power = 'mic';
      emit(game, 'power', {});
    } else {
      game.plays += 3;
      game.score += 150;
      addText(game, tx * TILE, ty * TILE, '♪♪♪', '#ffd166');
      emit(game, 'coin', {});
    }
  } else if (ch === T.BAIT) {
    world.setChar(tx, ty, T.USED);
    game.trapMemory.reveal(key);
    const album = spawnAlbum('a06', tx * TILE, ty * TILE - TILE);
    album.vy = -120;
    game.albums.push(album);
    shakeCamera(game.camera, 0.6);
    emit(game, 'trap', { kind: 'baitBlock' });
  } else if (ch === T.INVISIBLE) {
    world.setChar(tx, ty, T.GROUND);
    game.trapMemory.reveal(key);
    emit(game, 'trap', { kind: 'invisibleBlock' });
  }
}

/** 밟으면 사라지는 칸들 — 가짜 발판(즉시)과 무너지는 바닥(잠깐 떨다가) */
const CRUMBLING = {
  [T.FAKE]: { time: CRUMBLE_TIME, kind: 'fakePlatform' },
  [T.CRUMBLE]: { time: FLOOR_CRUMBLE_TIME, kind: 'crumbleFloor' },
};

function handleCrumbling(game, dt) {
  const { player, world } = game;
  // 밟고 있는 칸이 무너질 것인지 본다
  if (player.onGround && !player.dead) {
    const ty = Math.floor((player.y + player.h + 1) / TILE);
    const tx0 = Math.floor(player.x / TILE);
    const tx1 = Math.floor((player.x + player.w - 0.001) / TILE);
    for (let tx = tx0; tx <= tx1; tx++) {
      const spec = CRUMBLING[world.charAt(tx, ty)];
      if (!spec) continue;
      const key = markKey(game, tx, ty);
      if (!game.crumbling.has(key)) {
        // 칸 좌표를 **값에 같이 들고 있는다.** 예전에는 열쇠를 ',' 로 쪼개 되읽었는데,
        // 하드모드 열쇠에는 판 이름이 붙어서(`hard1:12,9`) 그렇게 하면 NaN 이 나온다.
        game.crumbling.set(key, { time: spec.time, tx, ty });
        emit(game, 'crumble', {});
      }
    }
  }
  for (const [key, cell] of [...game.crumbling]) {
    const left = cell.time - dt;
    if (left > 0) {
      game.crumbling.set(key, { ...cell, time: left });
      continue;
    }
    game.crumbling.delete(key);
    const { tx, ty } = cell;
    const spec = CRUMBLING[world.charAt(tx, ty)];
    if (!spec) continue;
    world.setChar(tx, ty, T.EMPTY);
    game.trapMemory.reveal(key);
    addParticles(game, tx * TILE + 8, ty * TILE + 8, 6, ['#c9c9c9', '#8a8a8a'], { speed: 40, life: 0.5 });
    emit(game, 'trap', { kind: spec.kind });
  }
}

/** 지나가면 바닥에서 벽이 솟는다. 넘을 수 있는 두 칸 높이. */
const WALL_HEIGHT = 2;

function handleRisingWalls(game, dt) {
  const { player, world } = game;
  for (const wall of world.risingWalls) {
    if (!wall.risen) {
      const cx = wall.tx * TILE + TILE / 2;
      const near = Math.abs(player.x + player.w / 2 - cx) < 46;
      if (!near || player.dead) continue;
      wall.risen = true;
      wall.t = 0;
      for (let i = 0; i < WALL_HEIGHT; i++) world.setChar(wall.tx, wall.ty - i, T.RISEN);
      game.trapMemory.reveal(markKey(game, wall.tx, wall.ty));
      shakeCamera(game.camera, 0.8);
      addParticles(game, cx, wall.ty * TILE, 8, ['#e8ecf7', '#8b93a8'], { speed: 60, life: 0.5 });
      emit(game, 'trap', { kind: 'risingWall' });
    } else {
      wall.t = Math.min(1, wall.t + dt * 5);
    }
  }
}

/** 밟으면 잠깐 걸리는 구간 효과 (역재생 · 정전) */
function handleZones(game, dt) {
  const { player, world } = game;
  for (const zone of world.zones) {
    if (zone.fired || player.dead) continue;
    const box = { x: zone.x, y: zone.y - TILE, w: TILE, h: TILE * 2 };
    if (!overlaps(player, box)) continue;
    zone.fired = true;
    const spec = ZONE_EFFECTS[zone.kind];
    game.effects[zone.kind] = spec.seconds;
    game.trapMemory.reveal(markKey(game, zone.tx, zone.ty));
    shakeCamera(game.camera, 0.6);
    emit(game, 'trap', { kind: zone.kind });
  }
  // 반드시 저절로 풀린다 — 영구히 걸리면 게임이 끝난다
  for (const key of Object.keys(game.effects)) {
    game.effects[key] = Math.max(0, game.effects[key] - dt);
  }
}

/** 떨어지는 땅덩이 — 빠르다. 예고가 없는 대신 **빠르게 지나간다** */
const SLAB_FALL = 620;
/** 땅덩이가 매달려 있는 높이 (밟는 칸에서 위로 몇 칸) */
const SLAB_HANG = 5;

/**
 * **하늘에서 떨어지는 땅.** 1층을 밟는 순간 머리 위 슬래브가 바로 떨어진다.
 *
 * 이 게임의 다른 함정과 달리 **시간 예고가 없다.** 대신 두 가지가 받쳐준다.
 *   1. 매달린 슬래브가 2층 밑에 **그려져 있다** — 지형을 읽으면 알 수 있다
 *   2. 한 번 당하면 그 칸이 붉게 남는다 (trapMemory)
 * 공략은 피하는 게 아니라 **애초에 1층으로 안 가는 것**이다. 2층으로 넘어간다.
 */
function handleDropSlabs(game, dt) {
  const { player, world } = game;
  for (const slab of world.dropSlabs) {
    const cx = slab.tx * TILE + TILE / 2;
    const near = Math.abs(player.x + player.w / 2 - cx) < 18;
    // **딛고 선 층이 같아야** 발동한다. 2층으로 넘어가면 안 떨어진다 —
    // 이게 이 장치의 전부다. 층을 안 보면 위를 지나가도 터져서 공략이 사라진다.
    const sameFloor = Math.abs(player.y + player.h - slab.ty * TILE) < TILE * 2;
    if (!slab.fired && near && sameFloor && !player.dead) {
      slab.fired = true;
      slab.y = (slab.ty - SLAB_HANG) * TILE;
      game.trapMemory.reveal(markKey(game, slab.tx, slab.ty));
      shakeCamera(game.camera, 0.8);
      emit(game, 'trap', { kind: 'dropSlab' });
    }
    if (!slab.fired || slab.done) continue;
    slab.y += SLAB_FALL * dt;
    const box = { x: slab.tx * TILE, y: slab.y, w: TILE, h: TILE };
    if (!player.dead && overlaps(player, box) && damagePlayer(player)) killPlayer(game);
    if (slab.y >= slab.ty * TILE - TILE) {
      slab.done = true;
      addParticles(game, cx, slab.ty * TILE, 10, ['#c9c9c9', '#8a8a8a', '#fff'], {
        speed: 90,
        life: 0.4,
      });
      shakeCamera(game.camera, 0.7);
    }
  }
}

function handlePopSpikes(game, dt) {
  const { player, world } = game;
  for (const spike of world.popSpikes) {
    const cx = spike.tx * TILE + TILE / 2;
    // 발밑에서 솟아야 웃기고, 또 알고 나면 뛰어넘을 수 있다.
    // 멀리서 미리 솟으면 제자리 점프로 넘어야 해서 불합리해진다.
    const near = Math.abs(player.x + player.w / 2 - cx) < 18;
    const sameFloor = Math.abs(player.y + player.h - spike.ty * TILE) < TILE * 2;
    if (!spike.popped && near && sameFloor && !player.dead) {
      spike.popped = true;
      spike.t = 0;
      game.trapMemory.reveal(markKey(game, spike.tx, spike.ty));
      shakeCamera(game.camera, 0.4);
      emit(game, 'trap', { kind: 'popSpike' });
    }
    if (!spike.popped) continue;
    spike.t = Math.min(1, spike.t + dt * 6);
    const blade = {
      x: spike.tx * TILE + 2,
      y: spike.ty * TILE - TILE * spike.t + 2,
      w: TILE - 4,
      h: TILE * spike.t,
    };
    if (!player.dead && spike.t > 0.35 && overlaps(player, blade)) {
      if (damagePlayer(player)) killPlayer(game);
    }
  }
}

/**
 * 깜빡이는 발판. 다 같은 박자로 껐다 켠다 — 제각각이면 언제 건널지 못 잰다.
 * 격자를 직접 갈아끼우므로 물리(tileAt)가 그대로 이걸 본다.
 */
const BLINK_PERIOD = 2.0;
/** 켜져 있는 시간. 꺼진 0.7초보다 훨씬 길어야 건널 틈이 난다 */
const BLINK_ON = 1.3;

function handleBlinkers(game) {
  const { world } = game;
  if (!world.blinkers.length) return;
  const on = game.sceneTime % BLINK_PERIOD < BLINK_ON;
  if (game.blinkOn === on) return; // 바뀔 때만 손댄다
  game.blinkOn = on;
  for (const b of world.blinkers) world.setLive(b.tx, b.ty, on ? T.BLINK : T.EMPTY);
}

/** 체크포인트인 척하는 것. 먹으면 **저장이 안 되고** 사라진다 */
function handleFakeChecks(game) {
  for (const fc of game.world.fakeChecks) {
    if (fc.taken || game.player.dead) continue;
    const box = { x: fc.x - 6, y: fc.y - TILE, w: TILE + 12, h: TILE * 2 };
    if (!overlaps(game.player, box)) continue;
    fc.taken = true;
    game.trapMemory.reveal(markKey(game, fc.tx, fc.ty));
    shakeCamera(game.camera, 0.5);
    emit(game, 'trap', { kind: 'fakeCheck' });
  }
}

/**
 * 천장 가시가 **몇 칸까지 뻗는가.**
 *
 * 1칸이었을 때는 바닥 딱 2칸 위에만 달 수 있었다 — 그보다 높이 달면 닿지를
 * 않아서 그냥 그림이 됐다. 창처럼 길게 만들면 천장에 높이 달아놓고도
 * 바닥까지 내리꽂을 수 있고, 그래야 **점핑패드로 솟았다가 꽂히는** 자리도 나온다.
 */
const CEIL_BLADE = 3;

/** 천장 가시 — 아래를 지나가면 내려온다. 솟는 가시를 위아래만 뒤집은 것이다 */
function handleCeilSpikes(game, dt) {
  const { player, world } = game;
  for (const spike of world.ceilSpikes) {
    const cx = spike.tx * TILE + TILE / 2;
    const near = Math.abs(player.x + player.w / 2 - cx) < 20;
    // 칼날이 닿는 데까지는 발동해야 한다. 칼날만 늘리고 여기를 안 늘리면
    // 높이 단 가시가 "닿을 수는 있는데 발동은 안 하는" 상태가 된다.
    const reach = TILE * (CEIL_BLADE + 2);
    const below = player.y > spike.ty * TILE && player.y - spike.ty * TILE < reach;
    if (!spike.popped && near && below && !player.dead) {
      spike.popped = true;
      spike.t = 0;
      game.trapMemory.reveal(markKey(game, spike.tx, spike.ty));
      shakeCamera(game.camera, 0.4);
      emit(game, 'trap', { kind: 'ceilingSpike' });
    }
    if (!spike.popped) continue;
    spike.t = Math.min(1, spike.t + dt * 5);
    const blade = {
      x: spike.tx * TILE + 2,
      y: (spike.ty + 1) * TILE - 2,
      w: TILE - 4,
      h: TILE * CEIL_BLADE * spike.t,
    };
    if (!player.dead && spike.t > 0.35 && overlaps(player, blade)) {
      if (damagePlayer(player)) killPlayer(game);
    }
  }
}

// ── 하늘에서 떨어지는 폭탄 ──────────────────────────────────
/** 폭탄 하나를 떨어뜨리는 간격(초) */
const BOMB_EVERY = 0.4;
/**
 * 떨어질 자리에 **그림자만 보이는** 시간.
 * 이게 없으면 하늘에서 예고 없이 죽는 것이고, 그건 트롤이 아니라 불합리한 게임이다.
 */
const BOMB_WARN = 0.35;
/**
 * 잇달아 떨어지는 폭탄 사이에 비워두는 칸 수.
 * 붙여서 떨어뜨리면 설 자리가 없어져 못 지나가는 구간이 된다 — 테스트가 지킨다.
 */
const BOMB_GAP = 4;
const BOMB_FALL = 240;
/** 터질 때 휩쓰는 범위 */
const BOMB_BLAST = 12;
/** 터진 자리에 불이 남는 시간. 폭탄이 "때리는 것"에서 **설 자리를 지우는 것**이 된다 */
const FIRE_TIME = 1.5;
/** 떨어지며 좌우로 흔들리는 폭. 그림자 자리를 그대로 믿고 서 있으면 맞는다 */
const BOMB_SWAY = 7;

/** 그 칸 아래로 처음 나오는 바닥의 윗면 y (없으면 판 바닥) */
function groundBelow(world, tx, fromTy) {
  for (let ty = fromTy; ty < world.height; ty++) {
    if (world.tileAt(tx, ty) === SOLID) return ty * TILE;
  }
  return world.pixelHeight;
}

function spawnBomb(game) {
  const { player, world } = game;
  // 셋씩 돌아가며 왼쪽·가운데·오른쪽.
  //
  // 자리를 **BOMB_GAP 격자에 붙인다.** 플레이어 위치에 그냥 더하면, 달리는 동안
  // 기준이 밀려서 앞뒤 폭탄이 한두 칸 차이로 겹칠 수 있다 — 그러면 설 자리가
  // 없어져 못 지나가는 구간이 된다. 격자에 붙이면 두 폭탄은 같은 칸이거나
  // 최소 BOMB_GAP 칸 떨어진다.
  const lane = (game.bombPhase % 3) - 1;
  game.bombPhase += 1;
  const want = Math.floor((player.x + player.w / 2) / TILE) + 2 + lane * BOMB_GAP;
  const tx = clamp(Math.round(want / BOMB_GAP) * BOMB_GAP, 0, world.width - 1);
  game.bombs.push({
    x: tx * TILE + TILE / 2,
    y: game.camera.y - TILE,
    tx,
    groundY: groundBelow(world, tx, 0),
    warn: BOMB_WARN,
    /** 흔들리는 위상. 폭탄마다 달라야 줄줄이 같은 궤적으로 안 떨어진다 */
    sway: game.rng.float() * Math.PI * 2,
    baseX: tx * TILE + TILE / 2,
  });
}

/**
 * 폭탄 구간. 걸려 있는 동안 하늘에서 떨어진다.
 *
 * 순서는 늘 같다 — **그림자가 먼저, 폭탄은 나중.** 그림자를 보고 비키면 산다.
 */
function handleBombs(game, dt) {
  if (game.effects.bombs > 0) {
    game.bombTimer -= dt;
    if (game.bombTimer <= 0) {
      game.bombTimer += BOMB_EVERY;
      spawnBomb(game);
    }
  } else {
    game.bombTimer = 0;
  }

  const { player } = game;
  game.bombs = game.bombs.filter((bomb) => {
    if (bomb.warn > 0) {
      bomb.warn -= dt;
      return true;
    }
    bomb.y += BOMB_FALL * dt;
    // 좌우로 흔들며 내려온다 — 그림자 자리에 그대로 서 있으면 맞는다
    bomb.sway += dt * 7;
    bomb.x = bomb.baseX + Math.sin(bomb.sway) * BOMB_SWAY;
    const hitGround = bomb.y >= bomb.groundY;
    const box = { x: bomb.x - 5, y: bomb.y - 5, w: 10, h: 10 };
    const hitPlayer = !player.dead && overlaps(player, box);
    if (!hitGround && !hitPlayer) return true;

    // 터진다 — 닿은 자리 둘레를 휩쓴다
    const blast = {
      x: bomb.x - BOMB_BLAST,
      y: Math.min(bomb.y, bomb.groundY) - BOMB_BLAST,
      w: BOMB_BLAST * 2,
      h: BOMB_BLAST * 2,
    };
    if (!player.dead && overlaps(player, blast) && damagePlayer(player)) killPlayer(game);
    addParticles(game, bomb.x, Math.min(bomb.y, bomb.groundY), 10, ['#ff8f3c', '#ffd166', '#fff'], {
      speed: 120,
      life: 0.4,
    });
    shakeCamera(game.camera, 0.5);
    // 터진 자리에 불이 남는다 — 여기가 이번 강화의 핵심이다.
    // 맞는 걸 피하는 게 아니라 **설 자리를 계속 옮겨야** 한다.
    game.fires.push({ x: bomb.x, groundY: bomb.groundY, t: FIRE_TIME });
    emit(game, 'trap', { kind: 'bomb' });
    return false;
  });

  // 남은 불 — 시간이 지나면 꺼진다. 안 꺼지면 판이 통째로 막힌다.
  game.fires = game.fires.filter((fire) => {
    fire.t -= dt;
    if (fire.t <= 0) return false;
    const box = { x: fire.x - 9, y: fire.groundY - 12, w: 18, h: 12 };
    if (!player.dead && overlaps(player, box) && damagePlayer(player)) killPlayer(game);
    return true;
  });
}

/**
 * 쫓아오는 속도. **달리기(PLAYER.maxSpeed = 124)보다 반드시 느려야 한다.**
 *
 * 여기를 넘기는 순간 "어려운 판"이 아니라 "달리기 속도를 시험하는 판"이 되고,
 * 그건 실력이 아니라 그냥 못 깨는 판이다. 잡히는 건 벽에 막혀 멈췄을 때,
 * 함정에 걸려 멈췄을 때, 길을 잘못 골랐을 때여야 한다.
 */
const CHASE_SPEED = 108;
/** `>` 구간을 밟으면 잠깐 이만큼 빨라진다. 그래도 달리기보다는 느리다 */
const SURGE_SPEED = 120;
/**
 * **되살아날 때** 쫓아오는 것을 이만큼 뒤로 물린다.
 * 108px/s 로 오므로 3.3초 — 눈뜨고 상황을 보고 달리기 시작할 틈이다.
 * 짧게 잡으면 눈뜨자마자 다시 잡혀서 빠져나올 수 없는 판이 된다.
 */
const CHASE_LEAD = 360;
/**
 * **판을 시작할 때** 벌려두는 거리. 되살아날 때(CHASE_LEAD)보다 짧다.
 *
 * 둘을 같은 값으로 두면 시작이 너무 여유로워서, 잘 달리는 사람은 로봇을
 * 한 번도 못 보고 판을 끝낸다 — 쫓기는 판인데 쫓기는 느낌이 없다.
 * 되살아날 때는 반대로 넉넉해야 한다. 눈뜨자마자 다시 잡히면 빠져나올 수가 없다.
 */
const CHASE_START_LEAD = 200;
/** 추격 판에서 카메라를 이만큼 뒤로 물린다 — 뒤가 보여야 도망칠 마음이 든다 */
const CHASE_BACK = 70;

/** 이 판이 추격 판인가 */
const isChase = (game) => !!game.world?.stage?.chase;

/** 지금 쫓아오는 속도 */
const chaseSpeed = (game) => (game.effects.surge > 0 ? SURGE_SPEED : CHASE_SPEED);

/**
 * 뒤에서 밀고 오는 거대 로봇.
 *
 * 추격 판은 시작하자마자 붙는다 — 구간을 밟아야 시작하면 "올 것이 온다"는
 * 긴장이 아니라 그냥 갑자기 죽는 것이 된다.
 * 판정은 **세로 띠 하나**다. 그림이 아무리 커도 죽는 자리가 하나여야 헷갈리지 않는다.
 */
function handleChaser(game, dt) {
  if (!isChase(game)) {
    game.chaser = null;
    return;
  }
  if (!game.chaser) game.chaser = { x: game.player.x - CHASE_START_LEAD };
  game.chaser.x += chaseSpeed(game) * dt;
  if (game.player.dead || game.caught) return;
  const front = { x: game.chaser.x - 10, y: 0, w: 14, h: game.world.pixelHeight };
  if (!overlaps(game.player, front)) return;
  // 잡혔다 — 컷신이 돌고, 끝나면 **평소 죽음과 같은 길**로 체크포인트에 간다
  game.caught = { t: 0, length: caughtLength() };
  game.player.vx = 0;
  shakeCamera(game.camera, 1.4);
  emit(game, 'caught', {});
}

function handleFakeGoal(game, dt) {
  const { player, world } = game;
  for (const fake of world.fakeGoals) {
    if (fake.gone) continue;
    const box = { x: fake.x + fake.offset, y: fake.y, w: fake.w, h: fake.h };
    const dx = player.x - box.x;
    if (!fake.fleeing && Math.abs(dx) < 52) {
      fake.fleeing = true;
      game.trapMemory.reveal(markKey(game, fake.tx, fake.ty));
      emit(game, 'trap', { kind: 'fakeGoal' });
    }
    if (fake.fleeing) {
      fake.offset += 150 * dt;
      fake.fade = (fake.fade ?? 1) - dt * 0.55;
      if (fake.fade <= 0) fake.gone = true;
    }
  }
}

function handleGoal(game) {
  const goal = game.world.goal;
  if (!goal || game.player.dead) return;
  const box = { x: goal.x, y: goal.y - TILE * 2, w: goal.w, h: TILE * 3 };
  if (!overlaps(game.player, box)) return;
  game.scene = 'stageClear';
  game.sceneTime = 0;
  game.player.cleared = true;
  game.player.vx = 0;
  game.score += 500;
  emit(game, 'clear', { stage: game.stageIndex });
}

function handleCheckpoints(game) {
  for (const cp of game.world.checkpoints) {
    if (cp.taken) continue;
    const box = { x: cp.x - 6, y: cp.y - TILE, w: TILE + 12, h: TILE * 2 };
    if (!overlaps(game.player, box)) continue;
    cp.taken = true;
    game.checkpoint = { x: cp.x, y: cp.y };
    emit(game, 'checkpoint', {});
  }
}

/**
 * 한 바퀴를 돌기 전에는 NPC 도 포탈도 **없는 셈** 친다.
 * 처음 하는 사람의 튜토리얼 판에 낯선 사람이 서 있으면 그냥 헷갈리기만 한다.
 * 스테이지 1 사본을 따로 두지 않는 이유이기도 하다 — 두 벌이 되면 한쪽만 고치는 날이 온다.
 */
const hubOpen = (game) => !game.hard && (!!game.save?.clearedOnce || !!game.forceHub);

/**
 * 포탈이 열려 있는 스테이지 1 로 바로 간다 (개발자 모드).
 *
 * 2회차 입구를 보려고 한 바퀴를 다 돌게 하면 아무도 안 본다. **한 바퀴 돈 셈만**
 * 쳐주고(forceHub) 저장은 안 건드린다 — clearedOnce 를 켜버리면 그 기기에서
 * 1회차를 안 깬 사람의 타이틀 화면까지 바뀐다.
 */
function openHub(game) {
  game.forceHub = true;
  returnToHub(game);
}

/** 지금 말을 걸 수 있는 NPC (가까이 서 있고, 아직 안 걸었다). 없으면 null */
function npcInReach(game) {
  if (!hubOpen(game) || game.player.dead || game.npcTalk) return null;
  for (const npc of game.world.npcs) {
    if (npc.talked) continue;
    const box = { x: npc.x - 14, y: npc.y - TILE, w: TILE + 28, h: TILE * 2 };
    if (overlaps(game.player, box)) return npc;
  }
  return null;
}

/**
 * NPC 에게 말 걸기와 포탈.
 *
 * 말 걸기는 **점프 키 그대로**다 (input.confirmPressed 가 confirm || jump).
 * 새 키를 만들면 폰에 버튼이 하나 더 붙어야 하는데, 딱 한 번 쓰는 것 때문에
 * 조작 화면을 더 복잡하게 만들 이유가 없다.
 */
function handleNpc(game, input) {
  if (!hubOpen(game)) return;
  const npc = npcInReach(game);
  if (npc && input.confirmPressed) {
    npc.talked = true;
    game.npcTalk = { t: 0, length: npcTalkLength() };
    game.player.vx = 0;
    emit(game, 'talk', {});
  }
  // 말을 걸어야 문이 열린다
  const talked = game.world.npcs.some((n) => n.talked);
  for (const portal of game.world.portals) portal.open = talked && !game.npcTalk;
}

/** 열린 포탈에 들어가면 2회차가 시작된다 */
function handlePortal(game) {
  if (!hubOpen(game) || game.player.dead) return;
  for (const portal of game.world.portals) {
    if (!portal.open) continue;
    if (!overlaps(game.player, portal)) continue;
    emit(game, 'portal', {});
    // 판을 바로 열지 않고 **왜 또 달리는지**를 먼저 보여준다.
    // 컷신이 끝나면 아래 'intro' 장면이 startRun 으로 이어붙인다.
    startIntro(game, 'hardopen');
    return;
  }
}

// ── 잡동사니 갱신 ────────────────────────────────────────────
function updateParticles(game, dt) {
  for (const p of game.particles) {
    p.life -= dt;
    p.vy += p.gravity * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  game.particles = game.particles.filter((p) => p.life > 0);
  for (const t of game.texts) {
    t.life -= dt;
    t.y -= 24 * dt;
  }
  game.texts = game.texts.filter((t) => t.life > 0);
  game.flash = Math.max(0, game.flash - dt * 2);
}

function updateRank(game) {
  const goalX = game.world.goal?.x ?? game.world.pixelWidth;
  const progress = clamp(game.player.x / Math.max(1, goalX - TILE * 2), 0, 1);
  game.rank = rankAt(game.stageIndex, progress);
}

// ── 장면별 갱신 ──────────────────────────────────────────────
/** 역재생 구간에서는 좌우가 뒤바뀐다. 원본 input 은 건드리지 않는다. */
const applyEffects = (game, input) =>
  game.effects.reversed > 0 ? { ...input, left: input.right, right: input.left } : input;

/**
 * 대시는 **보스전에서만** 쓴다.
 *
 * 스테이지 1~4 는 걷기와 점프만으로 넘도록 짜여 있다. 판에서도 대시가 나가면
 * 구멍이 구멍이 아니게 되고, 넘으라고 만든 자리를 그냥 지나쳐 버린다.
 * 대시가 있어야 하는 건 아레나 하나뿐이다 — 3페이즈 레이저를 비켜서는 자리.
 */
const noDash = (input) => (input.dashPressed ? { ...input, dashPressed: false } : input);

/**
 * 세게 떨어졌을 때만 발밑에 먼지. 걸음마다 피우면 화면이 지저분해진다.
 *
 * 소리도 **같은 문턱**을 쓴다. 먼지는 나는데 소리가 없어서 무게가 반쪽이었다 —
 * 문턱을 따로 두면 언젠가 "먼지는 나는데 조용한 착지"가 생긴다.
 */
function landingDust(game, landed) {
  if (!landed || landed.impact < 0.45) return;
  emit(game, 'land', { impact: landed.impact });
  const p = game.player;
  addParticles(game, p.x + p.w / 2, p.y + p.h, 4 + Math.round(landed.impact * 4), ['#e8ecf7', '#b3aecd'], {
    speed: 40 * landed.impact,
    life: 0.32,
    lift: -6,
    gravity: 120,
    size: 1,
  });
}

function updatePlay(game, input, dt) {
  // 잡힌 동안에도 아무것도 안 움직인다. 끝나면 평소 죽음과 같은 길로 간다 —
  // 새 길을 만들면 "죽으면 체크포인트" 라는 이미 배운 규칙이 안 통하게 된다.
  if (game.caught) {
    const was = game.caught.t;
    game.caught.t += dt;
    beat(game, 'caught', CAUGHT_CUT, was, game.caught.t);
    // 추격 판에서 계속 보게 되는 컷신이다 — 다른 컷신처럼 건너뛸 수 있어야 한다
    if (skipping(input, game.caught.t)) game.caught.t = game.caught.length;
    if (game.caught.t >= game.caught.length) {
      game.caught = null;
      killPlayer(game);
    }
    return;
  }

  // NPC 와 이야기하는 동안에는 아무것도 안 움직인다 — 보스 컷신과 같은 규칙이다
  if (game.npcTalk) {
    const was = game.npcTalk.t;
    game.npcTalk.t += dt;
    beat(game, 'talk', NPC_TALK, was, game.npcTalk.t);
    if (skipping(input, game.npcTalk.t)) game.npcTalk.t = game.npcTalk.length;
    if (game.npcTalk.t >= game.npcTalk.length) game.npcTalk = null;
    return;
  }

  const events = updatePlayer(game.player, noDash(applyEffects(game, input)), game.world, dt);
  if (events.jumped) emit(game, 'jump', {});
  if (events.sprung) emit(game, 'spring', {});
  landingDust(game, events.landed);
  handleBlocks(game, events);
  handleCrumbling(game, dt);
  handleRisingWalls(game, dt);
  handleZones(game, dt);
  handlePopSpikes(game, dt);
  handleDropSlabs(game, dt);
  handleBlinkers(game);
  handleFakeChecks(game);
  handleCeilSpikes(game, dt);
  handleBombs(game, dt);
  handleChaser(game, dt);
  handleAlbums(game, dt, input.jump);
  handleShots(game, dt);
  handlePickups(game);
  handleCheckpoints(game);
  handleNpc(game, input);
  handlePortal(game);
  handleFakeGoal(game, dt);
  handleGoal(game);
  updateRank(game);

  if (events.fell) {
    game.player.dead = true;
    killPlayer(game);
  } else if (events.hazard && damagePlayer(game.player)) {
    killPlayer(game);
  }
  updateCamera(game.camera, game.player, game.world, dt, isChase(game) ? CHASE_BACK : 0);
}

/** 엔딩 컷신이 끝나면 통계 화면으로 */
function finishRun(game) {
  game.rank = TOP_RANK;
  game.ending = {
    rank: TOP_RANK,
    chartOuts: game.chartOuts,
    plays: game.plays,
    score: game.score + 2000,
    defeated: game.defeated,
    timeMs: game.elapsedMs,
    hard: game.hard,
  };
  game.scene = 'ending';
  game.sceneTime = 0;
  emit(game, 'ending', game.ending);
}

/**
 * 엔딩을 본 뒤 스테이지 1 로 돌아온다. 거기 NPC 가 서 있고, 말을 걸면 하드모드로 가는
 * 포탈이 열린다.
 *
 * **반드시 partial 로 둔다.** startRun 만 elapsedMs·chartOuts 를 지우는데(startRun),
 * 여기는 그걸 안 거치므로 1회차의 시간을 그대로 안고 판을 돈다 — 그 시간이 기록으로
 * 올라가면 최고 기록이 거짓말이 된다.
 */
function returnToHub(game) {
  game.hard = false;
  game.partial = true;
  game.ending = null;
  loadStage(game, 0);
}

/**
 * 음표를 다 모으면 열리는 숨은 화면. 앨범 열일곱 장이 한자리에 놓인다.
 *
 * **어디서 들어왔는지 기억해 둔다**(galleryBack). 타이틀에서 들어왔는데 나갈 때
 * 선택 화면으로 떨어지면, 한 바퀴를 안 깬 사람은 거기 갈 자격이 없는 자리에 서게 된다.
 */
function openGallery(game, from) {
  game.scene = 'gallery';
  game.sceneTime = 0;
  game.galleryBack = from;
}

/**
 * 타이틀에서 고를 수 있는 줄.
 *
 * **고르는 쪽(updateGame)과 그리는 쪽(render/hud)이 같이 본다** — 줄 수를 따로
 * 적어두면 줄이 늘었을 때 화면은 셋인데 고르기는 둘에서 도는 꼴이 된다.
 *
 * 줄이 하나뿐이면 메뉴를 아예 안 띄운다 — 예전처럼 아무 키나 누르면 시작이다.
 */
function titleRows(game) {
  const rows = [{ label: '처음부터', action: 'start' }];
  // 하던 판이 있으면 **맨 위**에. 나갔다 들어온 사람이 제일 먼저 찾는 줄이다.
  // (어디까지 갔는지도 같이 적는다 — 「이어하기」만 있으면 어디로 가는지 모른다)
  if (game.save?.resume) {
    rows.unshift({ label: resumeLabel(game.save.resume), action: 'resume' });
  }
  if (canSelect(game)) rows.push({ label: '스테이지 선택', action: 'select' });
  // 2회차가 있다는 걸 **여기서 말해준다.** 예전에는 깨고 나면 말없이 스테이지 1 로
  // 되돌려놓는 게 전부라, NPC 를 지나치면 2회차가 있는 줄도 몰랐다.
  if (game.save?.clearedOnce) rows.push({ label: '2회차', action: 'hub' });
  // 음표를 다 모은 사람에게만. 선택 목록에도 같은 칸이 있지만 여기 두는 게 중요하다 —
  // 한 바퀴를 안 깨도 음표는 다 모을 수 있어서, 목록 쪽만 두면 「스테이지 선택」 안에
  // 이것 하나만 덩그러니 들어 있는 꼴이 된다.
  if (allNotes(game)) rows.push({ label: '숨은 화면', action: 'gallery' });
  return rows;
}

/**
 * 스테이지 선택 화면의 칸 **한 벌**.
 *
 * 예전에는 칸 번호(core)와 칸 이름(render/hud)을 따로 적어뒀다. 하드 판을 넣으려면
 * 두 곳을 같이 고쳐야 하고, 한쪽만 고치면 **엉뚱한 판이 시작되는데 화면은 맞게 보인다**.
 * 그래서 여기 한 곳에만 적고 양쪽이 이걸 읽는다.
 *
 * run 이 있으면 startRun 에 그대로 넘긴다. index 가 판 수와 같으면 보스전이다.
 *
 * `needs` 가 이 칸을 누가 볼 수 있는지 정한다:
 *   'clearedOnce'  한 바퀴 깬 사람 (그냥 플레이어도 본다)
 *   'clearedHard'  2회차까지 깬 사람
 *   'dev'          개발자 모드에서만 — 이야기 순서를 건너뛰거나 모드를 끄는 칸들
 */
const SELECT_ITEMS = [
  ...STAGES.map((s, i) => ({ label: `STAGE ${s.number}`, run: { index: i }, needs: 'clearedOnce' })),
  { label: '보스전', run: { index: STAGES.length }, needs: 'clearedOnce' },
  ...HARD_STAGES.map((s, i) => ({
    label: `하드 ${s.number}판`,
    run: { index: i, hard: true },
    needs: 'clearedHard',
  })),
  { label: '하드 보스전', run: { index: HARD_STAGES.length, hard: true }, needs: 'clearedHard' },
  /**
   * 포탈이 열려 있는 스테이지 1. NPC 에게 말을 걸고 문으로 들어가면 2회차가 시작된다 —
   * 하드 판으로 바로 뛰어드는 위 칸들과 달리 **입구 전체**를 볼 수 있다.
   */
  /**
   * 깬 사람에게 보이는 2회차 입구. 하드 개별 판(위)은 `clearedHard` 라, 이게 없으면
   * **하드를 깨야 하드가 목록에 보이는** 닭-달걀이 된다.
   */
  { label: '2회차 입구', action: 'hub', needs: 'clearedOnce' },
  /** 음표를 다 모으면 열리는 숨은 화면. 'allNotes' 는 저장 칸이 아니라 아래 GATES 가 센다 */
  { label: '숨은 화면', action: 'gallery', needs: 'allNotes' },
  { label: '포탈 스테이지 1', action: 'hub', needs: 'dev' },
  { label: '오프닝 다시 보기', action: 'opening', needs: 'dev' },
  { label: '2회차 시작 컷신', action: 'hardopen', needs: 'dev' },
  { label: '개발자 모드 끄기', action: 'devOff', needs: 'dev' },
];

/**
 * 지금 이 사람에게 보이는 칸들.
 *
 * **고르는 쪽(updateGame)과 그리는 쪽(render/hud)이 반드시 이 함수를 같이 써야 한다.**
 * selectIndex 는 여기서 나온 목록의 자리 번호다 — 목록이 서로 다르면 화면은 맞는데
 * 엉뚱한 판이 시작된다 (위 주석의 그 사고다).
 *
 * 개발자 모드는 전부 본다. 그러면 SELECT_HARD 같은 자리 번호가 그대로 맞는다.
 */
/**
 * `needs` 가 저장의 칸 이름이 아닌 것들. 음표는 저장에 **개수가 아니라 자리 목록**이
 * 들어 있어서 세어봐야 하고, 이번 판에 주운 것도 쳐줘야 한다.
 */
const GATES = { allNotes };

function selectItems(game) {
  if (game.dev) return SELECT_ITEMS;
  const save = game.save ?? {};
  const open = (needs) => (GATES[needs] ? GATES[needs](game) : !!save[needs]);
  return SELECT_ITEMS.filter((item) => item.needs !== 'dev' && open(item.needs));
}

/** 고를 게 하나라도 있나. 없으면 타이틀에 메뉴를 띄우지 않는다 (예전 그대로 바로 시작) */
const canSelect = (game) => selectItems(game).length > 0;

const slotOf = (test) => SELECT_ITEMS.findIndex(test);
/** 하드모드 1판부터 (NPC 를 안 거치고 바로 — 개발자 모드에서만) */
const SELECT_HARD = slotOf((s) => s.run?.hard && s.run.index === 0);
/** 하드 보스전으로 바로 */
const SELECT_HARD_BOSS = slotOf((s) => s.run?.hard && s.run.index === HARD_STAGES.length);
/** 오프닝 다시 보기 (한 번 보면 저절로는 안 뜨므로 여기서만 다시 볼 수 있다) */
const SELECT_OPENING = slotOf((s) => s.action === 'opening');
/** 포탈이 열려 있는 스테이지 1 (2회차 입구를 통째로 보는 칸) */
const SELECT_HUB = slotOf((s) => s.action === 'hub');
/** 2회차 시작 컷신 다시 보기 */
const SELECT_HARD_OPEN = slotOf((s) => s.action === 'hardopen');
/** 개발자 모드 끄기 */
const SELECT_DEV_OFF = slotOf((s) => s.action === 'devOff');
const SELECT_SLOTS = SELECT_ITEMS.length;

/**
 * 화면을 덮는 컷신이 도는 중인가.
 *
 * HUD 를 숨기는 판단과 「건너뛰기」 버튼을 띄우는 판단이 **같은 상태**다. 두 군데
 * 적어두면 한쪽만 고치는 날이 온다 — 실제로 hud 쪽은 잡히는 컷신(caught)을
 * 빼먹고 있어서 그 컷신에서만 HUD 가 화면 위에 남아 있었다.
 *
 * NPC 대화(npcTalk)는 여기 안 넣는다. 판 위에 작은 말풍선이 뜬 것뿐이고 화면을
 * 안 덮으므로, HUD 도 그대로 있어야 하고 「건너뛰기」 버튼을 띄울 자리도 아니다.
 */
const inCutscene = (game) =>
  game.scene === 'intro' ||
  game.scene === 'cutscene' ||
  !!game.bossCut ||
  // 컷신 사이의 암전도 컷신이다 — 여기서 HUD 가 0.3초 돌아왔다 사라지면 깜빡인다
  game.bossCutGap > 0 ||
  !!game.caught;

/**
 * 컷신을 튼 뒤 이만큼은 못 건너뛴다.
 *
 * 들어가는 순간 눌려 있던 점프가 그대로 먹으면 컷신이 시작도 안 하고 날아간다.
 * 예전에는 컷신마다 0.6·0.6·0.5·0.4 로 따로 적혀 있었고 잡히는 컷신에는 아예
 * 건너뛰기가 없었다 — 다섯 군데 중 한 군데를 빠뜨린 셈이다.
 */
const SKIP_AFTER = 0.5;

/**
 * 엔딩 통계 화면이 입력을 안 받는 시간(초). 18초짜리 컷신이 끝나자마자 눌려 있던
 * 키에 화면이 날아가면 기록을 볼 새가 없다.
 *
 * **style.css 의 `--ending-lock` 과 같은 값이어야 한다** — 「아무 키나 누르면」
 * 줄이 뜨는 시각을 거기서 정하기 때문이다. 둘이 어긋나면 못 누르는 동안 누르라고
 * 하거나(예전이 그랬다), 누를 수 있는데 아무 말이 없다. 테스트가 둘을 견준다.
 */
const ENDING_LOCK = 1.5;

/** 지금 이 컷신(시작한 지 t 초)을 건너뛰라는 입력인가 */
const skipping = (input, t) => input.confirmPressed && t > SKIP_AFTER;

/** 개발자 모드를 켜고 끈다. 비번 판정은 ui 가 하고 결과만 여기로 온다. */
function setDevMode(game, on) {
  game.dev = on;
  game.titleIndex = 0;
  // 목록이 짧아지므로 고른 자리가 범위 밖일 수 있다
  game.selectIndex = 0;
  emit(game, 'dev', { on });
}

/**
 * 컷신이 새 단계로 넘어가는 순간마다 알린다. 소리는 ui/ 가 낸다 — 여기는 시각만 판정한다.
 *
 * 첫 프레임(from 이 0)에는 0.0 초에 있는 단계도 넘긴 것으로 친다.
 * 안 그러면 컷신 맨 앞 단계만 소리가 안 난다.
 */
function beat(game, cut, timeline, from, to) {
  for (const step of beatsCrossed(timeline, from > 0 ? from : -1, to)) {
    emit(game, 'cutbeat', { cut, kind: step.kind });
  }
}

/** 보스전 컷신을 튼다. 도는 동안 보스도 플레이어도 멈춘다. */
function startBossCut(game, id) {
  if (!id) return;
  game.bossCut = { id, t: 0, length: bossCutLength(id) };
  emit(game, 'cutscene', { id });
}

/**
 * 보스에게 한 대 먹인다. 밟기와 던지기가 같은 길을 쓴다.
 * 실제로 들어갔으면 true.
 */
function damageBoss(game, opts = {}) {
  const boss = game.boss;
  if (!hitBoss(boss, opts)) return false;
  game.score += 400;
  game.defeated += 1;
  shakeCamera(game.camera, 1);
  addParticles(game, boss.x + boss.w / 2, boss.y + boss.h / 2, 16, ['#fff', '#ffd166', '#ff5d8f'], {
    speed: 120,
    life: 0.8,
  });
  emit(game, 'bosshit', {});

  /**
   * 세 갈래다. **평타 / 페이즈 전환 / 마지막 일격**.
   *
   * 예전에는 두 갈래였고 (`changed` 아니면 `hp > 0`), 그래서 hp 가 0 이 되는
   * 순간에는 **어느 쪽도 실행되지 않았다** — 아홉 번 중 가장 중요한 아홉 번째에
   * 플래시도 전용 소리도 없었다. 게다가 'bossdown'(쓰러지는 팡파르, 1초짜리)이
   * 평타에 붙어 있어서 매 타격마다 다음 타격 위로 겹쳐 울렸다. 이름도 사실과 반대였다.
   */
  const changed = syncPhase(boss);
  if (boss.hp <= 0) {
    // 마지막 일격. 평타 플래시(1)보다 **위로 벌린다** — 렌더가 0.85 까지 받는다
    game.flash = 1.4;
    freezeGame(game, FREEZE.bossBig);
    shakeCamera(game.camera, 1.8);
    // 이제야 이름이 사실이 된다. 소리가 끝나갈 즈음 보스가 다 가라앉는다
    emit(game, 'bossdown', {});
  } else if (changed) {
    // 페이즈가 바뀌면 싸움을 멈추고 전환 컷신을 튼다
    startBossCut(game, cutForPhase(changed, game.hard));
    game.flash = 1;
    freezeGame(game, FREEZE.bossBig);
    shakeCamera(game.camera, 1.6);
    emit(game, 'phase', { phase: changed });
  } else {
    // 평타. 보스 몸이 하얘지는 hurtFlash 와 별개로 화면도 한 번 번쩍인다
    game.flash = 1;
    freezeGame(game, FREEZE.bossHit);
  }
  return true;
}

/** 보스가 흘린 마이크: 바닥에 떨어지고, 주우면 한 발 생긴다 */
function handleMics(game, dt) {
  const { player, world } = game;
  game.mics = game.mics.filter((mic) => {
    mic.life -= dt;
    if (mic.life <= 0) return false;
    if (!mic.landed) {
      mic.vy = Math.min(mic.vy + 620 * dt, 300);
      mic.y += mic.vy * dt;
      const ty = Math.floor((mic.y + mic.h) / TILE);
      const tx = Math.floor((mic.x + mic.w / 2) / TILE);
      if (world.tileAt(tx, ty) === 'solid') {
        mic.y = ty * TILE - mic.h;
        mic.landed = true;
      }
    } else {
      mic.bob += dt * 5;
    }
    if (!player.dead && player.ammo < 1 && overlaps(player, mic)) {
      player.ammo = 1;
      addParticles(game, mic.x + 5, mic.y + 5, 6, ['#ffd166', '#fff'], { speed: 50, life: 0.4 });
      emit(game, 'power', {});
      return false;
    }
    return true;
  });
}

/** 던진 마이크가 보스에 맞으면 한 대. 맞으면 사라진다(1회용) */
function handleThrown(game, dt, onHit) {
  const boss = game.boss;
  game.thrown = game.thrown.filter((mic) => {
    if (!updateThrown(mic, game.world, dt)) return false;
    if (boss && boss.state !== 'defeated' && overlaps(mic, boss)) {
      onHit();
      return false;
    }
    return true;
  });
}

function updateBossScene(game, input, dt) {
  const boss = game.boss;

  // 컷신이 도는 동안에는 아무것도 움직이지 않는다 — 연출 보다가 죽으면 안 된다
  // 쓰러지는 컷신과 엔딩 사이의 숨. 화면은 이미 검다.
  if (game.bossCutGap > 0) {
    game.bossCutGap -= dt;
    if (game.bossCutGap <= 0) {
      game.bossCutGap = 0;
      startBossCut(game, endingCut(game.hard));
    }
    return;
  }

  if (game.bossCut) {
    const was = game.bossCut.t;
    game.bossCut.t += dt;
    // 실제로 흐른 만큼만 소리를 낸다. 건너뛰기로 시각을 끝까지 밀기 **전에** 판정해야
    // 남은 단계 열 개가 한 프레임에 쏟아지지 않는다.
    beat(game, game.bossCut.id, BOSS_CUTS[game.bossCut.id].timeline, was, game.bossCut.t);
    if (skipping(input, game.bossCut.t)) game.bossCut.t = game.bossCut.length;
    if (game.bossCut.t >= game.bossCut.length) {
      const finished = game.bossCut.id;
      game.bossCut = null;
      // 컷신이 끝났다고 알린다. 건너뛰었을 때도 반드시 나오므로,
      // 컷신 때문에 꺼둔 것(브금 같은 것)을 여기서 되돌리면 안전하다.
      emit(game, 'cutdone', { cut: finished });
      // 쓰러지는 컷신이 끝나면 엔딩으로 이어진다. **쉼표를 하나 둔다** —
      // 하드컷으로 붙이면 4.6초와 18초짜리 두 컷신이 한 덩어리로 뭉쳐 읽힌다.
      // (컷신 그리기가 앞뒤 0.3/0.4초를 검게 여닫으므로 그 사이가 완전한 암전이다)
      if (finished === 'bossdown') game.bossCutGap = BOSS_CUT_GAP;
      if (isEndingCut(finished)) finishRun(game);
    }
    return;
  }

  const events = updatePlayer(game.player, applyEffects(game, input), game.world, dt);
  if (events.jumped) emit(game, 'jump', {});
  if (events.dashed) emit(game, 'dash', {});
  landingDust(game, events.landed);

  const ctx = {
    player: game.player,
    arenaWidth: game.world.pixelWidth,
    spawnShot: (shot) => game.shots.push({ wobble: 0, ...shot }),
    addAlbum: (album) => game.albums.push(album),
    dropMic: (mic) => game.mics.push(mic),
    onAim: () => emit(game, 'laseraim', {}),
    onLaser: () => emit(game, 'laser', {}),
    onFire: () => emit(game, 'shot', {}),
    // 꼬리는 플레이어 반대쪽에서 시작한다 — 발밑에서 생기면 예고가 있어도 못 피한다
    playerX: game.player.x + game.player.w / 2,
    onTailAim: () => emit(game, 'tailaim', {}),
    onTail: () => emit(game, 'tail', {}),
    onStompAim: () => emit(game, 'stompaim', {}),
    onWhirlAim: () => emit(game, 'laseraim', {}),
    onWhirl: () => emit(game, 'trap', { kind: 'whirl' }),
    onCeiling: () => {
      shakeCamera(game.camera, 0.6);
      emit(game, 'trap', { kind: 'ceiling' });
    },
    onStomp: () => {
      shakeCamera(game.camera, 1.2);
      // **앨범 밟기와 다른 이벤트다.** 같은 'stomp' 를 쓰고 있었더니 거대 로봇이
      // 땅을 내려찍는데 CD 한 장 밟는 소리가 났다 — 중요도가 뒤집힌다.
      emit(game, 'bossstomp', {});
    },
  };
  updateBoss(boss, ctx, dt);

  // 들고 있으면 던진다 — 한 발뿐이다
  if (input.throwPressed && game.player.ammo > 0 && !game.player.dead) {
    game.player.ammo = 0;
    game.thrown.push(throwMic(game.player));
    emit(game, 'throw', {});
  }

  handleMics(game, dt);
  handleThrown(game, dt, () => damageBoss(game, { ranged: true }));
  handleAlbums(game, dt, input.jump);
  handleShots(game, dt);
  handleLaser(game);
  handleGroundSweeps(game);

  if (boss.state !== 'defeated' && !game.player.dead) {
    // 약점 밟기 — 붙어야 해서 위험하지만 마이크를 기다릴 필요가 없다
    if (overlaps(game.player, boss)) {
      if (boss.vulnerable && isStomp(game.player, boss)) {
        if (damageBoss(game)) bounce(game.player, true, input.jump);
      } else if (damagePlayer(game.player)) {
        killPlayer(game);
      }
    }
    // 분열된 조각에 맞기
    for (const q of boss.quarters) {
      if (q.delay > 0) continue;
      if (!game.player.dead && overlaps(game.player, q) && damagePlayer(game.player)) killPlayer(game);
    }
  }

  if (events.fell) {
    game.player.dead = true;
    killPlayer(game);
  } else if (events.hazard && damagePlayer(game.player)) {
    killPlayer(game);
  }

  // 쓰러지면 **먼저 쓰러지는 컷신**을 틀고, 그게 끝나야 엔딩으로 간다.
  // 그냥 사라지면 이긴 것 같지가 않다 — 박혀 있던 앨범이 떨어져 나가는 걸 보여준다.
  if (boss.state === 'defeated' && boss.defeatedAt > 0.9 && !game.downShown) {
    game.downShown = true;
    startBossCut(game, 'bossdown');
  }

  updateCamera(game.camera, game.player, game.world, dt);
}

/**
 * 멈췄을 때 고를 수 있는 줄. 순서가 곧 화면 순서다.
 *
 * volume 은 여기서 아무것도 안 한다 — core 는 소리를 모른다. 'volume' 이벤트만 내고
 * 실제로 크기를 바꾸는 건 ui/app.js 다 (오디오는 브라우저 것이라 여기 들어오면 테스트가 죽는다).
 */
/**
 * 일시정지 메뉴의 줄.
 *
 * 'mute' 가 여기 있는 이유: 음소거는 **M 키뿐**이었다. 폰에는 키보드가 없으니
 * 소리를 끌 방법이 아예 없었다 — 조용한 데서 켰다가 그냥 창을 닫아야 했다.
 */
const PAUSE_ROWS = ['resume', 'retry', 'volume', 'mute', 'title'];

/** 멈춤을 풀 수 있는 장면. 여기 아니면 Esc 를 눌러도 안 멈춘다. */
/** 지금 멈출 수 있는 장면인가. 컷신·타이틀에서는 멈춤이 없다.
 *  (ui/app.js 의 뒤로가기·화면 가림 처리도 이걸 쓴다 — 두 군데 적으면 어긋난다) */
const pausable = (game) => game.scene === 'play' || game.scene === 'boss';

function choosePause(game) {
  const row = PAUSE_ROWS[game.pauseIndex] ?? 'resume';
  // 소리 줄들은 멈춘 채로 머문다 — 한 칸 돌리고 바로 들어보고 싶기 때문이다
  if (row === 'volume') {
    emit(game, 'volume', {});
    return;
  }
  if (row === 'mute') {
    emit(game, 'mute', {});
    return;
  }
  // 나머지는 전부 멈춤을 푼다. 멈춘 채로 장면을 옮기면 아무 키도 안 먹어서 게임이 잠긴다.
  game.paused = false;
  emit(game, 'pause', { paused: false });
  if (row === 'retry') killPlayer(game);
  else if (row === 'title') {
    game.scene = 'title';
    game.sceneTime = 0;
    game.titleIndex = 0;
  }
}

function updatePauseMenu(game, input) {
  const moved = (input.rightPressed ? 1 : 0) - (input.leftPressed ? 1 : 0);
  if (moved) game.pauseIndex = (game.pauseIndex + moved + PAUSE_ROWS.length) % PAUSE_ROWS.length;
  if (input.confirmPressed) choosePause(game);
}

/** 게임 한 프레임. input 은 이미 sample() 된 상태여야 한다. */
function updateGame(game, input, dt) {
  game.sceneTime += dt;

  if (input.pausePressed && pausable(game)) {
    game.paused = !game.paused;
    if (game.paused) game.pauseIndex = 0;
    emit(game, 'pause', { paused: game.paused });
  }
  if (game.paused) {
    // 멈춘 동안은 메뉴만 움직인다 — 시간도 안 흐르고 아무것도 갱신되지 않는다
    updatePauseMenu(game, input);
    return;
  }

  const playing = game.scene === 'play' || game.scene === 'boss';
  if (playing) game.elapsedMs += dt * 1000;

  updateParticles(game, dt);

  /**
