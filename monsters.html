<title>오답 몬스터</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16121B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오답 몬스터">
<meta name="format-detection" content="telephone=no">
<link id="mfLink" rel="manifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">

<style>
/* ── 단일 세계관: 밤의 아케이드. 라이트 테마로 뒤집지 않고 전 색을 직접 칠한다 ── */
:root{
  --bg:#16121B; --bg2:#0E0B12; --surf:#221C29; --surf2:#2C2436; --surf3:#372E43;
  --line:#3B3247; --line2:#4E4360;
  --tx:#F3EEF7; --tx2:#B4A9C2; --tx3:#7E7290;
  --amber:#FFB443; --amber-d:#8A5F16; --amber-g:rgba(255,180,67,.14);
  --jade:#35D6A0; --jade-g:rgba(53,214,160,.15);
  --crim:#FF4E63; --crim-g:rgba(255,78,99,.15);
  --mon:#8B7BC7; --mon-g:rgba(139,123,199,.16);
  --f-d:"Black Han Sans","Gothic A1",sans-serif;
  --f-b:"Gothic A1","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-m:"IBM Plex Mono",ui-monospace,monospace;
  --r:16px; --r-s:11px;
  --pad:16px;
  --safeb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--tx); font-family:var(--f-b); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  background-image:radial-gradient(120% 60% at 50% 0%, #241C2E 0%, var(--bg) 58%, var(--bg2) 100%);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;font-family:var(--f-b)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── 앱 셸 ── */
#app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}
@supports not (height:100dvh){#app{min-height:100vh}}
.bar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) var(--pad) 10px;
  background:linear-gradient(var(--bg) 72%,rgba(22,18,27,0));
}
.bar .ttl{font-family:var(--f-d);font-size:18px;letter-spacing:-.01em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:42px;height:42px;flex-shrink:0;border-radius:12px;background:var(--surf);
  border:1px solid var(--line);display:grid;place-items:center;transition:background .15s}
.iconbtn:active{background:var(--surf2)}
.view{flex:1;display:flex;flex-direction:column;padding:0 var(--pad) calc(24px + var(--safeb))}
.grow{flex:1}

/* ── 홈: 통계 스트립 ── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:var(--r-s);padding:11px 10px;text-align:center}
.stat .v{font-family:var(--f-d);font-size:23px;line-height:1.15;color:var(--amber)}
.stat .l{font-size:11px;color:var(--tx3);margin-top:1px;letter-spacing:-.01em}

/* ── 몬스터 배너 ── */
.monbar{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:linear-gradient(100deg,var(--mon-g),transparent 70%),var(--surf);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;
}
.monbar:active{background:var(--surf2)}
.monbar .n{font-family:var(--f-d);font-size:26px;color:var(--mon);line-height:1}
.monbar .tx{flex:1;min-width:0}
.monbar .tx b{display:block;font-size:14.5px;font-weight:700}
.monbar .tx small{display:block;font-size:12px;color:var(--tx3);line-height:1.5}
.monbar .chev{color:var(--tx3);flex-shrink:0}

/* ── 모드 카드 ── */
.modes{display:flex;flex-direction:column;gap:10px}
.mode{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:76px;
  background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
  transition:transform .1s,border-color .15s,background .15s;
}
.mode:active{transform:scale(.985);background:var(--surf2)}
.mode .ic{width:46px;height:46px;flex-shrink:0;border-radius:13px;display:grid;place-items:center}
.mode b{display:block;font-family:var(--f-d);font-size:17.5px;font-weight:400;letter-spacing:-.01em}
.mode small{display:block;font-size:12.5px;color:var(--tx2);line-height:1.5;margin-top:1px}
.mode .cnt{margin-left:auto;font-family:var(--f-m);font-size:11.5px;color:var(--tx3);flex-shrink:0}
.mode.m1 .ic{background:var(--crim-g);color:var(--crim)}
.mode.m2 .ic{background:var(--amber-g);color:var(--amber)}
.mode.m3 .ic{background:var(--jade-g);color:var(--jade)}
.mode.m4 .ic{background:var(--mon-g);color:var(--mon)}
.mode[disabled]{opacity:.45}

.sect{font-size:11.5px;font-family:var(--f-m);letter-spacing:.12em;text-transform:uppercase;
  color:var(--tx3);margin:22px 0 10px;display:flex;align-items:center;gap:9px}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}

/* ── 단원 선택 ── */
.units{display:flex;flex-direction:column;gap:8px}
.unit{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:64px;
  background:var(--surf);border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px;
}
.unit:active{background:var(--surf2)}
.unit .no{font-family:var(--f-d);font-size:15px;color:var(--amber);width:26px;flex-shrink:0}
.unit b{display:block;font-size:15px;font-weight:700}
.unit small{display:block;font-size:11.5px;color:var(--tx3);font-family:var(--f-m)}
.unit .rate{margin-left:auto;text-align:right;flex-shrink:0}
.unit .rate i{display:block;font-family:var(--f-m);font-size:13px;font-style:normal;color:var(--tx2)}
.unit .rate u{display:block;width:52px;height:4px;border-radius:4px;background:var(--surf3);
  margin-top:4px;text-decoration:none;overflow:hidden}
.unit .rate u b{display:block;height:100%;background:var(--jade);border-radius:4px}

/* ── 플레이 ── */
.hud{display:flex;align-items:center;gap:10px;padding:2px 0 14px}
.timer{font-family:var(--f-m);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;
  padding:5px 11px;border-radius:99px;background:var(--surf);border:1px solid var(--line)}
.timer.warn{color:var(--crim);border-color:var(--crim);animation:tick .6s steps(2) infinite}
@keyframes tick{50%{opacity:.5}}
.track{flex:1;height:6px;border-radius:6px;background:var(--surf);overflow:hidden}
.track i{display:block;height:100%;background:var(--amber);border-radius:6px;transition:width .3s linear}
.score{font-family:var(--f-d);font-size:19px;color:var(--amber);font-variant-numeric:tabular-nums}
.combo{font-family:var(--f-d);font-size:13px;color:var(--amber);padding:3px 9px;border-radius:99px;
  background:var(--amber-g);white-space:nowrap}

.qcard{
  background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:18px 17px;
  display:flex;flex-direction:column;gap:12px;
}
.qmeta{display:flex;align-items:center;gap:8px;font-size:11px;font-family:var(--f-m);color:var(--tx3);
  letter-spacing:.05em;flex-wrap:wrap}
.qmeta .era{color:var(--amber);letter-spacing:0;font-family:var(--f-b);font-weight:700;font-size:12px}
.qmeta .mob{color:var(--mon);font-family:var(--f-b);font-weight:700;font-size:12px;letter-spacing:0;
  display:inline-flex;align-items:center;gap:4px}
.qtext{font-size:18.5px;line-height:1.62;font-weight:500;text-wrap:balance;word-break:keep-all}
.qtext.big{font-family:var(--f-d);font-size:25px;font-weight:400;line-height:1.42}

/* 답 버튼 — 엄지 영역 */
.answers{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.ans{
  display:flex;align-items:center;gap:11px;text-align:left;min-height:58px;padding:12px 15px;
  background:var(--surf);border:2px solid var(--line);border-radius:var(--r-s);
  font-size:16px;line-height:1.45;font-weight:500;transition:transform .09s,background .13s,border-color .13s;
  word-break:keep-all;
}
.ans:active:not(:disabled){transform:scale(.985)}
.ans .kx{font-family:var(--f-m);font-size:12px;color:var(--tx3);flex-shrink:0;width:14px}
.ans.ok{border-color:var(--jade);background:var(--jade-g);color:#9BF0D0}
.ans.ok .kx{color:var(--jade)}
.ans.no{border-color:var(--crim);background:var(--crim-g);color:#FFB0BB}
.ans.no .kx{color:var(--crim)}
.ans.dim{opacity:.4}
.ans:disabled{cursor:default}
.ox2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.oxb{
  min-height:104px;border-radius:var(--r);border:2px solid var(--line);background:var(--surf);
  font-family:var(--f-d);font-size:44px;transition:transform .09s,background .13s,border-color .13s;
}
.oxb:active:not(:disabled){transform:scale(.97)}
.oxb.o{color:var(--jade)} .oxb.x{color:var(--crim)}
.oxb.ok{border-color:var(--jade);background:var(--jade-g)}
.oxb.no{border-color:var(--crim);background:var(--crim-g)}
.oxb.dim{opacity:.35}

/* 해설 */
.fb{border-radius:var(--r-s);padding:13px 15px;font-size:14.5px;line-height:1.65;margin-top:14px;
  display:flex;gap:10px;align-items:flex-start;word-break:keep-all}
.fb.ok{background:var(--jade-g);color:#A7F0D6}
.fb.no{background:var(--crim-g);color:#FFBAC3}
.fb .em{font-family:var(--f-d);font-size:17px;line-height:1.35;flex-shrink:0}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;
  border-radius:var(--r-s);background:var(--amber);color:#2A1A02;font-weight:900;font-size:16.5px;
  transition:transform .09s,filter .13s;
}
.btn:active{transform:scale(.985);filter:brightness(1.08)}
.btn.ghost{background:var(--surf);color:var(--tx);border:1.5px solid var(--line);font-weight:700}
.btn.mon{background:var(--mon);color:#160F22}
.btn[disabled]{opacity:.4}
.btnrow{display:flex;gap:9px;margin-top:12px}
.btnrow>*{flex:1}
.sticky{position:sticky;bottom:0;padding-bottom:calc(10px + var(--safeb));
  background:linear-gradient(rgba(22,18,27,0),var(--bg) 26%);padding-top:14px;margin-top:auto}

/* ── 연표 세우기 ── */
.tl{display:flex;flex-direction:column;gap:8px;margin-top:14px;position:relative;touch-action:pan-y}
.tlc{
  display:flex;align-items:center;gap:11px;background:var(--surf);border:2px solid var(--line);
  border-radius:var(--r-s);padding:11px 12px;min-height:62px;will-change:transform;
  transition:transform .18s cubic-bezier(.2,0,.2,1),border-color .15s,background .15s,box-shadow .15s;
}
.tlc.drag{border-color:var(--amber);background:var(--surf2);z-index:5;
  box-shadow:0 12px 30px -8px rgba(0,0,0,.75);transition:border-color .15s,background .15s}
.tlc.ok{border-color:var(--jade);background:var(--jade-g)}
.tlc.no{border-color:var(--crim);background:var(--crim-g)}
.tlc .grip{color:var(--tx3);flex-shrink:0;cursor:grab;touch-action:none;padding:6px 2px;margin:-6px 0}
.tlc .yr{font-family:var(--f-m);font-weight:600;font-size:12.5px;color:var(--amber);
  flex-shrink:0;width:62px;line-height:1.35}
.tlc .ord{font-family:var(--f-d);font-size:15px;color:var(--amber);flex-shrink:0;width:22px;
  text-align:center;font-variant-numeric:tabular-nums}
.tlc .nm{font-size:14.5px;font-weight:700;line-height:1.4;flex:1;min-width:0;word-break:keep-all}
.tlc .mv{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.tlc .mv button{width:34px;height:26px;border-radius:7px;background:var(--surf2);
  display:grid;place-items:center;color:var(--tx2)}
.tlc .mv button:active{background:var(--surf3)}
.tlc .mv button[disabled]{opacity:.28}

/* ── 결과 ── */
.result{text-align:center;padding:22px 0 8px}
.result .big{font-family:var(--f-d);font-size:64px;line-height:1;color:var(--amber);
  font-variant-numeric:tabular-nums}
.result .sub{font-size:14.5px;color:var(--tx2);margin-top:8px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.rgrid .stat .v{font-size:20px;color:var(--tx)}
.rlist{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.rrow{display:flex;gap:10px;align-items:flex-start;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r-s);padding:11px 13px;font-size:13.5px;line-height:1.55;word-break:keep-all}
.rrow .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:6px}
.rrow .dot.ok{background:var(--jade)} .rrow .dot.no{background:var(--crim)}
.rrow small{display:block;color:var(--tx3);font-size:12.5px;margin-top:2px}

/* ── 몬스터 목록 ── */
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
.mcard{background:var(--surf);border:1px solid var(--line);border-radius:var(--r-s);padding:12px 11px;
  display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.mcard .kind{font-family:var(--f-m);font-size:9.5px;letter-spacing:.08em;color:var(--tx3);
  border:1px solid var(--line);border-radius:99px;padding:2px 7px}
.mcard .nm{font-size:12px;color:var(--tx2);line-height:1.45;word-break:keep-all;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hp{display:flex;gap:3px}
.hp i{width:15px;height:5px;border-radius:3px;background:var(--surf3)}
.hp i.on{background:var(--jade)}

/* ── 듣기 ── */
.listen{display:flex;flex-direction:column;align-items:center;gap:16px;padding:14px 0}
.wave{display:flex;align-items:flex-end;gap:4px;height:44px}
.wave i{width:5px;border-radius:3px;background:var(--mon);height:20%}
.wave.on i{animation:w .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s} .wave i:nth-child(3){animation-delay:.2s}
.wave i:nth-child(4){animation-delay:.3s} .wave i:nth-child(5){animation-delay:.15s}
.wave i:nth-child(6){animation-delay:.25s} .wave i:nth-child(7){animation-delay:.05s}
@keyframes w{0%,100%{height:20%}50%{height:100%}}

/* ── 떠오르는 점수 ── */
.pop{position:fixed;left:50%;top:34%;transform:translateX(-50%);z-index:60;pointer-events:none;
  font-family:var(--f-d);font-size:38px;color:var(--amber);text-shadow:0 4px 20px rgba(0,0,0,.6);
  animation:pop .8s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.6)}
  22%{opacity:1;transform:translateX(-50%) scale(1.14)}
  62%{opacity:1;transform:translateX(-50%) scale(1) translateY(-6px)}
  100%{opacity:0;transform:translateX(-50%) scale(1) translateY(-42px)}}
.flash{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0}
.flash.go{animation:fl .42s ease-out}
@keyframes fl{0%{opacity:.5}100%{opacity:0}}

.empty{text-align:center;padding:44px 18px;color:var(--tx3)}
.empty p{font-size:14.5px;line-height:1.7;max-width:30ch;margin:12px auto 0;word-break:keep-all}
.note{font-size:12.5px;color:var(--tx3);line-height:1.6;word-break:keep-all}
.hidden{display:none!important}
</style>

<div id="app">
  <header class="bar">
    <button class="iconbtn hidden" id="back" aria-label="뒤로">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="ttl" id="title">오답 몬스터</div>
    <div id="barExtra"></div>
  </header>
  <main class="view" id="view"></main>
</div>
<div class="flash" id="flash"></div>

<script>

/* ═══════════════════════════════════════════════════════════
   단원 메타 — QUESTIONS 의 unit / era 값이 여기에 대응한다
   ═══════════════════════════════════════════════════════════ */
const UNITS=[
 {id:"s1",no:"01-1",name:"20세기 전반의 세계",book:"10~11쪽",era:"세계대전의 소용돌이"},
 {id:"s2",no:"01-2",name:"무단 통치와 수탈 체제",book:"12~13쪽",era:"칼을 찬 교사의 시대"},
 {id:"s3",no:"01-3",name:"민족 분열 통치와 경제 수탈",book:"14~15쪽",era:"가면을 쓴 통치"},
 {id:"s4",no:"01-4",name:"민족 말살 통치와 전시 동원",book:"16~19쪽",era:"이름을 빼앗긴 시대"},
 {id:"s5",no:"02-1",name:"1910년대 국내외 독립운동",book:"20~21쪽",era:"국경을 넘은 사람들"},
 {id:"s6",no:"02-2",name:"3·1 운동",book:"22~25쪽",era:"만세의 봄"},
 {id:"s7",no:"02-3",name:"대한민국 임시 정부",book:"26~29쪽",era:"황제의 나라에서 국민의 나라로"},
 {id:"s8",no:"03-1",name:"무장 독립 전쟁",book:"30~33쪽",era:"봉오동에서 대전자령까지"}
];

/* 문제 데이터 — 이 배열만 갈아 끼우면 범위를 바꿀 수 있다 */
const QUESTIONS=[

{id:"s1-ox00",unit:"s1",type:"ox",question:"파리 강화 회의는 윌슨의 14개조 평화 원칙을 토대로 열렸다.",choices:["O","X"],answer:0,explain:"맞다. 그중 민족 자결주의가 3·1 운동의 국제적 배경이 된다.",era:"세계대전의 소용돌이"},
{id:"s1-ox01",unit:"s1",type:"ox",question:"제1차 세계 대전은 사라예보 사건을 계기로 일어났다.",choices:["O","X"],answer:0,explain:"맞다. 오스트리아·헝가리 제국 황태자 부부가 암살된 사건이다.",era:"세계대전의 소용돌이"},
{id:"s1-ox02",unit:"s1",type:"ox",question:"일본은 루거우차오 사건을 빌미로 아시아·태평양 전쟁을 일으켰다.",choices:["O","X"],answer:1,explain:"루거우차오 사건 → 중일 전쟁(1937). 아시아·태평양 전쟁(1941)의 계기는 진주만 기습이다.",era:"세계대전의 소용돌이"},
{id:"s1-ox03",unit:"s1",type:"ox",question:"대공황 이후 이탈리아·독일·일본에서는 전체주의가 확산되었다.",choices:["O","X"],answer:0,explain:"맞다. 경제 기반이 빈약해 뉴딜이나 블록 경제 같은 대응이 어려웠고, 침략 전쟁으로 위기를 넘으려 했다.",era:"세계대전의 소용돌이"},
{id:"s2-ox04",unit:"s2",type:"ox",question:"조선 총독은 일왕에게 직속되어 일본 의회나 내각의 통제를 거의 받지 않았다.",choices:["O","X"],answer:0,explain:"맞다. 입법·사법·행정권에 군사권까지 한 손에 쥐고 있었다.",era:"칼을 찬 교사의 시대"},
{id:"s2-ox05",unit:"s2",type:"ox",question:"중추원은 한국인의 의견을 대변하는 의결 기구였다.",choices:["O","X"],answer:1,explain:"총독의 자문 기구에 불과했고 친일파로 구성되어 3·1 운동 전까지 한 번도 소집되지 않았다.",era:"칼을 찬 교사의 시대"},
{id:"s2-ox06",unit:"s2",type:"ox",question:"헌병 경찰은 정식 재판 없이 즉결 심판권을 행사할 수 있었다.",choices:["O","X"],answer:0,explain:"맞다. 구류·벌금은 물론 태형까지 재판 없이 집행했다.",era:"칼을 찬 교사의 시대"},
{id:"s2-ox07",unit:"s2",type:"ox",question:"조선 태형령은 한국인과 일본인 모두에게 적용되었다.",choices:["O","X"],answer:1,explain:"제13조에 본령은 조선인에 한하여 적용한다고 못 박혀 있다.",era:"칼을 찬 교사의 시대"},
{id:"s2-ox08",unit:"s2",type:"ox",question:"토지 조사 사업은 기간 안에 신고해야 소유권을 인정받는 방식이었다.",choices:["O","X"],answer:0,explain:"맞다. 절차가 복잡해 신고를 놓친 땅과 국공유지를 총독부가 차지했다.",era:"칼을 찬 교사의 시대"},
{id:"s2-ox09",unit:"s2",type:"ox",question:"1910년대 회사령은 회사 설립을 신고제로 운영했다.",choices:["O","X"],answer:1,explain:"허가제다. 신고제로 바뀐 건 1920년 회사령 폐지 때이고, 그것도 일본 기업의 진출을 돕기 위해서였다.",era:"칼을 찬 교사의 시대"},
{id:"s2-ox10",unit:"s2",type:"ox",question:"토지 조사 사업으로 총독부가 차지한 땅은 동양 척식 주식회사나 일본인에게 넘어갔다.",choices:["O","X"],answer:0,explain:"맞다. 그것도 헐값에 넘겼다.",era:"칼을 찬 교사의 시대"},
{id:"s3-ox11",unit:"s3",type:"ox",question:"문화 정치 시기에 문관 총독이 여러 명 임명되었다.",choices:["O","X"],answer:1,explain:"관제만 고쳤을 뿐 문관 총독은 단 한 명도 임명되지 않았다. 문화 정치가 기만적이라는 대표 근거다.",era:"가면을 쓴 통치"},
{id:"s3-ox12",unit:"s3",type:"ox",question:"보통 경찰제로 바뀌면서 경찰 인원과 관서 수가 줄어들었다.",choices:["O","X"],answer:1,explain:"오히려 대폭 늘어났다. 이름만 바꾸고 감시는 더 촘촘해졌다.",era:"가면을 쓴 통치"},
{id:"s3-ox13",unit:"s3",type:"ox",question:"치안 유지법은 사유 재산 제도를 부인하는 결사를 처벌 대상으로 삼았다.",choices:["O","X"],answer:0,explain:"맞다. 그래서 사회주의자 탄압에 특히 많이 쓰였다.",era:"가면을 쓴 통치"},
{id:"s3-ox14",unit:"s3",type:"ox",question:"도 평의회와 부·면 협의회는 의결권을 가진 자치 기구였다.",choices:["O","X"],answer:1,explain:"의결권이 없는 자문 기구였다. 지방 행정 참여는 선전에 불과했다.",era:"가면을 쓴 통치"},
{id:"s3-ox15",unit:"s3",type:"ox",question:"산미 증식 계획으로 쌀 생산량은 늘었지만 한국의 식량 사정은 오히려 나빠졌다.",choices:["O","X"],answer:0,explain:"맞다. 생산은 목표에 못 미쳤는데 반출은 예정대로 진행됐기 때문이다.",era:"가면을 쓴 통치"},
{id:"s3-ox16",unit:"s3",type:"ox",question:"산미 증식 계획의 증산 비용은 총독부가 부담했다.",choices:["O","X"],answer:1,explain:"비료 대금·수리 조합비가 농민에게 전가되어 자작농이 소작농·화전민·토막민으로 몰락했다.",era:"가면을 쓴 통치"},
{id:"s3-ox17",unit:"s3",type:"ox",question:"1923년 일본 상품에 대한 관세가 대부분 폐지되면서 한국인 기업이 타격을 입었다.",choices:["O","X"],answer:0,explain:"맞다. 회사령 폐지로 한국인 기업이 늘긴 했지만 대부분 영세해서 값싼 일본 제품을 당해내지 못했다.",era:"가면을 쓴 통치"},
{id:"s4-ox18",unit:"s4",type:"ox",question:"내선일체는 일본인과 한국인이 같은 조상에서 나왔다는 주장이다.",choices:["O","X"],answer:1,explain:"그건 일선동조론이다. 내선일체는 내지(일본)와 한국이 한몸이라는 뜻이다.",era:"이름을 빼앗긴 시대"},
{id:"s4-ox19",unit:"s4",type:"ox",question:"황국 신민 서사는 매일 아침 궁성 요배와 함께 강요되었다.",choices:["O","X"],answer:0,explain:"맞다. 신사 참배까지 세트로 강요했고, 거부하면 처벌하고 학교도 폐쇄했다.",era:"이름을 빼앗긴 시대"},
{id:"s4-ox20",unit:"s4",type:"ox",question:"일제는 소학교의 명칭을 국민학교로 바꾸었다.",choices:["O","X"],answer:0,explain:"맞다. 황국 신민의 학교라는 뜻이다.",era:"이름을 빼앗긴 시대"},
{id:"s4-ox21",unit:"s4",type:"ox",question:"남면북양 정책은 남부에서 양을 기르고 북부에서 면화를 재배하게 한 것이다.",choices:["O","X"],answer:1,explain:"반대다. 남부에서 면화, 북부에서 양. 이름 순서 그대로다.",era:"이름을 빼앗긴 시대"},
{id:"s4-ox22",unit:"s4",type:"ox",question:"식민지 공업화로 세워진 중화학 공업 공장은 주로 북부 지방에 몰렸다.",choices:["O","X"],answer:0,explain:"맞다. 석탄·철 등 지하자원이 풍부해서다. 그 결과 지역 간 산업 불균형이 심해졌다.",era:"이름을 빼앗긴 시대"},
{id:"s4-ox23",unit:"s4",type:"ox",question:"국가 총동원법은 중일 전쟁을 일으킨 뒤 공포되었다.",choices:["O","X"],answer:0,explain:"맞다. 1937년 중일 전쟁 → 1938년 국가 총동원법. 이 법이 징용·징병·공출의 근거가 된다.",era:"이름을 빼앗긴 시대"},
{id:"s4-ox24",unit:"s4",type:"ox",question:"조선어 학회 사건은 치안 유지법 위반을 적용해 이루어졌다.",choices:["O","X"],answer:0,explain:"맞다. 1942년, 우리말 연구를 독립운동으로 몰아 회원들을 구속했다.",era:"이름을 빼앗긴 시대"},
{id:"s5-ox25",unit:"s5",type:"ox",question:"독립 의군부는 민주 공화제 국가 건설을 목표로 하였다.",choices:["O","X"],answer:1,explain:"독립 의군부는 복벽주의(고종 복위). 대한 광복회가 민주 공화제다. 교과서가 가장 자주 묻는 대비다.",era:"국경을 넘은 사람들"},
{id:"s5-ox26",unit:"s5",type:"ox",question:"대한 광복회는 박상진 등이 주도하였다.",choices:["O","X"],answer:0,explain:"맞다. 친일파를 처단하고 만주에 무관 학교를 세우려 했다.",era:"국경을 넘은 사람들"},
{id:"s5-ox27",unit:"s5",type:"ox",question:"경학사와 신흥 강습소는 북간도에 세워졌다.",choices:["O","X"],answer:1,explain:"서간도 삼원보다. 북간도는 간민회·명동 학교·중광단이다.",era:"국경을 넘은 사람들"},
{id:"s5-ox28",unit:"s5",type:"ox",question:"중광단은 이후 북로 군정서로 발전하였다.",choices:["O","X"],answer:0,explain:"맞다. 서일 등 대종교 간부들이 만들었고, 청산리에서 김좌진이 이끄는 그 부대가 된다.",era:"국경을 넘은 사람들"},
{id:"s5-ox29",unit:"s5",type:"ox",question:"권업회와 신한촌은 연해주에서 조직되고 건설되었다.",choices:["O","X"],answer:0,explain:"맞다. 이후 이상설·이동휘를 정·부통령으로 한 대한 광복군 정부가 세워진다.",era:"국경을 넘은 사람들"},
{id:"s5-ox30",unit:"s5",type:"ox",question:"대동단결 선언은 국민 주권론의 입장에서 발표되었다.",choices:["O","X"],answer:0,explain:"맞다. 1917년, 임시 정부 수립의 이론적 바탕이 되었다.",era:"국경을 넘은 사람들"},
{id:"s6-ox31",unit:"s6",type:"ox",question:"3·1 운동은 순종의 국장일에 즈음하여 계획되었다.",choices:["O","X"],answer:1,explain:"고종의 국장일이다. 순종의 장례일에 일어난 건 6·10 만세 운동(1926).",era:"만세의 봄"},
{id:"s6-ox32",unit:"s6",type:"ox",question:"민족 대표는 탑골 공원에서 독립 선언식을 거행하였다.",choices:["O","X"],answer:1,explain:"시위가 과격해질 것을 우려해 태화관에서 했다. 탑골 공원에서는 학생과 시민이 선언서를 낭독했다.",era:"만세의 봄"},
{id:"s6-ox33",unit:"s6",type:"ox",question:"2·8 독립 선언은 도쿄에서 유학생들이 발표하였다.",choices:["O","X"],answer:0,explain:"맞다. 조선 청년 독립단 이름으로 발표했고 3·1 운동의 직접적 계기가 되었다.",era:"만세의 봄"},
{id:"s6-ox34",unit:"s6",type:"ox",question:"3·1 운동은 처음부터 끝까지 평화적인 만세 시위로만 전개되었다.",choices:["O","X"],answer:1,explain:"헌병 경찰의 무자비한 진압에 무력 투쟁으로 발전했다. 일부 농민은 경찰 관서와 헌병대를 습격했다.",era:"만세의 봄"},
{id:"s6-ox35",unit:"s6",type:"ox",question:"3·1 운동은 중국의 5·4 운동에 영향을 주었다.",choices:["O","X"],answer:0,explain:"맞다. 대표적인 반제국주의 민족 운동으로 세계사적 의의를 갖는다.",era:"만세의 봄"},
{id:"s6-ox36",unit:"s6",type:"ox",question:"제암리 학살은 경기도 화성에서 일어났다.",choices:["O","X"],answer:0,explain:"맞다. 주민을 교회에 모아 놓고 문을 잠근 채 총을 쏘고 불을 질렀다.",era:"만세의 봄"},
{id:"s7-ox37",unit:"s7",type:"ox",question:"대한민국 임시 정부는 삼권 분립에 기초한 민주 공화제를 채택하였다.",choices:["O","X"],answer:0,explain:"맞다. 임시 의정원(입법)·국무원(행정)·법원(사법). 우리 역사상 최초다.",era:"황제의 나라에서 국민의 나라로"},
{id:"s7-ox38",unit:"s7",type:"ox",question:"임시 정부 통합 과정에서 무장 투쟁에 유리한 간도에 정부를 두기로 하였다.",choices:["O","X"],answer:1,explain:"상하이로 정했다. 조계 지역이 많아 외교 활동에 유리했기 때문이다.",era:"황제의 나라에서 국민의 나라로"},
{id:"s7-ox39",unit:"s7",type:"ox",question:"연통제는 국내에 설치된 비밀 행정 조직이었다.",choices:["O","X"],answer:0,explain:"맞다. 군자금 조달과 문서·명령 전달을 맡았다. 통신 기관은 교통국이다.",era:"황제의 나라에서 국민의 나라로"},
{id:"s7-ox40",unit:"s7",type:"ox",question:"구미 위원부는 상하이에 설치되었다.",choices:["O","X"],answer:1,explain:"미국에 설치했다. 이승만을 중심으로 외교 활동을 벌였다.",era:"황제의 나라에서 국민의 나라로"},
{id:"s7-ox41",unit:"s7",type:"ox",question:"국민 대표 회의는 개조파와 창조파의 대립으로 결렬되었다.",choices:["O","X"],answer:0,explain:"맞다. 이후 많은 독립운동가가 이탈해 임시 정부가 침체에 빠진다.",era:"황제의 나라에서 국민의 나라로"},
{id:"s7-ox42",unit:"s7",type:"ox",question:"이승만이 탄핵된 뒤 제2대 대통령이 된 인물은 박은식이다.",choices:["O","X"],answer:0,explain:"맞다. 이어서 헌법을 고쳐 국무령 중심의 집단 지도 체제로 바꾸었다.",era:"황제의 나라에서 국민의 나라로"},
{id:"s8-ox43",unit:"s8",type:"ox",question:"봉오동 전투는 김좌진이 지휘하였다.",choices:["O","X"],answer:1,explain:"봉오동은 홍범도(+안무·최진동), 청산리가 김좌진(+홍범도)이다. 봉-홍, 청-김.",era:"봉오동에서 대전자령까지"},

/* ── 저장 ── */
function today(){var d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);}
function blank(){return{monsters:{},unit:{},correct:0,total:0,streak:0,last:0,best:{ox:0},played:0};}
var S;
function load(){
  try{var r=localStorage.getItem(KEY);S=r?Object.assign(blank(),JSON.parse(r)):blank();}catch(e){S=blank();}
  if(S.last&&S.last<today()-1)S.streak=0;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function markDay(){var t=today();if(S.last!==t){S.streak=(S.last===t-1)?S.streak+1:1;S.last=t;save();}}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}

function monCount(){return Object.keys(S.monsters).length;}
function monHit(id,ok){
  var m=S.monsters[id];
  if(ok){ if(m){ m.hp++; if(m.hp>=MON_KILL) delete S.monsters[id]; } }
  else { if(m) m.hp=0; else S.monsters[id]={hp:0,at:Date.now()}; }
}

function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

                :'<path d="M38 68q12 10 24 0" stroke="#14101A" stroke-width="3.5" fill="none" stroke-linecap="round"/>';

var view=document.getElementById("view"),titleEl=document.getElementById("title"),

var stack=[];
function go(name,arg,replace){
  stopAll();
  if(replace){ stack[stack.length-1]={n:name,a:arg}; }
  else { stack.push({n:name,a:arg}); try{history.pushState({i:stack.length},"");}catch(e){} }
  render();
}
function back(){
  if(stack.length<=1)return;
  stopAll(); stack.pop(); render();
}
window.addEventListener("popstate",function(){ if(stack.length>1){stopAll();stack.pop();render();}
  else{try{history.pushState({i:1},"");}catch(e){}} });
function render(){
  var s=stack[stack.length-1];
  backEl.classList.toggle("hidden",stack.length<=1);
  extraEl.innerHTML="";
  view.scrollTop=0; window.scrollTo(0,0);
  ({home:vHome,units:vUnits,play:vPlay,result:vResult,monsters:vMonsters}[s.n])(s.a);
}
backEl.onclick=back;

/* ── 문제 뽑기: 몬스터 우선, 같은 사실은 한 판에 한 번만 ── */
function stem(id){var p=id.split("-");return p[0]+"-"+p[1];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pool(type,unit){
  return QUESTIONS.filter(function(q){
    return q.type===type && (!unit||q.unit===unit);
  });
}
function buildRound(type,unit,n){
  var p=pool(type,unit),mine=[],rest=[],seen={},out=[];
  p.forEach(function(q){ (S.monsters[q.id]?mine:rest).push(q); });
  /* 몬스터는 우선 복습 대상이라 같은 사실이 겹쳐도 넣는다 */
  shuffle(mine).forEach(function(q){ if(out.length<n){ out.push(q); seen[stem(q.id)]=1; } });
  /* 나머지는 한 판에 같은 사실이 두 번 나오지 않게 거른다 */
  var restS=shuffle(rest);
  restS.forEach(function(q){ var k=stem(q.id); if(out.length<n&&!seen[k]){ seen[k]=1; out.push(q); } });
  /* 그래도 모자라면 남은 것으로 채운다 */
  for(var j=0;j<restS.length&&out.length<n;j++) if(out.indexOf(restS[j])<0) out.push(restS[j]);
  return out;
}

/* ═══════════ 플레이 ═══════════ */
var G=null,tickTimer=null,advTimer=null;
function stopAll(){
  if(tickTimer){clearInterval(tickTimer);tickTimer=null;}
  if(advTimer){clearTimeout(advTimer);advTimer=null;}
  speakStop();
}
var MODE_TITLE={ox:"스피드 O·X",mc:"4지선다",order:"연표 세우기",hunt:"몬스터 사냥",listen:"듣기 모드"};

function vPlay(a){
  if(!G||G.key!==JSON.stringify(a)){
    var q;
    if(a.mode==="ox")        q=buildRound("ox",null,60);
    else if(a.mode==="mc")   q=buildRound("mc",a.unit||null,GOAL);
    else if(a.mode==="order")q=buildRound("order",null,5);
    else if(a.mode==="listen")q=shuffle(QUESTIONS.filter(function(x){return x.type!=="order";})).slice(0,40);
    else { /* hunt */
      var ids=Object.keys(S.monsters);
      q=shuffle(ids.map(function(i){return QMAP[i];}).filter(Boolean));
    }
    G={key:JSON.stringify(a),mode:a.mode,unit:a.unit,queue:q,i:0,score:0,combo:0,maxCombo:0,
       ok:0,log:[],left:OX_TIME,done:false,answered:false};
  }
  titleEl.textContent=MODE_TITLE[G.mode]+(G.unit?" · "+UMAP[G.unit].name:"");
  if(!G.queue.length){
    view.innerHTML='<div class="empty">'+monsterSVG("none",80,"weak")+
      '<p>지금 풀 수 있는 문제가 없어요.<br>다른 모드를 골라 보세요.</p></div>';
    return;
  }
  if(G.mode==="listen")return vListen();
  if(G.mode==="ox"&&!tickTimer)startClock();
  paintQ();
}

function startClock(){
  G.left=OX_TIME;
  tickTimer=setInterval(function(){
    G.left--;
    var t=document.getElementById("clock");
    if(t){t.textContent=G.left+"초";t.classList.toggle("warn",G.left<=10);}
    if(G.left<=0){clearInterval(tickTimer);tickTimer=null;finish();}
  },1000);
}

function hud(){
  if(G.mode==="ox")
    return '<div class="hud"><span class="timer'+(G.left<=10?' warn':'')+'" id="clock">'+G.left+'초</span>'+
      (G.combo>=2?'<span class="combo">'+ICON.fire+' '+G.combo+'연속</span>':'')+
      '<span style="flex:1"></span><span class="score">'+G.score+'</span></div>';
  var pct=Math.round(G.i/G.queue.length*100);
  return '<div class="hud"><span class="timer">'+(G.i+1)+' / '+G.queue.length+'</span>'+
    '<span class="track"><i style="width:'+pct+'%"></i></span>'+
    (G.combo>=2?'<span class="combo">'+ICON.fire+' '+G.combo+'</span>':'')+'</div>';
}
function qmeta(q){
  var u=UMAP[q.unit];
  return '<div class="qmeta"><span class="era">'+esc(q.era)+'</span><span>'+(u?u.no:"")+'</span>'+
    (S.monsters[q.id]?'<span class="mob">'+monsterSVG(q.id,19)+' 몬스터</span>':'')+'</div>';
}

function paintQ(){
  var q=G.queue[G.i];
  G.answered=false;
  if(q.type==="order")return paintOrder(q);
  var isOX=q.type==="ox";
  view.innerHTML=hud()+
    '<div class="qcard">'+qmeta(q)+
      '<div class="qtext'+(isOX&&q.question.length<40?' big':'')+'">'+esc(q.question)+'</div></div>'+
    (isOX
      ? '<div class="ox2" id="ansBox"><button class="oxb o" data-i="0">O</button><button class="oxb x" data-i="1">X</button></div>'
      : '<div class="answers" id="ansBox">'+q.choices.map(function(c,i){
          return '<button class="ans" data-i="'+i+'"><span class="kx">'+"ABCD".charAt(i)+'</span><span>'+esc(c)+'</span></button>';
        }).join("")+'</div>')+
    '<div id="fbBox"></div><div class="grow"></div>';
  Array.prototype.forEach.call(view.querySelectorAll("#ansBox button"),function(b){
    b.onclick=function(){choose(+b.dataset.i,b);};
  });
}

function choose(idx,btn){
  if(G.answered)return; G.answered=true;
  var q=G.queue[G.i],ok=idx===q.answer;
  var box=document.getElementById("ansBox");
  Array.prototype.forEach.call(box.children,function(b,i){
    b.disabled=true;
    if(i===q.answer)b.classList.add("ok");
    else if(b===btn)b.classList.add("no");
    else b.classList.add("dim");
  });
  grade(q,ok);
  if(G.mode==="ox"){
    /* 속도 모드는 해설을 붙잡지 않는다. 복습은 결과 화면에서 */
    advTimer=setTimeout(next,ok?520:900);
  }else{
    document.getElementById("fbBox").innerHTML=
      '<div class="fb '+(ok?"ok":"no")+'"><span class="em">'+(ok?"○":"×")+'</span><span>'+esc(q.explain)+'</span></div>'+
      '<div class="sticky"><button class="btn" id="nx">'+(G.i+1>=G.queue.length?"결과 보기":"다음")+'</button></div>';
    var nx=document.getElementById("nx"); nx.onclick=next; nx.focus({preventScroll:true});
  }
}

function grade(q,ok){
  markDay();
  G.log.push({id:q.id,ok:ok});
  if(ok){
    G.ok++; G.combo++; if(G.combo>G.maxCombo)G.maxCombo=G.combo;
    if(G.mode==="ox"){
      var gain=Math.round((40+G.left*2)*(1+Math.min(G.combo,10)*0.15));
      G.score+=gain; pop("+"+gain);
    }
    buzz(18); flash("rgba(53,214,160,.28)");
  }else{
    G.combo=0; buzz([25,45,25]); flash("rgba(255,78,99,.3)");
  }
  monHit(q.id,ok);
  S.total++; if(ok)S.correct++;
  var st=S.unit[q.unit]||[0,0]; st[0]++; if(ok)st[1]++; S.unit[q.unit]=st;
  save();
}
function next(){
  advTimer=null;
  if(G.mode==="ox"){ G.i=(G.i+1)%G.queue.length; if(G.left>0){paintQ();return;} finish(); return; }
  G.i++;
  if(G.i>=G.queue.length)return finish();
  paintQ();
}
function finish(){ stopAll(); G.done=true; go("result",null,true); }

function pop(t){
  var e=document.createElement("div");e.className="pop";e.textContent=t;
  document.body.appendChild(e);setTimeout(function(){e.remove();},820);
}
function flash(c){
  var f=document.getElementById("flash");
  f.style.background="radial-gradient(60% 40% at 50% 45%,"+c+",transparent 72%)";
  f.classList.remove("go");void f.offsetWidth;f.classList.add("go");
}

/* ═══════════ 연표 세우기 ═══════════ */
function paintOrder(q){
  var correct=q.choices.slice();
  var cur=shuffle(correct);
  while(cur.join("|")===correct.join("|"))cur=shuffle(correct);   /* 처음부터 정답이면 다시 섞는다 */
  view.innerHTML=hud()+
    '<div class="qcard">'+qmeta(q)+'<div class="qtext">'+esc(q.question)+'</div>'+
      '<p class="note">이른 것이 위로 오게. 손잡이를 끌거나 오른쪽 화살표로 옮기세요. 연도는 채점할 때 공개돼요.</p></div>'+
    '<div class="tl" id="tl"></div><div id="fbBox"></div><div class="grow"></div>'+
    '<div class="sticky"><button class="btn" id="chk">맞춰 보기</button></div>';
  var tl=document.getElementById("tl");
  function draw(){
    tl.innerHTML=cur.map(function(c,i){
      var p=c.split("|");
      return '<div class="tlc" data-i="'+i+'"><span class="grip" data-g="'+i+'">'+ICON.grip+'</span>'+
        '<span class="ord">'+(i+1)+'</span><span class="nm">'+esc(p[1]||c)+'</span>'+
        '<span class="mv"><button data-up="'+i+'" aria-label="위로"'+(i===0?" disabled":"")+'>'+ICON.up+'</button>'+
        '<button data-dn="'+i+'" aria-label="아래로"'+(i===cur.length-1?" disabled":"")+'>'+ICON.down+'</button></span></div>';
    }).join("");
    Array.prototype.forEach.call(tl.querySelectorAll("[data-up]"),function(b){
      b.onclick=function(){var i=+b.dataset.up;swap(i,i-1);};});
    Array.prototype.forEach.call(tl.querySelectorAll("[data-dn]"),function(b){
      b.onclick=function(){var i=+b.dataset.dn;swap(i,i+1);};});
    Array.prototype.forEach.call(tl.querySelectorAll(".grip"),function(g){
      g.addEventListener("pointerdown",startDrag);});
  }
  function swap(a,b){
    if(b<0||b>=cur.length)return;
    var t=cur[a];cur[a]=cur[b];cur[b]=t;buzz(10);draw();
  }
  /* 포인터 기반 드래그 — HTML5 drag&drop 은 터치에서 동작하지 않는다 */
  var drag=null;
  function startDrag(ev){
    if(G.answered)return;
    ev.preventDefault();
    var cards=Array.prototype.slice.call(tl.children);
    var idx=+ev.currentTarget.dataset.g,el=cards[idx];
    var hs=cards.map(function(c){return c.offsetHeight;});
    var gap=8,tops=[],acc=0;
    hs.forEach(function(h){tops.push(acc);acc+=h+gap;});
    drag={idx:idx,at:idx,el:el,cards:cards,hs:hs,tops:tops,gap:gap,y0:ev.clientY};
    el.classList.add("drag");
    el.setPointerCapture(ev.pointerId);
    el.addEventListener("pointermove",moveDrag);
    el.addEventListener("pointerup",endDrag);
    el.addEventListener("pointercancel",endDrag);
  }
  function moveDrag(ev){
    if(!drag)return;
    var dy=ev.clientY-drag.y0;
    drag.el.style.transform="translateY("+dy+"px)";
    var center=drag.tops[drag.idx]+drag.hs[drag.idx]/2+dy;
    var at=0;
    for(var i=0;i<drag.tops.length;i++)
      if(center>drag.tops[i]+drag.hs[i]/2) at=Math.min(i+1,drag.tops.length-1);
    if(at!==drag.at){drag.at=at;buzz(8);layout();}
  }
  function layout(){
    var seq=[];
    for(var i=0;i<drag.cards.length;i++) if(i!==drag.idx) seq.push(i);
    seq.splice(drag.at,0,drag.idx);
    var acc=0,pos={};
    seq.forEach(function(i){pos[i]=acc;acc+=drag.hs[i]+drag.gap;});
    drag.cards.forEach(function(c,i){
      if(i===drag.idx)return;
      c.style.transform="translateY("+(pos[i]-drag.tops[i])+"px)";
    });
  }
  function endDrag(){
    if(!drag)return;
    var from=drag.idx,to=drag.at;
    drag.cards.forEach(function(c){c.style.transform="";c.classList.remove("drag");});
    drag=null;
    if(from!==to){var it=cur.splice(from,1)[0];cur.splice(to,0,it);buzz(14);}
    draw();
  }
  draw();
  document.getElementById("chk").onclick=function(){
    if(G.answered)return; G.answered=true;
    var ok=cur.join("|")===correct.join("|");
    grade(q,ok);
    tl.innerHTML=correct.map(function(c,i){
      var p=c.split("|"),right=cur[i]===c;
      return '<div class="tlc '+(right?"ok":"no")+'"><span class="yr">'+esc(p[0])+'</span>'+
        '<span class="nm">'+esc(p[1]||"")+'</span></div>';
    }).join("");
    document.getElementById("fbBox").innerHTML=
      '<div class="fb '+(ok?"ok":"no")+'"><span class="em">'+(ok?"○":"×")+'</span><span>'+
      (ok?"순서 완벽해요! ":"")+esc(q.explain)+'</span></div>';
    var s=view.querySelector(".sticky");
    s.innerHTML='<button class="btn" id="nx">'+(G.i+1>=G.queue.length?"결과 보기":"다음")+'</button>';
    document.getElementById("nx").onclick=next;
  };
}

/* ═══════════ 듣기 모드 ═══════════
   iOS 는 사용자 제스처 없이 다음 문장을 이어 읽지 못하고 화면이 꺼지면 멈춘다.
   그래서 시작 버튼을 한 번 누르면 그 세션 동안 onend 로 체인을 이어 간다.       */
var SP=window.speechSynthesis,voiceKO=null,speaking=false;
function pickVoice(){
  if(!SP)return;
  var vs=SP.getVoices()||[];
  voiceKO=vs.filter(function(v){return /^ko/i.test(v.lang);})[0]||null;
}
if(SP){pickVoice();SP.onvoiceschanged=pickVoice;}
function speakStop(){ speaking=false; try{ if(SP)SP.cancel(); }catch(e){} }
function say(text,rate,done){
  if(!SP){done&&done();return;}
  var u=new SpeechSynthesisUtterance(text);
  u.lang="ko-KR"; u.rate=rate||1; u.pitch=1;
  if(voiceKO)u.voice=voiceKO;
  u.onend=function(){ if(speaking)done&&done(); };
  u.onerror=function(){ if(speaking)done&&done(); };
  try{SP.speak(u);}catch(e){done&&done();}
}
function vListen(){
  if(!SP){
    view.innerHTML='<div class="empty">'+monsterSVG("nospeech",80,"weak")+
      '<p>이 브라우저는 음성 읽기를 지원하지 않아요.<br>다른 모드를 이용해 주세요.</p></div>'+
      '<div class="sticky"><button class="btn ghost" id="hm">홈으로</button></div>';
    document.getElementById("hm").onclick=back; return;
  }
  var q=G.queue[G.i];
  view.innerHTML=
    '<div class="hud"><span class="timer">'+(G.i+1)+' / '+G.queue.length+'</span>'+
      '<span class="track"><i style="width:'+Math.round(G.i/G.queue.length*100)+'%"></i></span></div>'+
    '<div class="listen"><div class="wave'+(speaking?" on":"")+'" id="wave">'+
      '<i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>'+
      '<p class="note" id="phase" style="text-align:center">'+
      (speaking?"읽는 중":"시작을 누르면 문제와 정답을 이어서 읽어 줘요")+'</p></div>'+
    '<div class="qcard">'+qmeta(q)+'<div class="qtext">'+esc(q.question)+'</div>'+
      '<div id="revealBox"></div></div>'+
    (voiceKO?'':'<p class="note" style="margin-top:12px">이 기기에 한국어 음성이 없어 발음이 어색할 수 있어요.</p>')+
    '<p class="note" style="margin-top:12px">화면이 꺼지면 읽기가 멈춰요. 화면 자동 잠금을 잠시 꺼 두면 편해요.</p>'+
    '<div class="grow"></div>'+
    '<div class="sticky"><div class="btnrow">'+
      '<button class="btn ghost" id="skip">건너뛰기</button>'+
      '<button class="btn" id="tog">'+(speaking?"멈춤":"시작")+'</button></div></div>';
  document.getElementById("tog").onclick=function(){
    if(speaking){ speakStop(); vListen(); } else { speaking=true; runListen(); }
  };
  document.getElementById("skip").onclick=function(){
    speakStop(); G.i=(G.i+1)%G.queue.length; vListen();
  };
}
function runListen(){
  var q=G.queue[G.i];
  vListen();
  var ansTx=q.type==="ox"?("정답은, "+(q.answer===0?"오":"엑스")):("정답은, "+q.choices[q.answer]);
  say(q.question,1,function(){
    if(!speaking)return;
    var ph=document.getElementById("phase"),rb=document.getElementById("revealBox");
    if(ph)ph.textContent="정답 공개";
    if(rb)rb.innerHTML='<div class="fb ok" style="margin-top:12px"><span class="em">○</span><span><b>'+
      esc(q.type==="ox"?(q.answer===0?"O":"X"):q.choices[q.answer])+'</b><br>'+esc(q.explain)+'</span></div>';
    setTimeout(function(){
      if(!speaking)return;
      say(ansTx+". "+q.explain,1,function(){
        if(!speaking)return;
        markDay();
        setTimeout(function(){
          if(!speaking)return;
          G.i=(G.i+1)%G.queue.length;
          runListen();
        },700);
      });
    },1600);
  });
}

/* ═══════════ 결과 ═══════════ */
function vResult(){
  titleEl.textContent="결과";
  var n=G.log.length,ok=G.ok,rate=n?Math.round(ok/n*100):0;
  var killed=G.log.filter(function(l){return l.ok&&!S.monsters[l.id];}).length;
  var born=G.log.filter(function(l){return !l.ok;}).length;
  var isOX=G.mode==="ox";
  if(isOX&&G.score>(S.best.ox||0)){S.best.ox=G.score;save();}
  var head=isOX
    ? '<div class="big">'+G.score+'</div><div class="sub">점 · 최고 '+(S.best.ox||0)+'점</div>'
    : '<div class="big">'+rate+'<span style="font-size:34px">%</span></div><div class="sub">'+n+'문제 중 '+ok+'개 정답</div>';
  var wrong=G.log.filter(function(l){return !l.ok;});
  view.innerHTML=
    '<div class="result">'+head+'</div>'+
    '<div class="rgrid">'+stat(ok+" / "+n,"정답")+stat(G.maxCombo,"최고 콤보")+
      stat(monCount(),"남은 몬스터")+'</div>'+
    (born?'<div class="sect">새로 생긴 몬스터 '+born+'마리</div>'+
      '<div class="rlist">'+wrong.map(function(l){
        var q=QMAP[l.id];
        return '<div class="rrow"><span class="dot no"></span><span>'+esc(q.question.slice(0,70))+
          (q.question.length>70?"…":"")+'<small>'+esc(q.explain)+'</small></span></div>';
      }).join("")+'</div>':
      '<div class="sect">완벽</div><p class="note">틀린 문제가 없어요. 새 몬스터도 없습니다.</p>')+
    '<div class="sticky"><div class="btnrow">'+
      '<button class="btn ghost" id="home">홈으로</button>'+
      '<button class="btn" id="again">한 판 더</button></div></div>';
  document.getElementById("home").onclick=function(){stack=[{n:"home"}];render();};
  document.getElementById("again").onclick=function(){
    var m=G.mode,u=G.unit;G=null;go("play",{mode:m,unit:u},true);
  };
}
