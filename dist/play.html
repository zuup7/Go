<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Family Go!</title>
<meta name="description" content="가족을 만들고, 인생을 선택하며, 세대를 이어가는 나만의 이야기를 만들어보세요." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A1%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" />
<style>
/* Family Go! — 가족 이야기책 같은 따뜻한 톤 */

/* 팔레트: 종이(--bg) 위의 잉크(--ink), 저녁 햇살(--accent), 계절을 나타내는 보조색 */
:root {
  --bg: #fbf6ef;
  --bg-soft: #f4ece1;
  --card: #ffffff;
  --ink: #3d3229;
  --ink-soft: #7d7166;
  --line: #e7dccd;
  --accent: #d97a49;
  --accent-soft: #f7d9c6;
  --green: #6fa86f;
  --blue: #6f92b8;
  --pink: #d97f96;
  --violet: #a97fbd;
  --gold: #d8a94a;
  --bad: #c05f5f;
  --good-bg: #e9f3e6;
  --bad-bg: #f7e8e6;
  --shadow: 0 6px 20px rgba(96, 74, 55, 0.09);

  --font-display: 'Gowun Batang', 'Apple SD Gothic Neo', 'Noto Serif KR', serif;
  --font-body: 'Gowun Dodum', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  --radius: 18px;
}

/* 다크: OS 설정만 있는 기본 상태 (명시적 라이트 선택은 이기지 못하도록 가드) */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #221d19;
    --bg-soft: #2b2521;
    --card: #302a25;
    --ink: #f2e9df;
    --ink-soft: #b6a798;
    --line: #453c34;
    --accent: #e2916a;
    --accent-soft: #4a382c;
    --green: #82b782;
    --blue: #86a6c9;
    --pink: #e194a8;
    --violet: #bb95cd;
    --gold: #e0b962;
    --bad: #d97b7b;
    --good-bg: #2f3a2c;
    --bad-bg: #3d2a29;
    --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
  }
}

/* 다크: 뷰어가 직접 고른 경우 */
:root[data-theme="dark"] {
  --bg: #221d19;
  --bg-soft: #2b2521;
  --card: #302a25;
  --ink: #f2e9df;
  --ink-soft: #b6a798;
  --line: #453c34;
  --accent: #e2916a;
  --accent-soft: #4a382c;
  --green: #82b782;
  --blue: #86a6c9;
  --pink: #e194a8;
  --violet: #bb95cd;
  --gold: #e0b962;
  --bad: #d97b7b;
  --good-bg: #2f3a2c;
  --bad-bg: #3d2a29;
  --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  line-height: 1.65;
  -webkit-text-size-adjust: 100%;
}

.app { max-width: 960px; margin: 0 auto; padding: 16px 16px 64px; }

h1, h2, h3 {
  margin: 0 0 8px;
  line-height: 1.3;
  font-family: var(--font-display);
  font-weight: 700;
  text-wrap: balance;
}
h1 { font-size: 1.9rem; letter-spacing: -.01em; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1.02rem; }
p { margin: 0 0 10px; }

button {
  font: inherit;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  border-radius: 12px;
  padding: 9px 14px;
  transition: transform .08s ease, background .15s ease, border-color .15s ease;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
button.ghost { background: transparent; }
button.wide { width: 100%; }

textarea {
  font: inherit; font-size: .8rem; padding: 10px 12px; border-radius: 12px; width: 100%;
  border: 1px solid var(--line); background: var(--bg-soft); color: var(--ink);
  resize: vertical; margin: 8px 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}

input, select {
  font: inherit; padding: 9px 12px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); width: 100%;
}

.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px;
}

/* ── 타이틀 ── */
.title-screen { text-align: center; padding: 24px 0; }
.title-screen .logo { font-size: 3.4rem; line-height: 1; }
.title-screen h1 { font-size: 2.4rem; letter-spacing: -.02em; }
.title-screen .tag { color: var(--ink-soft); margin-bottom: 20px; }
.form-grid { display: grid; gap: 12px; text-align: left; }
.form-grid label { font-size: .85rem; color: var(--ink-soft); display: block; margin-bottom: 4px; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pill-row { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  border-radius: 999px; padding: 7px 13px; font-size: .88rem;
  border: 1px solid var(--line); background: var(--card);
}
.pill.on { background: var(--accent-soft); border-color: var(--accent); font-weight: 700; }

/* ── 상단바 ── */
.topbar {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px; box-shadow: var(--shadow); margin-bottom: 14px;
}
.stat-chip { text-align: center; }
.stat-chip .k { font-size: .72rem; color: var(--ink-soft); display: block; }
.stat-chip .v { font-weight: 700; font-size: .98rem; font-variant-numeric: tabular-nums; }
.stat-chip .k { letter-spacing: .04em; }

/* ── 초상화 ── */
.portrait {
  position: relative;
  display: inline-grid;
  place-items: center;
  width: var(--portrait-size);
  height: var(--portrait-size);
  flex: 0 0 auto;
}
.portrait .avatar-svg {
  display: block;
  border-radius: 50%;
  background: var(--bg-soft);
  box-shadow: 0 0 0 3px var(--line), var(--shadow);
}
.portrait.female .avatar-svg { box-shadow: 0 0 0 3px var(--pink), var(--shadow); }
.portrait.male .avatar-svg { box-shadow: 0 0 0 3px var(--blue), var(--shadow); }
.portrait.gone .avatar-svg { filter: grayscale(1); opacity: .55; box-shadow: 0 0 0 3px var(--line); }
.portrait.plain .avatar-svg { box-shadow: none; }
.portrait-badge {
  position: absolute; top: -3px; right: -6px;
  font-size: calc(var(--portrait-size) * .3); line-height: 1;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,.2));
}
.portrait-age {
  position: absolute; bottom: -2px; left: -4px;
  background: var(--ink); color: var(--bg);
  border-radius: 999px; padding: 0 6px;
  font-size: calc(var(--portrait-size) * .19);
  font-weight: 700; font-variant-numeric: tabular-nums;
}

/* ── 캐릭터 카드 ── */
.hero { display: flex; gap: 16px; align-items: flex-start; }
.avatar {
  background: var(--bg-soft); border-radius: 50%; border: 2px solid var(--line);
  flex: 0 0 auto; display: grid; place-items: center; overflow: hidden;
}
.avatar-svg { display: block; }
.hero-info { flex: 1; min-width: 0; }
.name-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.name-line .name { font-size: 1.3rem; font-weight: 700; font-family: var(--font-display); }
.muted { color: var(--ink-soft); font-size: .85rem; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.badge {
  font-size: .78rem; padding: 3px 9px; border-radius: 999px;
  background: var(--bg-soft); border: 1px solid var(--line);
}
.badge.accent { background: var(--accent-soft); border-color: var(--accent); }

.bars { margin-top: 12px; display: grid; gap: 7px; }
.bar-row { display: grid; grid-template-columns: 46px 1fr 34px; gap: 8px; align-items: center; font-size: .8rem; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--bg-soft); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.bar.health > i { background: var(--green); }
.bar.intellect > i { background: var(--blue); }
.bar.charm > i { background: var(--pink); }
.bar.creativity > i { background: var(--violet); }
.bar.fitness > i { background: var(--gold); }
.bar.happy > i { background: linear-gradient(90deg, var(--gold), var(--pink)); }

/* ── 탭 ── */
.tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 4px; }
.tabs button { white-space: nowrap; border-radius: 999px; padding: 8px 14px; }
.tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }

/* ── 목록 ── */
.list { display: grid; gap: 10px; }
.item {
  display: flex; gap: 12px; align-items: center;
  border: 1px solid var(--line); border-radius: 14px; padding: 11px; background: var(--bg-soft);
}
.item .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item .t { font-weight: 700; display: block; }
.item .s { font-size: .82rem; color: var(--ink-soft); display: block; line-height: 1.45; }
.item .badge { display: inline-block; }
.item.locked { opacity: .55; }

.grid-2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }

.choice-grid { display: grid; gap: 8px; }
.choice {
  text-align: left; padding: 12px 14px; border-radius: 14px; width: 100%;
  border: 1px solid var(--line); background: var(--bg-soft);
}
.choice:hover:not(:disabled) { background: var(--accent-soft); }
.choice .c-sub { display: block; font-size: .78rem; color: var(--ink-soft); margin-top: 2px; }
.choice .c-sub:empty { display: none; }

.log { display: grid; gap: 6px; max-height: 340px; overflow-y: auto; }
.log-line { display: flex; gap: 9px; font-size: .87rem; padding: 6px 8px; border-radius: 10px; background: var(--bg-soft); }
.log-line .y { color: var(--ink-soft); flex: 0 0 40px; font-variant-numeric: tabular-nums; }
.log-line.good { background: var(--good-bg); }
.log-line.bad { background: var(--bad-bg); }

/* ── 가족 트리 ── */
.gen-block { margin-bottom: 14px; }
.gen-title { font-size: .8rem; color: var(--ink-soft); margin-bottom: 6px; letter-spacing: .05em; }
.people-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.units { display: flex; flex-wrap: wrap; gap: 12px; }
.unit {
  display: flex; align-items: center; gap: 2px;
  background: var(--bg-soft); border: 1px solid var(--line);
  border-radius: 18px; padding: 6px;
}
.unit .person-card { background: transparent; border: none; padding: 6px 8px; }
.unit .heart { font-size: 1.1rem; }
.person-card {
  background: var(--bg-soft); border: 1px solid var(--line); border-radius: 14px;
  padding: 10px; text-align: center;
}
.person-card.me { border-color: var(--accent); background: var(--accent-soft); }
.person-card.dead { opacity: .5; }
.person-card .pname { font-weight: 700; font-size: .9rem; margin-top: 4px; }
.person-card .pmeta { font-size: .75rem; color: var(--ink-soft); }

/* ── 모달 ── */
.modal-bg {
  position: fixed; inset: 0; background: rgba(40, 30, 22, .55);
  display: grid; place-items: center; padding: 16px; z-index: 50;
}
.modal {
  background: var(--card); border-radius: 20px; padding: 20px; max-width: 460px; width: 100%;
  box-shadow: 0 20px 50px rgba(0,0,0,.25); max-height: 88vh; overflow-y: auto;
}
.modal .icon { font-size: 2.4rem; }
.result-box {
  background: var(--bg-soft); border-radius: 14px; padding: 12px; margin: 12px 0;
  border-left: 4px solid var(--accent);
}
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px;
  font-size: .88rem; z-index: 80; box-shadow: var(--shadow);
}
.footer-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }

@media (max-width: 520px) {
  .topbar { grid-template-columns: repeat(2, 1fr); }
  .row-2 { grid-template-columns: 1fr; }
}

button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}


/* ── 병맛 / 업적 태그 ── */
.tag-absurd, .tag-achieve {
  display: inline-block; border-radius: 999px; padding: 3px 12px;
  font-size: .75rem; font-weight: 700; letter-spacing: .02em; margin-bottom: 6px;
}
.tag-absurd { background: #f0e2ff; color: #6b3fa0; }
.tag-achieve { background: var(--accent-soft); color: var(--accent); }
:root[data-theme="dark"] .tag-absurd { background: #3d2f50; color: #d6b8ff; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .tag-absurd { background: #3d2f50; color: #d6b8ff; }
}
.modal.absurd { border: 2px dashed #a97fbd; }

/* ── 보상 선택 ── */
.modal.reward { max-width: 540px; text-align: center; }
.reward-head .icon { font-size: 2.6rem; }
.reward-heading { margin: 16px 0 10px; font-size: 1.05rem; color: var(--accent); }
.reward-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

.reward-card {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  border-radius: 16px; padding: 16px 10px 12px;
  border: 2px solid var(--line); background: var(--bg-soft);
  position: relative; word-break: keep-all;
}
.reward-card.gold { border-color: var(--gold); }
.reward-card.family { border-color: var(--pink); }
.reward-card.self { border-color: var(--blue); }
.reward-card.village { border-color: var(--green); }
.reward-crown { position: absolute; top: -13px; left: 50%; transform: translateX(-50%); font-size: 1.25rem; }
.reward-icon { font-size: 2.1rem; line-height: 1; }
.reward-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.reward-title { font-weight: 700; font-size: .92rem; line-height: 1.35; }
.reward-label { font-size: .75rem; color: var(--ink-soft); line-height: 1.45; }
.reward-pick { width: 100%; padding: 8px 0; font-size: .9rem; }

@media (max-width: 560px) {
  .reward-grid { grid-template-columns: 1fr; gap: 12px; }
  .reward-card {
    flex-direction: row; align-items: center; text-align: left;
    padding: 12px 12px 12px 14px; gap: 12px;
  }
  .reward-card .reward-crown { top: -11px; left: 16px; transform: none; font-size: 1.05rem; }
  .reward-pick { width: auto; flex: 0 0 auto; padding: 8px 18px; }
}

/* ── 업적 ── */
.item.achieve { align-items: flex-start; }
.item.achieve.done { background: var(--good-bg); border-color: var(--green); }
.achieve-icon { font-size: 1.6rem; width: 34px; text-align: center; }
.achieve-check { color: var(--green); font-weight: 700; font-size: 1.2rem; }
.badge.tier1 { background: #f0e0d0; }
.badge.tier2 { background: #e2e6ea; }
.badge.tier3 { background: #f7e6b8; }
:root[data-theme="dark"] .badge.tier1,
:root[data-theme="dark"] .badge.tier2,
:root[data-theme="dark"] .badge.tier3 { background: var(--line); }


/* ── 족보 트리 ── */
.tree-scroll {
  overflow: auto;
  margin: 0 -6px;
  padding: 6px;
  -webkit-overflow-scrolling: touch;
}
.tree-canvas { position: relative; min-width: 100%; }
.tree-lines {
  position: absolute; inset: 0;
  color: var(--line);
  pointer-events: none;
}
.tree-lines path {
  fill: none;
  stroke: currentColor;
  stroke-width: 2.5;
  stroke-linecap: round;
}
.tree-card {
  position: absolute;
  width: 104px; height: 116px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 4px 6px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: var(--card);
  box-shadow: var(--shadow);
  cursor: pointer;
}
.tree-card.me { border-color: var(--accent); background: var(--accent-soft); }
.tree-card.gone { opacity: .6; background: var(--bg-soft); }
.tree-name { font-weight: 700; font-size: .82rem; margin-top: 3px; }
.tree-meta { font-size: .7rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.tree-heart { position: absolute; font-size: 1.1rem; pointer-events: none; }
.tree-dream {
  position: absolute; top: 4px; left: 4px; font-size: .72rem;
  background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 1px 5px;
}
.tree-dream.done { border-color: var(--green); background: var(--good-bg); }

/* ── 나비효과 ── */
.tag-echo {
  display: inline-block; border-radius: 999px; padding: 3px 12px;
  font-size: .75rem; font-weight: 700; margin-bottom: 8px;
  background: #e2edff; color: #3b5fa0;
}
:root[data-theme="dark"] .tag-echo { background: #2b3850; color: #b9cdf0; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .tag-echo { background: #2b3850; color: #b9cdf0; }
}
.modal.echo { border: 2px solid var(--blue); }
.echo-head { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
.echo-head h2 { margin: 2px 0; }
.result-box.bad { border-left-color: var(--bad); }
.echo-hint { color: var(--blue); font-weight: 700; }

/* ── 이벤트 주인공 ── */
.event-head { display: flex; gap: 14px; align-items: center; margin-bottom: 10px; }
.event-who { min-width: 0; }
.event-who h2 { margin: 6px 0 0; }

/* ── 자동 진행 ── */
.auto-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.auto-bar .pill.small { font-size: .78rem; padding: 5px 10px; }
.auto-hint { margin-top: 8px; font-size: .8rem; }


/* ── 출신 선택 ── */
.origin-grid { display: grid; gap: 8px; }
.origin {
  display: flex; gap: 12px; align-items: flex-start; text-align: left;
  padding: 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--bg-soft);
  width: 100%;
}
.origin.on { border-color: var(--accent); background: var(--accent-soft); }
.origin-icon { font-size: 1.8rem; line-height: 1; }
.origin-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.origin-title { font-weight: 700; }
.origin-desc { font-size: .84rem; color: var(--ink); opacity: .85; }
.origin-detail { font-size: .76rem; color: var(--ink-soft); }
.badge.hard { background: var(--bad); color: #fff; border-color: var(--bad); font-size: .7rem; }

/* ── 위기 ── */
.crisis-banner {
  display: flex; gap: 12px; align-items: center; width: 100%; text-align: left;
  border-radius: var(--radius); padding: 11px 14px; margin-bottom: 10px;
  border: 2px solid var(--bad); background: var(--bad-bg); color: var(--ink);
}
.crisis-banner.urgent { animation: crisisPulse 1.4s ease-in-out infinite; }
@keyframes crisisPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(192, 95, 95, .45); }
  50% { box-shadow: 0 0 0 8px rgba(192, 95, 95, 0); }
}
.crisis-icon { font-size: 1.7rem; }
.crisis-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.crisis-title { font-weight: 700; font-size: .95rem; }
.crisis-sub { font-size: .78rem; color: var(--ink-soft); }
.card.crisis-card { border: 2px solid var(--bad); }
.card.crisis-card.urgent { background: var(--bad-bg); }
.badge.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
.bar.crisis { height: 10px; margin: 8px 0 4px; }
.bar.crisis > i { background: var(--bad); }

/* ── 숙원 ── */
.quest-bar {
  display: flex; gap: 12px; align-items: center;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--card); padding: 10px 14px; margin-bottom: 10px; box-shadow: var(--shadow);
}
.quest-icon { font-size: 1.5rem; }
.quest-body { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
.quest-title { font-weight: 700; font-size: .88rem; }
.quest-sub { font-size: .74rem; color: var(--ink-soft); }

/* ── 꿈 ── */
.dream {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  margin-top: 8px; padding: 6px 10px; border-radius: 12px;
  background: var(--bg-soft); border: 1px dashed var(--line); font-size: .82rem;
}
.dream.done { border-style: solid; border-color: var(--green); background: var(--good-bg); }
.dream-done { color: var(--green); font-weight: 700; }

/* ── 효과 배지 ── */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.chip {
  font-size: .78rem; font-weight: 700; padding: 4px 10px; border-radius: 999px;
  background: var(--bg-soft); border: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}
.chip.up { background: var(--good-bg); border-color: var(--green); }
.chip.down { background: var(--bad-bg); border-color: var(--bad); }
.chip.tiny { font-size: .7rem; padding: 2px 7px; font-weight: 400; }
.delta { margin-left: 4px; font-size: .72rem; font-weight: 700; }
.delta.up { color: var(--green); }
.delta.down { color: var(--bad); }
.ok { color: var(--green); font-weight: 700; }
.fail { color: var(--bad); font-weight: 700; }

/* 위험한 활동 */
.pill.risky { border-style: dashed; }
.pill.risky.on { border-style: solid; }

.modal.dream-modal { border: 2px solid var(--gold); }
.modal.crisis-modal { border: 2px solid var(--bad); }

</style>

  { id: 'hustle', label: '부업', icon: '🛵', desc: '돈을 더 벌지만 몸과 마음이 지칩니다.', minAge: 17, risky: true },
  { id: 'gamble', label: '한탕 노리기', icon: '🎲', desc: '자금의 15%를 겁니다. 두 배가 되거나 날아갑니다.', minAge: 19, risky: true },
  { id: 'volunteer', label: '마을 봉사', icon: '🤲', desc: '명성과 매력이 오르고 가족이 뿌듯해합니다.', minAge: 12 },
];

const ACTIVITY_BY_ID = Object.fromEntries(ACTIVITIES.map((a) => [a.id, a]));

// ── 상태 만들기 ────────────────────────────────────────────

function newGame({ seed = Date.now(), familyName, givenName, gender, traitId, villageName, originId = 'common' } = {}) {
  resetIdCounter(1);
  const rng = createRng(seed);
  const founder = createFounder(rng, { gender, familyName, givenName, year: START_YEAR, traitId });
  const state = {
    seed,
    rngState: rng.state,
    idCounter: currentIdCounter(),
    year: START_YEAR,
    generation: 1,
    playerId: founder.id,
    people: { [founder.id]: founder },
    money: 2600,
    upkeep: 0,
    village: createVillage(villageName || rng.pick(VILLAGE_NAMES)),
    log: [],
    pending: null,
    seenEvents: [],
    turnFlags: { romanceUsed: false, metThisYear: false },
    activity: 'study',
    succession: null,
    ended: null,
    achievements: [],
    rewardQueue: [],
    echoes: [],
    notices: [],
    flags: {},
    crisis: null,
    quest: null,
    questsDone: [],
    originId: 'common',
    auto: { running: false, speed: 'normal' },
    stats: {
      yearsPlayed: 0, born: 0, married: 0, buildingsBuilt: 0, peakMoney: 2600,
      eventsResolved: 0, absurdSeen: 0, rewardsTaken: 0,
      dreamsFulfilled: 0, crisesSurvived: 0, crisesFailed: 0, questsDone: 0,
    },
  };
  // 출신 가문 적용
  const origin = ORIGIN_BY_ID[originId] ?? ORIGIN_BY_ID.common;
  state.originId = origin.id;
  state.money = origin.money;
  state.stats.peakMoney = origin.money;
  origin.apply(state, { founder, rng });
  syncRng(state, rng);

  pushLog(state, '🌱', `${fullName(founder)}의 이야기가 ${state.village.name}에서 시작됩니다. (${origin.icon} ${origin.title})`, 'good');

  assignDream(state, founder, rngFor(state));
  const dream = dreamOf(founder);
  if (dream) pushLog(state, dream.icon, `${fullName(founder)}의 꿈: ${dream.title}`);
  assignQuest(state, lifeDeps);
  const quest = questStatus(state, lifeDeps);
  if (quest) pushLog(state, quest.icon, `가문의 숙원: ${quest.title} — ${quest.desc} (${quest.yearsLeft}년)`);

  // 물려받은 빚은 곧바로 위기로 시작한다
  if (state.startingDebt) {
    startCrisis(state, lifeDeps, 'debt');
    if (state.crisis) {
      state.crisis.need = state.startingDebt;
      pushNotice(state, crisisNotice(state, '물려받은 빚이 기다리고 있습니다.'));
    }
    delete state.startingDebt;
  }
  return state;
}

/** 저장된 상태를 이어받을 때 id 카운터를 복구한다 */
function rehydrate(state) {
  resetIdCounter(state.idCounter ?? Object.keys(state.people).length + 1);
  return state;
}

const rngFor = (state) => {
  const rng = createRng(state.seed);
  rng.state = state.rngState;
  return rng;
};
const syncRng = (state, rng) => {
  state.rngState = rng.state;
  state.idCounter = currentIdCounter();
};

// ── 알림 큐 (꿈·위기·나비효과) ─────────────────────────────

function pushNotice(state, notice) {
  if (!notice) return;
  if (!state.notices) state.notices = [];
  state.notices.push(notice);
}

function pendingNotice(state) {
  const notice = state.notices?.[0];
  if (!notice) return null;
  return { ...notice, person: notice.personId ? state.people[notice.personId] : null };
}

function dismissNotice(state) {
  state.notices?.shift();
}

// ── 꿈 · 위기 · 숙원 연결 ──────────────────────────────────

const lifeDeps = {
  player: (state) => player(state),
  childrenOf: (state, person) => childrenOf(state, person),
  familyMembers: (state) => familyMembers(state),
  rng: (state) => rngFor(state),
  syncRng: (state, rng) => syncRng(state, rng),
  applyEffects: (state, effects, target) => applyEffects(state, effects, target),
  pushLog: (state, icon, text, tone) => pushLog(state, icon, text, tone),
  checkChance: (person, check) => checkChance(person, check),
  fillText: (state, text, actor) => fillText(state, text, actor),
  financeSummary: (state) => financeSummary(state),
};

/** 지금 닥친 위기 (없으면 null) */
const crisis = (state) => crisisStatus(state, lifeDeps);

function payCrisis(state, amount = null) {
  const result = payCrisisCore(state, lifeDeps, amount);
  if (result.resolved) runAchievementCheck(state);
  return result;
}

function tryCrisis(state) {
  const result = tryCrisisCore(state, lifeDeps);
  if (result.resolved) runAchievementCheck(state);
  return result;
}

/** 가문의 숙원 */
const quest = (state) => questStatus(state, lifeDeps);

/** 인물의 꿈 */
const dreamFor = (person) => dreamOf(person);

function crisisNotice(state, extra = '') {
  const status = crisisStatus(state, lifeDeps);
  if (!status) return null;
  return {
    kind: 'crisis',
    icon: status.icon,
    title: status.title,
    text: `${status.desc}${extra ? ` ${extra}` : ''}`,
    detail: `${status.yearsLeft}년 안에 ${Math.round(status.need).toLocaleString('ko-KR')}만원`,
    tone: 'bad',
    personId: status.target?.id ?? null,
  };
}

// ── 업적 연결 ──────────────────────────────────────────────

/** achievements.js 가 쓰는 조회 함수 묶음 */
const achievementDeps = {
  player: (state) => player(state),
  childrenOf: (state, person) => childrenOf(state, person),
  rng: (state) => rngFor(state),
  syncRng: (state, rng) => syncRng(state, rng),
};

/** 업적을 확인하고, 새로 달성한 것이 있으면 기록에 남긴다 */
function runAchievementCheck(state) {
  if (state.ended) return [];
  const unlocked = checkAchievements(state, achievementDeps);
  for (const achievement of unlocked) {
    pushLog(state, achievement.icon, `업적 달성! ${fillText(state, achievement.title)} — ${achievement.desc}`, 'good');
  }
  return unlocked;
}

/** 지금 골라야 할 보상 카드 */
function rewardChoice(state) {
  const choice = pendingRewardChoice(state, achievementDeps);
  if (!choice) return null;
  return { ...choice, achievement: { ...choice.achievement, title: fillText(state, choice.achievement.title) } };
}

/** 보상 선택 */
function takeReward(state, rewardId) {
  const result = claimReward(state, rewardId, achievementDeps);
  if (result.ok) {
    pushLog(state, result.reward.icon, `보상 획득 — ${result.text}`, 'good');
    runAchievementCheck(state);
  }
  return result;
}

/** 업적 목록 (진행도 포함) */
function achievements(state) {
  return achievementList(state, achievementDeps).map((a) => ({ ...a, title: fillText(state, a.title) }));
}

// ── 조회 헬퍼 ──────────────────────────────────────────────

const player = (state) => state.people[state.playerId];
const personOf = (state, id) => (id ? state.people[id] : null);
const partnerOf = (state) => personOf(state, player(state)?.partnerId);
const allPeople = (state) => Object.values(state.people);

/** 같이 사는 가족: 나 + 배우자 + 자녀(아직 집에 있는) + 모시는 부모님 */
function household(state) {
  const me = player(state);
  if (!me) return [];
  const members = [me];
  const partner = partnerOf(state);
  if (partner?.alive) members.push(partner);
  for (const childId of me.children) {
    const child = state.people[childId];
    if (!child?.alive) continue;
    // 미성년이거나, 아직 짝을 만나지 않고 집에 남아 있는 자녀
    if (child.age < 19 || (!child.partnerId && !child.independent)) members.push(child);
  }
  for (const elder of eldersOf(state)) members.push(elder);
  return members;
}

/** 분가한 가족이 다달이 보태는 몫 (연 20%) */
const SUPPORT_SHARE = 0.2;

const MAX_SUPPORTERS = 4;

function supportingRelatives(state) {
  const me = player(state);
  const members = new Set(household(state).map((p) => p.id));
  const closeness = (person) => {
    if (me?.children.includes(person.id)) return 0;
    if (me?.parents.includes(person.id)) return 1;
    return 2;
  };
  return familyMembers(state)
    .filter((person) => !members.has(person.id) && person.alive && person.jobId && person.age >= 19)
    .sort((a, b) => closeness(a) - closeness(b) || b.jobLevel - a.jobLevel)
    .slice(0, MAX_SUPPORTERS);
}

function supportIncome(state, bonuses) {
  return Math.round(
    supportingRelatives(state).reduce((sum, person) => sum + salaryOf(person, bonuses) * SUPPORT_SHARE, 0),
  );
}

/** 함께 사는 부모님(전 세대 플레이어와 그 배우자) */
function eldersOf(state) {
  const me = player(state);
  if (!me) return [];
  return me.parents
    .map((id) => state.people[id])
    .filter((p) => p?.alive && p.inFamily);
}

/** 화면에 보여줄 가족 구성원 (생존자 전원) */
function familyMembers(state) {
  return allPeople(state).filter((p) => p.alive && p.inFamily);
}

const childrenOf = (state, person) => person.children.map((id) => state.people[id]).filter(Boolean);

function candidates(state) {
  return allPeople(state).filter((p) => p.isCandidate && p.alive && !p.partnerId);
}

function pushLog(state, icon, text, tone = 'normal') {
  state.log.unshift({ year: state.year, icon, text, tone });
  if (state.log.length > 300) state.log.length = 300;
}

/** 텍스트의 {me} {actor} {relation} {partner} {child} {village} 치환 */
function fillText(state, text, actor = null) {
  const me = player(state);
  const partner = partnerOf(state);
  const subject = actor ?? me;
  const subjectPartner = subject?.partnerId ? state.people[subject.partnerId] : null;
  const kids = subject ? childrenOf(state, subject).filter((c) => c.alive) : [];
  const myKids = me ? childrenOf(state, me).filter((c) => c.alive) : [];
  return String(text)
    .replaceAll('{me}', me ? fullName(me) : '주인공')
    .replaceAll('{actor}', subject ? fullName(subject) : '가족')
    .replaceAll('{relation}', subject ? relationOf(state, subject) : '가족')
    .replaceAll('{partner}', (subjectPartner ?? partner) ? fullName(subjectPartner ?? partner) : '배우자')
    .replaceAll('{child}', (kids[0] ?? myKids[0]) ? fullName(kids[0] ?? myKids[0]) : '아이')
    .replaceAll('{village}', state.village.name);
}

// ── 효과 적용 ──────────────────────────────────────────────

/**
 * 효과 적용. target 을 주면 그 사람에게, 없으면 주인공에게 적용된다.
 * 돈·마을 명성처럼 집안 전체에 걸리는 것은 항상 가구에 적용된다.
 */
function applyEffects(state, effects = {}, target = null) {
  const person = target ?? player(state);
  const rng = rngFor(state);

  if (effects.money) state.money += effects.money;
  if (effects.villageFame) state.village.fame = (state.village.fame ?? 0) + effects.villageFame;
  if (effects.expenseUp) state.upkeep += effects.expenseUp;
  if (effects.inheritBonus) state.inheritBonus = (state.inheritBonus ?? 0) + effects.inheritBonus;

  if (!person) {
    syncRng(state, rng);
    return;
  }

  if (effects.happiness) person.happiness = clamp(person.happiness + effects.happiness);
  if (effects.stats) {
    for (const [key, value] of Object.entries(effects.stats)) {
      if (!STAT_KEYS.includes(key)) continue;
      person.stats[key] = clamp(person.stats[key] + value);
      if (person.age <= 18) person.potential[key] = clamp(person.potential[key] + value / 3);
    }
  }
  if (effects.education) person.eduPoints = Math.max(0, person.eduPoints + effects.education * 8);
  if (effects.lifespan) person.lifespan += effects.lifespan;
  if (effects.affection) {
    const partner = state.people[person.partnerId];
    if (partner) partner.affection = clamp(partner.affection + effects.affection);
  }
  if (effects.addTrait && !person.traits.includes(effects.addTrait) && TRAIT_BY_ID[effects.addTrait]) {
    person.traits.push(effects.addTrait);
    pushLog(state, '✨', `${fullName(person)}에게 새로운 특성 "${TRAIT_BY_ID[effects.addTrait].label}"이(가) 생겼습니다.`, 'good');
  }
  if (effects.promote && person.jobId && person.jobLevel < MAX_JOB_LEVEL) {
    person.jobLevel = Math.min(MAX_JOB_LEVEL, person.jobLevel + effects.promote);
    pushLog(state, '📈', `${fullName(person)}이(가) 승진했습니다. (${person.jobLevel}호봉)`, 'good');
  }
  if (effects.flag) addFlag(state, person, effects.flag);

  // 가족 전체
  if (effects.familyHappiness) {
    for (const member of familyMembers(state)) {
      member.happiness = clamp(member.happiness + effects.familyHappiness);
    }
  }

  // 이 사람의 아이들
  const kids = childrenOf(state, person).filter((c) => c.alive);
  if (effects.childHappiness) {
    for (const kid of kids) kid.happiness = clamp(kid.happiness + effects.childHappiness);
  }
  if (effects.childStats && kids.length) {
    const targetKid = kids[0];
    for (const [key, value] of Object.entries(effects.childStats)) {
      if (!STAT_KEYS.includes(key)) continue;
      targetKid.stats[key] = clamp(targetKid.stats[key] + value);
      targetKid.potential[key] = clamp(targetKid.potential[key] + value / 2);
    }
  }
  syncRng(state, rng);
}

/** 선택이 남기는 흔적. 사람과 가문 양쪽에 쌓인다. */
function addFlag(state, person, flag) {
  if (!flag) return;
  if (!person.flags) person.flags = [];
  if (!person.flags.includes(flag)) person.flags.push(flag);
  if (!state.flags) state.flags = {};
  state.flags[flag] = (state.flags[flag] ?? 0) + 1;
}

const hasFlag = (state, flag) => Boolean(state.flags?.[flag]);

/** 주인공에게서 본 관계 이름 */
function relationOf(state, person) {
  const me = player(state);
  if (!me || !person) return '가족';
  if (person.id === me.id) return '나';
  if (person.id === me.partnerId) return '배우자';
  if (me.children.includes(person.id)) return person.gender === 'male' ? '아들' : '딸';
  if (me.parents.includes(person.id)) return person.gender === 'male' ? '아버지' : '어머니';
  const grandchild = childrenOf(state, me).some((kid) => kid.children.includes(person.id));
  if (grandchild) return person.gender === 'male' ? '손자' : '손녀';
  const sibling = me.parents.some((parentId) => state.people[parentId]?.children.includes(person.id));
  if (sibling) return person.gender === 'male' ? '형제' : '자매';

  // 결혼으로 들어온 사람은 짝을 기준으로 부른다
  if (person.bloodline === false && person.partnerId) {
    const spouse = state.people[person.partnerId];
    if (spouse && me.children.includes(spouse.id)) return person.gender === 'male' ? '사위' : '며느리';
    if (spouse && me.parents.includes(spouse.id)) return person.gender === 'male' ? '아버지' : '어머니';
    return '가족';
  }
  if (person.generation > me.generation) return '자손';
  if (person.generation < me.generation) return '윗세대';
  return '가족';
}

// ── 연간 활동 ──────────────────────────────────────────────

function applyActivity(state, activityId) {
  const me = player(state);
  const rng = rngFor(state);
  const gain = (key, amount) => { me.stats[key] = clamp(me.stats[key] + amount); };
  switch (activityId) {
    case 'study':
      gain('intellect', 3 + rng.int(0, 2));
      me.eduPoints += 10;
      me.happiness = clamp(me.happiness - 1);
      break;
    case 'exercise':
      gain('fitness', 3 + rng.int(0, 2));
      gain('health', 2);
      break;
    case 'art':
      gain('creativity', 3 + rng.int(0, 2));
      me.happiness = clamp(me.happiness + 1);
      break;
    case 'social': {
      gain('charm', 3 + rng.int(0, 2));
      const partner = partnerOf(state);
      if (partner) partner.affection = clamp(partner.affection + 4);
      break;
    }
    case 'work': {
      if (me.jobId && rng.chance(promotionChance(me, true))) {
        me.jobLevel += 1;
        pushLog(state, '📈', `${fullName(me)}이(가) 승진했습니다. (${me.jobLevel}호봉)`, 'good');
      }
      const job = JOB_BY_ID[me.jobId];
      if (job) gain(job.stat, 2);
      me.happiness = clamp(me.happiness - 2);
      break;
    }
    case 'family': {
      me.happiness = clamp(me.happiness + 4);
      const partner = partnerOf(state);
      if (partner) {
        partner.affection = clamp(partner.affection + 5);
        partner.happiness = clamp(partner.happiness + 3);
      }
      for (const kid of childrenOf(state, me)) {
        if (kid.alive) {
          kid.happiness = clamp(kid.happiness + 5);
          kid.potential.charm = clamp(kid.potential.charm + 0.5);
        }
      }
      break;
    }
    case 'grind': {
      gain('fitness', 6 + rng.int(0, 3));
      gain('health', -2);
      if (rng.chance(0.18)) {
        gain('health', -8);
        gain('fitness', -3);
        me.happiness = clamp(me.happiness - 6);
        pushLog(state, '🤕', `${fullName(me)}이(가) 무리하다 다쳤습니다.`, 'bad');
      } else {
        me.happiness = clamp(me.happiness + 1);
      }
      break;
    }
    case 'hustle': {
      const earned = 300 + Math.round(me.stats.fitness * 6 + me.stats.charm * 4);
      state.money += earned;
      gain('health', -3);
      me.happiness = clamp(me.happiness - 3);
      pushLog(state, '🛵', `부업으로 ${earned.toLocaleString('ko-KR')}만원을 더 벌었습니다.`);
      break;
    }
    case 'gamble': {
      const bet = Math.round(state.money * 0.15);
      if (bet < 50) {
        me.happiness = clamp(me.happiness - 1);
        pushLog(state, '🎲', '걸 돈이 없어 구경만 했습니다.');
        break;
      }
      state.money -= bet;
      const luck = me.traits.includes('lucky') ? 0.58 : 0.47;
      if (rng.chance(luck)) {
        state.money += bet * 2;
        me.happiness = clamp(me.happiness + 8);
        pushLog(state, '🎉', `한탕이 터졌습니다! ${bet.toLocaleString('ko-KR')}만원을 벌었습니다.`, 'good');
      } else {
        me.happiness = clamp(me.happiness - 7);
        pushLog(state, '💸', `${bet.toLocaleString('ko-KR')}만원을 날렸습니다.`, 'bad');
      }
      break;
    }
    case 'volunteer': {
      gain('charm', 3);
      state.village.fame = (state.village.fame ?? 0) + 3;
      me.happiness = clamp(me.happiness + 3);
      for (const member of familyMembers(state)) member.happiness = clamp(member.happiness + 1.5);
      break;
    }
    case 'rest':
    default:
      gain('health', 3);
      me.happiness = clamp(me.happiness + 3);
      break;
  }
  syncRng(state, rng);
}

function availableActivities(state) {
  const me = player(state);
  return ACTIVITIES.filter((a) => me.age >= a.minAge && (!a.needsJob || me.jobId));
}

// ── 이벤트 ────────────────────────────────────────────────

/** 이 이벤트의 주인공이 될 수 있는 사람들 */
function actorsFor(state, event) {
  const me = player(state);
  if (!me) return [];
  const scope = event.actor ?? 'any';
  let pool;
  switch (scope) {
    case 'self': pool = [me]; break;
    case 'partner': pool = [state.people[me.partnerId]]; break;
    case 'child': pool = childrenOf(state, me); break;
    case 'elder': pool = eldersOf(state); break;
    case 'any':
    default: pool = familyMembers(state); break;
  }
  return (pool ?? []).filter((person) => person?.alive && fitsEvent(state, event, person));
}

function fitsEvent(state, event, person) {
  if (event.minAge != null && person.age < event.minAge) return false;
  if (event.maxAge != null && person.age > event.maxAge) return false;
  if (event.needsJob && !person.jobId) return false;
  if (event.needsPartner && !state.people[person.partnerId]?.alive) return false;
  if (event.needsChild && !childrenOf(state, person).some((c) => c.alive)) return false;
  if (event.needsGrandchild && !childrenOf(state, person).some((c) => c.children.length > 0)) return false;
  if (event.needsSibling && !hasLivingSibling(state, person)) return false;
  if (event.requiresFlag && !hasFlag(state, event.requiresFlag)) return false;
  if (event.forbidFlag && hasFlag(state, event.forbidFlag)) return false;
  return true;
}

/** 살아 있는 형제자매가 있는가 */
function hasLivingSibling(state, person) {
  return person.parents.some((parentId) => (
    (state.people[parentId]?.children ?? []).some((id) => id !== person.id && state.people[id]?.alive)
  ));
}

/** 지금 일어날 수 있는 이벤트와 그 주인공 후보들 */
function eligibleEvents(state) {
  return EVENTS
    .filter((event) => !(event.once && state.seenEvents.includes(event.id)))
    .map((event) => ({ event, actors: actorsFor(state, event) }))
    .filter((entry) => entry.actors.length > 0);
}

/** 주인공에게 조금 더 자주, 그래도 온 가족에게 골고루 */
function actorWeight(state, person) {
  const me = player(state);
  if (person.id === state.playerId) return 3.2;
  if (person.id === me?.partnerId) return 1.6;
  if (me?.children.includes(person.id)) return 1.6;
  if (me?.parents.includes(person.id)) return 1;
  const grandchild = me ? childrenOf(state, me).some((kid) => kid.children.includes(person.id)) : false;
  if (grandchild) return 1;
  return 0.55;   // 먼 친척은 가끔만
}

const EVENT_CHANCE = 0.78;

function rollEvent(state, { forced = false } = {}) {
  const pool = eligibleEvents(state);
  if (!pool.length) return;
  const rng = rngFor(state);
  if (!forced && !rng.chance(EVENT_CHANCE)) {
    syncRng(state, rng);
    return;                       // 조용히 지나가는 해
  }
  const entry = rng.weighted(pool, (e) => e.event.weight ?? 1);
  const actor = rng.weighted(entry.actors, (person) => actorWeight(state, person));
  syncRng(state, rng);
  state.pending = { eventId: entry.event.id, actorId: actor.id, resolved: null };
  if (entry.event.once) state.seenEvents.push(entry.event.id);
}

/** 판정 성공 확률 */
function checkChance(person, check) {
  const stat = person.stats[check.stat] ?? 0;
  return clamp(0.5 + (stat - check.difficulty) / 80, 0.05, 0.95);
}

function pendingEvent(state) {
  if (!state.pending) return null;
  const event = EVENTS.find((e) => e.id === state.pending.eventId);
  if (!event) return null;
  const actor = state.people[state.pending.actorId] ?? player(state);
  return {
    ...event,
    tag: event.tag ?? null,
    actorPerson: actor,
    relation: relationOf(state, actor),
    title: fillText(state, event.title, actor),
    text: fillText(state, event.text, actor),
    choices: event.choices.map((choice, index) => ({
      index,
      label: fillText(state, choice.label, actor),
      cost: choice.cost ?? 0,
      affordable: (choice.cost ?? 0) <= state.money,
      odds: choice.check ? Math.round(checkChance(actor, choice.check) * 100) : null,
      checkLabel: choice.check ? choice.check.stat : null,
      echoHint: Boolean(choice.echo ?? choice.success?.echo ?? choice.fail?.echo),
    })),
    resolved: state.pending.resolved,
  };
}

/** 훗날 돌아올 선택의 파장을 예약한다 */
function scheduleEcho(state, { actor, event, choice, branch, rng }) {
  const echo = branch?.echo ?? choice.echo;
  if (!echo) return;
  const [min, max] = echo.delay ?? [4, 12];
  if (!state.echoes) state.echoes = [];
  state.echoes.push({
    actorId: actor.id,
    plantedYear: state.year,
    dueYear: state.year + rng.int(min, max),
    icon: echo.icon ?? '🦋',
    fromTitle: event.title,
    fromLabel: choice.label,
    text: echo.text,
    effects: echo.effects ?? {},
    tone: echo.tone ?? 'good',
  });
}

/** 파장이 돌아올 대상 (본인이 없으면 그 자손, 그마저 없으면 주인공) */
function echoTarget(state, echo) {
  const source = state.people[echo.actorId];
  if (source?.alive) return source;
  const heir = source ? childrenOf(state, source).find((c) => c.alive) : null;
  return heir ?? player(state);
}

/** 올해 돌아온 파장들을 처리한다 */
function fireEchoes(state) {
  if (!state.echoes?.length) return;
  const due = state.echoes.filter((echo) => echo.dueYear <= state.year);
  if (!due.length) return;
  state.echoes = state.echoes.filter((echo) => echo.dueYear > state.year);
  for (const echo of due) {
    const target = echoTarget(state, echo);
    applyEffects(state, echo.effects, target);
    const text = fillText(state, echo.text, target);
    const years = state.year - echo.plantedYear;
    pushLog(state, echo.icon, `나비효과 — ${text}`, echo.tone);
    pushNotice(state, {
      kind: 'echo',
      icon: echo.icon,
      years,
      title: fillText(state, echo.fromTitle, target),
      detail: `"${fillText(state, echo.fromLabel, target)}"`,
      text,
      tone: echo.tone,
      effects: echo.effects,
      personId: target?.id ?? null,
    });
  }
  runAchievementCheck(state);
}

/** 이전 이름과의 호환 */
const pendingEcho = (state) => pendingNotice(state);
const dismissEcho = (state) => dismissNotice(state);

function resolveEvent(state, choiceIndex) {
  if (!state.pending || state.pending.resolved) return null;
  const event = EVENTS.find((e) => e.id === state.pending.eventId);
  const choice = event?.choices[choiceIndex];
  if (!choice) return null;
  if ((choice.cost ?? 0) > state.money) return null;

  const actor = state.people[state.pending.actorId] ?? player(state);
  const rng = rngFor(state);
  if (choice.cost) state.money -= choice.cost;

  let outcomeText;
  let effects;
  let branch = null;
  if (choice.check) {
    const success = rng.chance(checkChance(actor, choice.check));
    branch = success ? choice.success : choice.fail;
    outcomeText = branch.text;
    effects = branch.effects ?? {};
  } else {
    outcomeText = choice.result;
    effects = choice.effects ?? {};
  }
  scheduleEcho(state, { actor, event, choice, branch, rng });
  syncRng(state, rng);
  applyEffects(state, effects, actor);

  state.stats.eventsResolved = (state.stats.eventsResolved ?? 0) + 1;
  if (event.tag === 'absurd') state.stats.absurdSeen = (state.stats.absurdSeen ?? 0) + 1;
  runAchievementCheck(state);

  const text = fillText(state, outcomeText, actor);
  state.pending.resolved = {
    text,
    label: fillText(state, choice.label, actor),
    effects,
    cost: choice.cost ?? 0,
    success: choice.check ? branch === choice.success : null,
  };
  pushLog(state, event.icon ?? '❔', `${fillText(state, event.title, actor)} — ${text}`);
  return state.pending.resolved;
}

function dismissEvent(state) {
  state.pending = null;
}

// ── 한 해 보내기 ───────────────────────────────────────────

function canAdvance(state) {
  if (state.ended) return false;
  if (state.succession) return false;
  if (state.rewardQueue?.length) return false;
  if (state.notices?.length) return false;
  if (state.pending && !state.pending.resolved) return false;
  return true;
}

function advanceYear(state, activityId = state.activity) {
  if (!canAdvance(state)) return state;
  state.pending = null;
  state.activity = activityId;
  const bonuses = villageBonuses(state.village);
  const rng = rngFor(state);

  const before = player(state);
  state.snapshot = {
    money: state.money,
    happiness: before.happiness,
    stats: { ...before.stats },
    playerId: before.id,
  };

  applyActivity(state, activityId);

  // 1) 모두 한 살 더
  state.year += 1;
  for (const person of allPeople(state)) {
    if (!person.alive) continue;
    const inHouse = person.inFamily;
    ageOneYear(person, { rng, villageGrow: inHouse ? bonuses.grow : {} });
    updateEducation(person);
  }
  syncRng(state, rng);

  const me = player(state);

  // 2) 살림
  const members = household(state);
  const income = householdIncome(members, bonuses) + supportIncome(state, bonuses);
  const expense = householdExpense(members, bonuses, state.upkeep, costOfLiving(state))
    + villageMaintenance(state.village);
  state.money += income - expense;
  state.stats.peakMoney = Math.max(state.stats.peakMoney, state.money);
  if (state.money < 0) {
    const debt = -state.money;
    state.money = 0;
    me.happiness = clamp(me.happiness - Math.min(12, 3 + debt / 400));
    pushLog(state, '💸', `살림이 빠듯합니다. 빚을 메우느라 가족이 힘든 한 해였습니다.`, 'bad');
  }

  // 3) 행복 자연 변화
  const familyHappiness = bonuses.happiness + (me.jobId ? (JOB_BY_ID[me.jobId].happiness ?? 0) : me.age >= 22 ? -1.5 : 0);
  for (const person of familyMembers(state)) {
    person.happiness = clamp(person.happiness + familyHappiness * (person.id === me.id ? 1 : 0.7) - 0.5);
  }

  // 4) 배우자 커리어 (자동)
  autoCareerForPartner(state);

  // 4-1) 조부모가 함께 살면 아이들이 더 행복하게 자란다
  const elders = eldersOf(state);
  if (elders.length) {
    for (const kid of childrenOf(state, me)) {
      if (kid.alive && kid.age < 19) {
        kid.happiness = clamp(kid.happiness + 1.5);
        kid.potential.charm = clamp(kid.potential.charm + 0.3);
      }
    }
  }

  // 4-2) 가족들도 저마다의 인생을 산다 (결혼하고 아이를 낳는다)
  npcLife(state);

  // 4-3) 성인이 되면 일할 수 있다고 알려준다
  if (me.age === 19 && !me.jobId) {
    pushLog(state, '💼', '이제 일을 구할 수 있습니다. [직업] 탭에서 자격에 맞는 일을 찾아보세요.');
  }
  if (me.age > 19 && !me.jobId && !me.retired && state.money < 500) {
    pushLog(state, '⚠️', '통장이 비어갑니다. 일자리를 구하지 않으면 가족이 어려워집니다.', 'bad');
  }

  // 5) 아이 독립 / 성장 알림
  for (const kid of childrenOf(state, me)) {
    if (kid.alive && kid.age === 19) {
      pushLog(state, '🎓', `${fullName(kid)}이(가) 성인이 되었습니다. (${EDUCATION_LABELS[kid.education]})`, 'good');
      autoCareerFor(state, kid);
    }
  }

  // 5-1) 아이들이 자라 꿈을 품는다
  for (const person of familyMembers(state)) {
    if (person.age === DREAM_AGE && !person.dreamId) {
      const dream = assignDream(state, person, rngFor(state));
      state.idCounter = currentIdCounter();
      if (dream) pushLog(state, dream.icon, `${fullName(person)}이(가) 꿈을 품었습니다 — ${dream.title}`);
    }
  }

  // 5-2) 이루어진 꿈
  for (const { person, dream } of checkDreams(state, lifeDeps)) {
    pushLog(state, dream.icon, `${fullName(person)}이(가) 꿈을 이뤘습니다 — ${dream.title}!`, 'good');
    pushNotice(state, {
      kind: 'dream',
      icon: dream.icon,
      title: '꿈을 이뤘습니다',
      text: `${fullName(person)}의 오랜 꿈 "${dream.title}"이(가) 이루어졌습니다.`,
      detail: dream.hint,
      tone: 'good',
      effects: dream.reward,
      personId: person.id,
    });
  }

  // 5-2b) 대를 이을 사람이 없으면 미리 알려준다
  if (!state.ended && heirCandidates(state).length === 0) {
    const yearsLeft = Math.max(0, Math.round(me.lifespan - me.age));
    if (me.age >= 45 && yearsLeft <= 25 && (state.heirWarnedAt ?? -99) + 8 < state.year) {
      state.heirWarnedAt = state.year;
      pushLog(state, '⏳', `대를 이을 사람이 없습니다. ${fullName(me)}의 시간이 얼마 남지 않았습니다.`, 'bad');
      pushNotice(state, {
        kind: 'crisis',
        icon: '⏳',
        title: '대가 끊길 위기',
        text: `${fullName(me)}에게 뒤를 이을 자손이 없습니다. 지금 가정을 이루지 않으면 가문의 이야기가 여기서 끝납니다.`,
        detail: '인연 탭에서 짝을 만나고 아이를 맞이하세요.',
        tone: 'bad',
        personId: me.id,
      });
    }
  }

  // 5-3) 위기의 시계
  const failed = tickCrisis(state, lifeDeps);
  if (failed) {
    pushNotice(state, {
      kind: 'crisisFail', icon: failed.icon, title: `${failed.title} — 막지 못했습니다`,
      text: failed.text, tone: 'bad',
    });
  }
  if (maybeStartCrisis(state, lifeDeps)) pushNotice(state, crisisNotice(state));

  // 5-4) 가문의 숙원
  tickQuest(state, lifeDeps);

  // 6) 지난 선택의 파장이 돌아온다
  fireEchoes(state);

  // 7) 사망 판정
  processDeaths(state, bonuses);

  state.stats.yearsPlayed += 1;
  state.turnFlags = { romanceUsed: false, metThisYear: false };
  runAchievementCheck(state);

  // 8) 새해 이벤트
  if (!state.ended && !state.succession) rollEvent(state);
  return state;
}

function autoCareerFor(state, person) {
  if (person.jobId || person.age < 19 || !person.alive) return;
  const rng = rngFor(state);
  const options = Object.values(JOB_BY_ID).filter((job) => canApply(person, job));
  if (options.length) {
    const job = rng.weighted(options, (j) => j.salary / 1000);
    person.jobId = job.id;
    pushLog(state, job.icon, `${fullName(person)}이(가) ${job.label} 일을 시작했습니다.`);
  }
  syncRng(state, rng);
}

function autoCareerForPartner(state) {
  const partner = partnerOf(state);
  if (!partner?.alive) return;
  if (!partner.jobId && partner.age >= 19 && partner.age < 65) autoCareerFor(state, partner);
  if (partner.jobId && partner.age >= 65) {
    pushLog(state, '🌇', `${fullName(partner)}이(가) 은퇴했습니다.`);
    partner.jobId = null;
  }
  const rng = rngFor(state);
  if (partner.jobId && rng.chance(promotionChance(partner, false))) partner.jobLevel += 1;
  partner.affection = clamp(partner.affection - 1);
  syncRng(state, rng);
}

function processDeaths(state, bonuses) {
  const rng = rngFor(state);
  for (const person of allPeople(state)) {
    if (!person.alive) continue;
    const bonus = person.inFamily ? bonuses.lifespan : 0;
    if (rng.chance(deathChance(person, bonus))) {
      person.alive = false;
      person.deathYear = state.year;
      person.deathCause = person.age >= person.lifespan ? '천수를 누리고' : '갑작스럽게';
      const isPlayer = person.id === state.playerId;
      pushLog(state, '🕯️', `${fullName(person)}이(가) ${person.age}세에 ${person.deathCause} 세상을 떠났습니다.`, 'bad');
      if (!isPlayer && person.inFamily) {
        const me = player(state);
        if (me?.alive) me.happiness = clamp(me.happiness - 12);
      }
      if (isPlayer) {
        syncRng(state, rng);
        beginSuccession(state);
        return;
      }
    }
  }
  syncRng(state, rng);
}

/**
 * 플레이어가 아닌 가족들도 나이를 먹으며 짝을 만나고 아이를 낳는다.
 * 덕분에 손주가 태어나고, 가문의 대가 끊기지 않는다.
 */
const MAX_POPULATION = 36;   // 동시에 살아 있는 가족 수 상한

function npcLife(state) {
  const rng = rngFor(state);
  const me = player(state);
  const living = allPeople(state).filter((p) => p.alive && p.inFamily);
  for (const person of living) {
    if (person.id === me.id || person.id === me.partnerId) continue;
    if (person.isCandidate) continue;

    // 어른이 되면 스스로 일자리를 찾는다 (기다리는 동안 집안 살림이 불어난다)
    if (!person.jobId && person.age >= 19 && person.age < 62) autoCareerFor(state, person);
    if (person.jobId && person.age >= 66) {
      pushLog(state, '🌇', `${fullName(person)}이(가) 은퇴했습니다.`);
      person.jobId = null;
    }
    if (person.jobId && rng.chance(promotionChance(person, false) * 0.6)) person.jobLevel += 1;

    if (person.age < 22) continue;
    // 플레이어와 가까운 세대만 이야기가 이어진다 (가족이 무한히 불어나지 않도록)
    if (person.generation < state.generation - 1) continue;

    // 결혼
    if (!person.partnerId && person.age <= 45 && living.length < MAX_POPULATION && rng.chance(0.22)) {
      const spouse = createCandidate(rng, person, state.year);
      spouse.isCandidate = false;
      spouse.inFamily = true;
      spouse.bloodline = false;
      spouse.partnerId = person.id;
      spouse.affection = 75;
      person.partnerId = spouse.id;
      state.people[spouse.id] = spouse;
      pushLog(state, '💍', `${fullName(person)}이(가) ${fullName(spouse)}와(과) 가정을 이루었습니다.`, 'good');
      continue;
    }

    // 출산
    const spouse = state.people[person.partnerId];
    if (!spouse?.alive || person.children.length >= 3) continue;
    if (living.length >= MAX_POPULATION) continue;
    const mother = person.gender === 'female' ? person : spouse;
    if (mother.age > 44) continue;
    if (!rng.chance(0.22 * birthChance(mother))) continue;

    const father = person.gender === 'female' ? spouse : person;
    const baby = createChild(rng, mother, father, state.year);
    baby.familyName = (person.bloodline ? person : spouse).familyName;
    baby.inFamily = true;
    baby.bloodline = true;
    state.people[baby.id] = baby;
    person.children.push(baby.id);
    spouse.children.push(baby.id);
    state.stats.born += 1;
    const relation = me.children.includes(person.id) ? '손주' : '가족';
    pushLog(state, '👶', `${fullName(person)}의 아이 ${fullName(baby)}이(가) 태어났습니다. (${relation})`, 'good');
  }
  syncRng(state, rng);
}

// ── 세대 계승 ─────────────────────────────────────────────

/**
 * 대를 이을 사람 찾기.
 * 직계 자녀 → 손주 → 그 외 핏줄 순으로, 한창 나이(19~45)를 앞세운다.
 */
function heirCandidates(state) {
  const me = player(state);
  if (!me) return [];
  const childIds = new Set(me.children);
  const grandchildIds = new Set(
    childrenOf(state, me).flatMap((child) => child.children),
  );
  const rank = (person) => {
    if (childIds.has(person.id)) return 0;
    if (grandchildIds.has(person.id)) return 1;
    return 2;
  };
  const prime = (person) => (person.age >= 19 && person.age <= 45 ? 0 : 1);
  return allPeople(state)
    .filter((p) => p.alive && p.inFamily && p.bloodline && p.id !== me.id)
    .sort((a, b) => rank(a) - rank(b) || prime(a) - prime(b) || b.age - a.age)
    .slice(0, 8);
}

/** 살아 있는 동안 스스로 대를 넘길 수 있는가 */
function canSucceed(state) {
  const me = player(state);
  if (!me?.alive || state.ended) return { ok: false, reason: '지금은 할 수 없습니다.' };
  const heirs = heirCandidates(state).filter((h) => h.age >= 19);
  if (!heirs.length) return { ok: false, reason: '성인이 된 자손이 있어야 합니다.' };
  return { ok: true, heirs };
}

/** 자발적 계승: 부모는 어르신으로 남아 가족과 함께 지낸다 */
function succeedTo(state, heirId) {
  const check = canSucceed(state);
  if (!check.ok) return check;
  if (!check.heirs.some((h) => h.id === heirId)) return { ok: false, reason: '대를 이을 수 없는 사람입니다.' };
  const previous = player(state);
  handOver(state, heirId, 0.9);
  previous.retired = true;
  previous.jobId = null;
  previous.happiness = clamp(previous.happiness + 8);
  pushLog(state, '🤝', `${fullName(previous)}이(가) 가문을 다음 세대에 맡기고 물러났습니다.`, 'good');
  return { ok: true };
}

function beginSuccession(state) {
  const heirs = heirCandidates(state);
  if (!heirs.length) {
    endGame(state, '가문의 이야기가 여기서 멈췄습니다. 뒤를 이을 사람이 없었습니다.');
    return;
  }
  state.succession = { heirIds: heirs.map((h) => h.id) };
}

/** 실제 계승 처리 (사망 시 / 자발적 계승 공통) */
function handOver(state, heirId, baseRate) {
  const previous = player(state);
  const heir = state.people[heirId];
  const rate = Math.min(1, baseRate + (state.inheritBonus ?? 0));
  const inherited = Math.round(state.money * rate);
  state.money = inherited;
  state.playerId = heir.id;
  heir.isPlayer = true;
  heir.independent = false;
  previous.isPlayer = false;
  state.generation = heir.generation;
  state.pending = null;
  state.succession = null;
  state.turnFlags = { romanceUsed: false, metThisYear: false };
  state.activity = heir.age >= 6 ? 'study' : 'rest';

  // 대를 잇지 않은 형제자매는 각자의 삶을 살아간다
  for (const sibling of childrenOf(state, previous)) {
    if (sibling.id !== heir.id && sibling.alive && sibling.age >= 19) sibling.independent = true;
  }
  pushLog(
    state, '🌳',
    `${state.generation}대 ${fullName(heir)}이(가) 가문을 잇습니다. (상속 ${inherited.toLocaleString('ko-KR')}만원)`,
    'good',
  );

        ${crisis.remaining <= state.money ? `한 번에 해결 (${won(crisis.remaining)})` : `가진 돈 모두 내기 (${won(crisis.payAmount)})`}
      </button>
      ${crisis.checkStat ? `
        <button data-act="crisis-try" ${crisis.canTry ? '' : 'disabled'}>
          ${crisis.tried ? '올해는 이미 시도함' : `직접 부딪힌다 (${STAT_LABELS[crisis.checkStat]} · ${crisis.odds}%)`}
        </button>` : ''}
    </div>
    <p class="muted">기한을 넘기면 가문이 실제로 손해를 봅니다.</p>
  </div>`;
}

function lifeTab(state) {
  const me = G.player(state);
  const finance = G.financeSummary(state);
  const activities = G.availableActivities(state).map((a) => `
    <button class="pill ${state.activity === a.id ? 'on' : ''} ${a.risky ? 'risky' : ''}" data-act="activity" data-id="${a.id}" title="${esc(a.desc)}">
      ${a.icon} ${a.label}
    </button>`).join('');

  const risky = new Set(G.ACTIVITIES.filter((a) => a.risky).map((a) => a.id));
  const blocked = !G.canAdvance(state);
  const blockReason = state.rewardQueue?.length
    ? '먼저 보상을 선택하세요'
    : state.pending && !state.pending.resolved
      ? '먼저 이번 이벤트를 마무리하세요'
      : '지금은 한 해를 보낼 수 없습니다';
  return `
  ${crisisPanel(state)}
  <div class="card">
    <div class="section-head"><h2>올해는 무엇을 할까요?</h2><span class="muted">${state.year}년 · ${me.age}세</span></div>
    <div class="pill-row">${activities}</div>
    <p class="muted" style="margin-top:10px">${esc(G.ACTIVITY_BY_ID[state.activity]?.desc ?? '')}</p>
    <button class="primary wide" data-act="advance" ${blocked ? 'disabled' : ''}>
      ${blocked ? blockReason : '한 해를 보낸다 →'}
    </button>
    <div class="auto-bar">
      <button class="pill ${state.auto?.running ? 'on' : ''}" data-act="auto-toggle">
        ${state.auto?.running ? '⏸ 자동 진행 중' : '▶ 자동으로 흘려보내기'}
      </button>
      ${[['slow', '🐢 느리게'], ['normal', '🚶 보통'], ['fast', '🐇 빠르게']].map(([id, label]) => `
        <button class="pill small ${state.auto?.speed === id ? 'on' : ''}" data-act="auto-speed" data-id="${id}">${label}</button>`).join('')}
    </div>
    <p class="muted auto-hint">
      자동으로 두면 해가 저절로 흐르고, 가족들이 일해 돈을 벌다가 사건이 생기면 멈춥니다.
    </p>
  </div>

  <div class="card">
    <h3>살림살이 (연간)</h3>
    <div class="list">
      <div class="item"><span class="grow"><span class="t">수입</span><span class="s">일하는 가족 ${finance.earners}명${finance.support ? ` + 분가한 가족 ${won(finance.support)}` : ''} + 마을 수익</span></span><span>${won(finance.income)}</span></div>
      <div class="item"><span class="grow"><span class="t">지출</span><span class="s">생활비 + 마을 관리비 ${won(finance.maintenance)}</span></span><span>-${won(finance.expense)}</span></div>
      <div class="item"><span class="grow"><span class="t">한 해 수지</span></span>
        <strong style="color:${finance.net >= 0 ? 'var(--green)' : 'var(--bad)'}">${finance.net >= 0 ? '+' : ''}${won(finance.net)}</strong>
      </div>
    </div>
  </div>

  ${state.echoes?.length ? `
  <div class="card">
    <h3>🦋 씨앗이 된 선택</h3>
    <p class="muted">언젠가 돌아올 선택 ${state.echoes.length}가지가 자라고 있습니다.</p>
    <div class="list">
      ${state.echoes.slice(0, 4).map((echo) => `
        <div class="item">
          <span class="grow">
            <span class="t">${esc(fillEcho(state, echo.fromTitle))}</span>
            <span class="s">"${esc(fillEcho(state, echo.fromLabel))}" · ${Math.max(1, echo.dueYear - state.year)}년쯤 뒤</span>
          </span>
        </div>`).join('')}
    </div>
  </div>` : ''}

  <div class="card">
    <h3>인생 기록</h3>
    <div class="log">
      ${state.log.slice(0, 40).map((l) => `
        <div class="log-line ${l.tone}"><span class="y">${l.year}</span><span>${l.icon} ${esc(l.text)}</span></div>`).join('')}
    </div>
  </div>`;
}

const fillEcho = (state, text) => G.fillText(state, text);

// ── 인연 탭 ───────────────────────────────────────────────

function loveTab(state) {
  const me = G.player(state);
  const partner = G.partnerOf(state);
  const kids = G.childrenOf(state, me);

  if (me.age < 18) {
    return `<div class="card"><h2>💞 인연</h2><p class="muted">아직은 이릅니다. 18세부터 새로운 사람을 만날 수 있어요.</p></div>`;
  }

  if (!partner) {
    const list = G.candidates(state);
    const cards = list.map((c) => `
      <div class="item">
        ${portrait(c, 58, { ageTag: true })}
        <span class="grow">
          <span class="t">${esc(fullName(c))} <span class="muted">${c.age}세</span></span>
          <span class="s">${traitBadges(c) || '평범한 사람'}</span>
          <span class="s">호감도 ${Math.round(c.affection)} / 100</span>
          <span class="bar happy" style="margin-top:4px"><i style="width:${Math.round(c.affection)}%"></i></span>
        </span>
        <span style="display:grid;gap:6px">
          <button data-act="date" data-id="${c.id}" ${state.turnFlags.romanceUsed ? 'disabled' : ''}>데이트 (${won(G.DATE_COST)})</button>
          <button class="primary" data-act="propose" data-id="${c.id}" ${c.affection < 70 || state.money < G.MARRIAGE_COST ? 'disabled' : ''}>청혼 (${won(G.MARRIAGE_COST)})</button>
        </span>
      </div>`).join('');

    return `
    <div class="card">
      <div class="section-head"><h2>💞 인연 만들기</h2><span class="muted">호감도 70 이상이면 청혼할 수 있어요</span></div>
      <button class="wide" data-act="meet" ${state.turnFlags.metThisYear || me.partnerId ? 'disabled' : ''}>
        ${state.turnFlags.metThisYear ? '올해는 이미 만남을 가졌습니다' : `새로운 사람 만나기 (${won(G.MEET_COST)})`}
      </button>
      <div class="list" style="margin-top:12px">${cards || '<p class="muted">아직 만난 사람이 없습니다.</p>'}</div>
    </div>`;
  }

  const birth = G.canHaveChild(state);
  return `
  <div class="card">
    <h2>💞 우리 가족</h2>
    <div class="item">
      ${portrait(partner, 64, { ageTag: true })}
      <span class="grow">
        <span class="t">${esc(fullName(partner))} <span class="muted">${partner.age}세 · ${jobLabel(partner)}</span></span>
        <span class="s">${traitBadges(partner)}</span>
        <span class="s">애정 ${Math.round(partner.affection)} / 100</span>
        <span class="bar happy" style="margin-top:4px"><i style="width:${Math.round(partner.affection)}%"></i></span>
      </span>
    </div>
    <button class="primary wide" style="margin-top:12px" data-act="have-child" ${birth.ok ? '' : 'disabled'}>
      ${birth.ok ? `아이를 갖는다 (${won(G.CHILD_COST_ONCE)})` : esc(birth.reason)}
    </button>
  </div>

  <div class="card">
    <h3>자녀 ${kids.length}명</h3>
    <div class="people-row">
      ${kids.length ? kids.map((k) => personCard(state, k)).join('') : '<p class="muted">아직 아이가 없습니다.</p>'}
    </div>
  </div>`;
}

// ── 직업 탭 ───────────────────────────────────────────────

function careerTab(state) {
  const me = G.player(state);
  const options = G.jobOptions(state);
  const items = options.map((job) => {
    const reason = me.education < job.edu
      ? `${EDUCATION_LABELS[job.edu]} 이상 필요`
      : Object.entries(job.req).filter(([k, v]) => me.stats[k] < v).map(([k, v]) => `${STAT_LABELS[k]} ${v}`).join(', ');
    return `
    <div class="item ${job.eligible ? '' : 'locked'}">
      <span style="font-size:1.6rem">${job.icon}</span>
      <span class="grow">
        <span class="t">${job.label} ${job.current ? '<span class="badge accent">현재</span>' : ''}</span>
        <span class="s">예상 연봉 ${won(job.expected)} · ${EDUCATION_LABELS[job.edu]}${reason && !job.eligible ? ` · 부족: ${esc(reason)}` : ''}</span>
      </span>
      <button data-act="take-job" data-id="${job.id}" ${job.eligible && !job.current && me.age >= 19 ? '' : 'disabled'}>
        ${job.current ? '재직 중' : '지원'}
      </button>
    </div>`;
  }).join('');

  return `
  <div class="card">
    <div class="section-head"><h2>💼 직업</h2><span class="muted">${jobLabel(me)}</span></div>
    <p class="muted">
      학력 ${EDUCATION_LABELS[me.education]} · 호봉 ${me.jobLevel}/${MAX_JOB_LEVEL}
      ${me.jobId ? ` · 현재 연봉 ${won(salaryOf(me, G.financeSummary(state).bonuses))}` : ''}
    </p>
    ${me.age >= 55 && me.jobId ? '<button class="ghost wide" data-act="retire">은퇴하기</button>' : ''}
  </div>
  <div class="card"><div class="list">${items}</div></div>`;
}

// ── 가족 탭 ───────────────────────────────────────────────

function personCard(state, person) {
  const me = G.player(state);
  const classes = ['person-card'];
  if (person.id === me.id) classes.push('me');
  if (!person.alive) classes.push('dead');
  const meta = person.alive
    ? `${person.age}세 · ${person.jobId ? JOB_BY_ID[person.jobId].label : (person.age >= 19 ? '무직' : '학생')}`
    : `${person.birthYear}–${person.deathYear}`;
  return `
    <button class="${classes.join(' ')}" data-act="person" data-id="${person.id}">
      ${portrait(person, 60, { ageTag: true })}
      <div class="pname">${esc(fullName(person))}</div>
      <div class="pmeta">${meta}</div>
      <div class="pmeta">${person.traits.map((id) => TRAIT_BY_ID[id]?.icon ?? '').join('')}</div>
    </button>`;
}

function familyTab(state) {
  const living = G.allPeople(state).filter((p) => p.alive && p.inFamily).length;
  const total = G.allPeople(state).length;
  return `
  <div class="card">
    <div class="section-head">
      <h2>🌳 족보</h2>
      <span class="muted">${state.generation}대 · 생존 ${living}명 / 기록 ${total}명</span>
    </div>
    <p class="muted">인물을 누르면 자세히 볼 수 있습니다. 옆으로 밀어 넓게 볼 수 있어요.</p>
    ${familyTree(state)}
  </div>`;
}

// ── 마을 탭 ───────────────────────────────────────────────

function villageTab(state) {
  const level = villageLevel(state.village);
  const items = BUILDINGS.map((building) => {
    const current = state.village.buildings[building.id] ?? 0;
    const status = buildStatus(state.village, building.id, state.money);
    const cost = status.cost ?? buildCost(building, current);
    const effect = current > 0 ? describeEffect(building.effect(current)) : '';
    return `
    <div class="item ${status.ok ? '' : 'locked'}">
      <span style="font-size:1.7rem">${building.icon}</span>
      <span class="grow">
        <span class="t">${building.label} ${current ? `<span class="badge">Lv.${current}</span>` : ''}</span>
        <span class="s">${esc(building.desc)}</span>
        ${effect ? `<span class="s">현재 효과: ${effect}</span>` : ''}
      </span>
      <button data-act="build" data-id="${building.id}" ${status.ok ? '' : 'disabled'}>
        ${status.maxed ? '최대' : `${current ? '증축' : '건설'} ${won(cost)}`}
      </button>
    </div>`;
  }).join('');

  return `
  <div class="card">
    <div class="section-head">
      <h2>🏙 ${esc(state.village.name)}</h2>
      <span class="muted">${villageTitle(level)} · Lv.${level} · 명성 ${Math.round(state.village.fame ?? 0)}</span>
    </div>
    <p class="muted">건물은 매년 ${won(villageMaintenance(state.village))}의 관리비가 듭니다.</p>
  </div>
  <div class="card"><div class="list">${items}</div></div>`;
}

function describeEffect(effect) {
  const parts = [];
  if (effect.income) parts.push(`수입 +${won(effect.income)}`);
  if (effect.incomeRate) parts.push(`소득 +${Math.round(effect.incomeRate * 100)}%`);
  if (effect.expenseRate) parts.push(`생활비 ${Math.round(effect.expenseRate * 100)}%`);
  if (effect.happiness) parts.push(`행복 +${effect.happiness.toFixed(1)}`);
  if (effect.lifespan) parts.push(`수명 +${effect.lifespan.toFixed(1)}`);
  if (effect.romance) parts.push('인연 확률 ↑');
  for (const [key, value] of Object.entries(effect.grow ?? {})) {
    parts.push(`${STAT_LABELS[key]} 성장 +${value.toFixed(1)}`);
  }
  return parts.join(' · ');
}

// ── 유산 탭 ───────────────────────────────────────────────

function legacyTab(state) {
  const me = G.player(state);
  const succession = G.canSucceed(state);
  const heirs = succession.ok ? succession.heirs : [];
  const living = G.allPeople(state).filter((p) => p.alive && p.inFamily).length;

  return `
  <div class="card">
    <h2>📜 가문의 유산</h2>
    <div class="list">
      <div class="item"><span class="grow"><span class="t">세대</span></span><span>${state.generation}대</span></div>
      <div class="item"><span class="grow"><span class="t">함께 사는 가족</span></span><span>${living}명</span></div>
      <div class="item"><span class="grow"><span class="t">태어난 아이</span></span><span>${state.stats.born}명</span></div>
      <div class="item"><span class="grow"><span class="t">지은 건물</span></span><span>${state.stats.buildingsBuilt}채</span></div>
      <div class="item"><span class="grow"><span class="t">이룬 꿈</span><span class="s">가족이 이룬 꿈의 수</span></span><span>${state.stats.dreamsFulfilled ?? 0}개</span></div>
      <div class="item"><span class="grow"><span class="t">넘긴 위기</span><span class="s">막지 못한 위기 ${state.stats.crisesFailed ?? 0}번</span></span><span>${state.stats.crisesSurvived ?? 0}번</span></div>
      <div class="item"><span class="grow"><span class="t">이룬 숙원</span></span><span>${state.stats.questsDone ?? 0}번</span></div>
      <div class="item"><span class="grow"><span class="t">최고 자산</span></span><span>${won(state.stats.peakMoney)}</span></div>
      <div class="item"><span class="grow"><span class="t">현재 유산 점수</span></span><strong>${G.legacyScore(state).toLocaleString('ko-KR')}점</strong></div>
    </div>
  </div>

  <div class="card">
    <h3>가족의 꿈</h3>
    <div class="list">
      ${G.allPeople(state).filter((p) => p.alive && p.inFamily && p.dreamId).slice(0, 8).map((person) => {
        const dream = G.dreamFor(person);
        return `
        <div class="item ${person.dreamDone ? 'achieve done' : ''}">
          <span class="achieve-icon">${dream.icon}</span>
          <span class="grow">
            <span class="t">${esc(fullName(person))} <span class="muted">${G.relationOf(state, person)}</span></span>
            <span class="s">${esc(dream.title)}${person.dreamDone ? ` · ${person.dreamYear}년에 이룸` : ''}</span>
          </span>
          ${person.dreamDone ? '<span class="achieve-check">✔</span>' : ''}
        </div>`;
      }).join('') || '<p class="muted">아직 꿈을 품은 가족이 없습니다.</p>'}
    </div>
  </div>

  <div class="card">
    <h3>대를 잇기</h3>
    <p class="muted">
      ${succession.ok
        ? `${esc(fullName(me))}이(가) 물러나고 다음 세대가 이야기를 이어갑니다. 자산의 90%가 전해지고, 물러난 분은 가족과 함께 지냅니다.`
        : esc(succession.reason)}
    </p>
    <div class="list">
      ${heirs.map((h) => `
        <div class="item">
          ${portrait(h, 54, { ageTag: true })}
          <span class="grow"><span class="t">${esc(fullName(h))}</span><span class="s">${h.age}세 · ${jobLabel(h)} · ${h.generation}대</span></span>
          <button class="primary" data-act="succeed" data-id="${h.id}">이 사람에게</button>
        </div>`).join('')}
    </div>
  </div>

  <div class="card">
    <h3>게임 관리</h3>
    <p class="muted">이 브라우저에 자동 저장됩니다. 다른 기기로 옮기려면 저장 데이터를 복사해 두세요.</p>
    <div class="footer-actions">
      <button data-act="save">💾 지금 저장</button>
      <button data-act="copy-save">📋 저장 데이터 복사</button>
      <button data-act="open-import">📥 불러오기</button>
      <button class="ghost" data-act="restart">🔄 새로 시작</button>
    </div>
  </div>`;
}

// ── 모달 ─────────────────────────────────────────────────

function eventModal(state, event) {
  if (event.resolved) {
    return modal(`
      ${event.tag === 'absurd' ? '<span class="tag-absurd">🤪 병맛 사건</span>' : ''}
      <div class="icon">${event.icon}</div>
      <h2>${esc(event.title)}</h2>
      <p class="muted">${esc(event.resolved.label)}${event.resolved.success === true ? ' · <span class="ok">성공</span>' : event.resolved.success === false ? ' · <span class="fail">실패</span>' : ''}</p>
      <div class="result-box">${esc(event.resolved.text)}</div>
      ${effectChips(event.resolved.effects, { cost: event.resolved.cost })}
      <button class="primary wide" data-act="event-close">계속하기</button>`, event.tag === 'absurd' ? 'absurd' : '');
  }
  const choices = event.choices.map((choice) => `
    <button class="choice" data-act="event-choice" data-id="${choice.index}" ${choice.affordable ? '' : 'disabled'}>
      ${esc(choice.label)}
      <span class="c-sub">
        ${choice.cost ? `비용 ${won(choice.cost)}${choice.affordable ? '' : ' (자금 부족)'}` : ''}
        ${choice.odds != null ? `${choice.cost ? ' · ' : ''}${STAT_LABELS[choice.checkLabel]} 판정 · 성공률 ${choice.odds}%` : ''}
        ${choice.echoHint ? `${choice.cost || choice.odds != null ? ' · ' : ''}<span class="echo-hint">🦋 훗날에 영향</span>` : ''}
      </span>
    </button>`).join('');

  return modal(`
    ${event.tag === 'absurd' ? '<span class="tag-absurd">🤪 병맛 사건</span>' : ''}
    <div class="event-head">
      ${event.actorPerson ? portrait(event.actorPerson, 62, { ageTag: true }) : `<div class="icon">${event.icon}</div>`}
      <div class="event-who">
        <span class="badge accent">${event.icon} ${esc(event.relation ?? '가족')}</span>
        <h2>${esc(event.title)}</h2>
      </div>
    </div>
    <p>${esc(event.text)}</p>
    <div class="choice-grid">${choices}</div>`, event.tag === 'absurd' ? 'absurd' : '');
}

function successionModal(state) {
  const heirs = state.succession.heirIds.map((id) => state.people[id]).filter(Boolean);
  return modal(`
    <div class="icon">🕯️</div>
    <h2>가문을 이어갈 사람</h2>
    <p>주인공이 세상을 떠났습니다. 이야기를 이어갈 사람을 선택하세요. (자산의 70%가 상속됩니다)</p>
    <div class="list">
      ${heirs.map((h) => `
        <div class="item">
          ${portrait(h, 54, { ageTag: true })}
          <span class="grow"><span class="t">${esc(fullName(h))}</span><span class="s">${h.age}세 · ${h.generation}대 · ${jobLabel(h)}</span></span>
          <button class="primary" data-act="choose-heir" data-id="${h.id}">선택</button>
        </div>`).join('')}
    </div>`);
}

const NOTICE_STYLE = {
  echo: { tag: '🦋 나비효과', cls: 'echo', button: '그렇게 되었습니다' },
  dream: { tag: '⭐ 꿈을 이루다', cls: 'dream-modal', button: '축하합니다' },
  crisis: { tag: '⚠️ 위기', cls: 'crisis-modal', button: '어떻게든 해보겠습니다' },
  crisisFail: { tag: '💔 막지 못했다', cls: 'crisis-modal', button: '받아들인다' },
};

function echoModal(state, notice) {
  const style = NOTICE_STYLE[notice.kind] ?? NOTICE_STYLE.echo;
  return modal(`
