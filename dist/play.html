대에 오른다', check: { stat: 'charm', difficulty: 55 }, success: { text: '마을의 스타가 되었습니다!', effects: { happiness: 8, stats: { charm: 5 }, money: 200 } }, fail: { text: '박수는 받았지만 얼굴이 화끈했습니다.', effects: { happiness: 2, stats: { charm: 2 } } } },\n      { label: '먹거리 장사를 한다', cost: 100, result: '재료비를 빼고도 남았습니다.', effects: { money: 400, stats: { fitness: -1 } } },\n      { label: '가족과 구경만 한다', result: '솜사탕이 달았습니다.', effects: { happiness: 5, childHappiness: 5 } },\n    ],\n  },\n  {\n    id: 'neighbor_help', icon: '🤝', title: '이웃의 부탁', weight: 3, minAge: 18,\n    text: '{village} 이웃이 도움을 청합니다.',\n    choices: [\n      { label: '기꺼이 돕는다', result: '마을에 {me}의 편이 늘었습니다.', effects: { happiness: 4, stats: { charm: 3 }, villageFame: 2 } },\n      { label: '돈으로 돕는다', cost: 200, result: '고맙다는 인사가 오래갔습니다.', effects: { happiness: 2, villageFame: 3 } },\n      { label: '사정을 말하고 거절한다', result: '조금 미안한 마음이 남았습니다.', effects: { happiness: -2 } },\n    ],\n  },\n  {\n    id: 'stray_cat', icon: '🐈', title: '문 앞의 고양이', weight: 2, minAge: 6,\n    text: '작은 고양이가 집 앞에 앉아 있습니다.',\n    choices: [\n      { label: '가족으로 맞이한다', cost: 80, result: '이름을 짓는 데 사흘이 걸렸습니다.', effects: { happiness: 8, childHappiness: 6, expenseUp: 1 } },\n      { label: '밥만 챙겨준다', result: '가끔 들르는 사이가 되었습니다.', effects: { happiness: 3 } },\n    ],\n  },\n  // ── 중년/노년 ───────────────────────────────────────────\n  {\n    id: 'health_check', icon: '🩺', title: '건강검진', weight: 4, minAge: 40,\n    text: '검진 결과지를 받았습니다.',\n    choices: [\n      { label: '생활 습관을 바꾼다', cost: 200, result: '아침 산책이 습관이 되었습니다.', effects: { stats: { health: 7, fitness: 3 }, lifespan: 2 } },\n      { label: '괜찮겠지 하고 넘긴다', result: '결과지는 서랍 속으로 들어갔습니다.', effects: { stats: { health: -4 }, lifespan: -2, money: 100 } },\n    ],\n  },\n  {\n    id: 'second_chance', icon: '🌅', title: '늦은 도전', weight: 3, minAge: 45, maxAge: 70,\n    text: '{me}은(는) 오래 미뤄둔 일을 떠올렸습니다.',\n    choices: [\n      { label: '지금이라도 시작한다', cost: 300, result: '늦은 시작이 가장 즐거웠습니다.', effects: { happiness: 10, stats: { creativity: 6 }, addTrait: 'dreamer' } },\n      { label: '가족을 위해 접어둔다', result: '대신 아이의 꿈을 응원했습니다.', effects: { childHappiness: 8, happiness: 2 } },\n    ],\n  },\n  {\n    id: 'legacy_talk', icon: '🕯️', title: '물려줄 것', weight: 3, minAge: 60, needsChild: true,\n    text: '{me}은(는) {child}에게 무엇을 남길지 생각합니다.',\n    choices: [\n      { label: '재산을 정리해 물려준다', result: '숫자보다 마음이 먼저 전해졌습니다.', effects: { childHappiness: 6, inheritBonus: 0.1 } },\n      { label: '살아온 이야기를 들려준다', result: '{child}은(는) 그날 밤을 평생 기억합니다.', effects: { childHappiness: 10, childStats: { intellect: 4, charm: 4 } } },\n      { label: '집과 마을을 더 가꾼다', cost: 500, result: '다음 세대가 살아갈 자리가 넓어졌습니다.', effects: { villageFame: 5, happiness: 5 } },\n    ],\n  },\n  {\n    id: 'grandchild', icon: '🧸', title: '손주', weight: 3, minAge: 55, needsGrandchild: true,\n    text: '작은 손이 {me}의 손가락을 꼭 쥐었습니다.',\n    choices: [\n      { label: '온종일 놀아준다', result: '허리는 아프지만 하루가 짧았습니다.', effects: { happiness: 12, stats: { health: -1 } } },\n      { label: '용돈을 쥐여준다', cost: 150, result: '\"할머니 할아버지 최고!\"', effects: { happiness: 7, childHappiness: 5 } },\n    ],\n  },\n  {\n    id: 'quiet_year', icon: '🍵', title: '조용한 한 해', weight: 5, minAge: 5,\n    text: '특별한 일 없이 계절이 지나갔습니다.',\n    choices: [\n      { label: '평범함에 감사한다', result: '이런 해도 인생의 일부입니다.', effects: { happiness: 3, stats: { health: 1 } } },\n      { label: '뭔가 새로 배워본다', cost: 100, result: '작은 취미가 하나 늘었습니다.', effects: { stats: { creativity: 3, intellect: 2 } } },\n    ],\n  },\n];\n\nexport const EVENT_BY_ID = Object.fromEntries(EVENTS.map((e) => [e.id, e]));\n","deps":[]},{"path":"src/core/game.js","code":"// 게임 엔진: 상태 하나(state)에 모든 것이 담기고, 함수들이 그 상태를 나아가게 한다.\nimport { createRng } from './rng.js';\nimport { clamp, STAT_KEYS, average, EDUCATION_LABELS } from './util.js';\nimport {\n  makePerson, createFounder, createCandidate, createChild, ageOneYear,\n  updateEducation, deathChance, fullName, nextId, resetIdCounter, currentIdCounter,\n} from './person.js';\nimport { createVillage, villageBonuses, villageLevel, villageMaintenance, build as buildInVillage } from './village.js';\nimport { householdIncome, householdExpense, promotionChance, salaryOf, MAX_JOB_LEVEL } from './economy.js';\nimport { JOB_BY_ID, canApply } from '../data/jobs.js';\nimport { EVENTS } from '../data/events.js';\nimport { TRAIT_BY_ID } from '../data/traits.js';\nimport { VILLAGE_NAMES } from '../data/names.js';\n\nexport const START_YEAR = 2000;\nexport const MARRIAGE_COST = 1500;\nexport const CHILD_COST_ONCE = 400;\nexport const MEET_COST = 80;\nexport const DATE_COST = 60;\n\n/** 매년 고르는 한 가지 활동 */\nexport const ACTIVITIES = [\n  { id: 'study', label: '공부', icon: '📚', desc: '지능이 오르고 학업이 쌓입니다.', minAge: 6 },\n  { id: 'exercise', label: '운동', icon: '🏃', desc: '체력과 건강이 오릅니다.', minAge: 5 },\n  { id: 'art', label: '예술 활동', icon: '🎨', desc: '창의력이 오릅니다.', minAge: 5 },\n  { id: 'social', label: '사교 활동', icon: '💬', desc: '매력이 오르고 인연이 가까워집니다.', minAge: 10 },\n  { id: 'work', label: '일에 집중', icon: '💼', desc: '승진 확률과 수입이 오릅니다.', minAge: 19, needsJob: true },\n  { id: 'family', label: '가족과 시간', icon: '🏡', desc: '가족 모두의 행복이 오릅니다.', minAge: 0 },\n  { id: 'rest', label: '휴식', icon: '🌿', desc: '건강과 행복을 회복합니다.', minAge: 0 },\n];\n\nexport const ACTIVITY_BY_ID = Object.fromEntries(ACTIVITIES.map((a) => [a.id, a]));\n\n// ── 상태 만들기 ────────────────────────────────────────────\n\nexport function newGame({ seed = Date.now(), familyName, givenName, gender, traitId, villageName } = {}) {\n  resetIdCounter(1);\n  const rng = createRng(seed);\n  const founder = createFounder(rng, { gender, familyName, givenName, year: START_YEAR, traitId });\n  const state = {\n    seed,\n    rngState: rng.state,\n    idCounter: currentIdCounter(),\n    year: START_YEAR,\n    generation: 1,\n    playerId: founder.id,\n    people: { [founder.id]: founder },\n    money: 2600,\n    upkeep: 0,\n    village: createVillage(villageName || rng.pick(VILLAGE_NAMES)),\n    log: [],\n    pending: null,\n    seenEvents: [],\n    turnFlags: { romanceUsed: false, metThisYear: false },\n    activity: 'study',\n    succession: null,\n    ended: null,\n    stats: { yearsPlayed: 0, born: 0, married: 0, buildingsBuilt: 0, peakMoney: 2600 },\n  };\n  pushLog(state, '🌱', `${fullName(founder)}의 이야기가 ${state.village.name}에서 시작됩니다.`, 'good');\n  return state;\n}\n\n/** 저장된 상태를 이어받을 때 id 카운터를 복구한다 */\nexport function rehydrate(state) {\n  resetIdCounter(state.idCounter ?? Object.keys(state.people).length + 1);\n  return state;\n}\n\nconst rngFor = (state) => {\n  const rng = createRng(state.seed);\n  rng.state = state.rngState;\n  return rng;\n};\nconst syncRng = (state, rng) => {\n  state.rngState = rng.state;\n  state.idCounter = currentIdCounter();\n};\n\n// ── 조회 헬퍼 ──────────────────────────────────────────────\n\nexport const player = (state) => state.people[state.playerId];\nexport const personOf = (state, id) => (id ? state.people[id] : null);\nexport const partnerOf = (state) => personOf(state, player(state)?.partnerId);\nexport const allPeople = (state) => Object.values(state.people);\n\n/** 같이 사는 가족: 나 + 배우자 + 미성년 자녀 + 모시는 부모님 */\nexport function household(state) {\n  const me = player(state);\n  if (!me) return [];\n  const members = [me];\n  const partner = partnerOf(state);\n  if (partner?.alive) members.push(partner);\n  for (const childId of me.children) {\n    const child = state.people[childId];\n    if (child?.alive && child.age < 19) members.push(child);\n  }\n  for (const elder of eldersOf(state)) members.push(elder);\n  return members;\n}\n\n/** 함께 사는 부모님(전 세대 플레이어와 그 배우자) */\nexport function eldersOf(state) {\n  const me = player(state);\n  if (!me) return [];\n  return me.parents\n    .map((id) => state.people[id])\n    .filter((p) => p?.alive && p.inFamily);\n}\n\n/** 화면에 보여줄 가족 구성원 (생존자 전원) */\nexport function familyMembers(state) {\n  return allPeople(state).filter((p) => p.alive && p.inFamily);\n}\n\nexport const childrenOf = (state, person) => person.children.map((id) => state.people[id]).filter(Boolean);\n\nexport function candidates(state) {\n  return allPeople(state).filter((p) => p.isCandidate && p.alive && !p.partnerId);\n}\n\nexport function pushLog(state, icon, text, tone = 'normal') {\n  state.log.unshift({ year: state.year, icon, text, tone });\n  if (state.log.length > 300) state.log.length = 300;\n}\n\n/** 텍스트의 {me} {partner} {child} {village} 치환 */\nexport function fillText(state, text) {\n  const me = player(state);\n  const partner = partnerOf(state);\n  const kids = me ? childrenOf(state, me).filter((c) => c.alive) : [];\n  return String(text)\n    .replaceAll('{me}', me ? fullName(me) : '주인공')\n    .replaceAll('{partner}', partner ? fullName(partner) : '배우자')\n    .replaceAll('{child}', kids.length ? fullName(kids[0]) : '아이')\n    .replaceAll('{village}', state.village.name);\n}\n\n// ── 효과 적용 ──────────────────────────────────────────────\n\nexport function applyEffects(state, effects = {}) {\n  const me = player(state);\n  const rng = rngFor(state);\n  if (effects.money) state.money += effects.money;\n  if (effects.happiness) me.happiness = clamp(me.happiness + effects.happiness);\n  if (effects.stats) {\n    for (const [key, value] of Object.entries(effects.stats)) {\n      if (STAT_KEYS.includes(key)) me.stats[key] = clamp(me.stats[key] + value);\n    }\n  }\n  if (effects.education) me.eduPoints = Math.max(0, me.eduPoints + effects.education * 8);\n  if (effects.lifespan) me.lifespan += effects.lifespan;\n  if (effects.affection) {\n    const partner = partnerOf(state);\n    if (partner) partner.affection = clamp(partner.affection + effects.affection);\n  }\n  if (effects.addTrait && !me.traits.includes(effects.addTrait) && TRAIT_BY_ID[effects.addTrait]) {\n    me.traits.push(effects.addTrait);\n    pushLog(state, '✨', `${fullName(me)}에게 새로운 특성 \"${TRAIT_BY_ID[effects.addTrait].label}\"이(가) 생겼습니다.`, 'good');\n  }\n  if (effects.promote && me.jobId && me.jobLevel < MAX_JOB_LEVEL) {\n    me.jobLevel = Math.min(MAX_JOB_LEVEL, me.jobLevel + effects.promote);\n    pushLog(state, '📈', `${fullName(me)}이(가) 승진했습니다. (${me.jobLevel}호봉)`, 'good');\n  }\n  if (effects.villageFame) state.village.fame = (state.village.fame ?? 0) + effects.villageFame;\n  if (effects.expenseUp) state.upkeep += effects.expenseUp;\n  if (effects.inheritBonus) state.inheritBonus = (state.inheritBonus ?? 0) + effects.inheritBonus;\n\n  const kids = childrenOf(state, me).filter((c) => c.alive);\n  if (effects.childHappiness) {\n    for (const kid of kids) kid.happiness = clamp(kid.happiness + effects.childHappiness);\n  }\n  if (effects.childStats && kids.length) {\n    const target = kids[0];\n    for (const [key, value] of Object.entries(effects.childStats)) {\n      if (STAT_KEYS.includes(key)) {\n        target.stats[key] = clamp(target.stats[key] + value);\n        target.potential[key] = clamp(target.potential[key] + value / 2);\n      }\n    }\n  }\n  syncRng(state, rng);\n}\n\n// ── 연간 활동 ──────────────────────────────────────────────\n\nfunction applyActivity(state, activityId) {\n  const me = player(state);\n  const rng = rngFor(state);\n  const gain = (key, amount) => { me.stats[key] = clamp(me.stats[key] + amount); };\n  switch (activityId) {\n    case 'study':\n      gain('intellect', 3 + rng.int(0, 2));\n      me.eduPoints += 10;\n      me.happiness = clamp(me.happiness - 1);\n      break;\n    case 'exercise':\n      gain('fitness', 3 + rng.int(0, 2));\n      gain('health', 2);\n      break;\n    case 'art':\n      gain('creativity', 3 + rng.int(0, 2));\n      me.happiness = clamp(me.happiness + 1);\n      break;\n    case 'social': {\n      gain('charm', 3 + rng.int(0, 2));\n      const partner = partnerOf(state);\n      if (partner) partner.affection = clamp(partner.affection + 4);\n      break;\n    }\n    case 'work': {\n      if (me.jobId && rng.chance(promotionChance(me, true))) {\n        me.jobLevel += 1;\n        pushLog(state, '📈', `${fullName(me)}이(가) 승진했습니다. (${me.jobLevel}호봉)`, 'good');\n      }\n      const job = JOB_BY_ID[me.jobId];\n      if (job) gain(job.stat, 2);\n      me.happiness = clamp(me.happiness - 2);\n      break;\n    }\n    case 'family': {\n      me.happiness = clamp(me.happiness + 4);\n      const partner = partnerOf(state);\n      if (partner) {\n        partner.affection = clamp(partner.affection + 5);\n        partner.happiness = clamp(partner.happiness + 3);\n      }\n      for (const kid of childrenOf(state, me)) {\n        if (kid.alive) {\n          kid.happiness = clamp(kid.happiness + 5);\n          kid.potential.charm = clamp(kid.potential.charm + 0.5);\n        }\n      }\n      break;\n    }\n    case 'rest':\n    default:\n      gain('health', 3);\n      me.happiness = clamp(me.happiness + 3);\n      break;\n  }\n  syncRng(state, rng);\n}\n\nexport function availableActivities(state) {\n  const me = player(state);\n  return ACTIVITIES.filter((a) => me.age >= a.minAge && (!a.needsJob || me.jobId));\n}\n\n// ── 이벤트 ────────────────────────────────────────────────\n\nexport function eligibleEvents(state) {\n  const me = player(state);\n  const partner = partnerOf(state);\n  const kids = childrenOf(state, me).filter((c) => c.alive);\n  const grandkids = kids.some((kid) => kid.children.length > 0);\n  return EVENTS.filter((event) => {\n    if (event.once && state.seenEvents.includes(event.id)) return false;\n    if (event.minAge != null && me.age < event.minAge) return false;\n    if (event.maxAge != null && me.age > event.maxAge) return false;\n    if (event.needsJob && !me.jobId) return false;\n    if (event.needsPartner && !partner) return false;\n    if (event.needsChild && kids.length === 0) return false;\n    if (event.needsGrandchild && !grandkids) return false;\n    return true;\n  });\n}\n\nfunction rollEvent(state) {\n  const pool = eligibleEvents(state);\n  if (!pool.length) return;\n  const rng = rngFor(state);\n  const event = rng.weighted(pool, (e) => e.weight ?? 1);\n  syncRng(state, rng);\n  state.pending = { eventId: event.id, resolved: null };\n  if (event.once) state.seenEvents.push(event.id);\n}\n\n/** 판정 성공 확률 */\nexport function checkChance(person, check) {\n  const stat = person.stats[check.stat] ?? 0;\n  return clamp(0.5 + (stat - check.difficulty) / 80, 0.05, 0.95);\n}\n\nexport function pendingEvent(state) {\n  if (!state.pending) return null;\n  const event = EVENTS.find((e) => e.id === state.pending.eventId);\n  if (!event) return null;\n  const me = player(state);\n  return {\n    ...event,\n    title: fillText(state, event.title),\n    text: fillText(state, event.text),\n    choices: event.choices.map((choice, index) => ({\n      index,\n      label: fillText(state, choice.label),\n      cost: choice.cost ?? 0,\n      affordable: (choice.cost ?? 0) <= state.money,\n      odds: choice.check ? Math.round(checkChance(me, choice.check) * 100) : null,\n      checkLabel: choice.check ? choice.check.stat : null,\n    })),\n    resolved: state.pending.resolved,\n  };\n}\n\nexport function resolveEvent(state, choiceIndex) {\n  if (!state.pending || state.pending.resolved) return null;\n  const event = EVENTS.find((e) => e.id === state.pending.eventId);\n  const choice = event?.choices[choiceIndex];\n  if (!choice) return null;\n  if ((choice.cost ?? 0) > state.money) return null;\n\n  const me = player(state);\n  const rng = rngFor(state);\n  if (choice.cost) state.money -= choice.cost;\n\n  let outcomeText;\n  let effects;\n  if (choice.check) {\n    const success = rng.chance(checkChance(me, choice.check));\n    const branch = success ? choice.success : choice.fail;\n    outcomeText = branch.text;\n    effects = branch.effects ?? {};\n  } else {\n    outcomeText = choice.result;\n    effects = choice.effects ?? {};\n  }\n  syncRng(state, rng);\n  applyEffects(state, effects);\n\n  const text = fillText(state, outcomeText);\n  state.pending.resolved = { text, label: fillText(state, choice.label) };\n  pushLog(state, event.icon ?? '❔', `${fillText(state, event.title)} — ${text}`);\n  return state.pending.resolved;\n}\n\nexport function dismissEvent(state) {\n  state.pending = null;\n}\n\n// ── 한 해 보내기 ───────────────────────────────────────────\n\nexport function canAdvance(state) {\n  if (state.ended) return false;\n  if (state.succession) return false;\n  if (state.pending && !state.pending.resolved) return false;\n  return true;\n}\n\nexport function advanceYear(state, activityId = state.activity) {\n  if (!canAdvance(state)) return state;\n  state.pending = null;\n  state.activity = activityId;\n  const bonuses = villageBonuses(state.village);\n  const rng = rngFor(state);\n\n  applyActivity(state, activityId);\n\n  // 1) 모두 한 살 더\n  state.year += 1;\n  for (const person of allPeople(state)) {\n    if (!person.alive) continue;\n    const inHouse = person.inFamily;\n    ageOneYear(person, { rng, villageGrow: inHouse ? bonuses.grow : {} });\n    updateEducation(person);\n  }\n  syncRng(state, rng);\n\n  const me = player(state);\n\n  // 2) 살림\n  const members = household(state);\n  const income = householdIncome(members, bonuses);\n  const expense = householdExpense(members, bonuses, state.upkeep) + villageMaintenance(state.village);\n  state.money += income - expense;\n  state.stats.peakMoney = Math.max(state.stats.peakMoney, state.money);\n  if (state.money < 0) {\n    const debt = -state.money;\n    state.money = 0;\n    me.happiness = clamp(me.happiness - Math.min(12, 3 + debt / 400));\n    pushLog(state, '💸', `살림이 빠듯합니다. 빚을 메우느라 가족이 힘든 한 해였습니다.`, 'bad');\n  }\n\n  // 3) 행복 자연 변화\n  const familyHappiness = bonuses.happiness + (me.jobId ? (JOB_BY_ID[me.jobId].happiness ?? 0) : me.age >= 22 ? -1.5 : 0);\n  for (const person of familyMembers(state)) {\n    person.happiness = clamp(person.happiness + familyHappiness * (person.id === me.id ? 1 : 0.7) - 0.5);\n  }\n\n  // 4) 배우자 커리어 (자동)\n  autoCareerForPartner(state);\n\n  // 4-1) 조부모가 함께 살면 아이들이 더 행복하게 자란다\n  const elders = eldersOf(state);\n  if (elders.length) {\n    for (const kid of childrenOf(state, me)) {\n      if (kid.alive && kid.age < 19) {\n        kid.happiness = clamp(kid.happiness + 1.5);\n        kid.potential.charm = clamp(kid.potential.charm + 0.3);\n      }\n    }\n  }\n\n  // 4-2) 가족들도 저마다의 인생을 산다 (결혼하고 아이를 낳는다)\n  npcLife(state);\n\n  // 4-3) 성인이 되면 일할 수 있다고 알려준다\n  if (me.age === 19 && !me.jobId) {\n    pushLog(state, '💼', '이제 일을 구할 수 있습니다. [직업] 탭에서 자격에 맞는 일을 찾아보세요.');\n  }\n  if (me.age > 19 && !me.jobId && !me.retired && state.money < 500) {\n    pushLog(state, '⚠️', '통장이 비어갑니다. 일자리를 구하지 않으면 가족이 어려워집니다.', 'bad');\n  }\n\n  // 5) 아이 독립 / 성장 알림\n  for (const kid of childrenOf(state, me)) {\n    if (kid.alive && kid.age === 19) {\n      pushLog(state, '🎓', `${fullName(kid)}이(가) 성인이 되었습니다. (${EDUCATION_LABELS[kid.education]})`, 'good');\n      autoCareerFor(state, kid);\n    }\n  }\n\n  // 6) 사망 판정\n  processDeaths(state, bonuses);\n\n  state.stats.yearsPlayed += 1;\n  state.turnFlags = { romanceUsed: false, metThisYear: false };\n\n  // 7) 새해 이벤트\n  if (!state.ended && !state.succession) rollEvent(state);\n  return state;\n}\n\nfunction autoCareerFor(state, person) {\n  if (person.jobId || person.age < 19 || !person.alive) return;\n  const rng = rngFor(state);\n  const options = Object.values(JOB_BY_ID).filter((job) => canApply(person, job));\n  if (options.length) {\n    const job = rng.weighted(options, (j) => j.salary / 1000);\n    person.jobId = job.id;\n    pushLog(state, job.icon, `${fullName(person)}이(가) ${job.label} 일을 시작했습니다.`);\n  }\n  syncRng(state, rng);\n}\n\nfunction autoCareerForPartner(state) {\n  const partner = partnerOf(state);\n  if (!partner?.alive) return;\n  if (!partner.jobId && partner.age >= 19 && partner.age < 65) autoCareerFor(state, partner);\n  if (partner.jobId && partner.age >= 65) {\n    pushLog(state, '🌇', `${fullName(partner)}이(가) 은퇴했습니다.`);\n    partner.jobId = null;\n  }\n  const rng = rngFor(state);\n  if (partner.jobId && rng.chance(promotionChance(partner, false))) partner.jobLevel += 1;\n  partner.affection = clamp(partner.affection - 1);\n  syncRng(state, rng);\n}\n\nfunction processDeaths(state, bonuses) {\n  const rng = rngFor(state);\n  for (const person of allPeople(state)) {\n    if (!person.alive) continue;\n    const bonus = person.inFamily ? bonuses.lifespan : 0;\n    if (rng.chance(deathChance(person, bonus))) {\n      person.alive = false;\n      person.deathYear = state.year;\n      person.deathCause = person.age >= person.lifespan ? '천수를 누리고' : '갑작스럽게';\n      const isPlayer = person.id === state.playerId;\n      pushLog(state, '🕯️', `${fullName(person)}이(가) ${person.age}세에 ${person.deathCause} 세상을 떠났습니다.`, 'bad');\n      if (!isPlayer && person.inFamily) {\n        const me = player(state);\n        if (me?.alive) me.happiness = clamp(me.happiness - 12);\n      }\n      if (isPlayer) {\n        syncRng(state, rng);\n        beginSuccession(state);\n        return;\n      }\n    }\n  }\n  syncRng(state, rng);\n}\n\n/**\n * 플레이어가 아닌 가족들도 나이를 먹으며 짝을 만나고 아이를 낳는다.\n * 덕분에 손주가 태어나고, 가문의 대가 끊기지 않는다.\n */\nexport const MAX_POPULATION = 36;   // 동시에 살아 있는 가족 수 상한\n\nfunction npcLife(state) {\n  const rng = rngFor(state);\n  const me = player(state);\n  const living = allPeople(state).filter((p) => p.alive && p.inFamily);\n  for (const person of living) {\n    if (person.id === me.id || person.id === me.partnerId) continue;\n    if (person.isCandidate || person.age < 22) continue;\n    // 플레이어와 가까운 세대만 이야기가 이어진다 (가족이 무한히 불어나지 않도록)\n    if (person.generation < state.generation - 1) continue;\n\n    // 결혼\n    if (!person.partnerId && person.age <= 45 && living.length < MAX_POPULATION && rng.chance(0.22)) {\n      const spouse = createCandidate(rng, person, state.year);\n      spouse.isCandidate = false;\n      spouse.inFamily = true;\n      spouse.bloodline = false;\n      spouse.partnerId = person.id;\n      spouse.affection = 75;\n      person.partnerId = spouse.id;\n      state.people[spouse.id] = spouse;\n      pushLog(state, '💍', `${fullName(person)}이(가) ${fullName(spouse)}와(과) 가정을 이루었습니다.`, 'good');\n      continue;\n    }\n\n    // 출산\n    const spouse = state.people[person.partnerId];\n    if (!spouse?.alive || person.children.length >= 3) continue;\n    if (living.length >= MAX_POPULATION) continue;\n    const mother = person.gender === 'female' ? person : spouse;\n    if (mother.age > 44) continue;\n    if (!rng.chance(0.22 * birthChance(mother))) continue;\n\n    const father = person.gender === 'female' ? spouse : person;\n    const baby = createChild(rng, mother, father, state.year);\n    baby.familyName = (person.bloodline ? person : spouse).familyName;\n    baby.inFamily = true;\n    baby.bloodline = true;\n    state.people[baby.id] = baby;\n    person.children.push(baby.id);\n    spouse.children.push(baby.id);\n    state.stats.born += 1;\n    const relation = me.children.includes(person.id) ? '손주' : '가족';\n    pushLog(state, '👶', `${fullName(person)}의 아이 ${fullName(baby)}이(가) 태어났습니다. (${relation})`, 'good');\n  }\n  syncRng(state, rng);\n}\n\n// ── 세대 계승 ─────────────────────────────────────────────\n\n/**\n * 대를 이을 사람 찾기.\n * 직계 자녀 → 손주 → 그 외 핏줄 순으로, 한창 나이(19~45)를 앞세운다.\n */\nexport function heirCandidates(state) {\n  const me = player(state);\n  if (!me) return [];\n  const childIds = new Set(me.children);\n  const grandchildIds = new Set(\n    childrenOf(state, me).flatMap((child) => child.children),\n  );\n  const rank = (person) => {\n    if (childIds.has(person.id)) return 0;\n    if (grandchildIds.has(person.id)) return 1;\n    return 2;\n  };\n  const prime = (person) => (person.age >= 19 && person.age <= 45 ? 0 : 1);\n  return allPeople(state)\n    .filter((p) => p.alive && p.inFamily && p.bloodline && p.id !== me.id)\n    .sort((a, b) => rank(a) - rank(b) || prime(a) - prime(b) || b.age - a.age)\n    .slice(0, 8);\n}\n\n/** 살아 있는 동안 스스로 대를 넘길 수 있는가 */\nexport function canSucceed(state) {\n  const me = player(state);\n  if (!me?.alive || state.ended) return { ok: false, reason: '지금은 할 수 없습니다.' };\n  const heirs = heirCandidates(state).filter((h) => h.age >= 19);\n  if (!heirs.length) return { ok: false, reason: '성인이 된 자손이 있어야 합니다.' };\n  return { ok: true, heirs };\n}\n\n/** 자발적 계승: 부모는 어르신으로 남아 가족과 함께 지낸다 */\nexport function succeedTo(state, heirId) {\n  const check = canSucceed(state);\n  if (!check.ok) return check;\n  if (!check.heirs.some((h) => h.id === heirId)) return { ok: false, reason: '대를 이을 수 없는 사람입니다.' };\n  const previous = player(state);\n  handOver(state, heirId, 0.9);\n  previous.retired = true;\n  previous.jobId = null;\n  previous.happiness = clamp(previous.happiness + 8);\n  pushLog(state, '🤝', `${fullName(previous)}이(가) 가문을 다음 세대에 맡기고 물러났습니다.`, 'good');\n  return { ok: true };\n}\n\nfunction beginSuccession(state) {\n  const heirs = heirCandidates(state);\n  if (!heirs.length) {\n    endGame(state, '가문의 이야기가 여기서 멈췄습니다. 뒤를 이을 사람이 없었습니다.');\n    return;\n  }\n  state.succession = { heirIds: heirs.map((h) => h.id) };\n}\n\n/** 실제 계승 처리 (사망 시 / 자발적 계승 공통) */\nfunction handOver(state, heirId, baseRate) {\n  const previous = player(state);\n  const heir = state.people[heirId];\n  const rate = Math.min(1, baseRate + (state.inheritBonus ?? 0));\n  const inherited = Math.round(state.money * rate);\n  state.money = inherited;\n  state.playerId = heir.id;\n  heir.isPlayer = true;\n  heir.independent = false;\n  previous.isPlayer = false;\n  state.generation = heir.generation;\n  state.pending = null;\n  state.succession = null;\n  state.turnFlags = { romanceUsed: false, metThisYear: false };\n  state.activity = heir.age >= 6 ? 'study' : 'rest';\n\n  // 대를 잇지 않은 형제자매는 각자의 삶을 살아간다\n  for (const sibling of childrenOf(state, previous)) {\n    if (sibling.id !== heir.id && sibling.alive && sibling.age >= 19) sibling.independent = true;\n  }\n  pushLog(\n    state, '🌳',\n    `${state.generation}대 ${fullName(heir)}이(가) 가문을 잇습니다. (상속 ${inherited.toLocaleString('ko-KR')}만원)`,\n    'good',\n  );\n  if (heir.age >= 19 && !heir.jobId) autoCareerFor(state, heir);\n  rollEvent(state);\n  return state;\n}\n\n/** 사망 후 상속자 선택 */\nexport function chooseHeir(state, heirId) {\n  if (!state.succession?.heirIds.includes(heirId)) return state;\n  return handOver(state, heirId, 0.7);\n}\n\nexport function legacyScore(state) {\n  const people = allPeople(state);\n  const descendants = people.filter((p) => p.generation > 1).length;\n  const happy = average(people.filter((p) => p.alive).map((p) => p.happiness), 50);\n  const buildings = Object.values(state.village.buildings).reduce((a, b) => a + b, 0);\n  return Math.round(\n    state.generation * 1200 +\n    descendants * 200 +\n    buildings * 180 +\n    villageLevel(state.village) * 400 +\n    Math.sqrt(Math.max(0, state.stats.peakMoney)) * 6 +\n    happy * 8,\n  );\n}\n\nexport function endGame(state, reason) {\n  state.ended = { reason, score: legacyScore(state), year: state.year };\n  pushLog(state, '📜', `${reason} 최종 유산 점수 ${state.ended.score.toLocaleString('ko-KR')}점.`, 'good');\n}\n\n// ── 연애 / 결혼 / 출산 ─────────────────────────────────────\n\nexport function meetPeople(state) {\n  const me = player(state);\n  if (me.age < 18 || me.partnerId) return { ok: false, reason: '지금은 만남을 가질 때가 아닙니다.' };\n  if (state.turnFlags.metThisYear) return { ok: false, reason: '올해는 이미 새로운 사람을 만났습니다.' };\n  if (state.money < MEET_COST) return { ok: false, reason: '자금이 부족합니다.' };\n  const rng = rngFor(state);\n  state.money -= MEET_COST;\n  const bonuses = villageBonuses(state.village);\n  const count = 1 + (rng.chance(0.35 + bonuses.romance) ? 1 : 0);\n  const made = [];\n  for (let i = 0; i < count; i++) {\n    const candidate = createCandidate(rng, me, state.year);\n    candidate.isCandidate = true;\n    candidate.inFamily = false;\n    candidate.affection = clamp(candidate.affection + me.stats.charm / 10 + bonuses.romance * 20);\n    state.people[candidate.id] = candidate;\n    made.push(candidate);\n  }\n  syncRng(state, rng);\n  state.turnFlags.metThisYear = true;\n  pushLog(state, '💫', `${made.map(fullName).join(', ')}와(과) 인연이 닿았습니다.`);\n  return { ok: true, candidates: made };\n}\n\nexport function date(state, candidateId) {\n  const me = player(state);\n  const candidate = state.people[candidateId];\n  if (!candidate || !candidate.isCandidate) return { ok: false, reason: '만날 수 없는 상대입니다.' };\n  if (state.turnFlags.romanceUsed) return { ok: false, reason: '올해의 데이트는 이미 했습니다.' };\n  if (state.money < DATE_COST) return { ok: false, reason: '자금이 부족합니다.' };\n  const rng = rngFor(state);\n  state.money -= DATE_COST;\n  const bonuses = villageBonuses(state.village);\n  const gain = 6 + me.stats.charm / 12 + rng.int(0, 6) + bonuses.romance * 30;\n  candidate.affection = clamp(candidate.affection + gain);\n  me.happiness = clamp(me.happiness + 2);\n  syncRng(state, rng);\n  state.turnFlags.romanceUsed = true;\n  pushLog(state, '💗', `${fullName(candidate)}와(과) 시간을 보냈습니다. (호감도 ${Math.round(candidate.affection)})`);\n  return { ok: true, affection: candidate.affection };\n}\n\nexport function propose(state, candidateId) {\n  const me = player(state);\n  const candidate = state.people[candidateId];\n  if (!candidate) return { ok: false, reason: '상대를 찾을 수 없습니다.' };\n  if (me.age < 20) return { ok: false, reason: '아직 결혼할 나이가 아닙니다.' };\n  if (candidate.affection < 70) return { ok: false, reason: '호감도가 70 이상이어야 합니다.' };\n  if (state.money < MARRIAGE_COST) return { ok: false, reason: `결혼 준비에 ${MARRIAGE_COST}만원이 필요합니다.` };\n  state.money -= MARRIAGE_COST;\n  me.partnerId = candidate.id;\n  candidate.partnerId = me.id;\n  candidate.isCandidate = false;\n  candidate.inFamily = true;\n  candidate.happiness = clamp(candidate.happiness + 15);\n  me.happiness = clamp(me.happiness + 15);\n  state.stats.married += 1;\n  // 다른 후보들은 떠난다\n  for (const other of candidates(state)) delete state.people[other.id];\n  pushLog(state, '💍', `${fullName(me)}와(과) ${fullName(candidate)}이(가) 결혼했습니다!`, 'good');\n  return { ok: true };\n}\n\n/** 출산 성공 확률: 나이가 들수록 낮아진다 */\nexport function birthChance(mother) {\n  return clamp(0.95 - Math.max(0, mother.age - 32) * 0.05, 0.15, 0.95);\n}\n\nexport function canHaveChild(state) {\n  const me = player(state);\n  const partner = partnerOf(state);\n  if (!partner?.alive) return { ok: false, reason: '배우자가 필요합니다.' };\n  const mother = me.gender === 'female' ? me : partner;\n  if (mother.age > 45) return { ok: false, reason: '아이를 갖기 어려운 나이입니다.' };\n  if (me.age < 20) return { ok: false, reason: '아직 이릅니다.' };\n  if (state.money < CHILD_COST_ONCE) return { ok: false, reason: `준비 비용 ${CHILD_COST_ONCE}만원이 필요합니다.` };\n  if (state.turnFlags.childThisYear) return { ok: false, reason: '올해는 이미 아이를 맞이했습니다.' };\n  return { ok: true };\n}\n\nexport function haveChild(state) {\n  const check = canHaveChild(state);\n  if (!check.ok) return check;\n  const me = player(state);\n  const partner = partnerOf(state);\n  const rng = rngFor(state);\n  state.money -= CHILD_COST_ONCE;\n\n  const mother = me.gender === 'female' ? me : partner;\n  const father = me.gender === 'female' ? partner : me;\n  const chance = birthChance(mother);\n  if (!rng.chance(chance)) {\n    syncRng(state, rng);\n    state.turnFlags.childThisYear = true;\n    pushLog(state, '🍀', '올해는 좋은 소식이 없었습니다.');\n    return { ok: false, reason: '올해는 아이가 찾아오지 않았습니다.' };\n  }\n  const bloodParent = me;\n  const child = createChild(rng, mother, father, state.year);\n  child.familyName = bloodParent.familyName;\n  child.inFamily = true;\n  state.people[child.id] = child;\n  me.children.push(child.id);\n  partner.children.push(child.id);\n  me.happiness = clamp(me.happiness + 10);\n  partner.happiness = clamp(partner.happiness + 10);\n  state.stats.born += 1;\n  state.turnFlags.childThisYear = true;\n  syncRng(state, rng);\n  pushLog(state, '👶', `${fullName(child)}이(가) 태어났습니다! (${state.generation + 1}대)`, 'good');\n  return { ok: true, child, chance };\n}\n\n// ── 직업 / 마을 ────────────────────────────────────────────\n\nexport function jobOptions(state) {\n  const me = player(state);\n  return Object.values(JOB_BY_ID).map((job) => ({\n    ...job,\n    eligible: canApply(me, job),\n    current: me.jobId === job.id,\n    expected: salaryOf({ ...me, jobId: job.id, jobLevel: 0 }, villageBonuses(state.village)),\n  }));\n}\n\nexport function takeJob(state, jobId) {\n  const me = player(state);\n  const job = JOB_BY_ID[jobId];\n  if (!job) return { ok: false, reason: '없는 직업입니다.' };\n  if (me.age < 19) return { ok: false, reason: '19세부터 일할 수 있습니다.' };\n  if (!canApply(me, job)) return { ok: false, reason: '자격을 갖추지 못했습니다.' };\n  if (me.jobId === jobId) return { ok: false, reason: '이미 하고 있는 일입니다.' };\n  const changing = Boolean(me.jobId);\n  me.jobId = jobId;\n  me.jobLevel = changing ? Math.floor(me.jobLevel / 2) : 0;\n  pushLog(state, job.icon, `${fullName(me)}이(가) ${job.label}${changing ? '(으)로 이직했습니다.' : ' 일을 시작했습니다.'}`, 'good');\n  return { ok: true };\n}\n\nexport function retire(state) {\n  const me = player(state);\n  if (!me.jobId) return { ok: false, reason: '이미 일하지 않습니다.' };\n  if (me.age < 55) return { ok: false, reason: '55세부터 은퇴할 수 있습니다.' };\n  me.jobId = null;\n  me.happiness = clamp(me.happiness + 8);\n  pushLog(state, '🌇', `${fullName(me)}이(가) 은퇴했습니다. 이제 가족과의 시간입니다.`, 'good');\n  return { ok: true };\n}\n\nexport function buildBuilding(state, buildingId) {\n  const result = buildInVillage(state.village, buildingId, state.money);\n  if (!result.ok) return result;\n  state.money -= result.spent;\n  state.stats.buildingsBuilt += 1;\n  const me = player(state);\n  me.happiness = clamp(me.happiness + 3);\n  pushLog(state, '🏗️', `${state.village.name}에 건물을 올렸습니다. (Lv.${result.level})`, 'good');\n  return result;\n}\n\nexport function financeSummary(state) {\n  const bonuses = villageBonuses(state.village);\n  const members = household(state);\n  const income = householdIncome(members, bonuses);\n  const maintenance = villageMaintenance(state.village);\n  const expense = householdExpense(members, bonuses, state.upkeep) + maintenance;\n  return { income, expense, maintenance, net: income - expense, bonuses };\n}\n","deps":[["./rng.js","src/core/rng.js"],["./util.js","src/core/util.js"],["./person.js","src/core/person.js"],["./village.js","src/core/village.js"],["./economy.js","src/core/economy.js"],["../data/jobs.js","src/data/jobs.js"],["../data/events.js","src/data/events.js"],["../data/traits.js","src/data/traits.js"],["../data/names.js","src/data/names.js"]]},{"path":"src/ui/avatar.js","code":"// 유전자로 얼굴을 그린다. 부모를 닮은 아이가 한눈에 보이도록.\nconst escapeAttr = (value) => String(value).replace(/[<>\"&]/g, '');\n\n/** 나이가 들면 머리가 하얘진다 */\nfunction hairColorFor(person) {\n  const base = person.genes.hairColor ?? '#3a2a1c';\n  if (person.age < 50) return base;\n  const grayness = Math.min(0.85, (person.age - 50) / 35);\n  return mix(base, '#cfcac4', grayness);\n}\n\nfunction mix(hexA, hexB, t) {\n  const parse = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));\n  const [r1, g1, b1] = parse(hexA);\n  const [r2, g2, b2] = parse(hexB);\n  const to = (a, b) => Math.round(a + (b - a) * t).toString(16).padStart(2, '0');\n  return `#${to(r1, r2)}${to(g1, g2)}${to(b1, b2)}`;\n}\n\nfunction faceShape(shape) {\n  switch (shape) {\n    case 'oval': return '<ellipse cx=\"50\" cy=\"54\" rx=\"23\" ry=\"29\" />';\n    case 'square': return '<rect x=\"26\" y=\"26\" width=\"48\" height=\"54\" rx=\"14\" />';\n    case 'heart': return '<path d=\"M50 84 C30 70 24 54 26 42 C28 30 42 24 50 32 C58 24 72 30 74 42 C76 54 70 70 50 84 Z\" />';\n    case 'round':\n    default: return '<ellipse cx=\"50\" cy=\"54\" rx=\"26\" ry=\"27\" />';\n  }\n}\n\nfunction hair(style, color, age) {\n  const c = escapeAttr(color);\n  // 어린아이가 대머리로 보이지 않도록\n  const effective = style === 'bald' && age < 35 ? 'short' : style;\n  switch (effective) {\n    case 'bald':\n      return `<path d=\"M27 46 C30 30 70 30 73 46 C70 40 30 40 27 46 Z\" fill=\"${c}\" opacity=\"0.35\" />`;\n    case 'buzz':\n      return `<path d=\"M25 48 C26 28 74 28 75 48 C68 38 32 38 25 48 Z\" fill=\"${c}\" />`;\n    case 'bob':\n      return `<path d=\"M23 52 C22 26 78 26 77 52 L77 62 L69 62 L69 44 C60 38 40 38 31 44 L31 62 L23 62 Z\" fill=\"${c}\" />`;\n    case 'long':\n      return `<path d=\"M22 52 C21 24 79 24 78 52 L78 92 L68 92 L68 46 C60 39 40 39 32 46 L32 92 L22 92 Z\" fill=\"${c}\" />`;\n    case 'curly':\n      return `<g fill=\"${c}\"><circle cx=\"34\" cy=\"34\" r=\"11\"/><circle cx=\"50\" cy=\"28\" r=\"12\"/><circle cx=\"66\" cy=\"34\" r=\"11\"/><circle cx=\"28\" cy=\"46\" r=\"9\"/><circle cx=\"72\" cy=\"46\" r=\"9\"/><\/g>`;\n    case 'ponytail':\n      return `<g fill=\"${c}\"><path d=\"M24 50 C24 26 76 26 76 50 C68 40 32 40 24 50 Z\"/><circle cx=\"79\" cy=\"58\" r=\"10\"/><rect x=\"70\" y=\"46\" width=\"10\" height=\"16\" rx=\"5\"/><\/g>`;\n    case 'wave':\n      return `<path d=\"M23 52 C23 26 77 26 77 52 C72 46 66 52 60 46 C54 40 46 40 40 46 C34 52 28 46 23 52 Z\" fill=\"${c}\" />`;\n    case 'short':\n    default:\n      return `<path d=\"M24 50 C24 26 76 26 76 50 C70 40 30 40 24 50 Z\" fill=\"${c}\" />`;\n  }\n}\n\n/**\n * 인물 아바타 SVG 문자열.\n * @param {object} person\n * @param {number} size 픽셀\n */\nexport function avatarSvg(person, size = 72) {\n  const genes = person.genes ?? {};\n  const skin = escapeAttr(genes.skin ?? '#f7cfa8');\n  const eye = escapeAttr(genes.eyeColor ?? '#3a2a1c');\n  const blush = escapeAttr(genes.blush ?? '#f2a3a3');\n  const hairCol = hairColorFor(person);\n  const baby = person.age <= 3;\n  const eyeY = baby ? 58 : 55;\n  const smile = (person.happiness ?? 60) >= 55;\n  const mouth = smile\n    ? `<path d=\"M42 ${eyeY + 12} Q50 ${eyeY + 19} 58 ${eyeY + 12}\" stroke=\"#8a4a44\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\"/>`\n    : `<path d=\"M42 ${eyeY + 16} Q50 ${eyeY + 10} 58 ${eyeY + 16}\" stroke=\"#8a4a44\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\"/>`;\n  const freckles = genes.freckles\n    ? `<g fill=\"#b9764f\" opacity=\"0.55\"><circle cx=\"36\" cy=\"${eyeY + 7}\" r=\"1.5\"/><circle cx=\"41\" cy=\"${eyeY + 9}\" r=\"1.3\"/><circle cx=\"59\" cy=\"${eyeY + 7}\" r=\"1.5\"/><circle cx=\"64\" cy=\"${eyeY + 9}\" r=\"1.3\"/><\/g>`\n    : '';\n  const glasses = person.stats?.intellect >= 85\n    ? `<g fill=\"none\" stroke=\"#4b4b4b\" stroke-width=\"1.8\" opacity=\"0.8\"><circle cx=\"39\" cy=\"${eyeY}\" r=\"8\"/><circle cx=\"61\" cy=\"${eyeY}\" r=\"8\"/><path d=\"M47 ${eyeY} h6\"/><\/g>`\n    : '';\n  const wrinkles = person.age >= 62\n    ? `<g stroke=\"#00000022\" stroke-width=\"1.4\" fill=\"none\"><path d=\"M31 ${eyeY - 6} q4 -3 8 -1\"/><path d=\"M61 ${eyeY - 7} q4 -2 8 1\"/><\/g>`\n    : '';\n\n  return `<svg class=\"avatar-svg\" viewBox=\"0 0 100 100\" width=\"${size}\" height=\"${size}\" role=\"img\" aria-label=\"${escapeAttr(person.givenName ?? '')} 초상\">\n  <g fill=\"${skin}\">${faceShape(genes.face ?? 'round')}<\/g>\n  <ellipse cx=\"24\" cy=\"56\" rx=\"5\" ry=\"7\" fill=\"${skin}\"/>\n  <ellipse cx=\"76\" cy=\"56\" rx=\"5\" ry=\"7\" fill=\"${skin}\"/>\n  ${hair(genes.hairStyle ?? 'short', hairCol, person.age ?? 20)}\n  <g>\n    <ellipse cx=\"39\" cy=\"${eyeY}\" rx=\"4.6\" ry=\"5.2\" fill=\"#ffffff\"/>\n    <ellipse cx=\"61\" cy=\"${eyeY}\" rx=\"4.6\" ry=\"5.2\" fill=\"#ffffff\"/>\n    <circle cx=\"39\" cy=\"${eyeY}\" r=\"2.8\" fill=\"${eye}\"/>\n    <circle cx=\"61\" cy=\"${eyeY}\" r=\"2.8\" fill=\"${eye}\"/>\n    <circle cx=\"40\" cy=\"${eyeY - 1}\" r=\"0.9\" fill=\"#ffffff\"/>\n    <circle cx=\"62\" cy=\"${eyeY - 1}\" r=\"0.9\" fill=\"#ffffff\"/>\n  <\/g>\n  ${glasses}\n  <ellipse cx=\"31\" cy=\"${eyeY + 8}\" rx=\"5\" ry=\"3\" fill=\"${blush}\" opacity=\"0.45\"/>\n  <ellipse cx=\"69\" cy=\"${eyeY + 8}\" rx=\"5\" ry=\"3\" fill=\"${blush}\" opacity=\"0.45\"/>\n  ${freckles}\n  ${wrinkles}\n  ${mouth}\n<\/svg>`;\n}\n","deps":[]},{"path":"src/ui/views.js","code":"// 화면 조각들. 모두 문자열 HTML 을 돌려주고, 클릭은 data-act 로 위임된다.\nimport { avatarSvg } from './avatar.js';\nimport { fullName } from '../core/person.js';\nimport { STAT_KEYS, STAT_LABELS, EDUCATION_LABELS, won, stageOf } from '../core/util.js';\nimport { TRAIT_BY_ID, commonTraits } from '../data/traits.js';\nimport { JOB_BY_ID } from '../data/jobs.js';\nimport { BUILDINGS, buildCost } from '../data/buildings.js';\nimport { villageLevel, villageTitle, buildStatus, villageMaintenance } from '../core/village.js';\nimport { MAX_JOB_LEVEL, salaryOf } from '../core/economy.js';\nimport * as G from '../core/game.js';\n\nconst esc = (text) => String(text).replace(/[&<>\"']/g, (c) => (\n  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]\n));\n\nconst traitBadges = (person) => person.traits\n  .map((id) => TRAIT_BY_ID[id])\n  .filter(Boolean)\n  .map((t) => `<span class=\"badge\" title=\"${esc(t.desc)}\">${t.icon} ${esc(t.label)}<\/span>`)\n  .join('');\n\nconst jobLabel = (person) => {\n  if (!person.jobId) return person.age >= 19 ? '무직' : '학생';\n  const job = JOB_BY_ID[person.jobId];\n  return `${job.icon} ${job.label} ${person.jobLevel}호봉`;\n};\n\n// ── 타이틀 ────────────────────────────────────────────────\n\nexport function titleScreen({ canContinue, draft }) {\n  const traitPills = commonTraits().slice(0, 10).map((t) => `\n    <button class=\"pill ${draft.traitId === t.id ? 'on' : ''}\" data-act=\"draft-trait\" data-id=\"${t.id}\" title=\"${esc(t.desc)}\">\n      ${t.icon} ${esc(t.label)}\n    <\/button>`).join('');\n\n  return `\n  <div class=\"title-screen\">\n    <div class=\"logo\">🏡<\/div>\n    <h1>Family Go!<\/h1>\n    <p class=\"tag\">대를 잇는 인생 시뮬레이션<\/p>\n    <div class=\"card form-grid\">\n      <div class=\"row-2\">\n        <div>\n          <label>성<\/label>\n          <input id=\"in-family\" value=\"${esc(draft.familyName)}\" placeholder=\"비우면 랜덤\" maxlength=\"2\" />\n        <\/div>\n        <div>\n          <label>이름<\/label>\n          <input id=\"in-given\" value=\"${esc(draft.givenName)}\" placeholder=\"비우면 랜덤\" maxlength=\"6\" />\n        <\/div>\n      <\/div>\n      <div>\n        <label>성별<\/label>\n        <div class=\"pill-row\">\n          <button class=\"pill ${draft.gender === 'female' ? 'on' : ''}\" data-act=\"draft-gender\" data-id=\"female\">👧 여성<\/button>\n          <button class=\"pill ${draft.gender === 'male' ? 'on' : ''}\" data-act=\"draft-gender\" data-id=\"male\">👦 남성<\/button>\n          <button class=\"pill ${!draft.gender ? 'on' : ''}\" data-act=\"draft-gender\" data-id=\"\">🎲 랜덤<\/button>\n        <\/div>\n      <\/div>\n      <div>\n        <label>타고난 성격 (비우면 랜덤)<\/label>\n        <div class=\"pill-row\">${traitPills}<\/div>\n      <\/div>\n      <div>\n        <label>마을 이름<\/label>\n        <input id=\"in-village\" value=\"${esc(draft.villageName)}\" placeholder=\"비우면 랜덤\" maxlength=\"10\" />\n      <\/div>\n      <button class=\"primary wide\" data-act=\"new-game\">새 인생 시작하기<\/button>\n      ${canContinue ? '<button class=\"ghost wide\" data-act=\"continue\">이어서 하기<\/button>' : ''}\n    <\/div>\n    <p class=\"muted\">한 명에서 시작해 사랑, 결혼, 자녀, 마을을 거쳐 여러 세대의 가족 이야기를 만들어보세요.<\/p>\n  <\/div>`;\n}\n\n// ── 상단바 / 주인공 ───────────────────────────────────────\n\nexport function topBar(state) {\n  const level = villageLevel(state.village);\n  return `\n  <div class=\"topbar\">\n    <div class=\"stat-chip\"><span class=\"k\">연도<\/span><span class=\"v\">${state.year}년<\/span><\/div>\n    <div class=\"stat-chip\"><span class=\"k\">세대<\/span><span class=\"v\">${state.generation}대<\/span><\/div>\n    <div class=\"stat-chip\"><span class=\"k\">자금<\/span><span class=\"v\">${won(state.money)}<\/span><\/div>\n    <div class=\"stat-chip\"><span class=\"k\">${esc(state.village.name)}<\/span><span class=\"v\">${villageTitle(level)} Lv.${level}<\/span><\/div>\n  <\/div>`;\n}\n\nexport function heroCard(state) {\n  const me = G.player(state);\n  const partner = G.partnerOf(state);\n  const stage = stageOf(me.age);\n  const bars = STAT_KEYS.map((key) => `\n    <div class=\"bar-row\">\n      <span>${STAT_LABELS[key]}<\/span>\n      <span class=\"bar ${key}\"><i style=\"width:${Math.round(me.stats[key])}%\"><\/i><\/span>\n      <span class=\"muted\">${Math.round(me.stats[key])}<\/span>\n    <\/div>`).join('');\n\n  return `\n  <div class=\"card\">\n    <div class=\"hero\">\n      <div class=\"avatar\">${avatarSvg(me, 84)}<\/div>\n      <div class=\"hero-info\">\n        <div class=\"name-line\">\n          <span class=\"name\">${esc(fullName(me))}<\/span>\n          <span class=\"muted\">${me.age}세 · ${stage.label} · ${me.gender === 'female' ? '여' : '남'}<\/span>\n        <\/div>\n        <div class=\"muted\">${jobLabel(me)} · ${EDUCATION_LABELS[me.education]}${partner ? ` · 💞 ${esc(fullName(partner))}` : ''}<\/div>\n        <div class=\"badges\">${traitBadges(me)}<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"bars\">\n      ${bars}\n      <div class=\"bar-row\">\n        <span>행복<\/span>\n        <span class=\"bar happy\"><i style=\"width:${Math.round(me.happiness)}%\"><\/i><\/span>\n        <span class=\"muted\">${Math.round(me.happiness)}<\/span>\n      <\/div>\n    <\/div>\n  <\/div>`;\n}\n\nexport const TABS = [\n  { id: 'life', label: '🌤 인생' },\n  { id: 'love', label: '💞 인연' },\n  { id: 'career', label: '💼 직업' },\n  { id: 'family', label: '🌳 가족' },\n  { id: 'village', label: '🏙 마을' },\n  { id: 'legacy', label: '📜 유산' },\n];\n\nexport const tabsBar = (active) => `\n  <div class=\"tabs\">\n    ${TABS.map((t) => `<button data-act=\"tab\" data-id=\"${t.id}\" class=\"${active === t.id ? 'on' : ''}\">${t.label}<\/button>`).join('')}\n  <\/div>`;\n\n// ── 인생 탭 ───────────────────────────────────────────────\n\nexport function lifeTab(state) {\n  const me = G.player(state);\n  const finance = G.financeSummary(state);\n  const activities = G.availableActivities(state).map((a) => `\n    <button class=\"pill ${state.activity === a.id ? 'on' : ''}\" data-act=\"activity\" data-id=\"${a.id}\" title=\"${esc(a.desc)}\">\n      ${a.icon} ${a.label}\n    <\/button>`).join('');\n\n  const blocked = state.pending && !state.pending.resolved;\n  return `\n  <div class=\"card\">\n    <div class=\"section-head\"><h2>올해는 무엇을 할까요?<\/h2><span class=\"muted\">${state.year}년 · ${me.age}세<\/span><\/div>\n    <div class=\"pill-row\">${activities}<\/div>\n    <p class=\"muted\" style=\"margin-top:10px\">${esc(G.ACTIVITY_BY_ID[state.activity]?.desc ?? '')}<\/p>\n    <button class=\"primary wide\" data-act=\"advance\" ${blocked ? 'disabled' : ''}>\n      ${blocked ? '먼저 이번 이벤트를 마무리하세요' : '한 해를 보낸다 →'}\n    <\/button>\n  <\/div>\n\n  <div class=\"card\">\n    <h3>살림살이 (연간)<\/h3>\n    <div class=\"list\">\n      <div class=\"item\"><span class=\"grow\"><span class=\"t\">수입<\/span><span class=\"s\">직업 + 마을 수익<\/span><\/span><span>${won(finance.income)}<\/span><\/div>\n      <div class=\"item\"><span class=\"grow\"><span class=\"t\">지출<\/span><span class=\"s\">생활비 + 마을 관리비 ${won(finance.maintenance)}<\/span><\/span><span>-${won(finance.expense)}<\/span><\/div>\n      <div class=\"item\"><span class=\"grow\"><span class=\"t\">한 해 수지<\/span><\/span>\n        <strong style=\"color:${finance.net >= 0 ? 'var(--green)' : 'var(--bad)'}\">${finance.net >= 0 ? '+' : ''}${won(finance.net)}<\/strong>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"card\">\n    <h3>인생 기록<\/h3>\n    <div class=\"log\">\n      ${state.log.slice(0, 40).map((l) => `\n        <div class=\"log-line ${l.tone}\"><span class=\"y\">${l.year}<\/span><span>${l.icon} ${esc(l.text)}<\/span><\/div>`).join('')}\n    <\/div>\n  <\/div>`;\n}\n\n// ── 인연 탭 ───────────────────────────────────────────────\n\nexport function loveTab(state) {\n  const me = G.player(state);\n  const partner = G.partnerOf(state);\n  const kids = G.childrenOf(state, me);\n\n  if (me.age < 18) {\n    return `<div class=\"card\"><h2>💞 인연<\/h2><p class=\"muted\">아직은 이릅니다. 18세부터 새로운 사람을 만날 수 있어요.<\/p><\/div>`;\n  }\n\n  if (!partner) {\n    const list = G.candidates(state);\n    const cards = list.map((c) => `\n      <div class=\"item\">\n        <div class=\"avatar\">${avatarSvg(c, 52)}<\/div>\n        <span class=\"grow\">\n          <span class=\"t\">${esc(fullName(c))} <span class=\"muted\">${c.age}세<\/span><\/span>\n          <span class=\"s\">${traitBadges(c) || '평범한 사람'}<\/span>\n          <span class=\"s\">호감도 ${Math.round(c.affection)} / 100<\/span>\n          <span class=\"bar happy\" style=\"margin-top:4px\"><i style=\"width:${Math.round(c.affection)}%\"><\/i><\/span>\n        <\/span>\n        <span style=\"display:grid;gap:6px\">\n          <button data-act=\"date\" data-id=\"${c.id}\" ${state.turnFlags.romanceUsed ? 'disabled' : ''}>데이트 (${won(G.DATE_COST)})<\/button>\n          <button class=\"primary\" data-act=\"propose\" data-id=\"${c.id}\" ${c.affection < 70 || state.money < G.MARRIAGE_COST ? 'disabled' : ''}>청혼 (${won(G.MARRIAGE_COST)})<\/button>\n        <\/span>\n      <\/div>`).join('');\n\n    return `\n    <div class=\"card\">\n      <div class=\"section-head\"><h2>💞 인연 만들기<\/h2><span class=\"muted\">호감도 70 이상이면 청혼할 수 있어요<\/span><\/div>\n      <button class=\"wide\" data-act=\"meet\" ${state.turnFlags.metThisYear || me.partnerId ? 'disabled' : ''}>\n        ${state.turnFlags.metThisYear ? '올해는 이미 만남을 가졌습니다' : `새로운 사람 만나기 (${won(G.MEET_COST)})`}\n      <\/button>\n      <div class=\"list\" style=\"margin-top:12px\">${cards || '<p class=\"muted\">아직 만난 사람이 없습니다.<\/p>'}<\/div>\n    <\/div>`;\n  }\n\n  const birth = G.canHaveChild(state);\n  return `\n  <div class=\"card\">\n    <h2>💞 우리 가족<\/h2>\n    <div class=\"item\">\n      <div class=\"avatar\">${avatarSvg(partner, 60)}<\/div>\n      <span class=\"grow\">\n        <span class=\"t\">${esc(fullName(partner))} <span class=\"muted\">${partner.age}세 · ${jobLabel(partner)}<\/span><\/span>\n        <span class=\"s\">${traitBadges(partner)}<\/span>\n        <span class=\"s\">애정 ${Math.round(partner.affection)} / 100<\/span>\n        <span class=\"bar happy\" style=\"margin-top:4px\"><i style=\"width:${Math.round(partner.affection)}%\"><\/i><\/span>\n      <\/span>\n    <\/div>\n    <button class=\"primary wide\" style=\"margin-top:12px\" data-act=\"have-child\" ${birth.ok ? '' : 'disabled'}>\n      ${birth.ok ? `아이를 갖는다 (${won(G.CHILD_COST_ONCE)})` : esc(birth.reason)}\n    <\/button>\n  <\/div>\n\n  <div class=\"card\">\n    <h3>자녀 ${kids.length}명<\/h3>\n    <div class=\"people-row\">\n      ${kids.length ? kids.map((k) => personCard(state, k)).join('') : '<p class=\"muted\">아직 아이가 없습니다.<\/p>'}\n    <\/div>\n  <\/div>`;\n}\n\n// ── 직업 탭 ───────────────────────────────────────────────\n\nexport function careerTab(state) {\n  const me = G.player(state);\n  const options = G.jobOptions(state);\n  const items = options.map((job) => {\n    const reason = me.education < job.edu\n      ? `${EDUCATION_LABELS[job.edu]} 이상 필요`\n      : Object.entries(job.req).filter(([k, v]) => me.stats[k] < v).map(([k, v]) => `${STAT_LABELS[k]} ${v}`).join(', ');\n    return `\n    <div class=\"item ${job.eligible ? '' : 'locked'}\">\n      <span style=\"font-size:1.6rem\">${job.icon}<\/span>\n      <span class=\"grow\">\n        <span class=\"t\">${job.label} ${job.current ? '<span class=\"badge accent\">현재<\/span>' : ''}<\/span>\n        <span class=\"s\">예상 연봉 ${won(job.expected)} · ${EDUCATION_LABELS[job.edu]}${reason && !job.eligible ? ` · 부족: ${esc(reason)}` : ''}<\/span>\n      <\/span>\n      <button data-act=\"take-job\" data-id=\"${job.id}\" ${job.eligible && !job.current && me.age >= 19 ? '' : 'disabled'}>\n        ${job.current ? '재직 중' : '지원'}\n      <\/button>\n    <\/div>`;\n  }).join('');\n\n  return `\n  <div class=\"card\">\n    <div class=\"section-head\"><h2>💼 직업<\/h2><span class=\"muted\">${jobLabel(me)}<\/span><\/div>\n    <p class=\"muted\">\n      학력 ${EDUCATION_LABELS[me.education]} · 호봉 ${me.jobLevel}/${MAX_JOB_LEVEL}\n      ${me.jobId ? ` · 현재 연봉 ${won(salaryOf(me, G.financeSummary(state).bonuses))}` : ''}\n    <\/p>\n    ${me.age >= 55 && me.jobId ? '<button class=\"ghost wide\" data-act=\"retire\">은퇴하기<\/button>' : ''}\n  <\/div>\n  <div class=\"card\"><div class=\"list\">${items}<\/div><\/div>`;\n}\n\n// ── 가족 탭 ───────────────────────────────────────────────\n\nexport function personCard(state, person) {\n  const me = G.player(state);\n  const classes = ['person-card'];\n  if (person.id === me.id) classes.push('me');\n  if (!person.alive) classes.push('dead');\n  const meta = person.alive\n    ? `${person.age}세 · ${person.jobId ? JOB_BY_ID[person.jobId].label : (person.age >= 19 ? '무직' : '학생')}`\n    : `${person.birthYear}–${person.deathYear}`;\n  return `\n    <button class=\"${classes.join(' ')}\" data-act=\"person\" data-id=\"${person.id}\">\n      ${avatarSvg(person, 56)}\n      <div class=\"pname\">${esc(fullName(person))}<\/div>\n      <div class=\"pmeta\">${meta}<\/div>\n      <div class=\"pmeta\">${person.traits.map((id) => TRAIT_BY_ID[id]?.icon ?? '').join('')}<\/div>\n    <\/button>`;\n}\n\nexport function familyTab(state) {\n  const everyone = G.allPeople(state);\n  const generations = [...new Set(everyone.map((p) => p.generation))].sort((a, b) => a - b);\n  const blocks = generations.map((gen) => {\n    const members = everyone\n      .filter((p) => p.generation === gen && (p.inFamily || p.partnerId))\n      .sort((a, b) => Number(b.alive) - Number(a.alive) || a.birthYear - b.birthYear);\n    if (!members.length) return '';\n    return `\n      <div class=\"gen-block\">\n        <div class=\"gen-title\">${gen}대 · ${members.filter((m) => m.alive).length}명 생존<\/div>\n        <div class=\"people-row\">${members.map((m) => personCard(state, m)).join('')}<\/div>\n      <\/div>`;\n  }).join('');\n\n  return `<div class=\"card\"><h2>🌳 가족 나무<\/h2>${blocks}<\/div>`;\n}\n\n// ── 마을 탭 ───────────────────────────────────────────────\n\nexport function villageTab(state) {\n  const level = villageLevel(state.village);\n  const items = BUILDINGS.map((building) => {\n    const current = state.village.buildings[building.id] ?? 0;\n    const status = buildStatus(state.village, building.id, state.money);\n    const cost = status.cost ?? buildCost(building, current);\n    const effect = current > 0 ? describeEffect(building.effect(current)) : '';\n    return `\n    <div class=\"item ${status.ok ? '' : 'locked'}\">\n      <span style=\"font-size:1.7rem\">${building.icon}<\/span>\n      <span class=\"grow\">\n        <span class=\"t\">${building.label} ${current ? `<span class=\"badge\">Lv.${current}<\/span>` : ''}<\/span>\n        <span class=\"s\">${esc(building.desc)}<\/span>\n        ${effect ? `<span class=\"s\">현재 효과: ${effect}<\/span>` : ''}\n      <\/span>\n      <button data-act=\"build\" data-id=\"${building.id}\" ${status.ok ? '' : 'disabled'}>\n        ${status.maxed ? '최대' : `${current ? '증축' : '건설'} ${won(cost)}`}\n      <\/button>\n    <\/div>`;\n  }).join('');\n\n  return `\n  <div class=\"card\">\n    <div class=\"section-head\">\n      <h2>🏙 ${esc(state.village.name)}<\/h2>\n      <span class=\"muted\">${villageTitle(level)} · Lv.${level} · 명성 ${Math.round(state.village.fame ?? 0)}<\/span>\n    <\/div>\n    <p class=\"muted\">건물은 매년 ${won(villageMaintenance(state.village))}의 관리비가 듭니다.<\/p>\n  <\/div>\n  <div class=\"card\"><div class=\"list\">${items}<\/div><\/div>`;\n}\n\nfunction describeEffect(effect) {\n  const parts = [];\n  if (effect.income) parts.push(`수입 +${won(effect.income)}`);\n  if (effect.incomeRate) parts.push(`소득 +${Math.round(effect.incomeRate * 100)}%`);\n  if (effect.expenseRate) parts.push(`생활비 ${Math.round(effect.expenseRate * 100)}%`);\n  if (effect.happiness) parts.push(`행복 +${effect.happiness.toFixed(1)}`);\n  if (effect.lifespan) parts.push(`수명 +${effect.lifespan.toFixed(1)}`);\n  if (effect.romance) parts.push('인연 확률 ↑');\n  for (const [key, value] of Object.entries(effect.grow ?? {})) {\n    parts.push(`${STAT_LABELS[key]} 성장 +${value.toFixed(1)}`);\n  }\n  return parts.join(' · ');\n}\n\n// ── 유산 탭 ───────────────────────────────────────────────\n\nexport function legacyTab(state) {\n  const me = G.player(state);\n  const succession = G.canSucceed(state);\n  const heirs = succession.ok ? succession.heirs : [];\n  const living = G.allPeople(state).filter((p) => p.alive && p.inFamily).length;\n\n  return `\n  <div class=\"card\">\n    <h2>📜 가문의 유산<\/h2>\n    <div class=\"list\">\n      <div class=\"item\"><span class=\"grow\"><span class=\"t\">세대<\/span><\/span><span>${state.generation}대<\/span><\/div>\n      <div class=\"item\"><span class=\"grow\"><span class=\"t\">함께 사는 가족<\/span><\/span><span>${living}명<\/span><\/div>\n      <div class=\"item\"><span class=\"grow\"><span class=\"t\">태어난 아이<\/span><\/span><span>${state.stats.born}명<\/span><\/div>\n      <div class=\"item\"><span class=\"grow\"><span class=\"t\">지은 건물<\/span><\/span><span>${state.stats.buildingsBuilt}채<\/span><\/div>\n      <div class=\"item\"><span class=\"grow\"><span class=\"t\">최고 자산<\/span><\/span><span>${won(state.stats.peakMoney)}<\/span><\/div>\n      <div class=\"item\"><span class=\"grow\"><span class=\"t\">현재 유산 점수<\/span><\/span><strong>${G.legacyScore(state).toLocaleString('ko-KR')}점<\/strong><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"card\">\n    <h3>대를 잇기<\/h3>\n    <p class=\"muted\">\n      ${succession.ok\n        ? `${esc(fullName(me))}이(가) 물러나고 다음 세대가 이야기를 이어갑니다. 자산의 90%가 전해지고, 물러난 분은 가족과 함께 지냅니다.`\n        : esc(succession.reason)}\n    <\/p>\n    <div class=\"list\">\n      ${heirs.map((h) => `\n        <div class=\"item\">\n          <div class=\"avatar\">${avatarSvg(h, 48)}<\/div>\n          <span class=\"grow\"><span class=\"t\">${esc(fullName(h))}<\/span><span class=\"s\">${h.age}세 · ${jobLabel(h)} · ${h.generation}대<\/span><\/span>\n          <button class=\"primary\" data-act=\"succeed\" data-id=\"${h.id}\">이 사람에게<\/button>\n        <\/div>`).join('')}\n    <\/div>\n  <\/div>\n\n  <div class=\"card\">\n    <h3>게임 관리<\/h3>\n    <div class=\"footer-actions\">\n      <button data-act=\"save\">💾 저장<\/button>\n      <button data-act=\"export\">⬇️ 내보내기<\/button>\n      <button class=\"ghost\" data-act=\"restart\">🔄 새로 시작<\/button>\n    <\/div>\n  <\/div>`;\n}\n\n// ── 모달 ─────────────────────────────────────────────────\n\nexport function eventModal(state, event) {\n  if (event.resolved) {\n    return modal(`\n      <div class=\"icon\">${event.icon}<\/div>\n      <h2>${esc(event.title)}<\/h2>\n      <p class=\"muted\">${esc(event.resolved.label)}<\/p>\n      <div class=\"result-box\">${esc(event.resolved.text)}<\/div>\n      <button class=\"primary wide\" data-act=\"event-close\">계속하기<\/button>`);\n  }\n  const choices = event.choices.map((choice) => `\n    <button class=\"choice\" data-act=\"event-choice\" data-id=\"${choice.index}\" ${choice.affordable ? '' : 'disabled'}>\n      ${esc(choice.label)}\n      <span class=\"c-sub\">\n        ${choice.cost ? `비용 ${won(choice.cost)}${choice.affordable ? '' : ' (자금 부족)'}` : ''}\n        ${choice.odds != null ? `${choice.cost ? ' · ' : ''}${STAT_LABELS[choice.checkLabel]} 판정 · 성공률 ${choice.odds}%` : ''}\n      <\/span>\n    <\/button>`).join('');\n\n  return modal(`\n    <div class=\"icon\">${event.icon}<\/div>\n    <h2>${esc(event.title)}<\/h2>\n    <p>${esc(event.text)}<\/p>\n    <div class=\"choice-grid\">${choices}<\/div>`);\n}\n\nexport function successionModal(state) {\n  const heirs = state.succession.heirIds.map((id) => state.people[id]).filter(Boolean);\n  return modal(`\n    <div class=\"icon\">🕯️<\/div>\n    <h2>가문을 이어갈 사람<\/h2>\n    <p>주인공이 세상을 떠났습니다. 이야기를 이어갈 사람을 선택하세요. (자산의 70%가 상속됩니다)<\/p>\n    <div class=\"list\">\n      ${heirs.map((h) => `\n        <div class=\"item\">\n          <div class=\"avatar\">${avatarSvg(h, 48)}<\/div>\n          <span class=\"grow\"><span class=\"t\">${esc(fullName(h))}<\/span><span class=\"s\">${h.age}세 · ${h.generation}대 · ${jobLabel(h)}<\/span><\/span>\n          <button class=\"primary\" data-act=\"choose-heir\" data-id=\"${h.id}\">선택<\/button>\n        <\/div>`).join('')}\n    <\/div>`);\n}\n\nexport function endModal(state) {\n  return modal(`\n    <div class=\"icon\">📜<\/div>\n    <h2>이야기의 끝<\/h2>\n    <p>${esc(state.ended.reason)}<\/p>\n    <div class=\"result-box\">\n      <strong>${state.generation}대 · ${state.ended.year}년<\/strong><br/>\n      유산 점수 <strong>${state.ended.score.toLocaleString('ko-KR')}점<\/strong><br/>\n      태어난 아이 ${state.stats.born}명 · 지은 건물 ${state.stats.buildingsBuilt}채\n    <\/div>\n    <button class=\"primary wide\" data-act=\"restart\">새로운 가문 시작하기<\/button>`);\n}\n\nexport function personModal(state, person) {\n  const bars = STAT_KEYS.map((key) => `\n    <div class=\"bar-row\">\n      <span>${STAT_LABELS[key]}<\/span>\n      <span class=\"bar ${key}\"><i style=\"width:${Math.round(person.stats[key])}%\"><\/i><\/span>\n      <span class=\"muted\">${Math.round(person.stats[key])}<\/span>\n    <\/div>`).join('');\n  const parents = person.parents.map((id) => state.people[id]).filter(Boolean);\n  const kids = person.children.map((id) => state.people[id]).filter(Boolean);\n\n  return modal(`\n    <div style=\"display:flex;gap:14px;align-items:center\">\n      <div class=\"avatar\">${avatarSvg(person, 76)}<\/div>\n      <div>\n        <h2 style=\"margin-bottom:2px\">${esc(fullName(person))}<\/h2>\n        <div class=\"muted\">${person.alive ? `${person.age}세 · ${stageOf(person.age).label}` : `${person.birthYear}–${person.deathYear} · 향년 ${person.age}세`}<\/div>\n        <div class=\"muted\">${jobLabel(person)} · ${EDUCATION_LABELS[person.education]} · ${person.generation}대<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"badges\" style=\"margin-top:10px\">${traitBadges(person)}<\/div>\n    <div class=\"bars\" style=\"margin-top:12px\">\n      ${bars}\n      <div class=\"bar-row\"><span>행복<\/span><span class=\"bar happy\"><i style=\"width:${Math.round(person.happiness)}%\"><\/i><\/span><span class=\"muted\">${Math.round(person.happiness)}<\/span><\/div>\n    <\/div>\n    <p class=\"muted\" style=\"margin-top:12px\">\n      ${parents.length ? `부모: ${parents.map((p) => esc(fullName(p))).join(', ')}<br/>` : ''}\n      ${kids.length ? `자녀: ${kids.map((k) => esc(fullName(k))).join(', ')}` : ''}\n    <\/p>\n    <button class=\"wide\" data-act=\"close-modal\">닫기<\/button>`);\n}\n\nconst modal = (inner) => `<div class=\"modal-bg\"><div class=\"modal\">${inner}<\/div><\/div>`;\n","deps":[["./avatar.js","src/ui/avatar.js"],["../core/person.js","src/core/person.js"],["../core/util.js","src/core/util.js"],["../data/traits.js","src/data/traits.js"],["../data/jobs.js","src/data/jobs.js"],["../data/buildings.js","src/data/buildings.js"],["../core/village.js","src/core/village.js"],["../core/economy.js","src/core/economy.js"],["../core/game.js","src/core/game.js"]]},{"path":"src/core/save.js","code":"// 저장/불러오기 (브라우저 localStorage + JSON 내보내기)\nimport { rehydrate } from './game.js';\n\nexport const SAVE_KEY = 'family-go/save-v1';\nexport const SAVE_VERSION = 1;\n\nconst storage = () => (typeof localStorage === 'undefined' ? null : localStorage);\n\nexport function serialize(state) {\n  return JSON.stringify({ version: SAVE_VERSION, savedAt: Date.now(), state });\n}\n\nexport function deserialize(text) {\n  const data = JSON.parse(text);\n  if (!data?.state) throw new Error('저장 파일 형식이 올바르지 않습니다.');\n  if (data.version !== SAVE_VERSION) throw new Error('저장 파일 버전이 다릅니다.');\n  return rehydrate(data.state);\n}\n\nexport function saveGame(state) {\n  const store = storage();\n  if (!store) return false;\n  try {\n    store.setItem(SAVE_KEY, serialize(state));\n    return true;\n  } catch {\n    return false;\n  }\n}\n\nexport function loadGame() {\n  const store = storage();\n  if (!store) return null;\n  const text = store.getItem(SAVE_KEY);\n  if (!text) return null;\n  try {\n    return deserialize(text);\n  } catch {\n    return null;\n  }\n}\n\nexport function hasSave() {\n  return Boolean(storage()?.getItem(SAVE_KEY));\n}\n\nexport function clearSave() {\n  storage()?.removeItem(SAVE_KEY);\n}\n","deps":[["./game.js","src/core/game.js"]]},{"path":"src/ui/app.js","code":"// 앱 진입점: 상태를 들고, 화면을 그리고, 클릭을 게임 함수로 연결한다.\nimport * as G from '../core/game.js';\nimport * as V from './views.js';\nimport { saveGame, loadGame, hasSave, clearSave, serialize } from '../core/save.js';\nimport { fullName } from '../core/person.js';\n\nconst app = document.getElementById('app');\nconst modalRoot = document.getElementById('modal-root');\n\nlet state = null;\nlet tab = 'life';\nlet openPersonId = null;\nlet draft = { familyName: '', givenName: '', gender: '', traitId: '', villageName: '' };\n\n// ── 렌더 ─────────────────────────────────────────────────\n\nfunction render() {\n  if (!state) {\n    app.innerHTML = V.titleScreen({ canContinue: hasSave(), draft });\n    modalRoot.innerHTML = '';\n    return;\n  }\n\n  const body = {\n    life: V.lifeTab,\n    love: V.loveTab,\n    career: V.careerTab,\n    family: V.familyTab,\n    village: V.villageTab,\n    legacy: V.legacyTab,\n  }[tab] ?? V.lifeTab;\n\n  app.innerHTML = V.topBar(state) + V.heroCard(state) + V.tabsBar(tab) + body(state);\n  renderModal();\n}\n\nfunction renderModal() {\n  if (state?.ended) {\n    modalRoot.innerHTML = V.endModal(state);\n    return;\n  }\n  if (state?.succession) {\n    modalRoot.innerHTML = V.successionModal(state);\n    return;\n  }\n  if (openPersonId && state?.people[openPersonId]) {\n    modalRoot.innerHTML = V.personModal(state, state.people[openPersonId]);\n    return;\n  }\n  const event = state ? G.pendingEvent(state) : null;\n  modalRoot.innerHTML = event ? V.eventModal(state, event) : '';\n}\n\nlet toastTimer = null;\nfunction toast(message) {\n  const el = document.createElement('div');\n  el.className = 'toast';\n  el.textContent = message;\n  document.body.appendChild(el);\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(() => el.remove(), 2200);\n}\n\nconst autosave = () => { if (state) saveGame(state); };\n\n/** 타이틀 화면의 입력값을 draft 로 옮긴다 (다시 그려도 지워지지 않도록) */\nfunction captureDraft() {\n  const get = (id) => document.getElementById(id)?.value?.trim() ?? '';\n  draft.familyName = get('in-family');\n  draft.givenName = get('in-given');\n  draft.villageName = get('in-village');\n}\n\n// ── 액션 ─────────────────────────────────────────────────\n\nconst actions = {\n  'draft-gender': (id) => { captureDraft(); draft.gender = id; render(); },\n  'draft-trait': (id) => { captureDraft(); draft.traitId = draft.traitId === id ? '' : id; render(); },\n\n  'new-game': () => {\n    captureDraft();\n    state = G.newGame({\n      seed: Math.floor(Math.random() * 2 ** 31),\n      familyName: draft.familyName || undefined,\n      givenName: draft.givenName || undefined,\n      gender: draft.gender || undefined,\n      traitId: draft.traitId || undefined,\n      villageName: draft.villageName || undefined,\n    });\n    tab = 'life';\n    autosave();\n    render();\n  },\n\n  continue: () => {\n    const loaded = loadGame();\n    if (!loaded) { toast('저장된 게임을 찾지 못했습니다.'); return; }\n    state = loaded;\n    tab = 'life';\n    render();\n  },\n\n  tab: (id) => { tab = id; render(); },\n  activity: (id) => { state.activity = id; render(); },\n\n  advance: () => {\n    G.advanceYear(state, state.activity);\n    autosave();\n    render();\n  },\n\n  'event-choice': (index) => {\n    const result = G.resolveEvent(state, Number(index));\n    if (!result) { toast('그 선택은 지금 할 수 없습니다.'); return; }\n    autosave();\n    render();\n  },\n  'event-close': () => { G.dismissEvent(state); render(); },\n\n  meet: () => {\n    const result = G.meetPeople(state);\n    if (!result.ok) toast(result.reason);\n    autosave();\n    render();\n  },\n  date: (id) => {\n    const result = G.date(state, id);\n    if (!result.ok) toast(result.reason);\n    autosave();\n    render();\n  },\n  propose: (id) => {\n    const result = G.propose(state, id);\n    toast(result.ok ? '결혼했습니다! 💍' : result.reason);\n    autosave();\n    render();\n  },\n  'have-child': () => {\n    const result = G.haveChild(state);\n    toast(result.ok ? `${fullName(result.child)}이(가) 태어났습니다! 👶` : result.reason);\n    autosave();\n    render();\n  },\n\n  'take-job': (id) => {\n    const result = G.takeJob(state, id);\n    if (!result.ok) toast(result.reason);\n    autosave();\n    render();\n  },\n  retire: () => {\n    const result = G.retire(state);\n    if (!result.ok) toast(result.reason);\n    autosave();\n    render();\n  },\n\n  build: (id) => {\n    const result = G.buildBuilding(state, id);\n    if (!result.ok) toast(result.reason);\n    autosave();\n    render();\n  },\n\n  succeed: (id) => {\n    const result = G.succeedTo(state, id);\n    if (!result.ok) { toast(result.reason); return; }\n    tab = 'life';\n    autosave();\n    render();\n  },\n  'choose-heir': (id) => {\n    G.chooseHeir(state, id);\n    tab = 'life';\n    autosave();\n    render();\n  },\n\n  person: (id) => { openPersonId = id; renderModal(); },\n  'close-modal': () => { openPersonId = null; renderModal(); },\n\n  save: () => { toast(saveGame(state) ? '저장했습니다.' : '저장에 실패했습니다.'); },\n  export: () => {\n    const blob = new Blob([serialize(state)], { type: 'application/json' });\n    const url = URL.createObjectURL(blob);\n    const link = document.createElement('a');\n    link.href = url;\n    link.download = `family-go-${state.year}.json`;\n    link.click();\n    URL.revokeObjectURL(url);\n  },\n  restart: () => {\n    if (!confirm('지금 가문의 이야기를 접고 새로 시작할까요?')) return;\n    clearSave();\n    state = null;\n    openPersonId = null;\n    render();\n  },\n};\n\ndocument.addEventListener('click', (event) => {\n  const target = event.target.closest('[data-act]');\n  if (!target) return;\n  const action = actions[target.dataset.act];\n  if (!action) return;\n  event.preventDefault();\n  action(target.dataset.id);\n});\n\nrender();\n","deps":[["../core/game.js","src/core/game.js"],["./views.js","src/ui/views.js"],["../core/save.js","src/core/save.js"],["../core/person.js","src/core/person.js"]]}]</script>
<script type="module">
// 번들된 모듈들을 순서대로 blob URL 로 만들어 연결한다.
const modules = JSON.parse(document.getElementById('bundle').textContent);
const urls = {};
for (const { path, code, deps } of modules) {
  let source = code;
  for (const [spec, depPath] of deps) {
    const url = urls[depPath];
    source = source.split(`'${spec}'`).join(`'${url}'`).split(`"${spec}"`).join(`"${url}"`);
  }
  urls[path] = URL.createObjectURL(new Blob([source], { type: 'text/javascript' }));
}
await import(urls['src/ui/app.js']);
