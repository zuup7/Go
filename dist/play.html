<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Family Go! — 대를 잇는 인생 시뮬레이션</title>
<meta name="description" content="가족을 만들고, 인생을 선택하며, 세대를 이어가는 나만의 이야기를 만들어보세요." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A1%3C/text%3E%3C/svg%3E" />
<style>
/* Family Go! — 따뜻하고 편안한 톤 */
:root {
  --bg: #fbf6ef;
  --bg-soft: #f4ece1;
  --card: #ffffff;
  --ink: #3d3229;
  --ink-soft: #7d7166;
  --line: #e7dccd;
  --accent: #e08a5b;
  --accent-soft: #f7d9c6;
  --green: #6fa86f;
  --blue: #6f92b8;
  --pink: #d97f96;
  --gold: #d8a94a;
  --bad: #c66565;
  --radius: 18px;
  --shadow: 0 6px 20px rgba(96, 74, 55, 0.09);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #221d19;
    --bg-soft: #2b2521;
    --card: #302a25;
    --ink: #f2e9df;
    --ink-soft: #b6a798;
    --line: #453c34;
    --accent: #e79a6c;
    --accent-soft: #4a382c;
    --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}

.app { max-width: 960px; margin: 0 auto; padding: 16px 16px 64px; }

h1, h2, h3 { margin: 0 0 8px; line-height: 1.3; }
h1 { font-size: 1.7rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0 0 10px; }

button {
  font: inherit;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  border-radius: 12px;
  padding: 9px 14px;
  transition: transform .08s ease, background .15s ease, border-color .15s ease;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
button.ghost { background: transparent; }
button.wide { width: 100%; }

input, select {
  font: inherit; padding: 9px 12px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); width: 100%;
}

.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px;
}

/* ── 타이틀 ── */
.title-screen { text-align: center; padding: 24px 0; }
.title-screen .logo { font-size: 3.2rem; line-height: 1; }
.title-screen .tag { color: var(--ink-soft); margin-bottom: 20px; }
.form-grid { display: grid; gap: 12px; text-align: left; }
.form-grid label { font-size: .85rem; color: var(--ink-soft); display: block; margin-bottom: 4px; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pill-row { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  border-radius: 999px; padding: 7px 13px; font-size: .88rem;
  border: 1px solid var(--line); background: var(--card);
}
.pill.on { background: var(--accent-soft); border-color: var(--accent); font-weight: 700; }

/* ── 상단바 ── */
.topbar {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px; box-shadow: var(--shadow); margin-bottom: 14px;
}
.stat-chip { text-align: center; }
.stat-chip .k { font-size: .72rem; color: var(--ink-soft); display: block; }
.stat-chip .v { font-weight: 700; font-size: .98rem; }

/* ── 캐릭터 카드 ── */
.hero { display: flex; gap: 14px; align-items: flex-start; }
.avatar {
  background: var(--bg-soft); border-radius: 50%; border: 2px solid var(--line);
  flex: 0 0 auto; display: grid; place-items: center; overflow: hidden;
}
.avatar-svg { display: block; }
.hero-info { flex: 1; min-width: 0; }
.name-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.name-line .name { font-size: 1.25rem; font-weight: 800; }
.muted { color: var(--ink-soft); font-size: .85rem; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.badge {
  font-size: .78rem; padding: 3px 9px; border-radius: 999px;
  background: var(--bg-soft); border: 1px solid var(--line);
}
.badge.accent { background: var(--accent-soft); border-color: var(--accent); }

.bars { margin-top: 12px; display: grid; gap: 7px; }
.bar-row { display: grid; grid-template-columns: 46px 1fr 34px; gap: 8px; align-items: center; font-size: .8rem; }
.bar { height: 8px; background: var(--bg-soft); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.bar.health > i { background: var(--green); }
.bar.intellect > i { background: var(--blue); }
.bar.charm > i { background: var(--pink); }
.bar.creativity > i { background: #a97fbd; }
.bar.fitness > i { background: var(--gold); }
.bar.happy > i { background: linear-gradient(90deg, var(--gold), var(--pink)); }

/* ── 탭 ── */
.tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 4px; }
.tabs button { white-space: nowrap; border-radius: 999px; padding: 8px 14px; }
.tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }

/* ── 목록 ── */
.list { display: grid; gap: 10px; }
.item {
  display: flex; gap: 12px; align-items: center;
  border: 1px solid var(--line); border-radius: 14px; padding: 11px; background: var(--bg-soft);
}
.item .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item .t { font-weight: 700; display: block; }
.item .s { font-size: .82rem; color: var(--ink-soft); display: block; line-height: 1.45; }
.item .badge { display: inline-block; }
.item.locked { opacity: .55; }

.grid-2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }

.choice-grid { display: grid; gap: 8px; }
.choice {
  text-align: left; padding: 12px 14px; border-radius: 14px; width: 100%;
  border: 1px solid var(--line); background: var(--bg-soft);
}
.choice:hover:not(:disabled) { background: var(--accent-soft); }
.choice .c-sub { display: block; font-size: .78rem; color: var(--ink-soft); margin-top: 2px; }
.choice .c-sub:empty { display: none; }

.log { display: grid; gap: 6px; max-height: 340px; overflow-y: auto; }
.log-line { display: flex; gap: 9px; font-size: .87rem; padding: 6px 8px; border-radius: 10px; background: var(--bg-soft); }
.log-line .y { color: var(--ink-soft); flex: 0 0 40px; font-variant-numeric: tabular-nums; }
.log-line.good { background: #e9f3e6; }
.log-line.bad { background: #f7e8e6; }
@media (prefers-color-scheme: dark) {
  .log-line.good { background: #2f3a2c; }
  .log-line.bad { background: #3d2a29; }
}

/* ── 가족 트리 ── */
.gen-block { margin-bottom: 14px; }
.gen-title { font-size: .8rem; color: var(--ink-soft); margin-bottom: 6px; letter-spacing: .05em; }
.people-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.person-card {
  background: var(--bg-soft); border: 1px solid var(--line); border-radius: 14px;
  padding: 10px; text-align: center;
}
.person-card.me { border-color: var(--accent); background: var(--accent-soft); }
.person-card.dead { opacity: .5; }
.person-card .pname { font-weight: 700; font-size: .9rem; margin-top: 4px; }
.person-card .pmeta { font-size: .75rem; color: var(--ink-soft); }

/* ── 모달 ── */
.modal-bg {
  position: fixed; inset: 0; background: rgba(40, 30, 22, .55);
  display: grid; place-items: center; padding: 16px; z-index: 50;
}
.modal {
  background: var(--card); border-radius: 20px; padding: 20px; max-width: 460px; width: 100%;
  box-shadow: 0 20px 50px rgba(0,0,0,.25); max-height: 88vh; overflow-y: auto;
}
.modal .icon { font-size: 2.4rem; }
.result-box {
  background: var(--bg-soft); border-radius: 14px; padding: 12px; margin: 12px 0;
  border-left: 4px solid var(--accent);
}
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px;
  font-size: .88rem; z-index: 80; box-shadow: var(--shadow);
}
.footer-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }

@media (max-width: 520px) {
  .topbar { grid-template-columns: repeat(2, 1fr); }
  .row-2 { grid-template-columns: 1fr; }
}

</style>
</head>

ct: (lv) => ({ income: 200 * lv, happiness: 0.6 * lv, romance: 0.05 * lv }),\n  },\n  {\n    id: 'library', label: '도서관', icon: '📚', base: 2000, step: 1400, maxLevel: 4, requires: { villageLevel: 3 },\n    desc: '조용히 앉아 있기만 해도 똑똑해지는 기분.',\n    effect: (lv) => ({ grow: { intellect: 0.9 * lv }, happiness: 0.3 * lv }),\n  },\n  {\n    id: 'market', label: '시장', icon: '🧺', base: 2600, step: 1800, maxLevel: 4, requires: { villageLevel: 4 },\n    desc: '마을 경제의 심장.',\n    effect: (lv) => ({ incomeRate: 0.05 * lv, expenseRate: -0.03 * lv }),\n  },\n  {\n    id: 'theater', label: '극장', icon: '🎭', base: 3200, step: 2200, maxLevel: 3, requires: { villageLevel: 5 },\n    desc: '마을의 자랑. 축제가 열린다.',\n    effect: (lv) => ({ happiness: 2 * lv, income: 300 * lv, grow: { charm: 0.5 * lv } }),\n  },\n];\n\nexport const BUILDING_BY_ID = Object.fromEntries(BUILDINGS.map((b) => [b.id, b]));\n\n/** 다음 레벨 건설/증축 비용 */\nexport function buildCost(building, currentLevel) {\n  return building.base + building.step * currentLevel;\n}\n","deps":[]},{"path":"src/core/village.js","code":"// 마을: 건물을 짓고 올릴수록 가족 전체가 이득을 본다.\nimport { BUILDINGS, BUILDING_BY_ID, buildCost } from '../data/buildings.js';\n\n/** 지어진 건물 레벨의 합으로 마을 등급이 정해진다 */\nexport function villageLevel(village) {\n  const total = Object.values(village.buildings).reduce((a, b) => a + b, 0);\n  return Math.max(1, Math.min(10, 1 + Math.floor(total / 3)));\n}\n\nexport function villageTitle(level) {\n  if (level >= 9) return '대도시';\n  if (level >= 7) return '번화한 도시';\n  if (level >= 5) return '작은 도시';\n  if (level >= 3) return '활기찬 마을';\n  return '조용한 마을';\n}\n\n/** 건물이 많을수록 관리에 돈이 든다 (연간, 만원) */\nexport const MAINTENANCE_PER_LEVEL = 110;\n\nexport function villageMaintenance(village) {\n  const levels = Object.values(village.buildings).reduce((a, b) => a + b, 0);\n  return levels * MAINTENANCE_PER_LEVEL;\n}\n\n/** 모든 건물 효과 합계 */\nexport function villageBonuses(village) {\n  const total = { income: 0, incomeRate: 0, expenseRate: 0, happiness: 0, lifespan: 0, romance: 0, grow: {} };\n  for (const [id, level] of Object.entries(village.buildings)) {\n    const building = BUILDING_BY_ID[id];\n    if (!building || level <= 0) continue;\n    const effect = building.effect(level);\n    for (const [key, value] of Object.entries(effect)) {\n      if (key === 'grow') {\n        for (const [statKey, statValue] of Object.entries(value)) {\n          total.grow[statKey] = (total.grow[statKey] ?? 0) + statValue;\n        }\n      } else {\n        total[key] = (total[key] ?? 0) + value;\n      }\n    }\n  }\n  total.happiness += (village.fame ?? 0) * 0.05;\n  return total;\n}\n\n/** 지금 지을(올릴) 수 있는지 */\nexport function buildStatus(village, buildingId, money) {\n  const building = BUILDING_BY_ID[buildingId];\n  if (!building) return { ok: false, reason: '알 수 없는 건물' };\n  const level = village.buildings[buildingId] ?? 0;\n  if (level >= building.maxLevel) return { ok: false, reason: '최대 레벨', maxed: true, level };\n  const cost = buildCost(building, level);\n  const need = building.requires?.villageLevel ?? 0;\n  if (villageLevel(village) < need) return { ok: false, reason: `마을 ${need}등급 필요`, cost, level };\n  if (money < cost) return { ok: false, reason: '자금 부족', cost, level };\n  return { ok: true, cost, level };\n}\n\n/** 건설/증축 실행. 성공하면 든 비용을 돌려준다. */\nexport function build(village, buildingId, money) {\n  const status = buildStatus(village, buildingId, money);\n  if (!status.ok) return { ok: false, reason: status.reason, spent: 0 };\n  village.buildings[buildingId] = (village.buildings[buildingId] ?? 0) + 1;\n  return { ok: true, spent: status.cost, level: village.buildings[buildingId] };\n}\n\nexport function createVillage(name) {\n  const village = { name, buildings: {}, fame: 0 };\n  for (const building of BUILDINGS) {\n    if (building.startLevel) village.buildings[building.id] = building.startLevel;\n  }\n  return village;\n}\n","deps":[["../data/buildings.js","src/data/buildings.js"]]},{"path":"src/data/jobs.js","code":"// 직업 목록. edu 는 필요한 최소 학력(0 무학 ~ 4 대학원졸), req 는 최소 스탯.\n// salary 는 연봉(만원), growth 는 승진 1단계당 상승률.\nexport const JOBS = [\n  { id: 'farmer', label: '농부', icon: '🌾', edu: 0, req: { fitness: 20 }, salary: 2200, growth: 0.06, stat: 'fitness', happiness: 1 },\n  { id: 'clerk', label: '상점 점원', icon: '🏪', edu: 1, req: { charm: 20 }, salary: 2400, growth: 0.06, stat: 'charm' },\n  { id: 'cook', label: '요리사', icon: '🍳', edu: 1, req: { creativity: 30 }, salary: 2900, growth: 0.08, stat: 'creativity' },\n  { id: 'builder', label: '목수', icon: '🔨', edu: 1, req: { fitness: 40 }, salary: 3200, growth: 0.07, stat: 'fitness' },\n  { id: 'driver', label: '운전기사', icon: '🚚', edu: 1, req: { health: 35 }, salary: 3000, growth: 0.05, stat: 'health' },\n  { id: 'athlete', label: '운동선수', icon: '🏅', edu: 1, req: { fitness: 70, health: 55 }, salary: 5200, growth: 0.14, stat: 'fitness', happiness: 1 },\n  { id: 'idol', label: '아이돌', icon: '🎤', edu: 1, req: { charm: 75, creativity: 50 }, salary: 6000, growth: 0.16, stat: 'charm' },\n  { id: 'artist', label: '화가', icon: '🎨', edu: 2, req: { creativity: 60 }, salary: 3000, growth: 0.11, stat: 'creativity', happiness: 2 },\n  { id: 'nurse', label: '간호사', icon: '💊', edu: 3, req: { intellect: 55, health: 45 }, salary: 4200, growth: 0.08, stat: 'health', happiness: 1 },\n  { id: 'teacher', label: '교사', icon: '🏫', edu: 3, req: { intellect: 60, charm: 40 }, salary: 4000, growth: 0.08, stat: 'intellect', happiness: 1 },\n  { id: 'engineer', label: '엔지니어', icon: '⚙️', edu: 3, req: { intellect: 65 }, salary: 5000, growth: 0.11, stat: 'intellect' },\n  { id: 'designer', label: '디자이너', icon: '🖌️', edu: 3, req: { creativity: 65, intellect: 45 }, salary: 4600, growth: 0.10, stat: 'creativity' },\n  { id: 'merchant', label: '사업가', icon: '📈', edu: 2, req: { charm: 55, intellect: 50 }, salary: 4400, growth: 0.16, stat: 'charm' },\n  { id: 'doctor', label: '의사', icon: '🩺', edu: 4, req: { intellect: 80, health: 55 }, salary: 7800, growth: 0.10, stat: 'intellect' },\n  { id: 'professor', label: '교수', icon: '🎓', edu: 4, req: { intellect: 85, creativity: 55 }, salary: 6800, growth: 0.09, stat: 'intellect', happiness: 1 },\n];\n\nexport const JOB_BY_ID = Object.fromEntries(JOBS.map((j) => [j.id, j]));\n\n/** 지원 가능 여부 */\nexport function canApply(person, job) {\n  if (person.education < job.edu) return false;\n  return Object.entries(job.req).every(([key, min]) => person.stats[key] >= min);\n}\n","deps":[]},{"path":"src/core/economy.js","code":"// 살림살이: 버는 돈과 쓰는 돈.\nimport { JOB_BY_ID } from '../data/jobs.js';\nimport { traitEffects } from './genetics.js';\n\nexport const BASE_LIVING_COST = 1200;  // 성인 1인 연간 생활비(만원)\nexport const MAX_JOB_LEVEL = 10;       // 호봉 상한\nexport const CHILD_COST = 600;         // 아이 1인 추가 비용\n\n/** 개인의 연봉 (직업 + 승진 + 특성 + 마을 보정) */\nexport function salaryOf(person, bonuses = {}) {\n  if (!person.jobId || !person.alive) return 0;\n  const job = JOB_BY_ID[person.jobId];\n  if (!job) return 0;\n  const traits = traitEffects(person.traits);\n  const skill = person.stats[job.stat] ?? 50;\n  const levelMul = 1 + job.growth * Math.min(MAX_JOB_LEVEL, person.jobLevel);\n  const skillMul = 0.65 + skill / 100;\n  const mul = 1 + traits.income + (bonuses.incomeRate ?? 0);\n  return Math.round(job.salary * levelMul * skillMul * Math.max(0.3, mul));\n}\n\n/** 가구 전체 연 수입 */\nexport function householdIncome(members, bonuses = {}) {\n  const wages = members.reduce((sum, person) => sum + salaryOf(person, bonuses), 0);\n  return Math.round(wages + (bonuses.income ?? 0));\n}\n\n/** 가구 전체 연 지출 */\nexport function householdExpense(members, bonuses = {}, extraUpkeep = 0) {\n  const adults = members.filter((p) => p.age >= 19).length;\n  const kids = members.filter((p) => p.age < 19).length;\n  const traitRate = members.reduce((sum, p) => sum + traitEffects(p.traits).expense, 0) / Math.max(1, members.length);\n  const rate = Math.max(0.4, 1 + traitRate + (bonuses.expenseRate ?? 0));\n  const base = adults * BASE_LIVING_COST + kids * CHILD_COST + extraUpkeep * 120;\n  return Math.round(base * rate);\n}\n\n/** 승진 판정: 실력이 좋고 일에 집중할수록 잘 오른다 */\nexport function promotionChance(person, focused) {\n  if (!person.jobId || person.jobLevel >= MAX_JOB_LEVEL) return 0;\n  const job = JOB_BY_ID[person.jobId];\n  const skill = person.stats[job.stat] ?? 50;\n  const base = 0.10 + (skill - 45) / 260 + (focused ? 0.22 : 0);\n  const fatigue = person.jobLevel * 0.012;\n  return Math.max(0.02, Math.min(0.85, base - fatigue));\n}\n","deps":[["../data/jobs.js","src/data/jobs.js"],["./genetics.js","src/core/genetics.js"]]},{"path":"src/data/events.js","code":"// 인생 이벤트. 매년 한 개가 조건과 가중치에 따라 등장한다.\n//\n// text/label 안의 {me} {partner} {child} {village} 는 엔진이 치환한다.\n// choice 는 두 형태 중 하나:\n//   1) { label, effects, result }                      — 즉시 확정\n//   2) { label, check: { stat, difficulty }, success, fail } — 스탯 판정\n// effects 키: money / happiness / stats{} / affection / addTrait / education / lifespan / childHappiness\nexport const EVENTS = [\n  // ── 유년기 ──────────────────────────────────────────────\n  {\n    id: 'first_word', icon: '👶', title: '첫 마디', weight: 3, minAge: 1, maxAge: 4, once: true,\n    text: '{me}이(가) 처음으로 말을 했습니다. 무슨 말이었을까요?',\n    choices: [\n      { label: '\"엄마!\"', result: '가족 모두가 울고 웃었습니다.', effects: { happiness: 6, stats: { charm: 3 } } },\n      { label: '\"이거 뭐야?\"', result: '호기심 많은 아이로 자랄 것 같습니다.', effects: { stats: { intellect: 4 }, happiness: 3 } },\n    ],\n  },\n  {\n    id: 'scraped_knee', icon: '🩹', title: '넘어진 무릎', weight: 4, minAge: 4, maxAge: 11,\n    text: '뛰어놀다 크게 넘어졌습니다. {me}은(는) 울음을 참는 중입니다.',\n    choices: [\n      { label: '툭툭 털고 다시 뛴다', result: '무릎은 아팠지만 마음은 단단해졌습니다.', effects: { stats: { fitness: 3, health: 1 }, happiness: -1 } },\n      { label: '집으로 돌아가 쉰다', result: '따뜻한 손길에 금세 나았습니다.', effects: { stats: { health: 3 }, happiness: 2 } },\n    ],\n  },\n  {\n    id: 'talent_found', icon: '✨', title: '숨겨진 재능', weight: 3, minAge: 6, maxAge: 15, once: true,
