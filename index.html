<title>한국사 연표 스프린트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="theme-color" content="#2B1F33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="연표 스프린트">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Do+Hyeon&family=Gothic+A1:wght@400;700;800&display=swap">

<style>
/* ══════════════════════════════════════════════════════════════
   HANSA OS — 1985년식 픽셀 데스크톱. 세 앱이 같은 껍데기를 쓴다.
   단일 세계관이라 테마 전환 없이 모든 색을 직접 칠한다.
   ══════════════════════════════════════════════════════════════ */
:root{
  --desk:#6E5A7D; --desk-d:#4A3B57; --desk-l:#8A7399;
  --cream:#FBF3E2; --panel:#F2E5C9; --panel-d:#E3D2AE;
  --ink:#2B1F33; --ink-2:#5A4A66; --ink-3:#8B7A96;
  --yel:#F5C63C; --yel-d:#C89A18;
  --f-px:"Press Start 2P","Courier New",monospace;
  --f-h:"Do Hyeon","Gothic A1",sans-serif;
  --bd:3px; --sh:4px;

  /* 앞서 쓰던 토큰 이름을 새 팔레트로 잇는다 — 규칙을 전부 고치지 않아도 되게 */
  --bg:#6E5A7D; --bg-2:#E3D2AE; --surf:#FBF3E2; --surf-2:#F2E5C9;
  --line:#2B1F33; --line-2:#8B7A96;
  --tx:#2B1F33; --tx-2:#5A4A66; --tx-3:#7A6885;
  --brand:#3D6BB5; --brand-soft:#DCE5F5; --brand-tx:#24457A;
  --red:#D2453B; --red-soft:#F6DAD6; --red-tx:#96271F;
  --grn:#2F8C7E; --grn-soft:#D6EDE7; --grn-tx:#1D5C52;
  --gold:#B25F14; --gold-soft:#FAE4C2;
  --shadow:var(--sh) var(--sh) 0 rgba(43,31,51,.28);
  --shadow-lg:var(--sh) var(--sh) 0 rgba(43,31,51,.36);
  --r:0; --r-sm:0;
  --f-d:"Do Hyeon","Gothic A1",sans-serif;
  --f-b:"Gothic A1","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-m:"Press Start 2P","Gothic A1",ui-monospace,monospace;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  border-radius:0!important;image-rendering:pixelated}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--desk);
  background-image:
    repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 2px,transparent 2px 4px),
    linear-gradient(160deg,var(--desk-l) 0%,var(--desk) 45%,var(--desk-d) 100%);
  background-attachment:fixed;
  color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.7;
  word-break:keep-all;min-height:100vh;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;font-family:var(--f-b)}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── 데스크톱 상단 바 ── */
.osbar{position:sticky;top:0;z-index:60;background:var(--ink);color:var(--cream);
  display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:var(--bd) solid #150E1B;
  font-family:var(--f-px);font-size:9px;letter-spacing:.04em}
.osbar .logo{display:inline-flex;gap:2px;flex-shrink:0}
.osbar .logo i{width:4px;height:12px;display:block;transform:skewX(-18deg)}
.osbar .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.osbar .clk{flex-shrink:0;color:var(--yel)}
@media(max-width:400px){.osbar{font-size:8px;gap:7px}}

/* ── 셸: 데스크톱 위의 창 + 독 ── */
.wrap{max-width:1060px;margin:0 auto;padding:12px 12px 88px;display:grid;
  grid-template-columns:1fr;gap:12px;min-height:calc(100dvh - 44px)}
@supports not (height:100dvh){.wrap{min-height:calc(100vh - 44px)}}
@media(min-width:1000px){
  .wrap{grid-template-columns:1fr 300px;align-items:start;padding:16px;gap:16px}
  .rail{position:sticky;top:60px}
}
.col{width:100%;min-width:0;display:flex;flex-direction:column}
.col .win{flex:1}
.rail{display:none}
@media(min-width:1000px){.rail{display:flex;flex-direction:column;gap:12px}}

/* 창 */
.win{background:var(--cream);border:var(--bd) solid var(--ink);
  box-shadow:var(--sh) var(--sh) 0 rgba(21,14,27,.55);display:flex;flex-direction:column;min-width:0}
.bar{background:var(--ink);color:var(--cream);display:flex;align-items:center;gap:8px;
  padding:6px 7px;border-bottom:var(--bd) solid var(--ink);flex-shrink:0}
.bar .ttl{flex:1;min-width:0;font-family:var(--f-px);font-size:9.5px;letter-spacing:.03em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:5px 7px;background:repeating-linear-gradient(90deg,#3B2C47 0 3px,transparent 3px 6px)}
.ib{width:30px;height:30px;flex-shrink:0;background:var(--panel);border:2px solid var(--ink);
  position:relative;box-shadow:inset -2px -2px 0 var(--panel-d),inset 2px 2px 0 #fff;
  display:grid;place-items:center;color:var(--ink);font-family:var(--f-px);font-size:9px}
.ib::after{content:"";position:absolute;inset:-8px}  /* 보이는 크기는 30px, 손가락 영역은 46px */
.ib:active{box-shadow:inset 2px 2px 0 var(--panel-d);transform:translate(1px,1px)}
.body{flex:1;display:flex;flex-direction:column;gap:12px;padding:13px;min-width:0}
@media(min-width:560px){.body{padding:16px}}

/* ── 상태 칩 (D-day · 연속) ── */
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:5px 9px;
  background:var(--panel);border:2px solid var(--ink);
  box-shadow:inset -2px -2px 0 var(--panel-d),inset 2px 2px 0 #fff;
  font-size:12.5px;font-weight:700;white-space:nowrap;line-height:1.5;
}
.chip .n{font-family:var(--f-px);font-size:9px;letter-spacing:0}
.chip.dday{background:#C63A30;color:#fff;cursor:pointer;
  box-shadow:inset -2px -2px 0 #8E241C,inset 2px 2px 0 #E07C72}
.chip.dday:active{transform:translate(1px,1px);box-shadow:inset 2px 2px 0 #96271F}
.chip.strk{background:var(--yel);color:var(--ink);
  box-shadow:inset -2px -2px 0 var(--yel-d),inset 2px 2px 0 #FFF0B8}
/* ── 오늘 진도 줄 ── */
.today-bar{
  background:var(--panel);border:var(--bd) solid var(--ink);box-shadow:var(--shadow);
  padding:12px 13px;display:flex;align-items:center;gap:13px;flex-wrap:wrap;
}
.ring{width:46px;height:46px;flex-shrink:0;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--f-px);font-size:8px}
.today-bar .lbl{font-family:var(--f-px);font-size:7.5px;letter-spacing:.05em;color:var(--ink-2);line-height:1.8}
.today-bar .val{font-family:var(--f-h);font-size:16px;line-height:1.45}
.rank{margin-left:auto;text-align:right}
.rank .r{font-family:var(--f-h);font-size:16px;color:var(--ink);
  background:var(--yel);border:2px solid var(--ink);padding:2px 7px;display:inline-block;line-height:1.5}
.xpbar{height:8px;background:var(--cream);border:2px solid var(--ink);margin-top:6px;width:104px;
  margin-left:auto;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--teal,#2F8C7E);
  background-image:repeating-linear-gradient(90deg,#2F8C7E 0 3px,#256F64 3px 6px);transition:width .4s steps(6)}

/* ── 카드 ── */
.stage{display:flex;flex-direction:column;gap:12px;min-height:380px}
.card{background:var(--cream);border:var(--bd) solid var(--ink);box-shadow:var(--shadow);
  animation:in .18s steps(3)}
@keyframes in{from{opacity:0;transform:translate(0,6px)}to{opacity:1;transform:none}}
.card-h{padding:8px 12px;border-bottom:var(--bd) solid var(--ink);
  display:flex;align-items:center;gap:8px;background:var(--panel);flex-wrap:wrap}
/* 단원 색 딱지 — 흰 글씨는 8px 에서 대비가 모자라 옅은 바탕 + 먹색 글씨로 간다 */
.tag{font-family:var(--f-px);font-size:7.5px;letter-spacing:.04em;padding:5px 7px;line-height:1.6;
  background:#DCE5F5;color:var(--ink);border:2px solid var(--ink)}
.tag.ca{background:#F6DAD6}
.tag.cb{background:#DCE5F5}
.tag.cc{background:#D6EDE7}
.tag.cd{background:var(--cream)}
.card-h .kind{margin-left:auto;font-family:var(--f-px);font-size:7.5px;color:var(--ink-2);line-height:1.7}
.card-b{padding:17px 15px}

/* 연도 — 이 앱의 주인공 */
.yr{font-family:var(--f-px);font-size:clamp(30px,10vw,44px);line-height:1.15;
  color:var(--ink);background:var(--yel);border:var(--bd) solid var(--ink);
  padding:9px 11px;display:inline-block;
  box-shadow:inset -4px -4px 0 var(--yel-d),inset 4px 4px 0 #FFF0B8}
.yr sup{font-size:.42em;vertical-align:super;margin-left:4px;color:var(--ink-2)}
.q{font-family:var(--f-h);font-size:23px;line-height:1.5}
.q.sm{font-size:19px}
.d{color:var(--ink-2);font-size:15.5px;line-height:1.78;margin-top:11px}
.d b,.hi{color:var(--ink);font-weight:700;background:var(--yel);padding:1px 4px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
mark{background:var(--yel);color:var(--ink);padding:1px 4px;font-weight:700}

/* 카드 안 연표 */
.rail-line{display:flex;flex-direction:column;margin-top:6px}
.rl{display:grid;grid-template-columns:60px 1fr;gap:11px;align-items:start;position:relative;padding:9px 0}
.rl::before{content:"";position:absolute;left:67px;top:0;bottom:0;width:3px;
  background:repeating-linear-gradient(180deg,var(--ink) 0 3px,transparent 3px 7px)}
.rl:first-child::before{top:18px}
.rl:last-child::before{bottom:calc(100% - 18px)}
.rl .y{font-family:var(--f-px);font-size:10px;text-align:right;color:var(--ink);padding-top:3px}
.rl .dot{position:absolute;left:63px;top:14px;width:11px;height:11px;background:var(--red);
  border:2px solid var(--ink)}
.rl .t{font-family:var(--f-h);font-size:16px;padding-left:13px;line-height:1.5}
.rl .s{font-size:13.5px;color:var(--ink-2);padding-left:13px;line-height:1.65}

/* ── 선택지 · 버튼 ── */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.opt,.ox,.btn,.gbtn,.uchip{
  border:var(--bd) solid var(--ink);background:var(--panel);color:var(--ink);
  box-shadow:inset -3px -3px 0 rgba(43,31,51,.2),inset 3px 3px 0 rgba(255,255,255,.85),
             var(--sh) var(--sh) 0 rgba(43,31,51,.28);
  transition:none;font-weight:700}
.opt:active:not(:disabled),.ox:active,.btn:active,.gbtn:active,.uchip:active{
  transform:translate(var(--sh),var(--sh));box-shadow:inset 3px 3px 0 rgba(43,31,51,.2)}
.opt{text-align:left;padding:12px 13px;font-size:15px;line-height:1.55;
  display:flex;gap:10px;align-items:flex-start}
.opt .k{font-family:var(--f-px);font-size:9px;color:var(--ink-2);padding-top:3px;flex-shrink:0}
.opt.ok{background:#2F8C7E;color:#fff;box-shadow:inset -3px -3px 0 #1D5C52,inset 3px 3px 0 #6FBCAF,var(--shadow)}
.opt.ok .k{color:#D6EDE7}
.opt.no{background:var(--red);color:#fff;box-shadow:inset -3px -3px 0 #96271F,inset 3px 3px 0 #E9857D,var(--shadow)}
.opt.no .k{color:#F6DAD6}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}

.ox-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.ox{padding:18px 0;font-family:var(--f-px);font-size:26px;line-height:1}
.ox.ok{background:#2F8C7E;color:#fff;box-shadow:inset -3px -3px 0 #1D5C52,inset 3px 3px 0 #6FBCAF,var(--shadow)}
.ox.no{background:var(--red);color:#fff;box-shadow:inset -3px -3px 0 #96271F,inset 3px 3px 0 #E9857D,var(--shadow)}

.btn{padding:13px 16px;min-height:50px;background:var(--yel);font-family:var(--f-h);font-size:17px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:inset -3px -3px 0 var(--yel-d),inset 3px 3px 0 #FFF0B8,var(--sh) var(--sh) 0 rgba(43,31,51,.34)}
.btn:active{box-shadow:inset 3px 3px 0 var(--yel-d)}
.btn.ghost{background:var(--panel);
  box-shadow:inset -3px -3px 0 var(--panel-d),inset 3px 3px 0 #fff,var(--shadow)}
.btn.ghost:active{box-shadow:inset 3px 3px 0 var(--panel-d)}
.btn.wide{width:100%}
.btn-row{display:flex;gap:10px}
.btn-row>*{flex:1}

/* 스스로 채점 */
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}
.gbtn{padding:11px 5px;display:flex;flex-direction:column;gap:3px;align-items:center;min-height:56px;
  justify-content:center}
.gbtn strong{font-family:var(--f-h);font-size:16px;font-weight:400}
.gbtn small{font-family:var(--f-px);font-size:7px;color:var(--ink-2);line-height:1.7}
.gbtn.g1{background:var(--red-soft)} .gbtn.g2{background:var(--gold-soft)} .gbtn.g3{background:var(--grn-soft)}

/* 정오 알림 */
.fb{padding:12px 13px;font-size:14.5px;line-height:1.7;display:flex;gap:10px;align-items:flex-start;
  border:var(--bd) solid var(--ink)}
.fb.ok{background:var(--grn-soft);color:var(--ink)}
.fb.no{background:var(--red-soft);color:var(--ink)}
.fb .ic{font-family:var(--f-px);font-size:13px;line-height:1.4;flex-shrink:0;
  width:26px;height:26px;display:grid;place-items:center;border:2px solid var(--ink);color:#fff}
.fb.ok .ic{background:#2F8C7E} .fb.no .ic{background:var(--red)}
.fb b{font-weight:800}

/* 콤보 */
.combo{position:fixed;left:50%;top:20%;transform:translateX(-50%);z-index:90;pointer-events:none;
  font-family:var(--f-px);font-size:22px;color:var(--ink);background:var(--yel);
  border:var(--bd) solid var(--ink);padding:12px 16px;line-height:1.4;text-align:center;
  box-shadow:var(--sh) var(--sh) 0 rgba(43,31,51,.4);animation:pop .8s steps(4) forwards}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.7)}25%{opacity:1;transform:translateX(-50%) scale(1.1)}
  70%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-22px)}}

/* ── 치트키 ── */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--ink);
  border:var(--bd) solid var(--ink);margin-top:14px}
.cmp>div{background:var(--cream);padding:12px 11px}
.cmp h4{font-family:var(--f-h);font-size:16px;margin-bottom:8px;
  border-bottom:2px solid var(--ink);padding-bottom:5px}
.cmp li{font-size:13.5px;line-height:1.65;color:var(--ink-2);list-style:none;padding-left:13px;
  position:relative;margin-bottom:4px}
.cmp li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;background:var(--ink-3)}
.cmp .a h4{color:#24457A} .cmp .b h4{color:#96271F}
.mn{background:var(--cream);border:var(--bd) solid var(--ink);padding:14px 15px;box-shadow:var(--shadow)}
.mn .key{font-family:var(--f-h);font-size:24px;letter-spacing:.02em;color:var(--ink);
  line-height:1.4;background:var(--yel);border:2px solid var(--ink);padding:4px 8px;display:inline-block}
.mn .ttl{font-family:var(--f-px);font-size:7.5px;letter-spacing:.04em;color:var(--ink-2);
  margin-bottom:7px;line-height:1.8}
.mn .exp{font-size:14.5px;color:var(--ink-2);margin-top:10px;line-height:1.75}
.mn .exp em{font-style:normal;color:var(--ink);font-weight:700;background:var(--yel);padding:1px 3px}

/* ── 단원 숙련도 ── */
.panel{background:var(--cream);border:var(--bd) solid var(--ink);padding:13px 14px;box-shadow:var(--shadow)}
.panel h3{font-family:var(--f-h);font-size:16px;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.ubar{margin-bottom:11px}
.ubar:last-child{margin-bottom:0}
.ubar .r1{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:8px}
.ubar .r1 span:last-child{font-family:var(--f-px);font-size:8px;color:var(--ink-2);flex-shrink:0;padding-top:3px}
.ubar .tr{height:10px;background:var(--panel);border:2px solid var(--ink);overflow:hidden}
.ubar .tr i{display:block;height:100%;transition:width .4s steps(6);
  background:repeating-linear-gradient(90deg,var(--ink) 0 3px,#4A3B57 3px 6px)}
.ubar .wk{font-family:var(--f-px);font-size:7px;background:var(--red);color:#fff;
  border:2px solid var(--ink);padding:3px 4px;line-height:1.6;vertical-align:2px}

/* 범위 고르기 */
.upick{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.ugrp{font-family:var(--f-px);font-size:8px;letter-spacing:.04em;color:var(--cream);
  background:var(--ink);padding:6px 8px;margin-top:14px;line-height:1.7;
  display:flex;align-items:center;gap:8px;border:2px solid var(--ink)}
.ugrp::after{content:"";flex:1;height:5px;
  background:repeating-linear-gradient(90deg,var(--yel) 0 3px,transparent 3px 6px)}
.ugrp:first-child{margin-top:2px}
.uchip{padding:8px 11px;font-size:13.5px;min-height:44px;text-align:left}
.uchip small{display:block;font-family:var(--f-px);font-size:7px;font-weight:400;
  color:var(--ink-2);letter-spacing:0;line-height:1.7;margin-top:2px}
.uchip[aria-pressed="true"]{background:var(--yel);
  box-shadow:inset -3px -3px 0 var(--yel-d),inset 3px 3px 0 #FFF0B8,var(--shadow)}
.uchip[aria-pressed="true"] small{color:var(--ink)}

/* ── 독 (넓은 화면: 창 아래 · 좁은 화면: 작업 표시줄) ── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--ink);
  border-top:var(--bd) solid #150E1B;padding:6px;display:flex;justify-content:center;gap:6px;
  padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
@media(min-width:1000px){
  .nav{position:static;border:var(--bd) solid var(--ink);background:var(--ink);
    box-shadow:var(--shadow);padding:8px;width:100%;gap:6px}
}
.nb{flex:1;max-width:96px;background:transparent;display:flex;flex-direction:column;
  align-items:center;gap:4px;padding:4px 2px;min-height:44px;position:relative}
.nb .g{width:44px;height:44px;border:2px solid var(--ink);background:var(--panel);
  box-shadow:inset -3px -3px 0 rgba(43,31,51,.22),inset 3px 3px 0 rgba(255,255,255,.75);
  display:grid;place-items:center;position:relative;font-size:19px;line-height:1}
.nb{font-family:var(--f-h);font-size:11.5px;letter-spacing:.02em;color:var(--cream);
  text-align:center;line-height:1.5}
.nb[aria-current="true"] .g{background:var(--yel);
  box-shadow:inset -3px -3px 0 var(--yel-d),inset 3px 3px 0 #FFF0B8}
.nb[aria-current="true"]{color:var(--yel)}
.nb:active .g{transform:translate(1px,1px)}
.nb .badge{position:absolute;top:-3px;right:calc(50% - 30px);min-width:19px;height:19px;
  background:var(--red);border:2px solid var(--ink);color:#fff;font-family:var(--f-px);font-size:7px;
  display:grid;place-items:center;padding:0 2px;transform:none}

/* 통계 타일 */
.stat{background:var(--panel);border:2px solid var(--ink);padding:10px 11px;
  box-shadow:inset -2px -2px 0 var(--panel-d),inset 2px 2px 0 #fff}
.stat .l{font-size:12.5px;color:var(--ink-2);line-height:1.6}
.stat .v{font-family:var(--f-h);font-size:22px;margin-top:3px;line-height:1.35}

/* ── 그 밖 ── */

const RAW=[
/* ================= s1 · 20세기 전반의 세계 (교과서 10~11쪽) ================= */
["s1",1914,"제1차 세계 대전","사라예보 사건을 계기로 발발했으며 영국·프랑스·미국이 주축이 된 연합국의 승리로 끝났다.","사라예보 사건"],
["s1",1917,"러시아 혁명","레닌이 이끄는 사회주의 혁명이 일어났고 이후 러시아는 전선에서 이탈하였다.","레닌"],
["s1",1918,"윌슨의 14개조 평화 원칙","그중 민족 자결주의는 각 민족이 스스로 운명을 결정할 권리가 있다는 원칙으로 약소민족의 독립운동에 큰 영향을 주었다.","민족 자결주의"],
["s1",1919,"파리 강화 회의","전승국의 이익과 패전국에 대한 응징을 반영한 베르사유 조약이 체결되어 베르사유 체제가 성립했다.","베르사유 조약"],
["s1",1921,"워싱턴 회의","열강이 동아시아에 대한 이해관계를 조정하고 해군 군비 축소에 합의하였다.","군비 축소"],
["s1",1929,"대공황과 전체주의","미국에서 시작된 대공황에 미국은 뉴딜 정책, 영국은 블록 경제로 맞섰으나 경제 기반이 빈약한 이탈리아·독일·일본에서는 전체주의가 확산되었다.","뉴딜 정책"],
["s1",1931,"만주 사변","일본이 만주를 침략하고 이듬해 만주국을 세웠다.","만주국"],
["s1",1937,"중일 전쟁","일본이 루거우차오 사건을 빌미로 일으켰으며 난징 대학살을 저질렀다.","루거우차오 사건"],
["s1",1936,"추축국 형성","독일·일본·이탈리아가 3국 방공 협정을 계기로 추축국을 이루고 대외 침략을 본격화하였다.","3국 방공 협정"],
["s1",1939,"제2차 세계 대전","독일이 독소 불가침 조약을 맺은 뒤 폴란드를 기습 침공하자 영국과 프랑스가 선전 포고하며 시작되었다.","폴란드"],
["s1",1941,"아시아·태평양 전쟁","미국이 전쟁 물자 수출을 금지하며 압박하자 일본이 하와이 진주만을 기습 공격하며 일으켰다.","진주만"],

/* ================= s2 · 무단 통치와 수탈 체제 (12~13쪽) ================= */
["s2",1910,"조선 총독부 설치","식민 통치의 최고 기구로, 일본 육해군 대장 중에서 임명된 총독이 입법·사법·행정권과 군사권을 모두 쥐고 일왕에게 직속되었다.","일왕에게 직속"],
["s2",1910,"중추원","조선 총독의 자문 기구에 불과했고 친일파로 구성되어 3·1 운동 전까지 한 번도 소집되지 않았다.","한 번도 소집되지 않았다"],
["s2",1910,"헌병 경찰제","헌병 사령관을 경무 총감으로 임명했으며 헌병과 경찰이 정식 재판 없이 즉결 심판권을 행사해 구류·벌금·태형을 내릴 수 있었다.","즉결 심판권"],
["s2",1911,"우민화 교육","한국인을 식민 지배에 순응시키려 교육 체계를 보통 교육과 실업 교육 위주로 편성했고, 관리와 교사에게도 제복을 입고 칼을 차게 했다.","실업 교육"],
["s2",1912,"조선 태형령","제13조에 본령은 조선인에 한하여 적용한다고 못 박은 노골적인 차별 법령이다.","조선인에 한하여"],
["s2",1912,"경찰범 처벌 규칙","함부로 대중을 모아 청원한 자, 경찰의 지시를 어긴 자 등을 구류 또는 벌금에 처하도록 해 일상까지 통제했다.","구류"],
["s2",1912,"토지 조사령과 토지 조사 사업","지세의 공정한 부과와 근대적 토지 소유권 확립을 명분으로 내세웠으나 식민 통치 재정을 확보하려는 의도였고, 정해진 기간 안에 신고해야 소유권을 인정받았다.","기간 안에 신고"],
["s2",1918,"토지 조사 사업의 결과","총독부는 지세 수입이 늘고 소유권이 불분명한 토지와 국공유지를 차지했으며, 그 땅은 동양 척식 주식회사나 일본인에게 헐값으로 넘어갔다.","동양 척식 주식회사"],
["s2",1910,"회사령 공포","회사 설립에 조선 총독의 허가를 받게 하고 총독의 명령만으로 해산까지 시킬 수 있었으며, 어업과 광업에도 허가제를 적용했다.","허가"],
["s2",1914,"기간 시설 건설","철도·도로·항만·통신망을 새로 놓았는데 일본 상품의 유통을 넓히고 한국의 식량과 자원을 쉽게 반출하려는 의도였다.","반출"],

/* ================= s3 · 민족 분열 통치와 경제 수탈 (14~15쪽) ================= */
["s3",1919,"사이토 마코토의 부임","3·1 운동으로 무단 통치의 한계가 드러나자 새 총독이 시정 방침을 발표하며 기만적인 문화 정치를 표방했다.","문화 정치"],
["s3",1919,"문관 총독 임명 관제 개정","문관 출신도 총독이 될 수 있도록 관제를 고쳤으나 실제로 문관 총독은 단 한 명도 임명되지 않았다.","단 한 명도"],
["s3",1920,"보통 경찰제","헌병 경찰제 대신 실시했으나 경찰 인원과 경찰 관서의 수는 오히려 대폭 늘어났다.","오히려"],
["s3",1920,"도 평의회와 부·면 협의회","한국인을 지방 행정에 참여시킨다고 선전했으나 의결권이 없는 자문 기구에 불과했다.","의결권"],
["s3",1920,"조선일보·동아일보 창간","언론·출판의 자유를 일부 인정해 창간되었으나 사전 검열로 기사가 삭제되고 압수·정간·폐간이 뒤따랐다.","사전 검열"],
["s3",1921,"조선 민족 운동에 대한 대책","친일 단체를 만들게 하고 조선인 부호에게 일본 자본을 공급해 친일화한다는, 민족 분열 통치의 속셈을 그대로 드러낸 문서다.","민족 분열"],
["s3",1925,"치안 유지법","국체를 변혁하거나 사유 재산 제도를 부인할 목적의 결사를 처벌한다는 법으로 독립운동가와 사회주의자를 탄압했다.","사유 재산"],
["s3",1920,"산미 증식 계획","일본의 쌀 부족을 메우려 실시했다. 생산량은 늘었지만 목표에 못 미쳤고 반출은 예정대로 진행되어 한국의 식량 사정이 악화되었다.","식량 사정"],
["s3",1926,"산미 증식 계획의 부담","비료 대금과 수리 조합비 등 증산 비용이 농민에게 전가되어 자작농이 소작농이나 화전민·토막민으로 전락하고 만주·연해주로 이주하기도 했다.","수리 조합비"],
["s3",1920,"회사령 폐지","제1차 세계 대전으로 자본을 축적한 일본 기업의 진출을 돕고자 회사 설립을 신고제로 바꾸었다.","신고제"],
["s3",1923,"일본 상품 관세 철폐","값싼 일본산 제품이 밀려들면서 영세했던 한국인 기업이 큰 타격을 입었다.","한국인 기업"],

/* ================= s4 · 민족 말살 통치와 전시 동원 체제 (16~19쪽) ================= */
["s4",1931,"민족 말살 통치의 시작","만주 사변 이후 침략 전쟁을 넓히면서 내선일체와 일선동조론을 내세워 황국 신민화 정책을 강요했다.","내선일체"],
["s4",1937,"황국 신민 서사","일왕에게 충성을 맹세하는 문구를 강제로 외우게 하고 매일 아침 일본 궁성을 향해 절하는 궁성 요배를 시켰다.","궁성 요배"],
["s4",1937,"신사 참배 강요","각지에 신사를 세우고 참배를 강요했으며 거부하면 처벌하고 학교까지 폐쇄했다.","신사"],
["s4",1938,"한국어 교육 금지","한국어 교육을 금지하고 일본어 사용을 강요했다.","일본어"],
["s4",1941,"국민학교로 개칭","소학교의 이름을 황국 신민의 학교라는 뜻의 국민학교로 바꾸었다.","국민학교"],
["s4",1939,"창씨개명 강요","성과 이름을 일본식으로 바꾸게 하고, 거부하면 자녀를 학교에 보내지 못하게 하거나 식량 배급에서 제외했다.","식량 배급"],
["s4",1940,"조선일보·동아일보 폐간","우리글로 간행되던 신문을 폐간하며 언론과 학술 활동에 대한 탄압을 강화했다.","폐간"],
["s4",1942,"조선어 학회 사건","우리말 연구에 힘쓰던 조선어 학회 회원들을 치안 유지법 위반으로 구속했다.","치안 유지법"],
["s4",1930,"식민지 공업화","대공황 이후 일본 독점 자본이 값싼 노동력과 지하자원을 노리고 들어와 중화학 공업과 광업에 투자하면서 북부 지방에 공장이 몰렸다.","북부 지방"],
["s4",1934,"남면북양 정책","일본 방직 자본가에게 값싼 원료를 공급하려고 남부에서는 면화를 재배하고 북부에서는 양을 기르도록 강요했다.","면화"],
["s4",1938,"병참 기지화 정책","중일 전쟁이 터지자 한반도를 군수 물자 공급 기지로 삼으려 했고, 산업 구조가 군수 산업 중심으로 개편되며 지역 간 불균형이 심해졌다.","군수 물자"],
["s4",1938,"국가 총동원법","전시에 인적·물적 자원을 통제 운용한다는 법으로 강제 징용과 징병의 근거가 되었다.","인적·물적"],
["s4",1943,"인력 수탈","지원병제·학도 지원병제·징병제로 청년을 전쟁터로 보내고, 국민 징용령으로 청장년을 탄광과 군수 공장에 강제 동원했다.","국민 징용령"],
["s4",1944,"여자 정신 근로령","수십만 명의 여성을 군수 공장 등에 동원했다. 앞서 수많은 여성이 일본군 위안부로 끌려가 성 노예가 되기도 했다.","일본군 위안부"],
["s4",1939,"공출과 배급제","집집마다 할당량을 정해 쌀을 걷고 배급제를 시행했으며, 무기를 만들려 절의 종과 놋그릇·숟가락까지 빼앗아 갔다.","배급제"],
["s4",1938,"국민정신 총동원 운동","전국 조직망의 말단에 애국반을 두어 일장기 게양·신사 참배·애국 저금을 강요하고 공출과 징용에 앞장서게 했다.","애국반"],

/* ================= s5 · 1910년대 국내외 독립운동 (20~21쪽) ================= */
["s5",1912,"독립 의군부","의병장 출신 임병찬 등이 고종의 밀명을 받아 조직했으며, 복벽주의를 내세워 고종을 다시 황제로 세우려 했다.","복벽주의"],
["s5",1915,"대한 광복회","박상진 등이 주축이 되어 국권 회복 뒤 민주 공화제 국가 건설을 추구했고, 친일파를 처단하며 만주에 무관 학교 설립을 추진했다.","민주 공화제"],
["s5",1911,"서간도 삼원보","신민회의 이회영·이상룡 등이 자치 기관인 경학사를 조직하고 독립군을 기르기 위해 신흥 강습소를 세웠다.","경학사"],
["s5",1919,"신흥 무관 학교","신흥 강습소가 발전한 학교로, 3·1 운동 이후 만주로 향한 청년들을 받아 군사 훈련을 실시했다.","신흥 강습소"],
["s5",1913,"북간도의 민족 운동","간민회 등 자치 단체가 동포 사회를 이끌었고 서전서숙을 계승한 명동 학교가 세워졌다.","명동 학교"],
["s5",1911,"중광단","서일 등 대종교 간부들이 만든 무장 독립 단체로 이후 북로 군정서로 발전했다.","북로 군정서"],
["s5",1911,"연해주 권업회","블라디보스토크 교외에 세운 신한촌을 중심으로 활동한 자치 단체다.","신한촌"],
["s5",1914,"대한 광복군 정부","연해주에서 이상설과 이동휘를 정·부통령으로 하여 수립되었다.","이상설"],
["s5",1910,"대한인 국민회","장인환과 전명운의 의거를 계기로 애국심이 높아지자 안창호의 주도로 미주 한인 단체들이 통합해 만들었다.","안창호"],
["s5",1914,"대조선 국민군단","하와이에서 박용만 등이 조직해 군사 훈련을 실시했다.","박용만"],
["s5",1912,"동제사","상하이에서 신규식 등이 조직했고, 이들 중 일부가 신한청년당을 결성해 임시 정부 수립의 기반을 닦았다.","신한청년당"],
["s5",1917,"대동단결 선언","신규식·박은식·신채호·조소앙 등이 상하이에서 발표했으며, 주권이 순종에게서 일반 국민에게 넘어왔다는 국민 주권론을 폈다.","국민 주권론"],

/* ================= s6 · 3·1 운동 (22~25쪽) ================= */
["s6",1918,"3·1 운동의 국제적 배경","러시아 혁명 뒤 레닌이 약소민족 해방 운동 지원을 선언하고 미국 대통령 윌슨이 민족 자결주의를 제창하면서 독립운동가들이 희망을 품었다.","민족 자결주의"],
["s6",1919,"김규식의 파리 파견","상하이의 신한청년당이 한국의 독립을 청원하려 파리 강화 회의에 대표로 보냈다.","신한청년당"],
["s6",1919,"2·8 독립 선언","일본에 유학 중이던 학생들이 조선 청년 독립단의 이름으로 도쿄에서 독립 선언서를 발표했다.","조선 청년 독립단"],
["s6",1919,"고종의 서거","일제가 독살했다는 소문이 퍼져 분노가 커졌고, 종교계 지도자와 학생들이 국장일에 즈음해 만세 시위를 계획했다.","국장일"],
["s6",1919,"민족 대표의 독립 선언","손병희·이승훈·한용운 등은 시위가 과격해질 것을 우려해 탑골 공원 대신 태화관에 모여 독립 선언식을 가졌다.","태화관"],
["s6",1919,"탑골 공원 만세 시위","학생과 시민이 독립 선언서를 낭독하고 대한 독립 만세를 외치며 거리로 쏟아져 나왔다.","독립 선언서"],
["s6",1919,"시위의 확산","도시에서 농촌으로 번지며 주로 장날을 이용했고, 학생·교사·상인·노동자에 기생과 걸인까지 계층을 가리지 않고 참여했다.","장날"],
["s6",1919,"제암리 학살","경기도 화성 제암리에서 일본군이 주민을 교회에 모아 놓고 총을 쏜 뒤 불을 질렀다.","제암리"],
["s6",1919,"무력 투쟁으로의 발전","헌병 경찰의 무자비한 진압에 시위가 격화되어 일부 농민이 경찰 관서와 헌병대 등 식민 통치 기관을 습격했다.","습격"],
["s6",1919,"3·1 운동의 의의","일제 강점기 최대 규모의 항일 운동으로 우리 민족의 독립 의지를 전 세계에 알렸고, 학생·농민·노동자·여성이 참여해 민족 운동의 주체가 확대되었다.","최대 규모"],
["s6",1919,"3·1 운동의 영향","민족 운동을 조직적으로 지도할 구심점이 필요하다는 인식에서 대한민국 임시 정부가 수립되었고, 일제는 통치 방식을 문화 정치로 바꾸었다.","구심점"],
["s6",1919,"세계사적 의의","대표적인 반제국주의 민족 운동으로 중국의 5·4 운동 등 약소민족의 민족 운동에 영향을 주었다.","5·4 운동"],
["s6",1920,"유관순","이화 학당 학생으로 천안 아우내 장터에서 만세 시위를 주도하다 붙잡혀 서대문 형무소에서 순국했다.","아우내"],

/* ================= s7 · 대한민국 임시 정부 (26~29쪽) ================= */
["s7",1919,"여러 임시 정부의 수립","연해주에 대한 국민 의회, 상하이에 대한민국 임시 정부가 세워지고 국내에서는 한성 정부 수립이 선포되었다.","대한 국민 의회"],
["s7",1919,"임시 정부의 통합","한성 정부의 법통을 잇고 대한 국민 의회를 통합했으며, 조계 지역이 많아 외교에 유리한 상하이에 정부를 두기로 결정했다.","상하이"],
["s7",1919,"민주 공화제 채택","우리 역사상 최초의 민주 공화제 정부로, 삼권 분립에 따라 입법 기관인 임시 의정원, 행정 기관인 국무원, 사법 기관인 법원을 두었다.","임시 의정원"],
["s7",1919,"초대 각료 선출","대한민국 임시 헌법을 공포하고 임시 대통령에 이승만, 국무총리에 이동휘를 선임했다.","이동휘"],
["s7",1919,"연통제","국내에 설치한 비밀 행정 조직으로 군자금을 조달하고 정부의 문서와 명령을 전달했다.","비밀 행정 조직"],
["s7",1919,"교통국","정보 수집과 자금 모집을 맡은 통신 기관으로, 이륭 양행에 근거를 둔 안동 교통국의 활약이 두드러졌다.","이륭 양행"],
["s7",1919,"독립 공채","광복 후 갚겠다고 약속하고 발행한 증서로 국내와 미주 동포에게 팔아 독립운동 자금을 마련했다.","독립운동 자금"],
["s7",1919,"구미 위원부","미국에 설치해 대통령 이승만을 중심으로 외교 활동을 벌였다.","이승만"],
["s7",1919,"독립신문과 사료집","독립신문을 펴내 동포에게 소식을 알리고, 임시 사료 편찬회를 두어 한일 관계 사료집을 간행했다.","한일 관계 사료집"],
["s7",1923,"육군 주만 참의부","국무원 산하 군무부의 직할 부대로 편성되어 만주에서 항일 투쟁을 전개했다.","군무부"],
["s7",1923,"국민 대표 회의","연통제와 교통국이 발각되고 외교 활동이 성과를 내지 못하자 열렸으나, 개조파와 창조파의 대립으로 결렬되며 임시 정부가 침체에 빠졌다.","개조파"],
["s7",1925,"이승만 탄핵","국제 연맹에 위임 통치를 청원한 일과 직무를 다하지 않은 점이 문제 되어 탄핵되었고 박은식이 제2대 대통령이 되었다.","박은식"],
["s7",1926,"국무령 중심 체제","헌법을 고쳐 국무령 중심의 집단 지도 체제로 바꾸고 이동녕과 김구를 중심으로 조직을 재정비했다.","집단 지도 체제"],

/* ================= s8 · 무장 독립 전쟁 (30~33쪽) ================= */
["s8",1920,"봉오동 전투","홍범도의 대한 독립군, 안무의 국민회군, 최진동의 군무 도독부군이 연합해 일본군을 봉오동 골짜기로 유인한 뒤 기습해 크게 무찔렀다.","최진동"],
["s8",1920,"훈춘 사건","일제가 만주에 군대를 넣을 구실을 만들려고 중국 마적을 매수해 훈춘의 일본 영사관을 공격하게 한 자작극이다.","마적"],
["s8",1920,"청산리 대첩","김좌진의 북로 군정서와 홍범도의 대한 독립군 등이 백운평 전투를 시작으로 어랑촌·고동하 전투 등 10여 차례를 싸워 일본군을 크게 격파했다.","백운평"],
["s8",1920,"간도 참변","일제가 독립군의 근거지를 없앤다는 구실로 서너 달에 걸쳐 간도의 한인 마을을 불태우고 수많은 한인을 학살했다.","근거지"],
["s8",1921,"자유시 참변","밀산에 모였다가 레닌의 지원을 기대하며 자유시로 옮긴 독립군이 지휘권 분쟁 끝에 러시아 적군에게 무장 해제당하며 희생되었다.","무장 해제"],
["s8",1924,"3부의 성립","남만주에 참의부, 지린성 일대에 정의부, 북만주에 신민부가 세워졌다.","정의부"],
["s8",1925,"3부의 성격","민정 조직과 군정 조직을 갖추고 관할 구역 한인에게 세금을 거두어 운영한 사실상의 공화주의 자치 정부였다.","공화주의 자치 정부"],
["s8",1925,"미쓰야 협정","조선 총독부 경무 국장 미쓰야가 만주 군벌과 맺어, 한국인 독립운동가를 체포해 일본 경찰에 넘기도록 했다.","만주 군벌"],
["s8",1929,"3부 통합 운동","통합 방법을 둘러싼 이견으로 완전한 통합에 이르지 못한 채 남만주의 국민부와 북만주의 혁신 의회로 재편되었다.","국민부"],
["s8",1929,"조선 혁명군 조직","국민부가 조선 혁명당을 결성하고 그 아래에 조직한 무장 부대다.","조선 혁명당"],
["s8",1930,"한국 독립당과 한국 독립군","혁신 의회가 해체된 뒤 지청천 등이 한국 독립당을 만들었고, 만주 사변이 일어나자 그 산하에 한국 독립군을 편성했다.","지청천"],
["s8",1932,"영릉가 전투","양세봉이 이끄는 조선 혁명군이 중국 의용군과 힘을 합쳐 일본군을 물리치고 영릉가성을 점령했다.","양세봉"],
["s8",1932,"쌍성보 전투","지청천이 이끄는 한국 독립군이 중국군과 연합해 승리를 거두었다.","한국 독립군"],
["s8",1933,"대전자령 전투","한국 독립군이 험한 골짜기인 대전자령에 매복했다가 일본군의 후방이 고개를 넘을 때 일시에 공격해 크게 이겼다.","대전자령"],
["s8",1933,"동경성 전투와 흥경성 전투","한국 독립군은 동경성에서, 조선 혁명군은 흥경성에서 각각 일본군과 싸웠다.","동경성"],
["s8",1934,"양세봉 전사","조선 혁명군은 사령관 양세봉이 전사한 뒤 세력이 약해졌으나 1930년대 후반까지 항일 투쟁을 이어 갔다.","양세봉"],
["s8",1934,"동북 인민 혁명군","중국 공산당이 만주의 항일 유격대를 규합해 편성했고 많은 한인 사회주의자가 참여했으며 이후 동북 항일 연군으로 발전했다.","동북 항일 연군"],

{u:"s7",t:"연통제 vs 교통국",a:{n:"연통제",p:["국내에 둔 <b>비밀 행정</b> 조직","군자금 조달","정부의 문서와 명령 전달"]},b:{n:"교통국",p:["<b>통신</b> 기관","정보 수집과 분석, 자금 모집","<b>이륭 양행</b>의 안동 교통국이 대활약"]}},
{u:"s7",t:"개조파 vs 창조파 (국민 대표 회의, 1923)",a:{n:"개조파",p:["임시 정부는 <b>민족의 대표 기관</b>","3·1 운동의 열망으로 출범했으니 정통성 인정","문제가 있다면 <b>조직과 체제를 개선</b>","→ 임시 정부를 고쳐 쓰자"]},b:{n:"창조파",p:["상하이 임시 정부의 <b>계통을 이을 이유 없다</b>","실제 독립운동에 적합한 <b>새 조직</b> 필요","→ 임시 정부를 <b>새로 만들자</b>","결과: 대립 끝에 회의 <b>결렬</b>"]}},
{u:"s8",t:"봉오동 전투 vs 청산리 대첩",a:{n:"봉오동 전투 (1920. 6.)",p:["<b>홍범도</b>의 대한 독립군","+ 안무의 국민회군, <b>최진동</b>의 군무 도독부군","일본군을 <b>골짜기로 유인</b>해 기습","→ 이에 일제가 훈춘 사건을 조작"]},b:{n:"청산리 대첩 (1920. 10.)",p:["<b>김좌진</b>의 북로 군정서 + 홍범도","<b>백운평</b>·완루구·어랑촌·고동하 등 10여 차례","독립 전쟁사 최대의 승리","→ 보복으로 <b>간도 참변</b>"]}},
{u:"s8",t:"간도 참변 vs 자유시 참변",a:{n:"간도 참변 (1920)",p:["가해자: <b>일본군</b>","구실: 독립군의 <b>근거지</b>를 없앤다","3~4개월간 한인 마을 방화·학살","청산리 대첩에 대한 <b>보복</b>"]},b:{n:"자유시 참변 (1921)",p:["가해자: 러시아 <b>적군</b>","배경: 밀산 집결 → 자유시 이동","원인: <b>지휘권</b>을 둘러싼 내부 분쟁","무장 해제 과정에서 다수 희생"]}},
{u:"s8",t:"조선 혁명군 vs 한국 독립군",a:{n:"조선 혁명군",p:["총사령관: <b>양세봉</b>","모체: <b>국민부</b> → 조선 혁명당","활동: <b>남만주</b>","전투: <b>영릉가</b>(1932) · <b>흥경성</b>(1933)"]},b:{n:"한국 독립군",p:["총사령관: <b>지청천</b>","모체: <b>혁신 의회</b> → 한국 독립당","활동: <b>북만주</b>","전투: <b>쌍성보</b>(1932) · 동경성 · <b>대전자령</b>(1933)"]}},
{u:"x1",t:"병인양요 vs 신미양요",a:{n:"병인양요 (1866)",p:["<b>프랑스</b>가 침입","구실: 병인박해(천주교 탄압)","한성근·양헌수가 항전","<b>외규장각 도서</b> 약탈당함"]},b:{n:"신미양요 (1871)",p:["<b>미국</b>이 침입","구실: 제너럴셔먼호 사건","<b>어재연</b>이 광성보에서 항전","이후 전국에 <b>척화비</b> 건립"]}},
{u:"x1",t:"갑신정변 vs 갑오개혁",a:{n:"갑신정변 (1884)",p:["주체: <b>급진 개화파</b>","문벌 폐지·인민 평등권 (14개조)","<b>지조법</b> 개혁 주장","청군 개입으로 <b>3일</b> 만에 실패"]},b:{n:"갑오개혁 (1894)",p:["주체: <b>군국기무처</b>","<b>신분제·과거제 폐지</b> 실제 시행","재정 <b>탁지아문</b>으로 일원화","군사 개혁이 빠져 한계"]}},
{u:"x1",t:"을사늑약 vs 정미 7조약",a:{n:"을사늑약 (1905)",p:["= 제2차 한일 협약","<b>외교권</b> 박탈","<b>통감부</b> 설치","을사의병, 시일야방성대곡"]},b:{n:"한일 신협약 (1907)",p:["= 정미 7조약","<b>차관 정치</b>","부수 각서로 <b>군대 해산</b>","정미의병 → 13도 창의군"]}},
{u:"x2",t:"의열단 vs 한인 애국단",a:{n:"의열단 (1919)",p:["조직: <b>김원봉</b>, 만주 지린","지침: 신채호 <b>조선혁명선언</b>","박재혁·김익상·김상옥·나석주","뒤에 조선 의용대(1938) 창설"]},b:{n:"한인 애국단 (1931)",p:["조직: <b>김구</b>, 상하이","목적: 침체된 임시 정부에 활력","<b>이봉창</b>(도쿄)·<b>윤봉길</b>(훙커우)","중국의 지원 → 한국광복군(1940)"]}},
{u:"x2",t:"신민회 vs 신간회",a:{n:"신민회 (1907)",p:["안창호·양기탁, <b>비밀 결사</b>","대성 학교·오산 학교","국외 <b>독립운동 기지</b> (삼원보)","<b>105인 사건</b>으로 해체(1911)"]},b:{n:"신간회 (1927)",p:["<b>합법</b> 단체, 최대 규모","비타협 민족주의 + 사회주의","<b>광주 학생 항일 운동</b> 진상 조사단","자매 단체: <b>근우회</b>"]}},
{u:"x3",t:"4·19 혁명 vs 6월 민주 항쟁",a:{n:"4·19 혁명 (1960)",p:["원인: <b>3·15 부정 선거</b>","도화선: <b>김주열</b>","결과: 이승만 하야","→ <b>내각 책임제</b> 개헌"]},b:{n:"6월 민주 항쟁 (1987)",p:["원인: <b>박종철</b> 고문치사, 4·13 호헌","도화선: <b>이한열</b>","결과: <b>6·29 민주화 선언</b>","→ <b>5년 단임 직선제</b> 개헌"]}}

var IN_RANGE=UNITS.filter(function(u){return u.g===1;}).map(function(u){return u.id;});

var BOX_DAYS=[0,1,3,7,16];            /* 라이트너 상자별 다음 복습까지 걸리는 날 */
var RANKS=[[0,"서당 학동"],[120,"향교 유생"],[320,"성균관 유생"],[650,"과거 급제"],
           [1100,"사관 史官"],[1700,"실록 편수관"],[2500,"연표 마스터"]];
var KEY="hansa-sprint-v2";   /* 교과서 단원 구조로 개편 */

/* ---------- 날짜 ---------- */
function dayNo(d){d=d||new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);}
function fmtY(y){return y<0?"기원전 "+(-y):String(y);}

/* ---------- 상태 ---------- */
var S;
function blank(){
  return {srs:{},xp:0,streak:0,last:0,goal:20,units:IN_RANGE.slice(),
          dday:"",today:{day:dayNo(),n:0,ok:0},wrong:[],seenDays:0,theme:""};
}
function load(){
  try{var r=localStorage.getItem(KEY);S=r?Object.assign(blank(),JSON.parse(r)):blank();}
  catch(e){S=blank();}
  if(!S.units||!S.units.length)S.units=IN_RANGE.slice();
  var t=dayNo();
  if(!S.today||S.today.day!==t)S.today={day:t,n:0,ok:0};
  if(S.last&&S.last<t-1)S.streak=0;      /* 하루라도 건너뛰면 연속 끊김 */
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

function rankOf(xp){var r=RANKS[0],nx=null;
  for(var i=0;i<RANKS.length;i++){if(xp>=RANKS[i][0])r=RANKS[i];else{nx=RANKS[i];break;}}
  return {name:r[1],cur:r[0],next:nx?nx[0]:r[0]+1};}

/* ---------- 학습 풀 ---------- */
function inScope(u){return S.units.indexOf(u)>=0;}
function poolFacts(){return FACTS.filter(function(f){return inScope(f.u);});}
function poolOx(){return OX.filter(function(o){return inScope(o.u);});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a,n){return shuffle(a).slice(0,n);}

function buildQueue(){
  var t=dayNo(),ids=[],due=[],fresh=[];
  poolFacts().forEach(function(f){ids.push(f.id);});
  poolOx().forEach(function(o){ids.push(o.id);});
  ids.forEach(function(id){
    var r=S.srs[id];
    if(!r)fresh.push(id); else if(r.due<=t)due.push(id);
  });
  var q=shuffle(due);
  var room=Math.max(S.goal-S.today.n,6);
  if(q.length<room)q=q.concat(shuffle(fresh).slice(0,room-q.length));
  return q.slice(0,Math.min(60,room));
}

/* ---------- 채점 ---------- */
function grade(id,score){          /* score: 0 다시 · 1 애매 · 2 정답/쉬움 */
  var t=dayNo(),r=S.srs[id]||{b:0,due:t};
  if(score===0){r.b=0;r.due=t;}
  else if(score===1){r.b=Math.max(0,r.b);r.due=t+1;}
  else{r.b=Math.min(4,r.b+1);r.due=t+BOX_DAYS[r.b];}
  S.srs[id]=r;
  S.today.n++;
  if(score===2){S.today.ok++;S.xp+=10+Math.min(10,combo*2);combo++;
    var w=S.wrong.indexOf(id);if(w>=0)S.wrong.splice(w,1);}
  else{S.xp+=2;combo=0;if(S.wrong.indexOf(id)<0)S.wrong.push(id);}
  var t2=dayNo();
  if(S.last!==t2){S.streak=(S.last===t2-1)?S.streak+1:1;S.last=t2;S.seenDays++;}
  save();paintTop();
  if(combo&&combo%3===0)flashCombo(combo);
}
var combo=0;
function flashCombo(n){
  var el=document.createElement("div");el.className="combo";el.textContent=n+" 연속!";
  document.body.appendChild(el);setTimeout(function(){el.remove();},760);
}

/* ---------- 상단 페인트 ---------- */
function paintTop(){
  var g=S.goal,n=S.today.n,p=Math.min(1,n/g);
  document.getElementById("ringArc").style.strokeDashoffset=String(119.4*(1-p));
  document.getElementById("ringTx").textContent=Math.round(p*100)+"%";
  document.getElementById("todayVal").textContent=n>=g?n+"문제 · 목표 달성":n+" / "+g+" 문제";
  var r=rankOf(S.xp);
  document.getElementById("rankTx").textContent=r.name;
  document.getElementById("xpFill").style.width=
    Math.min(100,((S.xp-r.cur)/Math.max(1,r.next-r.cur))*100)+"%";
  document.querySelector("#cStrk .n").textContent=S.streak;
  var dd=document.getElementById("cDday");
  if(S.dday){
    var diff=Math.round((dayNo(new Date(S.dday+"T00:00:00"))-dayNo()));
    dd.innerHTML=diff>0?'D-<span class="n">'+diff+'</span>':(diff===0?'<span class="n">D-DAY</span>':'D+<span class="n">'+(-diff)+'</span>');
    dd.style.display="";
  }else{dd.innerHTML="시험일 +";}
  paintMastery();
}
function paintMastery(){
  var box=document.getElementById("mastery");if(!box)return;
  box.innerHTML=UNITS.filter(function(u){return inScope(u.id);}).map(function(u){
    var fs=FACTS.filter(function(f){return f.u===u.id;});
    var os=OX.filter(function(o){return o.u===u.id;});
    var all=fs.length+os.length,got=0;
    fs.concat(os).forEach(function(x){var r=S.srs[x.id];if(r)got+=Math.min(4,r.b);});
    var pct=Math.round(got/(all*4)*100);
    /* 초록·황토·빨강 세 색은 정상 시야에서도 구분이 어려워(ΔE 기준 미달) 길이 하나로만 나타내고,
       약한 단원은 글자로 짚어 준다 */
    return '<div class="ubar"><div class="r1"><span>'+u.short+
           (got>0&&pct<35?' <b class="wk">약함</b>':'')+'</span><span>'+pct+'%</span></div>'+
           '<div class="tr"><i style="width:'+pct+'%"></i></div></div>';
  }).join("");
}

/* ---------- 문제 생성 ---------- */
function distinct(arr,n,not){
  var out=[],seen={};seen[not]=1;
  shuffle(arr).forEach(function(v){if(out.length<n&&!seen[v]){seen[v]=1;out.push(v);}});
  return out;
}
function makeItem(id){
  if(id.charAt(0)==="o"){var o=OMAP[id];return {kind:"ox",id:id,u:o.u,ox:o};}
  var f=FMAP[id],sib=FACTS.filter(function(x){return x.u===f.u&&x.id!==f.id;});
  var kinds=["flash","event"];
  var ys=distinct(sib.map(function(x){return x.y;}),3,f.y);
  if(ys.length===3)kinds.push("year");   /* 선택지 4개를 못 채우면 연도 문제는 건너뛴다 */
  if(f.d.indexOf(f.k)>=0)kinds.push("cloze");
  var kind=kinds[Math.floor(Math.random()*kinds.length)];
  if(kind==="year")return {kind:"year",id:id,u:f.u,f:f,opts:shuffle(ys.concat([f.y])),ans:f.y};
  if(kind==="event"){
    var ts=distinct(sib.map(function(x){return x.t;}),3,f.t).concat([f.t]);
    return {kind:"event",id:id,u:f.u,f:f,opts:shuffle(ts),ans:f.t};
  }
  if(kind==="cloze"){
    var ks=distinct(sib.map(function(x){return x.k;}),3,f.k).concat([f.k]);
    return {kind:"cloze",id:id,u:f.u,f:f,opts:shuffle(ks),ans:f.k};
  }
  return {kind:"flash",id:id,u:f.u,f:f};
}
function makeOrder(){
  /* 연도가 4개 이상 서로 다른 단원만 후보로 삼는다.
     3·1 운동처럼 사건이 한 해에 몰린 단원은 순서를 물을 수 없다. */
  var byU={};poolFacts().forEach(function(f){(byU[f.u]=byU[f.u]||[]).push(f);});
  var us=Object.keys(byU).filter(function(u){
    var ys={},n=0;
    byU[u].forEach(function(f){if(!ys[f.y]){ys[f.y]=1;n++;}});
    return n>=4;
  });
  if(!us.length)return null;
  var u=us[Math.floor(Math.random()*us.length)];
  var seen={},cand=[];
  shuffle(byU[u]).forEach(function(f){if(!seen[f.y]){seen[f.y]=1;cand.push(f);}});
  var four=cand.slice(0,4);
  return {kind:"order",u:u,items:shuffle(four),
          sorted:four.slice().sort(function(a,b){return a.y-b.y;})};
}

/* ---------- 렌더 헬퍼 ---------- */
var st=function(){return document.getElementById("stage");};
function uName(u){return UMAP[u]?UMAP[u].short:"";}
function uCls(u){return UMAP[u]?UMAP[u].c:"cd";}
function head(u,kindLabel){
  return '<div class="card-h"><span class="tag '+uCls(u)+'">'+uName(u)+'</span>'+
         '<span class="kind">'+kindLabel+'</span></div>';
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}

/* ---------- 모드: 오늘의 스프린트 ---------- */
var queue=[],qi=0;
function startToday(){queue=buildQueue();qi=0;stepToday();}
function stepToday(){
  if(qi>=queue.length){
    var acc=S.today.n?Math.round(S.today.ok/S.today.n*100):0;
    st().innerHTML='<div class="card"><div class="card-b"><div class="empty">'+
      '<div class="big">畢</div>'+
      '<p><b style="color:var(--tx);font-size:17px">오늘 몫 끝!</b><br>'+
      '오늘 '+S.today.n+'문제 · 정답률 '+acc+'% · 🔥 '+S.streak+'일 연속</p>'+
      '<p style="margin-top:14px">복습할 카드는 내일 다시 나와요.<br>더 하고 싶으면 아래 버튼을 눌러요.</p>'+
      '</div><div class="btn-row" style="margin-top:4px">'+
      '<button class="btn ghost" id="bMore">10문제 더</button>'+
      '<button class="btn" id="bCheat">치트키 보기</button></div></div></div>';
    document.getElementById("bMore").onclick=function(){queue=queue.concat(buildQueue().slice(0,10));stepToday();};
    document.getElementById("bCheat").onclick=function(){go("cheat");};
    return;
  }
  /* 5문제마다 연표 정렬 게임 한 판 */
  if(qi>0&&qi%5===0&&Math.random()<.7){var o=makeOrder();if(o){renderOrder(o,function(){qi++;stepToday();});return;}}
  renderItem(makeItem(queue[qi]),function(){qi++;stepToday();});
}

function renderItem(it,done){
  if(it.kind==="flash")return renderFlash(it,done);
  if(it.kind==="ox")return renderOx(it,done);
  return renderChoice(it,done);
}

  st().innerHTML='<div class="card">'+head(it.u,"플래시카드")+

    '<div id="back" style="display:none"><hr style="border:none;border-top:1px solid var(--line);margin:16px 0">'+

    '<button class="btn wide" id="bFlip" style="margin-top:18px">답 확인</button>'+
    '<div class="grade" id="gr" style="display:none">'+
    '<button class="gbtn g1" data-s="0"><strong>다시</strong><small>오늘 또</small></button>'+
    '<button class="gbtn g2" data-s="1"><strong>애매</strong><small>내일</small></button>'+
    '<button class="gbtn g3" data-s="2"><strong>알아!</strong><small>+10 XP</small></button></div>'+
    '</div></div>';
  document.getElementById("bFlip").onclick=function(){

    document.getElementById("gr").style.display="grid";
  };

function renderChoice(it,done){
  var f=it.f,qh,opts=it.opts,label;
  if(it.kind==="year"){label="연도 맞히기";qh='<div class="q">'+esc(f.t)+'<span style="color:var(--tx-3);font-weight:400"> — 몇 년?</span></div><p class="d">'+f.d+'</p>';}
  else if(it.kind==="event"){label="사건 찾기";qh='<span class="yr">'+fmtY(f.y)+'</span><p class="d" style="margin-top:6px">'+f.d+'</p><div class="q sm" style="margin-top:14px">이 설명에 해당하는 것은?</div>';}

    qh='<div class="q sm">'+esc(f.t)+'</div><p class="d" style="margin-top:10px">'+
       f.d.replace(f.k,'<mark>&nbsp;&nbsp;?&nbsp;&nbsp;</mark>')+'</p>';}
  st().innerHTML='<div class="card">'+head(it.u,label)+'<div class="card-b">'+qh+
    '<div class="opts" id="op">'+opts.map(function(o,i){
      return '<button class="opt" data-v="'+esc(o)+'"><span class="k">'+"ABCD".charAt(i)+'</span><span>'+
             (it.kind==="year"?fmtY(o):esc(o))+'</span></button>';}).join("")+'</div>'+

  Array.prototype.forEach.call(document.querySelectorAll("#op .opt"),function(b){

      var ok=b.dataset.v===String(it.ans);

      document.getElementById("bNext").onclick=done;

function renderOrder(g,done){
  var picked=[],wrong=false;
  function paint(){
    st().innerHTML='<div class="card">'+head(g.u,"연표 정렬")+'<div class="card-b">'+
      '<div class="q sm">일어난 순서대로 눌러 주세요</div>'+
      '<p class="hint" style="margin-top:6px">빠른 것부터 → 늦은 것까지</p>'+
      '<div class="opts" id="op">'+g.items.map(function(f){
        var i=picked.indexOf(f.id);
        var cls=i>=0?(wrong?"":"ok"):"";
        return '<button class="opt '+cls+'" data-id="'+f.id+'"'+(i>=0?" disabled":"")+'>'+
               '<span class="k">'+(i>=0?(i+1):"·")+'</span><span>'+esc(f.t)+
               (i>=0||wrong?' <span style="color:var(--tx-3)">— '+fmtY(f.y)+'</span>':'')+'</span></button>';
      }).join("")+'</div><div id="fb"></div></div></div>';
    Array.prototype.forEach.call(document.querySelectorAll("#op .opt"),function(b){
      b.onclick=function(){
        var f=FMAP[b.dataset.id];
        if(f.id===g.sorted[picked.length].id){
          picked.push(f.id);
          if(picked.length===g.items.length)finish(true); else paint();
        }else{wrong=true;finish(false);}
      };
    });
  }
  function finish(ok){
    wrong=!ok;paint();
    Array.prototype.forEach.call(document.querySelectorAll("#op .opt"),function(x){x.disabled=true;});
    g.items.forEach(function(f){grade(f.id,ok?2:0);});
    document.getElementById("fb").innerHTML=
      '<div class="fb '+(ok?"ok":"no")+'" style="margin-top:14px"><span class="ic">'+(ok?"○":"×")+
      '</span><span>'+(ok?"완벽한 순서예요! 4장 모두 +XP":"순서가 어긋났어요. 아래 연표로 확인하세요.")+'</span></div>'+
      '<div class="rail-line" style="margin-top:12px">'+g.sorted.map(function(f){
        return '<div class="rl"><span class="y">'+fmtY(f.y)+'</span><span class="dot"></span>'+
               '<div><div class="t">'+esc(f.t)+'</div><div class="s">'+f.d+'</div></div></div>';
      }).join("")+'</div>'+
      '<button class="btn wide" id="bNext" style="margin-top:14px">다음 →</button>';
    document.getElementById("bNext").onclick=done;
  }
  paint();
}

/* ---------- 모드: 연표 ---------- */
function viewTimeline(){
  var fs=poolFacts(),body="",n=0;
  UNITS.forEach(function(u){
    var g=fs.filter(function(f){return f.u===u.id;}).sort(function(a,b){return a.y-b.y;});
    if(!g.length)return;
    n+=g.length;
    body+='<div class="sect" style="margin-top:20px">'+u.short+' · '+u.bk+'</div><div class="rail-line">'+
      g.map(function(f){
        return '<div class="rl"><span class="y">'+fmtY(f.y)+'</span><span class="dot"></span>'+
          '<div><div class="t">'+esc(f.t)+'</div><div class="s">'+f.d+'</div></div></div>';
      }).join("")+'</div>';
  });
  st().innerHTML='<div class="card"><div class="card-b">'+
    '<div class="q sm">연표 정렬 게임</div><p class="d" style="margin-top:6px">네 장의 카드를 순서대로 눌러 맞히세요. 순서 감각이 시험에서 제일 잘 나옵니다.</p>'+
    '<button class="btn wide" id="bPlay" style="margin-top:14px">한 판 시작</button></div></div>'+
    '<div class="card"><div class="card-b" style="padding-top:4px">'+body+
    '<p class="hint" style="margin-top:18px">소단원 '+n+'개 항목</p></div></div>';
  document.getElementById("bPlay").onclick=function(){
    var g=makeOrder();
    if(!g){st().innerHTML='<div class="card"><div class="card-b"><div class="empty"><p>단원을 더 선택하면 게임을 할 수 있어요.</p></div></div></div>';return;}
    (function loop(gm){renderOrder(gm,function(){var n=makeOrder();if(n)loop(n);else viewTimeline();});})(g);
  };
}

        '<div class="q sm">'+esc(c.t)+'</div><div class="cmp">'+
        '<div class="a"><h4>'+c.a.n+'</h4><ul>'+c.a.p.map(function(x){return "<li>"+x+"</li>";}).join("")+'</ul></div>'+
        '<div class="b"><h4>'+c.b.n+'</h4><ul>'+c.b.p.map(function(x){return "<li>"+x+"</li>";}).join("")+'</ul></div>'+
        '</div></div></div>';
    }).join("")||'<div class="card"><div class="card-b"><div class="empty"><p>선택한 단원에 해당하는 치트키가 없어요.</p></div></div></div>';
}

/* ---------- 모드: 나 ---------- */
function viewMe(){
  var t=dayNo(),due=0,learned=0,total=0;
  poolFacts().concat(poolOx()).forEach(function(x){
    total++;var r=S.srs[x.id];
    if(r){if(r.b>=3)learned++;if(r.due<=t)due++;}
  });
  var acc=S.today.n?Math.round(S.today.ok/S.today.n*100):0;
  st().innerHTML=
    '<div class="card"><div class="card-b">'+
      '<div class="q sm">지금까지</div>'+
      '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px">'+
      stat("🔥 연속 학습",S.streak+"일")+stat("⭐ 누적 XP",S.xp)+
      stat("✅ 확실히 외운 것",learned+" / "+total)+stat("📥 오늘 복습 대기",due+"개")+
      stat("🎯 오늘 정답률",S.today.n?acc+"%":"–")+stat("📕 오답 노트",S.wrong.length+"개")+
      '</div></div></div>'+
    (S.wrong.length?'<button class="btn wide" id="bWrong">오답 노트 복습하기 ('+S.wrong.length+')</button>':'')+
    '<div class="sect">출제 범위</div>'+
    '<div class="card"><div class="card-b">'+
      '<div id="mePick"></div>'+
      '<p class="hint" style="margin-top:11px">켠 소단원에서만 문제가 나와요. 진도 나간 데까지만 켜 두면 아는 데서만 출제됩니다.</p>'+
    '</div></div>'+
    '<div class="sect">설정</div>'+
    '<div class="card"><div class="card-b">'+
      '<div class="setrow"><span>시험일 (D-day)</span><div><input type="date" id="iDday" value="'+(S.dday||"")+'"></div></div>'+
      '<div class="setrow"><span>하루 목표 문제 수</span><div><input type="number" id="iGoal" min="5" max="80" step="5" value="'+S.goal+'"></div></div>'+
      '<div class="setrow"><span>진도 초기화</span><div><button class="btn ghost" id="bReset" style="width:100%;padding:7px">전부 지우기</button></div></div>'+
    '</div></div>'+
    '<div class="card"><div class="card-b"><div class="q sm">이렇게 쓰면 제일 잘 외워져요</div>'+
      '<ol style="margin:12px 0 0 18px;color:var(--tx-2);font-size:14.5px;line-height:1.85">'+
      '<li><b style="color:var(--tx)">하루 한 번, 오늘 탭만</b> — 틀린 건 오늘 또, 맞힌 건 1 → 3 → 7 → 16일 뒤에 다시 나와요. 시험 전날 몰아치기보다 훨씬 오래 남습니다.</li>'+
      '<li><b style="color:var(--tx)">배운 소단원만 켜기</b> — 진도가 01단원까지면 세계사·무단 통치·문화 정치·민족 말살만 켜세요. 안 배운 데서 문제가 나오면 김이 샙니다.</li>'+
      '<li><b style="color:var(--tx)">이동 시간엔 O·X</b> — 교과서가 실제로 파고드는 함정만 모았어요. 문관 총독, 보통 경찰 인원, 복벽주의 같은 것들요.</li>'+
      '<li><b style="color:var(--tx)">시험 3일 전엔 치트키</b> — 두문자와 비교표만 훑어도 순서 문제와 헷갈림 문제를 잡을 수 있어요.</li>'+
      '<li><b style="color:var(--tx)">연표 정렬은 서술형 대비</b> — 순서를 알면 인과 관계가 보이고, 그게 서술형 점수가 됩니다.</li>'+
      '</ol></div></div>';
  if(S.wrong.length)document.getElementById("bWrong").onclick=function(){
    var bag=S.wrong.slice(),i=0;
    (function nx(){
      if(i>=bag.length){viewMe();return;}
      renderItem(makeItem(bag[i++]),nx);
    })();
  };
  drawPick("mePick");
  document.getElementById("iDday").onchange=function(){S.dday=this.value;save();paintTop();};
  document.getElementById("iGoal").onchange=function(){S.goal=Math.max(5,Math.min(80,+this.value||20));save();paintTop();};
  document.getElementById("bReset").onclick=function(){
    if(confirm("학습 기록을 전부 지울까요? 되돌릴 수 없어요."))
      {S=blank();save();paintTop();viewMe();}
  };
}
function stat(l,v){
  return '<div class="stat"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>';
}
function drawPick(id){
  var box=document.getElementById(id);if(!box)return;
  var html="";
  [[1,"교과서 Ⅰ단원 · 일제 식민 통치와 민족 운동"],[2,"그 밖의 단원 · 필요할 때만"]].forEach(function(g){
    html+='<div class="ugrp">'+g[1]+'</div><div class="upick">'+
      UNITS.filter(function(u){return u.g===g[0];}).map(function(u){
        return '<button class="uchip" data-u="'+u.id+'" aria-pressed="'+inScope(u.id)+
               '" title="'+u.name+'">'+u.short+'<small>'+u.bk+'</small></button>';
      }).join("")+'</div>';
  });
  box.innerHTML=html;
  Array.prototype.forEach.call(box.querySelectorAll(".uchip"),function(b){
    b.onclick=function(){
      var u=b.dataset.u,i=S.units.indexOf(u);
      if(i>=0){if(S.units.length>1)S.units.splice(i,1);}else S.units.push(u);
      save();drawPick("mePick");drawPick("railPick");paintTop();
      if(mode!=="me")go(mode);
    };
  });
}

/* ---------- HANSA OS 셸 ---------- */
var DOW=["SUN","MON","TUE","WED","THU","FRI","SAT"];
function tick(){
  var d=new Date(),h=d.getHours(),ap=h<12?"AM":"PM",hh=h%12||12;
  var el=document.getElementById("clk");
  if(el)el.textContent=DOW[d.getDay()]+" "+String(hh).padStart(2,"0")+":"+
    String(d.getMinutes()).padStart(2,"0")+ap+" "+d.getFullYear();
}
tick(); setInterval(tick,20000);

/* 독 아이콘 — 16×16 격자에 <rect> 를 찍어 그린 인라인 SVG */
function px(rects){
  return '<svg width="28" height="28" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">'+
    rects.map(function(r){return '<rect x="'+r[0]+'" y="'+r[1]+'" width="'+r[2]+'" height="'+r[3]+'" fill="'+r[4]+'"/>';}).join("")+'</svg>';
}
var K="#2B1F33",W="#FBF3E2",Y="#F5C63C",R="#D2453B",T="#2F8C7E",B="#3D6BB5",O="#E0812C";
var NICO={
  /* 과녁 = 오늘 */
  today:px([[2,2,12,12,K],[3,3,10,10,W],[5,5,6,6,K],[6,6,4,4,R],[7,7,2,2,W]]),
  /* 두루마리 = 연표 */
  time:px([[2,2,12,12,K],[3,3,10,10,W],[3,3,10,2,O],[5,7,6,1,K],[5,9,6,1,K],[5,11,4,1,K]]),
  /* 번개 = 퀴즈 */
  quiz:px([[2,2,12,12,K],[3,3,10,10,B],[9,3,3,5,Y],[6,6,4,4,Y],[4,8,5,5,Y]]),
  /* 열쇠 = 치트키 */
  cheat:px([[2,2,12,12,K],[3,3,10,10,W],[4,6,5,5,Y],[5,7,3,3,W],[9,7,4,2,Y],[11,9,1,2,Y]]),
  /* 막대그래프 = 나 */
  me:px([[2,2,12,12,K],[3,3,10,10,W],[4,9,2,4,R],[7,6,2,7,T],[10,4,2,9,B]])
};
/* ---------- 네비 ---------- */
var TABS=[["today","today","오늘"],["time","time","연표"],["quiz","quiz","퀴즈"],
          ["cheat","cheat","치트키"],["me","me","나"]];
var NPATH={today:"/TODAY",time:"/TIMELINE",quiz:"/QUIZ",cheat:"/CHEAT",me:"/ME"};
var mode="today";
function go(m){
  mode=m;combo=0;
  Array.prototype.forEach.call(document.querySelectorAll(".nb"),function(b){
    b.setAttribute("aria-current",String(b.dataset.m===m));
  });
  var wt=document.getElementById("winTtl"); if(wt)wt.textContent=NPATH[m]||"/";
  window.scrollTo({top:0,behavior:"instant"});
  if(m==="today")startToday();
  else if(m==="time")viewTimeline();
  else if(m==="quiz")startQuiz();
  else if(m==="cheat")viewCheat();
  else viewMe();
}

/* ---------- 부팅 ---------- */
load();
document.getElementById("nav").innerHTML=TABS.map(function(t){
  return '<button class="nb" data-m="'+t[0]+'"><span class="g">'+NICO[t[1]]+'</span>'+t[2]+'</button>';
}).join("");
Array.prototype.forEach.call(document.querySelectorAll(".nb"),function(b){
  b.onclick=function(){go(b.dataset.m);};
});
document.getElementById("cDday").onclick=function(){
  go("me");
  setTimeout(function(){var i=document.getElementById("iDday");if(i){i.scrollIntoView({block:"center"});i.focus();}},60);
};
drawPick("railPick");
paintTop();
go("today");
</script>
