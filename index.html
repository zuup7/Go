<title>한국사 연표 스프린트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">

<style>
/* ---------- tokens : light is the base ---------- */
:root{
  --bg:#EDEEF3; --bg-2:#E3E5EC; --surf:#FFFFFF; --surf-2:#F6F7FA;
  --line:#D5D8E2; --line-2:#C2C7D5;
  --tx:#161A24; --tx-2:#454B5C; --tx-3:#767D91;
  --brand:#1B4F9C; --brand-soft:#DCE6F7; --brand-tx:#123A76;
  --red:#BE2E22; --red-soft:#F8DFDC; --red-tx:#8E2119;
  --grn:#1E6E58; --grn-soft:#D8EFE8; --grn-tx:#155345;
  --gold:#8A6410; --gold-soft:#F6EBCF;
  --shadow:0 1px 2px rgba(18,24,40,.06),0 8px 24px -12px rgba(18,24,40,.22);
  --shadow-lg:0 2px 4px rgba(18,24,40,.07),0 24px 48px -20px rgba(18,24,40,.35);
  --r:14px; --r-sm:9px;
  --f-d:"Hahmlet",serif;
  --f-b:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-m:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F131C; --bg-2:#0A0D14; --surf:#171C28; --surf-2:#1E2432;
    --line:#2A3140; --line-2:#3A4353;
    --tx:#E9EBF2; --tx-2:#AEB6C7; --tx-3:#7B849A;
    --brand:#6BA5EC; --brand-soft:#16273F; --brand-tx:#A8CBF5;
    --red:#F2645A; --red-soft:#33191A; --red-tx:#FF9B93;
    --grn:#4FC2A6; --grn-soft:#122A28; --grn-tx:#84DBC5;
    --gold:#D7A93F; --gold-soft:#2C2415;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
    --shadow-lg:0 2px 4px rgba(0,0,0,.5),0 24px 48px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#0F131C; --bg-2:#0A0D14; --surf:#171C28; --surf-2:#1E2432;
  --line:#2A3140; --line-2:#3A4353;
  --tx:#E9EBF2; --tx-2:#AEB6C7; --tx-3:#7B849A;
  --brand:#6BA5EC; --brand-soft:#16273F; --brand-tx:#A8CBF5;
  --red:#F2645A; --red-soft:#33191A; --red-tx:#FF9B93;
  --grn:#4FC2A6; --grn-soft:#122A28; --grn-tx:#84DBC5;
  --gold:#D7A93F; --gold-soft:#2C2415;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lg:0 2px 4px rgba(0,0,0,.5),0 24px 48px -20px rgba(0,0,0,.9);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--tx);
  font-family:var(--f-b); font-size:16px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- shell ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:0 14px 108px;display:grid;grid-template-columns:1fr;gap:22px}
@media(min-width:1000px){
  .wrap{grid-template-columns:1fr 268px;align-items:start;padding-bottom:36px;gap:30px}
  .rail{position:sticky;top:18px}
}
.col{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.rail{display:none}
@media(min-width:1000px){.rail{display:flex;flex-direction:column;gap:14px}}

/* ---------- top bar ---------- */
.top{
  position:sticky;top:0;z-index:40;background:var(--bg);
  border-bottom:1px solid var(--line);padding:10px 14px;
}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:8px}
@media(min-width:560px){.top-in{gap:12px}}
.mark{display:flex;align-items:center;gap:8px;min-width:0}
.seal{
  width:30px;height:30px;border-radius:7px;background:var(--red);
  display:grid;place-items:center;color:#fff;font-family:var(--f-d);font-weight:800;
  font-size:15px;line-height:1;box-shadow:0 2px 0 rgba(0,0,0,.18) inset;
}
.mark b{font-family:var(--f-d);font-weight:800;font-size:15.5px;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media(max-width:430px){.mark b{font-size:14px}}
@media(max-width:340px){.mark b{display:none}}
.top-sp{flex:1}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:100px;
  background:var(--surf);border:1px solid var(--line);font-size:12.5px;font-weight:600;
  white-space:nowrap;
}
.chip .n{font-family:var(--f-m);font-weight:600;font-variant-numeric:tabular-nums}
.chip.dday{color:var(--red-tx);background:var(--red-soft);border-color:transparent;cursor:pointer}
.chip.dday:hover{filter:brightness(.97)}
.chip.strk{color:var(--gold);background:var(--gold-soft);border-color:transparent}
.icobtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surf);display:grid;place-items:center;font-size:14px}
.icobtn:hover{border-color:var(--line-2)}

/* ---------- progress ring row ---------- */
.today-bar{
  background:var(--surf);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);
}
.ring{width:46px;height:46px;flex-shrink:0;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring span{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--f-m);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;
}
.today-bar .lbl{font-size:11px;font-family:var(--f-m);letter-spacing:.09em;color:var(--tx-3);text-transform:uppercase}
.today-bar .val{font-size:14.5px;font-weight:600;line-height:1.4}
.rank{margin-left:auto;text-align:right}
.rank .r{font-family:var(--f-d);font-weight:600;font-size:15px;color:var(--brand)}
.xpbar{height:4px;border-radius:9px;background:var(--bg-2);overflow:hidden;margin-top:5px;width:92px}
.xpbar i{display:block;height:100%;background:var(--brand);border-radius:9px;transition:width .5s}

/* ---------- stage ---------- */
.stage{display:flex;flex-direction:column;gap:14px;min-height:400px}
.card{
  background:var(--surf);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;
}
.card-h{
  padding:11px 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:9px;background:var(--surf-2);
}
.tag{
  font-family:var(--f-m);font-size:10.5px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;padding:3px 8px;border-radius:5px;
  background:var(--brand-soft);color:var(--brand-tx);
}
.tag.u0{background:var(--gold-soft);color:var(--gold)}
.tag.u1{background:var(--brand-soft);color:var(--brand-tx)}
.tag.u2{background:var(--red-soft);color:var(--red-tx)}
.tag.u3{background:var(--grn-soft);color:var(--grn-tx)}
.card-h .kind{margin-left:auto;font-size:11.5px;color:var(--tx-3);font-family:var(--f-m)}
.card-b{padding:20px 18px}

/* year display — the bold moment */
.yr{
  font-family:var(--f-d);font-weight:800;font-size:clamp(46px,15vw,68px);
  line-height:.95;letter-spacing:-.035em;font-variant-numeric:tabular-nums;
  color:var(--red);display:block;
}
.yr sup{font-size:.34em;font-weight:600;vertical-align:super;letter-spacing:0;margin-left:2px;color:var(--tx-3)}
.q{font-family:var(--f-d);font-weight:600;font-size:24px;line-height:1.4;letter-spacing:-.02em;text-wrap:balance}
.q.sm{font-size:19px}
.d{color:var(--tx-2);font-size:15.5px;line-height:1.72;margin-top:10px}
.d b,.hi{color:var(--brand);font-weight:600}
mark{background:var(--gold-soft);color:var(--tx);padding:0 3px;border-radius:3px;font-weight:600}

/* timeline rail inside cards */
.rail-line{display:flex;flex-direction:column;gap:0;margin-top:4px}
.rl{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;position:relative;padding:9px 0}
.rl::before{content:"";position:absolute;left:70px;top:0;bottom:0;width:1.5px;background:var(--line)}
.rl:first-child::before{top:18px}
.rl:last-child::before{bottom:calc(100% - 18px)}
.rl .y{font-family:var(--f-m);font-size:13px;font-weight:600;text-align:right;color:var(--red);font-variant-numeric:tabular-nums;padding-top:1px}
.rl .dot{position:absolute;left:66px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--surf)}
.rl .t{font-size:14.5px;font-weight:600;padding-left:12px}
.rl .s{font-size:13px;color:var(--tx-2);padding-left:12px;line-height:1.6}

/* ---------- options / buttons ---------- */
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{
  text-align:left;padding:13px 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);
  background:var(--surf);font-size:15px;font-weight:500;line-height:1.5;
  transition:border-color .14s,background .14s,transform .1s;display:flex;gap:10px;align-items:flex-start;
}
.opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt .k{font-family:var(--f-m);font-size:12px;font-weight:600;color:var(--tx-3);padding-top:2px;flex-shrink:0}
.opt.ok{border-color:var(--grn);background:var(--grn-soft);color:var(--grn-tx)}
.opt.ok .k{color:var(--grn)}
.opt.no{border-color:var(--red);background:var(--red-soft);color:var(--red-tx)}
.opt.no .k{color:var(--red)}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}

.ox-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.ox{
  padding:20px 0;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surf);
  font-family:var(--f-d);font-size:30px;font-weight:800;transition:all .14s;
}
.ox.o:hover{border-color:var(--grn);background:var(--grn-soft);color:var(--grn)}
.ox.x:hover{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.ox.ok{border-color:var(--grn);background:var(--grn-soft);color:var(--grn)}
.ox.no{border-color:var(--red);background:var(--red-soft);color:var(--red)}

.btn{
  padding:13px 18px;border-radius:var(--r-sm);background:var(--brand);color:#fff;
  font-weight:600;font-size:15px;text-align:center;transition:filter .14s,transform .1s;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--surf);color:var(--tx);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--line-2);filter:none}
.btn.wide{width:100%}
.btn-row{display:flex;gap:9px}
.btn-row>*{flex:1}

/* self-grade row */
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.gbtn{
  padding:12px 6px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surf);
  display:flex;flex-direction:column;gap:2px;align-items:center;transition:all .14s;
}
.gbtn strong{font-size:14.5px;font-weight:600}
.gbtn small{font-family:var(--f-m);font-size:10.5px;color:var(--tx-3)}
.gbtn.g1:hover{border-color:var(--red);background:var(--red-soft)}
.gbtn.g2:hover{border-color:var(--gold);background:var(--gold-soft)}
.gbtn.g3:hover{border-color:var(--grn);background:var(--grn-soft)}

/* feedback banner */
.fb{
  border-radius:var(--r-sm);padding:12px 14px;font-size:14.5px;line-height:1.65;
  display:flex;gap:10px;align-items:flex-start;
}
.fb.ok{background:var(--grn-soft);color:var(--grn-tx)}
.fb.no{background:var(--red-soft);color:var(--red-tx)}
.fb .ic{font-family:var(--f-d);font-weight:800;font-size:17px;line-height:1.3;flex-shrink:0}
.fb b{font-weight:700}

/* combo flash */
.combo{
  position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:90;pointer-events:none;
  font-family:var(--f-d);font-weight:800;font-size:38px;color:var(--gold);
  text-shadow:0 2px 14px rgba(0,0,0,.25);animation:pop .7s ease-out forwards;
}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.6)}25%{opacity:1;transform:translateX(-50%) scale(1.12)}70%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(1) translateY(-24px)}}

/* ---------- cheat sheet / compare ---------- */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:var(--r-sm);overflow:hidden;margin-top:14px}
.cmp>div{background:var(--surf);padding:13px 12px}
.cmp h4{font-family:var(--f-d);font-size:15.5px;font-weight:600;margin-bottom:7px}
.cmp li{font-size:13.5px;line-height:1.62;color:var(--tx-2);list-style:none;padding-left:11px;position:relative;margin-bottom:3px}
.cmp li::before{content:"";position:absolute;left:0;top:9px;width:4px;height:4px;border-radius:50%;background:var(--line-2)}
.cmp .a h4{color:var(--brand)}
.cmp .b h4{color:var(--red)}
.mn{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow)}
.mn .key{
  font-family:var(--f-d);font-weight:800;font-size:27px;letter-spacing:.02em;color:var(--red);
  line-height:1.25;text-wrap:balance;
}
.mn .ttl{font-size:12px;font-family:var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:var(--tx-3);margin-bottom:5px}
.mn .exp{font-size:14.5px;color:var(--tx-2);margin-top:9px;line-height:1.7}
.mn .exp em{font-style:normal;color:var(--tx);font-weight:600}

/* ---------- unit mastery bars ---------- */
.panel{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow)}
.panel h3{font-family:var(--f-d);font-size:14.5px;font-weight:600;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.ubar{margin-bottom:11px}
.ubar:last-child{margin-bottom:0}
.ubar .r1{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;gap:8px}
.ubar .r1 span:last-child{font-family:var(--f-m);color:var(--tx-3);font-variant-numeric:tabular-nums;flex-shrink:0}
.ubar .tr{height:6px;border-radius:9px;background:var(--bg-2);overflow:hidden}
.ubar .tr i{display:block;height:100%;border-radius:9px;transition:width .6s cubic-bezier(.4,0,.2,1)}

/* unit picker */
.upick{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.uchip{
  padding:7px 12px;border-radius:100px;border:1.5px solid var(--line);background:var(--surf);
  font-size:13px;font-weight:600;transition:all .14s;
}
.uchip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

/* ---------- bottom nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surf);
  border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;gap:2px;box-shadow:0 -6px 22px -14px rgba(0,0,0,.4);
}
@media(min-width:1000px){
  .nav{position:static;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;width:100%}
}
.nb{
  flex:1;max-width:96px;padding:7px 2px 6px;border-radius:10px;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--tx-3);transition:all .14s;
}
.nb .g{font-size:17px;line-height:1}
.nb[aria-current="true"]{background:var(--brand-soft);color:var(--brand-tx)}
.nb:hover:not([aria-current="true"]){color:var(--tx-2);background:var(--surf-2)}
.nb .badge{
  position:absolute;transform:translate(17px,-4px);background:var(--red);color:#fff;
  font-family:var(--f-m);font-size:9px;font-weight:600;min-width:15px;height:15px;
  border-radius:9px;display:grid;place-items:center;padding:0 3px;
}

/* ---------- misc ---------- */
.empty{text-align:center;padding:46px 20px;color:var(--tx-3)}
.empty .big{font-family:var(--f-d);font-size:44px;line-height:1;margin-bottom:12px;color:var(--line-2)}
.empty p{font-size:14.5px;max-width:30ch;margin:0 auto;line-height:1.7}
.sect{font-family:var(--f-m);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-3);margin:6px 0 -4px;display:flex;align-items:center;gap:8px}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}
.hint{font-size:12.5px;color:var(--tx-3);line-height:1.6}
.scroll-x{overflow-x:auto}
input[type=date],input[type=number]{
  font:inherit;font-family:var(--f-m);font-size:13.5px;padding:7px 10px;border-radius:var(--r-sm);
  border:1.5px solid var(--line);background:var(--surf);color:var(--tx);width:100%;
}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.setrow:last-child{border-bottom:none}
.setrow>span{color:var(--tx-2)}
.setrow>div{flex-shrink:0;width:150px}
</style>

<header class="top">
  <div class="top-in">
    <div class="mark"><div class="seal">史</div><b>한국사 연표 스프린트</b></div>
    <div class="top-sp"></div>
    <span class="chip dday" id="cDday">D-<span class="n">–</span></span>
    <span class="chip strk" id="cStrk">🔥 <span class="n">0</span></span>
    <button class="icobtn" id="bTheme" aria-label="테마 전환">◐</button>
  </div>
</header>

<div class="wrap">
  <main class="col">
    <div class="today-bar">
      <div class="ring">
        <svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">
          <circle cx="23" cy="23" r="19" fill="none" stroke="var(--bg-2)" stroke-width="5"></circle>
          <circle id="ringArc" cx="23" cy="23" r="19" fill="none" stroke="var(--brand)" stroke-width="5"
                  stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4"
                  style="transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)"></circle>
        </svg>
        <span id="ringTx">0%</span>
      </div>
      <div>
        <div class="lbl">오늘의 목표</div>
        <div class="val" id="todayVal">0 / 20 문제</div>
      </div>
      <div class="rank">
        <div class="r" id="rankTx">서당 학동</div>
        <div class="xpbar"><i id="xpFill" style="width:0%"></i></div>
      </div>
    </div>

    <div class="stage" id="stage"></div>
    <nav class="nav" id="nav"></nav>
  </main>

  <aside class="rail">
    <div class="panel">
      <h3>📊 단원별 숙련도</h3>
      <div id="mastery"></div>
    </div>
    <div class="panel">
      <h3>🎯 시험 범위</h3>
      <div class="upick" id="railPick"></div>
      <p class="hint" style="margin-top:11px">선택한 단원에서만 문제가 나와요.</p>
    </div>
  </aside>
</div>


<script>
/* ==========================================================================
   DATA — 고1 한국사 (2022 개정 교육과정 기준)
   FACT: [단원, 연도, 사건명, 설명, 빈칸키워드(설명 안에 반드시 포함)]
   ========================================================================== */
const UNITS=[
 {id:"u0",name:"전근대사 훑기",short:"전근대",range:"고조선 ~ 1862"},

<script>
/* ==========================================================================
   APP
   ========================================================================== */
var FMAP={},OMAP={};
FACTS.forEach(function(f){FMAP[f.id]=f;});
OX.forEach(function(o){OMAP[o.id]=o;});

var BOX_DAYS=[0,1,3,7,16];            /* 라이트너 상자별 다음 복습까지 걸리는 날 */
var RANKS=[[0,"서당 학동"],[120,"향교 유생"],[320,"성균관 유생"],[650,"과거 급제"],
           [1100,"사관 史官"],[1700,"실록 편수관"],[2500,"연표 마스터"]];
var KEY="hansa-sprint-v1";

/* ---------- 날짜 ---------- */
function dayNo(d){d=d||new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);}
function fmtY(y){return y<0?"기원전 "+(-y):String(y);}

/* ---------- 상태 ---------- */
var S;
function blank(){
  return {srs:{},xp:0,streak:0,last:0,goal:20,units:["u1","u2","u3"],
          dday:"",today:{day:dayNo(),n:0,ok:0},wrong:[],seenDays:0,theme:""};
}
function load(){
  try{var r=localStorage.getItem(KEY);S=r?Object.assign(blank(),JSON.parse(r)):blank();}
  catch(e){S=blank();}
  if(!S.units||!S.units.length)S.units=["u1","u2","u3"];
  var t=dayNo();
  if(!S.today||S.today.day!==t)S.today={day:t,n:0,ok:0};
  if(S.last&&S.last<t-1)S.streak=0;      /* 하루라도 건너뛰면 연속 끊김 */
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

function rankOf(xp){var r=RANKS[0],nx=null;
  for(var i=0;i<RANKS.length;i++){if(xp>=RANKS[i][0])r=RANKS[i];else{nx=RANKS[i];break;}}
  return {name:r[1],cur:r[0],next:nx?nx[0]:r[0]+1};}

/* ---------- 학습 풀 ---------- */
function inScope(u){return S.units.indexOf(u)>=0;}
function poolFacts(){return FACTS.filter(function(f){return inScope(f.u);});}
function poolOx(){return OX.filter(function(o){return inScope(o.u);});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a,n){return shuffle(a).slice(0,n);}

function buildQueue(){
  var t=dayNo(),ids=[],due=[],fresh=[];
  poolFacts().forEach(function(f){ids.push(f.id);});
  poolOx().forEach(function(o){ids.push(o.id);});
  ids.forEach(function(id){
    var r=S.srs[id];
    if(!r)fresh.push(id); else if(r.due<=t)due.push(id);
  });
  var q=shuffle(due);
  var room=Math.max(S.goal-S.today.n,6);
  if(q.length<room)q=q.concat(shuffle(fresh).slice(0,room-q.length));
  return q.slice(0,Math.min(60,room));
}

/* ---------- 채점 ---------- */
function grade(id,score){          /* score: 0 다시 · 1 애매 · 2 정답/쉬움 */
  var t=dayNo(),r=S.srs[id]||{b:0,due:t};
  if(score===0){r.b=0;r.due=t;}
  else if(score===1){r.b=Math.max(0,r.b);r.due=t+1;}
  else{r.b=Math.min(4,r.b+1);r.due=t+BOX_DAYS[r.b];}
  S.srs[id]=r;
  S.today.n++;
  if(score===2){S.today.ok++;S.xp+=10+Math.min(10,combo*2);combo++;
    var w=S.wrong.indexOf(id);if(w>=0)S.wrong.splice(w,1);}
  else{S.xp+=2;combo=0;if(S.wrong.indexOf(id)<0)S.wrong.push(id);}
  var t2=dayNo();
  if(S.last!==t2){S.streak=(S.last===t2-1)?S.streak+1:1;S.last=t2;S.seenDays++;}
  save();paintTop();
  if(combo&&combo%3===0)flashCombo(combo);
}
var combo=0;
function flashCombo(n){
  var el=document.createElement("div");el.className="combo";el.textContent=n+" 연속!";
  document.body.appendChild(el);setTimeout(function(){el.remove();},760);
}

/* ---------- 문제 생성 ---------- */
function distinct(arr,n,not){
  var out=[],seen={};seen[not]=1;
  shuffle(arr).forEach(function(v){if(out.length<n&&!seen[v]){seen[v]=1;out.push(v);}});
  return out;
}
function makeItem(id){
  if(id.charAt(0)==="o"){var o=OMAP[id];return {kind:"ox",id:id,u:o.u,ox:o};}
  var f=FMAP[id],sib=FACTS.filter(function(x){return x.u===f.u&&x.id!==f.id;});
  var kinds=["flash","year","event"];
  if(f.d.indexOf(f.k)>=0)kinds.push("cloze");
  var kind=kinds[Math.floor(Math.random()*kinds.length)];
  if(kind==="year"){
    var ys=distinct(sib.map(function(x){return x.y;}),3,f.y).concat([f.y]);
    return {kind:"year",id:id,u:f.u,f:f,opts:shuffle(ys),ans:f.y};
  }
  if(kind==="event"){
    var ts=distinct(sib.map(function(x){return x.t;}),3,f.t).concat([f.t]);
    return {kind:"event",id:id,u:f.u,f:f,opts:shuffle(ts),ans:f.t};
  }
  if(kind==="cloze"){
    var ks=distinct(sib.map(function(x){return x.k;}),3,f.k).concat([f.k]);
    return {kind:"cloze",id:id,u:f.u,f:f,opts:shuffle(ks),ans:f.k};
  }
  return {kind:"flash",id:id,u:f.u,f:f};
}
function makeOrder(){
  var byU={};poolFacts().forEach(function(f){(byU[f.u]=byU[f.u]||[]).push(f);});
  var us=Object.keys(byU).filter(function(u){return byU[u].length>=6;});
  if(!us.length)return null;
  var u=us[Math.floor(Math.random()*us.length)];
  var seen={},cand=[];
  shuffle(byU[u]).forEach(function(f){if(!seen[f.y]){seen[f.y]=1;cand.push(f);}});
  if(cand.length<4)return null;
  var four=cand.slice(0,4);
  return {kind:"order",u:u,items:shuffle(four),
          sorted:four.slice().sort(function(a,b){return a.y-b.y;})};
}

function renderOrder(g,done){
  var picked=[],wrong=false;
  function paint(){
    st().innerHTML='<div class="card">'+head(g.u,"연표 정렬")+'<div class="card-b">'+
      '<div class="q sm">일어난 순서대로 눌러 주세요</div>'+

      '<div class="opts" id="op">'+g.items.map(function(f){
        var i=picked.indexOf(f.id);
        var cls=i>=0?(wrong?"":"ok"):"";
        return '<button class="opt '+cls+'" data-id="'+f.id+'"'+(i>=0?" disabled":"")+'>'+
               '<span class="k">'+(i>=0?(i+1):"·")+'</span><span>'+esc(f.t)+
               (i>=0||wrong?' <span style="color:var(--tx-3)">— '+fmtY(f.y)+'</span>':'')+'</span></button>';
      }).join("")+'</div><div id="fb"></div></div></div>';
    Array.prototype.forEach.call(document.querySelectorAll("#op .opt"),function(b){
      b.onclick=function(){
        var f=FMAP[b.dataset.id];
        if(f.id===g.sorted[picked.length].id){
          picked.push(f.id);
          if(picked.length===g.items.length)finish(true); else paint();
        }else{wrong=true;finish(false);}
      };
    });
  }
  function finish(ok){
    wrong=!ok;paint();
    Array.prototype.forEach.call(document.querySelectorAll("#op .opt"),function(x){x.disabled=true;});
    g.items.forEach(function(f){grade(f.id,ok?2:0);});
    document.getElementById("fb").innerHTML=
      '<div class="fb '+(ok?"ok":"no")+'" style="margin-top:14px"><span class="ic">'+(ok?"○":"×")+
      '</span><span>'+(ok?"완벽한 순서예요! 4장 모두 +XP":"순서가 어긋났어요. 아래 연표로 확인하세요.")+'</span></div>'+
      '<div class="rail-line" style="margin-top:12px">'+g.sorted.map(function(f){

      }).join("")+'</div>'+
      '<button class="btn wide" id="bNext" style="margin-top:14px">다음 →</button>';
    document.getElementById("bNext").onclick=done;
  }
  paint();
}

      '</ol></div></div>';
  if(S.wrong.length)document.getElementById("bWrong").onclick=function(){
    var bag=S.wrong.slice(),i=0;
    (function nx(){
      if(i>=bag.length){viewMe();return;}
      renderItem(makeItem(bag[i++]),nx);
    })();
  };
  drawPick("mePick");
  document.getElementById("iDday").onchange=function(){S.dday=this.value;save();paintTop();};
  document.getElementById("iGoal").onchange=function(){S.goal=Math.max(5,Math.min(80,+this.value||20));save();paintTop();};
  document.getElementById("bReset").onclick=function(){
    if(confirm("학습 기록을 전부 지울까요? 되돌릴 수 없어요."))
      {S=blank();save();paintTop();viewMe();}
  };
}
function stat(l,v){
  return '<div style="background:var(--surf-2);border-radius:9px;padding:11px 12px">'+
    '<div style="font-size:11.5px;color:var(--tx-3)">'+l+'</div>'+
    '<div style="font-family:var(--f-d);font-weight:600;font-size:21px;margin-top:2px;font-variant-numeric:tabular-nums">'+v+'</div></div>';
}
function drawPick(id){
  var box=document.getElementById(id);if(!box)return;
  box.innerHTML=UNITS.map(function(u){
    return '<button class="uchip" data-u="'+u.id+'" aria-pressed="'+inScope(u.id)+'" title="'+u.range+'">'+u.short+'</button>';
  }).join("");
  Array.prototype.forEach.call(box.querySelectorAll(".uchip"),function(b){
    b.onclick=function(){
      var u=b.dataset.u,i=S.units.indexOf(u);
      if(i>=0){if(S.units.length>1)S.units.splice(i,1);}else S.units.push(u);
      save();drawPick("mePick");drawPick("railPick");paintTop();
      if(mode!=="me")go(mode);
    };
  });
}

/* ---------- 네비 ---------- */
var TABS=[["today","🎯","오늘"],["time","📜","연표"],["quiz","⚡","퀴즈"],["cheat","🔑","치트키"],["me","📊","나"]];
var mode="today";
function go(m){
  mode=m;combo=0;
  Array.prototype.forEach.call(document.querySelectorAll(".nb"),function(b){
    b.setAttribute("aria-current",String(b.dataset.m===m));
  });
  window.scrollTo({top:0,behavior:"instant"});
  if(m==="today")startToday();
  else if(m==="time")viewTimeline();
  else if(m==="quiz")startQuiz();
  else if(m==="cheat")viewCheat();
  else viewMe();
}

/* ---------- 부팅 ---------- */
load();
document.getElementById("nav").innerHTML=TABS.map(function(t){
  return '<button class="nb" data-m="'+t[0]+'"><span class="g">'+t[1]+'</span>'+t[2]+'</button>';
}).join("");
Array.prototype.forEach.call(document.querySelectorAll(".nb"),function(b){
  b.onclick=function(){go(b.dataset.m);};
});
if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);
document.getElementById("cDday").onclick=function(){
  go("me");
  setTimeout(function(){var i=document.getElementById("iDday");if(i){i.scrollIntoView({block:"center"});i.focus();}},60);
};
document.getElementById("bTheme").onclick=function(){
  var cur=document.documentElement.getAttribute("data-theme");
  var dark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  S.theme=dark?"light":"dark";
  document.documentElement.setAttribute("data-theme",S.theme);save();
};
drawPick("railPick");
paintTop();
go("today");
</script>
