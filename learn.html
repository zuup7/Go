<title>한국사 첫 수업</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한국사 첫 수업">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500;600&display=swap">

<style>
/* ── 밝은 쪽이 기본. 세 가지 상태(라이트·다크·시스템)를 모두 토큰으로 잡는다 ── */
:root{
  --bg:#F4F7F2; --bg2:#E8EDE4; --surf:#FFFFFF; --surf2:#F0F4EC;
  --line:#DBE2D5; --line2:#C2CDBB;
  --tx:#1A211C; --tx2:#4C594F; --tx3:#68756B;
  --jade:#2E7D63; --jade-s:#DEEDE5; --jade-t:#1E5A46; --on-jade:#FFFFFF;
  --ink:#20406A; --ink-s:#E2E9F2;
  --ochre:#9E6F1C; --ochre-s:#F7EEDA;
  --crim:#B0433B; --crim-s:#F8E4E2;
  --sh:0 1px 2px rgba(26,33,28,.05),0 10px 26px -14px rgba(26,33,28,.22);
  --sh-l:0 2px 5px rgba(26,33,28,.07),0 26px 50px -24px rgba(26,33,28,.32);
  --f-d:"Gowun Batang",serif;
  --f-b:"Gowun Dodum","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-m:"IBM Plex Mono",ui-monospace,monospace;
  --r:18px; --r-s:12px; --pad:18px;
  --safeb:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111613; --bg2:#0B0F0D; --surf:#19201C; --surf2:#222B26;
    --line:#2D3932; --line2:#3D4B43;
    --tx:#E9F0EA; --tx2:#ADBBB1; --tx3:#7A897F;
    --jade:#5CC79E; --jade-s:#133025; --jade-t:#9AE3C5; --on-jade:#08160F;
    --ink:#8DB5E7; --ink-s:#15243A;
    --ochre:#DFB155; --ochre-s:#2D2516;
    --crim:#EF756B; --crim-s:#321B19;
    --sh:0 1px 2px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.7);
    --sh-l:0 2px 5px rgba(0,0,0,.5),0 26px 50px -24px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --bg:#111613; --bg2:#0B0F0D; --surf:#19201C; --surf2:#222B26;
  --line:#2D3932; --line2:#3D4B43;
  --tx:#E9F0EA; --tx2:#ADBBB1; --tx3:#7A897F;
  --jade:#5CC79E; --jade-s:#133025; --jade-t:#9AE3C5; --on-jade:#08160F;
  --ink:#8DB5E7; --ink-s:#15243A;
  --ochre:#DFB155; --ochre-s:#2D2516;
  --crim:#EF756B; --crim-s:#321B19;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.7);
  --sh-l:0 2px 5px rgba(0,0,0,.5),0 26px 50px -24px rgba(0,0,0,.85);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--f-b);font-size:17px;line-height:1.75;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;word-break:keep-all}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;font-family:var(--f-b)}
:focus-visible{outline:3px solid var(--jade);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
@supports not (height:100dvh){#app{min-height:100vh}}
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) var(--pad) 12px;
  background:linear-gradient(var(--bg) 74%,transparent)}
.bar .ttl{flex:1;min-width:0;font-family:var(--f-d);font-weight:700;font-size:17px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.ib{width:44px;height:44px;flex-shrink:0;border-radius:13px;border:1px solid var(--line);
  background:var(--surf);display:grid;place-items:center;transition:background .15s}
.ib:active{background:var(--surf2)}
.view{flex:1;display:flex;flex-direction:column;padding:0 var(--pad) calc(26px + var(--safeb))}
.grow{flex:1;min-height:8px}

/* ── 홈 ── */
.hero{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 20px 18px;box-shadow:var(--sh);margin-bottom:18px}
.hero h1{font-family:var(--f-d);font-weight:700;font-size:23px;line-height:1.45;letter-spacing:-.015em;
  text-wrap:balance;margin-bottom:6px}
.hero p{font-size:14.5px;color:var(--tx2);line-height:1.7}
.prog{display:flex;align-items:center;gap:14px;margin-top:16px}
.ring{width:56px;height:56px;position:relative;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-m);
  font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.prog .pt{flex:1;min-width:0}
.prog .pt b{display:block;font-size:15px}
.prog .pt small{display:block;font-size:12.5px;color:var(--tx3)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;
  border-radius:var(--r-s);background:var(--jade);color:var(--on-jade);font-weight:700;font-size:16.5px;
  margin-top:16px;transition:filter .15s,transform .09s}
.cta:active{transform:scale(.99);filter:brightness(1.06)}
.cta.ghost{background:var(--surf);color:var(--tx);border:1.5px solid var(--line);font-weight:400}

.part{font-family:var(--f-m);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--tx3);margin:24px 0 10px;display:flex;align-items:center;gap:10px}
.part::after{content:"";flex:1;height:1px;background:var(--line)}
.lsn{display:flex;align-items:center;gap:13px;width:100%;text-align:left;min-height:76px;
  background:var(--surf);border:1px solid var(--line);border-radius:var(--r-s);
  padding:12px 14px;margin-bottom:8px;transition:background .15s,border-color .15s}
.lsn:active{background:var(--surf2)}
.lsn.done{border-color:var(--jade);background:linear-gradient(100deg,var(--jade-s),transparent 62%),var(--surf)}
.lsn .sc{width:50px;height:50px;flex-shrink:0;border-radius:12px;background:var(--surf2);
  display:grid;place-items:center;color:var(--jade)}
.lsn.done .sc{background:var(--jade-s)}
.lsn .tx{flex:1;min-width:0}
.lsn .tx b{display:block;font-family:var(--f-d);font-weight:700;font-size:16px;line-height:1.4}
.lsn .tx small{display:block;font-size:12px;color:var(--tx3);font-family:var(--f-m);margin-top:1px}
.lsn .rt{flex-shrink:0;color:var(--tx3);display:flex;align-items:center;gap:6px;font-size:12px}
.lsn .chk{width:26px;height:26px;border-radius:50%;background:var(--jade);display:grid;place-items:center;color:var(--on-jade)}

/* ── 레슨 진행 ── */
.track{height:5px;border-radius:5px;background:var(--bg2);overflow:hidden;flex:1}
.track i{display:block;height:100%;background:var(--jade);border-radius:5px;transition:width .35s cubic-bezier(.3,0,.2,1)}
.step{font-family:var(--f-m);font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums;flex-shrink:0}

.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);
  padding:22px 20px;box-shadow:var(--sh);animation:in .32s cubic-bezier(.2,.9,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card + .card{margin-top:12px}
.eyebrow{font-family:var(--f-m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--tx3);margin-bottom:10px}
.yr{font-family:var(--f-m);font-weight:600;font-size:13px;color:var(--ink);
  background:var(--ink-s);border-radius:99px;padding:4px 11px;display:inline-block;margin-bottom:10px}
.h{font-family:var(--f-d);font-weight:700;font-size:24px;line-height:1.4;letter-spacing:-.015em;
  text-wrap:balance;margin-bottom:12px}
.h.sm{font-size:20px}
.bd{font-size:16.5px;line-height:1.85;color:var(--tx2)}
.bd b,.bd strong{color:var(--tx);font-weight:400;background:var(--ochre-s);
  border-radius:4px;padding:1px 4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.wsblock{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.ws{display:flex;gap:11px;align-items:flex-start;background:var(--surf2);border-radius:var(--r-s);
  padding:13px 14px}
.ws .lb{font-family:var(--f-d);font-weight:700;font-size:13.5px;flex-shrink:0;width:42px;line-height:1.6}
.ws.why .lb{color:var(--ink)} .ws.so .lb{color:var(--jade)}
.ws p{font-size:14.5px;line-height:1.75;color:var(--tx2);flex:1;min-width:0}

/* 장면 그림 */
.scene{display:grid;place-items:center;padding:6px 0 16px;color:var(--jade)}

/* 인과 사슬 */
.chain{display:flex;flex-direction:column;gap:0;margin-top:6px}
.cl{display:flex;gap:14px;align-items:flex-start;position:relative;padding:7px 0;
  opacity:0;animation:fadeup .45s cubic-bezier(.2,.9,.3,1) forwards}
.cl .dot{width:13px;height:13px;border-radius:50%;background:var(--jade);flex-shrink:0;margin-top:7px;
  box-shadow:0 0 0 4px var(--jade-s)}
.cl::before{content:"";position:absolute;left:6px;top:24px;bottom:-7px;width:1.5px;background:var(--line2)}
.cl:last-child::before{display:none}
.cl p{font-size:15.5px;line-height:1.7;padding-bottom:2px}
.cl:last-child p{font-weight:700;color:var(--jade-t)}
@keyframes fadeup{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

/* 암기 장치 */
.hintcard{background:linear-gradient(145deg,var(--ochre-s),var(--surf) 72%);border-color:var(--ochre)}
.hintcard .k{font-family:var(--f-d);font-weight:700;font-size:26px;line-height:1.35;color:var(--ochre);
  letter-spacing:.01em;text-wrap:balance}
.hintcard .bd{margin-top:12px}
.hintcard em{font-style:normal;font-weight:700;color:var(--tx);background:var(--surf);
  border-radius:4px;padding:0 4px}

/* 스스로 떠올리기 */
.recall{text-align:center;padding:6px 0}
.recall .q{font-family:var(--f-d);font-weight:700;font-size:22px;line-height:1.5;text-wrap:balance}
.recall .tip{font-size:14px;color:var(--tx3);margin-top:14px}
.recall .ans{font-family:var(--f-d);font-weight:700;font-size:27px;color:var(--jade);margin:8px 0 2px;
  animation:in .3s ease-out}
.blur{filter:blur(9px);opacity:.5;user-select:none;transition:filter .35s,opacity .35s}

/* 2지선다 */
.two{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.tw{min-height:58px;padding:14px 16px;border-radius:var(--r-s);border:1.5px solid var(--line);
  background:var(--surf);font-size:16px;text-align:left;line-height:1.5;transition:all .14s}
.tw:active:not(:disabled){transform:scale(.99)}
.tw.ok{border-color:var(--jade);background:var(--jade-s);color:var(--jade-t)}
.tw.no{border-color:var(--crim);background:var(--crim-s);color:var(--crim)}
.tw:disabled{cursor:default}
.fb{border-radius:var(--r-s);padding:14px 15px;font-size:15px;line-height:1.75;margin-top:12px;
  display:flex;gap:10px;align-items:flex-start}
.fb.ok{background:var(--jade-s);color:var(--jade-t)}
.fb.no{background:var(--crim-s);color:var(--crim)}
.fb .m{font-family:var(--f-d);font-weight:700;font-size:17px;flex-shrink:0;line-height:1.5}

/* 비교표 */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border-radius:var(--r-s);overflow:hidden;margin-top:14px}
.cmp>div{background:var(--surf);padding:14px 13px}
.cmp h4{font-family:var(--f-d);font-weight:700;font-size:15.5px;margin-bottom:9px;line-height:1.4}
.cmp .a h4{color:var(--ink)} .cmp .b h4{color:var(--crim)}
.cmp li{list-style:none;font-size:13.5px;line-height:1.65;color:var(--tx2);padding-left:12px;
  position:relative;margin-bottom:5px}
.cmp li::before{content:"";position:absolute;left:0;top:9px;width:4px;height:4px;border-radius:50%;background:var(--line2)}
.cmp li b{color:var(--tx);font-weight:400;background:var(--ochre-s);border-radius:3px;padding:0 3px}

/* 하단 버튼 */
.sticky{position:sticky;bottom:0;margin-top:auto;padding:16px 0 calc(10px + var(--safeb));
  background:linear-gradient(transparent,var(--bg) 24%)}
.row{display:flex;gap:9px}.row>*{flex:1}

/* 퀴즈 */
.qopt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;min-height:56px;
  padding:14px 15px;border-radius:var(--r-s);border:1.5px solid var(--line);background:var(--surf);
  font-size:16px;line-height:1.5;margin-bottom:8px;transition:all .14s}
.qopt:active:not(:disabled){transform:scale(.995)}
.qopt .kx{font-family:var(--f-m);font-size:12px;color:var(--tx3);flex-shrink:0;padding-top:3px}
.qopt.ok{border-color:var(--jade);background:var(--jade-s);color:var(--jade-t)}
.qopt.ok .kx{color:var(--jade)}
.qopt.no{border-color:var(--crim);background:var(--crim-s);color:var(--crim)}
.qopt.dim{opacity:.45}
.qopt:disabled{cursor:default}

/* 마무리 */
.done-hero{text-align:center;padding:26px 0 10px}
.done-hero .big{font-family:var(--f-d);font-weight:700;font-size:52px;line-height:1;color:var(--jade);
  font-variant-numeric:tabular-nums}
.done-hero .sub{font-size:15px;color:var(--tx2);margin-top:10px}
.sumlist{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.sum{display:flex;gap:11px;align-items:flex-start;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r-s);padding:13px 14px;font-size:15px;line-height:1.7}
.sum .n{font-family:var(--f-m);font-size:12px;color:var(--jade);flex-shrink:0;padding-top:4px}

/* 다시 훑기 */
.rv{background:var(--surf);border:1px solid var(--line);border-radius:var(--r-s);padding:15px 16px;
  margin-bottom:9px}
.rv .t{font-family:var(--f-m);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
.rv .k{font-family:var(--f-d);font-weight:700;font-size:20px;color:var(--ochre);margin:5px 0 7px;line-height:1.4}
.rv .b{font-size:14.5px;line-height:1.75;color:var(--tx2)}
.rv em{font-style:normal;font-weight:700;color:var(--tx)}
.empty{text-align:center;padding:52px 20px;color:var(--tx3)}
.empty p{font-size:15px;line-height:1.8;max-width:30ch;margin:14px auto 0}
.note{font-size:13.5px;color:var(--tx3);line-height:1.7}
.pop{position:fixed;left:50%;top:26%;transform:translateX(-50%);z-index:60;pointer-events:none;
  font-family:var(--f-d);font-weight:700;font-size:34px;color:var(--jade);
  animation:pp .9s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes pp{0%{opacity:0;transform:translateX(-50%) scale(.7)}
  25%{opacity:1;transform:translateX(-50%) scale(1.1)}
  70%{opacity:1;transform:translateX(-50%) scale(1)}
  100%{opacity:0;transform:translateX(-50%) translateY(-30px)}}
/* ── 자라는 나무 ── */
.plant{display:grid;place-items:center;padding:2px 0 10px;animation:grow .6s cubic-bezier(.2,.9,.3,1)}
@keyframes grow{from{opacity:0;transform:scale(.86) translateY(8px)}to{opacity:1;transform:none}}

/* ── 완료 도장 ── */
.stamp{display:grid;place-items:center;padding:4px 0 8px}
.stamp.show{animation:st .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes st{0%{opacity:0;transform:scale(1.9) rotate(-16deg)}
  55%{opacity:1;transform:scale(.92) rotate(3deg)}100%{opacity:1;transform:none}}

/* ── 오답 배너 ── */
.wbar{display:flex;align-items:center;gap:13px;width:100%;text-align:left;min-height:72px;
  background:linear-gradient(100deg,var(--crim-s),transparent 68%),var(--surf);
  border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:16px;
  transition:background .15s}
.wbar:active{background:var(--surf2)}
.wbar .n{font-family:var(--f-d);font-weight:700;font-size:27px;color:var(--crim);line-height:1;
  min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.wbar .tx{flex:1;min-width:0}
.wbar .tx b{display:block;font-size:15px}
.wbar .tx small{display:block;font-size:12.5px;color:var(--tx3);line-height:1.6}
.wbar .ch{color:var(--tx3);flex-shrink:0}

/* ── 30초 복습 카드 ── */
.peek{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px 16px;margin-bottom:16px;box-shadow:var(--sh)}
.peek .pt{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.peek .lb{flex:1;min-width:0;font-family:var(--f-m);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.peek .re{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surf2);
  flex-shrink:0;font-size:15px;color:var(--tx2);display:grid;place-items:center}
.peek .re:active{background:var(--bg2)}
.peek .pb .k{display:block;font-family:var(--f-d);font-weight:700;font-size:19px;color:var(--ochre);
  line-height:1.45;margin-bottom:6px}
.peek .pb span{font-size:14.5px;line-height:1.75;color:var(--tx2)}
.peek em{font-style:normal;font-weight:700;color:var(--tx)}
.peek b.k em{color:inherit}

/* ── 오답 노트 ── */
.wsum{display:flex;align-items:center;gap:14px;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r);padding:16px 17px;margin-bottom:12px;box-shadow:var(--sh)}
.wsum .wn{font-family:var(--f-d);font-weight:700;font-size:36px;color:var(--crim);line-height:1;
  font-variant-numeric:tabular-nums}
.wsum .wt{flex:1;min-width:0}
.wsum .wt b{display:block;font-size:15.5px}
.wsum .wt small{display:block;font-size:12.5px;color:var(--tx3);line-height:1.65;margin-top:2px}
.wcard{background:var(--surf);border:1px solid var(--line);border-radius:var(--r-s);
  padding:14px 15px;margin-bottom:8px}
.wcard.hot{border-color:var(--crim)}
.wq{font-size:15.5px;line-height:1.6;margin-bottom:10px;display:flex;gap:8px;align-items:flex-start}
.wq .dots{display:inline-flex;gap:3px;flex-shrink:0;padding-top:8px}
.wq .dots i{width:5px;height:5px;border-radius:50%;background:var(--crim)}
.wline{font-size:14px;line-height:1.6;padding:7px 11px;border-radius:9px;margin-bottom:5px;
  display:flex;gap:6px}
.wline.no{background:var(--crim-s);color:var(--crim)}
.wline.ok{background:var(--jade-s);color:var(--jade-t)}
.wex{font-size:13.5px;line-height:1.7;color:var(--tx3);margin-top:8px}
</style>

<div id="app">
  <header class="bar">
    <button class="ib" id="back" style="display:none" aria-label="뒤로">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="ttl" id="title">한국사 첫 수업</div>
    <button class="ib" id="theme" aria-label="밝기">◐</button>
  </header>
  <main class="view" id="view"></main>
</div>

<script>
const LESSONS=[

{id:"L5",u:"s2",part:"나라를 빼앗기다",title:"땅과 회사를 틀어쥐다",sc:"field",
 hook:"통치는 결국 돈이야. 일제가 가장 먼저 손댄 게 땅이었어. 그것도 '근대적 소유권을 확립한다'는 그럴듯한 명분을 달고.",
 cards:[
 {t:"fact",y:1912,n:"토지 조사 사업",b:"토지 소유자는 정해진 기간 안에 신고해야 소유권을 인정받았어. 이걸 <b>기한부 신고제</b>라고 해.",
  why:"겉으로는 '지세를 공정하게 매기고 근대적 소유권을 세운다'고 했지만, 진짜 목적은 식민 통치 재정을 확보하고 일본인이 땅을 쉽게 사게 하려는 거였어.",
  so:"절차가 복잡하고 기간이 짧아서 신고를 놓친 땅이 많았어."},
 {t:"check",q:"토지 조사 사업의 신고 방식을 뭐라고 할까?",a:"기한부 신고제",hint:"기한 안에 신고해야 한다는 뜻이야"},
 {t:"fact",y:1918,n:"토지 조사 사업의 결과",b:"총독부는 지세 수입이 크게 늘었고, 신고 안 된 땅과 국공유지를 차지했어. 그 땅은 동양 척식 주식회사나 일본인에게 헐값으로 넘어갔지.",
  why:"국가가 걷은 땅을 일본인 이주민에게 싸게 넘겨야 정착이 빨라지니까.",
  so:"농민이 '일정한 지대만 내면 계속 농사지을 수 있던' 관행이 부정되고, 기한부 계약 소작농이 늘어났어. 언제든 쫓겨날 수 있게 된 거지."},
 {t:"fact",y:1910,n:"회사령",b:"회사를 세우려면 조선 총독의 <b>허가</b>를 받아야 했어. 총독의 명령만으로 회사를 해산시킬 수도 있었지. 어업과 광업에도 허가제를 적용했어.",
  why:"한국인 자본이 커지면 독립운동의 밑천이 되니까 미리 막은 거야.",
  so:"한국인 기업의 성장이 눌렸어. 이 회사령은 1920년에 폐지되면서 신고제로 바뀌는데, 그것도 한국인을 위해서가 아니라 일본 기업을 들여오기 위해서였어."},
 {t:"hint",k:"1910년대 = 허가제 / 1920년대 = 신고제",b:"회사령은 1910년대엔 <em>허가</em>제(막으려고), 1920년에 폐지되며 <em>신고</em>제(들여오려고). '신고제라서 한국인을 도왔다'는 문장은 <em>×</em>야."},
 {t:"fact",y:1914,n:"기간 시설 건설",b:"철도·도로·항만·통신망을 새로 깔았어.",
  why:"근대화를 위해서가 아니야. 일본 상품을 팔기 쉽게, 한국의 식량과 자원을 실어 내기 쉽게 하려는 거였어.",
  so:"수탈의 통로가 완성됐어."},
 {t:"chain",title:"1910년대 경제 침탈",items:["토지 조사 사업 — 기한부 신고제","신고 못 한 땅을 총독부가 차지","동양 척식 주식회사·일본인에게 헐값 이전","기한부 소작농 증가","회사령(허가제) + 기간 시설 → 수탈 체제 완성"]},
 {t:"pick",q:"1910년대 회사령의 방식은?",c:["허가제","신고제"],a:0,e:"허가제로 한국인 기업을 억눌렀어. 신고제는 1920년 폐지 이후야."}
 ],

 {q:"총독부가 차지한 토지가 넘어간 곳은?",c:["동양 척식 주식회사","조선은행","경학사","대한인 국민회"],a:0,e:"동양 척식 주식회사와 일본인에게 헐값으로 넘어갔어."},

 {q:"토지 조사 사업의 결과로 나타난 현상은?",c:["기한부 계약 소작농 증가","자작농 증가","지주제 폐지","소작료 인하"],a:0,e:"농민의 관행적 경작권이 부정되면서 소작농이 늘었어."}

{id:"L6",u:"s3",part:"가면을 쓴 통치",title:"이름만 바꾼 통치",sc:"mask",
 hook:"3·1 운동에 놀란 일제가 갑자기 부드러워졌어. '문화 정치'라는 이름을 붙였지. 정말 달라졌을까? 이 단원은 '말과 실제가 다르다'는 것만 잡으면 끝나.",
 cards:[
 {t:"story",h:"왜 갑자기 태도를 바꿨을까",b:"1919년 3·1 운동으로 무단 통치의 한계가 드러났어. 총칼로는 못 누른다는 게 증명된 거지. 게다가 국제 여론까지 나빠졌어. 그래서 새 총독 사이토 마코토가 부임하면서 '문화 정치'를 내세워."},
 {t:"fact",y:1919,n:"문관 총독 임명 관제 개정",b:"군인이 아닌 문관도 총독이 될 수 있도록 규정을 고쳤어.",
  why:"'이제 군인이 다스리지 않는다'는 인상을 주려고.",
  so:"그런데 실제로 문관 총독은 <b>단 한 명도</b> 임명되지 않았어. 규정만 고치고 끝난 거야."},
 {t:"fact",y:1920,n:"보통 경찰제",b:"헌병 경찰제 대신 보통 경찰제로 바꿨어.",
  why:"헌병이 경찰 노릇 하는 게 너무 노골적이었으니까.",
  so:"그런데 경찰 인원과 경찰 관서 수는 <b>오히려 크게 늘었어</b>. 이름만 바뀌고 감시는 더 촘촘해진 거지."},
 {t:"check",q:"보통 경찰제로 바뀐 뒤 경찰 수는 늘었을까, 줄었을까?",a:"오히려 늘었다",hint:"문화 정치가 '기만적'이라고 불리는 이유 중 하나야"},
 {t:"fact",y:1920,n:"신문 발행 허용",b:"언론·출판의 자유를 일부 인정해서 『조선일보』와 『동아일보』가 창간됐어.",
  why:"불만을 배출할 창구를 만들어 주는 척한 거야.",
  so:"하지만 <b>사전 검열</b>을 해서 기사를 삭제하고, 심하면 신문을 압수하거나 정간·폐간시켰어."},
 {t:"fact",y:1920,n:"도 평의회 · 부·면 협의회",b:"한국인을 지방 행정에 참여시킨다고 선전했어.",
  why:"'너희도 정치에 참여한다'는 모양을 만들려고.",
  so:"실제로는 <b>의결권이 없는 자문 기구</b>였어. 중추원과 똑같은 수법이지."},
 {t:"fact",y:1925,n:"치안 유지법",b:"'국체를 변혁하거나 사유 재산 제도를 부인할 목적으로 결사를 조직한 자'를 10년 이하 징역에 처하는 법이야.",
  why:"1920년대에 사회주의 사상이 퍼지자 이를 막으려 했어.",
  so:"'사유 재산 제도를 부인할 목적'이라는 문구 때문에 사회주의자 탄압에 특히 많이 쓰였어. 독립운동가도 이 법으로 잡아갔지."},
 {t:"hint",k:"말은 ○, 실제는 ×",b:"문관 총독 <em>가능</em> → 한 명도 없음. 보통 경찰제 → 인원 <em>증가</em>. 신문 <em>허용</em> → 사전 검열. 지방 참여 → 의결권 <em>없음</em>. 네 개 전부 같은 패턴이야."},
 {t:"story",h:"진짜 목적은 따로 있었어",b:"총독부 문서에 이렇게 적혀 있어. '친일 인물을 물색하고 친일 단체를 만들게 한 후 원조를 제공한다. 조선인 부호와 민중을 대립하게 하고, 이들에게 일본 자본을 공급해 친일화한다.' 문화 정치의 본질은 <b>민족 분열 통치</b>였던 거야."},
 {t:"pick",q:"문화 정치 시기에 문관 총독은 몇 명 임명됐을까?",c:["한 명도 없다","여러 명 있었다"],a:0,e:"관제만 고쳤을 뿐 실제로는 단 한 명도 임명되지 않았어. 시험 단골이야."}
 ],
 quiz:[
 {q:"문화 정치로 전환한 계기는?",c:["3·1 운동","6·10 만세 운동","광주 학생 항일 운동","봉오동 전투"],a:0,e:"3·1 운동으로 무단 통치의 한계가 드러났어."},
 {q:"보통 경찰제 실시 후 나타난 현상은?",c:["경찰 인원과 관서가 오히려 증가","경찰이 대폭 감축","헌병이 완전히 철수","치안이 자율에 맡겨짐"],a:0,e:"이름만 바뀌고 감시는 더 촘촘해졌어."},
 {q:"1925년 사회주의자와 독립운동가 탄압에 쓰인 법은?",c:["치안 유지법","조선 태형령","회사령","국가 총동원법"],a:0,e:"'사유 재산 제도를 부인할 목적'이라는 문구가 핵심이야."},
 {q:"도 평의회와 부·면 협의회의 성격은?",c:["의결권 없는 자문 기구","입법 기관","사법 기관","독립운동 조직"],a:0,e:"참여시킨다고 선전했지만 실권이 없었어."}
 ]},

{id:"L7",u:"s3",part:"가면을 쓴 통치",title:"쌀을 빼앗기다",sc:"rice",
 hook:"쌀 생산량이 늘었는데 정작 한국 사람들은 더 굶었어. 어떻게 이런 일이 가능할까? 여기에 1920년대 경제 수탈의 핵심이 있어.",
 cards:[
 {t:"story",h:"일본 사정부터",b:"제1차 세계 대전으로 일본이 급격히 공업화되면서 도시 인구가 늘었어. 쌀 수요가 폭증했는데 생산이 못 따라가서 쌀값이 폭등했지. 그래서 한국에서 쌀을 가져오기로 한 거야."},
 {t:"fact",y:1920,n:"산미 증식 계획",b:"토지 개간, 품종 개량, 비료 사용, 수리 시설 확충으로 쌀 생산을 늘리려 했어.",
  why:"일본의 쌀 부족을 한국에서 메우려고.",
  so:"생산량은 늘었지만 계획한 목표에는 못 미쳤어. 그런데 <b>일본으로 가져가는 양은 예정대로</b> 진행됐지."},
 {t:"check",q:"생산은 목표에 미달했는데 반출은 예정대로 했어. 그 결과는?",a:"한국의 식량 사정이 나빠졌다",hint:"남는 게 줄어드니까"},
 {t:"fact",y:1926,n:"증산 비용의 전가",b:"비료 대금, 수리 조합비 같은 증산 비용을 지주가 소작농에게 떠넘겼어.",
  why:"지주는 손해 보지 않으려 했고, 총독부는 이를 막지 않았어.",
  so:"높은 소작료에 증산 비용까지 얹히자 자작농이 소작농으로, 소작농은 화전민이나 토막민으로 떨어졌어. 만주나 연해주, 일본으로 떠난 사람도 많았지."},
 {t:"hint",k:"생산 ↑ · 반출 ↑↑ · 식량 사정 ↓",b:"'산미 증식 계획으로 식량 사정이 좋아졌다'는 <em>×</em>. 늘어난 양보다 더 가져갔으니 <em>나빠졌어</em>. 부족한 건 만주에서 잡곡을 들여와 때웠지."},
 {t:"fact",y:1920,n:"회사령 폐지",b:"회사 설립을 허가제에서 신고제로 바꿨어.",
  why:"제1차 세계 대전으로 자본을 쌓은 일본 기업이 한국에 들어오고 싶어 했거든.",
  so:"한국인 기업도 늘긴 했지만 대부분 영세했어."},
 {t:"fact",y:1923,n:"일본 상품 관세 철폐",b:"일본 상품에 대한 관세가 대부분 없어졌어.",
  why:"일본 상품을 더 쉽게 팔기 위해서야.",
  so:"값싼 일본산이 밀려들면서 영세한 한국인 기업이 큰 타격을 입었어. 이에 맞서 '내 살림 내 것으로'를 외친 물산 장려 운동이 일어나지."},
 {t:"chain",title:"1920년대 경제 수탈",items:["일본의 쌀 부족","산미 증식 계획(1920)","반출은 예정대로 → 식량 사정 악화","증산 비용 전가 → 농민 몰락","회사령 폐지(1920) · 관세 철폐(1923) → 일본 자본 진출"]},
 {t:"pick",q:"산미 증식 계획으로 한국의 식량 사정은?",c:["나빠졌다","좋아졌다"],a:0,e:"늘어난 생산량보다 더 많이 가져갔기 때문이야."}
 ],
 quiz:[
 {q:"산미 증식 계획을 실시한 이유는?",c:["일본의 쌀 부족을 메우려고","한국 농민을 돕기 위해","군수 물자를 만들려고","관세를 걷기 위해"],a:0,e:"일본의 공업화로 쌀 수요가 폭증했어."},
 {q:"증산 비용이 전가되면서 농민에게 생긴 일은?",c:["자작농이 소작농·화전민으로 몰락","소작료 인하","자작농 증가","토지 소유 확대"],a:0,e:"비료 대금과 수리 조합비가 농민 몫이 됐어."},
 {q:"1920년 회사령 폐지의 진짜 목적은?",c:["일본 기업의 한국 진출을 돕기 위해","한국인 기업을 키우기 위해","세금을 줄이기 위해","산업을 통제하기 위해"],a:0,e:"제1차 세계 대전으로 자본을 축적한 일본 기업을 위한 조치였어."},
 {q:"1923년 관세 철폐의 결과는?",c:["한국인 기업이 큰 타격을 입음","한국 상품 수출 증가","일본 상품 가격 상승","무역 흑자"],a:0,e:"값싼 일본산이 밀려들었어. 물산 장려 운동의 배경이야."}
 ]},

{id:"L8",u:"s4",part:"이름을 빼앗기다",title:"민족을 지우려 하다",sc:"mask2",
 hook:"이번엔 땅이나 쌀이 아니야. 이름, 말, 정신 자체를 지우려고 했어. 왜 하필 1930년대부터였을까?",
 cards:[
 {t:"story",h:"전쟁이 커졌기 때문이야",b:"만주 사변(1931) 이후 일본은 침략 전쟁을 계속 넓혀 갔어. 전쟁에는 사람이 필요한데, 한국인을 전쟁터에 보내려면 먼저 '너희도 일본인'이라고 믿게 만들어야 했지. 민족 말살 통치는 <b>전쟁 동원을 위한 준비</b>였던 거야."},
 {t:"fact",y:1931,n:"내선일체와 일선동조론",b:"<b>내선일체</b>는 내지(일본)와 조선이 한몸이라는 뜻이고, <b>일선동조론</b>은 일본인과 한국인이 같은 조상에서 나왔다는 주장이야.",
  why:"'우리는 원래 한 민족'이라고 믿게 만들려고.",
  so:"이 논리 위에서 황국 신민화 정책이 강요돼. 두 말의 뜻을 바꿔 내는 문제가 자주 나오니 구분해 두자."},
 {t:"check",q:"'일본인과 한국인이 같은 조상에서 나왔다'는 주장의 이름은?",a:"일선동조론",hint:"내선일체는 '한몸'이라는 뜻이야"},
 {t:"fact",y:1937,n:"황국 신민 서사",b:"'우리는 대일본 제국의 신민입니다'로 시작하는 맹세문을 강제로 외우게 했어. 매일 아침 일본 궁성 쪽을 향해 절하는 <b>궁성 요배</b>도 시켰지.",
  why:"매일 반복시켜 몸에 배게 하려고.",
  so:"학교뿐 아니라 어른들 모임에서도 외워야 했어."},
 {t:"fact",y:1937,n:"신사 참배 강요",b:"각지에 신사를 세우고 참배를 강요했어.",
  why:"종교까지 일본식으로 바꾸려 한 거야.",
  so:"거부하면 처벌하고 학교까지 폐쇄했어."},
 {t:"fact",y:1939,n:"창씨개명",b:"성과 이름을 일본식으로 바꾸도록 강요했어.",
  why:"이름은 정체성의 핵심이니까. 이름을 바꾸면 뿌리가 흐려진다고 본 거지.",
  so:"거부하면 자녀를 학교에 보내지 못하게 하고 식량 배급에서 제외했어. 사실상 강제였어."},
 {t:"fact",y:1942,n:"조선어 학회 사건",b:"우리말을 연구하던 조선어 학회 회원들을 치안 유지법 위반으로 잡아갔어.",
  why:"한국어 교육을 금지한 마당에 우리말 사전을 만드는 건 그냥 둘 수 없었지.",
  so:"『우리말 큰사전』 편찬이 중단됐어. 앞서 1940년에는 『조선일보』와 『동아일보』도 폐간시켰지."},
 {t:"chain",title:"지워 간 순서",items:["만주 사변(1931) — 전쟁 확대","내선일체 · 일선동조론","황국 신민 서사(1937) · 신사 참배","한국어 교육 금지(1938)","창씨개명(1939) · 신문 폐간(1940)","조선어 학회 사건(1942)"]},
 {t:"hint",k:"황(37) 창(39) 사전(42)",b:"<em>황</em>국 신민 서사 1937 → <em>창</em>씨개명 1939 → 조선어 학회 <em>사</em>건 1942. 홀수 해로 착착 이어져."},
 {t:"pick",q:"'내지와 조선이 한몸'이라는 뜻의 말은?",c:["내선일체","일선동조론"],a:0,e:"내선일체가 '한몸', 일선동조론이 '같은 조상'이야."}
 ],
 quiz:[
 {q:"민족 말살 통치를 실시한 근본 이유는?",c:["침략 전쟁에 한국인을 동원하기 위해","경제를 발전시키기 위해","교육을 확대하기 위해","국제 여론을 의식해서"],a:0,e:"만주 사변 이후 전쟁이 커지면서 인력이 필요했어."},
 {q:"일본인과 한국인이 같은 조상에서 나왔다는 주장은?",c:["일선동조론","내선일체","황국 신민화","대동아 공영권"],a:0,e:"내선일체는 '한몸'이라는 뜻이야."},
 {q:"창씨개명을 거부하면 받은 불이익은?",c:["식량 배급 제외, 자녀 취학 금지","벌금형","태형","국외 추방"],a:0,e:"생활을 옥죄어 사실상 강제했어."},
 {q:"조선어 학회 사건에 적용된 법은?",c:["치안 유지법","조선 태형령","회사령","경찰범 처벌 규칙"],a:0,e:"1942년, 우리말 연구를 독립운동으로 몰았어."}
 ]},

{id:"L9",u:"s4",part:"이름을 빼앗기다",title:"전쟁에 끌려가다",sc:"factory",
 hook:"'국가 총동원'이라는 말은 사람과 물건을 마음대로 쓰겠다는 뜻이야. 이 시기가 우리 근현대사에서 가장 아픈 대목이야.",
 cards:[
 {t:"fact",y:1930,n:"식민지 공업화",b:"대공황 이후 일본 독점 자본이 값싼 노동력과 지하자원을 노리고 들어와 중화학 공업과 광업에 투자했어.",
  why:"일본 안에서는 대공황으로 투자처가 마땅찮았거든.",
  so:"석탄과 철이 많은 <b>북부 지방</b>에 공장이 몰렸어. 남북 간 산업 불균형이 이때 생겨."},
 {t:"fact",y:1934,n:"남면북양 정책",b:"<b>남</b>부에서는 <b>면</b>화를 재배하고 <b>북</b>부에서는 <b>양</b>을 기르게 했어.",
  why:"대공황으로 어려워진 일본 방직 자본가에게 값싼 원료를 대주려고.",
  so:"이름 순서가 그대로 정책이야. 남면북양 — 남쪽 면화, 북쪽 양."},
 {t:"check",q:"남면북양 정책에서 남부에 강요한 것은?",a:"면화 재배",hint:"이름에 답이 들어 있어"},
 {t:"fact",y:1938,n:"병참 기지화 정책",b:"중일 전쟁이 터지자 한반도를 전쟁 물자를 대는 기지로 만들려 했어.",
  why:"일본에서 바닷길로 물자를 보내다 끊길 수 있으니, 한반도에서 직접 대게 하려 한 거야.",
  so:"산업 구조가 군수 산업 중심으로 바뀌고 생활용품 산업은 쪼그라들었어."},
 {t:"fact",y:1938,n:"국가 총동원법",b:"'전시에 인적·물적 자원을 통제 운용한다'는 법이야. 제국 신민을 징용해 총동원 업무에 종사시킬 수 있다고 못 박았지.",
  why:"전쟁이 길어지면서 사람과 물자가 계속 필요했어.",
  so:"이 법이 강제 징용·징병·공출의 <b>법적 근거</b>가 돼. 뒤에 나오는 모든 동원이 여기서 나와."},
 {t:"fact",y:1943,n:"인력 수탈",b:"지원병제·학도 지원병제·징병제로 청년들을 전쟁터에 보냈고, <b>국민 징용령</b>으로 청장년을 탄광·철도 공사·군수 공장에 끌고 갔어.",
  why:"전쟁이 길어질수록 병력과 노동력이 모자랐어.",
  so:"낯선 땅에서 임금도 제대로 못 받고 돌아오지 못한 사람이 많았어."},
 {t:"fact",y:1944,n:"여성에 대한 동원",b:"수많은 여성이 일본군 '위안부'로 끌려가 성 노예가 되는 참혹한 피해를 입었어. 전쟁 막바지에는 <b>여자 정신 근로령</b>으로 수십만 명을 군수 공장에 동원했지.",
  why:"남성 인력이 바닥나자 여성까지 동원한 거야.",
  so:"이 문제는 오랫동안 은폐되다가 1990년대에 생존자들의 증언으로 진상 규명이 시작됐어. 지금도 끝나지 않은 역사야."},
 {t:"fact",y:1939,n:"공출과 배급제",b:"집집마다 할당량을 정해 쌀을 걷고 배급제를 시행했어. 무기를 만들려고 절의 종, 놋그릇, 숟가락까지 가져갔지.",
  why:"전쟁 물자가 모자랐거든.",
  so:"'국민정신 총동원 운동'을 벌이며 말단에 <b>애국반</b>을 두어 공출과 징용을 독촉했어."},
 {t:"chain",title:"동원의 사슬",items:["중일 전쟁(1937)","국가 총동원법(1938) — 법적 근거","병참 기지화 · 애국반","국민 징용령 · 징병제","여자 정신 근로령(1944) · 공출"]},
 {t:"pick",q:"강제 징용과 징병의 법적 근거가 된 법은?",c:["국가 총동원법","치안 유지법"],a:0,e:"1938년 국가 총동원법이야. 치안 유지법(1925)은 사상 탄압용이야."}
 ],
 quiz:[
 {q:"식민지 공업화로 공장이 몰린 지역은?",c:["북부 지방","남부 지방","제주도","동해안 전역"],a:0,e:"석탄과 철 등 지하자원이 풍부해서야."},
 {q:"남면북양 정책의 내용은?",c:["남부는 면화, 북부는 양","남부는 양, 북부는 면화","남부는 쌀, 북부는 보리","전국에 면화 재배"],a:0,e:"이름 순서 그대로야."},
 {q:"1938년 인적·물적 자원 통제를 명시한 법은?",c:["국가 총동원법","치안 유지법","조선 태형령","회사령"],a:0,e:"징용·징병·공출의 근거가 됐어."},
 {q:"국민정신 총동원 운동의 말단 조직은?",c:["애국반","중추원","도 평의회","경학사"],a:0,e:"일장기 게양, 신사 참배, 공출을 독촉했어."}
 ]},

{id:"L10",u:"s5",part:"나라 밖에서 준비하다",title:"몰래 뭉치다",sc:"paper",
 hook:"헌병이 거리를 지키던 1910년대에도 사람들은 포기하지 않았어. 다만 드러내 놓고 할 수 없으니 비밀 결사로 움직였지. 두 단체만 확실히 구분하면 돼.",
 cards:[
 {t:"fact",y:1912,n:"독립 의군부",b:"의병장 출신 <b>임병찬</b> 등이 고종의 밀명을 받아 만들었어. 일제에 국권 반환 요구서를 보내려다 발각돼 실패했지.",
  why:"의병 운동의 흐름을 잇는 사람들이었어.",
  so:"이들이 내세운 건 <b>복벽주의</b>야. 무너진 왕조를 되살려 고종을 다시 황제로 세우자는 거지."},
 {t:"fact",y:1915,n:"대한 광복회",b:"<b>박상진</b> 등이 주축이 됐어. 군자금을 모으고 친일파를 처단했으며, 만주에 무관 학교를 세우려 했지.",
  why:"독립 전쟁으로 국권을 되찾아야 한다고 봤어.",
  so:"이들이 목표한 건 <b>공화주의</b>, 곧 민주 공화제 국가야. 왕이 아니라 국민이 주인인 나라를 세우자는 거지."},
 {t:"compare",title:"이 둘만 구분하면 끝",l:{n:"독립 의군부 (1912)",p:["임병찬 (의병장 출신)","고종의 <b>밀명</b>","<b>복벽</b>주의 — 왕조 부활","국권 반환 요구서 시도"]},
  r:{n:"대한 광복회 (1915)",p:["박상진","군자금 모금 · 친일파 처단","<b>공화</b>주의 — 민주 공화제","만주 무관 학교 추진"]}},
 {t:"check",q:"대한 광복회가 목표로 한 국가 형태는?",a:"민주 공화제 (공화주의)",hint:"'광복회'라는 이름처럼 새 나라를 세우자는 쪽이야"},

{id:"L11",u:"s5",part:"나라 밖에서 준비하다",title:"국경을 넘다",sc:"border",
 hook:"국내에서 활동이 막히자 지사들은 아예 국경을 넘었어. 어디에 무엇이 있었는지, 지도를 머릿속에 그려 두면 한 번에 정리돼.",
 cards:[
 {t:"story",h:"왜 국외였을까",b:"헌병 경찰의 감시망 안에서는 군사 훈련은커녕 모임조차 어려웠어. 그래서 지리적으로 가까운 만주와 연해주에 <b>독립운동 기지</b>를 세우고, 오래 버틸 거점으로 삼으려 한 거야."},
 {t:"fact",y:1911,n:"서간도 — 삼원보",b:"신민회의 <b>이회영·이상룡</b> 등이 자치 기관 <b>경학사</b>를 만들고, 독립군을 기르려 <b>신흥 강습소</b>를 세웠어. 이게 뒷날 <b>신흥 무관 학교</b>가 돼.",
  why:"이회영 일가는 대부호였는데 전 재산을 급히 처분해 만주로 떠났어.",
  so:"3·1 운동 이후 만주로 향한 청년들이 여기서 군사 훈련을 받았어."},
 {t:"fact",y:1913,n:"북간도",b:"<b>간민회</b> 같은 자치 단체가 동포 사회를 이끌었고, 서전서숙을 이은 <b>명동 학교</b>가 세워졌어. 대종교 간부 <b>서일</b> 등은 무장 단체 <b>중광단</b>을 만들었지.",
  why:"한인이 가장 많이 살던 지역이라 기반이 튼튼했어.",
  so:"중광단이 뒷날 <b>북로 군정서</b>가 돼. 청산리에서 김좌진이 이끄는 바로 그 부대야."},
 {t:"check",q:"중광단은 뒷날 어떤 부대가 될까?",a:"북로 군정서",hint:"청산리 대첩의 주력 부대야"},
 {t:"fact",y:1911,n:"연해주 — 신한촌",b:"블라디보스토크 교외에 <b>신한촌</b>을 세우고 <b>권업회</b>가 활동했어. 뒤에 <b>이상설·이동휘</b>를 정·부통령으로 하는 <b>대한 광복군 정부</b>가 세워졌지(1914).",
  why:"러시아와 가까워 무기를 구하기 쉬웠어.",
  so:"'정부'라는 이름을 쓴 조직이 이때 이미 나왔다는 게 중요해."},
 {t:"fact",y:1910,n:"미주",b:"장인환·전명운의 의거를 계기로 애국심이 높아지자 <b>안창호</b> 주도로 한인 단체들이 통합해 <b>대한인 국민회</b>를 만들었어. 하와이에서는 <b>박용만</b>이 <b>대조선 국민군단</b>을 꾸려 군사 훈련을 했지.",
  why:"멀리 떨어져 있어 상대적으로 안전했고, 자금을 모으기 좋았어.",
  so:"미주는 주로 외교와 자금, 만주·연해주는 주로 무장 투쟁을 맡는 구도가 만들어져."},
 {t:"fact",y:1912,n:"상하이",b:"<b>신규식</b> 등이 <b>동제사</b>를 만들었고, 이들 중 일부가 <b>신한청년당</b>을 결성했어.",
  why:"열강의 조계 지역이 많아 외교 활동에 유리했어.",
  so:"신한청년당이 김규식을 파리 강화 회의에 보내고, 이 흐름이 대한민국 임시 정부 수립으로 이어져."},
 {t:"fact",y:1917,n:"대동단결 선언",b:"신규식·박은식·신채호·조소앙 등이 상하이에서 발표했어. '순종이 주권을 포기한 날이 곧 국민이 주권을 이어받은 날'이라는 <b>국민 주권론</b>을 폈지.",
  why:"나라를 다시 세우려면 '누가 주인인가'부터 정해야 했어.",
  so:"임시 정부를 세울 이론적 바탕이 됐어. 황제의 나라에서 국민의 나라로 넘어가는 결정적 문장이야."},
 {t:"hint",k:"서 · 북 · 연 · 미 · 상",b:"<em>서</em>간도 경학사·신흥 ‖ <em>북</em>간도 간민회·명동 학교·중광단 ‖ <em>연</em>해주 권업회·신한촌 ‖ <em>미</em>주 국민회·국민군단 ‖ <em>상</em>하이 동제사·신한청년당. 지도 왼쪽 위에서 시계 방향으로 돌면 이 순서야."},
 {t:"pick",q:"경학사와 신흥 강습소가 세워진 곳은?",c:["서간도 삼원보","북간도"],a:0,e:"서간도야. 북간도는 간민회·명동 학교·중광단이지."}
 ],
 quiz:[
 {q:"신흥 무관 학교의 전신은?",c:["신흥 강습소","서전서숙","명동 학교","대성 학교"],a:0,e:"서간도 삼원보에서 시작됐어."},
 {q:"중광단을 만든 종교 세력은?",c:["대종교","천도교","기독교","불교"],a:0,e:"서일 등 대종교 간부들이 만들었고 북로 군정서가 됐어."},
 {q:"연해주에서 이상설·이동휘를 정·부통령으로 세운 조직은?",c:["대한 광복군 정부","대한인 국민회","동제사","경학사"],a:0,e:"신한촌·권업회에 이어 세워졌어."},
 {q:"국민 주권론을 편 1917년 선언은?",c:["대동단결 선언","2·8 독립 선언","3·1 독립 선언서","대한민국 건국 강령"],a:0,e:"임시 정부 수립의 이론적 바탕이 됐어."}
 ]},

{id:"L12",u:"s6",part:"1919년 봄",title:"불씨가 모이다",sc:"spark",
 hook:"3·1 운동은 어느 날 갑자기 터진 게 아니야. 국제 정세, 유학생, 그리고 한 사람의 죽음. 세 가지가 겹쳤어.",
 cards:[
 {t:"fact",y:1918,n:"국제적 배경",b:"러시아 혁명 뒤 <b>레닌</b>이 약소민족의 해방 운동을 돕겠다고 선언했고, 미국 대통령 <b>윌슨</b>은 <b>민족 자결주의</b>를 내놨어.",
  why:"제1차 세계 대전이 끝나며 세계 질서를 다시 짜던 참이었어.",
  so:"'지금이 기회다. 우리 뜻을 세계에 알리면 도와줄지 모른다'는 판단이 섰어."},
 {t:"fact",y:1919,n:"김규식의 파리 파견",b:"상하이의 <b>신한청년당</b>이 한국의 독립을 청원하려 <b>김규식</b>을 파리 강화 회의에 대표로 보냈어.",
  why:"민족 자결주의가 논의되는 자리에 직접 가야 했으니까.",
  so:"'우리가 독립을 원한다는 증거'가 필요해졌어. 국내에서 큰 시위가 일어나야 대표의 말에 힘이 실리거든."},
 {t:"fact",y:1919,n:"2·8 독립 선언",b:"일본에 유학 중이던 학생들이 <b>조선 청년 독립단</b> 이름으로 도쿄에서 독립 선언서를 발표했어. '요구가 실현되지 않으면 영원히 혈전을 벌이겠다'고 했지.",
  why:"파리 회의에 맞춰 목소리를 내야 했어.",
  so:"적의 심장부에서 터진 선언이라 국내에 큰 충격을 줬어. 3·1 운동의 직접적 계기야."},
 {t:"check",q:"도쿄에서 유학생들이 발표한 선언은?",a:"2·8 독립 선언",hint:"3·1 운동보다 3주쯤 앞서 있었어"},
 {t:"fact",y:1919,n:"고종의 서거",b:"1월에 고종이 세상을 떠났어. 일제가 독살했다는 소문이 퍼지며 분노가 크게 번졌지.",
  why:"이미 강제 퇴위당한 황제였기에 사람들의 감정이 복잡했어.",
  so:"천도교·기독교·불교 지도자와 학생들이 <b>고종의 국장일</b>에 즈음해 만세 시위를 계획했어. 사람이 많이 모이는 날이었거든."},
 {t:"chain",title:"불씨가 모인 순서",items:["레닌 · 윌슨의 민족 자결주의","신한청년당, 김규식을 파리로","2·8 독립 선언 (도쿄)","고종 서거 · 국장일","3·1 운동"]},
 {t:"hint",k:"레 · 윌 · 김 · 2·8 · 고종",b:"국제(<em>레</em>닌·<em>윌</em>슨) → 국외(<em>김</em>규식 파리, <em>2·8</em> 도쿄) → 국내(<em>고종</em> 서거). 바깥에서 안으로 좁혀 들어와."},
 {t:"pick",q:"3·1 운동이 계획된 날은?",c:["고종의 국장일 즈음","순종의 장례일"],a:0,e:"고종이야. 순종의 장례일에 일어난 건 6·10 만세 운동(1926)이지. 이걸 바꿔 내는 문제가 아주 많아."}
 ],
 quiz:[
 {q:"민족 자결주의를 제창한 사람은?",c:["윌슨","레닌","김규식","손병희"],a:0,e:"레닌은 약소민족 해방 운동 지원을 선언했어."},
 {q:"김규식을 파리 강화 회의에 파견한 단체는?",c:["신한청년당","동제사","대한인 국민회","의열단"],a:0,e:"상하이에서 활동하던 단체야."},
 {q:"도쿄에서 발표된 독립 선언은?",c:["2·8 독립 선언","3·1 독립 선언서","대동단결 선언","기미 독립 선언"],a:0,e:"조선 청년 독립단 이름으로 발표했어."},
 {q:"3·1 운동을 계획할 때 기준으로 삼은 날은?",c:["고종의 국장일","순종의 장례일","일왕의 생일","광복절"],a:0,e:"사람이 많이 모이는 날이었어."}
 ]},

{id:"L13",u:"s6",part:"1919년 봄",title:"만세",sc:"flag",
 hook:"1919년 3월 1일. 그날 실제로 무슨 일이 있었는지 시간 순서대로 따라가 보자. 장소 두 곳만 헷갈리지 않으면 돼.",
 cards:[
 {t:"fact",y:1919,n:"민족 대표의 독립 선언",b:"손병희·이승훈·한용운 등 민족 대표 33인은 원래 탑골 공원에서 선언식을 하려 했어. 그런데 시위가 과격해질까 걱정해 <b>태화관</b>이라는 음식점에 모여 선언식을 했지.",
  why:"충돌로 사람이 다칠 것을 우려했어.",
  so:"민족 대표는 태화관, 학생과 시민은 탑골 공원. 이 둘을 바꿔 내는 문제가 단골이야."},
 {t:"fact",y:1919,n:"탑골 공원의 만세",b:"탑골 공원에서는 학생과 시민이 독립 선언서를 낭독하고 '대한 독립 만세'를 외치며 거리로 쏟아져 나왔어.",
  why:"민족 대표가 오지 않자 학생들이 직접 나선 거야.",
  so:"평양·원산 등 주요 도시로 순식간에 번졌어."},
 {t:"check",q:"민족 대표 33인이 독립 선언식을 한 장소는?",a:"태화관",hint:"탑골 공원이 아니야. 학생과 시민이 그곳에 있었지"},
 {t:"fact",y:1919,n:"전국으로, 모든 계층으로",b:"도시에서 농촌으로 번졌는데, 농촌에서는 주로 <b>장날</b>을 이용했어. 학생·교사·상인·노동자는 물론 기생과 걸인까지 계층을 가리지 않고 참여했지.",
  why:"장날은 사람이 자연스럽게 모이는 날이라 발각될 위험이 적었어.",
  so:"'전 민족적'이라는 표현이 괜한 말이 아니야. 이게 3·1 운동의 가장 큰 특징이야."},
 {t:"fact",y:1919,n:"제암리 학살",b:"경기도 화성 제암리에서 일본군이 주민들을 교회에 모아 놓고 문을 잠근 채 총을 쏘고 불을 질렀어.",
  why:"시위를 공포로 꺾으려 한 보복이었어.",
  so:"이런 잔혹한 진압이 알려지면서 국제 여론이 크게 나빠졌어."},
 {t:"fact",y:1919,n:"무력 투쟁으로",b:"헌병 경찰의 무자비한 진압에 시위가 격해지면서, 일부 농민은 경찰 관서와 헌병대 같은 식민 통치 기관을 습격했어.",
  why:"평화적으로 외쳐도 총으로 답이 돌아왔으니까.",
  so:"'3·1 운동은 처음부터 끝까지 평화적이었다'는 문장은 <b>×</b>야. 뒤로 갈수록 무력 투쟁 양상으로 발전했어."},
 {t:"chain",title:"그날의 흐름",items:["민족 대표 — 태화관","학생·시민 — 탑골 공원","주요 도시로 확산","농촌은 장날에","제암리 학살 → 무력 투쟁으로 발전"]},
 {t:"pick",q:"3·1 운동의 전개에 대한 설명으로 옳은 것은?",c:["뒤로 갈수록 무력 투쟁 양상으로 발전했다","끝까지 평화적 만세 시위로만 진행됐다"],a:0,e:"무자비한 진압에 맞서 통치 기관을 습격하기도 했어."}
 ],

 {q:"농촌에서 만세 시위가 주로 열린 때는?",c:["장날","일요일","국장일","추석"],a:0,e:"사람이 자연스럽게 모이는 날이었어."},

{id:"L14",u:"s6",part:"1919년 봄",title:"그날이 바꾼 것",sc:"chain",
 hook:"3·1 운동은 곧바로 독립으로 이어지지 않았어. 그런데도 우리 근현대사에서 가장 중요한 사건으로 꼽혀. 왜일까?",
 cards:[
 {t:"story",h:"결과부터 보자",b:"3·1 운동이 남긴 건 세 가지야. ① 대한민국 임시 정부가 세워졌고 ② 일제가 문화 정치로 바꿨고 ③ 중국 5·4 운동 같은 다른 약소민족 운동에 영향을 줬어. 이 세 개가 시험에 나오는 전부라고 봐도 돼."},
 {t:"fact",y:1919,n:"임시 정부 수립의 계기",b:"운동을 겪으며 독립운동가들은 깨달았어. '전국이 동시에 일어났는데 이를 이끌 지도부가 없구나.'",
  why:"흩어진 힘을 하나로 묶을 구심점이 필요했어.",
  so:"이 인식에서 <b>대한민국 임시 정부</b>가 세워져. 3·1 운동의 가장 큰 결과야."},
 {t:"fact",y:1919,n:"통치 방식의 전환",b:"일제는 총칼로는 한국인의 독립 의지를 꺾을 수 없다는 걸 알게 됐어.",
  why:"전 민족이 일어났고 국제 여론도 나빠졌으니까.",
  so:"무단 통치를 접고 이른바 <b>문화 정치</b>로 바꿨어. 물론 속은 민족 분열 통치였지."},
 {t:"fact",y:1919,n:"민족 운동 주체의 확대",b:"학생·농민·노동자·여성이 모두 참여했어. 이화 학당 학생 <b>유관순</b>은 천안 아우내 장터에서 시위를 이끌다 붙잡혀 옥중에서 순국했지.",
  why:"모두가 당사자였으니까.",
  so:"이후 학생 운동, 농민·노동 운동, 여성 운동이 활발해지는 밑바탕이 됐어."},
 {t:"fact",y:1919,n:"세계사적 의의",b:"대표적인 반제국주의 민족 운동으로 꼽혀. 중국의 <b>5·4 운동</b> 등 다른 약소민족의 운동에 영향을 줬어.",
  why:"'무력한 한국'이라는 이미지를 '독립을 위해 저항하는 한국'으로 바꿔 놓았거든.",
  so:"우리 안에서만 의미 있는 사건이 아니라는 뜻이야."},
 {t:"chain",title:"3·1 운동이 낳은 것",items:["3·1 운동(1919)","① 대한민국 임시 정부 수립","② 일제, 문화 정치로 전환","③ 중국 5·4 운동 등에 영향","민족 운동 주체 확대 → 1920년대 대중 운동"]},
 {t:"hint",k:"임 · 문 · 5·4",b:"결과 셋만 외우면 돼. <em>임</em>시 정부 · <em>문</em>화 정치 · <em>5·4</em> 운동. 서술형에도 이 세 개를 쓰면 점수가 나와."},
 {t:"pick",q:"3·1 운동의 결과로 볼 수 없는 것은?",c:["6·10 만세 운동이 일어났다","대한민국 임시 정부가 수립됐다"],a:0,e:"6·10 만세 운동은 1926년, 순종의 장례일에 일어난 별개 사건이야."}
 ],
 quiz:[
 {q:"3·1 운동의 가장 큰 결과는?",c:["대한민국 임시 정부 수립","광복","신간회 창립","봉오동 전투 승리"],a:0,e:"운동을 이끌 구심점의 필요성에서 나왔어."},
 {q:"3·1 운동이 영향을 준 중국의 운동은?",c:["5·4 운동","의화단 운동","양무운동","신해혁명"],a:0,e:"대표적인 반제국주의 민족 운동으로 평가받아."},
 {q:"3·1 운동 이후 일제의 통치 방식은?",c:["문화 정치로 전환","무단 통치 강화","민족 말살 통치 시작","병참 기지화"],a:0,e:"총칼로는 안 된다는 걸 깨달았어."},
 {q:"천안 아우내 장터에서 만세 시위를 주도한 인물은?",c:["유관순","한이순","정정화","김마리아"],a:0,e:"이화 학당 학생으로 옥중에서 순국했어."}
 ]},

{id:"L15",u:"s7",part:"나라를 다시 세우다",title:"세 정부가 하나로",sc:"building2",
 hook:"3·1 운동 뒤 임시 정부가 세 곳에 생겼어. 하나로 합쳐야 힘이 되는데, 어디에 둘지가 문제였지. 그 선택의 이유가 시험 포인트야.",
 cards:[
 {t:"fact",y:1919,n:"세 곳의 임시 정부",b:"연해주에 <b>대한 국민 의회</b>, 상하이에 <b>대한민국 임시 정부</b>, 국내에서는 <b>한성 정부</b> 수립이 선포됐어.",
  why:"각지의 독립운동 세력이 저마다 정부를 세운 거야.",
  so:"곧바로 하나로 합치는 통합 운동이 시작됐어."},
 {t:"fact",y:1919,n:"왜 상하이였을까",b:"통합 과정에서 '한인이 많고 무장 투쟁에 유리한 간도나 연해주에 두자'는 주장이 나왔어. 하지만 결국 <b>상하이</b>로 정했지.",
  why:"상하이에는 서구 열강의 조계 지역이 많아 <b>외교 활동</b>에 유리했거든.",
  so:"초기 임시 정부가 외교에 힘을 쏟은 이유가 여기 있어. 그리고 이게 뒷날 갈등의 씨앗이 되기도 해."},
 {t:"check",q:"임시 정부를 상하이에 둔 이유는?",a:"외교 활동에 유리해서",hint:"조계 지역이 많았거든"},
 {t:"fact",y:1919,n:"통합의 방식",b:"<b>한성 정부의 법통</b>을 계승하고, 대한 국민 의회를 통합하는 형태로 정리됐어.",
  why:"국내에서 선포된 정부를 정통으로 삼아야 명분이 섰어.",
  so:"이렇게 해서 하나의 대한민국 임시 정부가 완성돼."},
 {t:"fact",y:1919,n:"민주 공화제 채택",b:"우리 역사상 <b>최초의 민주 공화제 정부</b>야. 삼권 분립에 따라 입법은 <b>임시 의정원</b>, 행정은 <b>국무원</b>, 사법은 <b>법원</b>을 두었지.",
  why:"대동단결 선언에서 다져 온 국민 주권론이 실제 제도가 된 거야.",
  so:"황제의 나라 대한 제국에서 국민의 나라 대한민국으로 넘어간 결정적 지점이야. 지금 헌법도 '3·1 운동으로 건립된 대한민국 임시 정부의 법통'을 잇는다고 적고 있어."},
 {t:"fact",y:1919,n:"초대 각료",b:"대한민국 임시 헌법을 공포하고 임시 대통령에 <b>이승만</b>, 국무총리에 <b>이동휘</b>를 뽑았어.",
  why:"이승만은 외교 노선, 이동휘는 무장 투쟁 노선을 대표했어.",
  so:"노선이 다른 두 사람이 함께 있었다는 게 뒷날 갈등으로 이어져."},
 {t:"chain",title:"통합의 과정",items:["대한 국민 의회 (연해주)","대한민국 임시 정부 (상하이)","한성 정부 (국내)","한성 정부의 법통 계승 + 대한 국민 의회 통합","상하이에 자리 — 외교에 유리해서","최초의 민주 공화제 · 삼권 분립"]},
 {t:"hint",k:"국(연해주) · 상(상하이) · 한(국내)",b:"세 정부의 앞 글자. 그리고 <em>한</em>성의 법통을 잇고 <em>상</em>하이에 앉았다고 기억해."},
 {t:"pick",q:"임시 정부가 계승한 법통은?",c:["한성 정부","대한 국민 의회"],a:0,e:"한성 정부의 법통을 계승하고 대한 국민 의회를 통합했어."}

{id:"L16",u:"s7",part:"나라를 다시 세우다",title:"돈과 소식을 나르다",sc:"route",
 hook:"나라 밖에 정부를 세웠는데, 국내 사람들과 어떻게 연락하고 어떻게 돈을 모았을까? 이름이 비슷한 조직 둘만 구분하면 돼.",
 cards:[
 {t:"fact",y:1919,n:"연통제",b:"국내에 몰래 설치한 <b>비밀 행정 조직</b>이야. 군자금을 모으고 정부의 문서와 명령을 전달했어.",
  why:"국외 정부가 국내를 다스리려면 행정 통로가 있어야 했어.",
  so:"행정이 핵심이야. 세금 걷고 명령 내리는 역할."},
 {t:"fact",y:1919,n:"교통국",b:"<b>통신 기관</b>이야. 정보를 모으고 분석하고 독립운동 자금을 모집했어. 특히 <b>이륭 양행</b>에 사무소를 둔 안동 교통국의 활약이 컸지.",
  why:"소식을 나르는 전용 조직이 필요했어.",
  so:"이륭 양행은 아일랜드계 영국인 조지 루이스 쇼가 운영하던 회사야. 아일랜드도 영국의 식민지였기에 한국 사정을 이해하고 도왔지."},
 {t:"compare",title:"이름이 헷갈리는 둘",l:{n:"연통제",p:["국내 <b>비밀 행정</b> 조직","군자금 조달","정부 문서 · 명령 전달"]},
  r:{n:"교통국",p:["<b>통신</b> 기관","정보 수집과 분석","<b>이륭 양행</b> 안동 교통국"]}},
 {t:"check",q:"이륭 양행에 사무소를 둔 조직은?",a:"교통국",hint:"소식을 나르는 쪽이야"},
 {t:"fact",y:1919,n:"독립 공채",b:"광복 후에 갚겠다고 약속하고 발행한 증서야. 국내는 물론 미주 동포에게도 팔았어.",
  why:"정부를 운영하려면 돈이 있어야 했으니까.",
  so:"들키면 큰 고초를 겪기에 불태우거나 가족조차 모르게 숨긴 경우가 많았어. 광복 후 1983년에야 상환이 시작됐는데 신청은 많지 않았대."},
 {t:"fact",y:1919,n:"구미 위원부",b:"<b>미국</b>에 설치해 대통령 이승만을 중심으로 외교 활동을 폈어.",
  why:"열강의 지지를 얻는 게 초기 임시 정부의 주요 전략이었어.",
  so:"'구미'는 유럽과 미국을 뜻해. 상하이가 아니라 미국에 있었다는 걸 꼭 기억해."},
 {t:"fact",y:1919,n:"독립신문과 사료집",b:"『독립신문』을 펴내 동포들에게 소식을 알렸고, 임시 사료 편찬회를 두어 『한일 관계 사료집』을 냈어.",
  why:"독립 의식을 높이고, 국제 사회에 한국 독립의 정당성을 알리려 했어.",
  so:"선전과 기록도 독립운동의 한 축이었어."},
 {t:"chain",title:"임시 정부를 굴린 네 가지",items:["연통제 — 국내 행정","교통국 — 통신 (이륭 양행)","독립 공채 — 자금","구미 위원부 — 외교 (미국)"]},
 {t:"hint",k:"연 · 교 · 공 · 구",b:"<em>연</em>통제(행정) · <em>교</em>통국(통신) · 독립 <em>공</em>채(자금) · <em>구</em>미 위원부(외교). 네 글자로 임시 정부 활동이 다 들어가."},
 {t:"pick",q:"구미 위원부가 설치된 곳은?",c:["미국","상하이"],a:0,e:"미국이야. 이승만을 중심으로 외교 활동을 벌였어."}
 ],
 quiz:[

 {q:"이륭 양행에 근거를 둔 조직은?",c:["교통국","연통제","구미 위원부","군무부"],a:0,e:"통신 기관인 교통국의 안동 지부야."},

 cards:[

 {t:"fact",y:1923,n:"국민 대표 회의",b:"각계 독립운동 지도자가 모여 새 방향을 찾으려 했어. 그런데 <b>개조파</b>와 <b>창조파</b>로 갈려 대립하다 결렬됐지.",
  why:"노선 차이가 이미 너무 깊었어. 외교냐 무장 투쟁이냐, 민족주의냐 사회주의냐.",
  so:"많은 독립운동가가 떠나면서 임시 정부는 침체에 빠져."},
 {t:"compare",title:"개조파 vs 창조파",l:{n:"개조파",p:["임시 정부는 <b>민족의 대표 기관</b>","3·1 운동의 열망으로 출범했으니 정통성 인정","조직과 체제를 <b>개선</b>하자","→ 고쳐 쓰자"]},
  r:{n:"창조파",p:["상하이 임정의 계통을 이을 <b>이유 없다</b>","실제 독립운동에 맞는 <b>새 조직</b> 필요","→ 새로 만들자","결과: 대립 끝에 <b>결렬</b>"]}},
 {t:"check",q:"임시 정부를 고쳐 쓰자고 한 쪽은?",a:"개조파",hint:"'개조'라는 말 자체가 고친다는 뜻이야"},
 {t:"fact",y:1925,n:"이승만 탄핵",b:"미주 지역 자금을 독점하고 대통령 직무를 다하지 않았다는 이유로 탄핵됐어. 위임 통치 청원 문제도 컸지. 후임 제2대 대통령은 <b>박은식</b>이야.",
  why:"지도부가 제 역할을 못 하니 정리가 필요했어.",
  so:"임시 정부가 스스로 지도자를 갈아치울 수 있는 조직이었다는 뜻이기도 해."},
 {t:"fact",y:1926,n:"국무령 중심 체제",b:"헌법을 고쳐 대통령제에서 <b>국무령 중심의 집단 지도 체제</b>로 바꿨어. <b>이동녕</b>과 <b>김구</b>를 중심으로 조직을 다시 세웠지.",
  why:"한 사람에게 힘이 몰리는 구조가 문제였으니까.",
  so:"이 체제 아래에서 김구가 뒷날 한인 애국단을 만들어 침체를 뚫어 내게 돼."},
 {t:"chain",title:"위기와 수습",items:["연통제·교통국 발각 · 외교 성과 부진","국민 대표 회의(1923) — 개조파 vs 창조파","결렬 → 침체","이승만 탄핵, 박은식 취임(1925)","국무령 중심 집단 지도 체제(1926)"]},
 {t:"hint",k:"국(23) · 탄(25) · 국무령(26)",b:"<em>국</em>민 대표 회의 1923 → 이승만 <em>탄</em>핵 1925 → <em>국무령</em> 체제 1926. 2년, 1년 간격이야."},
 {t:"pick",q:"국민 대표 회의의 결과는?",c:["개조파와 창조파의 대립으로 결렬","임시 정부가 해산됨"],a:0,e:"결렬 후 많은 이가 떠나 침체에 빠졌지만 정부는 유지됐어."}

{id:"L18",u:"s8",part:"총을 들다",title:"봉오동에서 청산리로",sc:"mountain",
 hook:"3·1 운동 뒤 '평화적으로는 안 되겠다'는 생각이 퍼졌어. 만주의 독립군이 일본 정규군과 정면으로 붙어 이긴 두 번의 싸움, 이건 반드시 구분해야 해.",
 cards:[
 {t:"story",h:"왜 만주였을까",b:"독립군은 국경 너머 만주와 연해주에 기지를 두고 수시로 압록강·두만강을 건너와 일본 군경을 공격했어. 위협을 느낀 일본군이 추격대를 편성해 두만강을 건너오면서 정면 대결이 벌어져."},
 {t:"fact",y:1920,n:"봉오동 전투",b:"<b>홍범도</b>의 대한 독립군, <b>안무</b>의 국민회군, <b>최진동</b>의 군무 도독부군이 연합했어. 일본군을 봉오동 골짜기로 유인한 뒤 미리 매복해 있다가 기습해 크게 이겼지. 1920년 6월이야.",
  why:"지형을 아는 쪽이 유리하다는 걸 알았거든.",
  so:"패배한 일제는 대규모 병력을 동원할 구실을 찾게 돼."},
 {t:"fact",y:1920,n:"훈춘 사건",b:"일제가 중국 마적을 매수해 훈춘의 일본 영사관을 공격하게 한 <b>자작극</b>이야.",
  why:"'우리 국민이 공격당했으니 군대를 보낸다'는 명분을 스스로 만든 거지.",
  so:"이 구실로 약 2만 명의 병력을 만주에 투입했어."},
 {t:"check",q:"일제가 만주 출병 구실을 만들려 꾸민 자작극은?",a:"훈춘 사건",hint:"중국 마적을 매수했어"},
 {t:"fact",y:1920,n:"청산리 대첩",b:"<b>김좌진</b>의 북로 군정서와 <b>홍범도</b>의 대한 독립군 등이 연합했어. <b>백운평</b> 전투를 시작으로 완루구·어랑촌·고동하 등 10여 차례를 싸워 일본군을 크게 격파했지. 1920년 10월이야.",
  why:"백두산 방향으로 이동하며 유리한 지점을 골라 반격했어.",
  so:"독립 전쟁사 최대의 승리야. 간도 한인들이 총알이 빗발치는 산으로 밥을 날라 준 덕도 컸어."},
 {t:"compare",title:"절대 헷갈리면 안 되는 둘",l:{n:"봉오동 전투 (1920. 6.)",p:["<b>홍범도</b>의 대한 독립군","+ 안무 국민회군, 최진동 군무 도독부군","골짜기로 <b>유인</b>해 매복 기습","→ 일제가 훈춘 사건 조작"]},
  r:{n:"청산리 대첩 (1920. 10.)",p:["<b>김좌진</b>의 북로 군정서 + 홍범도","<b>백운평</b>·어랑촌·고동하 등 10여 차례","독립 전쟁사 최대의 승리","→ 보복으로 간도 참변"]}},
 {t:"hint",k:"봉-홍 / 청-김",b:"<em>봉</em>오동은 <em>홍</em>범도, <em>청</em>산리는 <em>김</em>좌진. 둘 다 ㅇ·ㅎ / ㅊ·ㄱ 로 짝지어 외워. 홍범도는 둘 다 참여했다는 것도 기억해 두면 좋아."},
 {t:"pick",q:"청산리 대첩의 첫 전투는?",c:["백운평 전투","봉오동 전투"],a:0,e:"백운평을 시작으로 어랑촌·고동하 등 10여 차례를 싸웠어."}
 ],
 quiz:[
 {q:"봉오동 전투를 이끈 인물은?",c:["홍범도","김좌진","지청천","양세봉"],a:0,e:"안무·최진동 부대와 연합했어."},
 {q:"일제가 만주 출병 구실로 조작한 사건은?",c:["훈춘 사건","제암리 사건","자유시 참변","간도 참변"],a:0,e:"중국 마적을 매수한 자작극이야."},
 {q:"청산리 대첩의 주력 부대는?",c:["북로 군정서","대한 독립군","조선 혁명군","한국 독립군"],a:0,e:"김좌진이 이끌었고 중광단에서 발전한 부대야."},
 {q:"청산리 대첩에 포함되지 않는 전투는?",c:["봉오동 전투","백운평 전투","어랑촌 전투","고동하 전투"],a:0,e:"봉오동은 그 넉 달 전 별개의 전투야."}
 ]},

{id:"L19",u:"s8",part:"총을 들다",title:"두 번의 참변, 그리고 3부",sc:"snow",
 hook:"승리 뒤에 곧바로 비극이 왔어. 이름이 비슷한 두 참변, 가해자가 서로 달라. 이것만 구분하면 이 레슨은 끝이야.",
 cards:[
 {t:"fact",y:1920,n:"간도 참변",b:"일제가 독립군의 근거지를 없앤다는 구실로 서너 달에 걸쳐 간도의 한인 마을을 불태우고 수많은 한인을 학살했어.",
  why:"청산리 대첩에 대한 <b>보복</b>이었어.",
  so:"가해자는 <b>일본군</b>이야. 독립군을 도운 민간인을 겨냥한 학살이었지."},
 {t:"fact",y:1921,n:"자유시 참변",b:"간도의 독립군 4천여 명이 밀산에 모였다가 레닌의 지원을 기대하며 러시아 <b>자유시</b>로 옮겨 갔어. 그런데 부대를 통합하는 과정에서 지휘권을 둘러싼 분쟁이 일어났고, 지휘권 양도를 거부한 독립군을 러시아 <b>적군</b>이 무장 해제하면서 많은 이가 희생됐지.",
  why:"여러 부대가 모였는데 누가 지휘하느냐를 정하지 못했어.",
  so:"가해자는 <b>러시아 적군</b>이야. 원인은 <b>지휘권 분쟁</b>이고. 간도 참변과 바꿔 내는 문제가 정말 많아."},
 {t:"compare",title:"가해자가 다르다",l:{n:"간도 참변 (1920)",p:["가해자: <b>일본군</b>","구실: 독립군 근거지 제거","청산리 대첩에 대한 보복","한인 마을 방화 · 민간인 학살"]},
  r:{n:"자유시 참변 (1921)",p:["가해자: 러시아 <b>적군</b>","배경: 밀산 집결 → 자유시 이동","원인: <b>지휘권</b> 분쟁","무장 해제 과정에서 희생"]}},
 {t:"check",q:"자유시 참변의 가해자는?",a:"러시아 적군",hint:"일본군이 아니야. 그게 함정이지"},
 {t:"fact",y:1924,n:"3부의 성립",b:"두 참변으로 큰 타격을 입은 독립군이 전열을 가다듬고 부대를 통합했어. 남만주에 <b>참의부</b>, 지린성 일대에 <b>정의부</b>, 북만주에 <b>신민부</b>가 세워졌지.",
  why:"흩어져서는 버틸 수 없었으니까.",
  so:"신민부는 자유시에서 돌아온 독립군이 중심이 됐어."},
 {t:"fact",y:1925,n:"3부의 성격",b:"민정 조직과 군정 조직을 함께 갖췄어. 관할 구역 한인들에게 세금을 걷어 운영한 사실상의 <b>공화주의 자치 정부</b>였지.",
  why:"동포 사회를 지키면서 군대도 길러야 했으니까.",
  so:"단순한 부대가 아니라 '정부'였다는 게 핵심이야."},
 {t:"fact",y:1925,n:"미쓰야 협정",b:"조선 총독부 경무 국장 미쓰야가 만주 <b>군벌</b>과 맺은 협정이야. 한국인 독립운동가를 체포해 일본 경찰에 넘기도록 했지.",
  why:"일본군이 직접 못 잡으니 중국 쪽 손을 빌린 거야.",
  so:"중국 관헌이 독립운동가를 잡아 넘기고 포상금을 받으면서 만주 독립운동이 크게 위축됐어."},
 {t:"fact",y:1929,n:"3부 통합 운동",b:"위기를 넘으려 3부를 합치려 했지만 방법을 두고 의견이 갈려 완전한 통합에는 이르지 못했어. 남만주의 <b>국민부</b>와 북만주의 <b>혁신 의회</b>로 재편됐지.",
  why:"미쓰야 협정으로 활동이 막히자 뭉쳐야 했어.",
  so:"국민부는 조선 혁명당을 만들고 그 아래 <b>조선 혁명군</b>을, 혁신 의회는 해체된 뒤 한국 독립당으로 이어져 <b>한국 독립군</b>을 편성해."},
 {t:"hint",k:"참(남) · 정(지린) · 신(북)",b:"<em>참</em>의부 남만주, <em>정</em>의부 지린, <em>신</em>민부 북만주. 그리고 통합은 <em>국민부</em>(남)와 <em>혁신 의회</em>(북) 둘로 갈렸다고 기억해."},
 {t:"pick",q:"간도 참변의 가해자는?",c:["일본군","러시아 적군"],a:0,e:"간도는 일본군, 자유시는 러시아 적군이야."}
 ],

var KEY="hansa-learn-v1";

function today(){var d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);}
var S;
function load(){
  try{var r=localStorage.getItem(KEY);
    S=r?JSON.parse(r):null;}catch(e){S=null;}
  if(!S)S={done:{},pos:{},quiz:{},wrong:{},streak:0,last:0,theme:""};
  ["done","pos","quiz","wrong"].forEach(function(k){if(!S[k])S[k]={};});
  if(S.last&&S.last<today()-1)S.streak=0;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function markDay(){var t=today();if(S.last!==t){S.streak=(S.last===t-1)?S.streak+1:1;S.last=t;save();}}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function doneCount(){return LESSONS.filter(function(l){return S.done[l.id];}).length;}
function nextLesson(){
  for(var i=0;i<LESSONS.length;i++)if(!S.done[LESSONS[i].id])return LESSONS[i];
  return null;
}

/* ── 화면 ── */
var view=document.getElementById("view"),titleEl=document.getElementById("title"),
    backEl=document.getElementById("back");
var stack=[],VIEWS={};
function go(n,a,rep){
  if(rep)stack[stack.length-1]={n:n,a:a};
  else{stack.push({n:n,a:a});try{history.pushState({i:stack.length},"");}catch(e){}}
  render();
}
function back(){if(stack.length>1){stack.pop();render();}}
window.addEventListener("popstate",function(){
  if(stack.length>1){stack.pop();render();}
  else{try{history.pushState({i:1},"");}catch(e){}}
});
function render(){
  var s=stack[stack.length-1];
  backEl.style.display=stack.length>1?"":"none";
  window.scrollTo(0,0);
  VIEWS[s.n](s.a);
}
backEl.onclick=back;

  titleEl.textContent="한국사 첫 수업";
  var d=doneCount(),tot=LESSONS.length,pct=Math.round(d/tot*100);
  var nx=nextLesson();
  var C=2*Math.PI*24;
  var wc=wCount();
  var html=
   '<div class="hero">'+
     '<div class="plant">'+plant(d,110)+'</div>'+
     '<h1>'+(d===0?"모르는 게 당연해.<br>여기서부터 같이 보자."
                  :(nx?"이어서 하자.<br>"+esc(nx.title):"스무 수업을 모두 마쳤어."))+'</h1>'+
     '<p>'+(d===0?"교과서 Ⅰ단원을 스무 번에 나눠 담았어. 한 번에 10분이면 충분해."
                 :"지금까지 "+d+"개 수업을 끝냈어. 남은 건 "+(tot-d)+"개야.")+'</p>'+
     '<div class="prog"><div class="ring">'+
       '<svg width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="28" r="24" fill="none" stroke="var(--bg2)" stroke-width="6"/>'+
       '<circle cx="28" cy="28" r="24" fill="none" stroke="var(--jade)" stroke-width="6" stroke-linecap="round" '+
       'stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-d/tot)).toFixed(1)+'"/></svg>'+
       '<span>'+pct+'%</span></div>'+
       '<div class="pt"><b>'+d+' / '+tot+' 수업</b><small>'+
       (S.streak>0?"🌱 "+S.streak+"일 연속 공부 중":"오늘 첫 수업을 시작해 보자")+'</small></div></div>'+
     (nx?'<button class="cta" id="goNext">'+IC.play+' '+(d===0?"첫 수업 시작하기":"이어서 하기")+'</button>'
        :'<button class="cta ghost" id="goRev">'+IC.book+' 암기 장치 다시 훑기</button>')+
   '</div>';
  if(wc)html+='<button class="wbar" id="goWrong"><span class="n">'+wc+'</span>'+
    '<span class="tx"><b>다시 볼 문제 '+wc+'개</b><small>틀린 문제만 모아 뒀어. 맞히면 사라져.</small></span>'+
    '<span class="ch">'+IC.chev+'</span></button>';
  var rc=peekCard();
  if(rc)html+='<div class="peek"><div class="pt">'+
    '<span class="lb">30초 복습 · '+esc(rc.l.title)+'</span>'+
    '<button class="re" id="peekRe" aria-label="다른 카드">↻</button></div>'+
    '<div class="pb">'+rc.html+'</div></div>';
  UNITS.forEach(function(u){
    var ls=LESSONS.filter(function(l){return l.u===u.id;});
    if(!ls.length)return;
    html+='<div class="part">'+esc(u.n)+'</div>';
    ls.forEach(function(l){
      var dn=!!S.done[l.id],pos=S.pos[l.id]||0;
      var total=l.cards.length+l.quiz.length;
      html+='<button class="lsn'+(dn?" done":"")+'" data-l="'+l.id+'">'+
        '<span class="sc">'+scene(l.sc,30)+'</span>'+
        '<span class="tx"><b>'+esc(l.title)+'</b><small>'+esc(l.part)+
          (!dn&&pos>0?' · 이어서 '+Math.round(pos/total*100)+'%':'')+'</small></span>'+
        '<span class="rt">'+(dn?'<span class="chk">'+IC.check+'</span>':IC.chev)+'</span></button>';
    });
  });
  html+='<div class="part">복습</div>'+
    '<button class="cta ghost" id="goRev2">'+IC.book+' 암기 장치와 인과 사슬 모아 보기</button>'+
    '<p class="note" style="margin-top:14px">배운 내용을 문제로 확인하고 싶으면 「오답 몬스터」로 넘어가면 돼. 여긴 처음 배우는 곳이야.</p>';
  view.innerHTML=html;
  var gn=document.getElementById("goNext");
  if(gn)gn.onclick=function(){go("lesson",{id:nx.id});};
  var gw=document.getElementById("goWrong");
  if(gw)gw.onclick=function(){go("wrong");};
  var pr=document.getElementById("peekRe");
  if(pr)pr.onclick=function(e){e.stopPropagation();vHome();};
  ["goRev","goRev2"].forEach(function(i){var e=document.getElementById(i);if(e)e.onclick=function(){go("review");};});
  Array.prototype.forEach.call(view.querySelectorAll(".lsn"),function(b){
    b.onclick=function(){go("lesson",{id:b.dataset.l});};
  });
}

/* 마친 수업에서 한 장 뽑아 홈에 띄운다 */
function peekCard(){
  var pool=[];
  LESSONS.forEach(function(l){
    if(!S.done[l.id])return;
    l.cards.forEach(function(c){
      if(c.t==="hint")pool.push({l:l,html:'<b class="k">'+esc(c.k)+'</b><span>'+c.b+'</span>'});
      if(c.t==="fact")pool.push({l:l,html:'<b class="k" style="color:var(--ink)">'+c.y+' · '+esc(c.n)+'</b><span>'+c.so+'</span>'});
      if(c.t==="chain")pool.push({l:l,html:'<b class="k" style="font-size:16px">'+esc(c.title)+'</b><span>'+
        c.items.map(function(x){return x.replace(/<[^>]+>/g,"");}).join(" → ")+'</span>'});
    });
  });
  if(!pool.length)return null;
  return pool[Math.floor(Math.random()*pool.length)];
}

/* ── 오답 노트 ── */
function wkey(lid,kind,idx){return lid+"#"+kind+idx;}
function wAdd(lid,kind,idx,chose){
  var k=wkey(lid,kind,idx),w=S.wrong[k];
  if(w){w.miss++;w.at=Date.now();w.chose=chose;}
  else S.wrong[k]={lid:lid,kind:kind,idx:idx,miss:1,at:Date.now(),chose:chose};
  save();
}
function wClear(lid,kind,idx){ delete S.wrong[wkey(lid,kind,idx)]; save(); }
function wCount(){return Object.keys(S.wrong).length;}
/* 오답 항목을 실제 문제로 되살린다 */
function wItem(w){
  var l=LMAP[w.lid]; if(!l)return null;
  if(w.kind==="q"){ var q=l.quiz[w.idx]; if(!q)return null;
    return {lid:w.lid,kind:"q",idx:w.idx,lesson:l,q:q.q,c:q.c,a:q.a,e:q.e,miss:w.miss,chose:w.chose}; }
  var c=l.cards[w.idx]; if(!c||c.t!=="pick")return null;
  return {lid:w.lid,kind:"p",idx:w.idx,lesson:l,q:c.q,c:c.c,a:c.a,e:c.e,miss:w.miss,chose:w.chose};
}
function wList(){
  return Object.keys(S.wrong).map(function(k){return wItem(S.wrong[k]);})
    .filter(Boolean).sort(function(a,b){return LESSONS.indexOf(a.lesson)-LESSONS.indexOf(b.lesson)||a.idx-b.idx;});
}

/* ── 레슨 ── */
var L=null;
function vLesson(a){
  var l=LMAP[a.id];
  if(!L||L.id!==a.id){
    L={id:a.id,l:l,i:(S.done[l.id]?0:(S.pos[l.id]||0)),phase:"card",qi:0,qok:0,qlog:[],revealed:false,answered:false};
    if(L.i>=l.cards.length)L.i=0;
  }
  titleEl.textContent=l.title;
  if(L.phase==="quiz")return paintQuiz();
  if(L.phase==="end")return paintEnd();
  paintCard();
}
function hud(){
  var l=L.l,tot=l.cards.length+l.quiz.length;
  var cur=L.phase==="card"?L.i:l.cards.length+L.qi;
  return '<div style="display:flex;align-items:center;gap:12px;padding:2px 0 16px">'+
    '<span class="track"><i style="width:'+(cur/tot*100)+'%"></i></span>'+
    '<span class="step">'+(cur+1)+' / '+tot+'</span></div>';
}
function nextBtn(label,fn){
  var h='<div class="sticky"><button class="cta" id="nx">'+label+'</button></div>';
  setTimeout(function(){var b=document.getElementById("nx");if(b)b.onclick=fn;},0);
  return h;
}
function advance(){
  L.i++; L.revealed=false; L.answered=false;
  S.pos[L.id]=L.i; save();
  if(L.i>=L.l.cards.length){L.phase="quiz";L.qi=0;L.qok=0;L.qlog=[];}
  vLesson({id:L.id});
}

function paintCard(){
  var l=L.l,c=l.cards[L.i],h=hud();
  if(L.i===0)h+='<div class="card"><div class="scene">'+scene(l.sc,72)+'</div>'+
    '<div class="eyebrow">'+esc(l.part)+' · '+(LESSONS.indexOf(l)+1)+'번째 수업</div>'+
    '<div class="h">'+esc(l.title)+'</div><div class="bd">'+esc(l.hook)+'</div></div>';

  if(c.t==="story")
    h+='<div class="card"><div class="eyebrow">이야기</div><div class="h sm">'+esc(c.h)+'</div>'+
       '<div class="bd">'+c.b+'</div></div>';

  if(c.t==="fact")
    h+='<div class="card"><span class="yr">'+c.y+'</span>'+
       '<div class="h">'+esc(c.n)+'</div><div class="bd">'+c.b+'</div>'+
       '<div class="wsblock">'+
         '<div class="ws why"><span class="lb">왜?</span><p>'+c.why+'</p></div>'+
         '<div class="ws so"><span class="lb">그래서</span><p>'+c.so+'</p></div>'+
       '</div></div>';

  if(c.t==="chain"){
    h+='<div class="card"><div class="eyebrow">인과 사슬</div><div class="h sm">'+esc(c.title)+'</div>'+
       '<div class="chain">'+c.items.map(function(x,i){
         return '<div class="cl" style="animation-delay:'+(i*130)+'ms"><span class="dot"></span><p>'+x+'</p></div>';
       }).join("")+'</div></div>';
  }

  if(c.t==="hint")
    h+='<div class="card hintcard"><div class="eyebrow">이렇게 외우자</div>'+
       '<div class="k">'+esc(c.k)+'</div><div class="bd">'+c.b+'</div></div>';

  if(c.t==="compare")
    h+='<div class="card"><div class="eyebrow">헷갈리지 않게</div><div class="h sm">'+esc(c.title)+'</div>'+
       '<div class="cmp"><div class="a"><h4>'+c.l.n+'</h4><ul>'+c.l.p.map(function(x){return "<li>"+x+"</li>";}).join("")+'</ul></div>'+
       '<div class="b"><h4>'+c.r.n+'</h4><ul>'+c.r.p.map(function(x){return "<li>"+x+"</li>";}).join("")+'</ul></div></div></div>';

  if(c.t==="check"){
    h+='<div class="card"><div class="eyebrow">잠깐, 스스로 떠올려 보자</div><div class="recall">'+
       '<div class="q">'+esc(c.q)+'</div>'+
       (L.revealed?'<div class="ans">'+esc(c.a)+'</div>'
                  :'<div class="ans blur">'+esc(c.a)+'</div>')+
       '<div class="tip">'+(L.revealed?"맞혔으면 그대로, 틀렸으면 한 번 더 소리 내어 읽어 보자":esc(c.hint||"머릿속으로 답해 본 다음 눌러 봐"))+'</div>'+
       '</div></div>';
    if(!L.revealed){
      h+=nextBtn("답 확인",function(){L.revealed=true;buzz(12);vLesson({id:L.id});});
      view.innerHTML=h;return;
    }
  }

  if(c.t==="pick"){
    h+='<div class="card"><div class="eyebrow">골라 보자</div><div class="h sm">'+esc(c.q)+'</div>'+
       '<div class="two" id="two">'+c.c.map(function(x,i){
         return '<button class="tw" data-i="'+i+'">'+esc(x)+'</button>';}).join("")+'</div>'+
       '<div id="fb"></div></div>';
    view.innerHTML=h;
    Array.prototype.forEach.call(view.querySelectorAll("#two .tw"),function(b){
      b.onclick=function(){
        if(L.answered)return; L.answered=true;
        var ok=+b.dataset.i===c.a;
        Array.prototype.forEach.call(view.querySelectorAll("#two .tw"),function(x,i){
          x.disabled=true; if(i===c.a)x.classList.add("ok"); else if(x===b)x.classList.add("no");
        });
        buzz(ok?14:[20,40,20]); markDay();
        if(ok)wClear(L.id,"p",L.i); else wAdd(L.id,"p",L.i,+b.dataset.i);
        document.getElementById("fb").innerHTML=
          '<div class="fb '+(ok?"ok":"no")+'"><span class="m">'+(ok?"맞아":"아냐")+'</span><span>'+c.e+'</span></div>';
        view.insertAdjacentHTML("beforeend",nextBtn("다음",advance));
      };
    });
    return;
  }

  h+=nextBtn(L.i===L.l.cards.length-1?"마무리 퀴즈 풀기":"다음",advance);
  view.innerHTML=h;
}

/* ── 마무리 퀴즈 ── */
function paintQuiz(){
  var l=L.l,q=l.quiz[L.qi];
  var h=hud()+'<div class="card"><div class="eyebrow">마무리 퀴즈 '+(L.qi+1)+' / '+l.quiz.length+'</div>'+
    '<div class="h sm">'+esc(q.q)+'</div></div>'+
    '<div style="margin-top:12px" id="opts">'+q.c.map(function(x,i){
      return '<button class="qopt" data-i="'+i+'"><span class="kx">'+"ABCD".charAt(i)+'</span><span>'+esc(x)+'</span></button>';
    }).join("")+'</div><div id="fb"></div><div class="grow"></div>';
  view.innerHTML=h;
  Array.prototype.forEach.call(view.querySelectorAll("#opts .qopt"),function(b){
    b.onclick=function(){
      if(L.answered)return; L.answered=true;
      var ok=+b.dataset.i===q.a;
      Array.prototype.forEach.call(view.querySelectorAll("#opts .qopt"),function(x,i){
        x.disabled=true;
        if(i===q.a)x.classList.add("ok"); else if(x===b)x.classList.add("no"); else x.classList.add("dim");
      });
      if(ok){
        L.qok++; L.combo=(L.combo||0)+1;
        if(L.combo>=3&&L.combo%3===0)pop(L.combo+"연속!"); else pop("좋아!");
        wClear(L.id,"q",L.qi);
      }else{
        L.combo=0; wAdd(L.id,"q",L.qi,+b.dataset.i);
      }
      L.qlog.push({q:q,ok:ok});
      buzz(ok?14:[20,40,20]); markDay();
      document.getElementById("fb").innerHTML=
        '<div class="fb '+(ok?"ok":"no")+'"><span class="m">'+(ok?"○":"×")+'</span><span>'+esc(q.e)+'</span></div>';
      view.insertAdjacentHTML("beforeend",nextBtn(
        L.qi+1>=l.quiz.length?"수업 마치기":"다음 문제",function(){
          L.qi++; L.answered=false;
          if(L.qi>=l.quiz.length){L.phase="end";finishLesson();}
          vLesson({id:L.id});
        }));
    };
  });
}
function finishLesson(){
  S.done[L.id]=Date.now();
  S.quiz[L.id]={n:L.l.quiz.length,ok:L.qok};
  S.pos[L.id]=0; markDay(); save();
}

/* ── 수업 마무리 ── */
function paintEnd(){
  var l=L.l,rate=Math.round(L.qok/l.quiz.length*100);
  var facts=l.cards.filter(function(c){return c.t==="fact";});
  var hint=l.cards.filter(function(c){return c.t==="hint";})[0];
  var idx=LESSONS.indexOf(l),nx=LESSONS[idx+1];
  titleEl.textContent="수업 끝";
  var wrong=L.qlog.filter(function(x){return !x.ok;});
  view.innerHTML=
    '<div class="done-hero"><div class="stamp show">'+stampSVG(76)+'</div>'+
      '<div class="big">'+L.qok+' / '+l.quiz.length+'</div>'+
      '<div class="sub">'+(rate===100?"완벽해. 이 수업은 확실히 잡았어."
        :rate>=75?"잘했어. 틀린 것만 한 번 더 보고 가자."
        :"괜찮아. 처음 보는 내용이잖아. 아래 정리만 다시 읽고 가자.")+'</div></div>'+
    '<div class="part">오늘 배운 것</div>'+
    '<div class="sumlist">'+facts.map(function(c,i){
      return '<div class="sum"><span class="n">'+(i+1)+'</span><span><b style="font-family:var(--f-d)">'+
        esc(c.n)+'</b> · '+c.y+'년<br><span style="color:var(--tx2);font-size:14px">'+
        c.so.replace(/<[^>]+>/g,"")+'</span></span></div>';
    }).join("")+'</div>'+
    (hint?'<div class="part">외울 때 이걸 떠올려</div><div class="rv"><div class="k">'+esc(hint.k)+'</div>'+
      '<div class="b">'+hint.b+'</div></div>':'')+
    (wrong.length?'<div class="part">틀린 문제 · 오답 노트에 담았어</div>'+wrong.map(function(x){
      return '<div class="rv"><div class="t">다시 보기</div><div class="b" style="margin-top:6px">'+
        esc(x.q.q)+'<br><b style="color:var(--jade)">→ '+esc(x.q.c[x.q.a])+'</b></div></div>';
    }).join(""):'')+
    '<div class="sticky"><div class="row">'+
      '<button class="cta ghost" id="hm">목록으로</button>'+
      (nx?'<button class="cta" id="nx2">다음 수업</button>':'<button class="cta" id="rv3">다시 훑기</button>')+
    '</div></div>';
  document.getElementById("hm").onclick=function(){L=null;stack=[{n:"home"}];render();};
  var n2=document.getElementById("nx2");
  if(n2)n2.onclick=function(){L=null;go("lesson",{id:nx.id},true);};
  var r3=document.getElementById("rv3");
  if(r3)r3.onclick=function(){L=null;go("review",null,true);};
}

/* ── 다시 훑기 ── */
function vReview(){
  titleEl.textContent="다시 훑기";
  var done=LESSONS.filter(function(l){return S.done[l.id];});
  if(!done.length){
    view.innerHTML='<div class="empty">'+scene("book",64)+'<p>아직 마친 수업이 없어.<br>수업을 하나라도 끝내면 그때 배운 암기 장치와 인과 사슬이 여기 모여.</p></div>';
    return;
  }
  var html='<p class="note" style="margin-bottom:16px">마친 수업 '+done.length+'개에서 뽑은 암기 장치와 인과 사슬이야. 시험 며칠 전에 이것만 훑어도 큰 도움이 돼.</p>';
  UNITS.forEach(function(u){
    var ls=done.filter(function(l){return l.u===u.id;});
    if(!ls.length)return;
    html+='<div class="part">'+esc(u.n)+'</div>';
    ls.forEach(function(l){
      l.cards.forEach(function(c){
        if(c.t==="hint")
          html+='<div class="rv"><div class="t">'+esc(l.title)+'</div><div class="k">'+esc(c.k)+'</div><div class="b">'+c.b+'</div></div>';
        if(c.t==="chain")
          html+='<div class="rv"><div class="t">'+esc(l.title)+'</div>'+
            '<div class="k" style="font-size:16px;color:var(--jade)">'+esc(c.title)+'</div>'+
            '<div class="b">'+c.items.map(function(x){return x.replace(/<[^>]+>/g,"");}).join(" → ")+'</div></div>';
      });
    });
  });
  view.innerHTML=html;
}

/* ── 오답 노트 화면 ── */
function vWrong(){
  titleEl.textContent="오답 노트";
  var list=wList();
  if(!list.length){
    view.innerHTML='<div class="empty">'+scene("paper",64)+
      '<p>틀린 문제가 없어.<br>수업을 풀다 틀리면 여기 자동으로 모여서,<br>맞힐 때까지 다시 물어봐 줄게.</p></div>';
    return;
  }
  var byL={};list.forEach(function(x){(byL[x.lid]=byL[x.lid]||[]).push(x);});
  var html='<div class="wsum"><div class="wn">'+list.length+'</div>'+
    '<div class="wt"><b>다시 볼 문제가 '+list.length+'개 있어</b>'+
    '<small>맞히면 사라져. 두 번 이상 틀린 건 빨간 점으로 표시했어.</small></div></div>'+
    '<button class="cta" id="wgo" style="margin-bottom:6px">'+IC.play+' 오답만 다시 풀기</button>';
  LESSONS.forEach(function(l){
    var g=byL[l.id]; if(!g)return;
    html+='<div class="part">'+esc(l.title)+'</div>';
    g.forEach(function(x){
      html+='<div class="wcard'+(x.miss>1?" hot":"")+'">'+
        '<div class="wq">'+esc(x.q)+(x.miss>1?'<span class="dots" title="'+x.miss+'번 틀림">'+
          new Array(Math.min(x.miss,4)).join('<i></i>')+'<i></i></span>':'')+'</div>'+
        (x.chose!=null&&x.c[x.chose]!==undefined&&x.chose!==x.a
          ? '<div class="wline no">내 답 · '+esc(x.c[x.chose])+'</div>':'')+
        '<div class="wline ok">정답 · '+esc(x.c[x.a])+'</div>'+
        '<div class="wex">'+esc(x.e)+'</div></div>';
    });
  });
  view.innerHTML=html;
  document.getElementById("wgo").onclick=function(){go("wquiz");};
}

/* ── 오답 다시 풀기 ── */
var W=null;
function vWQuiz(){
  if(!W){var q=wList();shuffleArr(q);W={q:q,i:0,ok:0,answered:false,start:q.length};}
  titleEl.textContent="오답 다시 풀기";
  if(!W.q.length||W.i>=W.q.length){
    var cleared=W.start-wCount();
    view.innerHTML='<div class="done-hero">'+
      (wCount()===0?'<div class="stamp show">'+stampSVG(72)+'</div>':'<div class="scene">'+scene("paper",64)+'</div>')+
      '<div class="big">'+W.ok+' / '+W.start+'</div>'+
      '<div class="sub">'+(wCount()===0?"오답 노트를 다 비웠어. 대단한데?"
        :cleared>0?cleared+"개를 지웠어. "+wCount()+"개 남았어."
        :"아직 "+wCount()+"개 남았어. 해설을 한 번 더 읽고 오자.")+'</div></div>'+
      '<div class="sticky"><div class="row">'+
        '<button class="cta ghost" id="hm">홈으로</button>'+
        (wCount()?'<button class="cta" id="ag">한 번 더</button>':'<button class="cta" id="hm2">홈으로</button>')+
      '</div></div>';
    var home=function(){W=null;stack=[{n:"home"}];render();};
    document.getElementById("hm").onclick=home;
    var h2=document.getElementById("hm2"); if(h2)h2.onclick=home;
    var ag=document.getElementById("ag"); if(ag)ag.onclick=function(){W=null;go("wquiz",null,true);};
    return;
  }
  var x=W.q[W.i];
  view.innerHTML=
    '<div style="display:flex;align-items:center;gap:12px;padding:2px 0 16px">'+
      '<span class="track"><i style="width:'+(W.i/W.q.length*100)+'%"></i></span>'+
      '<span class="step">'+(W.i+1)+' / '+W.q.length+'</span></div>'+
    '<div class="card"><div class="eyebrow">'+esc(x.lesson.title)+
      (x.miss>1?' · '+x.miss+'번 틀림':'')+'</div>'+
      '<div class="h sm">'+esc(x.q)+'</div></div>'+
    '<div style="margin-top:12px" id="opts">'+x.c.map(function(c,i){
      return '<button class="qopt" data-i="'+i+'"><span class="kx">'+"ABCD".charAt(i)+'</span><span>'+esc(c)+'</span></button>';
    }).join("")+'</div><div id="fb"></div><div class="grow"></div>';
  W.answered=false;
  Array.prototype.forEach.call(view.querySelectorAll("#opts .qopt"),function(b){
    b.onclick=function(){
      if(W.answered)return; W.answered=true;
      var ok=+b.dataset.i===x.a;
      Array.prototype.forEach.call(view.querySelectorAll("#opts .qopt"),function(e,i){
        e.disabled=true;
        if(i===x.a)e.classList.add("ok"); else if(e===b)e.classList.add("no"); else e.classList.add("dim");
      });
      if(ok){W.ok++;wClear(x.lid,x.kind,x.idx);pop("지웠다!");}
      else wAdd(x.lid,x.kind,x.idx,+b.dataset.i);
      buzz(ok?14:[20,40,20]); markDay();
      document.getElementById("fb").innerHTML=
        '<div class="fb '+(ok?"ok":"no")+'"><span class="m">'+(ok?"○":"×")+'</span><span>'+esc(x.e)+'</span></div>';
      view.insertAdjacentHTML("beforeend",nextBtn(W.i+1>=W.q.length?"결과 보기":"다음",function(){
        W.i++; vWQuiz();
      }));
    };
  });
}
function shuffleArr(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function pop(t){
  var e=document.createElement("div");e.className="pop";e.textContent=t;
  document.body.appendChild(e);setTimeout(function(){e.remove();},920);
}

VIEWS={home:vHome,lesson:vLesson,review:vReview,wrong:vWrong,wquiz:vWQuiz};
load();
if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);
document.getElementById("theme").onclick=function(){
  var cur=document.documentElement.getAttribute("data-theme");
  var dark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  S.theme=dark?"light":"dark";
  document.documentElement.setAttribute("data-theme",S.theme);save();
};
stack=[{n:"home"}];
try{history.replaceState({i:1},"");}catch(e){}
render();

</script>
