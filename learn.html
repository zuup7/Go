{id:"L28",u:"s15",part:"달라진 세상",title:"저울처럼 평등하게",sc:"scale",
 hook:"나라를 잃은 설움에 더해, 여성이라서, 아이라서, 백정 출신이라서 받는 차별이 있었어. 1920년대에는 이 차별을 없애자는 운동이 한꺼번에 일어나. 여성 운동, 소년 운동, 형평 운동이야.",
 cards:[
 {t:"story",h:"이중의 차별",b:"여성은 취학률이 낮고 임금은 남성의 절반 수준이었어. 어린이는 독립된 인격체가 아니라 어른에게 딸린 존재로 여겨졌지. 백정은 갑오개혁으로 신분제가 없어진 뒤에도 호적에 표시가 남아 학교 입학이나 취업에서 차별을 받았어."},
 {t:"fact",y:1923,n:"조선 형평사",b:"백정들이 뜻을 같이하는 사람들과 <b>진주</b>에서 창립했어. '형평(衡平)'은 <b>저울처럼 평등</b>하다는 뜻이야.",
  why:"일제가 호적에 직업을 '도한'으로 적거나 붉은 점을 찍어 백정 신분이 드러나게 했어.",
  so:"전국으로 조직을 넓혔고, 다른 사회 운동 단체와 연대해 항일 민족 운동도 벌였어."},
 {t:"fact",y:1923,n:"어린이날 제정",b:"천도교는 '어린아이를 때리지 말라, 한울님을 때리는 것'이라는 최시형의 뜻을 이어 소년 운동을 펼쳤어. <b>방정환</b>은 '어린이'라는 말을 널리 알리고 천도교 소년회를 이끌며 어린이날 제정에 앞장섰지.",
  why:"아이들을 온전한 인격체로 존중해야 한다고 봤어.",
  so:"잡지 『<b>어린이</b>』도 펴냈어."},
 {t:"fact",y:1927,n:"근우회",b:"<b>신간회</b> 결성을 계기로 민족주의 계열과 사회주의 계열의 여성 단체가 통합해 만들었어. '조선 여자의 공고한 단결', '조선 여자의 지위 향상'이 강령이야.",
  why:"신간회처럼 여성 운동도 좌우가 힘을 합쳐야 한다고 봤어.",
  so:"기관지 『근우』를 펴내고 강연회·야학으로 여성 계몽에 힘썼어. 행동 강령엔 조혼 폐지, 임금 차별 철폐가 들어 있었지."},
 {t:"fact",y:1927,n:"조선 소년 연합회",b:"소년 운동이 퍼지면서 만들어진 <b>전국</b> 조직이야.",
  why:"흩어진 소년 단체를 하나로 묶으려 했어.",
  so:"일제는 1930년대에 소년 운동을 민족 운동으로 보고 탄압했고, 중일 전쟁 뒤엔 어린이날 행사까지 모두 금지했어."},
 {t:"check",q:"근우회는 어떤 단체의 자매 단체라고 불릴까?",a:"신간회",hint:"같은 1927년, 같은 좌우 합작"},
 {t:"chain",title:"세 갈래 대중 운동",items:["<b>여성 운동</b> — 신여성 등장 → 근우회(1927)","<b>소년 운동</b> — 천도교 소년회, 방정환 → 어린이날 · 『어린이』","<b>형평 운동</b> — 백정 차별 → 조선 형평사(1923, 진주)"]},
 {t:"hint",k:"여 근 · 소 방 · 형 진",b:"<em>여</em>성은 <em>근</em>우회, <em>소</em>년은 <em>방</em>정환, <em>형</em>평은 <em>진</em>주. 세 글자씩 짝지어 외우자."},
 {t:"pick",q:"조선 형평사가 창립된 곳은?",c:["진주","평양"],a:0,e:"1923년 진주야. 평양은 물산 장려 운동이 시작된 곳."},
 {t:"hint",pr:14,po:1,k:"근우회 = 여성계의 민족 유일당",b:"프린트는 근우회를 '<em>신간회의 자매단체</em>(여성계 민족 유일당)'로 정리했어. 활동은 기관지 『근우』, <em>국내외 지회</em>, 강연회 · <em>부인 강좌</em> · 야학. 목표는 여성 계몽과 지위 · 권리 향상."},
 {t:"check",pr:14,q:"여성 운동이 일어난 배경 — 여성은 어떤 차별을 받았을까?",a:"가부장적 인습이 남았고 일제가 차별을 법으로 규정했어. 취학률이 낮고 임금은 남성의 절반 수준, 재산 상속과 친권 행사에서도 차별받았어.",hint:"집안, 법, 학교, 일터"}
 ],
 quiz:[
 {q:"형평 운동이 없애려 한 차별은?",c:["백정에 대한 차별","여성에 대한 차별","어린이에 대한 차별","노동자에 대한 차별"],a:0,e:"형평 = 저울처럼 평등."},
 {q:"근우회에 대한 설명으로 옳은 것은?",c:["민족주의·사회주의 계열 여성 단체가 통합해 만들었다.","방정환이 조직하였다.","진주에서 창립되었다.","물산 장려 운동을 주도하였다."],a:0,e:"신간회 결성을 계기로 1927년에 창립됐어."},
 {q:"잡지 『어린이』를 펴내고 어린이날 제정에 앞장선 인물은?",c:["방정환","조만식","이상재","한용운"],a:0,e:"천도교 소년회를 이끌었어."},
 {q:"중일 전쟁 이후 소년 운동은 어떻게 되었나?",c:["모든 활동이 금지되었다.","전국 조직으로 커졌다.","신간회와 통합되었다.","임시 정부로 옮겨 갔다."],a:0,e:"일제가 어린이날 행사까지 금지했어."}
 ]},

{id:"L29",u:"s16",part:"지켜야 할 것들",title:"역사를 지키는 싸움",sc:"book",
 hook:"총과 칼만 전쟁이 아니었어. 일제는 '너희 역사는 원래 남에게 휘둘리고, 발전도 없고, 싸움만 했다'고 가르쳤지. 그 거짓말과 싸운 학자들이 있었어. 역사를 지키면 나라를 되찾을 수 있다고 믿은 사람들이야.",
 cards:[
 {t:"story",h:"역사를 왜 비틀었을까",b:"일제는 식민 지배를 합리화하려고 한국사를 연구하고 왜곡했어. 한국인의 독립 의지를 꺾으려면 스스로의 역사를 부끄럽게 여기게 만드는 게 가장 확실했거든. 이렇게 만든 게 <b>식민 사관</b>이야."},
 {t:"fact",y:1925,n:"조선사 편수회",b:"조선 총독부에 딸린 기구로, <b>식민 사관</b>에 따라 『조선사』를 펴냈어. 식민 사관은 세 가지야 — <b>타율성론</b>(외세에 휘둘렸다), <b>정체성론</b>(발전 없이 멈춰 있었다), <b>당파성론</b>(단결 못 한다).",
  why:"한국사의 자율적·주체적 발전을 부정해 식민 지배를 정당화하려 했어.",
  so:"이 주장에 맞서 여러 갈래의 한국사 연구가 나와.",tk:"rule"},
 {t:"fact",y:1915,n:"박은식",b:"'조선 <b>국혼</b>'을 강조한 민족주의 사학자야. 『<b>한국통사</b>』로 일제의 침략 과정을, 『<b>한국독립운동지혈사</b>』로 민족의 독립운동사를 정리했어.",
  why:"나라는 빼앗겨도 역사·말·풍속 속의 '혼'이 살아 있으면 반드시 독립한다고 믿었어.",
  so:"<b>민족주의 사학</b>의 대표 학자야. 임시 정부 제2대 대통령이기도 해."},
 {t:"fact",y:1931,n:"신채호의 고대사 연구",b:"<b>고대사</b> 연구에 힘을 쏟아 『<b>조선상고사</b>』, 『조선사연구초』를 썼어. 의열단의 「조선 혁명 선언」을 쓴 그 신채호야.",
  why:"고대사에서 민족의 자주성과 정신을 찾으려 했어.",
  so:"박은식과 함께 민족주의 사학을 세웠어."},
 {t:"fact",y:1934,n:"조선학 운동",b:"<b>정인보</b> 등이 '문화가 살면 민족은 죽지 않는다'는 신념으로 1930년대 중반에 펼쳤어. 전통 사상과 문화의 독자성을 탐구했고, 특히 조선 후기 <b>실학</b> 연구에 성과를 냈지.",
  why:"민족 말살 정책이 거세지자 문화로 민족의 주체성을 지키려 했어.",
  so:"정약용의 글을 모은 『여유당전서』도 이 운동으로 펴냈어."},
 {t:"fact",y:1933,n:"백남운의 사회 경제 사학",b:"<b>백남운</b>은 마르크스의 유물 사관을 바탕으로 『조선사회경제사』를 썼어. 한국사도 다른 민족처럼 <b>세계사의 보편적인 발전 법칙</b>을 따랐다고 주장했지.",
  why:"한국사가 발전 없이 멈춰 있었다는 <b>정체성론</b>을 정면으로 반박하려 했어.",
  so:"민족정신을 강조한 민족주의 사학과는 다른 길이야. 이걸 <b>사회 경제 사학</b>이라고 해."},
 {t:"fact",y:1934,n:"진단 학회",b:"문헌 고증으로 객관적인 역사를 쓰려는 <b>실증 사학</b>자들이 만들고 『<b>진단학보</b>』를 펴냈어.",
  why:"감정이나 이념보다 사료에 근거한 연구를 하자는 거였어.",
  so:"민족주의 사학·사회 경제 사학과 함께 세 갈래 역사학 중 하나야."},
 {t:"compare",title:"식민 사관에 맞선 두 방식",l:{n:"민족주의 사학",p:["<b>박은식</b> · <b>신채호</b>","<b>민족정신</b>을 바로 세우자","『한국통사』 · 『조선상고사』","→ 정인보의 조선학 운동"]},
  r:{n:"사회 경제 사학",p:["<b>백남운</b>","마르크스의 유물 사관","『조선사회경제사』","보편적 발전 법칙 → 정체성론 반박"]}},
 {t:"check",q:"식민 사관의 세 가지를 말해 봐.",a:"타율성론, 정체성론, 당파성론",hint:"타·정·당"},
 {t:"chain",title:"역사 전쟁의 구도",items:["일제: <b>식민 사관</b> (조선사 편수회, 『조선사』)","↔ 민족주의 사학: 박은식 · 신채호 → 조선학 운동(정인보)","↔ 사회 경제 사학: 백남운 (정체성론 반박)","↔ 실증 사학: 진단 학회 (문헌 고증)"]},
 {t:"hint",k:"타 정 당 / 민 박신 · 사 백 · 실 진",b:"식민 사관은 <em>타</em>율성·<em>정</em>체성·<em>당</em>파성. 맞선 쪽은 <em>민</em>족주의 = <em>박</em>은식·<em>신</em>채호, <em>사</em>회 경제 = <em>백</em>남운, <em>실</em>증 = <em>진</em>단 학회."},
 {t:"pick",q:"'조선 국혼'을 강조한 역사학자는?",c:["박은식","백남운"],a:0,e:"박은식이야. 백남운은 사회 경제 사학."},
 {t:"check",pr:15,q:"사회 경제 사학은 민족정신을 확립하여 독립운동의 정신적 토대를 마련하였다 — ○일까 ×일까?",a:"× — 민족정신을 강조한 건 민족주의 사학(박은식·신채호). 사회 경제 사학(백남운)은 세계사의 보편적 발전 법칙으로 정체성론을 반박했어.",hint:"민족정신 = 민족주의 사학"}
 ],
 quiz:[
 {q:"식민 사관 중 정체성론의 주장은?",c:["한국사는 발전 없이 정체되었다.","한국사는 외세에 의해 타율적으로 전개되었다.","한국인은 단결할 수 없다.","한국과 일본은 조상이 같다."],a:0,e:"타율성론·당파성론과 구분하자."},
 {q:"『한국통사』를 쓴 인물은?",c:["박은식","신채호","백남운","정인보"],a:0,e:"『한국독립운동지혈사』도 박은식이야."},
 {q:"백남운의 역사 연구에 대한 설명으로 옳은 것은?",c:["한국사도 세계사의 보편적 발전 법칙을 따랐다고 보았다.","'조선 국혼'을 강조하였다.","진단 학회를 조직하였다.","고대사 연구에 주력하였다."],a:0,e:"사회 경제 사학으로 정체성론을 반박했어."},
 {q:"실증 사학자들이 조직한 단체는?",c:["진단 학회","조선어 학회","조선사 편수회","신간회"],a:0,e:"1934년, 『진단학보』를 펴냈어."}
 ]},

{id:"L30",u:"s16",part:"지켜야 할 것들",title:"말과 글, 믿음과 시",sc:"pen",
 hook:"한글 사전 원고가 압수당하고, 목사가 고문 끝에 숨지고, 시인이 옥에서 눈을 감았어. 그래도 말과 글, 믿음과 시는 끝까지 지켜졌어. 광복 뒤 서울역 창고에서 사전 원고가 다시 발견된 이야기로 끝나.",
 cards:[
 {t:"story",h:"지키려 한 것들",b:"일제는 역사뿐 아니라 언어와 종교까지 억압해 민족정신을 지우려 했어. 이에 맞서 <b>한글 연구</b>, <b>종교계의 민족 운동</b>, <b>저항 문학</b>, 그리고 <b>문화유산 지키기</b>가 이어졌어."},
 {t:"fact",y:1921,n:"조선어 연구회",b:"<b>주시경</b>의 제자들이 중심이 되어 만들었어. '<b>가갸날</b>'(지금의 한글날)을 정하고 잡지 『한글』을 펴내 한글 연구와 보급에 힘썼지.",
  why:"3·1 운동 뒤 우리말을 지키는 게 곧 민족을 지키는 일이라고 봤어.",
  so:"1931년 <b>조선어 학회</b>로 발전해."},
 {t:"fact",y:1931,n:"조선어 학회",b:"조선어 연구회가 발전한 단체야. <b>한글 맞춤법 통일안</b>과 표준어·외래어 표기법 통일안을 만들고, 『<b>조선말 큰사전</b>』 편찬을 추진했어.",
  why:"통일된 규칙이 있어야 한글을 제대로 가르치고 쓸 수 있었어.",
  so:"한글 강습 교재로 문맹 퇴치에도 참여했어. 하지만 1942년 <b>조선어 학회 사건</b>으로 회원들이 투옥되고 원고를 빼앗겨. 광복 뒤 서울역 창고에서 원고가 발견돼 『큰사전』이 나왔어."},
 {t:"fact",y:1911,n:"사찰령",b:"일제가 불교를 통제하려고 만든 법이야. 사찰 재산을 처분하거나 <b>주지</b>를 임명할 때도 조선 총독의 허가를 받게 했어.",
  why:"종교를 식민 지배에 이용하려 했어.",
  so:"<b>한용운</b> 등이 청년 승려들과 조선 불교 유신회를 만들어 이에 맞섰어.",tk:"rule"},
 {t:"fact",y:1922,n:"천도교의 제2의 독립 선언 계획",b:"3·1 운동을 이끈 <b>천도교</b>가 1922년에 제2의 독립 선언 운동을 계획했어. 『<b>개벽</b>』, 『신여성』 같은 잡지도 펴냈고 청년·여성·소년 운동에도 앞장섰지.",
  why:"3·1 운동의 정신을 이어 가려 했어.",
  so:"종교계의 민족 운동은 천도교 말고도 이어졌어. 대종교는 중광단, 원불교는 새 생활 운동, 천주교 신자들은 의민단, 개신교는 <b>신사 참배 거부</b>(주기철 목사 순교)."},
 {t:"check",q:"신사 참배를 거부하다 고문 끝에 순교한 목사는?",a:"주기철",hint:"개신교야"},
 {t:"story",h:"시로 싸운 사람들",b:"<b>심훈</b>(「그날이 오면」), <b>한용운</b>, <b>이상화</b>(「빼앗긴 들에도 봄은 오는가」), <b>이육사</b>(「광야」·「청포도」), <b>윤동주</b>는 광복의 염원을 시에 담았고 그 신념대로 살았어. 의열단원이던 이육사는 옥중에서 순국했고, 윤동주도 일본 유학 중 수감됐다가 세상을 떠났어. 반대로 전쟁을 찬양한 <b>친일 문학</b>을 쓴 문인들도 있었지."},
 {t:"fact",y:1936,n:"전형필의 문화유산 수집",b:"간송 <b>전형필</b>은 물려받은 재산으로 일본 등 국외로 흘러 나가던 문화유산을 사들였어. 『<b>훈민정음</b>』 해례본, 김홍도·신윤복의 그림, 고려청자를 지켜 냈지.",
  why:"문화유산을 지키는 것도 독립운동이라고 생각했어.",
  so:"그래서 '문화 독립운동가'라고 불려."},
 {t:"chain",title:"한글을 지킨 흐름",items:["주시경의 제자들","→ <b>조선어 연구회</b>(1921) — 가갸날, 『한글』","→ <b>조선어 학회</b>(1931) — 맞춤법 통일안, 『조선말 큰사전』 추진","→ 조선어 학회 사건(1942) — 투옥, 원고 압수","→ 광복 뒤 원고 발견 → 『큰사전』 출간"]},
 {t:"hint",k:"연구회 → 학회 → 사건",b:"조선어 <em>연구회</em>(가갸날) → 조선어 <em>학회</em>(맞춤법·큰사전) → 조선어 학회 <em>사건</em>(1942). 한 단체가 이름을 바꿔 가며 이어진 거야."},
 {t:"pick",q:"한글 맞춤법 통일안을 만든 단체는?",c:["조선어 학회","진단 학회"],a:0,e:"조선어 학회야. 진단 학회는 실증 사학."},
 {t:"chain",pr:15,title:"종교계의 민족 운동 (프린트 표)",items:["<b>대종교</b> — 나철, 단군 신앙 · 개천절 기념 → 무장 단체 <b>중광단</b>","<b>천도교</b> — 동학 계승, 3·1 운동 주도, 제2의 독립 선언 계획(1922), 『개벽』 · 『신여성』","<b>불교</b> — 한용운, 조선 불교 유신회, 일제의 불교 통제(사찰령)에 저항","<b>원불교</b> — 박중빈 창시, 허례 폐지 · 근검절약 · 협동 단결의 <b>새 생활 운동</b>","<b>개신교</b> — 교육 · 의료 사업, 신사 참배 거부(주기철 목사 순교)","<b>천주교</b> — 보육원 · 양로원 등 사회사업, 무장 단체 <b>의민단</b>"]},
 {t:"hint",pr:15,k:"대-중광단 · 천주-의민단",b:"종교계가 만든 <em>무장 단체</em>는 둘 — <em>대</em>종교의 <em>중광단</em>(뒤에 북로 군정서로), <em>천주</em>교의 <em>의민단</em>. 원불교는 싸움이 아니라 <em>새 생활 운동</em>."},
 {t:"pick",pr:15,q:"'새 생활 운동'을 펼친 종교는?",c:["원불교","천도교"],a:0,e:"박중빈이 창시한 원불교야. 허례 폐지, 근검절약, 협동 단결."}
 ],
 quiz:[
 {q:"'가갸날'을 정한 단체는?",c:["조선어 연구회","조선어 학회","진단 학회","천도교 소년회"],a:0,e:"1921년 조선어 연구회야. 뒤에 조선어 학회가 돼."},
 {q:"사찰령에 맞서 조선 불교 유신회를 만든 인물은?",c:["한용운","주기철","방정환","전형필"],a:0,e:"청년 승려들과 함께 만들었어."},
 {q:"천도교의 활동으로 옳은 것은?",c:["제2의 독립 선언 운동을 계획하였다.","중광단을 조직하였다.","신사 참배를 거부해 학교가 폐교되었다.","의민단을 조직하였다."],a:0,e:"중광단은 대종교, 의민단은 천주교야."},
 {q:"의열단원 출신으로 옥중에서 순국한 시인은?",c:["이육사","심훈","윤동주","이상화"],a:0,e:"「광야」, 「청포도」를 남겼어."}
 ]},

{id:"L31",u:"s17",part:"광복을 향해",title:"하나로 뭉치자",sc:"chain",
 hook:"만주가 막히자 독립운동가들은 중국 본토로 옮겨 갔어. 그런데 단체가 너무 많고 제각각이었지. 하나로 뭉치자는 노력이 시작돼. 두 명의 이름, 김구와 김원봉을 기억해 둬.",
 cards:[
 {t:"story",h:"만주에서 중국 관내로",b:"일제가 만주를 차지하자 많은 독립운동가가 <b>중국 관내</b>로 옮겨 갔어. 여러 단체가 따로따로 움직이니 힘이 흩어졌지. 효율적으로 싸우려면 하나로 합쳐야 한다는 목소리가 커졌어."},
 {t:"fact",y:1935,n:"민족 혁명당",b:"1935년 <b>난징</b>에서 여러 독립운동 단체 대표가 모여 각 단체를 해체하고 하나의 당을 만들었어. 민족주의와 사회주의 계열이 합친 <b>중국 관내 최대의 통일 전선 정당</b>이야.",
  why:"흩어진 힘을 모아 효율적으로 싸우려 했어.",
  so:"그런데 의열단 계열(<b>김원봉</b>)이 당권을 쥐자 조소앙·지청천 등이 탈당하면서 통일 전선의 성격이 약해졌어."},
 {t:"fact",y:1935,n:"한국 국민당",b:"민족 혁명당에 참여하지 않은 <b>김구</b> 등 <b>임시 정부 옹호</b> 세력이 따로 만든 당이야.",
  why:"임시 정부를 중심에 두어야 한다고 봤어.",
  so:"그래서 중국 관내 독립운동은 김구 쪽과 김원봉 쪽, 두 진영으로 나뉘게 돼."},
 {t:"fact",y:1937,n:"한국 광복 운동 단체 연합회",b:"중일 전쟁이 터지자 김구의 <b>한국 국민당</b>을 중심으로 결성됐어.",
  why:"중일 전쟁을 독립의 기회로 보고 힘을 모으려 했어.",
  so:"김구 진영의 연합체야."},
 {t:"fact",y:1937,n:"조선 민족 전선 연맹",b:"같은 때 <b>김원봉</b>이 이끄는 민족 혁명당을 중심으로 결성됐어.",
  why:"김원봉 쪽도 항일 세력을 한데 묶으려 했어.",
  so:"김원봉 진영의 연합체야. 이 연맹이 이듬해 조선 의용대를 만들어."},
 {t:"compare",title:"두 진영",l:{n:"김구 쪽",p:["<b>한국 국민당</b> (1935)","→ 한국 광복 운동 단체 연합회 (1937)","임시 정부 옹호","→ 뒤에 한국광복군"]},
  r:{n:"김원봉 쪽",p:["<b>민족 혁명당</b> (1935)","→ 조선 민족 전선 연맹 (1937)","통일 전선 정당","→ 조선 의용대 (1938)"]}},
 {t:"fact",y:1938,n:"조선 의용대",b:"조선 민족 전선 연맹이 중국 국민당 정부의 지원을 받아 <b>우한</b>(한커우)에서 만든 부대야. <b>중국 관내 최초의 한인 부대</b>지. 일본군을 상대로 심리전, 포로 심문, 후방 공작을 맡았어.",
  why:"중일 전쟁을 적극적으로 싸울 기회로 봤어.",
  so:"1940년대 초 다수가 더 적극적으로 싸우려고 화북으로 옮겨 가."},
 {t:"fact",y:1939,n:"김구·김원봉의 공개 통신",b:"김구와 김원봉이 함께 「동지 동포 제군에게 보내는 공개 통신」을 발표해 <b>항일 전선의 통합</b>을 호소했어.",
  why:"두 진영을 지원하던 중국 국민당 정부도 단일화를 요구했어.",
  so:"통합이 추진됐지만 이념과 방식 차이로 쉽지 않았어. 결국 1942년 김원봉이 임시 정부에 합류하면서 이뤄져."},
 {t:"fact",y:1941,n:"조선 의용대 화북 지대",b:"조선 의용대 다수가 중국 공산당 세력이 일본군과 싸우던 <b>화북</b>으로 가서 만들었어. <b>타이항산</b>을 중심으로 호가장 전투, 반소탕전에서 큰 전과를 올렸지.",
  why:"후방 공작보다 직접 싸우는 투쟁을 원했어.",
  so:"뒤에 조선 독립 동맹 아래 <b>조선 의용군</b>으로 바뀌어."},
 {t:"check",q:"중국 관내에서 결성된 최초의 한인 부대는?",a:"조선 의용대 (1938, 우한)",hint:"조선 민족 전선 연맹이 만들었어"},
 {t:"chain",title:"중국 관내 항일 전선의 흐름",items:["만주 사변 → 중국 관내로 이동","→ 1935 <b>민족 혁명당</b>(김원봉) / <b>한국 국민당</b>(김구)","→ 1937 중일 전쟁: 두 연합체로 재편","→ 1938 <b>조선 의용대</b>(우한)","→ 1939 김구·김원봉 공개 통신","→ 1941 화북 지대 (타이항산) / 1942 일부는 광복군으로"]},
 {t:"hint",k:"민혁-난징-원봉 · 의용대-우한",b:"<em>민</em>족 <em>혁</em>명당은 <em>난징</em>, 김<em>원봉</em>. 조선 <em>의용대</em>는 <em>우한</em>. 김구는 늘 '임시 정부 쪽'."},
 {t:"pick",q:"민족 혁명당에 참여하지 않고 한국 국민당을 만든 인물은?",c:["김구","김원봉"],a:0,e:"김구야. 김원봉은 민족 혁명당의 중심."},
 {t:"check",pr:16,q:"한국광복군은 중국 국민당 정부의 지원을 받아 중국 관내에서 결성된 최초의 한인 부대이다 — ○일까 ×일까?",a:"× — 최초는 조선 의용대(1938, 우한·한커우). 한국광복군은 1940년 충칭에서 만들어졌어.",hint:"1938 vs 1940"},

 {t:"fact",y:1940,n:"임시 정부의 충칭 정착",b:"<b>윤봉길 의거</b> 뒤 여러 곳을 떠돌던 대한민국 임시 정부가 1940년 충칭에 정착했어. 중국 국민당 정부의 지원을 받아 체제를 고치고 항일 투쟁의 힘을 키웠지.",

  why:"임시 정부를 받쳐 줄 튼튼한 여당이 필요했어.",

 {t:"fact",y:1941,n:"건국 강령",b:"임시 정부가 광복 뒤 세울 민주 국가의 방향을 발표했어. 바탕은 <b>조소앙</b>의 <b>삼균주의</b> — <b>정치·경제·교육의 균등</b>이야.",

 {t:"fact",y:1941,n:"대일 선전 성명서",b:"아시아·태평양 전쟁이 터지자 임시 정부가 일본에 <b>선전 포고</b>를 하고 한국광복군을 연합군의 일원으로 참전시켰어.",

 {t:"fact",y:1942,n:"조선 의용대의 광복군 합류",b:"화북으로 가지 않은 조선 의용대 병력이 <b>김원봉</b>의 인솔로 한국광복군에 합류했어. 김규식 등 민족 혁명당과 사회주의 계열 인사도 임시 정부에 참여했지.",

{id:"L33",u:"s18",part:"광복을 향해",title:"광복 직전",sc:"dawn",
 hook:"마지막 수업이야. 광복을 앞두고 세 곳에서 세 단체가 그날을 준비하고 있었어. 충칭의 임시 정부, 화북의 조선 독립 동맹, 국내의 조선 건국 동맹. 그리고 연합국은 한국의 독립을 약속해. 이 셋과 약속 세 번만 외우면 Ⅰ단원이 끝나.",
 cards:[
 {t:"story",h:"광복 직전의 지도",b:"충칭에는 <b>대한민국 임시 정부</b>와 한국광복군, 화북(옌안)에는 <b>조선 독립 동맹</b>과 조선 의용군, 국내에는 <b>조선 건국 동맹</b>. 서로 연합하려고 애썼지만, 일제가 예상보다 일찍 항복하면서 그 꿈은 끝을 못 봤어."},
 {t:"fact",y:1942,n:"조선 독립 동맹",b:"화북 지방의 <b>사회주의</b> 세력이 <b>김두봉</b>을 위원장으로 결성했어. 조선 의용대 화북 지대를 <b>조선 의용군</b>으로 바꿔 항일 무장 투쟁을 벌였지.",
  why:"화북에서 중국 공산당과 함께 싸우던 한인들이 조직을 갖춘 거야.",
  so:"임시 정부가 통합을 교섭했지만 일제가 먼저 패망해 이뤄지지 못했어."},
 {t:"fact",y:1943,n:"미얀마·인도 전선 파견",b:"한국광복군이 <b>영국군</b>의 요청으로 공작대를 미얀마·인도 전선에 보냈어. 일본군을 상대로 심리전, 암호 해독, 포로 심문을 맡아 큰 성과를 올렸지.",
  why:"일본어를 할 줄 아는 한국인이 이런 일에 꼭 필요했어.",
  so:"한국광복군이 실제로 <b>연합군과 함께</b> 싸웠다는 증거야."},
 {t:"fact",y:1943,n:"카이로 선언",b:"미국·영국·중국 정상이 모여 일본 세력을 몰아낸 뒤 '<b>적절한 시기</b>에' 한국을 독립시키겠다고 <b>처음으로</b> 약속했어.",
  why:"일본의 침략을 막고 빼앗은 땅을 되돌려 놓겠다는 연합국의 결의였어.",
  so:"김구는 '적절한 시기'라는 표현이 싫다며 '일본이 무너지는 그때 독립해야 한다'고 했어.",tk:"world"},
 {t:"fact",y:1944,n:"조선 건국 동맹",b:"광복을 1년여 앞두고 <b>여운형</b>의 주도로 <b>국내</b>에서 만든 비밀 결사야. 민족주의와 사회주의 계열 인사가 함께 참여했어.",
  why:"일제의 패망에 대비해 나라를 세울 준비를 했어.",
  so:"중앙과 지방에 체계적인 조직을 갖추고 조선 독립 동맹·임시 정부와도 연합을 시도했어."},
 {t:"compare",title:"이름이 거의 같은 두 동맹",l:{n:"조선 독립 동맹 (1942)",p:["<b>화북</b>(옌안)","<b>김두봉</b>","사회주의 세력 중심","→ <b>조선 의용군</b>"]},

 {t:"check",q:"광복 직전 세 단체를 장소와 지도자로 말해 봐.",a:"충칭 — 임시 정부(김구) / 화북 — 조선 독립 동맹(김두봉) / 국내 — 조선 건국 동맹(여운형)",hint:"충·옌·국"},
 {t:"chain",title:"연합국의 약속",items:["1943.12 <b>카이로 선언</b> — 미·영·중, 한국 독립 첫 약속 ('적절한 시기')","→ 1945.2 <b>얄타 회담</b> — 미·영·소, 소련 대일전 참전 합의","→ 1945.7 <b>포츠담 선언</b> — 카이로 재확인, 무조건 항복 요구","→ 소련 참여 → 미·영·중·소가 한국 독립 재확인","→ 1945.8 일본 항복 · 광복"]},

    return '<svg width="'+size+'" height="'+Math.round(size*vh/120)+'" viewBox="'+vb+'" aria-hidden="true">'+g+'</svg>';

  var vbTop=Math.round(top-20); vh=112-vbTop; vb="0 "+vbTop+" 120 "+vh;
  g='<path d="M18 106h84" stroke="var(--line2)" stroke-width="2" '+o+'/>';

  var pairs=Math.min(7,Math.ceil(st/2.6));
  for(var i=0;i<pairs;i++){

    var w=10+Math.min(st,14)*0.8-i*1.1, side=(i%2?1:-1);

       '<path d="M45 '+(top-18).toFixed(0)+'l3 5-3 5M75 '+(top-18).toFixed(0)+'l-3 5 3 5" stroke="var(--ochre)" stroke-width="1.8" opacity=".7" '+o+'/>';

  var s=stack[stack.length-1];

/* 마친 수업에서 한 장 뽑아 홈에 띄운다 */
function peekCard(){
  var pool=[];
  LESSONS.forEach(function(l){
    if(!S.done[l.id])return;
    l.cards.forEach(function(c){
      if(c.t==="hint")pool.push({l:l,html:'<b class="k">'+esc(c.k)+'</b><span>'+c.b+'</span>'});
      if(c.t==="fact")pool.push({l:l,html:'<b class="k" style="color:var(--ink)">'+c.y+' · '+esc(c.n)+'</b><span>'+c.so+'</span>'});
      if(c.t==="chain")pool.push({l:l,html:'<b class="k" style="font-size:16px">'+esc(c.title)+'</b><span>'+
        c.items.map(function(x){return x.replace(/<[^>]+>/g,"");}).join(" → ")+'</span>'});
    });
  });
  if(!pool.length)return null;
  return pool[Math.floor(Math.random()*pool.length)];
}

/* ── 간격 반복: 마친 수업을 1 · 3 · 7 · 16일 뒤에 다시 묻는다 ── */
var DUE_DAYS=[1,3,7,16];
function dueList(){
  var t=today();
  return LESSONS.filter(function(l){ var d=S.due[l.id]; return S.done[l.id]&&d&&d.at<=t; });
}
function dueBump(lid,ok){
  var d=S.due[lid]||{n:0,at:today()};
  if(ok)d.n=Math.min(DUE_DAYS.length-1,d.n+1); else d.n=0;
  d.at=today()+DUE_DAYS[d.n];
  S.due[lid]=d; save();
}
function ddayLeft(){
  if(!S.dday)return null;
  var d=new Date(S.dday+"T00:00:00");
  if(isNaN(d))return null;
  return Math.round(Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)-today());
}
/* 남은 날짜에 맞춘 하루 권장량 */
function pace(){
  var L=ddayLeft(); if(L==null||L<0)return null;
  var left=LESSONS.length-doneCount(); if(!left)return null;
  return {left:left, days:Math.max(1,L), per:Math.ceil(left/Math.max(1,L))};
}

/* ── 오답 노트 ── */
function wkey(lid,kind,idx){return lid+"#"+kind+idx;}
function wAdd(lid,kind,idx,chose){
  var k=wkey(lid,kind,idx),w=S.wrong[k];
  if(w){w.miss++;w.at=Date.now();w.chose=chose;}
  else S.wrong[k]={lid:lid,kind:kind,idx:idx,miss:1,at:Date.now(),chose:chose};
  save();
}
function wClear(lid,kind,idx){ delete S.wrong[wkey(lid,kind,idx)]; save(); }
function wCount(){return Object.keys(S.wrong).length;}
/* 오답 항목을 실제 문제로 되살린다 */
function wItem(w){
  if(w.kind==="e"){                      /* 내신 실전 문항 */
    var x=(typeof EMAP!=="undefined")?EMAP[w.idx]:null; if(!x)return null;
    return {lid:"EXAM",kind:"e",idx:w.idx,lesson:{title:"내신 실전 · "+UMAP[x.u].n},
      q:x.q,c:x.c,a:x.a,e:x.e,miss:w.miss,chose:w.chose,type:x.type,boki:x.boki};
  }
  if(w.kind==="n"){                      /* 인물·단체 카드 */
    var nb=(typeof nOpts==="function")?nOpts(w.idx):null; if(!nb)return null;
    return {lid:"NAME",kind:"n",idx:w.idx,lesson:{title:"인물·단체 · "+UMAP[nb.x.u].n},
      q:nb.q,c:nb.c.map(stripTags),a:0,e:nb.e,miss:w.miss,chose:w.chose};
  }
  var l=LMAP[w.lid]; if(!l)return null;
  if(w.kind==="q"){ var q=l.quiz[w.idx]; if(!q)return null;
    return {lid:w.lid,kind:"q",idx:w.idx,lesson:l,q:q.q,c:q.c,a:q.a,e:q.e,miss:w.miss,chose:w.chose}; }
  var c=l.cards[w.idx]; if(!c||c.t!=="pick")return null;
  return {lid:w.lid,kind:"p",idx:w.idx,lesson:l,q:c.q,c:c.c,a:c.a,e:c.e,miss:w.miss,chose:w.chose};
}
function wList(){
  return Object.keys(S.wrong).map(function(k){return wItem(S.wrong[k]);})
    .filter(Boolean).sort(function(a,b){
      var ai=LESSONS.indexOf(LMAP[a.lid]||{}),bi=LESSONS.indexOf(LMAP[b.lid]||{});
      return ai-bi||String(a.idx).localeCompare(String(b.idx));});
}

/* ── 레슨 ── */
var L=null;
function vLesson(a){
  var l=LMAP[a.id];
  if(!L||L.id!==a.id){
    L={id:a.id,l:l,i:(S.done[l.id]?0:(S.pos[l.id]||0)),phase:"card",qi:0,qok:0,qlog:[],revealed:false,answered:false};
    if(L.i>=l.cards.length)L.i=0;
  }
  titleEl.textContent=l.title;
  if(L.phase==="quiz")return paintQuiz();
  if(L.phase==="end")return paintEnd();
  paintCard();
}
function hud(){
  var l=L.l,tot=l.cards.length+l.quiz.length;
  var cur=L.phase==="card"?L.i:l.cards.length+L.qi;
  return '<div style="display:flex;align-items:center;gap:12px;padding:2px 0 16px">'+
    '<span class="track"><i style="width:'+(cur/tot*100)+'%"></i></span>'+
    '<span class="step">'+(cur+1)+' / '+tot+'</span></div>';
}
/* 되돌아갈 자리가 있나 — 첫 카드 앞으로는 못 간다 */
function canBack(){
  if(!L)return false;
  if(L.phase==="card")return L.i>0||L.revealed;
  if(L.phase==="quiz")return true;
  return false;
}
/* 한 칸 뒤로. 퀴즈에서 뒤로 가면 그때 매긴 점수도 같이 되돌린다 */
function goBack(){
  if(!canBack())return;
  buzz(10);
  if(L.phase==="card"){
    if(L.revealed){ L.revealed=false; return vLesson({id:L.id}); }   /* 답부터 다시 가린다 */
    L.i--;
  }else if(L.phase==="quiz"){
    if(L.qi===0){ L.phase="card"; L.i=L.l.cards.length-1; }
    else{
      L.qi--;
      var last=L.qlog.pop();
      if(last&&last.ok)L.qok--;
      L.combo=0;
    }
  }
  L.revealed=false; L.answered=false;
  S.pos[L.id]=L.i; save();
  vLesson({id:L.id});
}
/* 「다음」 옆에 「이전」을 붙여 준다. 되돌아갈 자리가 없으면 다음만 */
function nextBtn(label,fn){
  var back=canBack();
  var h='<div class="sticky">'+(back?'<div class="row back">':'')+
        (back?'<button class="cta ghost" id="prev">← 이전</button>':'')+
        '<button class="cta" id="nx">'+label+'</button>'+(back?'</div>':'')+'</div>';
  setTimeout(function(){
    var b=document.getElementById("nx");if(b)b.onclick=fn;
    var p=document.getElementById("prev");if(p)p.onclick=goBack;
  },0);
  return h;
}
/* 아직 고르기 전 화면 — 「이전」만 놓는다 */
function backOnly(){
  if(!canBack())return "";
  setTimeout(function(){var p=document.getElementById("prev");if(p)p.onclick=goBack;},0);
  return '<div class="sticky"><button class="cta ghost wide" id="prev">← 이전</button></div>';
}
function advance(){
  L.i++; L.revealed=false; L.answered=false;
  S.pos[L.id]=L.i; save();
  if(L.i>=L.l.cards.length){L.phase="quiz";L.qi=0;L.qok=0;L.qlog=[];}
  vLesson({id:L.id});
}

function paintCard(){
  var l=L.l,c=l.cards[L.i],h=hud();
  if(L.i===0)h+='<div class="card"><div class="scene">'+scene(l.sc,72)+'</div>'+

    '<div class="h">'+esc(l.title)+'</div><div class="bd">'+esc(l.hook)+'</div></div>';

  if(c.t==="story")
    h+='<div class="card">'+prB(c)+'<div class="eyebrow">이야기</div><div class="h sm">'+esc(c.h)+'</div>'+
       '<div class="bd">'+c.b+'</div></div>';

  if(c.t==="fact")
    h+='<div class="card">'+prB(c)+'<span class="yr">'+c.y+'</span>'+
       '<div class="h">'+esc(c.n)+'</div><div class="bd">'+c.b+'</div>'+
       '<div class="wsblock">'+
         '<div class="ws why"><span class="lb">왜?</span><p>'+c.why+'</p></div>'+
         '<div class="ws so"><span class="lb">그래서</span><p>'+c.so+'</p></div>'+
       '</div></div>';

  if(c.t==="chain"){
    h+='<div class="card">'+prB(c)+'<div class="eyebrow">인과 사슬</div><div class="h sm">'+esc(c.title)+'</div>'+
       '<div class="chain">'+c.items.map(function(x,i){
         return '<div class="cl" style="animation-delay:'+(i*130)+'ms"><span class="dot"></span><p>'+x+'</p></div>';
       }).join("")+'</div></div>';
  }

  if(c.t==="hint")
    h+='<div class="card hintcard">'+prB(c)+'<div class="eyebrow">이렇게 외우자</div>'+
       '<div class="k">'+esc(c.k)+'</div><div class="bd">'+c.b+'</div></div>';

  if(c.t==="compare")
    h+='<div class="card">'+prB(c)+'<div class="eyebrow">헷갈리지 않게</div><div class="h sm">'+esc(c.title)+'</div>'+
       '<div class="cmp"><div class="a"><h4>'+c.l.n+'</h4><ul>'+c.l.p.map(function(x){return "<li>"+x+"</li>";}).join("")+'</ul></div>'+
       '<div class="b"><h4>'+c.r.n+'</h4><ul>'+c.r.p.map(function(x){return "<li>"+x+"</li>";}).join("")+'</ul></div></div></div>';

  if(c.t==="check"){
    h+='<div class="card">'+prB(c)+'<div class="eyebrow">잠깐, 스스로 떠올려 보자</div><div class="recall">'+
       '<div class="q">'+esc(c.q)+'</div>'+
       (L.revealed?'<div class="ans">'+esc(c.a)+'</div>'
                  :'<div class="ans blur">'+esc(c.a)+'</div>')+
       '<div class="tip">'+(L.revealed?"맞혔으면 그대로, 틀렸으면 한 번 더 소리 내어 읽어 보자":esc(c.hint||"머릿속으로 답해 본 다음 눌러 봐"))+'</div>'+
       '</div></div>';
    if(!L.revealed){
      h+=nextBtn("답 확인",function(){L.revealed=true;buzz(12);vLesson({id:L.id});});
      view.innerHTML=h;return;
    }
  }

  if(c.t==="pick"){
    if(!L.pm||L.pmi!==L.i){ L.pm=mixQ(c); L.pmi=L.i; }
    var pc=L.pm;
    h+='<div class="card">'+prB(c)+'<div class="eyebrow">골라 보자</div><div class="h sm">'+esc(c.q)+'</div>'+
       '<div class="two" id="two">'+pc.c.map(function(x,i){
         return '<button class="tw" data-i="'+i+'">'+esc(x)+'</button>';}).join("")+'</div>'+
       '<div id="fb"></div></div>';
    view.innerHTML=h+backOnly();
    Array.prototype.forEach.call(view.querySelectorAll("#two .tw"),function(b){
      b.onclick=function(){
        if(L.answered)return; L.answered=true;
        var ok=+b.dataset.i===pc.a;
        Array.prototype.forEach.call(view.querySelectorAll("#two .tw"),function(x,i){
          x.disabled=true; if(i===pc.a)x.classList.add("ok"); else if(x===b)x.classList.add("no");
        });
        buzz(ok?14:[20,40,20]); markDay();
        if(ok)wClear(L.id,"p",L.i); else wAdd(L.id,"p",L.i,unmix(pc,+b.dataset.i));
        document.getElementById("fb").innerHTML=
          '<div class="fb '+(ok?"ok":"no")+'"><span class="m">'+(ok?"맞아":"아냐")+'</span><span>'+c.e+'</span></div>';

      };
    });

  h+=nextBtn(L.i===L.l.cards.length-1?"마무리 퀴즈 풀기":"다음",advance);
  view.innerHTML=h;
}

/* ── 마무리 퀴즈 ── */
function paintQuiz(){
  var l=L.l;
  if(!L.mq||L.mqi!==L.qi){ L.mq=mixQ(l.quiz[L.qi]); L.mqi=L.qi; }
  var q=L.mq;
  var h=hud()+'<div class="card"><div class="eyebrow">마무리 퀴즈 '+(L.qi+1)+' / '+l.quiz.length+'</div>'+
    '<div class="h sm">'+esc(q.q)+'</div></div>'+
    '<div style="margin-top:12px" id="opts">'+q.c.map(function(x,i){
      return '<button class="qopt" data-i="'+i+'"><span class="kx">'+"ABCD".charAt(i)+'</span><span>'+esc(x)+'</span></button>';
    }).join("")+'</div><div id="fb"></div>';
  view.innerHTML=h+backOnly();
  Array.prototype.forEach.call(view.querySelectorAll("#opts .qopt"),function(b){
    b.onclick=function(){
      if(L.answered)return; L.answered=true;
      var ok=+b.dataset.i===q.a;
      Array.prototype.forEach.call(view.querySelectorAll("#opts .qopt"),function(x,i){
        x.disabled=true;
        if(i===q.a)x.classList.add("ok"); else if(x===b)x.classList.add("no"); else x.classList.add("dim");
      });
      if(ok){
        L.qok++; L.combo=(L.combo||0)+1;
        if(L.combo>=3&&L.combo%3===0)pop(L.combo+"연속!"); else pop("좋아!");
        wClear(L.id,"q",L.qi);
      }else{
        L.combo=0; wAdd(L.id,"q",L.qi,unmix(q,+b.dataset.i));
      }
      L.qlog.push({q:q,ok:ok});
      buzz(ok?14:[20,40,20]); markDay();
      document.getElementById("fb").innerHTML=
        '<div class="fb '+(ok?"ok":"no")+'"><span class="m">'+(ok?"○":"×")+'</span><span>'+esc(q.e)+'</span></div>';
      var sk1=view.querySelector(".sticky"); if(sk1)sk1.remove();
      view.insertAdjacentHTML("beforeend",nextBtn(
        L.qi+1>=l.quiz.length?"수업 마치기":"다음 문제",function(){
          L.qi++; L.answered=false;
          if(L.qi>=l.quiz.length){L.phase="end";finishLesson();}
          vLesson({id:L.id});
        }));
    };
  });
}
function finishLesson(){
  S.done[L.id]=Date.now();
  dueBump(L.id, L.qok>=Math.ceil(L.l.quiz.length*0.75));   /* 잘 봤으면 더 멀리 미룬다 */
  S.quiz[L.id]={n:L.l.quiz.length,ok:L.qok};
  S.pos[L.id]=0; markDay(); save();
}

/* ── 수업 마무리 ── */
function paintEnd(){
  var l=L.l,rate=Math.round(L.qok/l.quiz.length*100);
  var facts=l.cards.filter(function(c){return c.t==="fact";});
  var hint=l.cards.filter(function(c){return c.t==="hint";})[0];
  var idx=LESSONS.indexOf(l),nx=LESSONS[idx+1];
  titleEl.textContent="수업 끝";
  var wrong=L.qlog.filter(function(x){return !x.ok;});
  view.innerHTML=
    '<div class="done-hero"><div class="stamp show">'+stampSVG(76)+'</div>'+
      '<div class="big">'+L.qok+' / '+l.quiz.length+'</div>'+
      '<div class="sub">'+(rate===100?"완벽해. 이 수업은 확실히 잡았어."
        :rate>=75?"잘했어. 틀린 것만 한 번 더 보고 가자."
        :"괜찮아. 처음 보는 내용이잖아. 아래 정리만 다시 읽고 가자.")+'</div></div>'+
    '<div class="part">오늘 배운 것</div>'+
    '<div class="sumlist">'+facts.map(function(c,i){
      return '<div class="sum"><span class="n">'+(i+1)+'</span><span><b style="font-family:var(--f-d)">'+
        esc(c.n)+'</b> · '+c.y+'년<br><span style="color:var(--tx2);font-size:14px">'+
        c.so.replace(/<[^>]+>/g,"")+'</span></span></div>';
    }).join("")+'</div>'+
    (hint?'<div class="part">외울 때 이걸 떠올려</div><div class="rv"><div class="k">'+esc(hint.k)+'</div>'+
      '<div class="b">'+hint.b+'</div></div>':'')+
    (wrong.length?'<div class="part">틀린 문제 · 오답 노트에 담았어</div>'+wrong.map(function(x){
      return '<div class="rv"><div class="t">다시 보기</div><div class="b" style="margin-top:6px">'+
        esc(x.q.q)+'<br><b style="color:var(--jade)">→ '+esc(x.q.c[x.q.a])+'</b></div></div>';
    }).join(""):'')+
    '<div class="sticky"><div class="row">'+
      '<button class="cta ghost" id="hm">목록으로</button>'+
      (nx?'<button class="cta" id="nx2">다음 수업</button>':'<button class="cta" id="rv3">다시 훑기</button>')+
    '</div></div>';
  document.getElementById("hm").onclick=function(){L=null;stack=[{n:"home"}];render();};
  var n2=document.getElementById("nx2");
  if(n2)n2.onclick=function(){L=null;go("lesson",{id:nx.id},true);};
  var r3=document.getElementById("rv3");
  if(r3)r3.onclick=function(){L=null;go("review",null,true);};
}

/* 시기 구분 — 통치 방식이 바뀐 두 지점(3·1 운동, 만주 사변)에서 끊는다 */
var ERAS=[
  {y:1919,n:"1910년대",t:"무단 통치",d:"헌병 경찰이 칼을 차고 다니고, 토지와 회사를 손에 넣던 때"},
  {y:1930,n:"1920년대",t:"이른바 문화 통치",d:"3·1 운동에 놀란 일제가 겉모습만 바꾸고 쌀을 실어 가던 때"},
  {y:9999,n:"1930~40년대",t:"민족 말살 · 전시 동원",d:"전쟁에 끌어들이려고 이름과 말까지 빼앗던 때"}
];
function eraOf(y){ for(var i=0;i<ERAS.length;i++) if(y<=ERAS[i].y) return i; return ERAS.length-1; }
function timeline(){
  if(TL)return TL;
  TL=[];
  LESSONS.forEach(function(l){
    l.cards.forEach(function(c,i){
      if(c.t==="fact"&&c.y!=null)
        TL.push({y:c.y,n:c.n,u:l.u,lid:l.id,ci:i,lt:l.title,
                 k:c.tk||TRACK[l.u]||"world",pr:c.pr||0,po:c.po||0,
                 so:(c.so||"").replace(/<[^>]+>/g,"")});
    });
  });
  /* 수업이 아직 없는 단원은 사실만 — 누르면 갈 수업이 없으니 lid 를 비워 둔다 */
  /* 수업 카드로 이미 있는 사실은 건너뛴다(단원+이름으로 맞춘다). 빠진 게 있어도 연표에서는 사라지지 않게 */
  var has={}; LESSONS.forEach(function(l){ l.cards.forEach(function(c){ if(c.t==="fact")has[l.u+"|"+c.n]=1; }); });
  TL_EXTRA.forEach(function(r){
    if(has[r[0]+"|"+r[2]])return;
    TL.push({y:r[1],n:r[2],u:r[0],lid:null,ci:null,lt:UMAP[r[0]].n+" · "+UMAP[r[0]].bk,
             k:r[4]||TRACK[r[0]]||"world",so:r[3]});
  });
  /* 같은 해 안에서는 교과서 차례 그대로 둔다 (정렬이 안정적이라 그대로 남는다) */
  TL.sort(function(a,b){return a.y-b.y;});
  return TL;
}
var RVTAB="hint",TLU="";
/* 렌더를 우회하면 창 제목이 경로로 안 바뀐다. 상태만 바꾸고 render 를 태운다 */
function jumpCard(lid,ci){
  L=null; go("lesson",{id:lid});
  if(L){ L.i=Math.max(0,Math.min(ci,LMAP[lid].cards.length-1));
    L.phase="card"; L.revealed=false; L.answered=false; render(); }
}

  var rows=TLU?all.filter(function(r){return r.k===TLU;}):all;
  /* 정확한 연도까지 외울 필요는 없다. 기본은 접어 두고, 필요할 때만 펴 본다 */
  var hide=(S.tlHide==null)?true:!!S.tlHide;
  /* 설명을 접으면 사건 이름만 남는다 — 이름만 보고 내용을 떠올리는 연습용 */
  var desc=(S.tlDesc==null)?true:!!S.tlDesc;
  var html=tabsHTML()+
    '<div class="tlmap">'+ERAS.map(function(e,i){
      return '<span class="e e'+i+'"><b>'+e.n+'</b><small>'+esc(e.t)+'</small></span>';
    }).join('<span class="ar">→</span>')+'</div>'+
    '<p class="note" style="margin-bottom:13px">Ⅰ단원에 나오는 사건 '+all.length+'개를 <b>일어난 순서대로</b> 한 줄에 세웠어. '+
      '시험은 몇 년인지가 아니라 <b>무엇이 먼저였나</b>를 물어. 그래서 연도는 접어 뒀어. '+
      '<b style="background:var(--red-l);color:var(--ink)">일제</b>가 한 일과 '+
      '<b style="background:var(--teal-l);color:var(--ink)">우리</b>가 한 일이 어떻게 맞물리는지 보면서 쭉 내려 봐. '+
      '아무 줄이나 누르면 그 수업의 그 자리로 바로 가.</p>'+
    '<div class="tlbar">'+
      '<button class="chip'+(hide?"":" on")+'" id="tlh">'+(hide?"연도 펴기":"연도 접기")+'</button>'+
      '<button class="chip'+(desc?" on":"")+'" id="tld">'+(desc?"설명 접기":"설명 펴기")+'</button>'+
      '<span class="cnt">'+rows.length+' / '+all.length+'</span></div>'+
    '<div class="chips strip" id="tlu">'+
      '<button class="chip'+(TLU?"":" on")+'" data-u="">전체</button>'+
      ["rule","resist","life","world"].filter(function(k){return all.some(function(r){return r.k===k;});})
        .map(function(k){return '<button class="chip k-'+k+(TLU===k?" on":"")+'" data-u="'+k+'">'+
          (k==="rule"?"일제의 통치":k==="resist"?"우리의 저항":k==="life"?"사회와 삶":"바깥 세계")+'</button>';}).join("")+
    '</div>';
  var cy=null,ce=-1;
  rows.forEach(function(r,i){
    var ei=eraOf(r.y);
    if(ei!==ce){ ce=ei;
      html+='<div class="tle"><b>'+ERAS[ei].n+'</b><span><b class="t">'+esc(ERAS[ei].t)+'</b>'+
            '<small>'+esc(ERAS[ei].d)+'</small></span></div>'; }
    if(r.y!==cy){ cy=r.y;
      html+='<div class="tly'+(hide?" hid":"")+'"><b data-y="'+r.y+'">'+(hide?"·····":r.y)+'</b><i></i></div>'; }
    html+='<button class="tlr k-'+r.k+(r.lid?(S.done[r.lid]?"":" new"):" nol")+'" data-i="'+i+'">'+
      '<span class="d"></span><span class="x">'+
      '<b>'+esc(r.n)+'<em class="tg">'+TRACKN[r.k]+'</em></b>'+
      (desc&&r.so?'<small class="so">'+esc(r.so)+'</small>':'')+
      '<small class="src">'+(r.lid?'수업 · '+esc(r.lt):esc(r.lt)+' · 수업 준비 중')+(r.pr?' '+prB(r):'')+'</small></span></button>';
  });
  if(!rows.length)
    html+='<div class="empty">'+scene("paper",56)+'<p>이 갈래에는 연도가 붙은 사건이 없어.</p></div>';
  html+='<p class="note" style="margin:18px 0 4px">여기까지가 Ⅰ단원 전체(8~63쪽) 흐름이야. '+
        '「설명 접기」를 누르면 사건 이름만 남아 — 이름만 보고 무슨 일이었는지 떠올려 보면 훨씬 잘 외워져.</p>';
  view.innerHTML=html;

  document.getElementById("tlh").onclick=function(){S.tlHide=!hide;save();vTimeline();};
  document.getElementById("tld").onclick=function(){S.tlDesc=!desc;save();vTimeline();};
  Array.prototype.forEach.call(view.querySelectorAll("#tlu .chip"),function(b){
    b.onclick=function(){TLU=b.dataset.u;vTimeline();};});
  /* 가린 연도는 눌러서 하나씩만 까 본다 — 전체를 다시 켜지 않아도 되게 */
  Array.prototype.forEach.call(view.querySelectorAll(".tly.hid b"),function(b){
    b.onclick=function(){b.textContent=b.dataset.y;b.parentNode.classList.remove("hid");};});
  Array.prototype.forEach.call(view.querySelectorAll(".tlr"),function(b){
    b.onclick=function(){var r=rows[+b.dataset.i]; if(!r.lid)return pop("수업은 아직이야 — 내신 실전에서 풀 수 있어"); jumpCard(r.lid,r.ci);};});
}

/* ══════════ 통치 ↔ 저항 대조표 ══════════
   Ⅰ단원은 「일제가 한 일(01)」과 「우리가 한 일(02·03)」이 나란히 놓인 단원이다.
   시험은 그 둘을 같은 시기에 겹쳐 놓고 묻는다. 그래서 연표와 같은 자료로
   시기 × 갈래 표를 세워 둔다 — 새로 적는 게 아니라 사실 카드에서 뽑아 쓴다 */
function vFacing(){
  var all=timeline(), rows=[];
  var by={};
  all.forEach(function(r,i){
    r._i=i;
    var k=eraOf(r.y)+"/"+r.k;

      '<b style="background:var(--teal-l);color:var(--ink)">우리가 한 일</b>을 나란히 놓았어. '+
      '시험은 「1920년대에 일제는 ○○을 했고 우리는 △△로 맞섰다」처럼 이 둘을 겹쳐서 물어. '+
      '아무 칸이나 누르면 그 수업으로 가.</p>';
  ERAS.forEach(function(e,ei){
    var ru=by[ei+"/rule"]||[], re=by[ei+"/resist"]||[], wo=by[ei+"/world"]||[], li=by[ei+"/life"]||[];
    if(!ru.length&&!re.length&&!wo.length&&!li.length)return;
    html+='<div class="tle"><b>'+e.n+'</b><span><b class="t">'+esc(e.t)+'</b>'+
          '<small>'+esc(e.d)+'</small></span></div>'+
      '<div class="face">'+
        '<div class="fcol rule"><h4>일제가 한 일 <i>'+ru.length+'</i></h4>'+
          ru.map(fchip).join("")+'</div>'+
        '<div class="fcol resist"><h4>우리가 한 일 <i>'+re.length+'</i></h4>'+
          re.map(fchip).join("")+'</div>'+
      '</div>'+
      (li.length?'<div class="fworld flife"><b>사회와 삶</b>'+li.map(fchip).join("")+'</div>':'')+
      (wo.length?'<div class="fworld"><b>바깥 세계</b>'+wo.map(fchip).join("")+'</div>':'');
  });
  html+='<p class="note" style="margin:18px 0 4px">한 칸이 비어 보이면 그 시기에 그쪽 사건이 적다는 뜻이야. '+
        '1910년대 오른쪽이 유난히 긴 건 3·1 운동과 임시 정부가 다 여기 걸리기 때문이고. '+
        '점선 칸은 아직 안 배운 수업이야.</p>';

/* ── 선지 섞기 ──
   원본 데이터는 정답이 대개 첫 칸에 적혀 있다(수업 퀴즈 80문항 · 2지선다 20장 전부, 내신 대부분).
   그대로 내면 「무조건 첫 번째」로 다 맞힌다. 그래서 낼 때마다 섞은 사본을 만든다.
   원본은 건드리지 않고, 고른 번호는 원본 번호로 되돌려 저장한다(오답 노트가 원본을 보므로).
   <보기> 조합형은 선지 대신 ㄱ~ㄹ 진술의 자리를 섞고, 정답 조합과 해설 속 ㄱ~ㄹ 도 따라 바꾼다 */
var BLBL=["ㄱ","ㄴ","ㄷ","ㄹ"];
function lblSet(s){ var o=[]; String(s).replace(/[ㄱㄴㄷㄹ]/g,function(ch){o.push(BLBL.indexOf(ch));}); return o.sort().join(","); }
function mixQ(q){
  if(!q||!q.c||q.a==null||q.type==="short")return q;
  var m={},k; for(k in q)m[k]=q[k];
  if(q.boki){
    var sets=q.c.map(lblSet), want=sets[q.a], n=q.boki.length;
    for(var t=0;t<40;t++){
      var P=shuffleArr(BLBL.slice(0,n).map(function(_,i){return i;}));   /* 새 자리 j 에 원래 P[j] */
      var inv=[]; P.forEach(function(o,j){inv[o]=j;});
      var ns=want.split(",").map(function(x){return inv[+x];}).sort().join(",");
      var na=sets.indexOf(ns);
      if(na<0)continue;                      /* 정답 조합이 선지에 없는 배치는 버린다 */
      m.boki=P.map(function(o){return q.boki[o];});
      m.a=na;
      m.e=String(q.e).replace(/[ㄱㄴㄷㄹ]/g,function(ch){var o=BLBL.indexOf(ch);return inv[o]!=null?BLBL[inv[o]]:ch;});
      m.back=sets.map(function(sk){
        var orig=sk.split(",").map(function(x){return P[+x];}).sort().join(",");
        var oi=sets.indexOf(orig); return oi<0?null:oi;
      });
      return m;
    }
    return q;
  }
  var idx=shuffleArr(q.c.map(function(_,i){return i;}));   /* 새 자리 j 에 원래 idx[j] */
  m.c=idx.map(function(i){return q.c[i];});
  m.a=idx.indexOf(q.a);
  m.back=idx;
  return m;
}
function unmix(m,i){ return (m&&m.back&&i!=null)?m.back[i]:i; }
function shuffleArr(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

var IDX=null, FQ="";
function buildIndex(){
  if(IDX)return IDX;
  IDX=[];
  LESSONS.forEach(function(l,li){
    IDX.push({t:"수업",lid:l.id,li:li,ci:0,head:l.title,body:l.hook});
    l.cards.forEach(function(c,ci){
      var head="",body="";
      if(c.t==="fact"){head=c.n+" · "+c.y+"년";body=c.b+" "+c.why+" "+c.so;}
      else if(c.t==="hint"){head=c.k;body=c.b;}
      else if(c.t==="chain"){head=c.title;body=c.items.join(" ");}
      else if(c.t==="compare"){head=c.title;body=c.l.n+" "+c.l.p.join(" ")+" "+c.r.n+" "+c.r.p.join(" ");}
      else if(c.t==="story"){head=c.h;body=c.b;}
      else if(c.t==="check"){head=c.q;body=c.a;}
      else if(c.t==="pick"){head=c.q;body=c.c.join(" ")+" "+c.e;}
      if(head||body)IDX.push({t:"수업",lid:l.id,li:li,ci:ci,head:head,body:body,sub:l.title});
    });
    l.quiz.forEach(function(q,qi){
      IDX.push({t:"퀴즈",lid:l.id,li:li,ci:-1,head:q.q,body:q.c.join(" ")+" "+q.e,sub:l.title,
        ans:q.c[q.a],ex:q.e});
    });
  });
  ESSAY.forEach(function(x){
    IDX.push({t:"서술형",wid:x.id,head:x.q,body:x.keys.join(" ")+" "+x.model,sub:UMAP[x.u].n});
  });
  NAMES.forEach(function(x){
    var cl=x.cl.map(stripTags);
    IDX.push({t:"인물·단체",head:x.n,body:cl.join(" ")+" "+x.e,sub:x.k+" · "+UMAP[x.u].n,ans:cl.join(" · "),ex:x.e});
  });
  EXAM.forEach(function(q){
    IDX.push({t:"내신",eid:q.id,head:q.q.split("\n")[0],
      body:(q.boki?q.boki.join(" "):"")+" "+q.c.join(" ")+" "+q.e,
      sub:UMAP[q.u].n, ans:(q.type==="short"?q.c[0]:q.c[q.a]), ex:q.e});
  });
  return IDX;
}
function strip(x){return String(x).replace(/<[^>]+>/g,"");}
function findHits(term){
  var t=term.trim().toLowerCase(); if(t.length<1)return [];
  return buildIndex().filter(function(r){
    return (strip(r.head)+" "+strip(r.body)).toLowerCase().indexOf(t)>=0;
  }).slice(0,60);
}
function hl(text,term){
  var s0=strip(text), i=s0.toLowerCase().indexOf(term.toLowerCase());
  if(i<0)return esc(s0.slice(0,80));
  var a=Math.max(0,i-26);
  return (a?"…":"")+esc(s0.slice(a,i))+"<mark>"+esc(s0.slice(i,i+term.length))+"</mark>"+
         esc(s0.slice(i+term.length,i+term.length+52))+"…";
}

        ? '<div class="empty">'+scene("paper",56)+'<p><b>'+esc(FQ)+'</b> 는 못 찾았어.<br>낱말을 줄여서 다시 쳐 봐.</p></div>'
        : '<div class="part">결과 '+hits.length+'개</div>'+hits.map(function(r,i){
            return '<button class="hit" data-i="'+i+'"><span class="hk '+(r.t==="내신"?"e":(r.t==="퀴즈"?"q":(r.t==="서술형"?"w":"c")))+'">'+r.t+'</span>'+
              '<span class="ht"><b>'+hl(r.head,FQ)+'</b>'+
              (r.body?'<small>'+hl(r.body,FQ)+'</small>':'')+
              (r.sub?'<i>'+esc(r.sub)+'</i>':'')+'</span></button>';
          }).join("")));
  var inp=document.getElementById("fIn");
  var run=function(){ FQ=inp.value; var pos=inp.selectionStart; vFind();
    var n=document.getElementById("fIn"); if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}} };
  var tmr=null;
  inp.addEventListener("input",function(){clearTimeout(tmr);tmr=setTimeout(run,220);});
  inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();clearTimeout(tmr);run();}});
  /* 찾기 창을 열면 바로 칠 수 있게 커서를 넣어 준다 */
  try{inp.focus({preventScroll:true});}catch(e){inp.focus();}
  var cl=document.getElementById("fClr"); if(cl)cl.onclick=function(){FQ="";vFind();};
  Array.prototype.forEach.call(view.querySelectorAll("#sug .chip"),function(b){
    b.onclick=function(){FQ=b.dataset.w;vFind();};

  Array.prototype.forEach.call(view.querySelectorAll(".hit"),function(b){

  });

{id:"x9c",u:"s9",type:"mc5",q:"윤봉길 의거의 결과로 옳은 것은?",c:["중국 국민당 정부가 한국 독립운동을 적극 지원하게 되었다.", "일제가 헌병 경찰제를 실시하였다.", "국민 대표 회의가 열렸다.", "신간회가 해소되었다.", "의열단이 조직되었다."],a:0,e:"한중 공동 항일 전선 구축에도 큰 영향을 주었다."},
{id:"x9d",u:"s9",type:"neg",q:"의열단에 대한 설명으로 옳지 않은 것은?",c:["김원봉 등이 만주 지린에서 조직하였다.", "김상옥이 종로 경찰서에 폭탄을 던졌다.", "나석주가 동양 척식 주식회사에 폭탄을 던졌다.", "단원들이 황푸 군관 학교에서 군사 훈련을 받았다.", "윤봉길이 상하이 훙커우 공원에서 의거를 일으켰다."],a:4,e:"윤봉길은 한인 애국단원이다."},
{id:"x9e",u:"s9",type:"short",q:"1932년 한인 애국단의 첫 거사로 도쿄에서 일왕의 마차에 폭탄을 던진 인물은?",c:["이봉창"],a:null,e:"이를 구실로 일제는 상하이를 침략하였다(상하이 사변)."},
{id:"x10a",u:"s10",type:"mc5",q:"다음 구호를 내세운 운동으로 옳은 것은?\n\n내 살림 내 것으로 · 조선 사람 조선 것",c:["물산 장려 운동", "민립 대학 설립 운동", "브나로드 운동", "형평 운동", "자치 운동"],a:0,e:"조만식의 주도로 평양에서 시작되었다."},
{id:"x10b",u:"s10",type:"neg",q:"실력 양성 운동에 대한 설명으로 옳지 않은 것은?",c:["물산 장려 운동은 토산품 애용과 근검저축을 주장하였다.", "민립 대학 설립 운동은 조선 민립 대학 기성회가 이끌었다.", "『조선일보』는 문자 보급 운동을 전개하였다.", "『동아일보』는 브나로드 운동을 전개하였다.", "민립 대학 설립 운동은 일제의 지원으로 대학 설립에 성공하였다."],a:4,e:"자연재해와 일제의 탄압으로 성과를 거두지 못하였다."},
{id:"x10c",u:"s10",type:"mc5",q:"다음 주장이 담긴 운동으로 옳은 것은?\n\n조선 내에서는 허용되는 범위 내에서 일대 정치적 결사를 조직해야 한다.",c:["자치 운동", "물산 장려 운동", "6·10 만세 운동", "신간회 창립", "민족 유일당 운동"],a:0,e:"이광수의 「민족적 경륜」(1924). 일제의 지배를 인정한 타협적 운동이다."},
{id:"x10d",u:"s10",type:"short",q:"러시아어로 '민중 속으로'라는 뜻으로, 1931년부터 『동아일보』가 전개한 농촌 계몽 운동은?",c:["브나로드 운동", "브나로드"],a:null,e:"학생과 청년이 농촌에서 글을 가르치고 미신 타파·근검절약을 강조하였다."},
{id:"x11a",u:"s11",type:"mc5",q:"다음 자료의 쟁의로 옳은 것은?\n\n지주 문재철 씨는 소작인회의 요구인 4할을 승낙하는 동시에 이천 원을 소작인회에 기부하기로 되었더라.",c:["암태도 소작 쟁의", "원산 총파업", "형평 운동", "6·10 만세 운동", "물산 장려 운동"],a:0,e:"1년여의 투쟁 끝에 소작료 인하를 이끌어 낸 대표적 소작 쟁의이다."},
{id:"x11b",u:"s11",type:"mc5",q:"원산 총파업에 대한 설명으로 옳은 것은?",c:["일본인 감독의 한국인 노동자 구타가 계기가 되었다.", "순종의 장례일에 일어났다.", "나주역의 한·일 학생 충돌이 계기가 되었다.", "백정에 대한 차별 철폐를 주장하였다.", "1년여의 투쟁 끝에 소작료 인하를 이끌어 냈다."],a:0,e:"4개월여 이어진 일제 강점기 최대 규모의 노동 운동이다."},
{id:"x11c",u:"s11",type:"boki",q:"1930년대 농민·노동 운동에 대한 설명으로 옳은 것을 <보기>에서 고른 것은?",boki:["혁명적 농민 조합과 혁명적 노동조합을 결성하였다.", "비합법적인 폭력 투쟁의 형태로 바뀌었다.", "일제와 타협하여 자치권을 얻으려 하였다.", "중일 전쟁 이후 더욱 활발해졌다."],c:["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"],a:0,e:"중일 전쟁 이후에는 일제의 강력한 탄압으로 위축되었다."},
{id:"x12a",u:"s12",type:"mc5",q:"다음 격문이 뿌려진 운동으로 옳은 것은?\n\n대한 독립 만세! 대한 독립운동가여 단결하라! 일체의 납세를 거부하자!",c:["6·10 만세 운동", "광주 학생 항일 운동", "3·1 운동", "원산 총파업", "물산 장려 운동"],a:0,e:"순종의 장례일(1926)에 일어났다."},
{id:"x12b",u:"s12",type:"mc5",q:"광주 학생 항일 운동에 대한 설명으로 옳은 것은?",c:["신간회가 진상 조사단을 파견하였다.", "순종의 장례일에 일어났다.", "민족 대표 33인이 독립 선언서를 발표하였다.", "조만식이 평양에서 주도하였다.", "고종의 서거가 계기가 되었다."],a:0,e:"3·1 운동 이후 최대 규모의 항일 민족 운동이다(1929)."},
{id:"x12c",u:"s12",type:"neg",q:"6·10 만세 운동에 대한 설명으로 옳지 않은 것은?",c:["순종의 장례일에 일어났다.", "사회주의 계열과 천도교가 준비하였다.", "준비 과정이 사전에 발각되었다.", "민족 협동 전선의 공감대 형성에 영향을 주었다.", "전국으로 확산되어 3·1 운동보다 큰 규모가 되었다."],a:4,e:"전국적 시위로 확대되지는 못하였다."},
{id:"x13a",u:"s13",type:"mc5",q:"다음 강령을 내건 단체로 옳은 것은?\n\n• 우리는 정치적·경제적 각성을 촉진함.\n• 우리는 단결을 공고히 함.\n• 우리는 기회주의를 일체 부인함.",c:["신간회", "근우회", "의열단", "조선 형평사", "한인 애국단"],a:0,e:"'기회주의'는 자치 운동 같은 타협론을 가리킨다."},
{id:"x13b",u:"s13",type:"boki",q:"신간회에 대한 설명으로 옳은 것을 <보기>에서 고른 것은?",boki:["비타협적 민족주의자와 사회주의자가 함께 창립하였다.", "광주 학생 항일 운동의 진상 조사단을 파견하였다.", "비밀 결사로 조직되어 105인 사건으로 해체되었다.", "자치 운동을 적극 지지하였다."],c:["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"],a:0,e:"ㄷ은 신민회. 신간회는 합법 단체이고 자치 운동을 배격했다."},
{id:"x13c",u:"s13",type:"order",q:"다음 사건을 일어난 순서대로 바르게 나열한 것은?\n(가) 신간회 창립  (나) 정우회 선언  (다) 신간회 해소  (라) 제1차 국공 합작",c:["(라)-(나)-(가)-(다)", "(나)-(라)-(가)-(다)", "(라)-(가)-(나)-(다)", "(가)-(나)-(라)-(다)", "(나)-(가)-(라)-(다)"],a:0,e:"국공 합작(1924) → 정우회 선언(1926) → 신간회(1927) → 해소(1931)."},
{id:"x13d",u:"s13",type:"short",q:"사회주의 진영이 민족주의 진영과 손잡자고 밝힌 1926년의 선언은?",c:["정우회 선언", "정우회선언"],a:null,e:"이듬해 신간회 창립으로 이어졌다."},
{id:"x14a",u:"s14",type:"mc5",q:"일제 강점기 도시의 변화로 옳은 것은?",c:["한국인 거주지와 일본인 거주지가 구분되었다.", "도시 기반 시설이 한국인 거주지에 집중되었다.", "토막촌이 모두 사라졌다.", "서울의 집세가 일본 도시보다 쌌다.", "한국인 노동자 대부분이 고급 기술자였다."],a:0,e:"수도·전기·도로는 일본인 거주지에 잘 갖추어졌다."},
{id:"x14b",u:"s14",type:"neg",q:"일제 강점기 국외 이주 동포의 고난으로 옳지 않은 것은?",c:["관동 대지진 때 재일 한국인이 학살되었다.", "간도 참변 때 한인 마을이 초토화되었다.", "연해주 한인이 중앙아시아로 강제 이주되었다.", "많은 한국인이 추위와 굶주림으로 강제 이주 중 숨졌다.", "연해주 한인의 강제 이주는 일제가 주도하였다."],a:4,e:"연해주 한인의 강제 이주(1937)는 소련이 주도하였다."},
{id:"x14c",u:"s14",type:"mc5",q:"1930년대 일제가 농민 생활 개선을 내세워 벌였지만 농촌 통제 강화로 이어진 운동은?",c:["농촌 진흥 운동", "브나로드 운동", "물산 장려 운동", "문자 보급 운동", "산미 증식 계획"],a:0,e:"빈곤의 책임을 농민에게 돌리며 절약·저축·근면을 강조하였다."},
{id:"x15a",u:"s15",type:"mc5",q:"다음 취지문을 발표한 단체로 옳은 것은?\n\n계급을 타파하고 모욕적 칭호를 폐지하며 교육을 장려하여 우리도 참다운 인간이 되고자 함이 우리의 주장이다.",c:["조선 형평사", "근우회", "천도교 소년회", "신간회", "조선어 학회"],a:0,e:"백정에 대한 차별 철폐를 위해 진주에서 창립되었다(1923)."},
{id:"x15b",u:"s15",type:"mc5",q:"근우회에 대한 설명으로 옳은 것은?",c:["민족주의·사회주의 계열 여성 단체가 통합하여 창립하였다.", "방정환이 어린이날 제정을 주도하였다.", "백정에 대한 차별 철폐를 주장하였다.", "한글 맞춤법 통일안을 제정하였다.", "조만식이 평양에서 시작하였다."],a:0,e:"신간회 결성을 계기로 창립되었다(1927). 기관지 『근우』."},
{id:"x15c",u:"s15",type:"short",q:"천도교 소년회를 이끌며 '어린이'라는 말을 보급하고 잡지 『어린이』를 펴낸 인물은?",c:["방정환"],a:null,e:"어린이날 제정에도 앞장섰다."},
{id:"x16a",u:"s16",type:"mc5",q:"다음 주장을 편 역사학자로 옳은 것은?\n\n우리 조선의 역사적 발전의 전 과정은 …… 세계사적 일원론적 역사 법칙에 의해 다른 민족과 거의 같은 궤도로 발전 과정을 거쳐 왔다.",c:["백남운", "박은식", "신채호", "정인보", "주시경"],a:0,e:"사회 경제 사학 — 식민 사관의 정체성론을 반박하였다."},
{id:"x16b",u:"s16",type:"boki",q:"조선어 학회에 대한 설명으로 옳은 것을 <보기>에서 고른 것은?",boki:["한글 맞춤법 통일안을 제정하였다.", "『조선말 큰사전』 편찬을 추진하였다.", "『진단학보』를 발행하였다.", "『한국통사』를 저술하였다."],c:["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"],a:0,e:"ㄷ은 진단 학회, ㄹ은 박은식."},
{id:"x16c",u:"s16",type:"neg",q:"일제 강점기 민족 문화 수호 운동에 대한 설명으로 옳지 않은 것은?",c:["박은식은 '조선 국혼'을 강조하였다.", "신채호는 『조선상고사』를 저술하였다.", "정인보 등은 조선학 운동을 펼쳤다.", "실증 사학자들은 진단 학회를 조직하였다.", "백남운은 식민 사관의 타율성론을 계승하였다."],a:4,e:"백남운은 보편적 발전 법칙으로 정체성론을 반박하였다."},
{id:"x16d",u:"s16",type:"mc5",q:"식민 사관 중 한국사가 사회적·경제적으로 발전 없이 정체되었다는 주장은?",c:["정체성론", "타율성론", "당파성론", "일선동조론", "내선일체론"],a:0,e:"타율성론 = 외세, 당파성론 = 단결 못 함."},

 model:"민족 대표 33인은 태화관에서 독립 선언식을 하고 스스로 잡혀갔으며, 탑골 공원에서는 학생과 시민이 독립 선언서를 낭독하고 만세 시위를 벌였다. 처음에는 서울 등 도시에서 학생·상인·노동자가 주도하였고, 이어 철도와 장터를 따라 농촌으로 퍼져 장날을 이용한 시위가 잇따랐다. 일제가 무자비하게 진압하자 일부 지역에서는 경찰 관서와 헌병대를 습격하는 무력 투쟁으로 발전하였으며, 화성 제암리에서는 일본군의 학살이 벌어졌다.",
 tip:"도시 → 농촌 → 무력화, 이 세 칸이 채점 기준이다."},
{id:"w12",u:"s6",q:"3·1 운동이 국내와 국외에 끼친 영향을 나누어 서술하시오.",
 keys:["대한민국 임시 정부","문화 통치","주체","5·4 운동","반제국주의"],
 model:"국내에서는 독립운동을 이끌 구심점이 필요하다는 것을 깨달아 대한민국 임시 정부 수립으로 이어졌고, 일제는 무단 통치를 이른바 문화 통치로 바꾸었다. 또 학생·농민·노동자·여성 등으로 민족 운동의 주체가 크게 넓어졌다. 국외에서는 중국의 5·4 운동 등에 영향을 주어 반제국주의 민족 운동으로 평가받는다.",
 tip:"국내 셋(임정·문화 통치·주체 확대), 국외 하나(5·4 운동)로 나눠 담는다."},

{id:"w13",u:"s7",q:"여러 곳에 세워진 임시 정부가 하나로 통합된 과정과 그 성격을 서술하시오.",
 keys:["대한 국민 의회","상하이","한성 정부","통합","삼권 분립","민주 공화제"],
 model:"3·1 운동 뒤 연해주에 대한 국민 의회, 상하이에 임시 정부, 국내에 한성 정부가 각각 세워졌다. 1919년 9월 한성 정부의 법통을 잇되 외교 활동에 유리한 상하이에 자리를 두기로 하여 대한민국 임시 정부로 통합되었다. 임시 의정원·국무원·법원의 삼권 분립에 바탕을 둔 우리 역사 최초의 민주 공화제 정부였다.",
 tip:"「법통은 한성, 위치는 상하이」 한 줄이면 통합 과정이 설명된다."},
{id:"w14",u:"s7",q:"대한민국 임시 정부의 활동을 쓰고, 국민 대표 회의가 열리게 된 배경을 서술하시오.",
 keys:["연통제","교통국","독립 공채","구미 위원부","독립신문","국민 대표 회의","창조파","개조파"],
 model:"임시 정부는 국내와 연결하기 위해 비밀 행정망인 연통제와 통신 기관인 교통국을 두었고, 독립 공채를 발행하여 자금을 모았다. 미국에 구미 위원부를 두어 외교 활동을 폈으며 독립신문을 펴내 소식을 알렸다. 그러나 연통제와 교통국이 일제에 발각되고 외교 활동도 뚜렷한 성과를 내지 못하면서 노선을 둘러싼 갈등이 커졌고, 1923년 국민 대표 회의가 열려 새 정부를 세우자는 창조파와 임시 정부를 고쳐 쓰자는 개조파가 맞섰다.",
 tip:"활동을 먼저 쭉 쓰고 「그러나」로 꺾어 배경을 잇는다."},

{id:"w15",u:"s8",q:"봉오동 전투와 청산리 대첩의 전개 과정을 서술하시오.",
 keys:["홍범도","대한 독립군","봉오동","훈춘 사건","김좌진","북로 군정서","청산리"],
 model:"1920년 홍범도가 이끄는 대한 독립군 등 연합 부대가 봉오동에서 일본군을 크게 무찔렀다. 일제는 훈춘 사건을 조작하여 대규모 병력을 만주에 투입하였고, 이에 맞서 김좌진의 북로 군정서와 홍범도 부대 등 연합 부대가 청산리 일대의 백운평·어랑촌 등지에서 여러 날 동안 싸워 큰 승리를 거두었다.",
 tip:"봉오동 → 훈춘 사건(구실) → 청산리, 가운데 고리를 빠뜨리지 않는다."},
{id:"w16",u:"s8",q:"간도 참변과 자유시 참변 이후 만주의 독립군이 어떻게 재정비되었는지 서술하시오.",
 keys:["간도 참변","자유시 참변","참의부","정의부","신민부","미쓰야 협정","3부 통합"],
 model:"청산리 대첩에 대한 보복으로 일제가 간도 참변을 일으켜 한인 동포를 학살하였다. 독립군은 러시아 자유시로 이동하였으나 지휘권을 둘러싼 다툼 끝에 자유시 참변으로 큰 피해를 입었다. 만주로 돌아온 독립군은 참의부·정의부·신민부의 3부로 정비되어 군사 활동과 함께 동포 사회를 다스리는 자치 기능까지 맡았다. 일제가 만주 군벌과 미쓰야 협정을 맺어 활동이 어려워지자 3부 통합 운동이 일어났다.",
 tip:"참변 둘 → 3부 → 미쓰야 협정 → 통합 운동, 사슬로 외운다."},
{id:"w17",u:"s8",q:"1930년대 만주에서 한중 연합 작전이 이루어진 배경과 그 활동을 서술하시오.",
 keys:["만주 사변","만주국","조선 혁명군","양세봉","영릉가","한국 독립군","지청천","쌍성보","대전자령"],
 model:"1931년 일제가 만주를 침략하고 이듬해 만주국을 세우자 중국 내에서 일본에 대한 반감이 높아졌다. 이에 만주의 독립군은 항일 중국군과 연합하여 무장 투쟁을 전개하였다. 남만주에서는 양세봉이 이끄는 조선 혁명군이 영릉가 전투 등에서 일본군을 격퇴하였고, 북만주에서는 지청천이 이끄는 한국 독립군이 쌍성보 전투와 대전자령 전투에서 승리하였다. 이후 일본군의 공세로 항일 중국군의 활동이 위축되면서 무장 투쟁도 큰 제약을 받았다.",
 tip:"남만주는 조선 혁명군·양세봉, 북만주는 한국 독립군·지청천. 짝으로 외운다."},
{id:"w18",u:"s8",q:"사회주의 계열의 만주 항일 무장 투쟁이 어떻게 전개되었는지 서술하시오.",
 keys:["중국 공산당","동북 인민 혁명군","동북 항일 연군","조국 광복회"],
 model:"중국 공산당이 만주 일대의 항일 유격대를 규합하여 동북 인민 혁명군을 편성하자 많은 한인 사회주의자도 이에 가담하였다. 동북 인민 혁명군은 이후 동북 항일 연군으로 발전하였으며, 여기에 소속된 한인 유격대원들은 민족주의자와 함께 조국 광복회를 조직하여 활동하였다.",
 tip:"인민 혁명군 → 항일 연군 → 조국 광복회. 이름이 바뀌는 순서가 곧 답이다."},
/* ── 교과서 34~63쪽 ── */
{id:"w19",u:"s9",q:"의열단과 한인 애국단의 활동을 비교하여 서술하시오.",
 keys:["김원봉", "조선 혁명 선언", "김구", "임시 정부", "윤봉길", "중국 국민당"],
 model:"의열단은 1919년 김원봉 등이 만주 지린에서 조직하여 신채호의 「조선 혁명 선언」을 활동 지침으로 삼았고, 김익상·김상옥·나석주 등이 조선 총독부·종로 경찰서·동양 척식 주식회사에 폭탄을 던졌다. 한인 애국단은 1931년 김구가 침체된 임시 정부에 활기를 불어넣으려고 조직하였으며, 이봉창이 도쿄에서 일왕의 마차에, 윤봉길이 상하이 훙커우 공원에서 폭탄을 던졌다. 윤봉길 의거는 중국 국민당 정부가 한국 독립운동을 적극 지원하는 계기가 되었다.",
 tip:"조직한 사람과 곳 → 대표 의거 → 결과 순으로 두 단체를 나란히 쓴다."},
{id:"w20",u:"s10",q:"물산 장려 운동이 일어난 배경과 전개, 한계를 서술하시오.",
 keys:["관세", "조만식", "평양", "토산품", "폭등", "사회주의자"],
 model:"조선 총독부가 한국과 일본 사이의 관세를 없애려 하자 위기를 느낀 한국인 자본가들이 민족 산업을 지키려고 물산 장려 운동을 벌였다. 조만식의 주도로 평양에서 시작하여 전국으로 퍼졌고, '내 살림 내 것으로', '조선 사람 조선 것'을 내세워 토산품 애용과 근검저축, 금주·단연을 주장하였다. 그러나 수요에 비해 공급이 부족하고 일부 상인의 농간이 더해져 상품 가격이 폭등하였으며, 일부 사회주의자는 자본가 계급의 이익만을 도모하는 운동이라고 비판하였다.",
 tip:"배경(관세 철폐) · 전개(조만식, 구호) · 한계(값 폭등, 비판) 세 칸을 채운다."},
{id:"w21",u:"s11",q:"1920년대와 1930년대 농민·노동 운동의 차이를 서술하시오.",
 keys:["소작 쟁의", "암태도", "원산 총파업", "대공황", "혁명적", "비합법"],
 model:"1920년대에는 농민이 소작료 인하와 소작권 이동 반대를 요구하며 소작 쟁의를, 노동자가 임금 인상과 노동 시간 단축을 요구하며 노동 쟁의를 벌였다. 암태도 소작 쟁의와 원산 총파업이 대표적이며, 쟁의는 점차 항일 투쟁으로 바뀌었다. 1930년대에는 대공황으로 생활이 더 어려워지자 사회주의 세력과 연대하여 혁명적 농민 조합과 혁명적 노동조합을 결성하고 비합법적 폭력 투쟁을 벌여 반제국주의 항일 투쟁의 성격을 띠었다.",
 tip:"「생존권 투쟁 → 반제국주의 항일 투쟁」으로 바뀌었다는 한 줄이 답의 뼈대다."},
{id:"w22",u:"s12",q:"6·10 만세 운동과 광주 학생 항일 운동의 계기와 의의를 서술하시오.",
 keys:["순종", "사회주의", "천도교", "나주역", "신간회", "최대 규모"],
 model:"6·10 만세 운동은 1926년 순종의 장례일을 계기로 일어났다. 사회주의 계열과 천도교 등이 준비하다 사전에 발각되었으나 학생들이 만세 시위를 벌였고, 준비 과정의 연대 경험은 민족 협동 전선의 공감대를 만들었다. 광주 학생 항일 운동은 1929년 나주역에서 일어난 한·일 학생 충돌을 계기로 일어났으며, 신간회가 진상 조사단을 파견하는 등 진상을 알리면서 전국으로 확산되어 3·1 운동 이후 최대 규모의 항일 민족 운동이 되었다.",
 tip:"두 운동 모두 「계기 → 의의」 두 문장씩. 신간회가 들어가는 쪽은 광주다."},
{id:"w23",u:"s13",q:"신간회의 창립 배경과 활동, 해소 과정을 서술하시오.",
 keys:["자치 운동", "정우회 선언", "비타협적", "기회주의", "광주 학생", "해소"],
 model:"일부 민족주의자가 자치 운동으로 일제와 타협하려 하자 비타협적 민족주의자들이 이를 비판하였고, 사회주의 진영도 정우회 선언으로 민족주의 진영과의 제휴를 밝혔다. 그 결과 1927년 비타협적 민족주의자와 사회주의자가 함께 신간회를 창립하였다. 신간회는 '기회주의를 일체 부인함'을 강령으로 삼아 강연회를 열고 소작·노동 쟁의와 동맹 휴학을 지원하였으며, 광주 학생 항일 운동 때 진상 조사단을 파견하였다. 그러나 새 집행부의 타협적 태도와 국제 공산주의 운동의 노선 변화로 1931년 해소되었다.",
 tip:"배경 두 가지(자치 운동 비판, 정우회 선언)를 먼저 쓰면 나머지가 저절로 따라온다."},
{id:"w24",u:"s14",q:"일제 강점기 식민지 도시화의 특징을 서술하시오.",
 keys:["철도", "군산", "공업", "한국인 거주지", "일본인 거주지", "토막촌"],
 model:"일제의 침략과 식민지 지배 정책에 따라 도시화가 진행되었다. 철도역이 들어선 대전·신의주가 신흥 도시로, 쌀을 반출하던 군산·목포가 항구 도시로, 식민지 공업화 정책에 따라 함흥·청진이 공업 도시로 성장하였다. 도시는 한국인 거주지와 일본인 거주지로 구분되었고, 수도·전기·도로 같은 기반 시설은 일본인 거주지에 잘 갖추어졌다. 한국인 도시민은 비싼 물가와 주택난에 시달렸으며 극빈자가 사는 토막촌이 형성되었다.",
 tip:"「어떤 도시가 왜 컸나」와 「도시 안에서 누가 누렸나」 두 갈래로 쓴다."},

function e2init(){
  if(!S.exam)S.exam={best:0,runs:0,typeN:{},typeOk:{}};
  if(!S.exam.typeN)S.exam.typeN={};
  if(!S.exam.typeOk)S.exam.typeOk={};
}
function normKo(x){return String(x).toLowerCase().replace(/[\s·.,'"‘’“”()\-–—]/g,"");}
function shortOk(input,accept){
  var v=normKo(input); if(!v)return false;
  return accept.some(function(a){return normKo(a)===v;});
}

/* ── 채점 ── */
function gradeExam(){
  e2init();
  var ok=0,byType={};
  X.q.forEach(function(q){
    var a=X.ans[q.id],good;
    if(q.type==="short")good=a!=null&&shortOk(a,q.c);
    else good=a===q.a;
    if(good)ok++; else wAdd("EXAM","e",q.id,q.type==="short"?null:unmix(q,a));
    if(good)wClear("EXAM","e",q.id);
    var t=byType[q.type]||(byType[q.type]={n:0,ok:0});
    t.n++; if(good)t.ok++;
    S.exam.typeN[q.type]=(S.exam.typeN[q.type]||0)+1;
    if(good)S.exam.typeOk[q.type]=(S.exam.typeOk[q.type]||0)+1;
  });
  var score=Math.round(ok/X.q.length*100);
  X.score=score; X.ok=ok; X.byType=byType;
  X.best=score>S.exam.best;
  if(X.best)S.exam.best=score;
  S.exam.runs++; markDay(); save();
  go("examResult",null,true);
}
function weakType(){
  e2init();
  var worst=null,wr=2;
  Object.keys(S.exam.typeN).forEach(function(t){
    if(S.exam.typeN[t]<3)return;
    var r=(S.exam.typeOk[t]||0)/S.exam.typeN[t];
    if(r<wr){wr=r;worst=t;}
  });
  return wr<0.8?worst:null;
}

/* ── 결과 ── */

  rates.sort(function(a,b){return a.r-b.r||b.n-a.n;});
  var cand=rates.filter(function(x){return x.n>=2;});   /* 한 문항만 틀린 걸 약점이라 하진 않는다 */

    (wrongs.length

function vEssayRun(a){

  h+=nextBtnW(nx?"다음 문항":"목록으로",function(){
    W=null; if(nx)go("essayRun",{id:nx.id},true); else go("essay",null,true);
  });
  view.innerHTML=h;
  Array.prototype.forEach.call(view.querySelectorAll("#wk .wkey"),function(b){
    b.onclick=function(){
      var k=x.keys[+b.dataset.i];
      W.hit[k]=!W.hit[k];

/* 모범 답안에서 핵심어를 짚어 준다 — 빠뜨린 것은 빨갛게 */
function wmark(x){
  var out=esc(x.model);
  x.keys.forEach(function(k){
    k.split("|").forEach(function(one){
      var t=esc(one);
      if(out.indexOf(t)<0)return;
      out=out.split(t).join('<em class="wk '+(W.hit[k]?"on":"off")+'">'+t+'</em>');
    });
  });
  return out;
}
function wsave(x){
  var got=x.keys.filter(function(k){return W.hit[k];}).length;
  var r=S.essay[x.id]||{best:0,tot:x.keys.length};
  r.tot=x.keys.length; r.last=got; r.at=Date.now();
  if(got>r.best)r.best=got;
  S.essay[x.id]=r; save(); markDay();
}

/* 카드 본문에 k 가 들어 있는 첫 카드. 못 찾으면 수업 첫 장 */
function prFind(lid,k){
  var l=LMAP[lid]; if(!l||!k)return 0;
  for(var i=0;i<l.cards.length;i++)if(JSON.stringify(l.cards[i]).indexOf(k)>=0)return i;
  return 0;
}
function prGo(x){ return x.l?'<button class="prgo" data-l="'+x.l+'" data-k="'+esc(x.k||"")+'">'+esc(LMAP[x.l].title)+' 수업에서 보기 '+IC.chev+'</button>':''; }
function prUnit(u){ return u&&UMAP[u]?'<span class="pru">'+esc(UMAP[u].n)+'</span>':''; }
/* 수업 카드에 붙는 표시 — 프린트에서 보충했는지, 교과서엔 아예 없는지 */
function prB(c){
  if(!c||!c.pr)return "";

}

function nRand(seed){
  var h=2166136261; for(var i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619);}
  return function(){h+=0x6D2B79F5;var t=h;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);
    return ((t^(t>>>14))>>>0)/4294967296;};
}
function nOpts(key){
  var p=key.split("|"),x=NMAP[p[0]],dir=p[1]; if(!x)return null;
  var R=nRand(key);
  /* 헷갈리는 짝(같은 묶음) → 같은 단원 → 가까운 단원 순으로 보기를 고른다 */
  var xt=x.cl.map(stripTags).join(" ");
  var cand=NAMES.filter(function(y){return y.k===x.k&&y.id!==x.id&&
      xt.indexOf(y.n)<0&&y.cl.map(stripTags).join(" ").indexOf(x.n)<0;}).map(function(y){
    var sh=y.g.some(function(g){return x.g.indexOf(g)>=0;});
    return {y:y,s:(sh?0:y.u===x.u?1:2+Math.abs(NUIX[y.u]-NUIX[x.u]))+R()*0.9};
  }).sort(function(a,b){return a.s-b.s;});
  var ci=Math.floor(R()*x.cl.length), ans=dir==="n"?x.cl[ci]:x.n, c=[ans], seen={};
  seen[stripTags(ans)]=1;
  /* 이름→설명: 정답의 핵심어(굵은 낱말)나 이름이 든 설명은 보기로 쓰지 않는다 — 그것도 맞는 말이 될 수 있어서 */
  var terms=[x.n]; x.cl.forEach(function(t){(t.match(/<b>(.*?)<\/b>/g)||[]).forEach(function(b){terms.push(stripTags(b));});});
  for(var i=0;i<cand.length&&c.length<4;i++){
    var y=cand[i].y, o=dir==="n"?y.cl[Math.floor(R()*y.cl.length)]:y.n, ot=stripTags(o);
    if(seen[ot])continue;
    if(dir==="n"&&terms.some(function(t){return ot.indexOf(t)>=0;}))continue;
    seen[ot]=1; c.push(o);
  }

}

    '<div class="sub">한 번에 맞힌 카드'+(R.ok2?' · 다시 나와서 맞힌 카드 '+R.ok2+'장':'')+'</div></div>';
  if(R.wr.length)h+='<div class="part">이번 판에서 틀렸던 것</div>'+R.wr.map(function(k){
      var x=NMAP[k.split("|")[0]]; if(!x)return "";
      return '<div class="wcard"><div class="wq"><b>'+esc(x.n)+'</b> <small class="nk">'+x.k+'</small></div><div class="wex">'+esc(x.e)+'</div></div>';}).join("");
  h+='<p class="note" style="margin:12px 0 0">외운 것 '+nKnown()+' / '+NAMES.length+
    (R.wr.length?' · 틀렸던 카드는 오답 노트에도 들어갔어.':'')+'</p>'+
    '<div class="sticky"><div class="row">'+
    (R.wr.length?'<button class="cta ghost" id="nagain2">틀린 것만 한 판 더</button>':'<button class="cta ghost" id="nhome">처음으로</button>')+
    '<button class="cta" id="nnext">새 판 20장</button></div></div>';
  view.innerHTML=h;
  var wr=R.wr.slice();
  var a=view.querySelector("#nagain2"); if(a)a.onclick=function(){nDeal(wr);NR=null;vNRun();};
  var hm=view.querySelector("#nhome"); if(hm)hm.onclick=function(){S.nrun=null;save();go("names",null,true);};
  view.querySelector("#nnext").onclick=function(){nDeal();NR=null;vNRun();};
}

VIEWS={home:vHome,lesson:vLesson,review:vReview,wrong:vWrong,wquiz:vWQuiz,due:vDue,find:vFind,
       exam:vExamPick,examRun:vExamRun,examResult:vExamResult,
       essay:vEssayPick,essayRun:vEssayRun,print:vPrint,names:vNames,nrun:vNRun};

/* ═══════════════════════════════════════════
   HANSA OS — 데스크톱 크롬 (시계 · 독 · 창 제목)
   앱 로직은 건드리지 않고 겉모습만 얹는다
   ═══════════════════════════════════════════ */
(function(){
  /* ── 상단 바 시계 ── */
  var DOW=["SUN","MON","TUE","WED","THU","FRI","SAT"];
  function tick(){
    var d=new Date(),h=d.getHours(),ap=h<12?"AM":"PM",hh=h%12||12;
    var el=document.getElementById("clk");
    if(el)el.textContent=DOW[d.getDay()]+" "+String(hh).padStart(2,"0")+":"+
      String(d.getMinutes()).padStart(2,"0")+ap+" "+d.getFullYear();
  }
  tick(); setInterval(tick,20000);

  /* ── 독 아이콘: 전부 인라인 SVG로 그린 픽셀 장치 ── */
  function px(rects){
    return '<svg width="30" height="30" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">'+
      rects.map(function(r){return '<rect x="'+r[0]+'" y="'+r[1]+'" width="'+r[2]+'" height="'+r[3]+'" fill="'+r[4]+'"/>';}).join("")+'</svg>';
  }
  var K="#2B1F33", W="#FBF3E2", Y="#F5C63C", R="#D2453B", T="#2F8C7E", B="#3D6BB5", O="#E0812C";
  var ICONS={
    /* 책 = 수업 */
    home:px([[2,2,12,12,K],[3,3,10,10,W],[7,3,2,10,K],[4,5,3,1,K],[4,7,3,1,K],[9,5,3,1,K],[9,7,3,1,K]]),
    /* 디스켓 + X = 오답 노트 */
    wrong:px([[2,2,12,12,K],[3,3,10,10,R],[5,3,6,4,W],[6,9,4,4,W],[6,10,1,1,K],[9,10,1,1,K],[7,11,2,1,K]]),
    /* 시험지 = 내신 */
    exam:px([[3,1,10,14,K],[4,2,8,12,W],[5,4,6,1,B],[5,6,6,1,K],[5,8,6,1,K],[5,10,4,1,K],[10,11,2,2,Y]]),
    /* 카세트 = 복습 */
    review:px([[2,4,12,8,K],[3,5,10,6,Y],[5,6,2,2,K],[9,6,2,2,K],[4,9,8,1,K],[7,6,2,2,W]])
  };
  var DOCK=[
    {k:"home",   n:"LESSON", go:function(){ stack=[{n:"home"}]; render(); }},
    {k:"wrong",  n:"WRONG",  go:function(){ if(stack[stack.length-1].n!=="wrong")go("wrong"); }},
    {k:"exam",   n:"EXAM",   go:function(){ if(stack[stack.length-1].n!=="exam")go("exam"); }},
    {k:"review", n:"REVIEW", go:function(){ if(stack[stack.length-1].n!=="review")go("review"); }}
  ];
  var VIEW_OF={home:"home",lesson:"home",due:"home",find:"home",wrong:"wrong",wquiz:"wrong",
               exam:"exam",examRun:"exam",examResult:"exam",review:"review"};
  var PATH={home:"/HOME",lesson:"/LESSON",review:"/REVIEW",wrong:"/WRONG",
            due:"/REVIEW/DUE",find:"/FIND",
            wquiz:"/WRONG/RETRY",exam:"/EXAM",examRun:"/EXAM/RUN",examResult:"/EXAM/RESULT",
            essay:"/ESSAY",essayRun:"/ESSAY/RUN",print:"/PRINT",names:"/NAMES",nrun:"/NAMES/RUN"};

  var dockEl=document.getElementById("dock");
  function paintDock(){
    var cur=VIEW_OF[stack[stack.length-1].n]||"home";
    var wc=(typeof wCount==="function")?wCount():0;
    var dueN=(typeof dueList==="function")?dueList().length:0;
    dockEl.innerHTML=DOCK.map(function(d){
      return '<button class="dk" data-k="'+d.k+'" aria-current="'+(d.k===cur)+'">'+
        '<span class="ico">'+ICONS[d.k]+
          (d.k==="wrong"&&wc?'<span class="badge">'+(wc>99?"99":wc)+'</span>':'')+
          (d.k==="home"&&dueN?'<span class="badge due">'+(dueN>99?"99":dueN)+'</span>':'')+'</span>'+
        '<span class="lb">'+d.n+'</span></button>';
    }).join("");
    Array.prototype.forEach.call(dockEl.querySelectorAll(".dk"),function(b){
      b.onclick=function(){
        var d=DOCK.filter(function(x){return x.k===b.dataset.k;})[0];
        if(d)d.go();
      };
    });
  }

  /* 창 제목을 경로 형식으로. 기존 render 는 건드리지 않고 감싼다 */
  var _render=render;
  render=function(){
    _render();
    var s=stack[stack.length-1], p=PATH[s.n]||"/";
    if(s.n==="lesson"&&s.a){ var i=LESSONS.indexOf(LMAP[s.a.id]); p="/LESSON/"+String(i+1).padStart(2,"0"); }
    titleReal.textContent=p;
    paintDock();
  };
  VIEWS_RENDER_PATCHED=true;
  document.getElementById("theme").onclick=function(){ stack=[{n:"home"}]; render(); };
  document.getElementById("find").onclick=function(){
    if(stack[stack.length-1].n!=="find"){ FQ=""; go("find"); }
  };

  /* ── 키보드: PC 에서 숫자키로 답을 고른다 ── */
  document.addEventListener("keydown",function(e){
    var tag=(e.target.tagName||"").toLowerCase();
    if(tag==="input"||tag==="textarea"){
      /* 글 치는 중엔 단축키를 막되, Esc 만은 통하게 — 찾기 창에서 손 뗄 길이 있어야 한다 */
      if(e.key==="Escape"){ e.target.blur();
        if(e.target.id==="fIn"){ stack=[{n:"home"}]; render(); } }
      return;
    }
    if(e.metaKey||e.ctrlKey||e.altKey)return;
    var k=e.key;
    if(k==="Escape"){ if(document.querySelector(".modal"))document.querySelector(".modal").remove();
      else { stack=[{n:"home"}]; render(); } return; }
    if(k==="/"){ e.preventDefault(); FQ=""; go("find"); return; }
    if(/^[1-5]$/.test(k)){
      var sel=view.querySelectorAll("#opts .qopt:not([disabled]), .opts5 .o5, .two .tw:not([disabled]), #oxr .ox");
      var b=sel[+k-1]; if(b){ e.preventDefault(); b.click(); } return;
    }
    if(k==="Enter"||k===" "){
      var nx=document.getElementById("nx")||document.getElementById("next")||
             document.getElementById("submit")||document.getElementById("kchk")||
             document.getElementById("chk")||document.getElementById("wsub");
      if(nx){ e.preventDefault(); nx.click(); }
      return;
    }
    if(k==="ArrowLeft"){ var pv=document.getElementById("prev"); if(pv&&!pv.disabled)pv.click(); }
    if(k==="ArrowRight"){ var nn=document.getElementById("next"); if(nn)nn.click(); }
  });
  render();
})();

</script>
