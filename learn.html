<title>한국사 첫 수업</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2B1F33">
<meta name="apple-mobile-web-app-title" content="한국사 첫 수업">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontCss" rel="stylesheet" media="print" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Do+Hyeon&family=Gothic+A1:wght@400;700;800&display=swap">

<style>
/* ══════════════════════════════════════════════════════════════
   HANSA OS — 1985년식 픽셀 데스크톱. 단일 세계관이라 테마 전환 없이
   모든 색을 직접 칠한다.
   ══════════════════════════════════════════════════════════════ */
:root{
  --desk:#6E5A7D; --desk-d:#4A3B57; --desk-l:#8A7399;
  --cream:#FBF3E2; --panel:#F2E5C9; --panel-d:#E3D2AE;
  --ink:#2B1F33; --ink-2:#5A4A66; --ink-3:#6E5C7A;
  --yel:#F5C63C; --yel-d:#C89A18;
  --org:#E0812C; --org-d:#B25F14;
  --red:#D2453B; --red-l:#F6DAD6;
  --teal:#2F8C7E; --teal-l:#D6EDE7;
  --blue:#3D6BB5; --blue-l:#DCE5F5;
  --f-px:"Press Start 2P","Courier New",monospace;
  --f-h:"Do Hyeon","Gothic A1",sans-serif;
  --f-b:"Gothic A1","Apple SD Gothic Neo",system-ui,sans-serif;
  --bd:3px; --sh:4px;
  /* 인라인 SVG(나무·장면·도장)가 쓰던 옛 이름을 새 팔레트로 잇는다 */
  --jade:#2F8C7E; --jade-d:#1D5C52; --blue-d:#2A4D85; --red-d:#B0342C; --ochre:#E0812C; --line2:#8B7A96;
  --bg2:#F2E5C9; --tx:#2B1F33; --tx2:#5A4A66; --f-d:"Do Hyeon","Gothic A1",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  border-radius:0!important;image-rendering:pixelated}
html,body{height:100%}
body{
  background:var(--desk);
  background-image:
    repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 2px,transparent 2px 4px),
    linear-gradient(160deg,var(--desk-l) 0%,var(--desk) 45%,var(--desk-d) 100%);
  background-attachment:fixed;
  color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.7;
  word-break:keep-all;overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;font-family:var(--f-b)}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── 데스크톱 상단 바 ── */
.osbar{position:sticky;top:0;z-index:60;background:var(--ink);color:var(--cream);
  display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:var(--bd) solid #150E1B;
  font-family:var(--f-px);font-size:9px;letter-spacing:.04em}
.osbar .logo{display:inline-flex;gap:2px;flex-shrink:0}
.osbar .logo i{width:4px;height:12px;display:block;transform:skewX(-18deg)}
.osbar .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.osbar .clk{flex-shrink:0;color:var(--yel)}
@media(max-width:400px){.osbar{font-size:8px;gap:7px}}

/* ── 셸: 데스크톱 위의 창 + 독 ── */
#app{max-width:1000px;margin:0 auto;padding:12px;display:grid;gap:12px;
  grid-template-columns:1fr;min-height:100dvh;align-content:start}
@supports not (height:100dvh){#app{min-height:100vh}}
@media(min-width:820px){#app{grid-template-columns:1fr 108px;padding:16px}}

.win{background:var(--cream);border:var(--bd) solid var(--ink);
  box-shadow:var(--sh) var(--sh) 0 rgba(21,14,27,.55);display:flex;flex-direction:column;min-width:0}

/* 창 제목 표시줄 */
.bar{background:var(--ink);color:var(--cream);display:flex;align-items:center;gap:8px;
  padding:6px 7px;border-bottom:var(--bd) solid var(--ink);flex-shrink:0}
.bar .ttl{flex:1;min-width:0;font-family:var(--f-px);font-size:9.5px;letter-spacing:.03em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:5px 7px;background:repeating-linear-gradient(90deg,#3B2C47 0 3px,transparent 3px 6px)}
.ib{width:30px;height:30px;flex-shrink:0;background:var(--panel);border:2px solid var(--ink);
  position:relative;
  box-shadow:inset -2px -2px 0 var(--panel-d),inset 2px 2px 0 #fff;
  display:grid;place-items:center;color:var(--ink);font-family:var(--f-px);font-size:9px}
.ib::after{content:"";position:absolute;inset:-8px}   /* 눈에 보이는 크기는 30px, 손가락 영역은 46px */
.ib:active{box-shadow:inset 2px 2px 0 var(--panel-d);transform:translate(1px,1px)}

.view{flex:1;display:flex;flex-direction:column;padding:14px;min-width:0}
@media(min-width:560px){.view{padding:18px}}

/* ── 독 (넓은 화면: 오른쪽 · 좁은 화면: 아래 작업 표시줄) ── */
.dock{display:flex;gap:8px;order:2}
/* 넓은 화면에서 독은 세로. align-self 를 안 주면 격자 칸 높이만큼 늘어나 아이콘이 흩어진다 */
@media(min-width:820px){.dock{flex-direction:column;order:0;position:sticky;top:56px;align-self:start}
  .dk{flex:0 0 auto}}
@media(max-width:819px){
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--ink);
    border-top:var(--bd) solid #150E1B;padding:6px;justify-content:center;
    padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
  #app{padding-bottom:84px}
}
.dk{flex:1;max-width:96px;background:transparent;display:flex;flex-direction:column;
  align-items:center;gap:4px;padding:4px 2px;min-height:44px}
.dk .ico{width:46px;height:46px;border:2px solid var(--ink);background:var(--panel);
  box-shadow:inset -3px -3px 0 rgba(43,31,51,.22),inset 3px 3px 0 rgba(255,255,255,.75);
  display:grid;place-items:center;position:relative}
.dk .lb{font-family:var(--f-px);font-size:7px;letter-spacing:.02em;color:var(--cream);
  text-align:center;line-height:1.5}
@media(min-width:820px){.dk .lb{color:var(--cream)}}
.dk[aria-current="true"] .ico{background:var(--yel);box-shadow:inset -3px -3px 0 var(--yel-d),inset 3px 3px 0 #FFF0B8}
.dk[aria-current="true"] .lb{color:var(--yel)}
.dk:active .ico{transform:translate(1px,1px)}
.dk .badge{position:absolute;top:-7px;right:-7px;min-width:19px;height:19px;background:var(--red);
  border:2px solid var(--ink);color:#fff;font-family:var(--f-px);font-size:7px;
  display:grid;place-items:center;padding:0 2px}

/* ── 공통 픽셀 부품 ── */
.card,.hero,.paper,.wcard,.rv,.sum,.peek,.wsum,.exbar,.wbar,.mbar,.lsn,.tlr{
  background:var(--cream);border:var(--bd) solid var(--ink);box-shadow:var(--sh) var(--sh) 0 rgba(43,31,51,.28)}
.card{padding:16px 15px;margin-bottom:0;animation:in .18s steps(3)}
@keyframes in{from{opacity:0;transform:translate(0,6px)}to{opacity:1;transform:none}}
.card + .card{margin-top:12px}

/* 버튼 — 눌리는 느낌이 핵심 */
.cta,.chip,.tw,.qopt,.o5,.ans,.ob{
  border:var(--bd) solid var(--ink);background:var(--panel);color:var(--ink);
  box-shadow:inset -3px -3px 0 rgba(43,31,51,.2),inset 3px 3px 0 rgba(255,255,255,.85),
             var(--sh) var(--sh) 0 rgba(43,31,51,.28);
  transition:none;font-weight:700}
.cta:active,.chip:active,.tw:active,.qopt:active:not(:disabled),.o5:active,.ob:active{
  transform:translate(var(--sh),var(--sh));
  box-shadow:inset 3px 3px 0 rgba(43,31,51,.2)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;
  background:var(--yel);font-family:var(--f-h);font-size:17px;padding:12px 14px;
  box-shadow:inset -3px -3px 0 var(--yel-d),inset 3px 3px 0 #FFF0B8,var(--sh) var(--sh) 0 rgba(43,31,51,.34)}
.cta:active{box-shadow:inset 3px 3px 0 var(--yel-d)}
.cta.ghost{background:var(--panel);
  box-shadow:inset -3px -3px 0 var(--panel-d),inset 3px 3px 0 #fff,var(--sh) var(--sh) 0 rgba(43,31,51,.28)}
.cta.ghost:active{box-shadow:inset 3px 3px 0 var(--panel-d)}
.cta[disabled],.chip[disabled]{opacity:.45;box-shadow:none;transform:none}
.row{display:flex;gap:10px}.row>*{flex:1}
.row.back>#prev{flex:0 0 96px;font-size:14.5px;padding:12px 0}
.cta.wide{width:100%}
.sticky{margin-top:auto;padding:16px 0 4px;background:transparent}

/* 제목 · 본문 */
.hero{padding:16px 15px}
.hero h1{font-family:var(--f-h);font-size:21px;line-height:1.5;margin-bottom:7px}
.hero p{font-size:14.5px;line-height:1.75;color:var(--ink-2)}
.h{font-family:var(--f-h);font-size:22px;line-height:1.5;margin-bottom:11px}
.h.sm{font-size:18.5px}
.bd{font-size:16px;line-height:1.85;color:var(--ink-2)}
.bd b,.bd strong,mark{background:var(--yel);color:var(--ink);font-weight:700;padding:1px 4px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
.note{font-size:13.5px;line-height:1.7;color:var(--ink-2)}
.note b{background:var(--yel);padding:1px 4px}
.eyebrow{font-family:var(--f-px);font-size:8px;letter-spacing:.06em;color:var(--ink-3);margin-bottom:9px;line-height:1.7}
.part{font-family:var(--f-px);font-size:8.5px;letter-spacing:.05em;color:var(--cream);
  margin:18px 0 9px;background:var(--ink);padding:7px 9px;display:flex;align-items:center;gap:8px;
  border:var(--bd) solid var(--ink);line-height:1.6}
.part::after{content:"";flex:1;height:5px;
  background:repeating-linear-gradient(90deg,var(--yel) 0 3px,transparent 3px 6px)}
.yr{font-family:var(--f-px);font-size:11px;color:var(--ink);background:var(--yel);
  border:2px solid var(--ink);padding:5px 8px;display:inline-block;margin-bottom:10px}

/* 왜 / 그래서 */
.wsblock{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.ws{display:flex;gap:10px;align-items:flex-start;background:var(--panel);
  border:2px solid var(--ink);padding:11px 12px}
.ws .lb{font-family:var(--f-h);font-size:14px;flex-shrink:0;width:46px;line-height:1.6}
.ws.why{background:var(--blue-l)} .ws.why .lb{color:var(--blue-d)}
.ws.so{background:var(--teal-l)} .ws.so .lb{color:var(--jade-d)}
.ws p{font-size:14.5px;line-height:1.75;color:var(--ink-2);flex:1;min-width:0}

/* 인과 사슬 */
.scene{display:grid;place-items:center;padding:4px 0 14px;color:var(--org)}
.chain{display:flex;flex-direction:column;margin-top:4px}
.cl{display:flex;gap:12px;align-items:flex-start;position:relative;padding:6px 0;
  opacity:0;animation:fadeup .3s steps(4) forwards}
.cl .dot{width:13px;height:13px;background:var(--org);border:2px solid var(--ink);flex-shrink:0;margin-top:7px}
.cl::before{content:"";position:absolute;left:5px;top:24px;bottom:-6px;width:3px;
  background:repeating-linear-gradient(180deg,var(--ink-3) 0 3px,transparent 3px 6px)}
.cl:last-child::before{display:none}
.cl p{font-size:15px;line-height:1.7}
.cl:last-child p{font-weight:800;background:var(--yel);padding:2px 5px}
@keyframes fadeup{from{opacity:0;transform:translate(-6px,0)}to{opacity:1;transform:none}}

/* 암기 장치 */
.hintcard{background:var(--yel);border-color:var(--ink)}
.hintcard .k{font-family:var(--f-h);font-size:25px;line-height:1.4;color:var(--ink);
  text-shadow:2px 2px 0 rgba(255,255,255,.55)}
.hintcard .bd{margin-top:11px;color:var(--ink)}
.hintcard em{font-style:normal;font-weight:800;background:var(--cream);
  border:2px solid var(--ink);padding:0 4px}

/* 스스로 떠올리기 */
.recall{text-align:center;padding:4px 0}
.recall .q{font-family:var(--f-h);font-size:20px;line-height:1.55}
.recall .tip{font-size:13.5px;color:var(--ink-3);margin-top:13px}
.recall .ans{font-family:var(--f-h);font-size:26px;color:var(--ink);margin:10px 0 2px;
  background:var(--yel);border:var(--bd) solid var(--ink);padding:8px 10px;display:inline-block;
  box-shadow:var(--sh) var(--sh) 0 rgba(43,31,51,.28)}
.blur{filter:none;background:var(--ink)!important;color:transparent!important;
  text-shadow:none;user-select:none;
  background-image:repeating-linear-gradient(45deg,#3B2C47 0 4px,var(--ink) 4px 8px)!important}

/* 2지선다 · 4지선다 · 5지선다 */
.two{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.tw,.qopt,.o5,.ans{min-height:52px;padding:12px 14px;font-size:15.5px;line-height:1.55;
  text-align:left;width:100%;display:flex;gap:10px;align-items:flex-start;font-weight:400}
.opts5,.two{display:flex;flex-direction:column;gap:10px;margin-top:14px}
#opts{display:flex;flex-direction:column;gap:10px}
.qopt,.o5{margin-bottom:0}
.tw.ok,.qopt.ok,.o5.pick{background:var(--teal-l);border-color:var(--teal);
  box-shadow:inset -3px -3px 0 rgba(47,140,126,.3),inset 3px 3px 0 #fff,var(--sh) var(--sh) 0 rgba(43,31,51,.28)}
.tw.no,.qopt.no{background:var(--red-l);border-color:var(--red);
  box-shadow:inset -3px -3px 0 rgba(210,69,59,.3),inset 3px 3px 0 #fff,var(--sh) var(--sh) 0 rgba(43,31,51,.28)}
.qopt.dim,.o5.dim,.ans.dim{opacity:.42;box-shadow:none}
.qopt:disabled,.tw:disabled,.o5:disabled{cursor:default;transform:none}
.kx,.num{font-family:var(--f-px);font-size:10px;color:var(--ink-3);flex-shrink:0;padding-top:3px}
.qopt.ok .kx,.o5.pick .num{color:var(--jade-d)}
.qopt.no .kx{color:var(--red-d)}

/* 정답/오답 배너 */
.fb{border:var(--bd) solid var(--ink);padding:12px 13px;font-size:14.5px;line-height:1.75;
  margin-top:12px;display:flex;gap:10px;align-items:flex-start;
  box-shadow:var(--sh) var(--sh) 0 rgba(43,31,51,.28)}
.fb.ok{background:var(--teal-l)} .fb.no{background:var(--red-l)}
.fb .m,.fb .em{font-family:var(--f-h);font-size:17px;flex-shrink:0;line-height:1.5}
.fb.ok .m{color:var(--jade-d)} .fb.no .m{color:var(--red-d)}
.fb b{background:var(--yel);padding:1px 4px}

/* 비교표 */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:13px;
  border:var(--bd) solid var(--ink);box-shadow:var(--sh) var(--sh) 0 rgba(43,31,51,.28)}
.cmp>div{background:var(--cream);padding:12px 11px;min-width:0;overflow-wrap:anywhere}
.cmp>div+div{border-left:var(--bd) solid var(--ink)}
.cmp h4{font-family:var(--f-h);font-size:15px;margin-bottom:8px;line-height:1.45;
  border-bottom:2px solid var(--ink);padding-bottom:5px}
.cmp .a h4{color:var(--blue-d)} .cmp .b h4{color:var(--red-d)}
.cmp li{list-style:none;font-size:13px;line-height:1.6;color:var(--ink-2);padding-left:11px;
  position:relative;margin-bottom:5px}
.cmp li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;background:var(--ink-3)}
.cmp li b{background:var(--yel);color:var(--ink);padding:0 3px}

/* 진행 막대 */
.track{height:14px;background:var(--panel);border:2px solid var(--ink);flex:1;padding:2px}
.track i{display:block;height:100%;background:var(--org);
  background-image:repeating-linear-gradient(90deg,var(--org) 0 4px,var(--org-d) 4px 8px);
  transition:width .2s steps(6)}
.step{font-family:var(--f-px);font-size:9px;color:var(--ink-2);flex-shrink:0}

/* 홈: 나무 · 진도 */
.plant{display:grid;place-items:center;padding:12px 0;margin-bottom:12px;
  background:#DCEBD8;border:var(--bd) solid var(--ink);
  box-shadow:inset 3px 3px 0 rgba(43,31,51,.14)}
.prog{display:flex;align-items:center;gap:12px;margin-top:14px}
.ring{width:54px;height:54px;position:relative;flex-shrink:0;border:2px solid var(--ink);
  background:var(--panel);display:grid;place-items:center}
.ring svg{display:none}
.ring span{font-family:var(--f-px);font-size:10px;color:var(--ink)}
.prog .pt{flex:1;min-width:0}
.prog .pt b{display:block;font-family:var(--f-h);font-size:16px}
.prog .pt small{display:block;font-size:12.5px;color:var(--ink-2)}
.bestbox{width:54px;height:54px;flex-shrink:0;border:2px solid var(--ink);background:var(--yel);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.bestbox b{font-family:var(--f-px);font-size:13px;color:var(--ink);line-height:1}
.bestbox small{font-family:var(--f-px);font-size:6px;color:var(--ink)}

/* 수업 목록 */
.lsn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;min-height:70px;
  padding:10px 11px;margin-bottom:10px}
.lsn:active{transform:translate(var(--sh),var(--sh));box-shadow:none}
.lsn.done{background:var(--teal-l);border-color:var(--teal)}
.lsn .sc{width:46px;height:46px;flex-shrink:0;border:2px solid var(--ink);background:var(--yel);
  display:grid;place-items:center;color:var(--ink);
  box-shadow:inset -2px -2px 0 var(--yel-d),inset 2px 2px 0 #FFF0B8}
.lsn.done .sc{background:var(--teal);color:var(--cream);
  box-shadow:inset -2px -2px 0 rgba(0,0,0,.25),inset 2px 2px 0 rgba(255,255,255,.35)}
.lsn .tx{flex:1;min-width:0}
.lsn .tx b{display:block;font-family:var(--f-h);font-size:15.5px;line-height:1.45}
.lsn .tx small{display:block;font-family:var(--f-px);font-size:7.5px;color:var(--ink-2);
  margin-top:3px;line-height:1.7}
.lsn .rt{flex-shrink:0;color:var(--ink-3);display:flex;align-items:center}
.lsn .chk{width:26px;height:26px;background:var(--teal);border:2px solid var(--ink);
  display:grid;place-items:center;color:var(--cream)}

/* 배너들 */
.wbar,.exbar,.mbar{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  min-height:70px;padding:11px 12px;margin-bottom:12px}
.wbar:active,.exbar:active,.mbar:active{transform:translate(var(--sh),var(--sh));box-shadow:none}
.mbar{background:var(--teal-l);border-color:var(--teal)}
.mbar .n{font-family:var(--f-px);font-size:16px;color:var(--jade-d);min-width:34px;text-align:center}
.wbar{background:var(--red-l);border-color:var(--red)}
.wbar .n{font-family:var(--f-px);font-size:16px;color:var(--red-d);min-width:34px;text-align:center}
.exbar{background:var(--blue-l);border-color:var(--blue)}
.exbar .ic{width:44px;height:44px;flex-shrink:0;border:2px solid var(--ink);background:var(--cream);
  display:grid;place-items:center;color:var(--blue)}
.wbar .tx,.exbar .tx,.mbar .tx{flex:1;min-width:0}
.wbar .tx b,.exbar .tx b,.mbar .tx b{display:block;font-family:var(--f-h);font-size:15.5px;line-height:1.45}
.wbar .tx small,.exbar .tx small,.mbar .tx small{display:block;font-size:12px;color:var(--ink-2);line-height:1.6}
.wbar .ch,.exbar .ch,.mbar .ch{flex-shrink:0;color:var(--ink-3)}

/* 30초 복습 카드 */
.peek{padding:12px 13px;margin-bottom:12px;background:var(--panel)}
.peek .pt{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.peek .lb{flex:1;min-width:0;font-family:var(--f-px);font-size:7.5px;color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.7}
.peek .re{width:44px;height:44px;border:2px solid var(--ink);background:var(--cream);
  flex-shrink:0;font-size:16px;color:var(--ink);display:grid;place-items:center;
  box-shadow:inset -2px -2px 0 var(--panel-d),inset 2px 2px 0 #fff}
.peek .re:active{transform:translate(1px,1px);box-shadow:inset 2px 2px 0 var(--panel-d)}
.peek .pb .k{display:block;font-family:var(--f-h);font-size:18px;color:var(--ink);
  line-height:1.45;margin-bottom:6px;background:var(--yel);padding:3px 6px;
  border:2px solid var(--ink)}
.peek .pb span{font-size:14px;line-height:1.75;color:var(--ink-2)}
.peek em{font-style:normal;font-weight:800}

/* 마무리 · 결과 */
.done-hero{text-align:center;padding:18px 0 8px}
.done-hero .big,.big{font-family:var(--f-px);font-size:26px;line-height:1.3;color:var(--ink);
  text-shadow:3px 3px 0 var(--yel)}
.done-hero .sub{font-size:14.5px;color:var(--ink-2);margin-top:12px}
.done-hero .sub b{background:var(--yel);padding:1px 4px}
.stamp{display:grid;place-items:center;padding:4px 0 8px}
.stamp.show{animation:st .4s steps(4)}
@keyframes st{0%{opacity:0;transform:scale(1.7) rotate(-14deg)}100%{opacity:1;transform:none}}
.sumlist{display:flex;flex-direction:column;gap:10px}
.sum{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;font-size:14.5px;line-height:1.7}
.sum .n{font-family:var(--f-px);font-size:9px;color:var(--org);flex-shrink:0;padding-top:5px}
.sum b{font-family:var(--f-h)}
.rv{padding:13px 14px;margin-bottom:10px}
.rv .t{font-family:var(--f-px);font-size:7.5px;color:var(--ink-3);line-height:1.7}
.rv .k{font-family:var(--f-h);font-size:19px;color:var(--ink);margin:6px 0 8px;line-height:1.45;
  background:var(--yel);border:2px solid var(--ink);padding:4px 7px;display:inline-block}
.rv .b{font-size:14px;line-height:1.75;color:var(--ink-2)}
.rv em{font-style:normal;font-weight:800}
/* 통치 ↔ 저항 대조표 */
.face{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px;align-items:start}
.fcol{padding:9px 9px 10px;border:var(--bd) solid var(--ink);
  box-shadow:var(--sh) var(--sh) 0 rgba(43,31,51,.26)}
.fcol.rule{background:var(--red-l)}
.fcol.resist{background:var(--teal-l)}
.fcol h4{font-family:var(--f-px);font-size:8px;line-height:1.7;margin-bottom:8px;color:var(--ink)}
.fcol h4 i{font-style:normal;color:var(--ink-2)}
.fc{display:block;width:100%;text-align:left;min-height:34px;padding:7px 8px;margin-bottom:5px;
  font-family:var(--f-b);font-size:13px;line-height:1.5;color:var(--ink);
  background:var(--cream);border:2px solid var(--ink)}
.fc.new{background:var(--panel);color:var(--ink-2);border-style:dashed}
.fc:active{transform:translate(1px,1px)}
.fworld{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:9px;padding:8px 9px;
  background:var(--blue-l);border:var(--bd) solid var(--ink);
  box-shadow:var(--sh) var(--sh) 0 rgba(43,31,51,.26)}
.fworld>b{font-family:var(--f-px);font-size:8px;line-height:1.7;margin-right:2px}
.fworld .fc{display:inline-block;width:auto;margin-bottom:0}
/* 노란 카드 위에서는 흐린 회색이 안 읽힌다 */
.hintcard .eyebrow{color:var(--ink-2)}
/* 서술형 연습 */
.wbox{margin-bottom:12px}
.wbox textarea{width:100%;padding:12px 13px;background:var(--cream);color:var(--ink);
  border:var(--bd) solid var(--ink);box-shadow:inset 2px 2px 0 var(--panel-d);
  font-family:var(--f-b);font-size:15.5px;line-height:1.85;resize:vertical;min-height:150px}
.wbox textarea::placeholder{color:var(--ink-3)}
.wkeys{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.wkey{display:inline-flex;align-items:center;gap:5px;min-height:46px;padding:8px 12px;
  font-family:var(--f-h);font-size:14px;color:var(--ink-2);
  background:var(--panel);border:2px solid var(--ink-3)}
.wkey.on{color:var(--ink);background:var(--teal-l);border-color:var(--teal)}
.wkey:active{transform:translate(1px,1px)}
.wscore{margin-top:13px;padding:10px 12px;font-family:var(--f-px);font-size:13px;line-height:1.7;
  border:2px solid var(--ink)}
.wscore.ok{background:var(--teal-l)}
.wscore.no{background:var(--red-l)}
.wscore small{display:block;font-family:var(--f-b);font-size:13px;color:var(--ink-2);
  margin-top:5px;line-height:1.7}
.rv .wk{padding:1px 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.rv .wk.on{background:var(--teal-l)}
.rv .wk.off{background:var(--red-l);box-shadow:inset 0 -2px 0 var(--red)}
.peek .pb.cover>span:not(.cv){filter:blur(5px);user-select:none}
.peek .pb{position:relative}
.peek .pb .cv{display:none}
.peek .pb.cover .cv{display:block;font-family:var(--f-px);font-size:7.5px;color:var(--ink-3);
  margin-top:7px;filter:none}
/* 암기 장치: 가리고 떠올리기 */
.mmbar{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap}
.mmbar .pill{font-family:var(--f-px);font-size:8px;line-height:1.7;padding:6px 7px;
  background:var(--panel);border:2px solid var(--ink)}
.mmbar .pill.no{background:var(--red-l)}
.mmbar .pill.ok{background:var(--teal-l)}
.rv.mm{border-left:7px solid var(--panel-d)}
.rv.mm.m0{border-left-color:var(--red)}
.rv.mm.m1{border-left-color:var(--teal)}
.rv .mst{margin-left:7px;padding:2px 5px;border:2px solid var(--ink);font-size:7px}
.rv .mst.no{background:var(--red-l)}
.rv .mst.ok{background:var(--teal-l)}
.peekbtn{display:block;width:100%;text-align:left;min-height:52px;padding:11px 12px;
  font-family:var(--f-b);font-size:14px;line-height:1.7;color:var(--ink-2);
  background:repeating-linear-gradient(45deg,var(--panel) 0 7px,var(--panel-d) 7px 14px);
  border:2px dashed var(--ink-3)}
.peekbtn:active{transform:translate(1px,1px)}
.peekbtn span{display:block;font-family:var(--f-px);font-size:7.5px;color:var(--ink-2);margin-top:5px}
.grade{display:flex;gap:8px;margin-top:11px}
.grade button{flex:1;min-height:46px;font-family:var(--f-h);font-size:14px;color:var(--ink);
  background:var(--panel);border:2px solid var(--ink)}
.grade button:active{transform:translate(1px,1px)}
.grade .g0.on{background:var(--red-l);box-shadow:inset 0 0 0 2px var(--red)}
.grade .g1.on{background:var(--teal-l);box-shadow:inset 0 0 0 2px var(--teal)}

/* 연표 — 시험 전날 한 장으로 훑는 화면 */
.tabs{display:flex;margin-bottom:14px;border:var(--bd) solid var(--ink);
  box-shadow:var(--sh) var(--sh) 0 rgba(43,31,51,.28)}
.tb{flex:1;min-height:44px;white-space:nowrap;font-family:var(--f-h);font-size:15px;color:var(--ink-2);
  background:var(--panel);border:0;border-right:2px solid var(--ink);cursor:pointer;padding:0 6px}
.tb:last-child{border-right:0}
.tb[aria-selected="true"]{background:var(--yel);color:var(--ink)}
.tlbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}
/* 단원 칩이 여덟 줄로 흘러내리면 정작 연표가 화면 밖으로 밀린다 — 한 줄로 옆으로 민다 */
.chips.strip{flex-wrap:nowrap;overflow-x:auto;padding:0 4px 7px 0;scrollbar-width:thin}
.chips.strip .chip{flex:0 0 auto;white-space:nowrap}
.tlbar .cnt{font-family:var(--f-px);font-size:8px;color:var(--ink-2);line-height:1.7}
.tly{display:flex;align-items:center;gap:9px;margin:16px 0 9px}
.tly b{font-family:var(--f-px);font-size:12px;color:var(--ink);background:var(--yel);
  border:2px solid var(--ink);padding:6px 8px;line-height:1;min-width:66px;text-align:center}
.tly.hid b{background:var(--panel);color:var(--ink-3);letter-spacing:.12em;cursor:pointer}
.tly i{flex:1;height:4px;background:repeating-linear-gradient(90deg,var(--ink) 0 3px,transparent 3px 7px)}
.tlr{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  min-height:44px;padding:11px 12px;margin-bottom:8px;cursor:pointer;font:inherit}
.tlr:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(43,31,51,.28)}
.tlr .d{width:12px;height:12px;flex-shrink:0;margin-top:5px;background:var(--teal);border:2px solid var(--ink)}
.tlr .x{flex:1;min-width:0}
.tlr .x b{display:block;font-family:var(--f-h);font-size:16.5px;line-height:1.5;color:var(--ink)}
.tlr .x small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.6}
/* 연표: 시기 · 갈래 */
.tlmap{display:flex;align-items:stretch;gap:6px;margin-bottom:13px}
.tlmap .e{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px;
  padding:8px 7px;background:var(--panel);border:var(--bd) solid var(--ink);text-align:center}
.tlmap .e b{font-family:var(--f-px);font-size:8.5px;line-height:1.6}
.tlmap .e small{font-family:var(--f-h);font-size:12px;color:var(--ink-2);line-height:1.45}
.tlmap .e0{background:var(--red-l)}.tlmap .e1{background:var(--yel)}.tlmap .e2{background:var(--blue-l)}
.tlmap .ar{align-self:center;font-family:var(--f-px);font-size:9px;color:var(--ink-3)}
.tle{display:flex;align-items:flex-start;gap:10px;margin:26px 0 12px;padding:10px 11px;
  background:var(--ink);color:var(--cream);border:var(--bd) solid var(--ink);box-shadow:var(--sh) var(--sh) 0 rgba(43,31,51,.3)}
.tle>b{font-family:var(--f-px);font-size:10px;line-height:1.7;flex:0 0 auto;color:var(--yel)}
.tle span{flex:1;min-width:0}
.tle .t{display:block;font-family:var(--f-h);font-size:15.5px;line-height:1.5}
.tle small{display:block;font-size:12px;line-height:1.6;color:#CFC2D8;margin-top:2px}
.tlr.k-rule .d{background:var(--red)}
.tlr.k-resist .d{background:var(--teal)}
.tlr.k-world .d{background:var(--blue)}
.tlr.new .d{background:var(--panel)}
.tlr.k-rule{border-left:7px solid var(--red)}
.tlr.k-resist{border-left:7px solid var(--teal)}
.tlr.k-world{border-left:7px solid var(--blue)}
.tlr .x b{display:block}
.tlr .tg{display:inline-block;margin-left:7px;vertical-align:2px;font-family:var(--f-px);
  font-size:7px;font-style:normal;padding:3px 4px;border:2px solid var(--ink);background:var(--panel)}
.tlr.k-rule .tg{background:var(--red-l)}
.tlr.k-resist .tg{background:var(--teal-l)}
.tlr.k-world .tg{background:var(--blue-l)}
.tlr .so{color:var(--ink);font-size:13.5px}
.tlr .src{color:var(--ink-3);font-size:11.5px}
.chip.k-rule.on{background:var(--red-l)}
.chip.k-resist.on{background:var(--teal-l)}
.chip.k-world.on{background:var(--blue-l)}
.chip.k-life.on{background:#FAE4C2}
.tlr.k-life .d{background:var(--org)}
.tlr.k-life{border-left:7px solid var(--org)}
.tlr.k-life .tg{background:#FAE4C2}
.tlr.nol{background:var(--panel);box-shadow:none;border-style:dashed}
.tlr.nol .d{background:var(--panel-d)}
.tlr.nol .src{font-style:italic}
.fc.nol{background:transparent;border-style:dotted;color:var(--ink-2)}
.fworld.flife{background:#FAE4C2}
.empty{text-align:center;padding:38px 16px;color:var(--ink-3)}
.empty p{font-size:14.5px;line-height:1.8;max-width:30ch;margin:14px auto 0}

/* 오답 노트 */
.wsum{display:flex;align-items:center;gap:13px;padding:14px 15px;margin-bottom:12px;background:var(--red-l)}
.wsum .wn{font-family:var(--f-px);font-size:21px;color:var(--red-d);line-height:1}
.wsum .wt{flex:1;min-width:0}
.wsum .wt b{display:block;font-family:var(--f-h);font-size:16px}
.wsum .wt small{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.65;margin-top:3px}
.wcard{padding:13px 14px;margin-bottom:10px}
.wcard.hot{border-color:var(--red);background:var(--red-l)}
.wq{font-size:15px;line-height:1.65;margin-bottom:10px;display:flex;gap:8px;align-items:flex-start}
.wq .dots{display:inline-flex;gap:3px;flex-shrink:0;padding-top:8px}
.wq .dots i{width:6px;height:6px;background:var(--red);border:1px solid var(--ink)}
.wline{font-size:14px;line-height:1.6;padding:7px 10px;margin-bottom:6px;border:2px solid var(--ink)}
.wline.no{background:var(--red-l);color:var(--ink)}
.wline.ok{background:var(--teal-l);color:var(--ink)}
.wex{font-size:13px;line-height:1.7;color:var(--ink-2);margin-top:8px}

/* 내신 시험지 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:9px 13px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip i{font-style:normal;font-family:var(--f-px);font-size:8px;color:var(--ink-3)}
.chip.on{background:var(--yel);box-shadow:inset -3px -3px 0 var(--yel-d),inset 3px 3px 0 #FFF0B8,var(--sh) var(--sh) 0 rgba(43,31,51,.3)}
.chip.on i{color:var(--ink)}
.paper{padding:15px 15px 18px}
.pno{display:flex;align-items:center;gap:8px;margin-bottom:11px;flex-wrap:wrap}
.pno b{font-family:var(--f-px);font-size:11px;min-width:30px;height:30px;background:var(--ink);
  color:var(--yel);display:grid;place-items:center}
.pno .tt{font-family:var(--f-px);font-size:7.5px;color:var(--ink);background:var(--yel);
  border:2px solid var(--ink);padding:4px 6px;line-height:1.6}
.pno .pts{font-family:var(--f-px);font-size:7px;color:var(--ink-3);margin-left:auto;line-height:1.7}
.pq{font-size:16px;line-height:1.8}
.pq u{text-decoration:none;background:var(--yel);border-bottom:3px solid var(--ink);padding:0 2px}
.bokibox{margin-top:13px;border:var(--bd) solid var(--ink);padding:12px 13px;background:var(--panel)}
.bk{display:flex;gap:9px;align-items:flex-start;margin-bottom:7px}
.bk:last-child{margin-bottom:0}
.bk span{font-family:var(--f-h);font-size:14px;color:var(--blue);flex-shrink:0;padding-top:1px}
.bk p{font-size:14px;line-height:1.7;color:var(--ink-2)}
.shortin{margin-top:13px}
.shortin input{width:100%;min-height:54px;padding:13px 14px;border:var(--bd) solid var(--ink);
  background:var(--panel);color:var(--ink);font-family:var(--f-b);font-size:17px;font-weight:800;
  box-shadow:inset 3px 3px 0 rgba(43,31,51,.14)}
.shortin input::placeholder{color:var(--ink-3);font-weight:400}
.shortin input:focus{outline:none;background:#fff}

/* OMR */
.omr{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:2px 0 8px}
.ob{width:32px;height:32px;min-height:32px;font-family:var(--f-px);font-size:9px;color:var(--ink-3);
  display:grid;place-items:center;box-shadow:inset -2px -2px 0 var(--panel-d),inset 2px 2px 0 #fff;
  border-width:2px}
.ob.f{background:var(--teal);color:var(--cream);
  box-shadow:inset -2px -2px 0 rgba(0,0,0,.25),inset 2px 2px 0 rgba(255,255,255,.3)}
.ob.cur{outline:3px solid var(--org);outline-offset:1px}

/* 유형별 정답률 — 길이가 크기를 나른다 */
.tchart{display:flex;flex-direction:column;gap:9px}
.trow{display:grid;grid-template-columns:104px 1fr 44px;gap:9px;align-items:center}
.tn{font-size:12px;color:var(--ink-2);line-height:1.4;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tn .wk{font-style:normal;font-family:var(--f-px);font-size:6.5px;color:#fff;background:var(--red);
  border:2px solid var(--ink);padding:3px 4px;line-height:1.6}
.tbar{height:16px;background:var(--panel);border:2px solid var(--ink);padding:2px}
.tbar i{display:block;height:100%;background:var(--teal);
  background-image:repeating-linear-gradient(90deg,var(--teal) 0 4px,#256F63 4px 8px);
  transition:width .3s steps(8)}
.tv{font-family:var(--f-px);font-size:8.5px;color:var(--ink-2);text-align:right;line-height:1.7}

/* 알림 */
.pop{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:70;pointer-events:none;
  font-family:var(--f-h);font-size:26px;color:var(--ink);background:var(--yel);
  border:var(--bd) solid var(--ink);padding:10px 16px;
  box-shadow:var(--sh) var(--sh) 0 rgba(43,31,51,.5);animation:pp .8s steps(6) forwards}
@keyframes pp{0%{opacity:0;transform:translateX(-50%) scale(.7)}
  25%{opacity:1;transform:translateX(-50%) scale(1)}
  75%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-22px)}}
/* ── D-day · 복습 예정 ── */
.ddaybox{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--cream);
  border:var(--bd) solid var(--ink);box-shadow:var(--sh) var(--sh) 0 rgba(43,31,51,.34);
  padding:11px 12px;margin-bottom:12px}
.ddaybox .dd{font-family:var(--f-px);font-size:16px;color:var(--yel);flex-shrink:0;
  background:#3B2C47;border:2px solid var(--yel);padding:8px 9px;line-height:1}
.ddaybox .ddt{flex:1;min-width:0}
.ddaybox .ddt b{display:block;font-family:var(--f-h);font-size:15.5px;line-height:1.45}
.ddaybox .ddt small{display:block;font-size:12px;color:#C9BBD3;line-height:1.6}
.ddx{width:36px;height:36px;flex-shrink:0;background:var(--panel);border:2px solid var(--cream);
  color:var(--ink);display:grid;place-items:center;font-size:15px;position:relative}
.ddx::after{content:"";position:absolute;inset:-6px}
.ddx:active{transform:translate(1px,1px)}
.ddinput{width:100%;min-height:52px;padding:12px 13px;border:var(--bd) solid var(--ink);
  background:var(--panel);color:var(--ink);font-family:var(--f-b);font-size:16px;font-weight:700;
  box-shadow:inset 3px 3px 0 rgba(43,31,51,.14)}
.rbar{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:70px;
  padding:11px 12px;margin-bottom:12px;background:var(--yel);border:var(--bd) solid var(--ink);
  box-shadow:var(--sh) var(--sh) 0 rgba(43,31,51,.3)}
.rbar:active{transform:translate(var(--sh),var(--sh));box-shadow:none}
.rbar .n{font-family:var(--f-px);font-size:16px;color:var(--ink);min-width:34px;text-align:center}
.rbar .tx{flex:1;min-width:0}
.rbar .tx b{display:block;font-family:var(--f-h);font-size:15.5px;line-height:1.45}
.rbar .tx small{display:block;font-size:12px;color:var(--ink-2);line-height:1.6}
.rbar .ch{flex-shrink:0;color:var(--ink)}
.dk .badge.due{background:var(--yel);color:var(--ink)}

/* ── 찾기 ── */
.findbar{display:flex;align-items:center;gap:0;border:var(--bd) solid var(--ink);
  background:var(--panel);box-shadow:inset 3px 3px 0 rgba(43,31,51,.14)}
.findbar .mg{width:44px;flex-shrink:0;text-align:center;font-size:19px;color:var(--ink-2)}
.findbar input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ink);
  font-family:var(--f-b);font-size:16px;font-weight:700;padding:14px 4px 14px 0}
.findbar input::placeholder{color:var(--ink-3);font-weight:400}
.fclr{width:44px;height:44px;flex-shrink:0;color:var(--ink-2);font-size:15px;
  display:grid;place-items:center;border-left:2px solid var(--ink)}
.fclr:active{background:var(--panel-d)}

{id:"L3",u:"s2",part:"나라를 빼앗기다",title:"총독부가 들어서다",sc:"building",

{id:"L8",u:"s4",part:"이름을 빼앗기다",title:"민족을 지우려 하다",sc:"mask2",
 hook:"이번엔 땅이나 쌀이 아니야. 이름, 말, 정신 자체를 지우려고 했어. 왜 하필 1930년대부터였을까?",
 cards:[
 {t:"story",h:"전쟁이 커졌기 때문이야",b:"만주 사변(1931) 이후 일본은 침략 전쟁을 계속 넓혀 갔어. 전쟁에는 사람이 필요한데, 한국인을 전쟁터에 보내려면 먼저 '너희도 일본인'이라고 믿게 만들어야 했지. 민족 말살 통치는 <b>전쟁 동원을 위한 준비</b>였던 거야."},
 {t:"fact",y:1937,n:"내선일체와 일선동조론",b:"<b>내선일체</b>는 내지(일본)와 조선이 한몸이라는 뜻이고, <b>일선동조론</b>은 일본인과 한국인이 같은 조상에서 나왔다는 주장이야.",
  why:"'우리는 원래 한 민족'이라고 믿게 만들려고.",
  so:"이 논리 위에서 황국 신민화 정책이 강요돼. 두 말의 뜻을 바꿔 내는 문제가 자주 나오니 구분해 두자."},
 {t:"check",q:"'일본인과 한국인이 같은 조상에서 나왔다'는 주장의 이름은?",a:"일선동조론",hint:"내선일체는 '한몸'이라는 뜻이야"},
 {t:"fact",y:1937,n:"황국 신민 서사",b:"'우리는 대일본 제국의 신민입니다'로 시작하는 맹세문을 강제로 외우게 했어. 매일 아침 일본 궁성 쪽을 향해 절하는 <b>궁성 요배</b>도 시켰지.",
  why:"매일 반복시켜 몸에 배게 하려고.",
  so:"학교뿐 아니라 어른들 모임에서도 외워야 했어."},
 {t:"fact",y:1937,n:"신사 참배 강요",b:"각지에 신사를 세우고 참배를 강요했어.",
  why:"종교까지 일본식으로 바꾸려 한 거야.",
  so:"거부하면 처벌하고 학교까지 폐쇄했어."},
 {t:"fact",y:1939,n:"창씨개명",b:"성과 이름을 일본식으로 바꾸도록 강요했어.",
  why:"이름은 정체성의 핵심이니까. 이름을 바꾸면 뿌리가 흐려진다고 본 거지.",
  so:"거부하면 자녀를 학교에 보내지 못하게 하고 식량 배급에서 제외했어. 사실상 강제였어."},
 {t:"fact",y:1942,n:"조선어 학회 사건",b:"우리말을 연구하던 조선어 학회 회원들을 치안 유지법 위반으로 잡아갔어.",
  why:"한국어 교육을 금지한 마당에 우리말 사전을 만드는 건 그냥 둘 수 없었지.",
  so:"『우리말 큰사전』 편찬이 중단됐어. 앞서 1940년에는 『조선일보』와 『동아일보』도 폐간시켰지."},
 {t:"chain",title:"지워 간 순서",items:["만주 사변(1931) — 전쟁 확대","내선일체 · 일선동조론","황국 신민 서사(1937) · 신사 참배","한국어 교육 금지(1938)","창씨개명(1939) · 신문 폐간(1940)","조선어 학회 사건(1942)"]},

 {t:"pick",q:"'내지와 조선이 한몸'이라는 뜻의 말은?",c:["내선일체","일선동조론"],a:0,e:"내선일체가 '한몸', 일선동조론이 '같은 조상'이야."},
 {t:"check",pr:4,q:"일본식 성명으로 바꾸기를 거부하면 식량 배급을 받을 수 없었다 — ○일까 ×일까?",a:"○ — 창씨개명은 말로는 자율이었지만 거부하면 배급에서 빠지는 등 불이익을 줘서 사실상 강요했어.",hint:"자율이라면서"},
 {t:"check",pr:4,q:"황국 신민화 정책으로 '소학교'의 이름은 무엇으로 바뀌었을까?",a:"'국민학교' — 황국 신민을 기르는 학교라는 뜻이야. 우리글 신문(『조선일보』 · 『동아일보』)도 폐간됐어.",hint:"황국 신민의 학교"}
 ],

 {q:"일본인과 한국인이 같은 조상에서 나왔다는 주장은?",c:["일선동조론","내선일체","황국 신민화","대동아 공영권"],a:0,e:"내선일체는 '한몸'이라는 뜻이야."},
 {q:"창씨개명을 거부하면 받은 불이익은?",c:["식량 배급 제외, 자녀 취학 금지","벌금형","태형","국외 추방"],a:0,e:"생활을 옥죄어 사실상 강제했어."},

{id:"L9",u:"s4",part:"이름을 빼앗기다",title:"전쟁에 끌려가다",sc:"factory",
 hook:"'국가 총동원'이라는 말은 사람과 물건을 마음대로 쓰겠다는 뜻이야. 이 시기가 우리 근현대사에서 가장 아픈 대목이야.",
 cards:[
 {t:"fact",y:1930,n:"식민지 공업화",b:"대공황 이후 일본 독점 자본이 값싼 노동력과 지하자원을 노리고 들어와 중화학 공업과 광업에 투자했어.",
  why:"일본 안에서는 대공황으로 투자처가 마땅찮았거든.",
  so:"석탄과 철이 많은 <b>북부 지방</b>에 공장이 몰렸어. 남북 간 산업 불균형이 이때 생겨."},
 {t:"fact",y:1934,n:"남면북양 정책",b:"<b>남</b>부에서는 <b>면</b>화를 재배하고 <b>북</b>부에서는 <b>양</b>을 기르게 했어.",
  why:"대공황으로 어려워진 일본 방직 자본가에게 값싼 원료를 대주려고.",

 {t:"fact",y:1938,n:"병참 기지화 정책",b:"중일 전쟁이 터지자 한반도를 전쟁 물자를 대는 기지로 만들려 했어.",
  why:"일본에서 바닷길로 물자를 보내다 끊길 수 있으니, 한반도에서 직접 대게 하려 한 거야.",

 {t:"fact",y:1938,n:"국가 총동원법",b:"'전시에 인적·물적 자원을 통제 운용한다'는 법이야. 제국 신민을 징용해 총동원 업무에 종사시킬 수 있다고 못 박았지.",

 {t:"fact",y:1943,n:"인력 수탈",b:"지원병제·학도 지원병제·징병제로 청년들을 전쟁터에 보냈고, <b>국민 징용령</b>으로 청장년을 탄광·철도 공사·군수 공장에 끌고 갔어.",
  why:"전쟁이 길어질수록 병력과 노동력이 모자랐어.",
  so:"낯선 땅에서 임금도 제대로 못 받고 돌아오지 못한 사람이 많았어."},
 {t:"fact",y:1944,n:"여성에 대한 동원",b:"수많은 여성이 일본군 '위안부'로 끌려가 성 노예가 되는 참혹한 피해를 입었어. 전쟁 막바지에는 <b>여자 정신 근로령</b>으로 수십만 명을 군수 공장에 동원했지.",
  why:"남성 인력이 바닥나자 여성까지 동원한 거야.",
  so:"이 문제는 오랫동안 은폐되다가 1990년대에 생존자들의 증언으로 진상 규명이 시작됐어. 지금도 끝나지 않은 역사야."},
 {t:"fact",y:1939,n:"공출과 배급제",b:"집집마다 할당량을 정해 쌀을 걷고 배급제를 시행했어. 무기를 만들려고 절의 종, 놋그릇, 숟가락까지 가져갔지.",
  why:"전쟁 물자가 모자랐거든.",
  so:"'국민정신 총동원 운동'을 벌이며 말단에 <b>애국반</b>을 두어 공출과 징용을 독촉했어."},
 {t:"chain",title:"동원의 사슬",items:["중일 전쟁(1937)","국가 총동원법(1938) — 법적 근거","병참 기지화 · 애국반","국민 징용령 · 징병제","여자 정신 근로령(1944) · 공출"]},
 {t:"pick",q:"강제 징용과 징병의 법적 근거가 된 법은?",c:["국가 총동원법","치안 유지법"],a:0,e:"1938년 국가 총동원법이야. 치안 유지법(1925)은 사상 탄압용이야."},
 {t:"check",pr:4,q:"산미 증식 계획은 1934년에 끝났는데, 프린트는 '중·일 전쟁 이후 산미 증식 계획을 더욱 확대하였다'를 ○라고 했어. 왜 둘 다 맞을까?",a:"1934년에 중단됐다가 중일 전쟁 뒤 전쟁 식량을 모으려고 다시 시작(재개)했거든. 그리고 집집마다 할당량을 정해 쌀을 공출했어.",hint:"멈췄다가 다시"},

{id:"L10",u:"s5",part:"나라 밖에서 준비하다",title:"몰래 뭉치다",sc:"paper",
 hook:"헌병이 거리를 지키던 1910년대에도 사람들은 포기하지 않았어. 다만 드러내 놓고 할 수 없으니 비밀 결사로 움직였지. 두 단체만 확실히 구분하면 돼.",
 cards:[

  why:"의병 운동의 흐름을 잇는 사람들이었어.",
  so:"이들이 내세운 건 <b>복벽주의</b>야. 무너진 왕조를 되살려 고종을 다시 황제로 세우자는 거지."},
 {t:"fact",y:1915,n:"대한 광복회",b:"<b>박상진</b> 등이 주축이 됐어. 군자금을 모으고 친일파를 처단했으며, 만주에 무관 학교를 세우려 했지.",
  why:"독립 전쟁으로 국권을 되찾아야 한다고 봤어.",
  so:"이들이 목표한 건 <b>공화주의</b>, 곧 민주 공화제 국가야. 왕이 아니라 국민이 주인인 나라를 세우자는 거지."},
 {t:"compare",title:"이 둘만 구분하면 끝",l:{n:"독립 의군부 (1912)",p:["임병찬 (의병장 출신)","고종의 <b>밀명</b>","<b>복벽</b>주의 — 왕조 부활","국권 반환 요구서 시도"]},
  r:{n:"대한 광복회 (1915)",p:["박상진","군자금 모금 · 친일파 처단","<b>공화</b>주의 — 민주 공화제","만주 무관 학교 추진"]}},

{id:"L11",u:"s5",part:"나라 밖에서 준비하다",title:"국경을 넘다",sc:"border",
 hook:"국내에서 활동이 막히자 지사들은 아예 국경을 넘었어. 어디에 무엇이 있었는지, 지도를 머릿속에 그려 두면 한 번에 정리돼.",
 cards:[
 {t:"story",h:"왜 국외였을까",b:"헌병 경찰의 감시망 안에서는 군사 훈련은커녕 모임조차 어려웠어. 그래서 지리적으로 가까운 만주와 연해주에 <b>독립운동 기지</b>를 세우고, 오래 버틸 거점으로 삼으려 한 거야."},
 {t:"fact",y:1911,n:"서간도 — 삼원보",b:"신민회의 <b>이회영·이상룡</b> 등이 자치 기관 <b>경학사</b>를 만들고, 독립군을 기르려 <b>신흥 강습소</b>를 세웠어. 이게 뒷날 <b>신흥 무관 학교</b>가 돼.",
  why:"이회영 일가는 대부호였는데 전 재산을 급히 처분해 만주로 떠났어.",
  so:"3·1 운동 이후 만주로 향한 청년들이 여기서 군사 훈련을 받았어."},
 {t:"fact",y:1913,n:"북간도",b:"<b>간민회</b> 같은 자치 단체가 동포 사회를 이끌었고, 서전서숙을 이은 <b>명동 학교</b>가 세워졌어. 대종교 간부 <b>서일</b> 등은 무장 단체 <b>중광단</b>을 만들었지.",
  why:"한인이 가장 많이 살던 지역이라 기반이 튼튼했어.",
  so:"중광단이 뒷날 <b>북로 군정서</b>가 돼. 청산리에서 김좌진이 이끄는 바로 그 부대야."},
 {t:"check",q:"중광단은 뒷날 어떤 부대가 될까?",a:"북로 군정서",hint:"청산리 대첩의 주력 부대야"},
 {t:"fact",y:1911,n:"연해주 — 신한촌",b:"블라디보스토크 교외에 <b>신한촌</b>을 세우고 <b>권업회</b>가 활동했어. 뒤에 <b>이상설·이동휘</b>를 정·부통령으로 하는 <b>대한 광복군 정부</b>가 세워졌지(1914).",
  why:"러시아와 가까워 무기를 구하기 쉬웠어.",
  so:"'정부'라는 이름을 쓴 조직이 이때 이미 나왔다는 게 중요해."},
 {t:"fact",y:1910,n:"미주",b:"장인환·전명운의 의거를 계기로 애국심이 높아지자 <b>안창호</b> 주도로 한인 단체들이 통합해 <b>대한인 국민회</b>를 만들었어. 하와이에서는 <b>박용만</b>이 <b>대조선 국민군단</b>을 꾸려 군사 훈련을 했지.",
  why:"멀리 떨어져 있어 상대적으로 안전했고, 자금을 모으기 좋았어.",
  so:"미주는 주로 외교와 자금, 만주·연해주는 주로 무장 투쟁을 맡는 구도가 만들어져."},
 {t:"fact",y:1912,n:"상하이",b:"<b>신규식</b> 등이 <b>동제사</b>를 만들었고, 이들 중 일부가 <b>신한청년당</b>을 결성했어.",
  why:"열강의 조계 지역이 많아 외교 활동에 유리했어.",
  so:"신한청년당이 김규식을 파리 강화 회의에 보내고, 이 흐름이 대한민국 임시 정부 수립으로 이어져."},
 {t:"fact",y:1917,n:"대동단결 선언",b:"신규식·박은식·신채호·조소앙 등이 상하이에서 발표했어. '순종이 주권을 포기한 날이 곧 국민이 주권을 이어받은 날'이라는 <b>국민 주권론</b>을 폈지.",
  why:"나라를 다시 세우려면 '누가 주인인가'부터 정해야 했어.",
  so:"임시 정부를 세울 이론적 바탕이 됐어. 황제의 나라에서 국민의 나라로 넘어가는 결정적 문장이야."},
 {t:"hint",k:"서 · 북 · 연 · 미 · 상",b:"<em>서</em>간도 경학사·신흥 ‖ <em>북</em>간도 간민회·명동 학교·중광단 ‖ <em>연</em>해주 권업회·신한촌 ‖ <em>미</em>주 국민회·국민군단 ‖ <em>상</em>하이 동제사·신한청년당. 지도 왼쪽 위에서 시계 방향으로 돌면 이 순서야."},
 {t:"pick",q:"경학사와 신흥 강습소가 세워진 곳은?",c:["서간도 삼원보","북간도"],a:0,e:"서간도야. 북간도는 간민회·명동 학교·중광단이지."},
 {t:"chain",pr:5,title:"1910년대 국외 독립운동 기지 (프린트 표)",items:["<b>북간도</b> — 명동촌 · 간민회 · 명동 학교 · 중광단(→ 북로 군정서)","<b>서간도</b> — 신민회(이회영 · 이상룡)가 삼원보에, 경학사 → 부민단, 신흥 강습소 → <b>신흥 무관 학교</b>, 서로 군정서","<b>연해주</b> — 신한촌 · 권업회 · 한민 학교 · <b>대한 광복군 정부</b>(이상설 · 이동휘)","<b>상하이</b> — 동제사(신규식) · 신한청년당","<b>미주</b> — 대한인 국민회(안창호) · 대조선 국민군단(박용만, 하와이)"]},
 {t:"check",pr:5,q:"1910년대 무장 독립 전쟁 준비는 만주, 연해주 일대에서만 이루어졌다 — ○일까 ×일까?",a:"× — 미주 하와이에서도 박용만이 대조선 국민군단을 만들었어.",hint:"바다 건너 하와이"}
 ],
 quiz:[
 {q:"신흥 무관 학교의 전신은?",c:["신흥 강습소","서전서숙","명동 학교","대성 학교"],a:0,e:"서간도 삼원보에서 시작됐어."},
 {q:"중광단을 만든 종교 세력은?",c:["대종교","천도교","기독교","불교"],a:0,e:"서일 등 대종교 간부들이 만들었고 북로 군정서가 됐어."},
 {q:"연해주에서 이상설·이동휘를 정·부통령으로 세운 조직은?",c:["대한 광복군 정부","대한인 국민회","동제사","경학사"],a:0,e:"신한촌·권업회에 이어 세워졌어."},
 {q:"국민 주권론을 편 1917년 선언은?",c:["대동단결 선언","2·8 독립 선언","3·1 독립 선언서","대한민국 건국 강령"],a:0,e:"임시 정부 수립의 이론적 바탕이 됐어."}
 ]},

{id:"L12",u:"s6",part:"1919년 봄",title:"불씨가 모이다",sc:"spark",
 hook:"3·1 운동은 어느 날 갑자기 터진 게 아니야. 국제 정세, 유학생, 그리고 한 사람의 죽음. 세 가지가 겹쳤어.",
 cards:[
 {t:"fact",y:1918,n:"국제적 배경",b:"러시아 혁명 뒤 <b>레닌</b>이 약소민족의 해방 운동을 돕겠다고 선언했고, 미국 대통령 <b>윌슨</b>은 <b>민족 자결주의</b>를 내놨어.",
  why:"제1차 세계 대전이 끝나며 세계 질서를 다시 짜던 참이었어.",
  so:"'지금이 기회다. 우리 뜻을 세계에 알리면 도와줄지 모른다'는 판단이 섰어."},
 {t:"fact",y:1919,n:"김규식의 파리 파견",b:"상하이의 <b>신한청년당</b>이 한국의 독립을 청원하려 <b>김규식</b>을 파리 강화 회의에 대표로 보냈어.",
  why:"민족 자결주의가 논의되는 자리에 직접 가야 했으니까.",
  so:"'우리가 독립을 원한다는 증거'가 필요해졌어. 국내에서 큰 시위가 일어나야 대표의 말에 힘이 실리거든."},
 {t:"fact",y:1919,n:"2·8 독립 선언",b:"일본에 유학 중이던 학생들이 <b>조선 청년 독립단</b> 이름으로 도쿄에서 독립 선언서를 발표했어. '요구가 실현되지 않으면 영원히 혈전을 벌이겠다'고 했지.",
  why:"파리 회의에 맞춰 목소리를 내야 했어.",
  so:"적의 심장부에서 터진 선언이라 국내에 큰 충격을 줬어. 3·1 운동의 직접적 계기야."},
 {t:"check",q:"도쿄에서 유학생들이 발표한 선언은?",a:"2·8 독립 선언",hint:"3·1 운동보다 3주쯤 앞서 있었어"},
 {t:"fact",y:1919,n:"고종의 서거",b:"1월에 고종이 세상을 떠났어. 일제가 독살했다는 소문이 퍼지며 분노가 크게 번졌지.",
  why:"이미 강제 퇴위당한 황제였기에 사람들의 감정이 복잡했어.",
  so:"천도교·기독교·불교 지도자와 학생들이 <b>고종의 국장일</b>에 즈음해 만세 시위를 계획했어. 사람이 많이 모이는 날이었거든."},
 {t:"chain",title:"불씨가 모인 순서",items:["레닌 · 윌슨의 민족 자결주의","신한청년당, 김규식을 파리로","2·8 독립 선언 (도쿄)","고종 서거 · 국장일","3·1 운동"]},
 {t:"hint",k:"레 · 윌 · 김 · 2·8 · 고종",b:"국제(<em>레</em>닌·<em>윌</em>슨) → 국외(<em>김</em>규식 파리, <em>2·8</em> 도쿄) → 국내(<em>고종</em> 서거). 바깥에서 안으로 좁혀 들어와."},
 {t:"pick",q:"3·1 운동이 계획된 날은?",c:["고종의 국장일 즈음","순종의 장례일"],a:0,e:"고종이야. 순종의 장례일에 일어난 건 6·10 만세 운동(1926)이지. 이걸 바꿔 내는 문제가 아주 많아."}
 ],
 quiz:[
 {q:"민족 자결주의를 제창한 사람은?",c:["윌슨","레닌","김규식","손병희"],a:0,e:"레닌은 약소민족 해방 운동 지원을 선언했어."},
 {q:"김규식을 파리 강화 회의에 파견한 단체는?",c:["신한청년당","동제사","대한인 국민회","의열단"],a:0,e:"상하이에서 활동하던 단체야."},
 {q:"도쿄에서 발표된 독립 선언은?",c:["2·8 독립 선언","3·1 독립 선언서","대동단결 선언","기미 독립 선언"],a:0,e:"조선 청년 독립단 이름으로 발표했어."},
 {q:"3·1 운동을 계획할 때 기준으로 삼은 날은?",c:["고종의 국장일","순종의 장례일","일왕의 생일","광복절"],a:0,e:"사람이 많이 모이는 날이었어."}
 ]},

{id:"L13",u:"s6",part:"1919년 봄",title:"만세",sc:"flag",
 hook:"1919년 3월 1일. 그날 실제로 무슨 일이 있었는지 시간 순서대로 따라가 보자. 장소 두 곳만 헷갈리지 않으면 돼.",
 cards:[
 {t:"fact",y:1919,n:"민족 대표의 독립 선언",b:"손병희·이승훈·한용운 등 민족 대표 33인은 원래 탑골 공원에서 선언식을 하려 했어. 그런데 시위가 과격해질까 걱정해 <b>태화관</b>이라는 음식점에 모여 선언식을 했지.",
  why:"충돌로 사람이 다칠 것을 우려했어.",
  so:"민족 대표는 태화관, 학생과 시민은 탑골 공원. 이 둘을 바꿔 내는 문제가 단골이야."},
 {t:"fact",y:1919,n:"탑골 공원의 만세",b:"탑골 공원에서는 학생과 시민이 독립 선언서를 낭독하고 '대한 독립 만세'를 외치며 거리로 쏟아져 나왔어.",
  why:"민족 대표가 오지 않자 학생들이 직접 나선 거야.",
  so:"평양·원산 등 주요 도시로 순식간에 번졌어."},
 {t:"check",q:"민족 대표 33인이 독립 선언식을 한 장소는?",a:"태화관",hint:"탑골 공원이 아니야. 학생과 시민이 그곳에 있었지"},
 {t:"fact",y:1919,n:"전국으로, 모든 계층으로",b:"도시에서 농촌으로 번졌는데, 농촌에서는 주로 <b>장날</b>을 이용했어. 학생·교사·상인·노동자는 물론 기생과 걸인까지 계층을 가리지 않고 참여했지.",
  why:"장날은 사람이 자연스럽게 모이는 날이라 발각될 위험이 적었어.",
  so:"'전 민족적'이라는 표현이 괜한 말이 아니야. 이게 3·1 운동의 가장 큰 특징이야."},
 {t:"fact",y:1919,n:"제암리 학살",b:"경기도 화성 제암리에서 일본군이 주민들을 교회에 모아 놓고 문을 잠근 채 총을 쏘고 불을 질렀어.",
  why:"시위를 공포로 꺾으려 한 보복이었어.",
  so:"이런 잔혹한 진압이 알려지면서 국제 여론이 크게 나빠졌어."},
 {t:"fact",y:1919,n:"무력 투쟁으로",b:"헌병 경찰의 무자비한 진압에 시위가 격해지면서, 일부 농민은 경찰 관서와 헌병대 같은 식민 통치 기관을 습격했어.",
  why:"평화적으로 외쳐도 총으로 답이 돌아왔으니까.",
  so:"'3·1 운동은 처음부터 끝까지 평화적이었다'는 문장은 <b>×</b>야. 뒤로 갈수록 무력 투쟁 양상으로 발전했어."},
 {t:"chain",title:"그날의 흐름",items:["민족 대표 — 태화관","학생·시민 — 탑골 공원","주요 도시로 확산","농촌은 장날에","제암리 학살 → 무력 투쟁으로 발전"]},
 {t:"pick",q:"3·1 운동의 전개에 대한 설명으로 옳은 것은?",c:["뒤로 갈수록 무력 투쟁 양상으로 발전했다","끝까지 평화적 만세 시위로만 진행됐다"],a:0,e:"무자비한 진압에 맞서 통치 기관을 습격하기도 했어."},
 {t:"chain",pr:6,title:"3·1 운동의 세 단계 (프린트)",items:["<b>1단계</b> — 태화관(민족 대표) · 탑골 공원(학생 · 시민)에서 독립 선언 → 서울 · 평양 · 원산 등 도시에서 만세 시위","<b>2단계</b> — 전국 도시로, 교사 · 상인 · 노동자 가담 → 상인은 가게 문을 닫고(철시) 노동자는 파업","<b>3단계</b> — 농촌으로(장날 장터 중심) → 탄압에 맞서 <b>무력 투쟁</b>으로, 만주 · 연해주 · 미주 · 일본 등 국외로도"]},
 {t:"check",pr:6,q:"3·1 운동은 민족 대표들이 탑골 공원에서 독립 선언서를 낭독하며 시작되었다 — ○일까 ×일까?",a:"× — 민족 대표는 태화관에서, 탑골 공원에서는 학생과 시민이 독립 선언서를 읽었어.",hint:"대표는 식당, 학생은 공원"}
 ],

 {q:"농촌에서 만세 시위가 주로 열린 때는?",c:["장날","일요일","국장일","추석"],a:0,e:"사람이 자연스럽게 모이는 날이었어."},
 {q:"일본군이 주민을 교회에 모아 놓고 학살한 사건이 일어난 곳은?",c:["경기도 화성 제암리","평안도 정주","함경도 원산","전남 암태도"],a:0,e:"제암리 학살이야."},

{id:"L14",u:"s6",part:"1919년 봄",title:"그날이 바꾼 것",sc:"chain",
 hook:"3·1 운동은 곧바로 독립으로 이어지지 않았어. 그런데도 우리 근현대사에서 가장 중요한 사건으로 꼽혀. 왜일까?",
 cards:[
 {t:"story",h:"결과부터 보자",b:"3·1 운동이 남긴 건 세 가지야. ① 대한민국 임시 정부가 세워졌고 ② 일제가 문화 정치로 바꿨고 ③ 중국 5·4 운동 같은 다른 약소민족 운동에 영향을 줬어. 이 세 개가 시험에 나오는 전부라고 봐도 돼."},
 {t:"fact",y:1919,n:"임시 정부 수립의 계기",b:"운동을 겪으며 독립운동가들은 깨달았어. '전국이 동시에 일어났는데 이를 이끌 지도부가 없구나.'",
  why:"흩어진 힘을 하나로 묶을 구심점이 필요했어.",
  so:"이 인식에서 <b>대한민국 임시 정부</b>가 세워져. 3·1 운동의 가장 큰 결과야."},
 {t:"fact",y:1919,n:"통치 방식의 전환",b:"일제는 총칼로는 한국인의 독립 의지를 꺾을 수 없다는 걸 알게 됐어.",
  why:"전 민족이 일어났고 국제 여론도 나빠졌으니까.",
  so:"무단 통치를 접고 이른바 <b>문화 정치</b>로 바꿨어. 물론 속은 민족 분열 통치였지."},
 {t:"fact",y:1919,n:"민족 운동 주체의 확대",b:"학생·농민·노동자·여성이 모두 참여했어. 이화 학당 학생 <b>유관순</b>은 천안 아우내 장터에서 시위를 이끌다 붙잡혀 옥중에서 순국했지.",
  why:"모두가 당사자였으니까.",
  so:"이후 학생 운동, 농민·노동 운동, 여성 운동이 활발해지는 밑바탕이 됐어."},
 {t:"fact",y:1919,n:"세계사적 의의",b:"대표적인 반제국주의 민족 운동으로 꼽혀. 중국의 <b>5·4 운동</b> 등 다른 약소민족의 운동에 영향을 줬어.",
  why:"'무력한 한국'이라는 이미지를 '독립을 위해 저항하는 한국'으로 바꿔 놓았거든.",
  so:"우리 안에서만 의미 있는 사건이 아니라는 뜻이야."},
 {t:"chain",title:"3·1 운동이 낳은 것",items:["3·1 운동(1919)","① 대한민국 임시 정부 수립","② 일제, 문화 정치로 전환","③ 중국 5·4 운동 등에 영향","민족 운동 주체 확대 → 1920년대 대중 운동"]},
 {t:"hint",k:"임 · 문 · 5·4",b:"결과 셋만 외우면 돼. <em>임</em>시 정부 · <em>문</em>화 정치 · <em>5·4</em> 운동. 서술형에도 이 세 개를 쓰면 점수가 나와."},
 {t:"pick",q:"3·1 운동의 결과로 볼 수 없는 것은?",c:["6·10 만세 운동이 일어났다","대한민국 임시 정부가 수립됐다"],a:0,e:"6·10 만세 운동은 1926년, 순종의 장례일에 일어난 별개 사건이야."},
 {t:"check",pr:6,q:"3·1 운동에 놀란 일제는 '문화 정치'에서 폭압적인 무단 통치로 지배 정책을 바꾸었다 — ○일까 ×일까?",a:"× — 거꾸로야. 무단 통치 → '문화 정치'.",hint:"순서를 뒤집은 함정"}
 ],
 quiz:[
 {q:"3·1 운동의 가장 큰 결과는?",c:["대한민국 임시 정부 수립","광복","신간회 창립","봉오동 전투 승리"],a:0,e:"운동을 이끌 구심점의 필요성에서 나왔어."},
 {q:"3·1 운동이 영향을 준 중국의 운동은?",c:["5·4 운동","의화단 운동","양무운동","신해혁명"],a:0,e:"대표적인 반제국주의 민족 운동으로 평가받아."},
 {q:"3·1 운동 이후 일제의 통치 방식은?",c:["문화 정치로 전환","무단 통치 강화","민족 말살 통치 시작","병참 기지화"],a:0,e:"총칼로는 안 된다는 걸 깨달았어."},
 {q:"천안 아우내 장터에서 만세 시위를 주도한 인물은?",c:["유관순","한이순","정정화","김마리아"],a:0,e:"이화 학당 학생으로 옥중에서 순국했어."}

{id:"L15",u:"s7",part:"나라를 다시 세우다",title:"세 정부가 하나로",sc:"building2",
 hook:"3·1 운동 뒤 임시 정부가 세 곳에 생겼어. 하나로 합쳐야 힘이 되는데, 어디에 둘지가 문제였지. 그 선택의 이유가 시험 포인트야.",
 cards:[
 {t:"fact",y:1919,n:"세 곳의 임시 정부",b:"연해주에 <b>대한 국민 의회</b>, 상하이에 <b>대한민국 임시 정부</b>, 국내에서는 <b>한성 정부</b> 수립이 선포됐어.",
  why:"각지의 독립운동 세력이 저마다 정부를 세운 거야.",
  so:"곧바로 하나로 합치는 통합 운동이 시작됐어."},
 {t:"fact",y:1919,n:"왜 상하이였을까",b:"통합 과정에서 '한인이 많고 무장 투쟁에 유리한 간도나 연해주에 두자'는 주장이 나왔어. 하지만 결국 <b>상하이</b>로 정했지.",
  why:"상하이에는 서구 열강의 조계 지역이 많아 <b>외교 활동</b>에 유리했거든.",
  so:"초기 임시 정부가 외교에 힘을 쏟은 이유가 여기 있어. 그리고 이게 뒷날 갈등의 씨앗이 되기도 해."},
 {t:"check",q:"임시 정부를 상하이에 둔 이유는?",a:"외교 활동에 유리해서",hint:"조계 지역이 많았거든"},
 {t:"fact",y:1919,n:"통합의 방식",b:"<b>한성 정부의 법통</b>을 계승하고, 대한 국민 의회를 통합하는 형태로 정리됐어.",
  why:"국내에서 선포된 정부를 정통으로 삼아야 명분이 섰어.",
  so:"이렇게 해서 하나의 대한민국 임시 정부가 완성돼."},
 {t:"fact",y:1919,n:"민주 공화제 채택",b:"우리 역사상 <b>최초의 민주 공화제 정부</b>야. 삼권 분립에 따라 입법은 <b>임시 의정원</b>, 행정은 <b>국무원</b>, 사법은 <b>법원</b>을 두었지.",
  why:"대동단결 선언에서 다져 온 국민 주권론이 실제 제도가 된 거야.",
  so:"황제의 나라 대한 제국에서 국민의 나라 대한민국으로 넘어간 결정적 지점이야. 지금 헌법도 '3·1 운동으로 건립된 대한민국 임시 정부의 법통'을 잇는다고 적고 있어."},
 {t:"fact",y:1919,n:"초대 각료",b:"대한민국 임시 헌법을 공포하고 임시 대통령에 <b>이승만</b>, 국무총리에 <b>이동휘</b>를 뽑았어.",
  why:"이승만은 외교 노선, 이동휘는 무장 투쟁 노선을 대표했어.",
  so:"노선이 다른 두 사람이 함께 있었다는 게 뒷날 갈등으로 이어져."},
 {t:"chain",title:"통합의 과정",items:["대한 국민 의회 (연해주)","대한민국 임시 정부 (상하이)","한성 정부 (국내)","한성 정부의 법통 계승 + 대한 국민 의회 통합","상하이에 자리 — 외교에 유리해서","최초의 민주 공화제 · 삼권 분립"]},
 {t:"hint",k:"국(연해주) · 상(상하이) · 한(국내)",b:"세 정부의 앞 글자. 그리고 <em>한</em>성의 법통을 잇고 <em>상</em>하이에 앉았다고 기억해."},
 {t:"pick",q:"임시 정부가 계승한 법통은?",c:["한성 정부","대한 국민 의회"],a:0,e:"한성 정부의 법통을 계승하고 대한 국민 의회를 통합했어."}
 ],

 {q:"임시 정부의 입법 기관은?",c:["임시 의정원","국무원","법원","구미 위원부"],a:0,e:"행정은 국무원, 사법은 법원이야."},

{id:"L16",u:"s7",part:"나라를 다시 세우다",title:"돈과 소식을 나르다",sc:"route",
 hook:"나라 밖에 정부를 세웠는데, 국내 사람들과 어떻게 연락하고 어떻게 돈을 모았을까? 이름이 비슷한 조직 둘만 구분하면 돼.",
 cards:[
 {t:"fact",y:1919,n:"연통제",b:"국내에 몰래 설치한 <b>비밀 행정 조직</b>이야. 군자금을 모으고 정부의 문서와 명령을 전달했어.",
  why:"국외 정부가 국내를 다스리려면 행정 통로가 있어야 했어.",
  so:"행정이 핵심이야. 세금 걷고 명령 내리는 역할."},
 {t:"fact",y:1919,n:"교통국",b:"<b>통신 기관</b>이야. 정보를 모으고 분석하고 독립운동 자금을 모집했어. 특히 <b>이륭 양행</b>에 사무소를 둔 안동 교통국의 활약이 컸지.",
  why:"소식을 나르는 전용 조직이 필요했어.",
  so:"이륭 양행은 아일랜드계 영국인 조지 루이스 쇼가 운영하던 회사야. 아일랜드도 영국의 식민지였기에 한국 사정을 이해하고 도왔지."},
 {t:"compare",title:"이름이 헷갈리는 둘",l:{n:"연통제",p:["국내 <b>비밀 행정</b> 조직","군자금 조달","정부 문서 · 명령 전달"]},
  r:{n:"교통국",p:["<b>통신</b> 기관","정보 수집과 분석","<b>이륭 양행</b> 안동 교통국"]}},
 {t:"check",q:"이륭 양행에 사무소를 둔 조직은?",a:"교통국",hint:"소식을 나르는 쪽이야"},
 {t:"fact",y:1919,n:"독립 공채",b:"광복 후에 갚겠다고 약속하고 발행한 증서야. 국내는 물론 미주 동포에게도 팔았어.",
  why:"정부를 운영하려면 돈이 있어야 했으니까.",
  so:"들키면 큰 고초를 겪기에 불태우거나 가족조차 모르게 숨긴 경우가 많았어. 광복 후 1983년에야 상환이 시작됐는데 신청은 많지 않았대."},
 {t:"fact",y:1919,n:"구미 위원부",b:"<b>미국</b>에 설치해 대통령 이승만을 중심으로 외교 활동을 폈어.",
  why:"열강의 지지를 얻는 게 초기 임시 정부의 주요 전략이었어.",
  so:"'구미'는 유럽과 미국을 뜻해. 상하이가 아니라 미국에 있었다는 걸 꼭 기억해."},
 {t:"fact",y:1919,n:"독립신문과 사료집",b:"『독립신문』을 펴내 동포들에게 소식을 알렸고, 임시 사료 편찬회를 두어 『한일 관계 사료집』을 냈어.",
  why:"독립 의식을 높이고, 국제 사회에 한국 독립의 정당성을 알리려 했어.",
  so:"선전과 기록도 독립운동의 한 축이었어."},
 {t:"chain",title:"임시 정부를 굴린 네 가지",items:["연통제 — 국내 행정","교통국 — 통신 (이륭 양행)","독립 공채 — 자금","구미 위원부 — 외교 (미국)"]},
 {t:"hint",k:"연 · 교 · 공 · 구",b:"<em>연</em>통제(행정) · <em>교</em>통국(통신) · 독립 <em>공</em>채(자금) · <em>구</em>미 위원부(외교). 네 글자로 임시 정부 활동이 다 들어가."},
 {t:"pick",q:"구미 위원부가 설치된 곳은?",c:["미국","상하이"],a:0,e:"미국이야. 이승만을 중심으로 외교 활동을 벌였어."},
 {t:"check",pr:7,q:"대한민국 임시 정부의 통신 기관으로서 정보 수집과 분석, 독립운동 자금 모집의 역할을 하면서 연통제 활동을 보조한 기관은?",a:"교통국 — 선생님이 밑줄로 고친 문제야. 연통제는 비밀 행정 조직, 교통국은 그걸 돕는 통신 기관.",hint:"행정이 아니라 통신"},
 {t:"check",pr:7,q:"초기의 대한민국 임시 정부는 외교 활동에만 주력하고 무장 투쟁에는 관심이 없었다 — ○일까 ×일까?",a:"× — 국무원 아래 군무부를 두고, 직할 부대로 육군 주만 참의부 등을 편성했어.",hint:"군무부"}
 ],

 {q:"이륭 양행에 근거를 둔 조직은?",c:["교통국","연통제","구미 위원부","군무부"],a:0,e:"통신 기관인 교통국의 안동 지부야."},
 {q:"구미 위원부가 설치된 나라는?",c:["미국","중국","러시아","프랑스"],a:0,e:"이승만 중심의 외교 기관이야."},

{id:"L17",u:"s7",part:"나라를 다시 세우다",title:"흔들리다",sc:"fog",
 hook:"기대를 모으고 출발했지만 몇 년 만에 임시 정부는 흔들렸어. 왜 그랬는지, 그리고 어떻게 수습했는지가 이 레슨이야.",
 cards:[
 {t:"story",h:"세 가지가 겹쳤어",b:"① 연통제와 교통국이 일제에 발각돼 자금줄이 끊겼고 ② 외교 활동이 뚜렷한 성과를 내지 못했고 ③ 이승만이 국제 연맹에 위임 통치를 요청했던 사실이 알려져 신채호 등이 크게 반발했어."},
 {t:"fact",y:1923,n:"국민 대표 회의",b:"각계 독립운동 지도자가 모여 새 방향을 찾으려 했어. 그런데 <b>개조파</b>와 <b>창조파</b>로 갈려 대립하다 결렬됐지.",
  why:"노선 차이가 이미 너무 깊었어. 외교냐 무장 투쟁이냐, 민족주의냐 사회주의냐.",
  so:"많은 독립운동가가 떠나면서 임시 정부는 침체에 빠져."},
 {t:"compare",title:"개조파 vs 창조파",l:{n:"개조파",p:["임시 정부는 <b>민족의 대표 기관</b>","3·1 운동의 열망으로 출범했으니 정통성 인정","조직과 체제를 <b>개선</b>하자","→ 고쳐 쓰자"]},
  r:{n:"창조파",p:["상하이 임정의 계통을 이을 <b>이유 없다</b>","실제 독립운동에 맞는 <b>새 조직</b> 필요","→ 새로 만들자","결과: 대립 끝에 <b>결렬</b>"]}},
 {t:"check",q:"임시 정부를 고쳐 쓰자고 한 쪽은?",a:"개조파",hint:"'개조'라는 말 자체가 고친다는 뜻이야"},
 {t:"fact",y:1925,n:"이승만 탄핵",b:"미주 지역 자금을 독점하고 대통령 직무를 다하지 않았다는 이유로 탄핵됐어. 위임 통치 청원 문제도 컸지. 후임 제2대 대통령은 <b>박은식</b>이야.",
  why:"지도부가 제 역할을 못 하니 정리가 필요했어.",
  so:"임시 정부가 스스로 지도자를 갈아치울 수 있는 조직이었다는 뜻이기도 해."},
 {t:"fact",y:1926,n:"국무령 중심 체제",b:"헌법을 고쳐 대통령제에서 <b>국무령 중심의 집단 지도 체제</b>로 바꿨어. <b>이동녕</b>과 <b>김구</b>를 중심으로 조직을 다시 세웠지.",
  why:"한 사람에게 힘이 몰리는 구조가 문제였으니까.",
  so:"이 체제 아래에서 김구가 뒷날 한인 애국단을 만들어 침체를 뚫어 내게 돼."},
 {t:"chain",title:"위기와 수습",items:["연통제·교통국 발각 · 외교 성과 부진","국민 대표 회의(1923) — 개조파 vs 창조파","결렬 → 침체","이승만 탄핵, 박은식 취임(1925)","국무령 중심 집단 지도 체제(1926)"]},
 {t:"hint",k:"국(23) · 탄(25) · 국무령(26)",b:"<em>국</em>민 대표 회의 1923 → 이승만 <em>탄</em>핵 1925 → <em>국무령</em> 체제 1926. 2년, 1년 간격이야."},
 {t:"pick",q:"국민 대표 회의의 결과는?",c:["개조파와 창조파의 대립으로 결렬","임시 정부가 해산됨"],a:0,e:"결렬 후 많은 이가 떠나 침체에 빠졌지만 정부는 유지됐어."}
 ],
 quiz:[
 {q:"1923년 임시 정부의 방향을 논의한 회의는?",c:["국민 대표 회의","관민 공동회","만민 공동회","임시 의정원 회의"],a:0,e:"개조파와 창조파의 대립으로 결렬됐어."},
 {q:"임시 정부를 고쳐 쓰자고 주장한 쪽은?",c:["개조파","창조파","외교론자","무장 투쟁론자"],a:0,e:"창조파는 새 조직을 만들자고 했어."},
 {q:"이승만 탄핵 후 제2대 대통령이 된 사람은?",c:["박은식","김구","이동녕","안창호"],a:0,e:"『한국통사』를 쓴 역사학자이기도 해."},
 {q:"1926년 임시 정부가 바꾼 체제는?",c:["국무령 중심 집단 지도 체제","대통령 중심제","내각 책임제","주석 중심제"],a:0,e:"한 사람에게 권력이 몰리는 걸 막으려 했어."}
 ]},

{id:"L18",u:"s8",part:"총을 들다",title:"봉오동에서 청산리로",sc:"mountain",
 hook:"3·1 운동 뒤 '평화적으로는 안 되겠다'는 생각이 퍼졌어. 만주의 독립군이 일본 정규군과 정면으로 붙어 이긴 두 번의 싸움, 이건 반드시 구분해야 해.",
 cards:[
 {t:"story",h:"왜 만주였을까",b:"독립군은 국경 너머 만주와 연해주에 기지를 두고 수시로 압록강·두만강을 건너와 일본 군경을 공격했어. 위협을 느낀 일본군이 추격대를 편성해 두만강을 건너오면서 정면 대결이 벌어져."},
 {t:"fact",y:1920,n:"봉오동 전투",b:"<b>홍범도</b>의 대한 독립군, <b>안무</b>의 국민회군, <b>최진동</b>의 군무 도독부군이 연합했어. 일본군을 봉오동 골짜기로 유인한 뒤 미리 매복해 있다가 기습해 크게 이겼지. 1920년 6월이야.",
  why:"지형을 아는 쪽이 유리하다는 걸 알았거든.",
  so:"패배한 일제는 대규모 병력을 동원할 구실을 찾게 돼."},
 {t:"fact",y:1920,n:"훈춘 사건",b:"일제가 중국 마적을 매수해 훈춘의 일본 영사관을 공격하게 한 <b>자작극</b>이야.",
  why:"'우리 국민이 공격당했으니 군대를 보낸다'는 명분을 스스로 만든 거지.",
  so:"이 구실로 약 2만 명의 병력을 만주에 투입했어."},
 {t:"check",q:"일제가 만주 출병 구실을 만들려 꾸민 자작극은?",a:"훈춘 사건",hint:"중국 마적을 매수했어"},
 {t:"fact",y:1920,n:"청산리 대첩",b:"<b>김좌진</b>의 북로 군정서와 <b>홍범도</b>의 대한 독립군 등이 연합했어. <b>백운평</b> 전투를 시작으로 완루구·어랑촌·고동하 등 10여 차례를 싸워 일본군을 크게 격파했지. 1920년 10월이야.",
  why:"백두산 방향으로 이동하며 유리한 지점을 골라 반격했어.",
  so:"독립 전쟁사 최대의 승리야. 간도 한인들이 총알이 빗발치는 산으로 밥을 날라 준 덕도 컸어."},
 {t:"compare",title:"절대 헷갈리면 안 되는 둘",l:{n:"봉오동 전투 (1920. 6.)",p:["<b>홍범도</b>의 대한 독립군","+ 안무 국민회군, 최진동 군무 도독부군","골짜기로 <b>유인</b>해 매복 기습","→ 일제가 훈춘 사건 조작"]},
  r:{n:"청산리 대첩 (1920. 10.)",p:["<b>김좌진</b>의 북로 군정서 + 홍범도","<b>백운평</b>·어랑촌·고동하 등 10여 차례","독립 전쟁사 최대의 승리","→ 보복으로 간도 참변"]}},
 {t:"hint",k:"봉-홍 / 청-김",b:"<em>봉</em>오동은 <em>홍</em>범도, <em>청</em>산리는 <em>김</em>좌진. 둘 다 ㅇ·ㅎ / ㅊ·ㄱ 로 짝지어 외워. 홍범도는 둘 다 참여했다는 것도 기억해 두면 좋아."},
 {t:"pick",q:"청산리 대첩의 첫 전투는?",c:["백운평 전투","봉오동 전투"],a:0,e:"백운평을 시작으로 어랑촌·고동하 등 10여 차례를 싸웠어."}
 ],
 quiz:[
 {q:"봉오동 전투를 이끈 인물은?",c:["홍범도","김좌진","지청천","양세봉"],a:0,e:"안무·최진동 부대와 연합했어."},
 {q:"일제가 만주 출병 구실로 조작한 사건은?",c:["훈춘 사건","제암리 사건","자유시 참변","간도 참변"],a:0,e:"중국 마적을 매수한 자작극이야."},
 {q:"청산리 대첩의 주력 부대는?",c:["북로 군정서","대한 독립군","조선 혁명군","한국 독립군"],a:0,e:"김좌진이 이끌었고 중광단에서 발전한 부대야."},
 {q:"청산리 대첩에 포함되지 않는 전투는?",c:["봉오동 전투","백운평 전투","어랑촌 전투","고동하 전투"],a:0,e:"봉오동은 그 넉 달 전 별개의 전투야."}
 ]},

{id:"L19",u:"s8",part:"총을 들다",title:"두 번의 참변, 그리고 3부",sc:"snow",
 hook:"승리 뒤에 곧바로 비극이 왔어. 이름이 비슷한 두 참변, 가해자가 서로 달라. 이것만 구분하면 이 레슨은 끝이야.",
 cards:[
 {t:"fact",y:1920,n:"간도 참변",b:"일제가 독립군의 근거지를 없앤다는 구실로 서너 달에 걸쳐 간도의 한인 마을을 불태우고 수많은 한인을 학살했어.",
  why:"청산리 대첩에 대한 <b>보복</b>이었어.",
  so:"가해자는 <b>일본군</b>이야. 독립군을 도운 민간인을 겨냥한 학살이었지."},
 {t:"fact",y:1921,n:"자유시 참변",b:"간도의 독립군 4천여 명이 밀산에 모였다가 레닌의 지원을 기대하며 러시아 <b>자유시</b>로 옮겨 갔어. 그런데 부대를 통합하는 과정에서 지휘권을 둘러싼 분쟁이 일어났고, 지휘권 양도를 거부한 독립군을 러시아 <b>적군</b>이 무장 해제하면서 많은 이가 희생됐지.",
  why:"여러 부대가 모였는데 누가 지휘하느냐를 정하지 못했어.",
  so:"가해자는 <b>러시아 적군</b>이야. 원인은 <b>지휘권 분쟁</b>이고. 간도 참변과 바꿔 내는 문제가 정말 많아."},
 {t:"compare",title:"가해자가 다르다",l:{n:"간도 참변 (1920)",p:["가해자: <b>일본군</b>","구실: 독립군 근거지 제거","청산리 대첩에 대한 보복","한인 마을 방화 · 민간인 학살"]},
  r:{n:"자유시 참변 (1921)",p:["가해자: 러시아 <b>적군</b>","배경: 밀산 집결 → 자유시 이동","원인: <b>지휘권</b> 분쟁","무장 해제 과정에서 희생"]}},
 {t:"check",q:"자유시 참변의 가해자는?",a:"러시아 적군",hint:"일본군이 아니야. 그게 함정이지"},
 {t:"fact",y:1924,n:"3부의 성립",b:"두 참변으로 큰 타격을 입은 독립군이 전열을 가다듬고 부대를 통합했어. 남만주에 <b>참의부</b>, 지린성 일대에 <b>정의부</b>, 북만주에 <b>신민부</b>가 세워졌지.",
  why:"흩어져서는 버틸 수 없었으니까.",
  so:"신민부는 자유시에서 돌아온 독립군이 중심이 됐어."},
 {t:"fact",y:1925,n:"3부의 성격",b:"민정 조직과 군정 조직을 함께 갖췄어. 관할 구역 한인들에게 세금을 걷어 운영한 사실상의 <b>공화주의 자치 정부</b>였지.",
  why:"동포 사회를 지키면서 군대도 길러야 했으니까.",
  so:"단순한 부대가 아니라 '정부'였다는 게 핵심이야."},
 {t:"fact",y:1925,n:"미쓰야 협정",b:"조선 총독부 경무 국장 미쓰야가 만주 <b>군벌</b>과 맺은 협정이야. 한국인 독립운동가를 체포해 일본 경찰에 넘기도록 했지.",
  why:"일본군이 직접 못 잡으니 중국 쪽 손을 빌린 거야.",
  so:"중국 관헌이 독립운동가를 잡아 넘기고 포상금을 받으면서 만주 독립운동이 크게 위축됐어."},
 {t:"fact",y:1929,n:"3부 통합 운동",b:"위기를 넘으려 3부를 합치려 했지만 방법을 두고 의견이 갈려 완전한 통합에는 이르지 못했어. 남만주의 <b>국민부</b>와 북만주의 <b>혁신 의회</b>로 재편됐지.",
  why:"미쓰야 협정으로 활동이 막히자 뭉쳐야 했어.",
  so:"국민부는 조선 혁명당을 만들고 그 아래 <b>조선 혁명군</b>을, 혁신 의회는 해체된 뒤 한국 독립당으로 이어져 <b>한국 독립군</b>을 편성해."},
 {t:"hint",k:"참(남) · 정(지린) · 신(북)",b:"<em>참</em>의부 남만주, <em>정</em>의부 지린, <em>신</em>민부 북만주. 그리고 통합은 <em>국민부</em>(남)와 <em>혁신 의회</em>(북) 둘로 갈렸다고 기억해."},
 {t:"pick",q:"간도 참변의 가해자는?",c:["일본군","러시아 적군"],a:0,e:"간도는 일본군, 자유시는 러시아 적군이야."}
 ],
 quiz:[
 {q:"청산리 대첩에 대한 보복으로 일어난 사건은?",c:["간도 참변","자유시 참변","훈춘 사건","미쓰야 협정"],a:0,e:"일본군이 간도의 한인을 학살했어."},
 {q:"자유시 참변의 직접적 원인은?",c:["지휘권을 둘러싼 분쟁","일본군의 기습","식량 부족","중국군의 배신"],a:0,e:"러시아 적군이 무장 해제하는 과정에서 희생됐어."},
 {q:"3부에 해당하지 않는 것은?",c:["국민부","참의부","정의부","신민부"],a:0,e:"국민부는 3부 통합 운동의 결과로 나온 조직이야."},
 {q:"1925년 조선 총독부가 만주 군벌과 맺은 협정은?",c:["미쓰야 협정","가쓰라·태프트 밀약","기유각서","한일 의정서"],a:0,e:"독립운동가를 체포해 넘기도록 했어."}
 ]},

{id:"L20",u:"s8",part:"총을 들다",title:"손을 잡다",sc:"twohand",
 hook:"무장 독립 전쟁의 마지막 이야기야. 일본이 만주를 삼키자 중국도 발등에 불이 떨어졌어. 그래서 한국 독립군과 중국군이 손을 잡게 돼. 지휘관 두 명과 전투 이름만 짝지으면 끝나.",
 cards:[
 {t:"story",h:"왜 손을 잡았을까",b:"1931년 만주 사변, 이듬해 만주국 수립. 중국 안에서 일본에 대한 반감이 치솟았어. 적이 같아진 거지. 그래서 만주에서 활동하던 독립군이 항일 중국군과 연합해 싸우게 돼."},
 {t:"fact",y:1932,n:"조선 혁명군 — 양세봉",b:"<b>양세봉</b>이 이끄는 조선 혁명군(국민부 계열)이 <b>남만주</b>에서 중국 의용군과 힘을 합쳤어. <b>영릉가 전투</b>(1932)에서 일본군을 물리치고 영릉가성을 점령했고, <b>흥경성 전투</b>(1933)에서도 싸웠지.",
  why:"국민부가 남만주를 기반으로 했거든.",
  so:"양세봉이 전사한 뒤 세력이 약해졌지만 1930년대 후반까지 투쟁을 이어 갔어."},
 {t:"fact",y:1933,n:"한국 독립군 — 지청천",b:"<b>지청천</b>이 이끄는 한국 독립군(혁신 의회 계열)이 <b>북만주</b>에서 중국군과 연합했어. <b>쌍성보</b>(1932), <b>동경성</b>(1933), <b>대전자령</b>(1933) 전투에서 승리했지.",
  why:"혁신 의회가 북만주를 기반으로 했어.",
  so:"뒤에 임시 정부의 요청으로 중국 관내로 옮겨 갔고, 지청천은 <b>한국광복군</b> 창설을 주도하게 돼."},
 {t:"compare",title:"이 표만 외우면 끝",l:{n:"조선 혁명군",p:["총사령관 <b>양세봉</b>","모체: 국민부 → 조선 혁명당","활동: <b>남</b>만주","<b>영</b>릉가(32) · <b>흥</b>경성(33)"]},
  r:{n:"한국 독립군",p:["총사령관 <b>지청천</b>","모체: 혁신 의회 → 한국 독립당","활동: <b>북</b>만주","<b>쌍</b>성보(32) · <b>동</b>경성 · <b>대</b>전자령(33)"]}},
 {t:"check",q:"대전자령 전투를 이끈 지휘관은?",a:"지청천",hint:"북만주의 한국 독립군이야"},
 {t:"fact",y:1936,n:"동북 항일 연군",b:"중국 공산당이 만주의 항일 유격대를 모아 <b>동북 인민 혁명군</b>(1933)을 만들었고, 여기에 많은 한인 사회주의자가 참여했어. 이 부대가 1936년에 <b>동북 항일 연군</b>으로 발전해.",
  why:"사회주의 계열도 항일이라는 목표는 같았어.",
  so:"소속 한인 유격대원들은 민족주의자와 함께 <b>조국 광복회</b>를 조직했어(1936)."},
 {t:"chain",title:"만주 무장 투쟁 전체 흐름",items:["봉오동(1920.6) · 청산리(1920.10)","간도 참변 · 자유시 참변","3부 성립(1924)","미쓰야 협정(1925) → 3부 통합 운동(1929)","국민부 → 조선 혁명군 (양세봉)","혁신 의회 → 한국 독립군 (지청천)","한중 연합 작전 · 동북 항일 연군"]},
 {t:"hint",k:"양-남-영흥 / 지-북-쌍동대",b:"<em>양</em>세봉은 <em>남</em>만주에서 <em>영</em>릉가·<em>흥</em>경성. <em>지</em>청천은 <em>북</em>만주에서 <em>쌍</em>성보·<em>동</em>경성·<em>대</em>전자령. 이름 첫 글자로 묶으면 안 헷갈려."},
 {t:"pick",q:"영릉가 전투를 이끈 부대는?",c:["조선 혁명군","한국 독립군"],a:0,e:"양세봉의 조선 혁명군이야. 지청천의 한국 독립군은 쌍성보·동경성·대전자령."}
 ],
 quiz:[
 {q:"한중 연합 작전이 활발해진 계기는?",c:["만주 사변","중일 전쟁","청산리 대첩","미쓰야 협정"],a:0,e:"일본이 만주를 침략하자 중국 내 반감이 커졌어."},
 {q:"조선 혁명군의 총사령관은?",c:["양세봉","지청천","김좌진","홍범도"],a:0,e:"남만주에서 영릉가·흥경성 전투를 이끌었어."},
 {q:"대전자령 전투를 승리로 이끈 부대는?",c:["한국 독립군","조선 혁명군","북로 군정서","대한 독립군"],a:0,e:"지청천이 이끄는 한국 독립군이야."},
 {q:"동북 항일 연군 소속 한인들이 민족주의자와 함께 만든 조직은?",c:["조국 광복회","조선 혁명당","한국 독립당","신간회"],a:0,e:"1936년에 조직됐어."}
 ]},

{id:"L21",u:"s9",part:"다른 방식으로 싸우다",title:"폭탄에 담은 뜻",sc:"bomb",
 hook:"3·1 운동 뒤에도 일제는 꿈쩍하지 않았어. 그러자 몇몇은 생각했어. 적의 심장부를 직접 치면 어떨까? 폭탄 한 발로 온 민족의 뜻을 보여 주려던 사람들, 의열단 이야기야.",
 cards:[
 {t:"story",h:"외교도 준비도 믿을 수 없다면",b:"파리 강화 회의에 기대를 걸었지만 성과가 없었어. 실력을 기르자는 쪽은 시간이 너무 걸린다고 봤고. 그래서 <b>침략의 원흉을 직접 처단하고 식민 통치 기관을 부수자</b>는 흐름이 생겨. 이걸 <b>의열 투쟁</b>이라고 해."},
 {t:"fact",y:1919,n:"강우규의 의거",b:"1919년 가을, 60대의 <b>강우규</b>가 경성 <b>남대문역</b>에서 새로 부임하는 총독에게 폭탄을 던졌어. 이건 어떤 단체의 거사가 아니라 <b>개인 의열 투쟁</b>이야.",
  why:"3·1 운동을 짓밟은 통치의 책임자를 겨냥했어.",
  so:"총독은 무사했지만 수십 명이 다쳤고, 강우규는 사형을 선고받았어. 한 사람의 결단이 얼마나 큰 울림을 주는지 보여 준 사건이야."},
 {t:"fact",y:1919,n:"의열단",b:"1919년 11월 <b>김원봉</b>·윤세주 등이 만주 <b>지린</b>에서 비밀 조직을 만들었어. 이름은 '정의로운 일을 맹렬히 실행한다'는 뜻. 다섯 가지 파괴 대상과 일곱 가지 암살 대상을 정해 두었지.",
  why:"감시와 탄압을 피하려고 비밀 조직으로 움직였어.",
  so:"조선 총독부·동양 척식 주식회사·경찰서 같은 식민 통치 기관, 그리고 총독·고관·친일파·밀정이 표적이 됐어."},
 {t:"fact",y:1921,n:"김익상의 의거",b:"의열단원 <b>김익상</b>이 국내로 몰래 들어와 식민 통치의 심장인 <b>조선 총독부</b>에 폭탄을 던졌어.",
  why:"식민 지배의 최고 기관을 직접 치겠다는 뜻이었어.",
  so:"일제의 간담을 서늘하게 만들고, 독립 의지가 꺾이지 않았다는 걸 널리 알렸어."},
 {t:"fact",y:1923,n:"조선 혁명 선언",b:"김원봉의 부탁으로 <b>신채호</b>가 쓴 글이야. '외교'와 '준비'라는 헛된 꿈을 버리고 <b>민중 직접 혁명</b>으로 강도 일본을 몰아내자고 했어.",
  why:"외교론과 실력 양성론으로는 독립이 안 된다고 봤거든.",
  so:"이 선언이 의열단의 <b>활동 지침</b>이 됐어. 시험에 '다음 선언을 지침으로 삼은 단체'가 나오면 답은 의열단이야."},
 {t:"fact",y:1923,n:"김상옥의 의거",b:"의열단원 <b>김상옥</b>이 독립운동가를 잡아들이던 <b>종로 경찰서</b>에 폭탄을 던졌어.",
  why:"독립운동 탄압의 최전선이 경찰서였기 때문이야.",
  so:"독립운동가를 잡아 가두던 곳을 직접 쳤다는 점에서 상징성이 컸어."},
 {t:"fact",y:1926,n:"나석주의 의거",b:"의열단원 <b>나석주</b>가 토지 수탈의 앞잡이였던 <b>동양 척식 주식회사</b>에 폭탄을 던지고 권총을 쏘아 일본인들을 살상했어.",
  why:"동척은 토지 조사 사업 이후 땅을 빼앗아 가던 대표적 수탈 기관이었어.",
  so:"신문이 '근래 전례 없는 중대 사건'이라고 보도할 만큼 큰 충격을 줬어."},
 {t:"check",q:"의열단의 활동 지침이 된 글과 그 글을 쓴 사람은?",a:"조선 혁명 선언 — 신채호",hint:"'민중 직접 혁명'을 외친 글이야"},
 {t:"chain",title:"의열단이 겨눈 곳",items:["<b>김익상</b> → 조선 총독부 (1921)","<b>김상옥</b> → 종로 경찰서 (1923)","<b>나석주</b> → 동양 척식 주식회사 (1926)","(개인 의거) <b>강우규</b> → 남대문역의 새 총독 (1919)"]},
 {t:"hint",k:"익-총 · 상-종 · 석-동",b:"김<em>익</em>상은 <em>총</em>독부, 김<em>상</em>옥은 <em>종</em>로 경찰서, 나<em>석</em>주는 <em>동</em>척. 강우규는 의열단이 아니라는 것도 같이 외워 두자."},
 {t:"pick",q:"동양 척식 주식회사에 폭탄을 던진 의열단원은?",c:["나석주","김상옥"],a:0,e:"나석주야(1926). 김상옥은 종로 경찰서."},
 {t:"fact",pr:9,y:1920,n:"박재혁·최수봉의 의거",b:"결성 이듬해인 1920년, 의열단원 <b>박재혁</b>은 <b>부산 경찰서</b>에, <b>최수봉</b>은 <b>밀양 경찰서</b>에 폭탄을 던졌어.",why:"의열단은 경찰서 같은 식민 통치 기관을 파괴 대상으로 정해 두었어.",so:"프린트 표의 의열단 의거는 모두 여섯 — 박재혁·최수봉(1920), 김익상(1921), 김상옥(1923), 김지섭(1924), 나석주(1926)."},
 {t:"fact",pr:9,y:1924,n:"김지섭의 의거",b:"의열단원 <b>김지섭</b>이 일본 도쿄의 <b>일본 왕궁</b>에 폭탄을 던졌어.",why:"국내를 넘어 일본의 한복판까지 겨눈 거야.",so:"이봉창(1932, 도쿄, 일왕의 마차)과 헷갈리기 쉬워. 김지섭은 <b>의열단</b>, 이봉창은 <b>한인 애국단</b>."},
 {t:"fact",pr:9,y:1928,n:"조명하의 의거",b:"<b>조명하</b>가 <b>타이완</b>(타이중)에서 <b>일본 왕족</b>을 처단했어. 강우규처럼 단체가 아닌 <b>개인 의열 투쟁</b>이야.",why:"식민지 타이완까지 건너가 일본 왕족을 겨눴어.",so:"프린트는 강우규(1919)와 조명하(1928)를 '개인 의열 투쟁'으로 따로 묶어 뒀어. 의열단원 사이에 섞어 내는 함정에 주의!"},
 {t:"chain",pr:9,title:"프린트 표로 다시 보는 의열 투쟁",items:["<b>의열단</b>(1919) — 만주, 김원봉. 지침은 신채호의 「조선 혁명 선언」(민중 직접 혁명)","→ <b>소수 인원, 적은 비용</b>으로 암살·파괴 활동","→ 박재혁 부산 경찰서 · 최수봉 밀양 경찰서 (1920)","→ 김익상 조선 총독부 (1921) · 김상옥 종로 경찰서 (1923)","→ 김지섭 일본 왕궁 (1924) · 나석주 동양 척식 주식회사 (1926)","→ <b>개인 폭력 투쟁의 한계</b> → 황푸 군관 학교 · 조선 혁명 간부 학교","따로: 개인 의열 투쟁 — 강우규(1919, 총독 마차) · 조명하(1928, 타이완)"]},
 {t:"hint",pr:9,k:"부-박 · 밀-최 · 왕-지섭",b:"<em>부</em>산은 <em>박</em>재혁, <em>밀</em>양은 <em>최</em>수봉 — 둘 다 1920. 일본 <em>왕</em>궁은 김<em>지섭</em>(1924). 앞에서 외운 '익-총 · 상-종 · 석-동'과 합치면 의열단 여섯 명 끝."},
 {t:"pick",pr:9,q:"타이완에서 일본 왕족을 처단한 인물은?",c:["조명하","김지섭"],a:0,e:"조명하(1928)야. 김지섭은 일본 왕궁에 폭탄을 던진 의열단원(1924)."}

{id:"L22",u:"s9",part:"다른 방식으로 싸우다",title:"김구의 마지막 카드",sc:"flag",
 hook:"1920년대 후반, 임시 정부는 거의 멈춰 서 있었어. 돈도 사람도 없었지. 그때 김구가 꺼낸 카드가 한인 애국단이야. 그리고 한 청년이 던진 폭탄이 중국 전체를 움직여.",
 cards:[
 {t:"story",h:"개인의 폭탄에서 조직의 군대로",b:"의열단은 폭탄을 던질수록 한계도 느꼈어. 한 사람이 희생해도 일제는 무너지지 않았거든. 그래서 방향을 바꿔 <b>정규 군사 훈련</b>을 받기로 해. 한편 상하이의 임시 정부는 <b>국민 대표 회의</b>가 깨진 뒤 침체에 빠져 있었어."},
 {t:"fact",y:1926,n:"황푸 군관 학교 입교",b:"1920년대 후반 의열단원들이 중국 국민당 정부가 운영하던 <b>황푸 군관 학교</b>에 들어가 정규 군사 훈련을 받았어.",
  why:"<b>개인 의열 투쟁</b>의 한계를 느끼고 조직적인 무장 투쟁으로 가려 했거든.",
  so:"의열단이 테러 조직에서 군사 조직으로 바뀌어 가는 출발점이야."},
 {t:"fact",y:1931,n:"한인 애국단",b:"국민 대표 회의 결렬 뒤 침체한 임시 정부에 활기를 불어넣으려고 <b>김구</b>가 조직했어. 만주 사변으로 독립운동 형편이 더 나빠진 때였지.",
  why:"큰 거사로 임시 정부의 존재를 세계에 다시 알려야 했어.",
  so:"이봉창과 윤봉길이 이 단체의 이름으로 거사에 나서."},
 {t:"fact",y:1932,n:"이봉창의 의거",b:"1932년 1월 한인 애국단의 첫 거사. <b>이봉창</b>이 <b>도쿄</b>에서 일왕의 마차를 향해 폭탄을 던졌어.",
  why:"일본의 한가운데서 일왕을 노린 거야.",
  so:"거사는 실패했지만 일본에 큰 충격을 줬어."},
 {t:"fact",y:1932,n:"상하이 사변",b:"일제가 이봉창 의거를 보도한 <b>중국 언론</b>의 반일적 태도 등을 구실로 상하이를 침략했어.",
  why:"만주 침략에 쏠린 세계의 눈을 돌리려는 속셈도 있었어.",
  so:"상하이를 점령한 일본군이 승리 기념식을 열게 되고, 그 자리가 윤봉길 의거의 무대가 돼."},
 {t:"fact",y:1932,n:"윤봉길의 의거",b:"1932년 4월 <b>윤봉길</b>이 상하이 <b>훙커우 공원</b>의 전승 기념식 겸 일왕 생일 축하식 단상에 폭탄을 던져 일본군 장성과 고관을 처단했어.",
  why:"상하이 사변의 승리를 자축하는 자리였어.",
  so:"<b>중국 국민당 정부가 한국 독립운동을 적극 지원</b>하는 계기가 됐고, 한중 공동 항일 전선의 바탕이 됐어."},
 {t:"fact",y:1932,n:"조선 혁명 간부 학교",b:"의열단이 중국 국민당 정부의 지원을 받아 세운 학교로, 독립군 간부를 길러 냈어.",

 {t:"pick",q:"한인 애국단을 조직한 사람은?",c:["김구","김원봉"],a:0,e:"김구야. 김원봉은 의열단."},
 {t:"check",pr:9,q:"만주를 침략한 일제가 이봉창 의거를 보도한 중국 언론의 반일적 태도를 구실로 일으킨 것은 만주 사변이다 — ○일까 ×일까?",a:"× — 상하이 사변(1932)이야. 만주 사변(1931)은 이미 일어난 뒤였어.",hint:"이봉창 → ○○ 사변 → 윤봉길"}

{id:"L23",u:"s10",part:"힘을 기르자",title:"힘부터 기르자",sc:"factory",
 hook:"독립은 당장 어렵다. 그렇다면 그날을 위해 경제와 교육부터 키우자. 1920년대 국내에서는 이런 생각이 퍼졌어. 쌀 대신 국산품, 총 대신 대학. 그리고 한쪽은 아예 일제와 타협하는 길로 빠지기도 해.",
 cards:[
 {t:"story",h:"외교가 막히자 나온 생각",b:"워싱턴 회의에서도 한국 문제는 다뤄지지 않았어. '당분간 독립은 어려우니 교육과 산업과 문화에 힘써 <b>실력을 길러야 한다</b>'는 주장이 퍼졌지. 이게 <b>실력 양성 운동</b>이야."},
 {t:"fact",y:1920,n:"물산 장려 운동",b:"<b>조만식</b>의 주도로 평양에서 시작해 전국으로 퍼졌어. '<b>내 살림 내 것으로</b>', '<b>조선 사람 조선 것</b>'을 외치며 토산품 애용, 근검저축, 금주·단연을 주장했지.",
  why:"조선 총독부가 한국과 일본 사이의 관세를 없애려 하자, 값싼 일본 상품에 민족 산업이 무너질까 봐 위기를 느꼈어.",
  so:"처음엔 큰 호응을 얻어 토산품 애용 의식을 심어 줬어."},
 {t:"fact",y:1923,n:"물산 장려 운동에 대한 비판",b:"수요는 느는데 공급이 따라가지 못하고 상인의 농간까지 겹쳐 <b>토산품 값이 폭등</b>했어. 일부 <b>사회주의자</b>는 자본가 계급의 이익만 챙기는 운동이라고 비판했지.",
  why:"노동자는 원래부터 무명옷 입고 살았는데 이제 와서 국산품을 쓰자는 건 자본가만 좋은 일이라는 거야.",
  so:"물산 장려 운동은 기대만큼 성과를 거두지 못했어."},
 {t:"fact",y:1923,n:"민립 대학 설립 운동",b:"<b>이상재</b>·이승훈 등이 <b>조선 민립 대학 기성회</b>를 만들고 1천만 원을 모으려 전국 모금 운동을 벌였어. 한국인의 손으로 대학을 세우자는 거였지.",
  why:"'문화 정치'라면서도 한국인에게 고등 교육의 기회는 거의 없었어.",
  so:"자연재해로 모금이 저조했고 일제가 <b>정치 운동</b>이라며 탄압해서 성과를 거두지 못했어."},
 {t:"compare",title:"산업이냐 교육이냐",l:{n:"물산 장려 운동",p:["<b>조만식</b> · 평양","토산품 애용·근검저축·금주·단연","계기: 관세 철폐 움직임","한계: 값 폭등, 사회주의자 비판"]},
  r:{n:"민립 대학 설립 운동",p:["<b>이상재</b> · 조선 민립 대학 기성회","'교육이 아니면 아니 된다'","1천만 원 모금","한계: 자연재해, 일제의 탄압"]}},
 {t:"fact",y:1929,n:"문자 보급 운동",b:"<b>『조선일보』</b>가 '<b>아는 것이 힘, 배워야 산다</b>'를 구호로 한글 교재를 나눠 주고 전국 순회강연을 열었어.",
  why:"수탈 속에서 농민은 가난했고 배울 기회도 없었어. 글을 모르면 속기 쉬웠지.",
  so:"언론이 앞장선 <b>농촌 계몽 운동</b>의 한 줄기야."},
 {t:"fact",y:1931,n:"브나로드 운동",b:"<b>『동아일보』</b>가 벌인 농촌 계몽 운동. 브나로드는 러시아어로 '<b>민중 속으로</b>'라는 뜻이야. 학생과 청년이 농촌에 가서 글을 가르치고 미신 타파와 근검절약을 강조했어.",
  why:"방학마다 학생들을 농촌으로 보내 문맹을 없애려 했어.",
  so:"문자 보급 운동과 함께 문맹 퇴치에 큰 역할을 했어."},
 {t:"fact",y:1924,n:"자치 운동",b:"실력 양성 운동이 성과를 못 내자 <b>이광수</b>·최린·김성수 등이 일제의 지배를 <b>인정하고</b> 그 안에서 자치권과 참정권을 얻자고 나섰어.",
  why:"'문화 정치'에 기대를 걸고 조선 의회를 세울 수 있다고 봤어.",

 {t:"check",q:"브나로드 운동을 벌인 신문사는?",a:"동아일보",hint:"조선일보는 문자 보급 운동이야"},

{id:"L24",u:"s11",part:"힘을 기르자",title:"소작료와 총파업",sc:"field",
 hook:"수확의 절반이 넘게 지주에게 가고, 일본인의 절반도 안 되는 임금을 받던 사람들. 농민과 노동자는 살기 위해 싸우기 시작했어. 그런데 그 싸움이 점점 항일 투쟁으로 바뀌어 가.",
 cards:[
 {t:"story",h:"생존권이 흔들리다",b:"토지 조사 사업과 산미 증식 계획으로 많은 농민이 소작농이 됐어. 소작료는 수확의 <b>50%가 넘었고</b> 지주가 낼 세금까지 떠안았지. 노동자는 일본인 노동자의 <b>절반도 안 되는 임금</b>을 받으며 오래 일하고 차별까지 당했어."},
 {t:"fact",y:1923,n:"암태도 소작 쟁의",b:"전남 암태도의 농민들이 70~80%의 소작료를 요구하는 <b>지주</b>에 맞서 1년여를 싸웠어. 목포 법원까지 건너가 투쟁한 끝에 <b>소작료 인하</b>를 따냈지.",
  why:"고율의 소작료가 농민의 삶을 짓누르고 있었어.",
  so:"1920년대 소작 쟁의의 대표 사례가 돼."},
 {t:"fact",y:1927,n:"조선 농민 총동맹",b:"사회주의 운동의 영향으로 농민 조합이 활발히 만들어지면서 결성된 <b>전국적 농민 운동 단체</b>야.",
  why:"흩어진 농민 조합을 하나로 묶어 힘을 키우려 했어.",
  so:"1920년대 후반 소작 쟁의 건수와 참여 농민이 크게 늘어."},
 {t:"fact",y:1927,n:"조선 노동 총동맹",b:"노동 쟁의가 크게 늘어나면서 만들어진 <b>전국 규모의 노동 운동 단체</b>야. 노동자들은 임금 인상, 노동 시간 단축, 작업 환경 개선을 요구했어.",
  why:"사회주의 사상이 퍼지며 노동자의 계급 의식과 민족의식이 함께 높아졌어.",
  so:"쟁의가 격렬해질수록 경찰 탄압도 세졌고, 노동 쟁의는 점점 <b>항일 투쟁</b>으로 바뀌어 갔어."},
 {t:"fact",y:1929,n:"원산 총파업",b:"원산의 석유 회사에서 일본인 감독이 한국인 노동자를 <b>구타</b>한 일이 계기였어. 회사가 약속을 어기자 원산 노동자 전체가 총파업에 들어가 <b>4개월여</b> 버텼지.",
  why:"감독 파면과 근무 조건 개선이라는 요구를 회사가 무시하고 탄압했어.",
  so:"국내외 노동 단체가 전보와 돈을 보내 지원했어. 일제 강점기 <b>최대 규모의 노동 운동</b>이자 반제국주의 항일 운동이야."},
 {t:"compare",title:"농민의 싸움 vs 노동자의 싸움",l:{n:"암태도 소작 쟁의 (1923)",p:["<b>농민</b>","고율 소작료를 요구하는 <b>지주</b>에 맞섬","1년여 투쟁","결과: 소작료 인하"]},
  r:{n:"원산 총파업 (1929)",p:["<b>노동자</b>","일본인 감독의 <b>구타</b>가 계기","4개월여 지속, 국내외 지원","일제 강점기 최대 노동 운동"]}},
 {t:"fact",y:1931,n:"혁명적 농민·노동 조합",b:"1930년대 <b>대공황</b>으로 삶이 더 어려워지자 농민과 노동자가 사회주의 세력과 손잡고 <b>혁명적 농민 조합·혁명적 노동조합</b>을 만들었어. '토지를 농민에게!', '일본 제국주의 타도!'를 외쳤지.",
  why:"합법적인 쟁의로는 아무것도 바뀌지 않는다고 봤어.",
  so:"쟁의는 <b>비합법적 폭력 투쟁</b>으로 바뀌었어. 하지만 중일 전쟁 뒤 일제의 강력한 탄압으로 위축돼."},
 {t:"check",q:"1920년대와 1930년대 농민·노동 운동은 어떻게 달라졌나?",a:"생존권 투쟁에서 비합법적 반제국주의 항일 투쟁으로 급진화했다.",hint:"대공황 뒤에 '혁명적'이란 말이 붙었어"},
 {t:"chain",title:"농민·노동 운동의 흐름",items:["생존권 위협 (고율 소작료 · 저임금)","→ 1920년대: 소작 쟁의(<b>암태도</b>) · 노동 쟁의","→ 1927 조선 농민 총동맹 · 조선 노동 총동맹","→ 1929 <b>원산 총파업</b> — 항일 투쟁으로","→ 1930년대: 대공황 → <b>혁명적</b> 조합, 비합법 투쟁","→ 중일 전쟁 뒤 탄압으로 위축"]},
 {t:"hint",k:"암-농-소작료 · 원-노-총파업",b:"<em>암</em>태도는 <em>농</em>민이 소작료로, <em>원</em>산은 <em>노</em>동자가 총파업으로. '암농 원노'로 붙여 외우자."},
 {t:"pick",q:"일제 강점기 최대 규모의 노동 운동은?",c:["원산 총파업","암태도 소작 쟁의"],a:0,e:"1929년, 4개월여 이어졌어."},
 {t:"check",pr:11,q:"소작농이 지주 대신 떠안은 비용에는 무엇이 있었을까? 그리고 소작 쟁의에서는 무엇을 요구했을까?",a:"지세, 수리 조합비, 종자·비료 대금 등을 떠안았어. 그래서 소작료 인하와 소작권 이동 반대를 요구했지.",hint:"세금 · 물 · 씨앗과 거름"},
 {t:"check",pr:11,q:"1930년대 농민·노동 운동은 생존권 투쟁 형태로 확산되었다 — ○일까 ×일까?",a:"× — 생존권 투쟁은 1920년대. 1930년대엔 혁명적 조합을 중심으로 반제국주의 항일 투쟁이 됐어.",hint:"20년대 → 30년대로 어떻게 바뀌었지?"}

{id:"L25",u:"s12",part:"다시 만세를",title:"교실에서 거리로",sc:"school",
 hook:"'일본의 우월함만 가르치고 조선인은 반드시 망한다고 말하는 교사.' 1920년대 학생들은 이런 교실을 거부했어. 동맹 휴학으로 시작한 싸움이 두 번의 큰 만세 운동으로 번져.",
 cards:[
 {t:"story",h:"학교가 곧 억압이었다",b:"3·1 운동에서 스스로가 항일 투쟁의 주체라는 걸 깨달은 청년과 학생들은 단체를 만들어 움직였어. 학생들은 식민지 교육에 맞서 <b>동맹 휴학</b>을 벌였고, 등교 거부·수업 거부가 점점 거리 시위로 커졌지."},
 {t:"fact",y:1924,n:"조선 청년 총동맹",b:"여러 청년 단체의 활동을 <b>통일적</b>으로 이끌려고 결성된 조직이야.",
  why:"청년 단체들이 덕·체·지의 수양, 민중 계몽, 계급 해방 등 제각각 활동하고 있었어.",
  so:"청년·학생 운동이 한층 조직적으로 움직이는 바탕이 됐어."},
 {t:"fact",y:1926,n:"6·10 만세 운동",b:"마지막 황제 <b>순종</b>이 세상을 떠나자 사회주의 계열(조선 공산당)과 천도교, 학생 단체가 만세 시위를 준비했어. 계획이 미리 들켰지만 학생들은 <b>장례일인 6월 10일</b> 서울 곳곳에서 격문을 뿌리고 만세를 외쳤지.",
  why:"3·1 운동이 고종의 장례를 계기로 일어난 것처럼, 순종의 장례가 다시 기회가 됐어.",
  so:"전국으로 크게 퍼지진 못했지만, 준비 과정에서 <b>사회주의 계열과 민족주의 계열이 손잡은 경험</b>이 민족 협동 전선(신간회)의 공감대를 만들었어."},
 {t:"fact",y:1926,n:"성진회",b:"1926년 광주에서 학생들이 만든 비밀 결사야. 곧 해산됐지만 참여 학생들이 학교마다 비밀리에 <b>독서회</b>를 만들어 이어 갔어.",
  why:"드러내 놓고 활동하면 바로 잡혀갔으니까.",
  so:"이 독서회 조직이 광주 학생 항일 운동을 확산시키는 통로가 돼."},
 {t:"fact",y:1929,n:"광주 학생 항일 운동",b:"1929년 10월 <b>나주역</b>에서 일본인 남학생이 한국인 여학생을 희롱해 한·일 학생 사이에 충돌이 일어났어. 경찰과 언론이 일본인 학생 편만 들자 광주 학생들이 <b>11월 3일</b> 대규모 시위를 벌였지.",
  why:"민족 차별에 쌓였던 분노가 터진 거야.",
  so:"<b>신간회</b>가 진상을 알리면서 전국으로, 만주까지 번졌어. <b>3·1 운동 이후 최대 규모</b>의 항일 민족 운동이야."},
 {t:"compare",title:"두 번의 학생 만세",l:{n:"6·10 만세 운동 (1926)",p:["계기: <b>순종</b>의 장례","사회주의 계열 + 천도교 준비","사전 발각, 학생 중심 시위","의의: 좌우 연대 → 신간회로"]},

 {t:"check",q:"3·1 운동과 6·10 만세 운동의 계기를 각각 말해 봐.",a:"3·1 운동은 고종의 서거, 6·10 만세 운동은 순종의 장례.",hint:"두 황제의 장례야"},

{id:"L26",u:"s13",part:"다시 만세를",title:"좌우가 손잡다",sc:"twohand",
 hook:"새와 조개가 싸우는 사이 어부가 둘 다 잡아간다. 1920년대 신문 만평이야. 민족주의와 사회주의가 다투면 웃는 건 일제라는 거지. 그래서 둘이 손을 잡았어. 그게 신간회야.",
 cards:[
 {t:"story",h:"갈라진 두 진영",b:"3·1 운동 뒤 민족 운동은 <b>민족주의</b>와 <b>사회주의</b> 두 갈래로 나뉘어 방법과 이념을 두고 다퉜어. 게다가 민족주의 안에서도 자치 운동 같은 <b>타협</b> 세력이 나왔지. 이대로는 안 된다는 목소리가 커졌어."},
 {t:"fact",y:1924,n:"제1차 국공 합작",b:"중국의 <b>국민당과 공산당</b>이 손을 잡았어.",
  why:"이념이 달라도 공동의 적 앞에서는 힘을 합칠 수 있다는 걸 보여 줬어.",
  so:"국내외 <b>민족 유일당 운동</b>에 영향을 줬어. 국외에서는 베이징에서 한국 독립 유일당 촉성회가, 만주에서는 3부 통합 운동이 일어나."},
 {t:"fact",y:1926,n:"정우회 선언",b:"치안 유지법으로 탄압받던 <b>사회주의</b> 진영이 6·10 만세 운동 뒤 '민족주의 세력과 적극 제휴하자'고 선언했어.",
  why:"민족주의자와 손잡으면 <b>합법적</b>으로 활동할 공간이 생겼거든.",
  so:"이상재·안재홍 같은 <b>비타협적</b> 민족주의자와 연대할 길이 열렸어."},
 {t:"fact",y:1927,n:"신간회",b:"비타협적 민족주의자와 사회주의자가 함께 만든 <b>합법</b> 단체야. 2년여 만에 약 <b>140개</b> 지회, 4만여 명 회원을 둔 일제 강점기 <b>최대 규모</b>의 항일 단체가 됐어. 강령은 '<b>기회주의를 일체 부인함</b>'.",
  why:"'기회주의'란 일제와 타협하는 자치 운동을 가리켜.",
  so:"강연회를 열고 한국인 본위 교육, 착취 기관 철폐를 주장하며 소작·노동 쟁의와 동맹 휴학을 지원했어."},
 {t:"fact",y:1929,n:"신간회의 진상 조사단 파견",b:"광주 학생 항일 운동이 일어나자 신간회가 진상 조사단을 보내고 대규모 <b>민중 대회</b>를 준비했어.",
  why:"일제가 보도를 막고 학생들을 구속하고 있었어.",
  so:"민중 대회는 열리지 못했고 집행부 대부분이 구속되는 큰 타격을 입었어."},
 {t:"fact",y:1931,n:"신간회 해소",b:"새 집행부가 타협론자와 손잡으려는 태도를 보이고, 국제 공산주의 운동도 민족주의와의 협력을 부정하는 쪽으로 바뀌었어. 결국 사회주의자들이 <b>전체 대회</b>를 열어 해소를 결정했지.",
  why:"'해소'는 없애는 게 아니라 다른 운동으로 바꾼다는 뜻으로 썼어.",
  so:"좌우 연대가 무너졌어. 사회주의 계열은 혁명적 농민·노동 조합으로, 비타협적 민족주의 계열은 문화·학술 활동으로 갔어."},
 {t:"compare",title:"이름이 비슷한 두 단체",l:{n:"신민회 (1907)",p:["안창호·양기탁","<b>비밀 결사</b>","국외 독립운동 기지","105인 사건으로 해체"]},
  r:{n:"신간회 (1927)",p:["좌우 합작","<b>합법</b> 단체, 최대 규모","광주 학생 운동 진상 조사단","1931 스스로 해소"]}},

 {t:"chain",title:"신간회가 생기고 사라지기까지",items:["좌우 대립 + 타협 세력 등장","→ 제1차 국공 합작(1924)의 영향","→ 6·10 만세 운동의 연대 경험","→ <b>정우회 선언</b>(1926)","→ <b>신간회</b> 창립(1927) · 자매 단체 근우회","→ 광주 학생 운동 지원(1929) → 탄압","→ <b>해소</b>(1931)"]},

 {t:"pick",q:"정우회 선언을 발표한 쪽은?",c:["사회주의 진영","민족주의 진영"],a:0,e:"사회주의 진영이 민족주의와 손잡자고 했어."},
 {t:"check",pr:12,q:"신간회의 해소로 비타협적 민족주의 진영과 사회주의 진영의 연대가 강화되었다 — ○일까 ×일까?",a:"× — 해소로 좌우 연대는 무너졌어.",hint:"해소 뒤 두 진영은 각자 어디로 갔지?"}
 ],

{id:"L27",u:"s14",part:"달라진 세상",title:"경성의 두 얼굴",sc:"city",
 hook:"전차가 다니고 백화점이 들어선 경성. 그런데 그 편리함은 누구 것이었을까? 같은 도시 안에 일본인 거리와 한국인 거리가 따로 있었고, 변두리엔 움막이 늘어섰어. 나라 밖으로 떠난 사람들은 더 큰 고난을 겪었지.",
 cards:[
 {t:"story",h:"식민지 도시화",b:"철도역이 생긴 <b>대전·신의주</b>, 일본으로 쌀을 실어 내던 항구 <b>군산·목포</b>, 공업화 정책으로 커진 <b>함흥·청진</b>. 도시가 이렇게 자랐어. 하지만 도시 안은 <b>한국인 거주지와 일본인 거주지로 나뉘었고</b>, 수도·전기·도로는 일본인 쪽에 몰렸지. 비용은 한국인이 내고 편리함은 일본인이 누렸어."},
 {t:"fact",y:1924,n:"「운수 좋은 날」",b:"현진건의 소설이야. <b>인력거꾼</b> 김 첨지가 모처럼 돈을 벌어 설렁탕을 사 왔지만 아픈 아내는 이미 숨진 뒤였어.",
  why:"인력거꾼의 한 달 수입이 네 식구 최소 생활비에도 못 미쳤대.",
  so:"비싼 물가와 주택난에 시달린 가난한 도시민의 모습을 보여 줘. 도시 곳곳엔 극빈자의 <b>토막촌</b>이 생겼고, 종종 강제로 철거됐어."},
 {t:"fact",y:1926,n:"영화 「아리랑」",b:"<b>나운규</b>가 각본·주연·감독을 맡아 크게 흥행했어. 흑백 무성 영화라 장면을 풀어 주는 <b>변사</b>가 배우만큼 인기였지.",
  why:"1920~1930년대 신문·잡지·영화·라디오로 대중문화가 퍼졌어.",
  so:"하지만 영화는 일제의 검열로 잘리기도 했고 정책 선전에 쓰이기도 했어. 서양식 옷을 입은 '모던 걸·모던 보이'도 이때 등장해."},
 {t:"fact",y:1932,n:"농촌 진흥 운동",b:"대공황으로 농민이 몰락하고 소작 쟁의가 격해지자 일제가 '생활 개선'을 내세워 벌인 운동이야.",
  why:"농민의 불만이 항일 투쟁으로 번지는 걸 막으려 했어.",
  so:"근본 문제는 그대로 두고 농촌 <b>통제</b>를 강화했어. 가난의 책임을 농민에게 돌리며 절약·저축·근면만 강조했지.",tk:"rule"},
 {t:"check",q:"일제 강점기 농민이 몰락해 된 사람들을 세 가지 말해 봐.",a:"소작농, 화전민, 도시 빈민인 토막민 (만주·연해주·일본으로 이주하기도 함)",hint:"산으로, 도시로, 나라 밖으로"},
 {t:"fact",y:1923,n:"관동 대지진 한국인 학살",b:"도쿄 부근에 대지진이 일어나자 일본 당국과 언론이 '조선인이 불을 지른다'는 <b>유언비어</b>를 퍼뜨렸어. 일본인 자경단 등이 재일 한국인 <b>6,000명 이상</b>을 학살했지.",
  why:"지진으로 생긴 사회 불안을 한국인 탓으로 돌리려 했어.",
  so:"나라 잃은 사람들이 타국에서 겪은 고난을 가장 참혹하게 보여 주는 사건이야."},
 {t:"fact",y:1937,n:"연해주 한인 강제 이주",b:"<b>소련</b>이 연해주에 살던 한국인 수십만 명을 약 6,000km 떨어진 <b>중앙아시아</b>로 강제로 옮겼어. 추위와 굶주림, 전염병으로 많은 사람이 목숨을 잃었지.",
  why:"일본과 전쟁이 나면 한국인이 일본에 협력할 거라는 구실이었어.",
  so:"이들의 후손이 오늘날의 <b>고려인</b>이야. 가해자가 일본이 아니라 소련이라는 게 시험 포인트!",tk:"world"},
 {t:"chain",title:"국외 이주 동포의 세 가지 고난",items:["<b>간도</b> — 간도 참변(1920), 일본군의 한인 마을 초토화","<b>일본</b> — 관동 대지진 학살(1923), 유언비어","<b>중앙아시아</b> — 연해주 한인 강제 이주(1937), 소련"]},
 {t:"hint",k:"간-일군 · 관-유언비어 · 연-소련",b:"<em>간</em>도 참변은 <em>일</em>본군, <em>관</em>동 대지진은 <em>유언비어</em>, <em>연</em>해주 강제 이주는 <em>소련</em>. 가해자를 헷갈리게 내는 게 단골 함정이야."},
 {t:"pick",q:"연해주 한인을 중앙아시아로 강제 이주시킨 나라는?",c:["소련","일본"],a:0,e:"1937년 소련이야."},
 {t:"chain",pr:13,title:"의식주의 변화",items:["<b>의</b> — 서양식 옷차림과 단발이 늘었어","→ 중일 전쟁 뒤 일제가 남성에게 <b>국민복</b>, 여성에게 <b>몸뻬</b>를 강요","<b>식</b> — 양식 · 일식 · 중식이 대중화, 배달 음식(설렁탕 · 냉면)도 늘었어","<b>주</b> — <b>도시형 한옥</b>(벽돌 · 유리) · <b>문화 주택</b>(서양식 + 일본식, 비싸서 사기 어려움)"]},
 {t:"hint",pr:13,k:"축 · 레 · 라 → 대중가요",b:"<em>축</em>음기 · <em>레</em>코드 · <em>라</em>디오가 퍼지면서 <em>대중가요</em>가 인기를 끌었어. 영화는 나운규의 「아리랑」 — 하지만 일제의 검열을 받았고 정책 선전 수단으로도 쓰였지."},
 {t:"pick",pr:13,q:"중일 전쟁 이후 일제가 여성에게 입도록 강요한 작업복은?",c:["몸뻬","국민복"],a:0,e:"몸뻬야. 국민복은 남성에게 강요했어."}
